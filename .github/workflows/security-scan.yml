name: Security Scan

on:
  push:
    branches:
      - main
      - 'dev/pve-test'
      - 'dev/**'
  pull_request:
    branches:
      - main
      - 'dev/pve-test'
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Harbor image reference to scan (for example: 10.57.3.10/project/image:tag)"
        required: true
        type: string

jobs:
  # Phase 05 does not yet define a concrete build-image job in this workflow.
  # This job is executable now via workflow_dispatch with an explicit Harbor
  # image reference input and can be wired to needs: [build-image] in Phase 06.
  trivy-image-scan:
    name: Trivy image scan
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, pve-test, build]
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install Trivy CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run Trivy image scan
        env:
          TRIVY_USERNAME: ${{ secrets.HARBOR_ROBOT_USER }}
          TRIVY_PASSWORD: ${{ secrets.HARBOR_ROBOT_PASSWORD }}
        run: |
          trivy image \
            --username "$TRIVY_USERNAME" \
            --password "$TRIVY_PASSWORD" \
            --insecure \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --format sarif \
            --output trivy-image.sarif \
            "${{ github.event.inputs.image_ref }}"

      - name: Upload image SARIF
        uses: github/codeql-action/upload-sarif@5c8a8a642e79153f5d047b10ec1cba1d1cc65699 # v3
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: trivy-image.sarif

      - name: Generate SBOM (SPDX)
        env:
          SYFT_REGISTRY_INSECURE_USE_HTTP: "true"
          SYFT_REGISTRY_AUTH_AUTHORITY: "10.57.3.10"
          SYFT_REGISTRY_AUTH_USERNAME: ${{ secrets.HARBOR_ROBOT_USER }}
          SYFT_REGISTRY_AUTH_PASSWORD: ${{ secrets.HARBOR_ROBOT_PASSWORD }}
        run: |
          syft scan --from registry "${{ github.event.inputs.image_ref }}" \
            --output spdx-json=sbom.spdx.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 90

      - name: Resolve digest and signing policy
        id: sign_target
        env:
          IMAGE_REF: ${{ github.event.inputs.image_ref }}
          HARBOR_USER: ${{ secrets.HARBOR_ROBOT_USER }}
          HARBOR_PASS: ${{ secrets.HARBOR_ROBOT_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_REF" =~ ^10\.57\.3\.10\/ ]]; then
            echo "Security scan signing requires Harbor image refs (10.57.3.10/...)." >&2
            exit 1
          fi

          if [[ "$IMAGE_REF" == *@sha256:* ]]; then
            sign_ref="$IMAGE_REF"
          else
            registry="${IMAGE_REF%%/*}"
            repo_tag="${IMAGE_REF#*/}"
            repo="${repo_tag%:*}"
            tag="${repo_tag##*:}"

            manifest_url="http://${registry}/v2/${repo}/manifests/${tag}"
            manifest_accept='application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
            manifest_headers="$RUNNER_TEMP/cosign-manifest-headers.txt"
            digest=""

            manifest_status="$(curl -sS --connect-timeout 5 --max-time 20 -u "$HARBOR_USER:$HARBOR_PASS" -X HEAD -D "$manifest_headers" -o /dev/null -w '%{http_code}' \
              -H "Accept: ${manifest_accept}" \
              "$manifest_url" || true)"

            if [[ "$manifest_status" != "200" ]]; then
              manifest_status="$(curl -sS --connect-timeout 5 --max-time 20 -u "$HARBOR_USER:$HARBOR_PASS" -X GET -D "$manifest_headers" -o /dev/null -w '%{http_code}' \
                -H "Accept: ${manifest_accept}" \
                "$manifest_url" || true)"
            fi

            if [[ "$manifest_status" == "200" ]]; then
              digest="$(tr -d '\r' < "$manifest_headers" \
                | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}' \
                | tail -n 1)"
            fi

            if [[ -n "$digest" ]]; then
              sign_ref="${registry}/${repo}@${digest}"
            else
              # Some Harbor installs return 404 for manifest-by-tag lookups while
              # still allowing registry clients to pull the tag. Cosign can sign tags.
              echo "Digest lookup unavailable for $IMAGE_REF (HTTP ${manifest_status}); falling back to tag signing reference." >&2
              sign_ref="$IMAGE_REF"
            fi
          fi

          registry="${sign_ref%%/*}"
          repo_ref="${sign_ref#*/}"
          if [[ "$repo_ref" == *"@"* ]]; then
            repo="${repo_ref%@*}"
          else
            repo="${repo_ref%:*}"
          fi

          probe_url="http://${registry}/v2/${repo}/blobs/uploads/"
          probe_headers="$RUNNER_TEMP/cosign-sign-preflight-headers.txt"
          probe_status="$(curl -sS --connect-timeout 5 --max-time 20 -u "$HARBOR_USER:$HARBOR_PASS" -X POST -D "$probe_headers" -o /dev/null -w '%{http_code}' "$probe_url")"
          if [[ "$probe_status" != "202" ]]; then
            echo "Cosign push preflight failed for ${repo} (HTTP ${probe_status})." >&2
            echo "HARBOR_ROBOT_* must have push rights for this repository to store signature artifacts." >&2
            exit 1
          fi

          probe_location="$(awk 'BEGIN{IGNORECASE=1} /^Location:/{print $2}' "$probe_headers" | tr -d '\r')"
          if [[ -n "$probe_location" ]]; then
            if [[ "$probe_location" =~ ^https?:// ]]; then
              cancel_url="$probe_location"
            else
              cancel_url="http://${registry}${probe_location}"
            fi
            curl -sS --connect-timeout 5 --max-time 20 -u "$HARBOR_USER:$HARBOR_PASS" -X DELETE -o /dev/null "$cancel_url" || true
          fi

          echo "sign_ref=$sign_ref" >> "$GITHUB_OUTPUT"

      - name: Sign image
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
        run: |
          printf '%s' "$COSIGN_KEY" > /tmp/cosign.key
          chmod 600 /tmp/cosign.key
          cosign sign --yes --allow-http-registry --registry-username "${{ secrets.HARBOR_ROBOT_USER }}" --registry-password "${{ secrets.HARBOR_ROBOT_PASSWORD }}" --key /tmp/cosign.key "${{ steps.sign_target.outputs.sign_ref }}"
          rm -f /tmp/cosign.key

      - name: Verify signature
        run: |
          cosign verify --allow-http-registry --key certs/cosign.pub "${{ steps.sign_target.outputs.sign_ref }}"

  generate-sbom:
    if: ${{ false }}
    name: Generate SBOM
    runs-on: [self-hosted, pve-test, build]
    needs:
      - trivy-image-scan
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Generate SBOM (SPDX)
        env:
          SYFT_REGISTRY_INSECURE_USE_HTTP: "true"
          SYFT_REGISTRY_AUTH_AUTHORITY: "10.57.3.10"
          SYFT_REGISTRY_AUTH_USERNAME: ${{ secrets.HARBOR_ROBOT_USER }}
          SYFT_REGISTRY_AUTH_PASSWORD: ${{ secrets.HARBOR_ROBOT_PASSWORD }}
        run: |
          syft scan --from registry "${{ github.event.inputs.image_ref }}" \
            --output spdx-json=sbom.spdx.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 90

  sign-image:
    if: ${{ false }}
    name: Sign image with Cosign
    runs-on: [self-hosted, pve-test, build]
    needs:
      - trivy-image-scan
    outputs:
      sign_ref: ${{ steps.sign_target.outputs.sign_ref }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Resolve digest and signing policy
        id: sign_target
        env:
          IMAGE_REF: ${{ github.event.inputs.image_ref }}
          HARBOR_USER: ${{ secrets.HARBOR_ROBOT_USER }}
          HARBOR_PASS: ${{ secrets.HARBOR_ROBOT_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_REF" =~ ^10\.57\.3\.10\/ ]]; then
            echo "Security scan signing requires Harbor image refs (10.57.3.10/...)." >&2
            exit 1
          fi

          if [[ "$IMAGE_REF" == *@sha256:* ]]; then
            sign_ref="$IMAGE_REF"
          else
            registry="${IMAGE_REF%%/*}"
            repo_tag="${IMAGE_REF#*/}"
            repo="${repo_tag%:*}"
            tag="${repo_tag##*:}"

            manifest_url="http://${registry}/v2/${repo}/manifests/${tag}"
            manifest_accept='application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
            manifest_headers="$RUNNER_TEMP/cosign-manifest-headers.txt"
            digest=""

            manifest_status="$(curl -sS --connect-timeout 5 --max-time 20 -u "$HARBOR_USER:$HARBOR_PASS" -X HEAD -D "$manifest_headers" -o /dev/null -w '%{http_code}' \
              -H "Accept: ${manifest_accept}" \
              "$manifest_url" || true)"

            if [[ "$manifest_status" != "200" ]]; then
              manifest_status="$(curl -sS --connect-timeout 5 --max-time 20 -u "$HARBOR_USER:$HARBOR_PASS" -X GET -D "$manifest_headers" -o /dev/null -w '%{http_code}' \
                -H "Accept: ${manifest_accept}" \
                "$manifest_url" || true)"
            fi

            if [[ "$manifest_status" == "200" ]]; then
              digest="$(tr -d '\r' < "$manifest_headers" \
                | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}' \
                | tail -n 1)"
            fi

            if [[ -n "$digest" ]]; then
              sign_ref="${registry}/${repo}@${digest}"
            else
              # Some Harbor installs return 404 for manifest-by-tag lookups while
              # still allowing registry clients to pull the tag. Cosign can sign tags.
              echo "Digest lookup unavailable for $IMAGE_REF (HTTP ${manifest_status}); falling back to tag signing reference." >&2
              sign_ref="$IMAGE_REF"
            fi
          fi

          registry="${sign_ref%%/*}"
          repo_ref="${sign_ref#*/}"
          if [[ "$repo_ref" == *"@"* ]]; then
            repo="${repo_ref%@*}"
          else
            repo="${repo_ref%:*}"
          fi

          probe_url="http://${registry}/v2/${repo}/blobs/uploads/"
          probe_headers="$RUNNER_TEMP/cosign-sign-preflight-headers.txt"
          probe_status="$(curl -sS --connect-timeout 5 --max-time 20 -u "$HARBOR_USER:$HARBOR_PASS" -X POST -D "$probe_headers" -o /dev/null -w '%{http_code}' "$probe_url")"
          if [[ "$probe_status" != "202" ]]; then
            echo "Cosign push preflight failed for ${repo} (HTTP ${probe_status})." >&2
            echo "HARBOR_ROBOT_* must have push rights for this repository to store signature artifacts." >&2
            exit 1
          fi

          probe_location="$(awk 'BEGIN{IGNORECASE=1} /^Location:/{print $2}' "$probe_headers" | tr -d '\r')"
          if [[ -n "$probe_location" ]]; then
            if [[ "$probe_location" =~ ^https?:// ]]; then
              cancel_url="$probe_location"
            else
              cancel_url="http://${registry}${probe_location}"
            fi
            curl -sS --connect-timeout 5 --max-time 20 -u "$HARBOR_USER:$HARBOR_PASS" -X DELETE -o /dev/null "$cancel_url" || true
          fi

          echo "sign_ref=$sign_ref" >> "$GITHUB_OUTPUT"

      - name: Sign image
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
        run: |
          printf '%s' "$COSIGN_KEY" > /tmp/cosign.key
          chmod 600 /tmp/cosign.key
          cosign sign --yes --allow-http-registry --registry-username "${{ secrets.HARBOR_ROBOT_USER }}" --registry-password "${{ secrets.HARBOR_ROBOT_PASSWORD }}" --key /tmp/cosign.key "${{ steps.sign_target.outputs.sign_ref }}"
          rm -f /tmp/cosign.key

  verify-signature:
    if: ${{ false }}
    name: Verify signature
    runs-on: [self-hosted, pve-test, build]
    needs:
      - sign-image
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Verify signature
        run: |
          cosign verify --allow-http-registry --key certs/cosign.pub "${{ needs.sign-image.outputs.sign_ref }}"

  sast-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

    - name: Run Trivy vulnerability + IaC + secret scanner
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        scanners: 'vuln,secret,misconfig'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy SARIF results
      uses: github/codeql-action/upload-sarif@5c8a8a642e79153f5d047b10ec1cba1d1cc65699 # v3
      with:
        sarif_file: 'trivy-results.sarif'

  # Removed terraform-security job (tfsec build fails in CI due to Go toolchain)
  # IaC scanning is now consolidated into the `sast-scan` job via Trivy.

  snyk-iac:
    name: Snyk IaC scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Run Snyk IaC scan
        uses: snyk/actions/iac@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          file: terraform/
          args: --severity-threshold=high --report

      - name: Upload Snyk results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@5c8a8a642e79153f5d047b10ec1cba1d1cc65699 # v3
        if: always() && hashFiles('snyk.sarif') != ''
        with:
          sarif_file: snyk.sarif

  trufflehog:
    name: TruffleHog secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@47e7b7cd74f578e1e3145d48f669f22fd1330ca6 # v3.94.3
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@383f7e52eae3ab0510c3cb0e7d9d150bbaeab838 # v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}
