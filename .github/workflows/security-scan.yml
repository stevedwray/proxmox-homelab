name: Security Scan

on:
  push:
    branches:
      - main
      - 'dev/pve-test'
      - 'dev/**'
  pull_request:
    branches:
      - main
      - 'dev/pve-test'

jobs:
  sast-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability + IaC + secret scanner
      uses: aquasecurity/trivy-action@v0.34.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        scanners: 'vuln,secret,misconfig'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy SARIF results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  # Removed terraform-security job (tfsec build fails in CI due to Go toolchain)
  # IaC scanning is now consolidated into the `sast-scan` job via Trivy.
