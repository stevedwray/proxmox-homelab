name: Security Scan

on:
  push:
    branches:
      - main
      - 'dev/pve-test'
      - 'dev/**'
  pull_request:
    branches:
      - main
      - 'dev/pve-test'
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Harbor image reference to scan (for example: 10.57.3.10/project/image:tag)"
        required: false
        type: string
      source_ref:
        description: "Optional upstream image to mirror into Harbor when image_ref is empty"
        required: false
        default: "docker.io/library/alpine:3.20"
        type: string
      target_project:
        description: "Harbor project for auto-built workflow_dispatch image"
        required: false
        default: "library"
        type: string
      target_image:
        description: "Harbor image path for auto-built workflow_dispatch image"
        required: false
        default: "phase05-signing-proof"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build image for scan
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.image_ref == '' }}
    runs-on: [self-hosted, pve-test, build]
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
      digest_ref: ${{ steps.meta.outputs.digest_ref }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Build and push image
        id: meta
        env:
          HARBOR_USER: ${{ secrets.HARBOR_ROBOT_USER }}
          HARBOR_PASS: ${{ secrets.HARBOR_ROBOT_PASSWORD }}
          SOURCE_REF: ${{ github.event.inputs.source_ref || 'docker.io/library/alpine:3.20' }}
          TARGET_PROJECT: ${{ github.event.inputs.target_project || 'library' }}
          TARGET_IMAGE: ${{ github.event.inputs.target_image || 'phase05-signing-proof' }}
        run: |
          set -euo pipefail

          IMAGE_REF="10.57.3.10/${TARGET_PROJECT}/${TARGET_IMAGE}:${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          CRANE_VERSION="v0.20.6"
          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" crane
          chmod +x "$RUNNER_TEMP/crane"

          AUTH_B64="$(printf '%s:%s' "$HARBOR_USER" "$HARBOR_PASS" | base64 -w0)"
          mkdir -p "$HOME/.docker"
          cat > "$HOME/.docker/config.json" <<EOF
          {"auths":{"10.57.3.10":{"auth":"${AUTH_B64}"}}}
          EOF

          "$RUNNER_TEMP/crane" copy --insecure "$SOURCE_REF" "$IMAGE_REF"
          DIGEST="$($RUNNER_TEMP/crane digest --insecure "$IMAGE_REF")"
          DIGEST_REF="10.57.3.10/${TARGET_PROJECT}/${TARGET_IMAGE}@${DIGEST}"

          if [[ -z "$DIGEST" || -z "$DIGEST_REF" ]]; then
            echo "Failed to resolve digest for $IMAGE_REF" >&2
            exit 1
          fi

          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "digest_ref=$DIGEST_REF" >> "$GITHUB_OUTPUT"

  # Unified image security path:
  # - push/pull_request: build image then scan/sign by digest
  # - workflow_dispatch: use explicit image_ref if supplied, otherwise auto-build
  trivy-image-scan:
    name: Trivy image scan
    if: ${{ always() && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') }}
    needs:
      - build-image
    outputs:
      sign_ref: ${{ steps.sign_target.outputs.sign_ref }}
    runs-on: [self-hosted, pve-test, build]
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install Trivy CLI
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install Crane CLI
        env:
          CRANE_VERSION: v0.20.6
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" crane
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run Trivy image scan
        env:
          TRIVY_USERNAME: ${{ secrets.HARBOR_ROBOT_USER }}
          TRIVY_PASSWORD: ${{ secrets.HARBOR_ROBOT_PASSWORD }}
          INPUT_IMAGE_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_ref || '' }}
          BUILT_IMAGE_REF: ${{ needs.build-image.outputs.image_ref }}
        run: |
          IMAGE_REF="${INPUT_IMAGE_REF:-$BUILT_IMAGE_REF}"
          if [[ -z "$IMAGE_REF" ]]; then
            echo "Unable to determine image reference for scan." >&2
            exit 1
          fi

          trivy image \
            --username "$TRIVY_USERNAME" \
            --password "$TRIVY_PASSWORD" \
            --insecure \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --format sarif \
            --output trivy-image.sarif \
            "$IMAGE_REF"

      - name: Upload image SARIF
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: trivy-image.sarif

      - name: Generate SBOM (SPDX)
        env:
          SYFT_REGISTRY_INSECURE_USE_HTTP: "true"
          SYFT_REGISTRY_AUTH_AUTHORITY: "10.57.3.10"
          SYFT_REGISTRY_AUTH_USERNAME: ${{ secrets.HARBOR_ROBOT_USER }}
          SYFT_REGISTRY_AUTH_PASSWORD: ${{ secrets.HARBOR_ROBOT_PASSWORD }}
          INPUT_IMAGE_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_ref || '' }}
          BUILT_IMAGE_REF: ${{ needs.build-image.outputs.image_ref }}
        run: |
          IMAGE_REF="${INPUT_IMAGE_REF:-$BUILT_IMAGE_REF}"
          if [[ -z "$IMAGE_REF" ]]; then
            echo "Unable to determine image reference for SBOM generation." >&2
            exit 1
          fi

          syft scan --from registry "$IMAGE_REF" \
            --output spdx-json=sbom.spdx.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 90

      - name: Resolve digest and signing policy
        id: sign_target
        env:
          INPUT_IMAGE_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_ref || '' }}
          BUILT_IMAGE_REF: ${{ needs.build-image.outputs.image_ref }}
          BUILT_DIGEST_REF: ${{ needs.build-image.outputs.digest_ref }}
          HARBOR_USER: ${{ secrets.HARBOR_ROBOT_USER }}
          HARBOR_PASS: ${{ secrets.HARBOR_ROBOT_PASSWORD }}
        run: |
          set -euo pipefail

          IMAGE_REF="${INPUT_IMAGE_REF:-$BUILT_IMAGE_REF}"
          if [[ -z "$IMAGE_REF" ]]; then
            echo "Unable to determine image reference for signing policy." >&2
            exit 1
          fi

          if [[ -n "$BUILT_DIGEST_REF" ]]; then
            sign_ref="$BUILT_DIGEST_REF"
          fi

          if [[ ! "$IMAGE_REF" =~ ^10\.57\.3\.10\/ ]]; then
            echo "Security scan signing requires Harbor image refs (10.57.3.10/...)." >&2
            exit 1
          fi

          if [[ -z "${sign_ref:-}" && "$IMAGE_REF" == *@sha256:* ]]; then
            sign_ref="$IMAGE_REF"
          elif [[ -z "${sign_ref:-}" ]]; then
            registry="${IMAGE_REF%%/*}"
            repo_tag="${IMAGE_REF#*/}"
            repo="${repo_tag%:*}"
            tag="${repo_tag##*:}"
            digest=""
            manifest_status=""

            digest="$(timeout 20s crane digest --insecure --username "$HARBOR_USER" --password "$HARBOR_PASS" "$IMAGE_REF" 2>/dev/null || true)"

            if [[ -z "$digest" ]]; then
              manifest_url="http://${registry}/v2/${repo}/manifests/${tag}" # NOSONAR - Harbor test registry is intentionally HTTP-only on the isolated lab network.
              manifest_accept='application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
              manifest_headers="$RUNNER_TEMP/cosign-manifest-headers.txt"

              manifest_status="$(curl -sS --connect-timeout 5 --max-time 20 -u "$HARBOR_USER:$HARBOR_PASS" -X HEAD -D "$manifest_headers" -o /dev/null -w '%{http_code}' \
                -H "Accept: ${manifest_accept}" \
                "$manifest_url" || true)"

              if [[ "$manifest_status" != "200" ]]; then
                manifest_status="$(curl -sS --connect-timeout 5 --max-time 20 -u "$HARBOR_USER:$HARBOR_PASS" -X GET -D "$manifest_headers" -o /dev/null -w '%{http_code}' \
                  -H "Accept: ${manifest_accept}" \
                  "$manifest_url" || true)"
              fi

              if [[ "$manifest_status" == "200" ]]; then
                digest="$(tr -d '\r' < "$manifest_headers" \
                  | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}' \
                  | tail -n 1)"
              fi
            fi

            if [[ -z "$digest" ]]; then
              project="${repo%%/*}"
              repository_path="${repo#*/}"
              repository_encoded="${repository_path//\//%2F}"
              artifact_url="http://${registry}/api/v2.0/projects/${project}/repositories/${repository_encoded}/artifacts/${tag}" # NOSONAR - Harbor test registry is intentionally HTTP-only on the isolated lab network.
              digest="$(curl -sS --connect-timeout 5 --max-time 20 -u "$HARBOR_USER:$HARBOR_PASS" \
                -H 'Accept: application/json' \
                "$artifact_url" \
                | jq -r '.digest // empty' 2>/dev/null || true)"
            fi

            if [[ -n "$digest" ]]; then
              sign_ref="${registry}/${repo}@${digest}"
            else
              echo "Unable to resolve digest for $IMAGE_REF. Refusing tag-based signing." >&2
              if [[ -n "$manifest_status" ]]; then
                echo "Registry manifest probe status: ${manifest_status}" >&2
              fi
              exit 1
            fi
          fi

          registry="${sign_ref%%/*}"
          repo_ref="${sign_ref#*/}"
          if [[ "$repo_ref" == *"@"* ]]; then
            repo="${repo_ref%@*}"
          else
            repo="${repo_ref%:*}"
          fi

          probe_url="http://${registry}/v2/${repo}/blobs/uploads/" # NOSONAR - Harbor test registry is intentionally HTTP-only on the isolated lab network.
          probe_headers="$RUNNER_TEMP/cosign-sign-preflight-headers.txt"
          probe_status="$(curl -sS --connect-timeout 5 --max-time 20 -u "$HARBOR_USER:$HARBOR_PASS" -X POST -D "$probe_headers" -o /dev/null -w '%{http_code}' "$probe_url")" # NOSONAR - Harbor test registry is intentionally HTTP-only on the isolated lab network.
          if [[ "$probe_status" != "202" ]]; then
            echo "Cosign push preflight failed for ${repo} (status ${probe_status})." >&2
            echo "HARBOR_ROBOT_* must have push rights for this repository to store signature artifacts." >&2
            exit 1
          fi

          probe_location="$(awk 'BEGIN{IGNORECASE=1} /^Location:/{print $2}' "$probe_headers" | tr -d '\r')"
          if [[ -n "$probe_location" ]]; then
            if [[ "$probe_location" =~ ^https?:// ]]; then
              cancel_url="$probe_location"
            else
              cancel_url="http://${registry}${probe_location}" # NOSONAR - Harbor test registry is intentionally HTTP-only on the isolated lab network.
            fi
            curl -sS --connect-timeout 5 --max-time 20 -u "$HARBOR_USER:$HARBOR_PASS" -X DELETE -o /dev/null "$cancel_url" || true # NOSONAR - Harbor test registry is intentionally HTTP-only on the isolated lab network.
          fi

          echo "sign_ref=$sign_ref" >> "$GITHUB_OUTPUT" # NOSONAR - Digest refs target the internal Harbor registry over HTTP in pve-test.

      - name: Sign image
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          HARBOR_USER: ${{ secrets.HARBOR_ROBOT_USER }}
          HARBOR_PASS: ${{ secrets.HARBOR_ROBOT_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$COSIGN_KEY" > /tmp/cosign.key
          chmod 600 /tmp/cosign.key
          sign_output="$(cosign sign --yes --allow-http-registry --registry-username "$HARBOR_USER" --registry-password "$HARBOR_PASS" --key /tmp/cosign.key "${{ steps.sign_target.outputs.sign_ref }}" 2>&1)" || sign_status=$?
          rm -f /tmp/cosign.key
          sign_status="${sign_status:-0}"
          echo "$sign_output"
          if [[ "$sign_status" -ne 0 ]]; then
            if echo "$sign_output" | grep -Eqi 'unauthorized|action: push'; then
              echo "Cosign signing failed because Harbor robot credentials do not have push rights for signature artifacts in this repository." >&2
              echo "Grant push access to HARBOR_ROBOT_USER on the target repo/project and retry." >&2
            fi
            exit "$sign_status"
          fi

      - name: Verify signature
        run: |
          cosign verify --allow-http-registry --key certs/cosign.pub "${{ steps.sign_target.outputs.sign_ref }}"

  signature-gate:
    name: Signature Gate (reusable)
    needs:
      - trivy-image-scan
    if: ${{ needs.trivy-image-scan.result == 'success' }}
    uses: ./.github/workflows/signature-gate.yml
    with:
      image_ref: ${{ needs.trivy-image-scan.outputs.sign_ref }}
    secrets:
      HARBOR_ROBOT_PASSWORD: ${{ secrets.HARBOR_ROBOT_PASSWORD }}
      HARBOR_ROBOT_USER: ${{ secrets.HARBOR_ROBOT_USER }}

  sast-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

    - name: Run Trivy vulnerability + IaC + secret scanner
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        scanners: 'vuln,secret,misconfig'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy SARIF results
      uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4
      with:
        sarif_file: 'trivy-results.sarif'

  # Removed terraform-security job (tfsec build fails in CI due to Go toolchain)
  # IaC scanning is now consolidated into the `sast-scan` job via Trivy.

  snyk-iac:
    name: Snyk IaC scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Run Snyk IaC scan
        uses: snyk/actions/iac@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          file: terraform/
          args: --severity-threshold=high --report

      - name: Upload Snyk results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4
        if: always() && hashFiles('snyk.sarif') != ''
        with:
          sarif_file: snyk.sarif

  trufflehog:
    name: TruffleHog secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@47e7b7cd74f578e1e3145d48f669f22fd1330ca6 # v3.94.3
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@383f7e52eae3ab0510c3cb0e7d9d150bbaeab838 # v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}
