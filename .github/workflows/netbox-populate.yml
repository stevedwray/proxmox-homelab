name: NetBox Populate

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: netbox-populate
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  populate:
    name: Run NetBox populate
    runs-on: [self-hosted, pve-test, build]
    # id-token: write lets this job request a GitHub OIDC token, which
    # OpenBao's jwt-github auth accepts only for this workflow on main
    # (docs/secrets-refactor/). No long-lived secret credential is stored
    # in GitHub for this.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Request GitHub OIDC token for OpenBao
        run: |
          jwt="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=openbao" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::${jwt}"
          echo "OPENBAO_GITHUB_JWT=${jwt}" >> "${GITHUB_ENV}"

      # populate.py runs directly on the runner, not in the netbox-populate
      # container: the runner user has no Docker socket access, and this
      # public repo's self-hosted runner deliberately doesn't get it. The
      # container only wrapped python3 + pyyaml, which deploy-ci-runner.yml
      # installs (python3-yaml).
      - name: Run populate
        env:
          DOCKER_SOCKET_PROXY_URL_TEMPLATE: ${{ secrets.DOCKER_SOCKET_PROXY_URL_TEMPLATE }}
          DOCKER_SOCKET_PROXY_URL: ${{ secrets.DOCKER_SOCKET_PROXY_URL }}
          LAB_IP_OPENBAO: "192.168.20.16"
          NETBOX_NETWORK_ENV: pve
          NETBOX_GUEST_SSH_USER: automation
        run: |
          python3 scripts/secrets_env.py --profile ci-netbox-populate -- \
            python3 terraform/lxc/stacks/netbox-stack/integrations/populate.py
