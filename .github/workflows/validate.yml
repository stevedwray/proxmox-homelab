name: Validate

on:
  push:
    branches:
      - main
      - 'baseline/teardown-validated'
      - 'dev/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - 'baseline/teardown-validated'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  terraform-fmt:
    name: Terraform format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0

      - name: Check formatting
        run: terraform fmt -check -recursive terraform/

  shellcheck:
    name: ShellCheck lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          find . -name '*.sh' \
            -not -path './.git/*' \
            -not -path './_legacy/*' \
            -not -path '*/.terragrunt-cache/*' \
            | xargs shellcheck

  harbor-image-policy:
    name: Enforce Harbor-only image references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: "Check every image: reference routes through Harbor"
        run: |
          set -euo pipefail
          violations=0

          # Scans terraform/lxc/ansible/ (playbooks + roles — where every real
          # image: line actually lives) as well as terraform/lxc/stacks/ (any
          # stack-owned static compose file). Earlier versions of this check
          # only scanned terraform/lxc/stacks/, so it never saw the
          # ansible/-side violations documented in
          # docs/harbor-stack/image-sourcing-enforcement.md Finding 2.
          #
          # A line's *effective* value passes if it references a
          # registry_host var, in any of the conventions this repo uses:
          # Ansible Jinja ("{{ ai_services_registry_host }}/...", optionally
          # quoted), or a plain Docker Compose "${REGISTRY_HOST}"
          # substitution. If the image: line is a single bare var reference
          # (this repo's "*_image:" indirection convention, e.g.
          # "image: {{ vm_image }}"), the check resolves that var's own
          # definition — same file first, then that role's own
          # defaults/main.yml if the var is defined elsewhere in the same
          # role (covers both roles/<name>/tasks/main.yml and
          # roles/<name>/templates/*.j2) — and tests *that* value instead,
          # so an indirected bad value (like minecraft-wildworks's
          # minecraft_server_image, or docker_socket_proxy's template
          # referencing its role default) can't hide behind the
          # indirection. Anything else — a literal upstream registry
          # reference or a bare
          # Docker Hub shorthand like "portainer/portainer-ce" — fails,
          # rather than only rejecting a fixed list of known registry
          # hostnames.
          #
          # Known limitation: var resolution only follows one hop (the
          # image: line's own var, plus that var's role-defaults sibling if
          # applicable) — a var defined via a second layer of indirection
          # would not be resolved. None of this repo's stacks currently do
          # that.
          #
          # Excluded, each for a different documented reason:
          #  - gaming-stack/torrent-stack/media-stack: legacy, pre-contract
          #    LXCs not provisioned by this repo's Terraform/Ansible flow
          #    yet (see docs/application-migration/) — no playbook here a
          #    fix would even apply through.
          #  - roles/app_stack/: confirmed zero live consumers (no
          #    stack.yaml points ansible_playbook at deploy-stack) — see
          #    docs/harbor-stack/image-sourcing-enforcement.md Finding 1.
          #  - stacks/harness-target/: intentionally pinned to production
          #    Harbor's FQDN rather than ${REGISTRY_HOST}, confirmed by the
          #    operator — it only ever pulls (read-only) through prod
          #    Harbor's proxy cache, never mutates it, so this is accepted
          #    as-is, not a violation to fix.
          passes_registry_host() {
            local v="$1"
            [[ "${v}" =~ \{\{[^}]*registry_host[^}]*\}\} ]] && return 0
            [[ "${v}" =~ \$\{[^}]*registry_host[^}]*\} ]] && return 0
            return 1
          }

          resolve_var() {
            local var_name="$1" file="$2" def_line
            def_line=$(grep -E "^[[:space:]]*${var_name}:[[:space:]]*" "${file}" | head -1 || true)
            if [[ -z "${def_line}" && "${file}" =~ ^(.*/roles/[^/]+/)([^/]+/.*)?$ ]]; then
              local defaults_file="${BASH_REMATCH[1]}defaults/main.yml"
              if [[ -f "${defaults_file}" && "${defaults_file}" != "${file}" ]]; then
                def_line=$(grep -E "^[[:space:]]*${var_name}:[[:space:]]*" "${defaults_file}" | head -1 || true)
              fi
            fi
            [[ -n "${def_line}" ]] && sed -e 's/^[[:space:]]*[a-zA-Z_][a-zA-Z0-9_]*:[[:space:]]*//' <<<"${def_line}"
          }

          while IFS=: read -r file lineno content; do
            trimmed=$(sed -e 's/^[[:space:]]*//' <<<"${content}")
            [[ "${trimmed:0:1}" == "#" ]] && continue

            value=$(sed -e 's/^[[:space:]]*image:[[:space:]]*//' <<<"${content}")
            dequoted="${value%\"}"; dequoted="${dequoted#\"}"
            dequoted="${dequoted%\'}"; dequoted="${dequoted#\'}"
            effective_value="${value}"

            if [[ "${dequoted}" =~ ^\{\{[[:space:]]*([a-zA-Z_][a-zA-Z0-9_]*)[[:space:]]*\}\}$ ]]; then
              resolved=$(resolve_var "${BASH_REMATCH[1]}" "${file}")
              [[ -n "${resolved}" ]] && effective_value="${resolved}"
            fi

            lower_value="${effective_value,,}"
            passes_registry_host "${lower_value}" && continue

            echo "VIOLATION: ${file}:${lineno}:${content}   [resolved: ${effective_value}]"
            violations=$((violations + 1))
          done < <(grep -RInE \
            --exclude-dir='.terragrunt-cache' \
            --exclude-dir='gaming-stack' \
            --exclude-dir='torrent-stack' \
            --exclude-dir='media-stack' \
            --exclude-dir='app_stack' \
            --exclude-dir='harness-target' \
            --include='*.yml' \
            --include='*.yaml' \
            --include='*.j2' \
            '^[[:space:]]*image:[[:space:]]*[^[:space:]]' \
            terraform/lxc/ansible/ terraform/lxc/stacks/)

          if [[ "${violations}" -gt 0 ]]; then
            echo "ERROR: ${violations} image: reference(s) above do not route through Harbor."
            echo "Use {{ <stack>_registry_host }}/<project>/<image>:<tag> (or \${REGISTRY_HOST}/... in a static compose file) instead."
            exit 1
          fi
          echo "OK — every image: reference routes through Harbor."

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0

      - name: Cache Terraform providers
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('terraform/lxc/.terraform.lock.hcl') }}
          restore-keys: terraform-providers-${{ runner.os }}-

      - name: Init (no backend)
        working-directory: terraform/lxc
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          TF_PLUGIN_CACHE_DIR=~/.terraform.d/plugin-cache \
            terraform init -backend=false

      - name: Validate
        working-directory: terraform/lxc
        # terraform validate does not accept -var-file; supply required
        # variables via TF_VAR_ environment variables instead.
        env:
          TF_VAR_stack_name: ci-validate
          TF_VAR_stack_yaml_path: /dev/null
          TF_VAR_proxmox_api_url: https://localhost:8006
          TF_VAR_pm_api_token_id: ci@pve!token
          TF_VAR_pm_api_token_secret: dummy-secret-for-ci-validate-only
          TF_VAR_lxc_password: dummy-password-for-ci-validate-only
        run: terraform validate

  ansible-lint:
    name: Ansible lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Cache pip packages
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cache/pip
          key: pip-ansible-lint-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-ansible-lint-

      - name: Create Python virtual environment
        run: python3 -m venv .venv

      - name: Install ansible-lint
        run: .venv/bin/pip install ansible-lint

      - name: Install Ansible collections
        working-directory: terraform/lxc/ansible
        run: ../../../.venv/bin/ansible-galaxy collection install -r requirements.yml

      - name: Run ansible-lint
        # Run from the ansible directory so ansible.cfg is discovered,
        # which sets roles_path = roles (relative to this directory).
        working-directory: terraform/lxc/ansible
        run: ../../../.venv/bin/ansible-lint playbooks/

      - name: Install host bootstrap Ansible collections
        working-directory: ansible
        run: ../.venv/bin/ansible-galaxy collection install -r requirements.yml

      - name: Run ansible-lint on host bootstrap playbooks
        # ansible/ contains higher-risk bootstrap playbooks that target physical Proxmox
        # hosts. Run from ansible/ so ansible/ansible.cfg is discovered automatically.
        working-directory: ansible
        run: ../.venv/bin/ansible-lint 00-initial-setup/*.yml 01-base-system/*.yml

  python-lint:
    name: Python lint + security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install ruff and bandit
        run: |
          pip install --only-binary ':all:' ruff==0.15.17 bandit==1.9.4

      - name: Run ruff (lint)
        run: |
          find . -name '*.py' \
            -not -path './.git/*' \
            -not -path './_legacy/*' \
            -not -path '*/.terragrunt-cache/*' \
            -not -path './.venv/*' \
            | xargs ruff check --output-format=github

      - name: Run bandit (security)
        run: |
          find . -name '*.py' \
            -not -path './.git/*' \
            -not -path './_legacy/*' \
            -not -path '*/.terragrunt-cache/*' \
            -not -path './.venv/*' \
            | xargs bandit -ll -q

  sops-decrypt-check:
    name: SOPS decrypt verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install sops
        env:
          SOPS_VERSION: "3.10.2"
        run: |
          curl -Lo /usr/local/bin/sops \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          chmod +x /usr/local/bin/sops

      - name: Verify decryption succeeds
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          # Check every secrets file, not just the common one — the per-env
          # delta files (secrets.pve.enc.yaml etc.) are real secrets files
          # too and were previously untested here. See
          # docs/framework-integration/decisions.md Decision 6.
          for f in terraform/secrets*.enc.yaml; do
            sops --decrypt "$f" > /dev/null
            echo "Decryption successful: $f"
          done
