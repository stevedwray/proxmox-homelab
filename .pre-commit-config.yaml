exclude: '^\.codex$'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=1000']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.81.0
    hooks:
      - id: terraform_fmt

  - repo: local
    hooks:
      - id: check-required-sops-keys
        name: Check required SOPS keys
        entry: bash scripts/check-required-sops-keys.sh
        language: system
        pass_filenames: false
        files: ^terraform/secrets\.enc\.yaml$
