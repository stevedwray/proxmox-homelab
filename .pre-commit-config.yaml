exclude: '^\.codex$'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      # Plan-workspace patches (git apply input) must stay byte-exact: a
      # stripped trailing blank context line corrupts the hunk.
      - id: trailing-whitespace
        exclude: '^docs/.*/patches/.*\.patch$'
      - id: end-of-file-fixer
        exclude: '^docs/.*/patches/.*\.patch$'
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=1000']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.81.0
    hooks:
      - id: terraform_fmt

  - repo: local
    hooks:
      # OpenBao is authoritative since the cutover (docs/secrets-refactor/).
      # A change to a SOPS file could only reintroduce a stale value, so any
      # staged change to one fails. Deletions (SOPS retirement) are allowed:
      # pre-commit does not pass deleted files to hooks.
      - id: block-sops-secret-edits
        name: Block edits to frozen SOPS secrets files
        entry: "terraform/secrets.*.enc.yaml are frozen: OpenBao is authoritative. Write secrets with scripts/openbao_write.py (docs/secrets-refactor/)."
        language: fail
        files: ^terraform/secrets\..*\.enc\.yaml$
        # Commit-time only: the pre-push run checks every file in the pushed
        # range, which would reject the pre-freeze commits that legitimately
        # touched these files. New edits are caught at commit time (here) and
        # in PRs (validate.yml sops-freeze).
        stages: [pre-commit]
      # Terraform plan and state files embed input variable values, secrets
      # included, in plain text inside a compressed archive no scanner reads
      # (2026-10-24: a Proxmox API token secret reached public stable this way).
      # Reject them by name, at commit and again at push.
      - id: block-terraform-plan-files
        name: Block Terraform plan and state files (they embed secrets)
        entry: "Terraform plan/state files hold variable values, including secrets, in plain text. Do not commit them; delete the file (plan.out and *.tfplan are in .gitignore)."
        language: fail
        files: '(^|/)(plan\.out|[^/]*\.tfplan|[^/]*\.tfstate(\.backup)?)$'
        stages: [pre-commit, pre-push]

      # Scan only the commits being pushed, before they leave this machine.
      - id: trufflehog-pre-push
        name: TruffleHog (commits being pushed)
        entry: scripts/trufflehog_prepush.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]
