[worldserver]

# Small, seller-only Auction House population for the private two-player realm.
# Account 6 / character GUID 49 is the locked, dedicated Auctioneer owner;
# never use a normal playable character as the bot owner.
AuctionHouseBot.EnableSeller = 1
AuctionHouseBot.EnableBuyer = 0
AuctionHouseBot.Account = 6
AuctionHouseBot.GUID = 49

# Keep the market useful without simulating a high-population realm.
AuctionHouseBot.ItemsPerCycle = 50
AuctionHouseBot.ConsiderOnlyBotAuctions = 1
AuctionHouseBot.DuplicatesCount = 2
AuctionHouseBot.DivisibleStacks = 1
AuctionHouseBot.ElapsingTimeClass = 1

# Useful adventuring and profession supplies, but no vendor-stock filler.
AuctionHouseBot.VendorItems = 0
AuctionHouseBot.VendorTradeGoods = 0
AuctionHouseBot.LootItems = 1
AuctionHouseBot.LootTradeGoods = 1
AuctionHouseBot.OtherItems = 0
AuctionHouseBot.OtherTradeGoods = 0
AuctionHouseBot.ProfessionItems = 1
AuctionHouseBot.DisableItemsAboveReqLevel = 80
AuctionHouseBot.DisableTGsAboveReqLevel = 80
