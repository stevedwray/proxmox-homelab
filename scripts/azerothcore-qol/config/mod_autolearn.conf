[AutoLearn]

# Normal player characters learn ordinary class-trainer spells as they level.
# Playerbots retain their existing maintenance workflow.
AutoLearn.Enable = 1
AutoLearn.SkipBots = 1
AutoLearn.ClassSpells = 1
AutoLearn.ClassSpells.OnFirstLogin = 1
AutoLearn.ClassSpells.MaxLevel = 80

# Keep the established gameplay choices: weapon skills are provisioned by the
# starter migration, riding is still available from trainers at levels 10/20,
# and class quest rewards (including Shaman totems) remain meaningful.
AutoLearn.WeaponSkills = 0
AutoLearn.MaxWeaponSkills = 0
AutoLearn.Riding = 0
AutoLearn.StarterItems = 0
