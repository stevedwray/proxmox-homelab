# Handoff: Architect → Executor
# Generated by the architect agent. Paste to executor or use the handoff button.
# All fields required unless marked optional.

session:
  id: "session-agent-hardening-01"
  goal: "Implement deterministic handoff validation and mode-routing safeguards for architect/planner/executor flow"
  branch: "exec/agent-hardening-01"
  issue: "#151"

boundary:
  allowed:
    - "Edit agent workflow files, prompts, and supporting docs/scripts in this repository"
    - "Add contract validation checks and deterministic error handling"
    - "Run non-destructive local validation commands and tests"
  not_allowed:
    - "No terraform apply, terragrunt apply, or ansible-playbook deploy actions"
    - "No changes to live pve-test infrastructure"
    - "No secret material export into tracked files"

refs:
  base_branch: "dev/pve-test"
  baseline_sha: "de717554a3f91a9261bd6b40e7586d4405144d4e"
  prior_report: null

env:
  disposable: true
  target_guard_cmd: "./with-secrets bash -c 'echo $TF_VAR_proxmox_node'"
  target_guard_expect: "pve-test"
  scan_gate: pr

guardrails:
  - "Run target guard before any destructive or deploy action"
  - "Treat this as control-plane hardening: stop if any step targets infrastructure mutation"
  - "Record every claim in report with raw evidence file path"
  - "Do not overwrite unrelated handoff artifacts without explicit migration note in report"

gates:
  - id: "target-guard"
    cmd: "./with-secrets bash -c 'echo $TF_VAR_proxmox_node'"
    expect: "stdout exactly 'pve-test'"
    critical: true
  - id: "git-context"
    cmd: "git rev-parse --abbrev-ref HEAD && git rev-parse HEAD && git status --short"
    expect: "commands succeed and output captured to evidence"
    critical: true
  - id: "workflow-inventory"
    cmd: "rg -n 'handoff-to-(architect|executor|planner)|session-.*\\.yaml|needs_input|Verdict|Blockers|Next Session' .ai AGENTS.md .github README.md || true"
    expect: "current workflow touchpoints listed"
    critical: true
  - id: "contract-validation-implementation"
    cmd: "implement required-file and schema validation so wrong/missing handoff inputs fail with structured needs_input output"
    expect: "architect/planner/executor paths reject invalid handoffs deterministically"
    critical: true
  - id: "mode-routing-hardening"
    cmd: "implement deterministic routing rules so architect/planner/executor actions cannot cross-run with incompatible file context"
    expect: "mode-specific file requirements enforced and documented"
    critical: true
  - id: "branch-worktree-safety"
    cmd: "implement safe branch-switch behavior to avoid stash conflicts and prevent unintended handoff corruption"
    expect: "workflow handles dirty trees explicitly and records decision path"
    critical: true
  - id: "blocker-lifecycle-consistency"
    cmd: "ensure blocker/task labels and issue workflow are resilient when labels are missing or files are absent"
    expect: "label existence checks and fallback behavior documented/implemented"
    critical: true
  - id: "validation-run"
    cmd: "run repository checks relevant to modified files (for example markdown/yaml lint or targeted tests)"
    expect: "no new errors introduced by hardening changes"
    critical: false
  - id: "report-and-handoff"
    cmd: "write session report and refresh .ai/tasks/handoff-to-architect.yaml with gate statuses and evidence paths"
    expect: "report and architect handoff present and complete"
    critical: false

model_hint: lightweight   # lightweight | heavy — if heavy, executor switches to executor-heavy

output_report: "docs/sessions/session-agent-hardening-01-report.md"
