# NetBox Docker Compose — based on netbox-docker release v4.5-4.0.2
# Adapted for Portainer API deployment: env vars inlined, absolute config path.
# All images are routed through Harbor proxy cache at ${REGISTRY_HOST}.
# REGISTRY_HOST is injected by deploy-netbox-stack.yml via Portainer env vars.
# pve-test: 10.57.3.10  pve: 192.168.1.10
# Upstream: https://github.com/netbox-community/netbox-docker
services:
  netbox: &netbox
    image: ${REGISTRY_HOST}/dockerhub/netboxcommunity/netbox:v4.5-4.0.2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    user: "netbox:root"
    ports:
      - "8080:8080"
    healthcheck:
      test: curl -f http://localhost:8080/login/ || exit 1
      start_period: 300s
      timeout: 3s
      interval: 15s
    environment:
      # Database
      DB_HOST: postgres
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: "${NETBOX_DB_PASSWORD}"
      # Redis (task queue)
      REDIS_HOST: redis
      REDIS_PASSWORD: "${NETBOX_REDIS_PASSWORD}"
      REDIS_DATABASE: "0"
      REDIS_SSL: "false"
      REDIS_INSECURE_SKIP_TLS_VERIFY: "false"
      # Redis (cache)
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PASSWORD: "${NETBOX_REDIS_CACHE_PASSWORD}"
      REDIS_CACHE_DATABASE: "1"
      REDIS_CACHE_SSL: "false"
      REDIS_CACHE_INSECURE_SKIP_TLS_VERIFY: "false"
      # NetBox core
      ALLOWED_HOSTS: "*"
      SECRET_KEY: "${NETBOX_SECRET_KEY}"
      API_TOKEN_PEPPER_1: "${NETBOX_API_TOKEN_PEPPER}"
      # Application
      CORS_ORIGIN_ALLOW_ALL: "True"
      GRAPHQL_ENABLED: "true"
      METRICS_ENABLED: "false"
      WEBHOOKS_ENABLED: "true"
      SKIP_SUPERUSER: "true"
      LOGIN_REQUIRED: "true"
      # Media
      MEDIA_ROOT: /opt/netbox/netbox/media
      # Email (disabled by default — configure when needed)
      EMAIL_FROM: "netbox@localhost"
      EMAIL_SERVER: localhost
      EMAIL_PORT: "25"
      EMAIL_USERNAME: netbox
      EMAIL_PASSWORD: ""
      EMAIL_USE_SSL: "false"
      EMAIL_USE_TLS: "false"
      EMAIL_SSL_CERTFILE: ""
      EMAIL_SSL_KEYFILE: ""
      EMAIL_TIMEOUT: "5"
      # Release check
      RELEASE_CHECK_URL: "https://api.github.com/repos/netbox-community/netbox/releases"
      # Workers
      GRANIAN_WORKERS: "4"
    volumes:
      - /srv/docker/netbox/configuration:/etc/netbox/config:z,ro
      - netbox-media-files:/opt/netbox/netbox/media:rw
      - netbox-reports-files:/opt/netbox/netbox/reports:rw
      - netbox-scripts-files:/opt/netbox/netbox/scripts:rw
    restart: unless-stopped

  netbox-worker:
    <<: *netbox
    ports: []
    depends_on:
      netbox:
        condition: service_healthy
    command:
      - /opt/netbox/venv/bin/python
      - /opt/netbox/netbox/manage.py
      - rqworker
    healthcheck:
      test: ps -aux | grep -v grep | grep -q rqworker || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s

  netbox-housekeeping:
    <<: *netbox
    ports: []
    depends_on:
      netbox:
        condition: service_healthy
    command:
      - /opt/netbox/venv/bin/python
      - /opt/netbox/netbox/manage.py
      - housekeeping
    healthcheck:
      test: ps -aux | grep -v grep | grep -q housekeeping || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s

  postgres:
    image: ${REGISTRY_HOST}/dockerhub/library/postgres:18-alpine
    healthcheck:
      test: pg_isready -q -t 2 -d $$POSTGRES_DB -U $$POSTGRES_USER
      start_period: 20s
      timeout: 30s
      interval: 10s
      retries: 5
    environment:
      POSTGRES_DB: netbox
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: "${NETBOX_DB_PASSWORD}"
    volumes:
      - netbox-postgres:/var/lib/postgresql
    restart: unless-stopped

  redis:
    image: ${REGISTRY_HOST}/dockerhub/valkey/valkey:9.0-alpine
    command:
      - sh
      - -c
      - valkey-server --appendonly yes --requirepass $$REDIS_PASSWORD
    healthcheck: &redis-healthcheck
      test: '[ $$(valkey-cli --pass "$${REDIS_PASSWORD}" ping) = ''PONG'' ]'
      start_period: 5s
      timeout: 3s
      interval: 1s
      retries: 5
    environment:
      REDIS_PASSWORD: "${NETBOX_REDIS_PASSWORD}"
    volumes:
      - netbox-redis-data:/data
    restart: unless-stopped

  redis-cache:
    image: ${REGISTRY_HOST}/dockerhub/valkey/valkey:9.0-alpine
    command:
      - sh
      - -c
      - valkey-server --requirepass $$REDIS_PASSWORD
    healthcheck: *redis-healthcheck
    environment:
      REDIS_PASSWORD: "${NETBOX_REDIS_CACHE_PASSWORD}"
    volumes:
      - netbox-redis-cache-data:/data
    restart: unless-stopped

volumes:
  netbox-media-files:
    driver: local
  netbox-postgres:
    driver: local
  netbox-redis-cache-data:
    driver: local
  netbox-redis-data:
    driver: local
  netbox-reports-files:
    driver: local
  netbox-scripts-files:
    driver: local
