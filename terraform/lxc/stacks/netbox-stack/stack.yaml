# NetBox IPAM/DCIM stack — pve-test instance in infra_seg
hostname: netbox-stack
ip_address: "${lab_ip_netbox}/24"
gateway: "${lab_gw_infra}"
proxmox_node: pve-test
network:
  zone: infra_seg
vmid: 143
cores: 2
memory: 1024
swap: 4096
rootfs_size: 8
rootfs_storage: infrastructure-containers
docker_storage_size: "32G"
ostemplate: "storage-template:vztmpl/debian-13.1-2-docker-template.tar.gz"
tags:
  - netbox
  - test
  - docker
depends_on:
  - harbor-stack
provides:
  - service: netbox-http
    port: 8080
    protocol: tcp
keyctl: true

# Deployment
ansible_playbook: "deploy-netbox-stack"
deployment_tier: platform
portainer_agent: false
app_stack_name: "netbox"

# pve-test service IPs (sourced from .env via TF_VAR_lab_ip_*)
portainer_server_ip: "${lab_ip_portainer}"
registry_host: "harbor.lab.gibbsgreatly.xyz"
apt_cacher_host: "${lab_ip_apt_cacher}"
