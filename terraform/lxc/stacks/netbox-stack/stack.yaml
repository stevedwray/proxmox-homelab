# NetBox IPAM/DCIM stack — infra_seg zone
hostname: netbox-stack
ip_address: "${lab_ip_netbox}/24"
gateway: "${lab_gw_infra}"
dns_server: "${lab_gw_infra}"
network:
  zone: infra_seg
vmid: 40012
cores: 2
memory: 4096
swap: 4096
rootfs_size: 8
storage_profile: platform-default
docker_storage_size: "34G"
docker_mount:
  logical_name: docker-data
  path: /var/lib/docker
  size: "34G"
  backup_policy: include
  resize_control_plane: operational
  mutation_policy: grow-only
template_name: "debian-13.1-2-docker-template.tar.gz"
tags:
  - netbox
  - test
  - docker
depends_on:
  - harbor-stack
provides:
  - service: netbox-http
    port: 8080
    protocol: tcp
keyctl: true

# Deployment
ansible_playbook: "deploy-netbox-stack"
deployment_tier: platform
portainer_agent: false
app_stack_name: "netbox"

# Environment-selected service IPs (sourced from TF_VAR_lab_ip_* env vars)
portainer_server_ip: "${lab_ip_portainer}"
registry_host: "harbor.lab.gibbsgreatly.xyz"
apt_cacher_host: "${lab_ip_apt_cacher}"
