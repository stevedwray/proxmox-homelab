# GitHub Actions self-hosted runner — build_seg zone
hostname: ci-runner-01
ip_address: "${lab_ip_ci_runner}/24"
gateway: "${lab_gw_build}"
dns_server: "${lab_gw_build}"
vmid: 10063
cores: 2
memory: 4096
swap: 1024
rootfs_size: 20
storage_profile: platform-default
docker_storage_size: "10G"
docker_mount:
  logical_name: docker-data
  path: /var/lib/docker
  size: "10G"
  backup_policy: include
  resize_control_plane: operational
  mutation_policy: grow-only
template_name: "debian-13.1-2-docker-template.tar.gz"
tags:
  - ci
  - runner
  - infrastructure
depends_on:
  - harbor-stack
  - apt-cacher-stack
provides: []

network:
  zone: build_seg

# Phase 03c: apt-cacher-ng is deployed on infra_seg via LAB_IP_APT_CACHER.
# Environment-selected service IPs (explicit — do not rely on variable defaults)
apt_cacher_host: "${lab_ip_apt_cacher}"
portainer_server_ip: "${lab_ip_portainer}"
registry_host: "{{ lookup('env', 'LAB_IP_HARBOR') | mandatory('LAB_IP_HARBOR env var is required') }}"

ansible_playbook: "deploy-ci-runner"
deployment_tier: platform
portainer_agent: false

# Stage C of docs/harbor-stack/image-sourcing-enforcement.md: non-destructive
# scheduled re-pull of known Harbor-routed images, keeping Harbor's cache/scan
# data fresh for stacks that don't otherwise force a re-pull on redeploy.
harbor_repull_enabled: true
