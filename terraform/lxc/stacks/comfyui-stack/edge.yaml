apiVersion: homelab.gibbsgreatly.xyz/v1alpha1
kind: EdgeManifest
metadata:
  name: comfyui-edge
  stack: comfyui-stack
spec:
  routes:
    - name: comfyui
      host: comfyui.${LAB_DOMAIN}
      backend:
        type: url
        url: http://${LAB_IP_COMFYUI}:8188
      dns:
        enabled: true
        target: ${LAB_IP_PROXY}
        ttl: 5m
      tls:
        resolver: letsencrypt
      auth:
        mode: forwardAuth
