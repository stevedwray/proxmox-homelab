# Traefik reverse proxy — edge_seg zone
hostname: proxy-stack
ip_address: "${lab_ip_proxy}/24"
gateway: "${lab_gw_edge}"
dns_server: "${lab_gw_edge}"
network:
  zone: edge_seg
vmid: 30010
cores: 1
memory: 1024
swap: 512
rootfs_size: 8
storage_profile: platform-zfs
docker_storage_size: "7G"
docker_mount:
  logical_name: docker-data
  path: /var/lib/docker
  size: "7G"
  backup_policy: include
  resize_control_plane: operational
  mutation_policy: grow-only
extra_mount_path: "/opt/proxy-stack/certs"
extra_mount_size: "10G"
extra_mount_profile: durable-zfs
extra_mount:
  logical_name: proxy-certs
  path: /opt/proxy-stack/certs
  size: "10G"
  profile: durable-zfs
  backup_policy: include
  resize_control_plane: operational
  mutation_policy: grow-only
template_name: "debian-13.1-2-docker-template.tar.gz"
tags:
  - traefik
  - proxy
  - edge
  - docker
depends_on:
  - harbor-stack
  - apt-cacher-stack
# Do not depend on authentik-stack here. Traefik is part of the Stage 3a edge
# foundation and must be able to start before Authentik direct first boot/API
# token bootstrap. Forward-auth calls only require Authentik at request time.
provides:
  - service: proxy-http
    port: 80
    protocol: tcp
  - service: proxy-https
    port: 443
    protocol: tcp
ansible_playbook: "deploy-proxy-stack"
deployment_tier: platform
portainer_agent: false
enable_docker_socket_proxy: true
docker_socket_proxy_bind_addr: "${lab_ip_proxy}"
docker_socket_proxy_listen_port: 2375
docker_socket_proxy_targets:
  - "${lab_ip_proxy}"

# Docker socket proxy — read-only Docker API endpoint for NetBox discovery
enable_docker_socket_proxy: true
docker_socket_proxy_bind_addr: "${lab_ip_proxy}"
docker_socket_proxy_listen_port: 2375
docker_socket_proxy_targets:
  - "${lab_ip_proxy}"

# Environment-selected service IPs (sourced from TF_VAR_lab_ip_* env vars)
portainer_server_ip: "${lab_ip_portainer}"
registry_host: "{{ lookup('env', 'LAB_IP_HARBOR') | mandatory('LAB_IP_HARBOR env var is required') }}"
apt_cacher_host: "${lab_ip_apt_cacher}"
