apiVersion: homelab.gibbsgreatly.xyz/v1alpha1
kind: EdgeManifest
metadata:
  name: proxy-edge
  stack: proxy-stack
spec:
  routes:
    - name: traefik-dashboard
      host: traefik.${LAB_DOMAIN}
      backend:
        type: traefikService
        service: api@internal
      dns:
        enabled: true
        target: ${LAB_IP_PROXY}
        ttl: 5m
      tls:
        resolver: letsencrypt
      auth:
        mode: forwardAuth
