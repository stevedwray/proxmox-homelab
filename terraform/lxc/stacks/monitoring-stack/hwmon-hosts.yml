  - {stack: pve, chip: "pci0000:00_0000:00:18_3", sensor: temp3, name: "CPU CCD1"}
  - {stack: pve, chip: "pci0000:00_0000:00:18_3", sensor: temp4, name: "CPU CCD2"}
  - {stack: pve, chip: nvme_nvme0, sensor: temp1, name: "NVMe 0 composite"}
  - {stack: pve, chip: nvme_nvme1, sensor: temp1, name: "NVMe 1 composite"}
  - {stack: pve, chip: nvme_nvme1, sensor: temp2, name: "NVMe 1 sensor 1"}
  - {stack: pve, chip: nvme_nvme1, sensor: temp3, name: "NVMe 1 sensor 2"}
  - {stack: pve, chip: nvme_nvme2, sensor: temp1, name: "NVMe 2 composite"}
  - {stack: pve, chip: "r8169_0_700_r8169_0_700:00", sensor: temp1, name: "NIC (r8169)"}
  - {stack: pve, chip: "0000:05:00_0_0000:06:00_0", sensor: temp1, name: "GPU edge"}
  - {stack: pve, chip: "0000:05:00_0_0000:06:00_0", sensor: temp2, name: "GPU junction"}
  - {stack: pve, chip: "0000:05:00_0_0000:06:00_0", sensor: temp3, name: "GPU memory"}
