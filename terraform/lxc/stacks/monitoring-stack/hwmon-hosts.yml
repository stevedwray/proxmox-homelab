  - {stack: pve, chip: platform_it87_2624, sensor: fan4, drop: true}   # SYS_FAN3, empty header
  - {stack: pve, chip: platform_it87_2624, sensor: pwm4, drop: true}
  - {stack: pve, chip: platform_it87_2624, sensor: in0, name: "CPU Vcore"}
