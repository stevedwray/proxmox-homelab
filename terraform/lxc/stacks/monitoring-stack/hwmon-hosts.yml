---
# Hardware-monitoring targets and sensor names, read by
# terraform/lxc/ansible/playbooks/deploy-monitoring-stack.yml.
# docs/hw-monitoring/plan.md. `stack` becomes the Grafana "Host" value.
hwmon_hosts:
  - {stack: pve, target: pve.gibbsgreatly.xyz, port: 9100}
  - {stack: pve-tiny, target: pve-tiny.gibbsgreatly.xyz, port: 9100}
  - {stack: pve-test, target: pve-test.gibbsgreatly.xyz, port: 9100}
  - {stack: argon-01, target: 192.168.1.22, port: 9100}
  - {stack: argon-02, target: 192.168.1.23, port: 9100}
  # workstation: Arch playbook (hwmon collector only), DHCP lease + DNS name
  - {stack: garuda, target: garuda.gibbsgreatly.xyz, port: 9100}
  # tpot: node_exporter runs as a Docker-published container (plain HTTP, no
  # basic auth) -- see ansible/00-initial-setup/tpot-monitoring.yml --tags hwmon
  - {stack: tpot, target: tpot.gibbsgreatly.xyz, port: 8084, plain: true}

# Chips to drop entirely, per host ({stack, chip}); chip names repeat across
# hosts (thermal_thermal_zone0 is the Pi's real CPU sensor but pve-test's
# placeholder), so a bare chip name must never be global. pve's gigabyte_wmi
# temps duplicate the it87 chip's temp1-6; its exact `chip` label is added
# when pve is deployed.
hwmon_drop_chips:
  # pve-test acpitz reads a constant 16 C (placeholder zone), not a real sensor
  - {stack: pve-test, chip: thermal_thermal_zone0}
  # pve: gigabyte_wmi repeats the it87 chip's temp1-6 (identical values);
  # acpitz is a constant 16.8 C placeholder (3 identical zones)
  - {stack: pve, chip: "wmi_bus_pnp0c14:00_deadbeef_2001_0000_00a0_c90629100000"}
  - {stack: pve, chip: thermal_thermal_zone0}

# Friendly sensor names. One entry per sensor. `scale` is optional: a
# multiplier for voltages behind resistor dividers (the chip reports the
# raw divided value, e.g. pve in2 = 1.99 V raw for the +12V rail, scale 6).
#   {stack: pve, chip: "<node_hwmon chip label>", sensor: "fan2", name: "CPU fan"}
#   {stack: pve, chip: "<node_hwmon chip label>", sensor: "in2", name: "+12V", scale: 6}
#   {stack: pve, chip: "<node_hwmon chip label>", sensor: "temp1", drop: true}   # drop one sensor
hwmon_sensor_names:
  # pve-test (Toshiba R930); names from the kernel's own sensor labels
  - {stack: pve-test, chip: platform_coretemp_0, sensor: temp1, name: "CPU package"}
  - {stack: pve-test, chip: platform_coretemp_0, sensor: temp2, name: "CPU core 0"}
  - {stack: pve-test, chip: platform_coretemp_0, sensor: temp3, name: "CPU core 1"}
  - {stack: pve-test, chip: "lnxsybus:00_tos6208:00", sensor: fan1, name: "System fan"}
  - {stack: pve-test, chip: power_supply_bat1, sensor: in0, name: "Battery voltage"}
  - {stack: pve-test, chip: power_supply_bat1, sensor: power1, name: "Battery power"}
  # argon-01 (Pi 4): temp0 and temp1 are the same thermal zone
  - {stack: argon-01, chip: thermal_thermal_zone0, sensor: temp0, name: "CPU"}
  - {stack: argon-01, chip: thermal_thermal_zone0, sensor: temp1, drop: true}
  - {stack: argon-01, chip: "soc:firmware_raspberrypi_hwmon", sensor: in0, name: "Undervoltage alarm"}
  # argon-02 (Pi 4): same layout as argon-01 (temp0/temp1 are one thermal zone;
  # a single sample differed by one 0.97 C sensor step, read-time quantisation)
  - {stack: argon-02, chip: thermal_thermal_zone0, sensor: temp0, name: "CPU"}
  - {stack: argon-02, chip: thermal_thermal_zone0, sensor: temp1, drop: true}
  - {stack: argon-02, chip: "soc:firmware_raspberrypi_hwmon", sensor: in0, name: "Undervoltage alarm"}
  # pve-tiny (MSI B450 GAMING PLUS MAX, nct6797 via nct6775). Header/rail names
  # are not known from the chip alone: fans/voltages keep neutral names until
  # identified against the MSI BIOS hardware-monitor page.
  - {stack: pve-tiny, chip: "pci0000:00_0000:00:18_3", sensor: temp1, name: "CPU Tctl"}
  - {stack: pve-tiny, chip: "pci0000:00_0000:00:18_3", sensor: temp3, name: "CPU CCD1"}
  - {stack: pve-tiny, chip: nvme_nvme0, sensor: temp1, name: "NVMe composite"}
  - {stack: pve-tiny, chip: nvme_nvme0, sensor: temp3, name: "NVMe sensor 2"}
  - {stack: pve-tiny, chip: "0000:00:03_1_0000:26:00_0", sensor: temp1, name: "GPU"}
  - {stack: pve-tiny, chip: "0000:00:03_1_0000:26:00_0", sensor: fan1, name: "GPU fan"}
  - {stack: pve-tiny, chip: "0000:00:03_1_0000:26:00_0", sensor: pwm1, drop: true}   # nouveau pwm is 0-100, not 0-255
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: temp1, name: "Motherboard (SYSTIN)"}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: temp2, name: "CPU socket (CPUTIN)"}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: temp3, name: "AUXTIN0"}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: temp5, name: "AUXTIN2"}
  # dropped nct temps: temp4/temp6 unconnected probes (-128/-3 C), temp7/temp13 duplicate the CPU Tctl, temp8-12 read 0 (unsupported)
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: temp4, drop: true}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: temp6, drop: true}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: temp7, drop: true}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: temp8, drop: true}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: temp9, drop: true}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: temp10, drop: true}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: temp11, drop: true}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: temp12, drop: true}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: temp13, drop: true}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: fan2, name: "Fan 2"}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: pwm2, name: "Fan 2 duty"}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: fan3, name: "Fan 3"}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: pwm3, name: "Fan 3 duty"}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: fan1, drop: true}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: pwm1, drop: true}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: fan4, drop: true}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: pwm4, drop: true}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: fan5, drop: true}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: pwm5, drop: true}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: fan6, drop: true}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: pwm6, drop: true}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: in0, name: "nct6797 in0"}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: in1, name: "nct6797 in1"}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: in2, name: "nct6797 in2"}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: in3, name: "nct6797 in3"}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: in4, name: "nct6797 in4"}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: in5, name: "nct6797 in5"}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: in6, name: "nct6797 in6"}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: in7, name: "nct6797 in7"}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: in8, name: "nct6797 in8"}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: in9, name: "nct6797 in9"}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: in10, drop: true}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: in11, name: "nct6797 in11"}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: in12, name: "nct6797 in12"}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: in13, name: "nct6797 in13"}
  - {stack: pve-tiny, chip: platform_nct6775_2592, sensor: in14, name: "nct6797 in14"}
  # pve (Gigabyte B550 GAMING X V2, IT8689E via it87 DKMS). Board names from the
  # it87 project's Gigabyte config for SIV 0x61050607; scales are the config's
  # compute factors (raw in1-in3 all read 1.99 V). Cross-checked 2026-10-17.
  - {stack: pve, chip: platform_it87_2624, sensor: temp1, name: "System 1"}
  - {stack: pve, chip: platform_it87_2624, sensor: temp2, name: "System 2"}
  - {stack: pve, chip: platform_it87_2624, sensor: temp3, name: "CPU"}
  - {stack: pve, chip: platform_it87_2624, sensor: temp4, name: "PCIEX16"}
  - {stack: pve, chip: platform_it87_2624, sensor: temp5, name: "VRM MOS"}
