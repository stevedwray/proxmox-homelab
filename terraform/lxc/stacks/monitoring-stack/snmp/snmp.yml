# snmp_exporter module for the ASUSTOR NAS (docs/alerting/plan.md, Phase 0.8). Contains no secrets:
# the SNMPv3 credentials live in a separate auth file rendered at deploy time from OpenBao services/nas.
#
# OIDs are from ASUSTOR's own MIBs (ASUSTOR-SYSTEM-MIB, ASUSTOR-DISK-MIB; enterprise 1.3.6.1.4.1.44738),
# written by hand instead of generated, because the generator needs the MIBs on the build host.
# Text values (status, SMART, upgrade) become `*_info` metrics with the value as a label.
modules:
  asustor:
    timeout: 10s
    retries: 1
    walk:
      - 1.3.6.1.4.1.44738.1.2   # ADM version
      - 1.3.6.1.4.1.44738.1.7   # upgrade available
      - 1.3.6.1.4.1.44738.2     # hardware: model, cpu, fans, temperatures, memory
      - 1.3.6.1.4.1.44738.4     # disks
      - 1.3.6.1.4.1.44738.5     # volumes
    metrics:
      - name: asustor_adm_version_info
        oid: 1.3.6.1.4.1.44738.1.2
        type: DisplayString
        help: ADM version of the NAS
      - name: asustor_adm_upgrade_available_info
        oid: 1.3.6.1.4.1.44738.1.7
        type: DisplayString
        help: Whether a newer ADM can be installed ("Unavailable" means this is the latest)
      - name: asustor_model_info
        oid: 1.3.6.1.4.1.44738.2.1
        type: DisplayString
        help: NAS model name

      - name: asustor_cpu_usage_percent
        oid: 1.3.6.1.4.1.44738.2.3.1.2
        type: gauge
        help: CPU usage percentage
        indexes:
          - labelname: cpu
            type: gauge
      - name: asustor_fan_speed_rpm
        oid: 1.3.6.1.4.1.44738.2.4.1.2
        type: gauge
        help: Fan speed in rpm
        indexes:
          - labelname: fan
            type: gauge
      - name: asustor_temperature_cpu_celsius
        oid: 1.3.6.1.4.1.44738.2.5.1.2
        type: gauge
        help: CPU temperature in degrees Celsius
        indexes:
          - labelname: sensor
            type: gauge
      - name: asustor_temperature_system_celsius
        oid: 1.3.6.1.4.1.44738.2.5.1.3
        type: gauge
        help: System temperature in degrees Celsius
        indexes:
          - labelname: sensor
            type: gauge
      - name: asustor_memory_total
        oid: 1.3.6.1.4.1.44738.2.6.1.2
        type: gauge
        help: Total memory (units as reported by ADM)
        indexes:
          - labelname: memory
            type: gauge
      - name: asustor_memory_free
        oid: 1.3.6.1.4.1.44738.2.6.1.3
        type: gauge
        help: Free memory (units as reported by ADM)
        indexes:
          - labelname: memory
            type: gauge
      - name: asustor_memory_free_percent
        oid: 1.3.6.1.4.1.44738.2.6.1.4
        type: gauge
        help: Free memory percentage
        indexes:
          - labelname: memory
            type: gauge

      - name: asustor_disk_info
        oid: 1.3.6.1.4.1.44738.4.1.1.3
        type: DisplayString
        help: Disk model
        indexes:
          - labelname: diskIndex
            type: gauge
        lookups:
          - labels: [diskIndex]
            labelname: bay
            oid: 1.3.6.1.4.1.44738.4.1.1.2
            type: DisplayString
      - name: asustor_disk_type_info
        oid: 1.3.6.1.4.1.44738.4.1.1.4
        type: DisplayString
        help: Disk type (SATA, SSD)
        indexes:
          - labelname: diskIndex
            type: gauge
        lookups:
          - labels: [diskIndex]
            labelname: bay
            oid: 1.3.6.1.4.1.44738.4.1.1.2
            type: DisplayString
      - name: asustor_disk_status_info
        oid: 1.3.6.1.4.1.44738.4.1.1.5
        type: DisplayString
        help: Disk status as ADM reports it
        indexes:
          - labelname: diskIndex
            type: gauge
        lookups:
          - labels: [diskIndex]
            labelname: bay
            oid: 1.3.6.1.4.1.44738.4.1.1.2
            type: DisplayString
      - name: asustor_disk_smart_status_info
        oid: 1.3.6.1.4.1.44738.4.1.1.6
        type: DisplayString
        help: Disk SMART status as ADM reports it
        indexes:
          - labelname: diskIndex
            type: gauge
        lookups:
          - labels: [diskIndex]
            labelname: bay
            oid: 1.3.6.1.4.1.44738.4.1.1.2
            type: DisplayString
      - name: asustor_disk_temperature_celsius
        oid: 1.3.6.1.4.1.44738.4.1.1.7
        type: gauge
        help: Disk temperature in degrees Celsius
        indexes:
          - labelname: diskIndex
            type: gauge
        lookups:
          - labels: [diskIndex]
            labelname: bay
            oid: 1.3.6.1.4.1.44738.4.1.1.2
            type: DisplayString
      - name: asustor_disk_size_gigabytes
        oid: 1.3.6.1.4.1.44738.4.1.1.8
        type: gauge
        help: Disk size in gigabytes
        indexes:
          - labelname: diskIndex
            type: gauge
        lookups:
          - labels: [diskIndex]
            labelname: bay
            oid: 1.3.6.1.4.1.44738.4.1.1.2
            type: DisplayString

      - name: asustor_volume_info
        oid: 1.3.6.1.4.1.44738.5.1.1.3
        type: DisplayString
        help: Volume RAID level
        indexes:
          - labelname: volumeIndex
            type: gauge
        lookups:
          - labels: [volumeIndex]
            labelname: volume
            oid: 1.3.6.1.4.1.44738.5.1.1.2
            type: DisplayString
      - name: asustor_volume_status_info
        oid: 1.3.6.1.4.1.44738.5.1.1.4
        type: DisplayString
        help: Volume status as ADM reports it
        indexes:
          - labelname: volumeIndex
            type: gauge
        lookups:
          - labels: [volumeIndex]
            labelname: volume
            oid: 1.3.6.1.4.1.44738.5.1.1.2
            type: DisplayString
      - name: asustor_volume_filesystem_info
        oid: 1.3.6.1.4.1.44738.5.1.1.5
        type: DisplayString
        help: Volume filesystem
        indexes:
          - labelname: volumeIndex
            type: gauge
        lookups:
          - labels: [volumeIndex]
            labelname: volume
            oid: 1.3.6.1.4.1.44738.5.1.1.2
            type: DisplayString
      - name: asustor_volume_total_gigabytes
        oid: 1.3.6.1.4.1.44738.5.1.1.6
        type: gauge
        help: Volume size in gigabytes
        indexes:
          - labelname: volumeIndex
            type: gauge
        lookups:
          - labels: [volumeIndex]
            labelname: volume
            oid: 1.3.6.1.4.1.44738.5.1.1.2
            type: DisplayString
      - name: asustor_volume_free_gigabytes
        oid: 1.3.6.1.4.1.44738.5.1.1.7
        type: gauge
        help: Free space on the volume in gigabytes
        indexes:
          - labelname: volumeIndex
            type: gauge
        lookups:
          - labels: [volumeIndex]
            labelname: volume
            oid: 1.3.6.1.4.1.44738.5.1.1.2
            type: DisplayString
