# Monitoring stack (VictoriaMetrics + Grafana + Loki) — mgmt_seg zone
hostname: monitoring-stack
ip_address: "${lab_ip_monitoring}/24"
gateway: "${lab_gw_mgmt}"
dns_server: "${lab_gw_mgmt}"
network:
  zone: mgmt_seg
vmid: 20012
cores: 2
memory: 1536
swap: 1024
rootfs_size: 8
storage_profile: platform-default
docker_storage_size: "52G"
docker_mount:
  logical_name: docker-data
  path: /var/lib/docker
  size: "52G"
  backup_policy: include
  resize_control_plane: operational
  mutation_policy: grow-only
template_name: "debian-13.1-2-docker-template.tar.gz"
tags:
  - monitoring
  - grafana
  - loki
  - victoria-metrics
  - infrastructure
  - docker
depends_on:
  - harbor-stack
  - apt-cacher-stack
  - authentik-stack
  - proxy-stack
  - step-ca-stack
provides:
  - service: grafana-http
    port: 3000
    protocol: tcp
  - service: victoriametrics-http
    port: 8428
    protocol: tcp
  - service: loki-http
    port: 3100
    protocol: tcp
ansible_playbook: "deploy-monitoring-stack"
deployment_tier: platform
portainer_agent: false

# Environment-selected service IPs (sourced from TF_VAR_lab_ip_* env vars)
portainer_server_ip: "${lab_ip_portainer}"
registry_host: "{{ lookup('env', 'LAB_IP_HARBOR') | mandatory('LAB_IP_HARBOR env var is required') }}"
apt_cacher_host: "${lab_ip_apt_cacher}"
