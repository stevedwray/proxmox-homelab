apiVersion: homelab.gibbsgreatly.xyz/v1alpha1
kind: EdgeManifest
metadata:
  name: llm-gpu-edge
  stack: llm-gpu-stack
spec:
  routes:
    - name: llm-gpu
      host: llm.${LAB_DOMAIN}
      backend:
        type: url
        # Port 8080: the Nathanw llama.cpp fork (nathanw-llamacpp.service,
        # managed by ansible/00-initial-setup/framework-desktop-llamacpp-native.yml).
        # LM Studio (:8090) and Ollama are no longer run on framework --
        # docs/framework-ip-and-port/plan.md.
        url: http://${LAB_FQDN_FRAMEWORK}:8080
      dns:
        enabled: true
        target: ${LAB_IP_PROXY}
        ttl: 5m
      tls:
        resolver: letsencrypt
      auth:
        # Decision 8: llama-server is a machine API, not a browser login --
        # it uses its own native --api-key-file auth (now actually
        # configured, see LLM_GPU_STACK_API_KEY in secrets.common.enc.yaml)
        # instead of Authentik. Traefik terminates TLS and routes only; the
        # real auth boundary is the application layer.
        mode: none
    - name: llm-control
      host: llm-control.${LAB_DOMAIN}
      backend:
        type: url
        # llama-swap's model control page (docs/llama-swap/plan.md). It has
        # no login of its own; framework's llama-swap.nft lets only Traefik
        # reach :8099, so Authentik here is the only way in.
        url: http://${LAB_FQDN_FRAMEWORK}:8099
      dns:
        enabled: true
        target: ${LAB_IP_PROXY}
        ttl: 5m
      tls:
        resolver: letsencrypt
      auth:
        mode: forwardAuth
