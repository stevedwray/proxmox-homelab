# step-ca internal certificate authority — mgmt_seg zone
hostname: step-ca
ip_address: "${lab_ip_step_ca}/24"
gateway: "${lab_gw_mgmt}"
dns_server: "${lab_gw_mgmt}"
proxmox_node: pve-test
vmid: 152
cores: 1
memory: 512
swap: 256
rootfs_size: 8
rootfs_storage: infrastructure-containers
ostemplate: "storage-template:vztmpl/debian-13.1-2-docker-template.tar.gz"
tags:
  - step-ca
  - pki
  - infrastructure
depends_on:
  - apt-cacher-stack
provides:
  - service: step-ca-acme
    port: 443
    protocol: tcp

network:
  zone: mgmt_seg

ansible_playbook: "deploy-step-ca"
deployment_tier: platform
portainer_agent: false

# pve-test service IPs (sourced from .env via TF_VAR_lab_ip_*)
portainer_server_ip: "${lab_ip_portainer}"
registry_host: "{{ lookup('env', 'LAB_IP_HARBOR') | mandatory('LAB_IP_HARBOR env var is required') }}"
apt_cacher_host: "${lab_ip_apt_cacher}"
