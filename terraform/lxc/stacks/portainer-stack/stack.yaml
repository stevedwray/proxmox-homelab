# Portainer CE management server — mgmt_seg zone
hostname: portainer-stack
ip_address: "${lab_ip_portainer}/24"
gateway: "${lab_gw_mgmt}"
vmid: 20020
cores: 1
memory: 512
swap: 256
rootfs_size: 8
storage_profile: platform-default
docker_storage_size: "12G"
docker_mount:
  logical_name: docker-data
  path: /var/lib/docker
  size: "12G"
  backup_policy: include
  resize_control_plane: operational
  mutation_policy: grow-only
template_name: "debian-13.1-2-docker-template.tar.gz"
tags:
  - portainer
  - management
  - infrastructure
  - docker
depends_on: []
provides:
  - service: portainer-http
    port: 9000
    protocol: tcp
  - service: portainer-https
    port: 9443
    protocol: tcp
  - service: portainer-edge
    port: 8000
    protocol: tcp

network:
  zone: mgmt_seg

ansible_playbook: "deploy-portainer-stack"
deployment_tier: platform
apt_cacher_host: ""
dns_server: "${lab_ip_dns}"
portainer_agent: false

# Docker socket proxy — read-only Docker API endpoint for NetBox discovery
enable_docker_socket_proxy: true
docker_socket_proxy_bind_addr: "${lab_ip_portainer}"
docker_socket_proxy_listen_port: 2375
docker_socket_proxy_targets:
  - "${lab_ip_portainer}"
