# Portainer CE management server for pve-test — mgmt_seg zone
hostname: portainer-stack
ip_address: "${lab_ip_portainer}/24"
gateway: "${lab_gw_mgmt}"
proxmox_node: pve-test
vmid: 120
cores: 1
memory: 512
swap: 256
rootfs_size: 8
rootfs_storage: infrastructure-containers
docker_storage_size: "10G"
ostemplate: "storage-template:vztmpl/debian-13.1-2-docker-template.tar.gz"
tags:
  - portainer
  - management
  - infrastructure
  - docker
depends_on: []
provides:
  - service: portainer-http
    port: 9000
    protocol: tcp
  - service: portainer-https
    port: 9443
    protocol: tcp
  - service: portainer-edge
    port: 8000
    protocol: tcp

network:
  zone: mgmt_seg

ansible_playbook: "deploy-portainer-stack"
deployment_tier: platform
apt_cacher_host: ""
dns_server: "${lab_ip_dns}"
portainer_agent: false
