apiVersion: homelab.gibbsgreatly.xyz/v1alpha1
kind: EdgeManifest
metadata:
  name: portainer-edge
  stack: portainer-stack
  annotations:
    repo.auth.oidc.client_id_env: PORTAINER_OAUTH_CLIENT_ID
    repo.auth.oidc.client_secret_env: PORTAINER_OAUTH_CLIENT_SECRET
spec:
  routes:
    - name: portainer
      host: portainer.lab.gibbsgreatly.xyz
      backend:
        type: url
        url: http://${LAB_IP_PORTAINER}:9000
      dns:
        enabled: true
        target: ${LAB_IP_PROXY}
        ttl: 5m
      tls:
        resolver: letsencrypt
      auth:
        mode: oidc
