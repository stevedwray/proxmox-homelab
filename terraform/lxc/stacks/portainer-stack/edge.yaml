apiVersion: homelab.gibbsgreatly.xyz/v1alpha1
kind: EdgeManifest
metadata:
  name: portainer-edge
  stack: portainer-stack
spec:
  routes:
    - name: portainer
      host: portainer.lab.gibbsgreatly.xyz
      backend:
        type: url
        url: http://10.57.1.20:9000
      dns:
        enabled: true
        target: 10.57.2.10
        ttl: 5m
      tls:
        resolver: letsencrypt
      auth:
        mode: oidc
