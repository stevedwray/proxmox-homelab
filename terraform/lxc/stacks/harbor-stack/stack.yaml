# Harbor container registry stack — infra_seg zone
hostname: harbor-stack
ip_address: "${lab_ip_harbor}/24"
gateway: "${lab_gw_infra}"
dns_server: "${lab_gw_infra}"
network:
  zone: infra_seg
vmid: 40010
cores: 4
memory: 2048
swap: 2048
rootfs_size: 16
storage_profile: platform-default
docker_storage_size: "20G"
template_name: "debian-13.1-2-docker-template.tar.gz"
tags:
  - harbor
  - registry
  - infrastructure
  - docker
depends_on:
  []
provides:
  - service: registry-http
    port: 80
    protocol: tcp
  - service: registry-https
    port: 443
    protocol: tcp

# Dedicated data volume for Harbor registry blobs, PostgreSQL, Redis, and Trivy cache
extra_mount_path: "/var/lib/harbor"
extra_mount_size: "100G"
extra_mount_profile: durable-default
extra_mount:
  logical_name: harbor-data
  path: /var/lib/harbor
  size: "100G"
  profile: durable-default
  backup_policy: include
  resize_control_plane: provider
  mutation_policy: grow-only

# Environment-selected service IPs (sourced from TF_VAR_lab_ip_* env vars)
portainer_server_ip: "${lab_ip_portainer}"
registry_host: "{{ lookup('env', 'LAB_IP_HARBOR') | mandatory('LAB_IP_HARBOR env var is required') }}"
apt_cacher_host: ""  # No apt proxy on first Harbor deploy — pulls from Docker Hub directly

# Deployment
ansible_playbook: "deploy-harbor-stack"
deployment_tier: platform
portainer_agent: false
