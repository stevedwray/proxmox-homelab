# Harbor container registry stack — infra_seg zone (VLAN 40, 10.57.3.0/24)
hostname: harbor-stack
ip_address: "10.57.3.10/24"
gateway: "10.57.3.1"
proxmox_node: pve-test
network:
  zone: infra_seg
vmid: 121
cores: 4
memory: 2048
swap: 2048
rootfs_size: 16
rootfs_storage: infrastructure-containers
docker_storage_size: "20G"
ostemplate: "storage-template:vztmpl/debian-13.1-2-docker-template.tar.gz"
tags:
  - harbor
  - registry
  - infrastructure
  - docker
depends_on:
  []
provides:
  - service: registry-http
    port: 80
    protocol: tcp
  - service: registry-https
    port: 443
    protocol: tcp

# Dedicated data volume for Harbor registry blobs, PostgreSQL, Redis, and Trivy cache
extra_mount_path: "/var/lib/harbor"
extra_mount_size: "100G"
extra_mount_storage: infrastructure-containers

# pve-test service IPs (explicit — do not rely on variable defaults)
portainer_server_ip: "10.57.1.20"
registry_host: "{{ lookup('env', 'LAB_IP_HARBOR') | mandatory('LAB_IP_HARBOR env var is required') }}"
apt_cacher_host: ""  # No apt proxy on first Harbor deploy — pulls from Docker Hub directly

# Deployment
ansible_playbook: "deploy-harbor-stack"
deployment_tier: platform
portainer_agent: false
