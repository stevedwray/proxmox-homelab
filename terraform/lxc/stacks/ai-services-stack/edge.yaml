apiVersion: homelab.gibbsgreatly.xyz/v1alpha1
kind: EdgeManifest
metadata:
  name: ai-services-edge
  stack: ai-services-stack
  annotations:
    repo.auth.oidc.client_id_env: OPENWEBUI_OIDC_CLIENT_ID
    repo.auth.oidc.client_secret_env: OPENWEBUI_OIDC_CLIENT_SECRET
spec:
  routes:
    - name: openwebui
      host: openwebui.${LAB_DOMAIN}
      backend:
        type: url
        # LAB_IP_AI_SERVICES is this stack's own ai_seg LXC address (not
        # framework's flat-LAN IP -- see docs/ai-services-migration/plan.md's
        # "Addressing" section). OpenWebUI's container port 8080 is published
        # as host port 8081 here; :8080 is not reused, avoiding any
        # collision with llamacpp-router's own :8080 on framework.
        url: http://${LAB_IP_AI_SERVICES}:8081
      dns:
        enabled: true
        target: ${LAB_IP_PROXY}
        ttl: 5m
      tls:
        resolver: letsencrypt
      auth:
        mode: oidc
    - name: searxng
      host: searxng.${LAB_DOMAIN}
      backend:
        type: url
        # SearXNG's internal container port is published on the LXC at 8082.
        # This route is intentionally separate from OpenWebUI's Docker-only
        # `http://searxng:8080` query path.
        url: http://${LAB_IP_AI_SERVICES}:8082
      dns:
        enabled: true
        target: ${LAB_IP_PROXY}
        ttl: 5m
      tls:
        resolver: letsencrypt
      auth:
        # SearXNG has no accounts or RBAC. It is deliberately an
        # unauthenticated network service; individual browser preferences
        # are stored in the user's cookie, not in an Authentik identity.
        mode: none
    - name: deep-research
      host: deep-research.${LAB_DOMAIN}
      backend:
        type: url
        # Stage B (2026-09-21): now a real service inside ai-services-stack's
        # own Docker network, container port published on the LXC host at
        # 8090 -- same pattern as openwebui/searxng above. Replaces the
        # Stage A throwaway LXC (VMID 50014), which is disposed of, not
        # migrated -- see docs/deep-research/plan.md Phase 4.
        url: http://${LAB_IP_AI_SERVICES}:8090
      dns:
        enabled: true
        target: ${LAB_IP_PROXY}
        ttl: 5m
      tls:
        resolver: letsencrypt
      auth:
        # Step 2 of the deliberate two-step rollout is done: this scaffold
        # has no native OIDC support (unlike OpenWebUI above), so it uses
        # forwardAuth -- the same pattern already used by comfyui-stack,
        # netbox-stack, pentagi-stack, and proxy-stack. reconcile-edge.py's
        # existing Authentik discovery/reconcile step provisions the
        # provider/app automatically from this manifest.
        mode: forwardAuth
    - name: deep-research-files
      host: deep-research-files.${LAB_DOMAIN}
      backend:
        type: url
        # Stage B (2026-09-21): a small stdlib-only, non-root, restart-managed
        # Docker service (scripts/deep-research-files/serve.py), replacing
        # the Stage A stopgap (python3 -m http.server, run by hand as root
        # against the throwaway LXC). Read-only over the same named volume
        # deep-research writes to -- see docs/deep-research/plan.md Phase 4.
        url: http://${LAB_IP_AI_SERVICES}:8091
      dns:
        enabled: true
        target: ${LAB_IP_PROXY}
        ttl: 5m
      tls:
        resolver: letsencrypt
      auth:
        # Same forwardAuth posture as the deep-research route above --
        # report artifacts are as sensitive as the interactive UI itself,
        # not lower-trust.
        mode: forwardAuth
