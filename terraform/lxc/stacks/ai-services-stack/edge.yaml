apiVersion: homelab.gibbsgreatly.xyz/v1alpha1
kind: EdgeManifest
metadata:
  name: ai-services-edge
  stack: ai-services-stack
  annotations:
    repo.auth.oidc.client_id_env: OPENWEBUI_OIDC_CLIENT_ID
    repo.auth.oidc.client_secret_env: OPENWEBUI_OIDC_CLIENT_SECRET
spec:
  routes:
    - name: openwebui
      host: openwebui.${LAB_DOMAIN}
      backend:
        type: url
        # LAB_IP_AI_SERVICES is this stack's own ai_seg LXC address (not
        # framework's flat-LAN IP -- see docs/ai-services-migration/plan.md's
        # "Addressing" section). OpenWebUI's container port 8080 is published
        # as host port 8081 here; :8080 is not reused, avoiding any
        # collision with llamacpp-router's own :8080 on framework.
        url: http://${LAB_IP_AI_SERVICES}:8081
      dns:
        enabled: true
        target: ${LAB_IP_PROXY}
        ttl: 5m
      tls:
        resolver: letsencrypt
      auth:
        mode: oidc
    - name: searxng
      host: searxng.${LAB_DOMAIN}
      backend:
        type: url
        # SearXNG's internal container port is published on the LXC at 8082.
        # This route is intentionally separate from OpenWebUI's Docker-only
        # `http://searxng:8080` query path.
        url: http://${LAB_IP_AI_SERVICES}:8082
      dns:
        enabled: true
        target: ${LAB_IP_PROXY}
        ttl: 5m
      tls:
        resolver: letsencrypt
      auth:
        # SearXNG has no accounts or RBAC. It is deliberately an
        # unauthenticated network service; individual browser preferences
        # are stored in the user's cookie, not in an Authentik identity.
        mode: none
    - name: deep-research
      host: deep-research.${LAB_DOMAIN}
      backend:
        type: url
        # Points at the Stage A throwaway LXC (VMID 50014, deep-research-agent
        # --web mode on :8090), not a service inside ai-services-stack's own
        # Docker network -- see docs/deep-research/plan.md. This route lives
        # in ai-services-stack's edge.yaml as a matter of convenience (Stage B
        # will eventually run inside this stack for real); it does not imply
        # the backend is currently part of this stack.
        url: http://192.168.50.13:8090
      dns:
        enabled: true
        target: ${LAB_IP_PROXY}
        ttl: 5m
      tls:
        resolver: letsencrypt
      auth:
        # Step 1 of a deliberately two-step rollout (docs/deep-research/plan.md):
        # prove the Traefik route/DNS/TLS mechanism works on its own before
        # adding an Authentik OIDC app in a separate, smaller change. Do not
        # leave this as the final state -- see plan.md for the Authentik
        # follow-up.
        mode: none
    - name: deep-research-files
      host: deep-research-files.${LAB_DOMAIN}
      backend:
        type: url
        # Read-only `python3 -m http.server` over the Stage A LXC's workspace
        # dir (VMID 50014, port 8091), so final_report.md and run artifacts
        # are downloadable from a browser instead of only readable by an
        # operator with pct exec access. Same throwaway-prototype posture as
        # the `deep-research` route above -- see docs/deep-research/plan.md.
        url: http://192.168.50.13:8091
      dns:
        enabled: true
        target: ${LAB_IP_PROXY}
        ttl: 5m
      tls:
        resolver: letsencrypt
      auth:
        # Same deliberate step-1-of-2 posture as the `deep-research` route:
        # unauthenticated for now, Authentik OIDC deferred to the same
        # follow-up step covering both routes. Directory listing exposes
        # only research-report artifacts, not credentials or infra config.
        mode: none
