# OpenWebUI + SearXNG + deep-research-agent — ai_seg zone (pve / pve-test-vm).
# Standard Docker-based stack (matches monitoring-stack's shape: one
# container, multiple related Docker services in one compose file) --
# unlike llm-gpu-stack/comfyui-stack, this needs no GPU passthrough.
#
# Moved off framework.gibbsgreatly.xyz (bare-metal Ubuntu, the GPU host)
# onto this dedicated LXC: both OpenWebUI and SearXNG are pure network
# clients of the model-serving layer (llamacpp-router/ollama, which stay on
# framework), no GPU need of their own. See docs/ai-services-migration/plan.md
# for the full migration design, including why this is a rewrite rather than
# a reuse of the old pve-framework-era stack.yaml (stale addressing bug: it
# parameterized on what is now framework's own flat-LAN IP).
#
# deep-research (+ its deep-research-files sidecar) added 2026-09-21,
# folded in here rather than a new dedicated stack/LXC: same reasoning as
# above (thin network client of Framework, no local GPU/compute of its
# own), plus this zone already reaches both Framework and cve-mcp-server
# (mcp-utility-stack, also ai_seg). Replaces the Stage A throwaway LXC
# (VMID 50014), which is disposed of, not migrated. See
# docs/deep-research/plan.md Phase 4 for the full design.
#
# Memory 4096 -> 6144 (2026-09-16, recovered here 2026-09-22 -- see
# fix/deep-research-web-search-mcp): web-search-mcp (a headless-Chromium
# Playwright MCP server fronted by mcpo) needs real, persistent memory
# this LXC didn't carry before. This bump was applied live via `pct set`
# back on 2026-09-16 (terragrunt plan hit unrelated drift at the time) but
# was never brought back into this tracked file until now -- the live LXC
# has been running at 6144 the whole time this said 4096.

hostname: ai-services-stack
ip_address: "${lab_ip_ai_services}/24"
gateway: "${lab_gw_ai}"
dns_server: "${lab_gw_ai}"
network:
  zone: ai_seg
vmid: 50013
cores: 2
memory: 6144
swap: 1024
rootfs_size: 16
storage_profile: platform-default
docker_storage_size: "24G"
docker_mount:
  logical_name: docker-data
  path: /var/lib/docker
  size: "24G"
  backup_policy: include
  resize_control_plane: operational
  mutation_policy: grow-only
template_name: "debian-13.1-2-docker-template.tar.gz"
tags:
  - ai-services-stack
  - ai
  - openwebui
  - searxng
  - deep-research
  - web-search-mcp
  - docker
depends_on:
  - apt-cacher-stack
provides:
  - service: openwebui-http
    port: 8081
    protocol: tcp
  - service: deep-research-http
    port: 8090
    protocol: tcp
  - service: deep-research-files-http
    port: 8091
    protocol: tcp
ansible_playbook: "deploy-ai-services-stack"
deployment_tier: ai
portainer_agent: false

# Environment-selected service IPs (sourced from TF_VAR_lab_ip_* env vars)
portainer_server_ip: "${lab_ip_portainer}"
registry_host: "{{ lookup('env', 'LAB_IP_HARBOR') | mandatory('LAB_IP_HARBOR env var is required') }}"
apt_cacher_host: "${lab_ip_apt_cacher}"
