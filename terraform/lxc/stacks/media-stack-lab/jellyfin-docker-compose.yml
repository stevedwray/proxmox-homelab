# Split from the original combined docker-compose.yml 2026-09-04 into
# separate Portainer-controllable stacks, one per app (operator request).
# `name:` pins the Compose project name explicitly so it's identical
# regardless of whether this is invoked by Ansible (docker compose up -d
# from this directory) or by Portainer's own agent (stacks API) -- both
# resolve to the same project, so either one recognizes the other's
# already-running containers as up to date instead of conflicting.
# Must match the "Name" registered with Portainer (stack.yaml
# portainer_stacks) exactly -- confirmed live that Portainer's own
# compose invocation uses its own "Name" as the project, ignoring this
# file's name: key entirely, so a mismatch here causes a real container
# name conflict rather than a clean idempotent no-op.
name: media-stack-lab-jellyfin

services:
  jellyfin:
    image: ${REGISTRY_HOST}/lscr/linuxserver/jellyfin:10.11.11ubu2604-ls47
    container_name: media-stack-lab-jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Pacific/Auckland
      - JELLYFIN_PublishedServerUrl=https://jellyfin.${LAB_DOMAIN}
    volumes:
      - jellyfin-config:/config
      - /nas-media/video/movies:/movies
      - /nas-media/video/tv:/tv
      - /nas-media/music:/music
    devices:
      # AMD Radeon RX 6600 (pve's real GPU), passed through to the LXC via
      # device_passthrough in stack.yaml (root@pam-only, applied
      # out-of-band -- see that file). mode 0666 there means no
      # group-membership dependency here. card0 (the primary DRM node) is
      # included alongside the render node -- being tested live 2026-09-16
      # to see whether Mesa/radeonsi's buffer allocation needs it for
      # VAAPI surface creation (renderD128 alone got device init working
      # but not surface allocation: "Query format failed ... Cannot
      # allocate memory" on the hwupload filter).
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card0:/dev/dri/card0
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp
      - 1900:1900/udp
    group_add:
      - "44"
      - "104"
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    ulimits:
      # Docker's default memlock cap (8MB here, confirmed live) is far too
      # small for radeonsi's VAAPI buffer pinning -- confirmed live: ffmpeg
      # -hwaccel vaapi failed with "Query format failed ... Cannot allocate
      # memory" against this exact GPU until this was raised. Unlimited,
      # matching ffmpeg/VAAPI's own documented recommendation for this
      # class of error.
      memlock:
        soft: -1
        hard: -1

volumes:
  # External: preserves the volume created under the original combined
  # "media-stack-lab" project name -- migrated config/watch-history data
  # must not be orphaned by this split.
  jellyfin-config:
    external: true
    name: media-stack-lab_jellyfin-config
