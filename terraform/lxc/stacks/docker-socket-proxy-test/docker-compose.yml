version: "3.8"

services:
  nginx:
    image: ${REGISTRY_HOST}/dockerhub/library/nginx:stable-alpine
    container_name: docker-socket-proxy-test-nginx
    restart: unless-stopped

  whoami:
    image: ${REGISTRY_HOST}/dockerhub/traefik/whoami:latest
    container_name: docker-socket-proxy-test-whoami
    restart: unless-stopped

  redis:
    image: ${REGISTRY_HOST}/dockerhub/library/redis:alpine
    container_name: docker-socket-proxy-test-redis
    restart: unless-stopped
