# Graylog stack — production log platform on mgmt_seg (live on pve-test-vm and pve)
hostname: graylog-stack
ip_address: "${lab_ip_graylog}/24"
gateway: "${lab_gw_mgmt}"
dns_server: "${lab_gw_mgmt}"
network:
  zone: mgmt_seg
vmid: 20014
cores: 2
memory: 6144
swap: 1024
rootfs_size: 8
storage_profile: platform-default
docker_storage_size: "40G"
docker_mount:
  logical_name: docker-data
  path: /var/lib/docker
  size: "40G"
  backup_policy: include
  resize_control_plane: operational
  mutation_policy: grow-only
template_name: "debian-13.1-2-docker-template.tar.gz"
tags:
  - graylog
  - logging
  - infrastructure
  - docker
depends_on:
  - harbor-stack
  - apt-cacher-stack
  - step-ca-stack
provides:
  - service: graylog-http
    port: 9000
    protocol: tcp
  - service: graylog-syslog-udp
    port: 514
    protocol: udp
  - service: graylog-syslog-tcp
    port: 514
    protocol: tcp
ansible_playbook: "deploy-graylog-stack"
deployment_tier: platform
portainer_agent: false

# Environment-selected service IPs (sourced from TF_VAR_lab_ip_* env vars)
registry_host: "{{ lookup('env', 'LAB_IP_HARBOR') | mandatory('LAB_IP_HARBOR env var is required') }}"
apt_cacher_host: "${lab_ip_apt_cacher}"
