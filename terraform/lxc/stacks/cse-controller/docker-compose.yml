version: '3.8'
services:
  controller:
    image: harbor.lab.gibbsgreatly.xyz/dockerhub/library/python:3.10-slim
    container_name: cse-controller
    volumes:
      - /srv/cyberseceval:/srv/cyberseceval
    command: ["sleep", "infinity"]
    restart: unless-stopped

  worker:
    image: harbor.lab.gibbsgreatly.xyz/dockerhub/library/python:3.10-slim
    container_name: cse-controller-worker
    volumes:
      - /srv/cyberseceval:/srv/cyberseceval
    working_dir: /srv/cyberseceval/repo/PurpleLlama
    command:
      - /srv/cyberseceval/.venv/bin/celery
      - -A
      - cse_tasks
      - worker
      - --loglevel=INFO
      - --concurrency=1
    environment:
      - CELERY_BROKER_URL=redis://:${CSE_PANEL_REDIS_PASSWORD}@${LAB_IP_CSE_PANEL}:6379/0
      - CELERY_RESULT_BACKEND=redis://:${CSE_PANEL_REDIS_PASSWORD}@${LAB_IP_CSE_PANEL}:6379/1
      - PYTHONPATH=/srv/cyberseceval/config
    env_file:
      - /srv/cyberseceval/config/worker.env
    restart: unless-stopped

  pentest-worker:
    # live-panel-plan.md's increment-2: browser-launchable pentest-lab
    # runs. Separate venv/queue/failure-domain from `worker` above --
    # unrelated project, deliberately not sharing CyberSecEval's own
    # venv or Celery app.
    image: harbor.lab.gibbsgreatly.xyz/dockerhub/library/python:3.10-slim
    container_name: cse-controller-pentest-worker
    volumes:
      - /srv/pentest-worker:/srv/pentest-worker
    working_dir: /srv/pentest-worker/launcher
    command:
      - /srv/pentest-worker/.venv/bin/celery
      - -A
      - pentest_tasks
      - worker
      - --loglevel=INFO
      - --concurrency=1
      - --queues=pentest-worker
    environment:
      - CELERY_BROKER_URL=redis://:${CSE_PANEL_REDIS_PASSWORD}@${LAB_IP_CSE_PANEL}:6379/0
      - CELERY_RESULT_BACKEND=redis://:${CSE_PANEL_REDIS_PASSWORD}@${LAB_IP_CSE_PANEL}:6379/1
      - PENTEST_WORKER_SSH_KEY=/srv/pentest-worker/id_pentest_runner
    restart: unless-stopped

  pentest-viewer-proxy:
    # The panel reaches this stateless proxy through the existing narrow
    # mgmt_seg -> cse_seg rule. The runner supervisor is on the same subnet.
    image: harbor.lab.gibbsgreatly.xyz/dockerhub/library/python:3.10-slim
    container_name: cse-controller-pentest-viewer-proxy
    volumes:
      - /srv/pentest-worker:/srv/pentest-worker
    working_dir: /srv/pentest-worker/launcher
    command:
      - python3
      - viewer_proxy.py
      - --listen-host
      - "0.0.0.0"
      - --listen-port
      - "18810"
    ports:
      - "18810:18810"
    restart: unless-stopped
