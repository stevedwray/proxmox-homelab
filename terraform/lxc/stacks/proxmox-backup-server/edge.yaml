apiVersion: homelab.gibbsgreatly.xyz/v1alpha1
kind: EdgeManifest
metadata:
  name: proxmox-backup-server-edge
  stack: proxmox-backup-server
spec:
  routes:
    - name: pbs
      host: pbs.${LAB_DOMAIN}
      backend:
        type: url
        url: https://192.168.1.12:8007
      dns:
        enabled: true
        target: ${LAB_IP_PROXY}
        ttl: 5m
      tls:
        resolver: letsencrypt
      auth:
        mode: none
