# Image tags below were the current, real, pullable stable version for
# each registry as of 2026-09-12 (verified against each registry's raw
# tag API directly, not a paraphrased/cached summary -- see
# docs/torrent-stack-modernization/plan.md's torrent-lab-03-compose
# step for the verification method and one real discrepancy found:
# Jellyseerr's GitHub releases show v3.4.1, but neither Docker Hub nor
# GHCR has ever published a container image past 2.7.3 -- pinned to
# what's actually pullable, not the source release number). These will
# drift -- re-verify against the registry before bumping any of them,
# never just move to :latest.
name: torrent-stack-lab

services:
  gluetun:
    image: ${REGISTRY_HOST}/dockerhub/qmcgaw/gluetun:v3.41.3
    container_name: torrent-stack-lab-gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      - VPN_TYPE=wireguard
      - VPN_SERVICE_PROVIDER=custom
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      - HEALTH_TARGET_ADDRESS=8.8.8.8
      - HEALTH_VPN_DURATION_INITIAL=10s
      - DOT=off
      - DNS_PLAINTEXT_ADDRESS=1.1.1.1
      - TZ=Pacific/Auckland
    volumes:
      - gluetun-config:/gluetun
      - /opt/stacks/torrent-stack-lab/gluetun/wireguard/wg0.conf:/run/secrets/wg0.conf:ro
    ports:
      - "8080:8888"
      - "6881:6881/tcp"
      - "6881:6881/udp"
    restart: unless-stopped

  qbittorrent:
    image: ${REGISTRY_HOST}/lscr/linuxserver/qbittorrent:5.2.3_v2.0.14-ls475
    container_name: torrent-stack-lab-qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Pacific/Auckland
      - WEBUI_PORT=8888
    volumes:
      - qbittorrent-config:/config
      - /incoming:/downloads
    restart: unless-stopped

  flaresolverr:
    image: ${REGISTRY_HOST}/ghcr/flaresolverr/flaresolverr:v3.5.0
    container_name: torrent-stack-lab-flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Pacific/Auckland
    restart: unless-stopped

  prowlarr:
    image: ${REGISTRY_HOST}/lscr/linuxserver/prowlarr:2.5.2.5491-ls159
    container_name: torrent-stack-lab-prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Pacific/Auckland
    volumes:
      - prowlarr-config:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  radarr:
    image: ${REGISTRY_HOST}/lscr/linuxserver/radarr:6.3.0.10514-ls315
    container_name: torrent-stack-lab-radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Pacific/Auckland
    volumes:
      - radarr-config:/config
      - /nas-media/video/movies:/movies
      - /nas-media/video/movies:/media/movies
      - /incoming:/downloads
    ports:
      - "7878:7878"
    restart: unless-stopped

  sonarr:
    image: ${REGISTRY_HOST}/lscr/linuxserver/sonarr:4.0.19.2979-ls323
    container_name: torrent-stack-lab-sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Pacific/Auckland
    volumes:
      - sonarr-config:/config
      - /nas-media/video/tv:/tv
      - /nas-media/video/tv:/media/tv
      - /incoming:/downloads
    ports:
      - "8989:8989"
    restart: unless-stopped

  lidarr:
    image: ${REGISTRY_HOST}/lscr/linuxserver/lidarr:3.1.0.4875-ls41
    container_name: torrent-stack-lab-lidarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Pacific/Auckland
    volumes:
      - lidarr-config:/config
      - /nas-media/music:/music
      - /nas-media/music:/media/music
      - /incoming:/downloads
    ports:
      - "8686:8686"
    restart: unless-stopped

  jellyseerr:
    image: ${REGISTRY_HOST}/ghcr/fallenbagel/jellyseerr:2.7.3
    container_name: torrent-stack-lab-jellyseerr
    environment:
      - LOG_LEVEL=info
      - TZ=Pacific/Auckland
    volumes:
      - jellyseerr-config:/app/config
    ports:
      - "5055:5055"
    restart: unless-stopped

volumes:
  gluetun-config:
  qbittorrent-config:
  prowlarr-config:
  radarr-config:
  sonarr-config:
  lidarr-config:
  jellyseerr-config:
