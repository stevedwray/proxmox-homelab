# Disposable validation container for the isolated zone (bridge, no inbound policy)
hostname: net-isolated-01
ip_address: "192.168.1.73/24"
gateway: "192.168.1.1"
dns_server: "192.168.1.1"
vmid: 136
cores: 1
memory: 512
rootfs_size: 4
storage_profile: validation-small
docker_storage_size: "4G"
docker_mount:
  logical_name: docker-data
  path: /var/lib/docker
  size: "4G"
  backup_policy: include
  resize_control_plane: operational
  mutation_policy: grow-only
template_name: "debian-13.1-2-docker-template.tar.gz"
