# Disposable vulnerable target for the controlled PentAGI model comparison.
# It is intentionally in the already-contained pentest_seg, never the LAN.
hostname: harness-target-pve
ip_address: 192.168.70.12/24
gateway: "${lab_gw_pentest}"
dns_server: "${lab_gw_pentest}"
network:
  zone: pentest_seg
# 70010/70011 are PentAGI/Greenbone; keep this target in their dedicated
# PentAGI workload range rather than the AI-service 500xx range.
vmid: 70012
cores: 2
memory: 2048
swap: 512
rootfs_size: 8
storage_profile: platform-default
docker_storage_size: 10G
template_name: debian-13.1-2-docker-template.tar.gz
tags:
  - docker
  - pentest
  - target
  - disposable
depends_on: []
provides:
  - service: struts2
    port: 8080
    protocol: tcp
  - service: redis
    port: 6379
    protocol: tcp
ansible_playbook: deploy-harness-target
deployment_tier: apps
portainer_agent: false
