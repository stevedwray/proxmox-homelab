apiVersion: homelab.gibbsgreatly.xyz/v1alpha1
kind: EdgeManifest
metadata:
  name: greenbone-edge
  stack: greenbone-stack
spec:
  routes:
    - name: greenbone
      host: gvm.${LAB_DOMAIN}
      backend:
        type: url
        # Port 8080, not 443 or 9392. Confirmed live: upstream's generated
        # nginx config hardcodes "listen 9392; return 301 https://...443"
        # (gvm-config's nginx-config template), so 9392 is NOT a usable
        # plain-HTTP passthrough — just an HTTP->HTTPS redirect stub. gsad
        # itself has no ports: mapping in the compose (reachable only via
        # nginx's internal Docker network), and the static SPA is served by
        # nginx from gsa_data_vol, not by gsad — so gsad can't be exposed
        # directly as a substitute either. deploy-greenbone-stack.yml adds
        # a second nginx server block (port 8080, plain HTTP, mirrors the
        # upstream 443 block's location/proxy_pass logic) specifically for
        # this route, avoiding the self-signed backend cert Traefik would
        # otherwise need to trust (this EdgeManifest schema has no
        # insecureSkipVerify/serversTransport support — confirmed by
        # reading render-edge-traefik.py directly).
        url: http://${LAB_IP_GREENBONE}:8080
      dns:
        enabled: true
        target: ${LAB_IP_PROXY}
        ttl: 5m
      tls:
        resolver: letsencrypt
      auth:
        # GVM/gsad has no native OIDC/SSO client, same reasoning as
        # pentagi-stack's edge.yaml — forwardAuth gates the whole UI at
        # Traefik's Authentik middleware; GVM's own local admin login
        # stays as defense-in-depth behind that gate.
        mode: forwardAuth
