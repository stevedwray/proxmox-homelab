# Example input for terraform/lxc/scaffold-stack.sh <stack-name>.
#
# Copy this to terraform/lxc/stacks/<stack-name>/stack-request.yaml and
# fill it in before running the scaffolder. This file is scaffolding
# input only — not part of the stack's final tracked file set. Delete it
# once the stack is scaffolded and validated, or keep it as a record of
# original intent; either is fine.
#
# This example reproduces the minecraft-stack exemplar
# (docs/stack-lifecycle-refactor/stage-10-minecraft-exemplar.md).

stack_yaml:
  hostname: minecraft-stack
  ip_address: "192.168.1.60/24"
  gateway: "192.168.1.1"
  dns_server: "192.168.1.1"
  vmid: 170
  cores: 2
  memory: 2048
  swap: 512
  rootfs_size: 8
  storage_profile: platform-default
  docker_storage_size: "10G"
  template_name: "debian-13.1-2-docker-template.tar.gz"
  tags:
    - docker
    - minecraft
    - game
  depends_on: []
  provides:
    - service: minecraft-java
      port: 25565
      protocol: tcp
  ansible_playbook: deploy-minecraft-stack
  deployment_tier: apps
  portainer_agent: false

compose_requirements: |
  Single service, itzg/minecraft-server, pinned to the stable-java21 tag
  (not latest). EULA: "TRUE" in environment: (required by the image
  itself, must be uppercase TRUE). Port 25565/tcp only (not bare
  25565:25565, not UDP). World data (/data) persisted via a named Docker
  volume declared in a top-level volumes: block — not a relative bind
  mount like ./data. container_name: minecraft-stack-minecraft.
  restart: unless-stopped.

compose_forbidden: |
  a custom top-level networks: block, a pinned VERSION environment
  variable, difficulty/MOTD/player-count/query environment variables, or
  a separately mounted server.properties file. This is a deliberately
  minimal first pass.

contract_facts: |
  - Purpose: dedicated Minecraft Java Edition server, deliberately
    decoupled from the legacy gaming-stack LXC (fresh world, no data
    migration)
  - Zone: plain LAN bridge (vmbr0), no SDN zone for this pass
  - IP: 192.168.1.60/24
  - Gateway: 192.168.1.1
  - VMID: 170
  - Inputs: none beyond platform defaults
  - Provides: minecraft-java, port 25565, protocol tcp
  - Dependencies: none
  - Persistent state: /data (world save) via a named Docker volume,
    backed by docker_storage (10 GiB)
  - Nothing depends on this stack
  - What must not be edited casually: the itzg/minecraft-server image
    requires EULA=TRUE or it will not start
  - Playbook: deploy-minecraft-stack, using docker_base plus a compose
    file
  - Implementation files: terraform/lxc/stacks/minecraft-stack/stack.yaml
    (new), terraform/lxc/stacks/minecraft-stack/terragrunt.hcl (new),
    terraform/lxc/stacks/minecraft-stack/inventory.yml (generated by
    terragrunt apply, do not hand-edit),
    terraform/lxc/ansible/playbooks/deploy-minecraft-stack.yml (new)

# Literal playbook content — kept as hand-authored input rather than
# generated, same as stack.yaml: this file's correctness (hosts: all, not
# localhost; the right roles; check-mode guards) matters more than saving
# the few minutes it'd take to write by hand, and every attempt at having
# an agent design this from scratch produced a structurally broken result.
playbook_content: |
  ---
  - name: Deploy Minecraft stack
    hosts: all
    become: true
    gather_facts: true

    vars:
      stack_name: minecraft-stack
      minecraft_compose_content: "{{ lookup('file', '../../stacks/' + stack_name + '/docker-compose.yml') }}"
      minecraft_stack_dir: "/opt/stacks/{{ stack_name }}"

    roles:
      - lxc_base
      - docker_base

    tasks:
      - name: Create stack directory
        ansible.builtin.file:
          path: "{{ minecraft_stack_dir }}"
          state: directory
          mode: "0755"

      - name: Write docker-compose.yml to stack directory
        ansible.builtin.copy:
          content: "{{ minecraft_compose_content }}"
          dest: "{{ minecraft_stack_dir }}/docker-compose.yml"
          mode: "0644"

      - name: Validate docker compose configuration
        ansible.builtin.command:
          cmd: docker compose config
          chdir: "{{ minecraft_stack_dir }}"
        register: compose_config_check
        changed_when: false
        when: not ansible_check_mode

      - name: Start Minecraft server via docker compose
        ansible.builtin.command:
          cmd: docker compose up -d
          chdir: "{{ minecraft_stack_dir }}"
        register: compose_up
        changed_when: "'Started' in compose_up.stdout or 'Created' in compose_up.stdout"
        when: not ansible_check_mode

      - name: Wait for Minecraft server to accept TCP connections
        ansible.builtin.wait_for:
          host: "{{ ansible_host }}"
          port: 25565
          timeout: 120
        when: not ansible_check_mode
        ignore_errors: "{{ ansible_check_mode }}"
