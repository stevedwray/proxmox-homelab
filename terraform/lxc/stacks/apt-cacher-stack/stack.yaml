# apt-cacher-ng transparent apt proxy — infra_seg zone (VLAN 40, 10.57.3.0/24)
hostname: apt-cacher-stack
ip_address: "10.57.3.11/24"
gateway: "10.57.3.1"
proxmox_node: pve-test
network:
  zone: infra_seg
vmid: 142
cores: 1
memory: 256
swap: 128
rootfs_size: 8
rootfs_storage: infrastructure-containers
docker_storage_size: "20G"
ostemplate: "storage-template:vztmpl/debian-13.1-2-docker-template.tar.gz"
tags:
  - apt-cache
  - infrastructure
  - build
depends_on: []
provides:
  - service: apt-proxy
    port: 3142
    protocol: tcp
ansible_playbook: "deploy-apt-cacher-stack"
portainer_agent: false
