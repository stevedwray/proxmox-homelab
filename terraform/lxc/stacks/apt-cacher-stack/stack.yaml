# apt-cacher-ng transparent apt proxy — infra_seg zone (VLAN 40, 10.57.3.0/24)
hostname: apt-cacher-stack
ip_address: "10.57.3.11/24"
gateway: "10.57.3.1"
proxmox_node: pve-test
network:
  zone: infra_seg
vmid: 142
cores: 1
memory: 256
swap: 128
rootfs_size: 8
rootfs_storage: infrastructure-containers
docker_storage_size: "20G"
ostemplate: "storage-template:vztmpl/debian-13.1-2-docker-template.tar.gz"
tags:
  - apt-cache
  - infrastructure
  - build
depends_on: []
provides:
  - service: apt-proxy
    port: 3142
    protocol: tcp
ansible_playbook: "deploy-apt-cacher-stack"
deployment_tier: platform
portainer_agent: false

# pve-test service IPs (explicit — do not rely on variable defaults)
portainer_server_ip: "10.57.1.20"
registry_host: "{{ lookup('env', 'LAB_IP_HARBOR') | mandatory('LAB_IP_HARBOR env var is required') }}"
apt_cacher_host: ""  # This container IS the apt-cacher; no self-proxy
