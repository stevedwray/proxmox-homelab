# NetBox IPAM/DCIM stack — test instance for live validation of integration scripts
# Deployed on pve-test, registered to prod Portainer as environment 'netbox-stack-test'.
hostname: netbox-stack-test
ip_address: "192.168.1.31/24"
vmid: 142
cores: 2
memory: 4096
swap: 4096
rootfs_size: 8
rootfs_storage: infrastructure-containers
docker_storage_size: "32G"
ostemplate: "storage-template:vztmpl/debian-13.1-2-docker-template.tar.gz"
tags:
  - netbox
  - test
  - docker
keyctl: true

# Deployment
ansible_playbook: "deploy-netbox-stack"
portainer_agent: true
app_stack_name: "netbox"
