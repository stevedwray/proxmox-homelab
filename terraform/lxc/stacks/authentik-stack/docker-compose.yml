# Authentik identity provider stack
# All images are routed through Harbor proxy cache at ${REGISTRY_HOST}.
# REGISTRY_HOST is written to .env by deploy-authentik-stack.yml.
# Service addressing is environment-driven via stack.yaml and the selected LAB_IP_* overlay.

services:
  postgresql:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: "${AUTHENTIK_POSTGRES_PASSWORD}"
    volumes:
      - authentik-postgresql:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - redis-server --save 60 1 --loglevel warning
    volumes:
      - authentik-redis:/data

  server:
    image: ghcr.io/goauthentik/server:2024.12.3
    restart: unless-stopped
    command: server
    env_file:
      - .env
    environment: &authentik-env
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: "${AUTHENTIK_POSTGRES_PASSWORD}"
      AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY}"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
    depends_on:
      - postgresql
      - redis
    ports:
      - "9000:9000"
    volumes:
      - authentik-media:/media
      - authentik-custom-templates:/templates
      - authentik-certs:/certs

  direct_tls:
    image: docker.io/library/nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "9443:9443"
    volumes:
      - ./certs/direct:/certs/direct:ro
      - ./nginx/direct-tls.conf:/etc/nginx/conf.d/default.conf:ro

  worker:
    image: ghcr.io/goauthentik/server:2024.12.3
    restart: unless-stopped
    command: worker
    env_file:
      - .env
    environment: *authentik-env
    depends_on:
      - postgresql
      - redis
    volumes:
      - authentik-media:/media
      - authentik-custom-templates:/templates
      - authentik-certs:/certs

volumes:
  authentik-certs:
  authentik-custom-templates:
  authentik-media:
  authentik-postgresql:
  authentik-redis:
