# Authentik identity provider stack
# All images are routed through Harbor proxy cache at 192.168.1.10.

services:
  postgresql:
    image: 192.168.1.10/dockerhub/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: "${AUTHENTIK_POSTGRES_PASSWORD}"
    volumes:
      - authentik-postgresql:/var/lib/postgresql/data

  redis:
    image: 192.168.1.10/dockerhub/library/redis:alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - redis-server --save 60 1 --loglevel warning
    volumes:
      - authentik-redis:/data

  server:
    image: 192.168.1.10/ghcr/goauthentik/server:2024.12.3
    restart: unless-stopped
    command: server
    environment: &authentik-env
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: "${AUTHENTIK_POSTGRES_PASSWORD}"
      AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY}"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
    depends_on:
      - postgresql
      - redis
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - authentik-media:/media
      - authentik-custom-templates:/templates
      - authentik-certs:/certs

  worker:
    image: 192.168.1.10/ghcr/goauthentik/server:2024.12.3
    restart: unless-stopped
    command: worker
    environment: *authentik-env
    depends_on:
      - postgresql
      - redis
    volumes:
      - authentik-media:/media
      - authentik-custom-templates:/templates
      - authentik-certs:/certs

volumes:
  authentik-certs:
  authentik-custom-templates:
  authentik-media:
  authentik-postgresql:
  authentik-redis:
