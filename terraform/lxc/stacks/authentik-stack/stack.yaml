# Authentik identity provider — mgmt_seg zone
hostname: authentik-stack
ip_address: "10.57.1.10/24"
gateway: "10.57.1.1"
proxmox_node: pve-test
vmid: 150
cores: 2
memory: 2048
swap: 1024
rootfs_size: 8
rootfs_storage: infrastructure-containers
docker_storage_size: "20G"
ostemplate: "storage-template:vztmpl/debian-13.1-2-docker-template.tar.gz"
tags:
  - authentik
  - identity
  - infrastructure
  - docker
depends_on:
  - harbor-stack
provides:
  - service: authentik-http
    port: 9000
    protocol: tcp
  - service: authentik-https
    port: 9443
    protocol: tcp

network:
  zone: mgmt_seg

ansible_playbook: "deploy-authentik-stack"
deployment_tier: platform
portainer_agent: false

# pve-test service IPs (explicit — do not rely on variable defaults)
portainer_server_ip: "10.57.1.20"
registry_host: "10.57.3.10"
apt_cacher_host: "10.57.3.11"
