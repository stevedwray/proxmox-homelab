# Authentik identity provider — mgmt_seg zone
hostname: authentik-stack
ip_address: "${lab_ip_authentik}/24"
gateway: "${lab_gw_mgmt}"
dns_server: "${lab_gw_mgmt}"
proxmox_node: pve-test
vmid: 150
cores: 2
memory: 2048
swap: 1024
rootfs_size: 8
storage_profile: platform-default
docker_storage_size: "20G"
template_name: "debian-13.1-2-docker-template.tar.gz"
tags:
  - authentik
  - identity
  - infrastructure
  - docker
depends_on:
  - harbor-stack
provides:
  - service: authentik-http
    port: 9000
    protocol: tcp
  - service: authentik-https
    port: 9443
    protocol: tcp

network:
  zone: mgmt_seg

ansible_playbook: "deploy-authentik-stack"
deployment_tier: platform
portainer_agent: false

# pve-test service IPs (sourced from .env via TF_VAR_lab_ip_*)
portainer_server_ip: "${lab_ip_portainer}"
registry_host: "{{ lookup('env', 'LAB_IP_HARBOR') | mandatory('LAB_IP_HARBOR env var is required') }}"
apt_cacher_host: "${lab_ip_apt_cacher}"
