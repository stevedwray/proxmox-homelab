# Authentik identity provider — mgmt_seg zone
hostname: authentik-stack
ip_address: "${lab_ip_authentik}/24"
gateway: "${lab_gw_mgmt}"
dns_server: "${lab_gw_mgmt}"
vmid: 20010
cores: 2
memory: 3072
swap: 1024
rootfs_size: 8
storage_profile: platform-default
docker_storage_size: "22G"
docker_mount:
  logical_name: docker-data
  path: /var/lib/docker
  size: "22G"
  backup_policy: include
  resize_control_plane: operational
  mutation_policy: grow-only
template_name: "debian-13.1-2-docker-template.tar.gz"
tags:
  - authentik
  - identity
  - infrastructure
  - docker
depends_on:
  - harbor-stack
  - step-ca-stack
provides:
  - service: authentik-http
    port: 9000
    protocol: tcp
  - service: authentik-https
    port: 9443
    protocol: tcp

network:
  zone: mgmt_seg

ansible_playbook: "deploy-authentik-stack"
deployment_tier: platform
portainer_agent: false
register_portainer_env: true

# Docker socket proxy — read-only Docker API endpoint for NetBox discovery
enable_docker_socket_proxy: true
docker_socket_proxy_bind_addr: "${lab_ip_authentik}"
docker_socket_proxy_listen_port: 2375
docker_socket_proxy_targets:
  - "${lab_ip_authentik}"

# Environment-selected service IPs (sourced from TF_VAR_lab_ip_* env vars)
portainer_server_ip: "${lab_ip_portainer}"
registry_host: "{{ lookup('env', 'LAB_IP_HARBOR') | mandatory('LAB_IP_HARBOR env var is required') }}"
apt_cacher_host: "${lab_ip_apt_cacher}"
