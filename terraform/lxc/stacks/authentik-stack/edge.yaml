apiVersion: homelab.gibbsgreatly.xyz/v1alpha1
kind: EdgeManifest
metadata:
  name: authentik-edge
  stack: authentik-stack
spec:
  routes:
    - name: authentik
      host: authentik.${LAB_DOMAIN}
      # No Pangolin route of any kind (public or private_host) -- operator
      # decision, 2026-09-25: Authentik must never gain any externally
      # reachable path, direct or via Pangolin. See
      # docs/nextcloud-stack/README.md "Authentik-via-Pangolin retired".
      backend:
        type: url
        url: http://${LAB_IP_AUTHENTIK}:9000
      dns:
        enabled: true
        target: ${LAB_IP_PROXY}
        ttl: 5m
      tls:
        resolver: letsencrypt
      auth:
        mode: none
