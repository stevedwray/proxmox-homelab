api:
  # Framework's Nathanw llama.cpp endpoint, brought back up and IaC-backed
  # by docs/deep-research/plan.md Phase 0 (2026-09-21). Do not hard-code a
  # model ID beyond what's actually loaded there. Overridden at container
  # runtime via OPENAI_API_BASE (config.py always prefers the env var) --
  # this value is only the fallback if that's ever unset.
  openai_base_url: http://framework.gibbsgreatly.xyz:8080/v1
  openai_model: local-model
settings:
  enable_thinking: false
  concurrency:
    # Started at 1 for the first Stage A runs (plan.md 2.3: "start with one
    # searcher at a time, then test two concurrent searchers"), with intent
    # to "raise only after measuring throughput/quality" -- never raised
    # since. Found live 2026-10-03: this is a SINGLE global asyncio.Semaphore
    # shared across the ENTIRE agent tree (Orchestrator delegations, every
    # Searcher's own Analyzer delegations, all of it -- orchestrator.py:145,
    # one `sem` object passed to all three levels), not a per-level limit.
    # Traced a real run's final report incorrectly saying "Companies House:
    # not verified" despite investigate_company succeeding instantly all 3
    # times it was called: the Searcher that got the good data was simply
    # queued behind 13 other subagents (confirmed via session log, all
    # serialized one-at-a-time) for 20+ minutes, and the Orchestrator's own
    # "has this angle hung" wall-clock heuristic gave up on it, discarding
    # real results that were already in hand. Raised to 3 -- the Framework
    # llama.cpp backend has 4 parallel inference slots (confirmed via its
    # own /slots endpoint), so this leaves headroom rather than maxing out
    # the backend, while cutting most of the pure-serialization wall-clock
    # cost that was dominating total run time (a 69-minute run for what
    # should be a 10-15 minute multi-angle task).
    max_concurrent_tasks: 3
    # Found 2026-10-02: a live run hung 52+ minutes with zero progress (a
    # stalled MCP tool connection with no session-level timeout -- see
    # docs/maltego-integration/README.md). orchestrator.py's subagent
    # streaming loop now aborts with a clear error if no update arrives
    # within this many seconds, instead of waiting forever. Default (code
    # fallback, applies even if this key is absent -- see
    # reference_deep_research_config_template_staleness) is 300s, set
    # above the worst documented single-tool-call latency (web_search
    # measured at 145-147s under load).
    subagent_idle_timeout_seconds: 300
  quotas:
    # IMPORTANT (scaffold behavior, not a plan.md assumption): these quotas
    # are GLOBAL, shared across every agent instance using that tool name --
    # NOT per-agent-instance. plan.md's original quota table described
    # "max_searches: 5 # per searcher instance", which does not match how
    # this scaffold's tools/core.py check_quota() actually works (a single
    # shared counter keyed by tool name). Numbers below are sized as pools
    # covering up to ~4 concurrent Searchers, not 5-per-searcher literally --
    # see docs/deep-research/current-state.md for this finding, captured
    # during Stage A implementation.
    # Found 2026-10-02, same investigation as fetch_url_to_workspace below:
    # this pool is consumed roughly 1:1 with fetch_url_to_workspace (each
    # fetched page gets delegated to an Analyzer), plus the Orchestrator's
    # own initial angle delegations. Raising fetch_url_to_workspace alone
    # (16->32) without raising this proportionally would just move the
    # same starvation failure onto this quota's name instead of actually
    # fixing it. Doubled to match.
    delegate_tasks: 40        # shared by Orchestrator's angle delegations AND every Searcher's Analyzer delegations
    web_search: 60            # shared across all Searcher instances -- bumped from 20 2026-09-22: pool was
                              # exhausting after ~1 subagent's worth of searches, starving every other angle
                              # and silently degrading multi-angle reports to single-angle. Tavily usage
                              # confirmed live at 41/1500 monthly searches, so plenty of headroom for this.
    # Found 2026-10-02 (docs/maltego-integration/README.md Phase 3c): left
    # at its original value while web_search's identical sibling quota was
    # already bumped 20->60 on 2026-09-22 for this exact documented reason
    # ("pool was exhausting after ~1 subagent's worth... starving every
    # other angle"). With max_concurrent_tasks: 1, Searchers run
    # sequentially, not concurrently -- but the pool is still SHARED, so
    # one Searcher using more than its fair share on a harder angle can
    # starve every later sequential Searcher's fetches entirely, exactly
    # matching a real observed failure: "All three Searcher delegations
    # failed... exceeding fetch_url_to_workspace quota." Doubled, not
    # tripled like web_search -- a fetch is real disk/processing cost per
    # call, unlike a search API call backed by a 1500/month external quota
    # with "plenty of headroom."
    fetch_url_to_workspace: 32
    write_workspace_file: 5   # Orchestrator only writes final_report.md (and maybe todos state)
    read_workspace_file:
      limit: 40
      rules:
        max_lines: 300
    grep_workspace_file:
      limit: 40
      rules:
        max_matches: 10
  enable_conversational_memory: false
  # Enabled for Stage B (2026-09-21): /new, /sessions, /resume let an
  # overnight headless run be inspected afterward without keeping a
  # browser tab open the whole time -- see docs/deep-research/plan.md
  # Phase 5, point 2.
  enable_session_persistence: true
  workspace:
    # Disk, not memory: Stage A needs to inspect fetched pages and the final
    # report after a run, per plan.md's workspace/source model (runs/<run-id>/).
    type: disk
    dir: "~/.{APP_NAME}/workspace"
    session_isolation: true
    required_artifact: "final_report.md"
  permissions:
    remove_workspace_file: require_approval
