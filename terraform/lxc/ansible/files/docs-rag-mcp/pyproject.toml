[project]
name = "docs-rag-mcp"
version = "0.1.0"
description = "MCP server exposing semantic search over this repo's documentation, backed by pgvector + nomic-embed-text via Ollama. See docs/coding-stack/plan.md."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.6.0",
    "asyncpg>=0.30.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docs_rag_mcp"]
