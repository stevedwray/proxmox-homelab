. {
    # Serve ${LAB_DOMAIN} from zone file
    file /etc/coredns/lab.zone ${LAB_DOMAIN}

    # Non-lab queries: prefer MikroTik, then fall back to public resolvers.
    # This keeps recursion available during upstream/router instability.
    forward . ${LAB_GW_MGMT} 1.1.1.1 8.8.8.8 {
        policy sequential
        health_check 2s
    }

    # Logging (optional, disable for quiet operation)
    log

    # Health check endpoint (for monitoring)
    health

    # Prometheus metrics (optional)
    prometheus 0.0.0.0:9153
}
