---
- name: Configure Docker base
  hosts: all
  become: true
  gather_facts: true
  vars:
    monitoring_lab_domain: "{{ lookup('env', 'LAB_DOMAIN') | default('lab.gibbsgreatly.xyz', true) }}"
    monitoring_lab_fqdn_harbor: "{{ lookup('env', 'LAB_FQDN_HARBOR') | default('harbor.' ~ monitoring_lab_domain, true) }}"
    monitoring_lab_fqdn_grafana: "{{ lookup('env', 'LAB_FQDN_GRAFANA') | default('grafana.' ~ monitoring_lab_domain, true) }}"
    monitoring_lab_fqdn_authentik: "{{ lookup('env', 'LAB_FQDN_AUTHENTIK') | default('authentik.' ~ monitoring_lab_domain, true) }}"
    monitoring_lab_fqdn_authentik_internal: "{{ lookup('env', 'LAB_FQDN_AUTHENTIK_INTERNAL') | default('authentik-int.' ~ monitoring_lab_domain, true) }}"
    monitoring_lab_ip_dns: "{{ lookup('env', 'LAB_IP_DNS') | mandatory('LAB_IP_DNS env var is required') }}"
    monitoring_lab_admin_username: "{{ lookup('env', 'LAB_ADMIN_USERNAME') | default('steve', true) }}"
    monitoring_registry_host: "{{ lookup('env', 'MONITORING_REGISTRY_HOST') | default(monitoring_lab_fqdn_harbor, true) }}"
    docker_registry_host: "{{ monitoring_registry_host }}"
  roles:
    - lxc_base
    - docker_base
    - role: docker_socket_proxy
      when: enable_docker_socket_proxy | default(false) | bool

  tasks:
    - name: Trust Harbor HTTP registry in Docker daemon
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {
            "insecure-registries": ["{{ docker_registry_host }}"],
            "dns": ["{{ monitoring_lab_ip_dns }}"],
            "log-driver": "syslog",
            "log-opts": {
              "syslog-address": "tcp://127.0.0.1:10514",
              "syslog-format": "rfc5424",
              "tag": "{% raw %}docker-{{.Name}}{% endraw %}"
            },
            "storage-driver": "overlay2"
          }
      notify: Restart Docker
      register: docker_daemon_config

    - name: Flush handlers to apply Docker daemon config before stack deploy
      ansible.builtin.meta: flush_handlers

    - name: Mask portainer-agent service (platform tier — no agent on this host)
      ansible.builtin.systemd:
        name: portainer-agent.service
        masked: true
        enabled: false
      failed_when: false

  handlers:
    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted

- name: Deploy monitoring compose stack
  hosts: all
  become: true
  gather_facts: false

  vars:
    monitoring_lab_domain: "{{ lookup('env', 'LAB_DOMAIN') | default('lab.gibbsgreatly.xyz', true) }}"
    monitoring_lab_fqdn_harbor: "{{ lookup('env', 'LAB_FQDN_HARBOR') | default('harbor.' ~ monitoring_lab_domain, true) }}"
    monitoring_lab_fqdn_grafana: "{{ lookup('env', 'LAB_FQDN_GRAFANA') | default('grafana.' ~ monitoring_lab_domain, true) }}"
    monitoring_lab_fqdn_authentik: "{{ lookup('env', 'LAB_FQDN_AUTHENTIK') | default('authentik.' ~ monitoring_lab_domain, true) }}"
    monitoring_lab_fqdn_authentik_internal: "{{ lookup('env', 'LAB_FQDN_AUTHENTIK_INTERNAL') | default('authentik-int.' ~ monitoring_lab_domain, true) }}"
    monitoring_lab_ip_dns: "{{ lookup('env', 'LAB_IP_DNS') | mandatory('LAB_IP_DNS env var is required') }}"
    monitoring_lab_admin_username: "{{ lookup('env', 'LAB_ADMIN_USERNAME') | default('steve', true) }}"
    monitoring_compose_dir: /opt/monitoring-stack
    vm_version: "v1.148.0"
    grafana_version: "13.0.2"
    python_version: "3.12-alpine"
    monitoring_registry_host: "{{ lookup('env', 'MONITORING_REGISTRY_HOST') | default(monitoring_lab_fqdn_harbor, true) }}"
    vm_image: "{{ monitoring_registry_host }}/dockerhub/victoriametrics/victoria-metrics:{{ vm_version }}"
    grafana_image: "{{ monitoring_registry_host }}/dockerhub/grafana/grafana-oss:{{ grafana_version }}"
    harbor_findings_exporter_image: "{{ monitoring_registry_host }}/dockerhub/library/python:{{ python_version }}"
    cadvisor_version: "v0.60.5"
    cadvisor_image: "{{ monitoring_registry_host }}/ghcr/google/cadvisor:{{ cadvisor_version }}"
    grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') | mandatory('GRAFANA_ADMIN_PASSWORD env var is not set') }}"
    grafana_admin_user: "{{ lookup('env', 'GRAFANA_ADMIN_USER') | default('admin', true) }}"
    grafana_breakglass_username: "{{ lookup('env', 'GRAFANA_BREAKGLASS_USERNAME') | default('breakglass', true) }}"
    grafana_breakglass_password: "{{ lookup('env', 'BREAKGLASS_PASSWORD') | default(grafana_admin_password, true) }}"
    grafana_oauth_role_attribute_path: "{{ lookup('env', 'GRAFANA_OAUTH_ROLE_ATTRIBUTE_PATH') | default(\"preferred_username == 'akadmin' && '' || preferred_username == '\" ~ monitoring_lab_admin_username ~ \"' && 'Admin' || 'Viewer'\", true) }}"
    grafana_oauth_role_attribute_strict: "{{ lookup('env', 'GRAFANA_OAUTH_ROLE_ATTRIBUTE_STRICT') | default('true', true) | bool }}"
    grafana_oauth_enabled: "{{ lookup('env', 'GRAFANA_OAUTH_ENABLED') | default('true', true) | bool }}"
    grafana_public_url: "{{ lookup('env', 'GRAFANA_PUBLIC_URL') | default('https://' ~ monitoring_lab_fqdn_grafana, true) }}"
    grafana_oauth_name: "{{ lookup('env', 'GRAFANA_OAUTH_NAME') | default('Authentik', true) }}"
    grafana_oauth_scopes: "{{ lookup('env', 'GRAFANA_OAUTH_SCOPES') | default('openid profile email', true) }}"
    grafana_oauth_client_id: "{{ lookup('env', 'GRAFANA_OAUTH_CLIENT_ID') | default('grafana', true) }}"
    grafana_oauth_client_secret: "{{ lookup('env', 'GRAFANA_OAUTH_CLIENT_SECRET') | mandatory('GRAFANA_OAUTH_CLIENT_SECRET env var is not set') }}"
    # Use public Authentik URL for browser-facing authorize endpoint so existing cookies are used,
    # while keeping token/api endpoints on a dedicated internal Authentik backchannel for server-to-server calls.
    grafana_oauth_auth_url: "{{ lookup('env', 'GRAFANA_OAUTH_AUTH_URL') | default('https://' ~ monitoring_lab_fqdn_authentik ~ '/application/o/authorize/', true) }}"
    grafana_oauth_token_url: "{{ lookup('env', 'GRAFANA_OAUTH_TOKEN_URL') | default('https://' ~ monitoring_lab_fqdn_authentik_internal ~ ':9443/application/o/token/', true) }}"
    grafana_oauth_api_url: "{{ lookup('env', 'GRAFANA_OAUTH_API_URL') | default('https://' ~ monitoring_lab_fqdn_authentik_internal ~ ':9443', true) }}"
    grafana_oauth_signout_redirect_url: "{{ lookup('env', 'GRAFANA_OAUTH_SIGNOUT_REDIRECT_URL') | default('https://' ~ monitoring_lab_fqdn_authentik ~ '/application/o/edge-monitoring-stack-grafana/end-session/', true) }}"
    grafana_oauth_tls_skip_verify_insecure: "{{ lookup('env', 'GRAFANA_OAUTH_TLS_SKIP_VERIFY_INSECURE') | default('false', true) | bool }}"
    grafana_oauth_login_attribute_path: "{{ lookup('env', 'GRAFANA_OAUTH_LOGIN_ATTRIBUTE_PATH') | default('preferred_username', true) }}"
    grafana_oauth_name_attribute_path: "{{ lookup('env', 'GRAFANA_OAUTH_NAME_ATTRIBUTE_PATH') | default('name', true) }}"
    grafana_oauth_email_attribute_path: "{{ lookup('env', 'GRAFANA_OAUTH_EMAIL_ATTRIBUTE_PATH') | default('preferred_username', true) }}"
    grafana_oauth_email_attribute_name: "{{ lookup('env', 'GRAFANA_OAUTH_EMAIL_ATTRIBUTE_NAME') | default('preferred_username', true) }}"
    grafana_oauth_use_id_token: "{{ lookup('env', 'GRAFANA_OAUTH_USE_ID_TOKEN') | default('true', true) | bool }}"
    harbor_findings_api_url: "http://{{ lookup('env', 'LAB_IP_HARBOR') }}:80"  # nosonar: ansible:S5332 — Harbor HTTP-only in this deployment; private SDN
    harbor_findings_projects: "dockerhub,ghcr,quay,lscr"
    harbor_findings_refresh_interval_seconds: "300"
    harbor_findings_scan_stale_after_seconds: "86400"
    harbor_findings_listen_port: "9414"
    harbor_api_username: "admin"
    harbor_api_password: "{{ lookup('env', 'HARBOR_ADMIN_PASSWORD') | mandatory('HARBOR_ADMIN_PASSWORD env var is not set') }}"
    node_exporter_scrape_password: "{{ lookup('env', 'NODE_EXPORTER_SCRAPE_PASSWORD') | mandatory('NODE_EXPORTER_SCRAPE_PASSWORD env var is not set') }}"
    # uvm-dashboard-exporter -- docs/threat-vuln-platform/plan.md Phase 10.
    # Read-only OpenSearch reader feeding Grafana's UVM dashboard via
    # plain JSON, same exporter+infinity-datasource shape as
    # harbor-findings-exporter above. Needs the new
    # mgmt_seg -> opensearch-stack:9200 MikroTik rule (ansible/00-initial-
    # setup/mikrotik-firewall-monitoring-to-opensearch-stack.yml) applied
    # first.
    uvm_dashboard_listen_port: "9415"
    uvm_dashboard_refresh_interval_seconds: "300"
    uvm_dashboard_elasticsearch_host: "{{ lookup('env', 'LAB_IP_OPENSEARCH') | mandatory('LAB_IP_OPENSEARCH env var is required') }}"
    uvm_dashboard_elasticsearch_url: "https://{{ uvm_dashboard_elasticsearch_host }}:9200"
    uvm_dashboard_es_no_verify_tls: true
    uvm_dashboard_elastic_admin_user: admin
    uvm_dashboard_elastic_admin_password: "{{ lookup('env', 'OPENSEARCH_ADMIN_PASSWORD') | mandatory('OPENSEARCH_ADMIN_PASSWORD env var is required') }}"
    uvm_dashboard_es_role_name: uvm_dashboard_reader
    uvm_dashboard_es_user_name: uvm_dashboard_exporter

  pre_tasks:
    - name: Reconcile Grafana Authentik OIDC client
      ansible.builtin.command:
        # Use the internal direct-TLS Authentik endpoint for controller-side reconcile.
        argv:
          - python3
          - "{{ playbook_dir }}/../../reconcile-authentik-edge.py"
          - "{{ playbook_dir }}/../../stacks/monitoring-stack/edge.yaml"
          - --authentik-url
          - "https://{{ monitoring_lab_fqdn_authentik_internal }}:9443"
          - --no-verify-tls
          - --apply
          - --json
      environment:
        AUTHENTIK_SUPERUSER_API_TOKEN: "{{ lookup('env', 'AUTHENTIK_SUPERUSER_API_TOKEN') | mandatory('AUTHENTIK_SUPERUSER_API_TOKEN env var is not set') }}"
      register: grafana_authentik_reconcile
      changed_when: "grafana_authentik_reconcile.stdout is not search('\\\"write_count\\\": 0')"
      when: grafana_oauth_enabled
      delegate_to: localhost
      become: false
      run_once: true

  tasks:
    - name: Create monitoring directory structure
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ monitoring_compose_dir }}", mode: "0750" }
        - { path: "{{ monitoring_compose_dir }}/grafana", mode: "0750" }
        - { path: "{{ monitoring_compose_dir }}/grafana/provisioning", mode: "0750" }
        - { path: "{{ monitoring_compose_dir }}/grafana/provisioning/datasources", mode: "0750" }
        - { path: "{{ monitoring_compose_dir }}/grafana/provisioning/dashboards", mode: "0750" }
        - { path: "{{ monitoring_compose_dir }}/grafana/dashboards", mode: "0750" }
        - { path: "{{ monitoring_compose_dir }}/harbor-findings-exporter", mode: "0750" }
        - { path: "{{ monitoring_compose_dir }}/uvm-dashboard-exporter", mode: "0750" }
        - { path: "{{ monitoring_compose_dir }}/victoria-metrics", mode: "0750" }

    - name: Write VictoriaMetrics scrape config
      ansible.builtin.copy:
        dest: "{{ monitoring_compose_dir }}/victoria-metrics/scrape.yml"
        mode: "0644"
        content: |
          global:
            scrape_interval: 30s

          scrape_configs:
            - job_name: node_exporter
              scheme: https
              tls_config:
                ca_file: /etc/ssl/certs/homelab-root.crt
              basic_auth:
                username: prometheus
                password: "{{ node_exporter_scrape_password }}"
              static_configs:
                - targets: ["{{ lookup('env', 'LAB_IP_AUTHENTIK') }}:9100"]
                  labels: {stack: authentik-stack}
                - targets: ["{{ lookup('env', 'LAB_IP_STEP_CA') }}:9100"]
                  labels: {stack: step-ca-stack}
                - targets: ["{{ lookup('env', 'LAB_IP_MONITORING') }}:9100"]
                  labels: {stack: monitoring-stack}
                - targets: ["{{ lookup('env', 'LAB_IP_DNS') }}:9100"]
                  labels: {stack: dns-stack}
                - targets: ["{{ lookup('env', 'LAB_IP_PORTAINER') }}:9100"]
                  labels: {stack: portainer-stack}
                - targets: ["{{ lookup('env', 'LAB_IP_PROXY') }}:9100"]
                  labels: {stack: proxy-stack}
                - targets: ["{{ lookup('env', 'LAB_IP_HARBOR') }}:9100"]
                  labels: {stack: harbor-stack}
                - targets: ["{{ lookup('env', 'LAB_IP_APT_CACHER') }}:9100"]
                  labels: {stack: apt-cacher-stack}
                - targets: ["{{ lookup('env', 'LAB_IP_NETBOX') }}:9100"]
                  labels: {stack: netbox-stack}
                - targets: ["{{ lookup('env', 'LAB_IP_CI_RUNNER') }}:9100"]
                  labels: {stack: ci-runner-01}
                - targets: ["{{ lookup('env', 'LAB_IP_GRAYLOG') }}:9100"]
                  labels: {stack: graylog-stack}
                - targets: ["{{ lookup('env', 'LAB_IP_FRAMEWORK') }}:9100"]
                  labels: {stack: framework}
                - targets: ["{{ lookup('env', 'LAB_IP_PENTAGI') }}:9100"]
                  labels: {stack: pentagi-stack}
                - targets: ["{{ lookup('env', 'LAB_IP_GAME_STACK') | default('192.168.60.10', true) }}:9100"]
                  labels: {stack: gaming-stack-lab}
                - targets: ["{{ lookup('env', 'LAB_IP_MEDIA_STACK_LAB') }}:9100"]
                  labels: {stack: media-stack-lab}

            - job_name: cadvisor
              static_configs:
                - targets: ["{{ lookup('env', 'LAB_IP_AUTHENTIK') }}:8080"]
                  labels: {stack: authentik-stack}
                - targets: ["{{ lookup('env', 'LAB_IP_MONITORING') }}:8080"]
                  labels: {stack: monitoring-stack}
                - targets: ["{{ lookup('env', 'LAB_IP_PORTAINER') }}:8080"]
                  labels: {stack: portainer-stack}
                - targets: ["{{ lookup('env', 'LAB_IP_PROXY') }}:8080"]
                  labels: {stack: proxy-stack}
                - targets: ["{{ lookup('env', 'LAB_IP_HARBOR') }}:8080"]
                  labels: {stack: harbor-stack}
                - targets: ["{{ lookup('env', 'LAB_IP_NETBOX') }}:8081"]
                  labels: {stack: netbox-stack}
                - targets: ["{{ lookup('env', 'LAB_IP_GRAYLOG') }}:8080"]
                  labels: {stack: graylog-stack}
                - targets: ["{{ lookup('env', 'LAB_IP_FRAMEWORK') }}:8083"]
                  labels: {stack: framework}
                - targets: ["{{ lookup('env', 'LAB_IP_PENTAGI') }}:8080"]
                  labels: {stack: pentagi-stack}
                - targets: ["{{ lookup('env', 'LAB_IP_GAME_STACK') | default('192.168.60.10', true) }}:8080"]
                  labels: {stack: gaming-stack-lab}
                - targets: ["{{ lookup('env', 'LAB_IP_MEDIA_STACK_LAB') }}:8080"]
                  labels: {stack: media-stack-lab}

            - job_name: minecraft-status
              scrape_interval: 15s
              static_configs:
                - targets: ["{{ lookup('env', 'LAB_IP_GAME_STACK') | default('192.168.60.10', true) }}:8081"]
                  labels:
                    stack: gaming-stack-lab
                    server: foreverworld
              # mc-monitor omits server_version when a status request fails.
              # Dropping it keeps healthy and failed samples in one stable
              # series, so a Grafana stat panel cannot render two statuses.
              metric_relabel_configs:
                - action: labeldrop
                  regex: server_version

            - job_name: minecraft-jvm
              scrape_interval: 15s
              static_configs:
                - targets: ["{{ lookup('env', 'LAB_IP_GAME_STACK') | default('192.168.60.10', true) }}:9404"]
                  labels:
                    stack: gaming-stack-lab
                    server: foreverworld

            - job_name: coredns
              scrape_interval: 15s
              static_configs:
                - targets:
                    - "{{ lookup('env', 'LAB_IP_DNS') }}:9153"

            - job_name: authentik
              static_configs:
                - targets:
                    - "{{ lookup('env', 'LAB_IP_AUTHENTIK') }}:9300"

            - job_name: harbor-exporter
              static_configs:
                - targets:
                    - "{{ lookup('env', 'LAB_IP_HARBOR') }}:9090"
                  labels:
                    stack: harbor-stack
                    component: exporter

            - job_name: harbor-core
              params:
                comp: ["core"]
              static_configs:
                - targets:
                    - "{{ lookup('env', 'LAB_IP_HARBOR') }}:9090"
                  labels:
                    stack: harbor-stack
                    component: core

            - job_name: harbor-registry
              params:
                comp: ["registry"]
              static_configs:
                - targets:
                    - "{{ lookup('env', 'LAB_IP_HARBOR') }}:9090"
                  labels:
                    stack: harbor-stack
                    component: registry

            - job_name: harbor-jobservice
              params:
                comp: ["jobservice"]
              static_configs:
                - targets:
                    - "{{ lookup('env', 'LAB_IP_HARBOR') }}:9090"
                  labels:
                    stack: harbor-stack
                    component: jobservice

            - job_name: harbor-findings-exporter
              static_configs:
                - targets:
                    - "harbor-findings-exporter:{{ harbor_findings_listen_port }}"
                  labels:
                    stack: harbor-stack
                    component: findings-exporter

            - job_name: netbox
              static_configs:
                - targets:
                    - "{{ lookup('env', 'LAB_IP_NETBOX') }}:8080"

            - job_name: victoriametrics
              static_configs:
                - targets:
                    - "{{ lookup('env', 'LAB_IP_MONITORING') }}:8428"

            - job_name: grafana
              static_configs:
                - targets:
                    - "{{ lookup('env', 'LAB_IP_MONITORING') }}:3000"

            - job_name: traefik
              static_configs:
                - targets:
                    - "{{ lookup('env', 'LAB_IP_PROXY') }}:8082"

            - job_name: step-ca
              scheme: http
              static_configs:
                - targets:
                    - "{{ lookup('env', 'LAB_IP_STEP_CA') }}:9443"
                  labels:
                    stack: step-ca-stack

            - job_name: pentagi-postgres
              static_configs:
                - targets:
                    - "{{ lookup('env', 'LAB_IP_PENTAGI') }}:9187"
                  labels:
                    stack: pentagi-stack
                    component: pgexporter
      notify: Restart VictoriaMetrics

    - name: Write Grafana datasource provisioning
      ansible.builtin.copy:
        dest: "{{ monitoring_compose_dir }}/grafana/provisioning/datasources/datasources.yml"
        mode: "0640"
        content: |
          apiVersion: 1
          datasources:
            - name: VictoriaMetrics
              type: prometheus
              access: proxy
              url: http://victoriametrics:8428  # nosonar: ansible:S5332 — Docker-internal hostname, never reaches SDN
              isDefault: true
              editable: true
            - name: Harbor Findings
              type: yesoreyeram-infinity-datasource
              access: proxy
              url: http://harbor-findings-exporter:{{ harbor_findings_listen_port }}  # nosonar: ansible:S5332 — Docker-internal hostname, never reaches SDN
              jsonData:
                dataType: json
                useBackend: false
              editable: true
            - name: UVM Findings
              type: yesoreyeram-infinity-datasource
              access: proxy
              url: http://uvm-dashboard-exporter:{{ uvm_dashboard_listen_port }}  # nosonar: ansible:S5332 — Docker-internal hostname, never reaches SDN
              jsonData:
                dataType: json
                useBackend: false
              editable: true

    - name: Write Grafana dashboard provider config
      ansible.builtin.copy:
        dest: "{{ monitoring_compose_dir }}/grafana/provisioning/dashboards/providers.yml"
        mode: "0640"
        content: |
          apiVersion: 1
          providers:
            - name: homelab
              type: file
              disableDeletion: false
              updateIntervalSeconds: 30
              options:
                path: /etc/grafana/dashboards

    - name: Clear stale Grafana dashboard JSON files
      ansible.builtin.file:
        path: "{{ monitoring_compose_dir }}/grafana/dashboards"
        state: "{{ item }}"
        mode: "0750"
      loop:
        - absent
        - directory

    - name: Copy Grafana dashboard JSON files
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ monitoring_compose_dir }}/grafana/dashboards/"
        mode: "0640"
      with_fileglob:
        - "{{ playbook_dir }}/../../stacks/monitoring-stack/dashboards/*.json"
      register: grafana_dashboards_copied

    - name: Copy Harbor findings exporter script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/harbor_findings_exporter.py"
        dest: "{{ monitoring_compose_dir }}/harbor-findings-exporter/harbor_findings_exporter.py"
        mode: "0750"
      register: harbor_findings_exporter_script

    - name: Copy UVM dashboard exporter script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/uvm_dashboard_exporter.py"
        dest: "{{ monitoring_compose_dir }}/uvm-dashboard-exporter/uvm_dashboard_exporter.py"
        mode: "0750"
      register: uvm_dashboard_exporter_script

    # ---------------------------------------------------------------
    # Scoped, read-only OpenSearch user for uvm-dashboard-exporter --
    # same provisioning pattern cve_enrichment_sync/es_findings_ingest/
    # gvm_findings_ingest already use, just "read" only instead of
    # "write"/"create_index". Requires the new
    # mgmt_seg -> opensearch-stack:9200 MikroTik rule to actually reach
    # opensearch-stack; this task itself runs from the workstation
    # (delegate_to: localhost), which already has reachability, so it
    # can succeed even before that rule exists -- only the exporter
    # container itself would fail to refresh until the rule is applied.
    # ---------------------------------------------------------------

    - name: Check for existing OpenSearch uvm-dashboard credential
      ansible.builtin.stat:
        path: "{{ monitoring_compose_dir }}/uvm-dashboard-exporter/es-user.env"
      register: uvm_dashboard_es_credential_stat

    - name: Check if OpenSearch is reachable before provisioning its scoped user
      ansible.builtin.wait_for:
        host: "{{ uvm_dashboard_elasticsearch_host }}"
        port: 9200
        timeout: 5
      register: uvm_dashboard_es_reachable
      ignore_errors: true
      when: not uvm_dashboard_es_credential_stat.stat.exists
      delegate_to: localhost

    - name: Warn and skip uvm-dashboard user provisioning when OpenSearch is not yet reachable
      ansible.builtin.debug:
        msg: >-
          OpenSearch at {{ uvm_dashboard_elasticsearch_host }}:9200 is not
          reachable (timeout). Skipping uvm-dashboard-exporter user creation --
          re-run provision once the mgmt_seg -> opensearch-stack:9200 MikroTik
          rule is applied and opensearch-stack is reachable.
      when:
        - not uvm_dashboard_es_credential_stat.stat.exists
        - uvm_dashboard_es_reachable.failed | default(true)

    - name: Generate a random password for the scoped OpenSearch user
      ansible.builtin.set_fact:
        uvm_dashboard_es_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
      when:
        - not uvm_dashboard_es_credential_stat.stat.exists
        - not (uvm_dashboard_es_reachable.failed | default(true))
      no_log: true

    - name: Ensure uvm_dashboard_reader role exists in OpenSearch (read-only)
      ansible.builtin.uri:
        url: "{{ uvm_dashboard_elasticsearch_url }}/_plugins/_security/api/roles/{{ uvm_dashboard_es_role_name }}"
        method: PUT
        url_username: "{{ uvm_dashboard_elastic_admin_user }}"
        url_password: "{{ uvm_dashboard_elastic_admin_password }}"
        validate_certs: "{{ not uvm_dashboard_es_no_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body:
          index_permissions:
            - index_patterns:
                - "unified-cve-exposure*"
                - "stack-risk-summary*"
                - "cve-remediation-assessment*"
              allowed_actions:
                - "read"
        status_code: [200, 201]
      delegate_to: localhost

    - name: Ensure scoped OpenSearch user exists
      ansible.builtin.uri:
        url: "{{ uvm_dashboard_elasticsearch_url }}/_plugins/_security/api/internalusers/{{ uvm_dashboard_es_user_name }}"
        method: PUT
        url_username: "{{ uvm_dashboard_elastic_admin_user }}"
        url_password: "{{ uvm_dashboard_elastic_admin_password }}"
        validate_certs: "{{ not uvm_dashboard_es_no_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body:
          password: "{{ uvm_dashboard_es_password }}"
          opendistro_security_roles:
            - "{{ uvm_dashboard_es_role_name }}"
          description: "uvm-dashboard-exporter service account (monitoring-stack) -- read-only, never the admin superuser"
        status_code: [200, 201]
      when:
        - not uvm_dashboard_es_credential_stat.stat.exists
        - not (uvm_dashboard_es_reachable.failed | default(true))
      delegate_to: localhost
      no_log: true

    - name: Write OpenSearch uvm-dashboard credential file
      ansible.builtin.copy:
        dest: "{{ monitoring_compose_dir }}/uvm-dashboard-exporter/es-user.env"
        owner: root
        group: root
        mode: "0600"
        content: |
          # uvm-dashboard-exporter OpenSearch user credential - managed by Ansible, do not edit by hand
          OPENSEARCH_USER={{ uvm_dashboard_es_user_name }}
          OPENSEARCH_PASSWORD={{ uvm_dashboard_es_password }}
      when:
        - not uvm_dashboard_es_credential_stat.stat.exists
        - not (uvm_dashboard_es_reachable.failed | default(true))
      no_log: true

    - name: Write monitoring secrets env file
      ansible.builtin.copy:
        dest: "{{ monitoring_compose_dir }}/.env"
        mode: "0600"
        content: |
          GF_SECURITY_ADMIN_PASSWORD={{ grafana_admin_password }}
          GF_AUTH_GENERIC_OAUTH_CLIENT_ID={{ grafana_oauth_client_id }}
          GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET={{ grafana_oauth_client_secret }}
          HARBOR_API_PASSWORD={{ harbor_api_password }}
      no_log: true

    - name: Write monitoring compose definition
      ansible.builtin.copy:
        dest: "{{ monitoring_compose_dir }}/docker-compose.yml"
        mode: "0640"
        content: |
          services:
            victoriametrics:
              image: {{ vm_image }}
              container_name: victoriametrics
              restart: unless-stopped
              ports:
                - "8428:8428"
              volumes:
                - vm-data:/storage
                - ./victoria-metrics/scrape.yml:/etc/vm/scrape.yml:ro
                - /usr/local/share/ca-certificates/homelab-root.crt:/etc/ssl/certs/homelab-root.crt:ro
              command:
                - "--storageDataPath=/storage"
                - "--retentionPeriod=90d"
                - "--promscrape.config=/etc/vm/scrape.yml"

            grafana:
              image: {{ grafana_image }}
              container_name: grafana
              restart: unless-stopped
              dns:
                - "{{ monitoring_lab_ip_dns }}"
              env_file:
                - .env
              ports:
                - "3000:3000"
              environment:
                GF_SERVER_ROOT_URL: "{{ grafana_public_url }}"
                GF_AUTH_GENERIC_OAUTH_ENABLED: "{{ 'true' if grafana_oauth_enabled else 'false' }}"
                GF_INSTALL_PLUGINS: "yesoreyeram-infinity-datasource"
                GF_AUTH_GENERIC_OAUTH_NAME: "{{ grafana_oauth_name }}"
                GF_AUTH_GENERIC_OAUTH_SCOPES: "{{ grafana_oauth_scopes }}"
                GF_AUTH_GENERIC_OAUTH_AUTH_URL: "{{ grafana_oauth_auth_url }}"
                GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "{{ grafana_oauth_token_url }}"
                GF_AUTH_GENERIC_OAUTH_API_URL: "{{ grafana_oauth_api_url }}"
                GF_AUTH_GENERIC_OAUTH_TLS_SKIP_VERIFY_INSECURE: "{{ 'true' if grafana_oauth_tls_skip_verify_insecure else 'false' }}"
                GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: "{{ grafana_oauth_login_attribute_path }}"
                GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: "{{ grafana_oauth_name_attribute_path }}"
                GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: "{{ grafana_oauth_email_attribute_path }}"
                GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_NAME: "{{ grafana_oauth_email_attribute_name }}"
                GF_AUTH_GENERIC_OAUTH_USE_ID_TOKEN: "{{ 'true' if grafana_oauth_use_id_token else 'false' }}"
                GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "{{ grafana_oauth_role_attribute_path }}"
                GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "{{ 'true' if grafana_oauth_role_attribute_strict else 'false' }}"
                GF_AUTH_SIGNOUT_REDIRECT_URL: "{{ grafana_oauth_signout_redirect_url }}"
                GF_USERS_AUTO_ASSIGN_ORG_ROLE: "Viewer"
              volumes:
                - grafana-data:/var/lib/grafana
                - ./grafana/provisioning:/etc/grafana/provisioning:ro
                - ./grafana/dashboards:/etc/grafana/dashboards:ro
                - /etc/ssl/certs:/etc/ssl/certs:ro
              depends_on:
                - victoriametrics

            harbor-findings-exporter:
              image: {{ harbor_findings_exporter_image }}
              container_name: harbor-findings-exporter
              restart: unless-stopped
              env_file:
                - .env
              ports:
                - "{{ harbor_findings_listen_port }}:{{ harbor_findings_listen_port }}"
              environment:
                HARBOR_API_URL: "{{ harbor_findings_api_url }}"
                HARBOR_API_USERNAME: "{{ harbor_api_username }}"
                HARBOR_API_PASSWORD: "${HARBOR_API_PASSWORD}"
                HARBOR_FINDINGS_PROJECTS: "{{ harbor_findings_projects }}"
                HARBOR_FINDINGS_REFRESH_INTERVAL_SECONDS: "{{ harbor_findings_refresh_interval_seconds }}"
                HARBOR_FINDINGS_SCAN_STALE_AFTER_SECONDS: "{{ harbor_findings_scan_stale_after_seconds }}"
                HARBOR_FINDINGS_LISTEN_ADDRESS: "0.0.0.0"
                HARBOR_FINDINGS_LISTEN_PORT: "{{ harbor_findings_listen_port }}"
              command:
                - python3
                - /app/harbor_findings_exporter.py
              volumes:
                - ./harbor-findings-exporter/harbor_findings_exporter.py:/app/harbor_findings_exporter.py:ro

            uvm-dashboard-exporter:
              image: {{ harbor_findings_exporter_image }}
              container_name: uvm-dashboard-exporter
              restart: unless-stopped
              env_file:
                - .env
                - ./uvm-dashboard-exporter/es-user.env
              ports:
                - "{{ uvm_dashboard_listen_port }}:{{ uvm_dashboard_listen_port }}"
              environment:
                OPENSEARCH_URL: "{{ uvm_dashboard_elasticsearch_url }}"
                OPENSEARCH_NO_VERIFY_TLS: "{{ 'true' if uvm_dashboard_es_no_verify_tls else 'false' }}"
                UVM_DASHBOARD_REFRESH_INTERVAL_SECONDS: "{{ uvm_dashboard_refresh_interval_seconds }}"
                UVM_DASHBOARD_LISTEN_ADDRESS: "0.0.0.0"
                UVM_DASHBOARD_LISTEN_PORT: "{{ uvm_dashboard_listen_port }}"
              command:
                - python3
                - /app/uvm_dashboard_exporter.py
              volumes:
                - ./uvm-dashboard-exporter/uvm_dashboard_exporter.py:/app/uvm_dashboard_exporter.py:ro

            cadvisor:
              image: {{ cadvisor_image }}
              container_name: cadvisor
              restart: unless-stopped
              ports:
                - "8080:8080"
              volumes:
                - /:/rootfs:ro
                - /var/run:/var/run:ro
                - /sys:/sys:ro
                - /var/lib/docker:/var/lib/docker:ro
                - /etc/machine-id:/etc/machine-id:ro

          volumes:
            vm-data: {}
            grafana-data: {}
      no_log: true
      register: monitoring_compose_definition

    - name: Test DNS resolution for Harbor
      ansible.builtin.shell: |
        python3 - <<'PY'
        import socket,sys
        try:
            socket.gethostbyname('{{ monitoring_lab_fqdn_harbor }}')
            print('OK')
        except Exception:
            sys.exit(1)
        PY
      register: harbor_dns
      failed_when: false

    - name: Test DNS resolution for Docker Hub registry
      ansible.builtin.shell: |
        python3 - <<'PY'
        import socket,sys
        try:
            socket.gethostbyname('registry-1.docker.io')
            print('OK')
        except Exception:
            sys.exit(1)
        PY
      register: dockerhub_dns
      failed_when: false

    - name: Decide whether temporary DNS fallback is needed
      ansible.builtin.set_fact:
        monitoring_dns_fallback_needed: "{{ (harbor_dns.rc != 0) or (dockerhub_dns.rc != 0) }}"

    - name: Backup resolv.conf when Harbor DNS lookup fails
      ansible.builtin.copy:
        src: /etc/resolv.conf
        dest: /etc/resolv.conf.backup-ansible
        remote_src: true
      when: monitoring_dns_fallback_needed
      failed_when: false

    - name: Probe Harbor token endpoint over TLS
      ansible.builtin.uri:
        url: "https://{{ monitoring_lab_fqdn_harbor }}/service/token"
        method: GET
        validate_certs: false
        status_code: [200, 400, 401, 403, 404]
      register: harbor_token_tls
      failed_when: false
      changed_when: false

    - name: Rewrite compose images to use upstream Docker Hub (dependency-tolerant mode)
      ansible.builtin.replace:
        path: "{{ monitoring_compose_dir }}/docker-compose.yml"
        regexp: "{{ monitoring_registry_host | regex_escape }}/dockerhub/"
        replace: ""
      # This task was unconditional -- every sibling DNS-fallback task in this
      # block (resolv.conf backup, /etc/hosts entry, temporary public DNS) is
      # correctly gated on monitoring_dns_fallback_needed, but this one, the
      # consequential one, was not. It stripped the Harbor prefix from every
      # /dockerhub/ image on every single deploy regardless of whether Harbor
      # was actually reachable, defeating monitoring-stack's otherwise-correct
      # Harbor routing for vm_image/grafana_image/harbor_findings_exporter_image
      # unconditionally. See
      # docs/harbor-stack/image-sourcing-enforcement.md Finding 3.
      when: monitoring_dns_fallback_needed
      failed_when: false

    - name: Validate monitoring compose configuration
      ansible.builtin.command:
        cmd: docker compose -f "{{ monitoring_compose_dir }}/docker-compose.yml" config -q
        chdir: "{{ monitoring_compose_dir }}"
      changed_when: false
      when: not ansible_check_mode

    - name: Add temporary /etc/hosts entry for Harbor when DNS lookup fails
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ lookup('env', 'LAB_IP_HARBOR') | default('192.168.40.10', true) }} {{ monitoring_lab_fqdn_harbor }}"
        state: present
      when: harbor_dns.rc != 0
      failed_when: false

    - name: Write temporary public DNS fallback when Harbor DNS lookup fails
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        mode: '0644'
        content: |
          # Temporary fallback added by ansible for provisioning
          nameserver 1.1.1.1
          nameserver 8.8.8.8
      when: monitoring_dns_fallback_needed
      failed_when: false

    - name: Start monitoring stack via compose
      community.docker.docker_compose_v2:
        project_src: "{{ monitoring_compose_dir }}"
        state: present
        remove_orphans: true
        # 'auto' does not reliably recreate on an image-tag-only change
        # (confirmed live during the traefik v3.7.10 rollout: a clean,
        # failed=0 run left the old container running). Force recreation
        # whenever the compose file's own content changed, not just when
        # the Docker daemon config changed.
        recreate: >-
          {{
            'always'
            if (docker_daemon_config.changed or monitoring_compose_definition.changed)
            else 'auto'
          }}
      when: not ansible_check_mode

    - name: Restart Harbor findings exporter after script updates
      ansible.builtin.command:
        cmd: docker compose -f "{{ monitoring_compose_dir }}/docker-compose.yml" restart harbor-findings-exporter
      when:
        - not ansible_check_mode
        - harbor_findings_exporter_script.changed or monitoring_compose_definition.changed

    - name: Restart Grafana after dashboard set changed
      ansible.builtin.command:
        cmd: docker compose -f "{{ monitoring_compose_dir }}/docker-compose.yml" restart grafana
      when:
        - not ansible_check_mode
        - grafana_dashboards_copied.changed
      # Grafana's file-based dashboard provisioner (disableDeletion: false) only
      # reconciles removed dashboards against its DB on process start, not on its
      # periodic re-scan — without this restart a dashboard whose JSON file was
      # removed keeps showing in Grafana indefinitely, still pointing at a
      # datasource that may no longer exist. The dashboards directory is wiped
      # and recreated above on every run, so this fires whenever the current
      # dashboard set differs from what Grafana last loaded (including the
      # common case of a dashboard file being deleted).
      changed_when: true

    - name: Wait for Grafana health endpoint
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:3000/api/health"  # nosonar: ansible:S5332 — Grafana HTTP on private SDN; accepted risk per findings.md FP2
        method: GET
        status_code: 200
      register: grafana_health
      retries: 30
      delay: 10
      until: grafana_health.status == 200
      when: not ansible_check_mode

    - name: Wait for VictoriaMetrics endpoint
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:8428/metrics"  # nosonar: ansible:S5332 — VictoriaMetrics health check on private SDN
        method: GET
        status_code: 200
      register: vm_health
      retries: 30
      delay: 10
      until: vm_health.status == 200
      when: not ansible_check_mode

    - name: Wait for Harbor findings exporter metrics endpoint
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ harbor_findings_listen_port }}/metrics"  # nosonar: ansible:S5332 — Harbor findings exporter health check on private SDN
        method: GET
        status_code: 200
      register: harbor_findings_exporter_health
      retries: 30
      delay: 10
      until: harbor_findings_exporter_health.status == 200
      when: not ansible_check_mode

    - name: Restore resolv.conf from backup if we modified it
      ansible.builtin.copy:
        src: /etc/resolv.conf.backup-ansible
        dest: /etc/resolv.conf
        remote_src: true
      when: monitoring_dns_fallback_needed | default(false)
      failed_when: false

    - name: Remove temporary /etc/hosts entry for Harbor
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "{{ lookup('env', 'LAB_IP_HARBOR') | default('192.168.40.10', true) }}\\s+{{ monitoring_lab_fqdn_harbor }}"
        state: absent
      when: harbor_dns is defined and harbor_dns.rc != 0
      failed_when: false

    - name: Look up Grafana breakglass local user
      check_mode: false
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:3000/api/users/lookup?loginOrEmail={{ grafana_breakglass_username }}"  # nosonar: ansible:S5332 — Grafana HTTP on private SDN; accepted risk per findings.md FP2
        method: GET
        url_username: "{{ grafana_admin_user }}"
        url_password: "{{ grafana_admin_password }}"
        force_basic_auth: true
        status_code: [200, 404]
      register: grafana_breakglass_lookup
      no_log: true
      when: not ansible_check_mode

    - name: Create Grafana breakglass local user when missing
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:3000/api/admin/users"  # nosonar: ansible:S5332 — Grafana HTTP on private SDN; accepted risk per findings.md FP2
        method: POST
        url_username: "{{ grafana_admin_user }}"
        url_password: "{{ grafana_admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "{{ grafana_breakglass_username }}"
          email: "{{ grafana_breakglass_username }}@localhost"
          login: "{{ grafana_breakglass_username }}"
          password: "{{ grafana_breakglass_password }}"
        status_code: [200, 201]
      when:
        - not ansible_check_mode
        - grafana_breakglass_lookup.status == 404
      no_log: true

    - name: Refresh Grafana breakglass user lookup
      check_mode: false
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:3000/api/users/lookup?loginOrEmail={{ grafana_breakglass_username }}"  # nosonar: ansible:S5332 — Grafana HTTP on private SDN; accepted risk per findings.md FP2
        method: GET
        url_username: "{{ grafana_admin_user }}"
        url_password: "{{ grafana_admin_password }}"
        force_basic_auth: true
        status_code: 200
      register: grafana_breakglass_lookup_after
      no_log: true
      when: not ansible_check_mode

    - name: Sync Grafana breakglass user password
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:3000/api/admin/users/{{ grafana_breakglass_lookup_after.json.id }}/password"  # nosonar: ansible:S5332 — Grafana HTTP on private SDN; accepted risk per findings.md FP2
        method: PUT
        url_username: "{{ grafana_admin_user }}"
        url_password: "{{ grafana_admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          password: "{{ grafana_breakglass_password }}"
        status_code: 200
      no_log: true
      when: not ansible_check_mode

    - name: Ensure Grafana breakglass user is Grafana admin
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:3000/api/admin/users/{{ grafana_breakglass_lookup_after.json.id }}/permissions"  # nosonar: ansible:S5332 — Grafana HTTP on private SDN; accepted risk per findings.md FP2
        method: PUT
        url_username: "{{ grafana_admin_user }}"
        url_password: "{{ grafana_admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          isGrafanaAdmin: true
        status_code: 200
      no_log: true
      when: not ansible_check_mode

  handlers:
    - name: Restart VictoriaMetrics
      community.docker.docker_compose_v2:
        project_src: "{{ monitoring_compose_dir }}"
        services:
          - victoriametrics
        state: restarted
      when: not ansible_check_mode

- name: Enable unattended security updates (fleet rollout, 2026-08-30)
  hosts: all
  become: true
  gather_facts: false
  roles:
    - unattended_upgrades
