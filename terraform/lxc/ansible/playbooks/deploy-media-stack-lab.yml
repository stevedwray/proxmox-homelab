---
- name: Deploy media-stack-lab
  hosts: all
  become: true
  gather_facts: true

  vars:
    stack_name: media-stack-lab
    media_stack_lab_compose_content: "{{ lookup('file', '../../stacks/' + stack_name + '/docker-compose.yml') }}"
    media_stack_lab_dir: "/opt/stacks/{{ stack_name }}"
    media_stack_lab_fqdn_authentik: "{{ lookup('env', 'LAB_FQDN_AUTHENTIK') | default('authentik.' ~ (lookup('env', 'LAB_DOMAIN') | default('lab.gibbsgreatly.xyz', true)), true) }}"
    media_stack_lab_immich_oauth_client_id: "{{ lookup('env', 'IMMICH_OAUTH_CLIENT_ID') | default('immich', true) }}"
    media_stack_lab_immich_oauth_client_secret: "{{ lookup('env', 'IMMICH_OAUTH_CLIENT_SECRET') | mandatory('IMMICH_OAUTH_CLIENT_SECRET env var is not set') }}"
    # Matches the reconciler's deterministic application slug: edge-<stack>-<route>
    # (see discover-authentik-edge.py OIDC_ROUTE_CLIENT_IDS / _oidc_route_key).
    media_stack_lab_immich_issuer_url: "https://{{ media_stack_lab_fqdn_authentik }}/application/o/edge-media-stack-lab-immich/"
    # Must be the FQDN (routed through Traefik), not LAB_IP_HARBOR -- see
    # docs/harbor-stack/image-sourcing-enforcement.md.
    docker_registry_host: "{{ registry_host | default(lookup('env', 'LAB_FQDN_HARBOR'), true) | default('harbor.' ~ (lookup('env', 'LAB_DOMAIN') | default('lab.gibbsgreatly.xyz', true)), true) }}"

  roles:
    - lxc_base
    - docker_base

  handlers:
    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted

  tasks:
    - name: Trust Harbor HTTP registry and forward Docker container logs to Graylog
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {
            "insecure-registries": ["{{ docker_registry_host }}"],
            "log-driver": "syslog",
            "log-opts": {
              "syslog-address": "tcp://127.0.0.1:10514",
              "syslog-format": "rfc5424",
              "tag": "{% raw %}docker-{{.Name}}{% endraw %}"
            },
            "storage-driver": "overlay2"
          }
      notify: Restart Docker
      register: media_stack_lab_docker_daemon_config

    - name: Flush handlers to apply Docker daemon config before stack deploy
      ansible.builtin.meta: flush_handlers

    - name: Create stack directory
      ansible.builtin.file:
        path: "{{ media_stack_lab_dir }}"
        state: directory
        mode: "0755"

    - name: Write docker-compose.yml to stack directory
      ansible.builtin.copy:
        content: "{{ media_stack_lab_compose_content }}"
        dest: "{{ media_stack_lab_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Write compose secrets env file
      ansible.builtin.copy:
        dest: "{{ media_stack_lab_dir }}/.env"
        mode: "0600"
        owner: root
        group: root
        content: |
          MEDIA_STACK_LAB_DB_PASSWORD={{ lookup('env', 'MEDIA_STACK_LAB_DB_PASSWORD') }}
          LAB_DOMAIN={{ lookup('env', 'LAB_DOMAIN') }}
          REGISTRY_HOST={{ docker_registry_host }}
      no_log: true

    - name: Template Immich OAuth config
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/media-stack-lab/immich-config.json.j2"
        dest: "{{ media_stack_lab_dir }}/immich-config.json"
        mode: "0600"
        owner: "1000"
        group: "1000"
      no_log: true

    - name: Validate docker compose configuration
      ansible.builtin.command:
        cmd: docker compose config
        chdir: "{{ media_stack_lab_dir }}"
      register: compose_config_check
      changed_when: false
      when: not ansible_check_mode

    - name: Start media-stack-lab via docker compose
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ media_stack_lab_dir }}"
      register: compose_up
      changed_when: "'Started' in compose_up.stdout or 'Created' in compose_up.stdout"
      when: not ansible_check_mode

    - name: Wait for Jellyfin to accept TCP connections
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 8096
        timeout: 120
      when: not ansible_check_mode
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Wait for Immich to accept TCP connections
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 2283
        timeout: 180
      when: not ansible_check_mode
      ignore_errors: "{{ ansible_check_mode }}"
