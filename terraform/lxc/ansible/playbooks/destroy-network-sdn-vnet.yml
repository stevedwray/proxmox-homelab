- name: Remove an SDN VNet and zone from target Proxmox environment when no guests still use them
  hosts: localhost
  gather_facts: false

  vars:
    configured_proxmox_node: "{{ lookup('env', 'TF_VAR_proxmox_node') | default('', true) }}"
    configured_proxmox_host: "{{ lookup('env', 'TF_VAR_proxmox_host') | default('', true) }}"
    network_sdn_vmid_exclude_effective: "{{ network_sdn_vmid_exclude | default('') }}"

  tasks:
    - name: Assert SDN destroy execution is allowed for the active target environment
      ansible.builtin.assert:
        that:
          - network_sdn_enable | bool
          - network_sdn_allow_destroy is not defined or network_sdn_allow_destroy | bool
          - network_sdn_expected_target is not defined or network_sdn_target == network_sdn_expected_target
          - network_sdn_expected_pve_host is not defined or network_sdn_pve_host == network_sdn_expected_pve_host
          - configured_proxmox_node | length == 0 or configured_proxmox_node == network_sdn_target
          - configured_proxmox_host | length == 0 or configured_proxmox_host == network_sdn_pve_host
          - network_sdn_zone_type in ['simple', 'vlan']
          - network_sdn_nodes | length > 0
        fail_msg: "SDN destroy automation is not permitted for this target environment or its target/host metadata does not match the active selection. Optional producer-side destroy and target hints must agree when provided."
        success_msg: "SDN destroy automation is permitted and matches the active environment."

    - name: Inspect target LXC configs for remaining VNet bridge usage
      ansible.builtin.shell: |
        set -o pipefail
        grep -R "bridge={{ network_sdn_vnet }}\([, ]\|$\)" /etc/pve/lxc/*.conf 2>/dev/null \
          | grep -v "^/etc/pve/lxc/{{ network_sdn_vmid_exclude_effective }}.conf:" || true
      args:
        executable: /bin/bash
      delegate_to: "{{ network_sdn_pve_host }}"
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: "{{ network_sdn_ssh_key }}"
        ansible_ssh_common_args: '-F /dev/null -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
      register: network_sdn_remaining_bridge_usage
      changed_when: false

    - name: Read current SDN VNets
      ansible.builtin.command:
        cmd: pvesh get /cluster/sdn/vnets --output-format json
      delegate_to: "{{ network_sdn_pve_host }}"
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: "{{ network_sdn_ssh_key }}"
        ansible_ssh_common_args: '-F /dev/null -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
      register: network_sdn_vnets_result
      changed_when: false

    - name: Compute SDN safe-delete gate
      ansible.builtin.set_fact:
        network_sdn_vnet_exists: >-
          {{
            (network_sdn_vnets_result.stdout | from_json
            | selectattr('vnet', 'equalto', network_sdn_vnet)
            | list | length) > 0
          }}
        network_sdn_has_remaining_bridge_users: >-
          {{ (network_sdn_remaining_bridge_usage.stdout | trim) != '' }}
        network_sdn_safe_to_delete_vnet: >-
          {{
            (network_sdn_remaining_bridge_usage.stdout | trim) == '' and
            (network_sdn_vnets_result.stdout | from_json
            | selectattr('vnet', 'equalto', network_sdn_vnet)
            | list | length) > 0
          }}

    - name: Skip SDN subnet and VNet deletion because active bridge users remain
      ansible.builtin.debug:
        msg: >-
          Skipping subnet/VNet delete for {{ network_sdn_vnet }} because active
          LXC bridge users still exist: {{ network_sdn_remaining_bridge_usage.stdout_lines }}
      when:
        - network_sdn_vnet_exists | bool
        - network_sdn_has_remaining_bridge_users | bool

    - name: Read current SDN subnets
      ansible.builtin.command:
        cmd: pvesh get /cluster/sdn/vnets/{{ network_sdn_vnet }}/subnets --output-format json
      delegate_to: "{{ network_sdn_pve_host }}"
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: "{{ network_sdn_ssh_key }}"
        ansible_ssh_common_args: '-F /dev/null -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
      register: network_sdn_subnets_result
      when: network_sdn_safe_to_delete_vnet | bool
      changed_when: false

    - name: Delete SDN subnets when present
      ansible.builtin.command:
        argv:
          - pvesh
          - delete
          - "/cluster/sdn/vnets/{{ network_sdn_vnet }}/subnets/{{ item.subnet }}"
      delegate_to: "{{ network_sdn_pve_host }}"
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: "{{ network_sdn_ssh_key }}"
        ansible_ssh_common_args: '-F /dev/null -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
      loop: "{{ (network_sdn_subnets_result.stdout | default('[]')) | from_json }}"
      loop_control:
        label: "{{ item.subnet }}"
      when:
        - network_sdn_safe_to_delete_vnet | bool
        - ((network_sdn_subnets_result.stdout | default('[]')) | from_json | length) > 0
      register: network_sdn_subnet_delete
      changed_when: true

    - name: Delete SDN VNet when no other containers reference it
      ansible.builtin.command:
        argv:
          - pvesh
          - delete
          - "/cluster/sdn/vnets/{{ network_sdn_vnet }}"
      delegate_to: "{{ network_sdn_pve_host }}"
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: "{{ network_sdn_ssh_key }}"
        ansible_ssh_common_args: '-F /dev/null -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
      when: network_sdn_safe_to_delete_vnet | bool
      register: network_sdn_vnet_delete
      changed_when:
        - network_sdn_vnet_delete.rc == 0
      failed_when:
        - network_sdn_vnet_delete.rc != 0
        - '"does not exist" not in (network_sdn_vnet_delete.stderr | default(""))'

    - name: Remove VNet firewall config file when VNet is deleted # noqa: no-handler
      ansible.builtin.command:
        cmd: rm -f /etc/pve/sdn/firewall/{{ network_sdn_vnet }}.fw
      delegate_to: "{{ network_sdn_pve_host }}"
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: "{{ network_sdn_ssh_key }}"
        ansible_ssh_common_args: '-F /dev/null -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
      when: network_sdn_vnet_delete is changed
      changed_when: true

    - name: Refresh SDN VNets after VNet deletion # noqa: no-handler
      ansible.builtin.command:
        cmd: pvesh get /cluster/sdn/vnets --output-format json
      delegate_to: "{{ network_sdn_pve_host }}"
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: "{{ network_sdn_ssh_key }}"
        ansible_ssh_common_args: '-F /dev/null -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
      register: network_sdn_vnets_after_delete_result
      when: network_sdn_vnet_delete is changed
      changed_when: false

    - name: Read current SDN zones
      ansible.builtin.command:
        cmd: pvesh get /cluster/sdn/zones --output-format json
      delegate_to: "{{ network_sdn_pve_host }}"
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: "{{ network_sdn_ssh_key }}"
        ansible_ssh_common_args: '-F /dev/null -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
      register: network_sdn_zones_result
      changed_when: false

    - name: Delete SDN zone when no remaining VNets reference it
      ansible.builtin.command:
        argv:
          - pvesh
          - delete
          - "/cluster/sdn/zones/{{ network_sdn_zone }}"
      delegate_to: "{{ network_sdn_pve_host }}"
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: "{{ network_sdn_ssh_key }}"
        ansible_ssh_common_args: '-F /dev/null -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
      when: >-
        network_sdn_vnet_delete is changed and
        (network_sdn_zones_result.stdout | from_json
        | selectattr('zone', 'equalto', network_sdn_zone)
        | list | length) > 0 and
        (
          network_sdn_vnets_after_delete_result.stdout | from_json
          | selectattr('zone', 'equalto', network_sdn_zone)
          | list | length
        ) == 0
      register: network_sdn_zone_delete
      changed_when: true

    - name: Apply pending SDN changes on target Proxmox environment
      ansible.builtin.command:
        cmd: pvesh set /cluster/sdn
      delegate_to: "{{ network_sdn_pve_host }}"
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: "{{ network_sdn_ssh_key }}"
        ansible_ssh_common_args: '-F /dev/null -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
      when: >-
        (network_sdn_vnet_delete is defined and network_sdn_vnet_delete is changed)
        or
        (network_sdn_subnet_delete is defined and network_sdn_subnet_delete is changed)
        or
        (network_sdn_zone_delete is defined and network_sdn_zone_delete is changed)
      changed_when: true

    - name: Validate proxmox-firewall compilation on target Proxmox environment
      ansible.builtin.command:
        cmd: /usr/libexec/proxmox/proxmox-firewall compile
      delegate_to: "{{ network_sdn_pve_host }}"
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: "{{ network_sdn_ssh_key }}"
        ansible_ssh_common_args: '-F /dev/null -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
      changed_when: false
