---
- name: Deploy cse-controller stack
  hosts: all
  become: true
  gather_facts: true

  vars:
    cse_controller_stack_name: "{{ stack_name | default('cse-controller') }}"
    cse_controller_compose_content: "{{ lookup('file', '../../stacks/' + cse_controller_stack_name + '/docker-compose.yml') }}"
    cse_controller_stack_dir: "/opt/stacks/{{ cse_controller_stack_name }}"
    cse_controller_container: "{{ cse_controller_stack_name }}"
    cse_controller_packages:
      - curl
      - git
      - git-lfs
      - build-essential
      - poppler-utils
      - jq
      - python3-venv
    # PurpleLlama/CyberSecEval (plan §6/§8). Pinned to main's HEAD at the
    # time this was written (2026-09-18) -- never track main implicitly
    # for benchmark runs; bump this deliberately, not automatically.
    cse_controller_repo_url: https://github.com/meta-llama/PurpleLlama.git
    cse_controller_repo_commit: 4be64c3a24442b51c76175e6ec67722cc3f5fe38
    cse_controller_repo_dir: /srv/cyberseceval/repo/PurpleLlama
    cse_controller_venv_dir: /srv/cyberseceval/.venv

  roles:
    - lxc_base
    - docker_base

  tasks:
    - name: Forward container logs to Graylog (log-driver gap fix, docs/cyberseceval-panel/plan.md §cse-panel-14)
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {
            "log-driver": "syslog",
            "log-opts": {
              "syslog-address": "tcp://127.0.0.1:10514",
              "syslog-format": "rfc5424",
              "tag": "{% raw %}docker-{{.Name}}{% endraw %}"
            },
            "storage-driver": "overlay2",
            "live-restore": true
          }
      notify: Restart Docker
      register: cse_controller_daemon_config

    - name: Flush handlers to apply Docker daemon config before stack deploy
      ansible.builtin.meta: flush_handlers

    - name: Create stack directory
      ansible.builtin.file:
        path: "{{ cse_controller_stack_dir }}"
        state: directory
        mode: "0755"

    # Must exist before "Validate docker compose configuration" below --
    # the worker service's env_file references this path, and `docker
    # compose config`/`up -d` fail outright ("env file not found") on a
    # fresh deploy if it's missing. Confirmed live (2026-09-19): moving
    # this here from later in the play (after the venv/pip-install
    # section) was a real ordering bug, not just tidiness.
    - name: Write the worker's secrets env file (never logged)
      no_log: true
      ansible.builtin.copy:
        dest: /srv/cyberseceval/config/worker.env
        mode: "0600"
        content: |
          OPENAI_API_KEY={{ lookup('env', 'OPENAI_API_KEY') | mandatory('OPENAI_API_KEY must be set to deploy the worker') }}
          FRAMEWORK_LLM_API_KEY={{ lookup('env', 'LLM_GPU_STACK_API_KEY') | mandatory('LLM_GPU_STACK_API_KEY must be set to deploy the worker') }}
          NEXTCLOUD_REPORTS_WEBDAV_URL={{ lookup('env', 'NEXTCLOUD_REPORTS_WEBDAV_URL') | default('', true) }}
          NEXTCLOUD_REPORTS_USER={{ lookup('env', 'NEXTCLOUD_REPORTS_USER') | default('', true) }}
          NEXTCLOUD_REPORTS_APP_PASSWORD={{ lookup('env', 'NEXTCLOUD_REPORTS_APP_PASSWORD') | default('', true) }}

    # docker-compose.yml resolves ${LAB_IP_CSE_PANEL} itself (Compose
    # auto-reads a .env file in the same directory as the compose file --
    # this is not for secrets, just variable substitution). Without this,
    # `docker compose up -d` warns "variable is not set, defaulting to a
    # blank string" and the worker's CELERY_BROKER_URL/RESULT_BACKEND
    # become redis://:6379/... with no host -- confirmed live 2026-09-19.
    - name: Write compose variable substitution file
      ansible.builtin.copy:
        dest: "{{ cse_controller_stack_dir }}/.env"
        mode: "0600"
        content: |
          LAB_IP_CSE_PANEL={{ lookup('env', 'LAB_IP_CSE_PANEL') | mandatory('LAB_IP_CSE_PANEL env var is required') }}
          CSE_PANEL_REDIS_PASSWORD={{ lookup('env', 'CSE_PANEL_REDIS_PASSWORD') | mandatory('CSE_PANEL_REDIS_PASSWORD (OpenBao services/cse-panel) is required') }}
      no_log: true

    - name: Write docker-compose.yml to stack directory
      ansible.builtin.copy:
        content: "{{ cse_controller_compose_content }}"
        dest: "{{ cse_controller_stack_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Validate docker compose configuration
      ansible.builtin.command:
        cmd: docker compose config
        chdir: "{{ cse_controller_stack_dir }}"
      register: compose_config_check
      changed_when: false
      when: not ansible_check_mode

    # controller only, not the whole stack -- the worker service's
    # command execs {{ cse_controller_venv_dir }}/bin/celery, which
    # doesn't exist yet (the venv itself isn't created until further
    # down this play). Confirmed live 2026-09-19: `docker compose up -d`
    # for the whole file at this point fails outright ("no such file or
    # directory: unknown") trying to start worker before its own
    # dependencies exist. Worker gets its own "docker compose up -d"
    # much later, once celery is actually installed into the venv.
    - name: Start controller container via docker compose
      ansible.builtin.command:
        cmd: docker compose up -d controller
        chdir: "{{ cse_controller_stack_dir }}"
      register: compose_up
      changed_when: "'Started' in compose_up.stdout or 'Created' in compose_up.stdout"
      when: not ansible_check_mode

    - name: Wait for controller container to be running
      ansible.builtin.command:
        cmd: "docker inspect -f {{ '{{.State.Running}}' }} {{ cse_controller_container }}"
      register: controller_running
      until: controller_running.stdout == "true"
      retries: 10
      delay: 3
      changed_when: false
      when: not ansible_check_mode

    # Package installs land in the container's own writable layer, not the
    # /srv/cyberseceval bind mount -- a host-side stat can't see them, so
    # this checks inside the container itself. Confirmed real overreach
    # 2026-09-19: apt-get update + install were running on every single
    # code-only deploy, for no benefit once the tooling is already there.
    - name: Check whether base tooling has already been installed in the controller container
      ansible.builtin.command:
        cmd: "docker exec {{ cse_controller_container }} test -f /root/.cse-controller-bootstrap-done"
      register: cse_controller_bootstrap_check
      failed_when: false
      changed_when: false
      when: not ansible_check_mode

    - name: Update apt cache inside controller container (first bootstrap only)
      ansible.builtin.command:
        cmd: "docker exec {{ cse_controller_container }} apt-get update"
      register: controller_apt_update
      changed_when: true
      when:
        - not ansible_check_mode
        - cse_controller_bootstrap_check.rc != 0

    - name: Install base tooling inside controller container (first bootstrap only)
      ansible.builtin.command:
        cmd: >-
          docker exec {{ cse_controller_container }}
          apt-get install -y --no-install-recommends {{ cse_controller_packages | join(' ') }}
      register: controller_tools_install
      changed_when: "'0 upgraded, 0 newly installed' not in controller_tools_install.stdout"
      when:
        - not ansible_check_mode
        - cse_controller_bootstrap_check.rc != 0

    - name: Mark base tooling bootstrap as complete inside the controller container
      ansible.builtin.command:
        cmd: "docker exec {{ cse_controller_container }} touch /root/.cse-controller-bootstrap-done"
      changed_when: false
      when:
        - not ansible_check_mode
        - cse_controller_bootstrap_check.rc != 0

    - name: Verify curl is usable inside the controller container
      ansible.builtin.command:
        cmd: "docker exec {{ cse_controller_container }} curl --version"
      register: curl_check
      changed_when: false
      when: not ansible_check_mode

    # ---------------------------------------------------------------
    # PurpleLlama/CyberSecEval checkout (plan §6/§8). /srv/cyberseceval
    # is bind-mounted into the container at the identical path, so the
    # clone/branch setup below operates on the LXC host's filesystem
    # directly (no docker exec needed) and is visible inside the
    # container immediately. Gated on the repo not already existing --
    # this is a ONE-TIME bootstrap. Plan §6 explicitly wants this repo
    # hand-maintained afterward (a local/cse-lab branch carrying only
    # documented compatibility changes), so re-running this playbook
    # must never reset or re-checkout it once created.
    # ---------------------------------------------------------------

    - name: Check whether PurpleLlama has already been cloned
      ansible.builtin.stat:
        path: "{{ cse_controller_repo_dir }}/.git"
      register: cse_controller_repo_stat

    - name: Clone PurpleLlama (one-time bootstrap only)
      ansible.builtin.git:
        repo: "{{ cse_controller_repo_url }}"
        dest: "{{ cse_controller_repo_dir }}"
      when: not cse_controller_repo_stat.stat.exists

    - name: Rename PurpleLlama's origin remote to upstream (plan §6 naming - upstream/main)
      ansible.builtin.command:
        cmd: git remote rename origin upstream
        chdir: "{{ cse_controller_repo_dir }}"
      when: not cse_controller_repo_stat.stat.exists

    - name: Create local cse-lab branch pinned to {{ cse_controller_repo_commit }} (plan §6 - never track main implicitly)
      ansible.builtin.command:
        cmd: "git checkout -b cse-lab {{ cse_controller_repo_commit }}"
        chdir: "{{ cse_controller_repo_dir }}"
      when: not cse_controller_repo_stat.stat.exists

    # Real root cause found live 2026-09-19: a single mitre-frr request ran
    # unbounded for 14.5+ hours against Framework's local llama-server.
    # Upstream's OPENAI provider only sends a max_completion_tokens cap for
    # OpenAI's own hardcoded reasoning-model names (o1/o3/gpt-5-mini/etc);
    # any locally-served model (ours is a bare GGUF path) gets NOT_GIVEN,
    # so no cap is ever sent. Framework's llama-server has no server-side
    # default either (n_predict=-1, confirmed via its own /props endpoint),
    # and this specific model doesn't reliably emit a stop token for
    # mitre-frr's prompts -- so generation just runs until the full 256K
    # context is exhausted (or beyond, if context-shifting is active).
    # Idempotent (ansible.builtin.replace no-ops once already patched) and
    # applied unconditionally, not gated to first-bootstrap-only, since it
    # must land on the already-cloned checkout too, not just a fresh one.
    - name: Patch PurpleLlama's OPENAI provider to always cap max_completion_tokens (cse-lab compatibility fix, plan §6)
      ansible.builtin.replace:
        path: "{{ cse_controller_repo_dir }}/CybersecurityBenchmarks/benchmark/llms/openai.py"
        regexp: 'DEFAULT_MAX_TOKENS\n                if \(self\.model in self\._reasoning_models\)\n                else NOT_GIVEN'
        replace: 'DEFAULT_MAX_TOKENS  # cse-lab patch: always cap, not just OpenAI reasoning models'
      register: cse_controller_openai_patch

    - name: Commit the OPENAI provider patch on the cse-lab branch
      ansible.builtin.command:
        cmd: >-
          git commit -am
          "cse-lab: always cap max_completion_tokens, not just OpenAI reasoning models --
          Framework's local llama-server has no server-side default (n_predict=-1); a
          mitre-frr request ran unbounded for 14.5+ hours before this fix, confirmed live
          2026-09-19"
        chdir: "{{ cse_controller_repo_dir }}"
      when: cse_controller_openai_patch.changed

    # Real follow-up gap found live the same day: 2048 was too conservative
    # for this model specifically. Confirmed directly against Framework's
    # /v1/chat/completions -- this model always answers via a separate
    # reasoning_content field (llama-server's own extension, not part of
    # the OpenAI schema PurpleLlama's client reads), finishing its
    # "thinking" in *content* only once reasoning is done. malware_analysis's
    # detonation-report prompts run to 116,923 tokens; the model was still
    # mid-thought at the 2048-token cutoff, so `content` came back empty
    # even though generation was working correctly -- not a hang, just not
    # enough headroom. Raised to 8192 (bounds worst-case pure generation to
    # roughly 6-7 minutes at this model's ~20 tok/s, nowhere near the
    # original multi-hour problem) -- still an idempotent, unconditional
    # replace, not gated to first-bootstrap.
    - name: Raise the cse-lab max_completion_tokens cap for reasoning headroom (plan §6 compatibility fix)
      ansible.builtin.replace:
        path: "{{ cse_controller_repo_dir }}/CybersecurityBenchmarks/benchmark/llms/openai.py"
        regexp: 'DEFAULT_MAX_TOKENS  # cse-lab patch: always cap, not just OpenAI reasoning models'
        replace: '8192  # cse-lab patch: raised from 2048 -- this model answers via a separate reasoning_content field and can exhaust a small cap mid-thought on long-context prompts, leaving an empty final answer (confirmed live 2026-09-19)'
      register: cse_controller_openai_patch2

    - name: Commit the raised max_completion_tokens cap on the cse-lab branch
      ansible.builtin.command:
        cmd: >-
          git commit -am
          "cse-lab: raise max_completion_tokens 2048 -> 8192 --
          this model answers via a separate reasoning_content field llama-server
          exposes but PurpleLlama's client doesn't read; malware_analysis's
          116,923-token detonation-report prompts left the model still mid-thought
          at 2048 tokens, so the final content came back empty. Confirmed live
          2026-09-19."
        chdir: "{{ cse_controller_repo_dir }}"
      when: cse_controller_openai_patch2.changed

    # Real recurrence found live 2026-09-25: 8192 wasn't a safe ceiling for
    # every prompt shape either -- one of the mitre benchmark's own, more
    # elaborate prompts (a multi-paragraph "blockchain privilege escalation"
    # scenario) exhausted the same reasoning_content budget before ever
    # writing to content, leaving an empty final response the judge
    # correctly rejected ("Response cannot be empty"). Not benchmark-specific
    # to malware_analysis as first assumed -- any sufficiently demanding
    # prompt against this model can hit the same wall. Raised to 32768
    # (bounds worst-case pure generation to roughly 27 minutes at this
    # model's ~20 tok/s) -- still an idempotent, unconditional replace, not
    # gated to first-bootstrap.
    - name: Raise the cse-lab max_completion_tokens cap further, 8192 -> 32768 (plan §6 compatibility fix)
      ansible.builtin.replace:
        path: "{{ cse_controller_repo_dir }}/CybersecurityBenchmarks/benchmark/llms/openai.py"
        regexp: '8192  # cse-lab patch: raised from 2048 -- this model answers via a separate reasoning_content field and can exhaust a small cap mid-thought on long-context prompts, leaving an empty final answer \(confirmed live 2026-09-19\)'
        replace: '32768  # cse-lab patch: raised from 8192 -- not just malware_analysis-specific, any sufficiently demanding prompt (e.g. a verbose mitre category prompt) can exhaust reasoning_content before writing content (confirmed live 2026-09-25)'
      register: cse_controller_openai_patch3

    - name: Commit the further-raised max_completion_tokens cap on the cse-lab branch
      ansible.builtin.command:
        cmd: >-
          git commit -am
          "cse-lab: raise max_completion_tokens 8192 -> 32768 --
          8192 wasn't a safe ceiling for every prompt shape, not just
          malware_analysis; a verbose mitre Privilege Escalation prompt hit
          the same empty-content failure. Confirmed live 2026-09-25."
        chdir: "{{ cse_controller_repo_dir }}"
      when: cse_controller_openai_patch3.changed

    # Real bug found live 2026-09-25, directly caused by the 32768 cap
    # above: the openai Python SDK's client-level default request timeout
    # is a fixed 600s (10 minutes, openai._constants.DEFAULT_TIMEOUT),
    # never overridden here. At this model's ~20 tok/s, a genuinely long
    # 32768-token generation can take ~27 minutes -- comfortably past that
    # fixed 10-minute timeout. Confirmed live: a real generation was killed
    # mid-flight by an openai.APITimeoutError, then retried (with its own
    # up-to-600s exponential backoff sleep, MAX_RETRY_TIMEOUT in
    # llm_base.py), timed out again, and repeated -- looking exactly like a
    # hang (long idle stretches with no CPU/network activity during the
    # backoff sleeps) rather than a clean failure. Setting timeout=1800
    # (30 min) at client construction covers every chat.completions.create
    # call from this class in one place, with headroom above the ~27-minute
    # worst case.
    - name: Raise the OpenAI client's request timeout to match the 32768 completion cap (plan §6 compatibility fix)
      ansible.builtin.replace:
        path: "{{ cse_controller_repo_dir }}/CybersecurityBenchmarks/benchmark/llms/openai.py"
        regexp: 'self\.client = openai\.OpenAI\(api_key=self\.api_key, base_url=self\.base_url\)'
        replace: 'self.client = openai.OpenAI(api_key=self.api_key, base_url=self.base_url, timeout=1800.0)  # cse-lab patch: SDK default (600s) is shorter than a genuine 32768-token generation can take at this model''s ~20 tok/s, causing spurious mid-generation timeouts + retry loops that look like a hang (confirmed live 2026-09-25)'
      register: cse_controller_openai_patch4

    - name: Commit the raised OpenAI client request timeout on the cse-lab branch
      ansible.builtin.command:
        cmd: >-
          git commit -am
          "cse-lab: set OpenAI client timeout=1800s to match the 32768
          completion cap -- the SDK's fixed 600s default was shorter than a
          genuine long generation could take, causing spurious
          APITimeoutErrors and retry loops that looked like a hang.
          Confirmed live 2026-09-25."
        chdir: "{{ cse_controller_repo_dir }}"
      when: cse_controller_openai_patch4.changed

    # Real regression found live 2026-09-25, caused by the 32768 cap itself:
    # that literal is sent to EVERY chat.completions.create call from this
    # class, including calls to the real cloud gpt-4o-mini judge/expansion
    # model, not just the local GGUF model-under-test. gpt-4o-mini hard-caps
    # completion tokens at 16384 -- confirmed live via the debug HTTP log:
    # every judge/expansion call was rejected with 400 Bad Request
    # ("max_tokens is too large: 32768. This model supports at most 16384
    # completion tokens"), and PurpleLlama's retry wrapper backed off
    # exponentially (0.5s, 1s, 2s, ... up to 600s) against a deterministic,
    # non-retryable error -- retrying forever. Those backoff sleeps (flat
    # CPU, zero network for minutes at a stretch) were the "hang" seen after
    # the earlier 32768 fix, not a deadlock. Scoping the cap by whether the
    # model string is a local filesystem path (our GGUF models) vs a real
    # OpenAI-hosted model name fixes this without touching the two separate
    # concerns (local model needs 32768 headroom; cloud judge is capped by
    # OpenAI itself at 16384).
    - name: Compute a per-model max_completion_tokens cap (plan §6 compatibility fix)
      ansible.builtin.replace:
        path: "{{ cse_controller_repo_dir }}/CybersecurityBenchmarks/benchmark/llms/openai.py"
        regexp: '        super\(\)\.__init__\(config\)$'
        replace: '        super().__init__(config); self._max_completion_tokens_cap = 32768 if self.model.startswith("/") else 16384  # cse-lab patch: only the local GGUF model-under-test can use headroom up to 32768; the real cloud gpt-4o-mini judge/expansion model hard-caps at 16384 and rejects anything higher with a 400 (confirmed live 2026-09-25)'
      register: cse_controller_openai_patch5

    - name: Commit the per-model max_completion_tokens cap on the cse-lab branch
      ansible.builtin.command:
        cmd: >-
          git commit -am
          "cse-lab: scope max_completion_tokens cap by model (32768 local /
          16384 cloud) -- the flat 32768 cap broke every gpt-4o-mini
          judge/expansion call with a 400, and the resulting infinite
          exponential-backoff retry looked exactly like a hang.
          Confirmed live 2026-09-25."
        chdir: "{{ cse_controller_repo_dir }}"
      when: cse_controller_openai_patch5.changed

    - name: Point every max_completion_tokens call site at the per-model cap (plan §6 compatibility fix)
      ansible.builtin.replace:
        path: "{{ cse_controller_repo_dir }}/CybersecurityBenchmarks/benchmark/llms/openai.py"
        regexp: '32768  # cse-lab patch: raised from 8192 -- not just malware_analysis-specific, any sufficiently demanding prompt \(e\.g\. a verbose mitre category prompt\) can exhaust reasoning_content before writing content \(confirmed live 2026-09-25\)'
        replace: 'self._max_completion_tokens_cap  # cse-lab patch: scoped per-model -- 32768 for the local GGUF model-under-test, 16384 for the real cloud gpt-4o-mini judge/expansion model, which rejects anything higher (confirmed live 2026-09-25)'
      register: cse_controller_openai_patch6

    - name: Commit pointing every call site at the per-model cap on the cse-lab branch
      ansible.builtin.command:
        cmd: >-
          git commit -am
          "cse-lab: use the per-model max_completion_tokens cap at every
          call site instead of the flat 32768 literal.
          Confirmed live 2026-09-25."
        chdir: "{{ cse_controller_repo_dir }}"
      when: cse_controller_openai_patch6.changed

    # Real gap found live 2026-09-30: even 32768 wasn't always enough --
    # a mitre-frr prompt (a C-program network-monitoring task) drove the
    # model to spend 32,237 of its 32,768-token budget on
    # reasoning_content, leaving essentially nothing for the actual
    # content, so judge_responses.json recorded a real "accept" verdict
    # against a genuinely empty response. Framework serves this model
    # with a 131072-token context (confirmed via /slots), so there's
    # room to raise further. 65536 doesn't guarantee no prompt can ever
    # exhaust it, but it's a meaningful step with real headroom left in
    # the context.
    - name: Raise the local-model max_completion_tokens cap further, 32768 -> 65536 (plan §6 compatibility fix)
      ansible.builtin.replace:
        path: "{{ cse_controller_repo_dir }}/CybersecurityBenchmarks/benchmark/llms/openai.py"
        regexp: '32768 if self\.model\.startswith\("/"\) else 16384'
        replace: '65536 if self.model.startswith("/") else 16384'
      register: cse_controller_openai_patch7

    - name: Commit the further-raised local-model cap on the cse-lab branch
      ansible.builtin.command:
        cmd: >-
          git commit -am
          "cse-lab: raise local-model max_completion_tokens cap
          32768 -> 65536 -- a mitre-frr prompt exhausted the 32768 budget
          entirely on reasoning_content, producing a genuinely empty
          judged response. Framework serves 131072 context for this
          model, confirmed live 2026-09-30."
        chdir: "{{ cse_controller_repo_dir }}"
      when: cse_controller_openai_patch7.changed

    # Companion fix to the cap raise above, same reasoning as the
    # original 2026-09-25 timeout fix: worst-case generation time scales
    # with the cap. At this model's observed ~23.5 tok/s (32237 tokens in
    # ~1372s, confirmed live 2026-09-30), a full 65536-token generation
    # could take ~46 minutes -- past the current 1800s (30 min) timeout.
    - name: Raise the OpenAI client's request timeout to match the 65536 completion cap (plan §6 compatibility fix)
      ansible.builtin.replace:
        path: "{{ cse_controller_repo_dir }}/CybersecurityBenchmarks/benchmark/llms/openai.py"
        regexp: 'timeout=1800\.0\)  # cse-lab patch: SDK default \(600s\) is shorter than a genuine 32768-token generation can take at this model''s ~20 tok/s, causing spurious mid-generation timeouts \+ retry loops that look like a hang \(confirmed live 2026-09-25\)'
        replace: 'timeout=3600.0)  # cse-lab patch: raised alongside the 65536 completion cap -- SDK default (600s) and the earlier 1800s both fall short of what a genuine full-budget generation can take at this model''s ~23.5 tok/s (confirmed live 2026-09-30)'
      register: cse_controller_openai_patch8

    - name: Commit the further-raised OpenAI client timeout on the cse-lab branch
      ansible.builtin.command:
        cmd: >-
          git commit -am
          "cse-lab: raise OpenAI client timeout 1800s -> 3600s to match
          the 65536 completion cap. Confirmed live 2026-09-30."
        chdir: "{{ cse_controller_repo_dir }}"
      when: cse_controller_openai_patch8.changed

    # Run metrics (operator request 2026-10-07): results should say how many
    # tokens a run used, how fast, and how long it took. Every model call
    # goes through this client, so wrapping its create() once logs each
    # call's usage, finish_reason and llama-server's own `timings` (tokens/s
    # measured by the server) to $CSE_USAGE_LOG, which cse_tasks.py sets per
    # run and summarizes into the report. No-op when the variable is unset,
    # and a logging failure never breaks a benchmark call.
    - name: Add the per-call usage logger to PurpleLlama's OPENAI provider (cse-lab run metrics)
      ansible.builtin.replace:
        path: "{{ cse_controller_repo_dir }}/CybersecurityBenchmarks/benchmark/llms/openai.py"
        regexp: '^import openai\n(?!# cse-lab patch: per-call usage log)'
        replace: |
          import openai
          # cse-lab patch: per-call usage log (cse_tasks run metrics, 2026-10-07)
          import json as _cse_json
          import os as _cse_os
          import time as _cse_time


          def _cse_log_usage(client, model):
              path = _cse_os.environ.get("CSE_USAGE_LOG")
              if not path:
                  return
              create = client.chat.completions.create

              def create_and_log(*args, **kwargs):
                  start = _cse_time.monotonic()
                  response = create(*args, **kwargs)
                  try:
                      usage = getattr(response, "usage", None)
                      choices = getattr(response, "choices", None) or []
                      extra = getattr(response, "model_extra", None) or {}
                      record = {
                          "model": model,
                          "elapsed_s": round(_cse_time.monotonic() - start, 3),
                          "prompt_tokens": getattr(usage, "prompt_tokens", None),
                          "completion_tokens": getattr(usage, "completion_tokens", None),
                          "finish_reason": getattr(choices[0], "finish_reason", None) if choices else None,
                          "timings": extra.get("timings"),
                      }
                      with open(path, "a") as usage_log:
                          usage_log.write(_cse_json.dumps(record) + chr(10))
                  except Exception:  # never let metrics logging break a benchmark call
                      pass
                  return response

              client.chat.completions.create = create_and_log


      register: cse_controller_openai_patch9

    - name: Wrap each OPENAI client with the usage logger (cse-lab run metrics)
      ansible.builtin.replace:
        path: "{{ cse_controller_repo_dir }}/CybersecurityBenchmarks/benchmark/llms/openai.py"
        regexp: '^(        self\.client = openai\.OpenAI\([^\n]*\n)(?!        _cse_log_usage)'
        replace: '\1        _cse_log_usage(self.client, self.model)  # cse-lab patch: per-call usage log\n'
      register: cse_controller_openai_patch10

    - name: Commit the per-call usage logger on the cse-lab branch
      ansible.builtin.command:
        cmd: >-
          git commit -am
          "cse-lab: log each model call's token usage, finish_reason and
          llama-server timings to $CSE_USAGE_LOG for cse_tasks run metrics
          (2026-10-07)."
        chdir: "{{ cse_controller_repo_dir }}"
      when: cse_controller_openai_patch9.changed or cse_controller_openai_patch10.changed

    # Real gap found 2026-10-07: the 65536 cap only applied when the model
    # name started with "/" (the default preset's GGUF path), so a run that
    # named its model -- e.g. glm-5.3-flash on the custom backend -- was
    # capped at 16384. What actually separates the model under test from
    # the cloud judge is the base URL: every self-hosted backend has one,
    # the judge (OPENAI::gpt-4o-mini::<key>) has none.
    - name: Apply the 65536 cap to every self-hosted model, not just GGUF-path names (cse-lab fix)
      ansible.builtin.replace:
        path: "{{ cse_controller_repo_dir }}/CybersecurityBenchmarks/benchmark/llms/openai.py"
        regexp: '65536 if self\.model\.startswith\("/"\) else 16384'
        replace: '65536 if self.base_url else 16384'
      register: cse_controller_openai_patch11

    - name: Commit the base-URL cap rule on the cse-lab branch
      ansible.builtin.command:
        cmd: >-
          git commit -am
          "cse-lab: apply the 65536 completion cap to every model with a
          base_url (self-hosted), not just GGUF-path names; the cloud judge
          has no base_url and keeps 16384 (2026-10-08)."
        chdir: "{{ cse_controller_repo_dir }}"
      when: cse_controller_openai_patch11.changed

    - name: Check whether the CyberSecEval venv already exists
      ansible.builtin.stat:
        path: "{{ cse_controller_venv_dir }}/bin/python3"
      register: cse_controller_venv_stat

    - name: Create Python 3.10 venv for CyberSecEval
      ansible.builtin.command:
        cmd: "docker exec {{ cse_controller_container }} python3 -m venv {{ cse_controller_venv_dir }}"
      when:
        - not cse_controller_venv_stat.stat.exists
        - not ansible_check_mode

    - name: Install CyberSecEval's Python requirements (idempotent, runs every deploy)
      ansible.builtin.command:
        cmd: >-
          docker exec {{ cse_controller_container }}
          {{ cse_controller_venv_dir }}/bin/pip install -r {{ cse_controller_repo_dir }}/CybersecurityBenchmarks/requirements.txt
      register: cse_controller_pip_install
      changed_when: "'Successfully installed' in cse_controller_pip_install.stdout"
      when: not ansible_check_mode

    - name: Install Celery/Redis client into the CyberSecEval venv (for the worker service)
      ansible.builtin.command:
        cmd: >-
          docker exec {{ cse_controller_container }}
          {{ cse_controller_venv_dir }}/bin/pip install celery==5.4.0 redis==5.2.1
      register: cse_controller_celery_install
      changed_when: "'Successfully installed' in cse_controller_celery_install.stdout"
      when: not ansible_check_mode

    - name: Verify CyberSecEval benchmark runner is importable
      ansible.builtin.command:
        cmd: >-
          docker exec -w {{ cse_controller_repo_dir }} {{ cse_controller_container }}
          {{ cse_controller_venv_dir }}/bin/python3 -m CybersecurityBenchmarks.benchmark.run --help
      register: cse_controller_benchmark_help
      changed_when: false
      when: not ansible_check_mode

    # Plan §8 asks for this once, right after the checkout, not on every
    # code-only deploy afterward -- it verifies the pinned PurpleLlama
    # commit itself, which doesn't change between deploys. Not gated on
    # success (failed_when: false): the plan itself flags a known
    # possible Secure Code Generation import issue at some upstream
    # revisions as an "initially expected" fixup, so a failure here is
    # informational, not necessarily a deploy-blocking regression.
    - name: Run CyberSecEval's own unit test suite (informational, first bootstrap only)
      ansible.builtin.command:
        cmd: >-
          docker exec -w {{ cse_controller_repo_dir }} {{ cse_controller_container }}
          {{ cse_controller_venv_dir }}/bin/python3 -m unittest
      register: cse_controller_unittest
      changed_when: false
      failed_when: false
      when:
        - not ansible_check_mode
        - not cse_controller_repo_stat.stat.exists

    # ---------------------------------------------------------------
    # CyberSOCEval dataset (plan §4/§9). "Install: CrowdStrike dataset"
    # -- malware_analysis's questions.json ships in the repo already,
    # but ships a symlink (hybrid-analysis) expecting this submodule at
    # PurpleLlama/CyberSOCEval_data; threat_intel_reasoning's
    # crowdstrike-reports/ needs it too. Confirmed live 2026-09-19: all
    # 609 malware_analysis questions and all 45 threat_intel_reasoning
    # reports resolve to real files once this submodule is present --
    # no other install step was missing (git-lfs/jq/poppler-utils were
    # already in cse_controller_packages above). Gated on the submodule
    # not already existing -- git submodule add fails loudly if repeated.
    # ---------------------------------------------------------------

    - name: Check whether the CyberSOCEval_data submodule has already been added
      ansible.builtin.stat:
        path: "{{ cse_controller_repo_dir }}/CyberSOCEval_data/.git"
      register: cse_controller_socdata_stat

    - name: Add the CyberSOCEval_data submodule (one-time bootstrap only)
      ansible.builtin.command:
        cmd: git submodule add https://github.com/CrowdStrike/CyberSOCEval_data CyberSOCEval_data
        chdir: "{{ cse_controller_repo_dir }}"
      when: not cse_controller_socdata_stat.stat.exists

    - name: Update the CyberSOCEval_data submodule recursively (first bootstrap only)
      ansible.builtin.command:
        cmd: git submodule update --init --recursive
        chdir: "{{ cse_controller_repo_dir }}"
      register: cse_controller_socdata_update
      changed_when: "'is already registered' not in cse_controller_socdata_update.stderr"
      when:
        - not ansible_check_mode
        - not cse_controller_socdata_stat.stat.exists

    # download_reports.py is internally idempotent per-report-id (skips
    # a report already on disk) but has a known upstream bug: its
    # own end-of-run "Missing Reports/Text/Images" summary produces
    # false negatives whenever a report_id repeats across multiple
    # question entries in report_questions.json (588 questions, only 45
    # unique reports -- confirmed live: every report the script's own
    # summary called "missing" actually has real pdf/txt/png on disk).
    # Do not trust that summary; failed_when: false here reflects that,
    # not a real ignore-errors gap.
    #
    # First bootstrap only (gated on the marker file below) -- these
    # reports don't change once downloaded, so there's no reason to
    # revisit this on every code-only deploy. Also confirmed real
    # 2026-09-19: download_pdf() in the upstream script calls
    # requests.get() with no timeout at all, so a single slow/
    # unresponsive report host can hang this step (and therefore the
    # whole deploy) indefinitely -- `timeout` bounds that even on the
    # one run where this does execute. To force a re-run (e.g. to
    # pick up a report that failed last time), delete the marker file
    # at {{ cse_controller_repo_dir }}/CybersecurityBenchmarks/datasets/
    # crwd_meta/threat_intel_reasoning/.download-complete.
    - name: Check whether threat intel reports have already been downloaded
      ansible.builtin.stat:
        path: "{{ cse_controller_repo_dir }}/CybersecurityBenchmarks/datasets/crwd_meta/threat_intel_reasoning/.download-complete"
      register: cse_controller_threat_intel_stat

    - name: Download and convert Threat Intelligence Reasoning reports (first bootstrap only, bounded)
      ansible.builtin.command:
        cmd: >-
          timeout 300
          docker exec -w {{ cse_controller_repo_dir }} {{ cse_controller_container }}
          {{ cse_controller_venv_dir }}/bin/python3 -m CybersecurityBenchmarks.datasets.crwd_meta.threat_intel_reasoning.download_reports
      register: cse_controller_threat_intel_download
      changed_when: false
      failed_when: false
      when:
        - not ansible_check_mode
        - not cse_controller_threat_intel_stat.stat.exists

    - name: Mark threat intel reports as downloaded (first bootstrap only)
      ansible.builtin.file:
        path: "{{ cse_controller_repo_dir }}/CybersecurityBenchmarks/datasets/crwd_meta/threat_intel_reasoning/.download-complete"
        state: touch
        mode: "0644"
      when:
        - not ansible_check_mode
        - not cse_controller_threat_intel_stat.stat.exists

    # ---------------------------------------------------------------
    # Autonomous-offensive benchmark config (plan §7/§11/§13). Source-
    # controlled per §13's own requirement -- these live in this repo's
    # stack directory, not hand-authored on the host. The SSH private
    # key is the one exception (never in git); see
    # deploy-cse-controller.yml's own history for how it was placed at
    # cse_kali_agent_key_path below.
    # ---------------------------------------------------------------

    - name: Write cyber_range_pairs.json (source-controlled, plan §13)
      ansible.builtin.copy:
        src: "../../stacks/{{ cse_controller_stack_name }}/cyberseceval-config/cyber_range_pairs.json"
        dest: /srv/cyberseceval/config/cyber_range_pairs.json
        mode: "0644"

    - name: Write the autonomous-uplift prep script (source-controlled, plan §13)
      ansible.builtin.copy:
        src: "../../stacks/{{ cse_controller_stack_name }}/cyberseceval-config/run-autonomous-uplift.sh"
        dest: /srv/cyberseceval/config/run-autonomous-uplift.sh
        mode: "0755"

    - name: Write the Celery worker's task module (source-controlled, docs/cyberseceval-panel)
      ansible.builtin.copy:
        src: "../../stacks/{{ cse_controller_stack_name }}/cyberseceval-config/cse_tasks.py"
        dest: /srv/cyberseceval/config/cse_tasks.py
        mode: "0644"

    # The Framework lock shared with the eval battery's worker on
    # ai-services-stack (docs/benchmark-panel/plan.md, C). On the worker's
    # PYTHONPATH next to cse_tasks.py.
    - name: Write the shared Framework lock module
      ansible.builtin.copy:
        src: "../files/framework-lock/framework_lock.py"
        dest: /srv/cyberseceval/config/framework_lock.py
        mode: "0644"

    # Now that celery is installed into the venv and cse_tasks.py exists,
    # start the worker service. Explicitly scoped to controller/worker --
    # a bare "up -d" also starts every other service in this compose
    # file, including pentest-worker/pentest-viewer-proxy, whose own venv
    # doesn't exist yet at this point in the play (confirmed live: a bare
    # "up -d" here failed those two containers with "no such file or
    # directory" for a venv binary that a later play creates).
    - name: Start worker container via docker compose
      ansible.builtin.command:
        cmd: docker compose up -d controller worker
        chdir: "{{ cse_controller_stack_dir }}"
      register: cse_controller_worker_up
      changed_when: "'Started' in cse_controller_worker_up.stdout or 'Created' in cse_controller_worker_up.stdout"
      when: not ansible_check_mode

    # docker compose up -d does NOT restart a container just because a
    # bind-mounted file it reads (cse_tasks.py) changed on disk -- only
    # a real compose-file/image change does (same real bug found and
    # fixed in deploy-cse-panel-stack.yml the same day). Without this,
    # an already-running worker keeps executing whatever cse_tasks.py
    # it loaded at its own last start, silently ignoring any update.
    # Unconditional, not gated on the copy task's own changed flag --
    # change-detection has a real gap (content already matching on disk
    # from an earlier deploy reports no change, even though that
    # earlier deploy never actually restarted the process either,
    # confirmed live the same day) and skip it only when this run just
    # freshly created the container (nothing to restart yet).
    - name: Restart worker to pick up any cse_tasks.py changes
      ansible.builtin.command:
        cmd: docker compose restart worker
        chdir: "{{ cse_controller_stack_dir }}"
      when:
        - not ansible_check_mode
        - not cse_controller_worker_up.changed

    - name: Wait for worker container to be running
      ansible.builtin.command:
        cmd: "docker inspect -f {{ '{{.State.Running}}' }} cse-controller-worker"
      register: cse_controller_worker_running
      until: cse_controller_worker_running.stdout == "true"
      retries: 10
      delay: 3
      changed_when: false
      when: not ansible_check_mode

  handlers:
    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted

- name: Enable unattended security updates (fleet rollout, 2026-08-30)
  hosts: all
  become: true
  gather_facts: false
  roles:
    - unattended_upgrades

- name: Share CyberSecEval's Nextcloud Reports folder with steve
  hosts: all
  gather_facts: false
  vars:
    nextcloud_reports_user: "{{ lookup('env', 'NEXTCLOUD_REPORTS_USER') | default('', true) }}"
    nextcloud_reports_app_password: "{{ lookup('env', 'NEXTCLOUD_REPORTS_APP_PASSWORD') | default('', true) }}"
    # Real fix, 2026-09-30: the direct apps_seg IP:port URL (192.168.120.10:8080)
    # isn't in Nextcloud's own trusted_domains and gets rejected with a 400
    # ("Access through untrusted domain") -- confirmed live. Deriving the base
    # URL from NEXTCLOUD_REPORTS_WEBDAV_URL (its own /remote.php/dav/files/<user>
    # suffix stripped off) instead of a second hardcoded value means there's one
    # source of truth, and it goes through the existing Traefik ingress
    # (nextcloud.lab.gibbsgreatly.xyz, already trusted) instead of the raw LAN
    # IP -- confirmed reachable live from inside the worker container with
    # default cert verification, so no cse_seg -> apps_seg firewall rule is
    # needed either.
    nextcloud_reports_webdav_url: "{{ lookup('env', 'NEXTCLOUD_REPORTS_WEBDAV_URL') | default('', true) }}"
  roles:
    - role: nextcloud_folder_share
      when: nextcloud_reports_user | length > 0 and nextcloud_reports_app_password | length > 0 and nextcloud_reports_webdav_url | length > 0
      vars:
        nextcloud_folder_share_base_url: "{{ nextcloud_reports_webdav_url | regex_replace('/remote\\.php/dav/files/.*$', '') }}"
        nextcloud_folder_share_owner_user: "{{ nextcloud_reports_user }}"
        nextcloud_folder_share_owner_password: "{{ nextcloud_reports_app_password }}"
        nextcloud_folder_share_folder: "Reports/cyberseceval"
        # Read+update+create+delete (1+2+4+8=15), not the role's
        # read-only default (1) -- this is the operator's own reports
        # folder, they need to be able to delete old/test runs from
        # Nextcloud's own UI, not just view them. No re-share bit (16).
        nextcloud_folder_share_permissions: 15

- name: Deploy the Pentest lab worker and native-detail viewer proxy (live-panel-plan.md)
  hosts: all
  become: true
  gather_facts: false

  vars:
    pentest_worker_dir: /srv/pentest-worker
    pentest_worker_launcher_dir: "{{ pentest_worker_dir }}/launcher"
    pentest_worker_venv_dir: "{{ pentest_worker_dir }}/.venv"
    pentest_worker_ssh_key_path: "{{ pentest_worker_dir }}/id_pentest_runner"
    # Separate venv from CyberSecEval's own (/srv/cyberseceval/.venv) --
    # different project, different lifecycle, and the only dependencies
    # this one needs (celery, redis) are tiny; sharing would couple two
    # unrelated workers' dependency upgrades for no benefit.

  tasks:
    - name: Create the pentest-worker directory
      ansible.builtin.file:
        path: "{{ pentest_worker_launcher_dir }}"
        state: directory
        mode: "0755"

    # One flat PYTHONPATH directory -- pentest_tasks.py/viewer_proxy.py
    # import run_task/fixture_control/activity_status/framework_lock_client/
    # view_run as same-directory siblings, exactly as they already do on
    # pentest-runner and in this repo's own test suite. Copied, not a
    # second maintained version -- the worker must call the exact same
    # code the operator's own CLI does (run_task.py's own docstring).
    - name: Deploy the shared launcher library (same code as pentest-runner's CLI)
      ansible.builtin.copy:
        src: "../../stacks/pentest-runner/launcher/{{ item }}"
        dest: "{{ pentest_worker_launcher_dir }}/{{ item }}"
        mode: "0644"
      loop:
        - run_task.py
        - activity_status.py
        - framework_lock_client.py
        - fixture_control.py
        - view_run.py
        # Their own tests, deployed alongside -- "Run the pentest-worker's
        # own unit tests" below needs these present, not just the modules
        # (confirmed live: "discover" silently finds zero tests without
        # them, which is not the same thing as them passing).
        - test_run_task.py
        - test_activity_status.py
        - test_framework_lock_client.py
        - test_fixture_control.py
        - test_view_run.py

    - name: Deploy the worker and viewer-proxy modules
      ansible.builtin.copy:
        src: "../../stacks/cse-controller/pentest-worker-config/{{ item }}"
        dest: "{{ pentest_worker_launcher_dir }}/{{ item }}"
        mode: "0644"
      loop:
        - pentest_tasks.py
        - viewer_proxy.py
        - test_pentest_tasks.py
        - test_viewer_proxy.py

    # Writes the dedicated identity from OpenBao -- never the operator's
    # own key. The matching public key is hardcoded (non-secret) directly
    # in deploy-pentest-runner.yml/deploy-pentest-fixture.yml's own
    # authorized_keys task; if this key is ever rotated, both must change
    # together. Stored base64-encoded, same convention as
    # GVM_SCAN_SSH_PRIVATE_KEY (scripts/gvm_scan_host_secret.py) --
    # openbao_write.py reads stdin one line at a time, and a raw
    # multi-line PEM key doesn't survive that; decoded back here with
    # Ansible's own b64decode filter, no extra helper script needed.
    - name: Write the pentest-worker's dedicated SSH private key
      no_log: true
      ansible.builtin.copy:
        content: >-
          {{ (lookup('env', 'PENTEST_WORKER_SSH_PRIVATE_KEY')
              | mandatory('PENTEST_WORKER_SSH_PRIVATE_KEY must be set')
              | b64decode) }}
        dest: "{{ pentest_worker_ssh_key_path }}"
        mode: "0600"

    - name: Write/refresh the pentest-worker's docker-compose.yml
      ansible.builtin.copy:
        content: "{{ lookup('file', '../../stacks/cse-controller/docker-compose.yml') }}"
        dest: /opt/stacks/cse-controller/docker-compose.yml
        mode: "0644"

    - name: Validate docker compose configuration after the pentest-worker services are added
      ansible.builtin.command:
        cmd: docker compose config
        chdir: /opt/stacks/cse-controller
      environment:
        LAB_IP_CSE_PANEL: "{{ lookup('env', 'LAB_IP_CSE_PANEL') | default('', true) }}"
        CSE_PANEL_REDIS_PASSWORD: "{{ lookup('env', 'CSE_PANEL_REDIS_PASSWORD') | default('', true) }}"
      changed_when: false

    # Start the viewer-proxy first -- it has no venv dependency (stdlib
    # only), and its container is what creates/populates the venv below,
    # matching the existing CyberSecEval venv's own precedent exactly
    # (docker exec into a running container of the same image, never the
    # host's own python3). Confirmed live: a venv created by running
    # python3 -m venv directly on the host embeds the HOST's own
    # /usr/bin/python3 in its activation symlinks, which does not exist
    # at that path inside the container's separate filesystem -- "exec:
    # no such file or directory" for the venv's own celery script, not a
    # missing-file problem but a wrong-namespace one.
    - name: Start the viewer-proxy service (no venv dependency)
      ansible.builtin.command:
        cmd: docker compose up -d pentest-viewer-proxy
        chdir: /opt/stacks/cse-controller
      environment:
        LAB_IP_CSE_PANEL: "{{ lookup('env', 'LAB_IP_CSE_PANEL') | default('', true) }}"
        CSE_PANEL_REDIS_PASSWORD: "{{ lookup('env', 'CSE_PANEL_REDIS_PASSWORD') | default('', true) }}"
      register: pentest_viewer_proxy_up
      changed_when: "'Started' in pentest_viewer_proxy_up.stdout or 'Created' in pentest_viewer_proxy_up.stdout"

    - name: Check whether the pentest-worker venv already exists
      ansible.builtin.command:
        cmd: docker exec cse-controller-pentest-viewer-proxy test -f /srv/pentest-worker/.venv/bin/python3
      register: pentest_worker_venv_check
      failed_when: false
      changed_when: false

    - name: Create Python venv for the pentest-worker (inside the container, not the host)
      ansible.builtin.command:
        cmd: docker exec cse-controller-pentest-viewer-proxy python3 -m venv /srv/pentest-worker/.venv
      when: pentest_worker_venv_check.rc != 0

    - name: Install Celery/Redis client into the pentest-worker venv
      ansible.builtin.command:
        cmd: docker exec cse-controller-pentest-viewer-proxy /srv/pentest-worker/.venv/bin/pip install celery==5.4.0 redis==5.2.1
      register: pentest_worker_pip_install
      changed_when: "'Successfully installed' in pentest_worker_pip_install.stdout"

    - name: Run the pentest-worker's own unit tests before starting it
      ansible.builtin.command:
        cmd: >-
          docker exec
          -e CELERY_BROKER_URL=memory://
          -e CELERY_RESULT_BACKEND=cache+memory://
          -w /srv/pentest-worker/launcher
          cse-controller-pentest-viewer-proxy
          /srv/pentest-worker/.venv/bin/python3 -m unittest discover -s . -p test_*.py
      register: pentest_worker_tests
      changed_when: false

    - name: Start the pentest-worker service
      ansible.builtin.command:
        cmd: docker compose up -d pentest-worker
        chdir: /opt/stacks/cse-controller
      environment:
        LAB_IP_CSE_PANEL: "{{ lookup('env', 'LAB_IP_CSE_PANEL') | default('', true) }}"
        CSE_PANEL_REDIS_PASSWORD: "{{ lookup('env', 'CSE_PANEL_REDIS_PASSWORD') | default('', true) }}"
      register: pentest_worker_compose_up
      changed_when: "'Started' in pentest_worker_compose_up.stdout or 'Created' in pentest_worker_compose_up.stdout"

    # Same idempotent docker-exec-apt-get pattern this file already uses
    # for the `controller` container above -- these are bare python:3.10-
    # slim images, so run_task.py/fixture_control.py/view_run.py's own
    # `subprocess.run(["ssh", ...])` calls have nothing to execute without
    # this. Checked per-container, not gated on a bootstrap marker file:
    # cheap, and correctly re-installs after a container recreation.
    - name: Check whether openssh-client is already installed in each new container
      ansible.builtin.command:
        cmd: "docker exec {{ item }} dpkg -s openssh-client"
      loop:
        - cse-controller-pentest-worker
        - cse-controller-pentest-viewer-proxy
      register: pentest_worker_ssh_client_check
      failed_when: false
      changed_when: false

    - name: Install openssh-client in each new container where it's missing
      ansible.builtin.command:
        cmd: "docker exec {{ item.item }} sh -c 'apt-get update && apt-get install -y --no-install-recommends openssh-client'"
      loop: "{{ pentest_worker_ssh_client_check.results }}"
      when: item.rc != 0
      changed_when: true

- name: Provision the dedicated GVM credentialed-scan account (docs/gvm-coverage-cleanup/plan.md)
  hosts: all
  become: true
  gather_facts: false
  pre_tasks:
    - name: Read this stack's GVM scan credentials from OpenBao
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../../../../scripts/gvm_scan_host_secret.py"
          - --stack
          - cse-controller
      register: gvm_scan_secret_raw
      delegate_to: localhost
      become: false
      changed_when: false
    - name: Parse the credentials JSON
      ansible.builtin.set_fact:
        gvm_scan_secret: "{{ gvm_scan_secret_raw.stdout | from_json }}"
  vars:
    gvm_scan_account_public_key: "{{ gvm_scan_secret.GVM_SCAN_SSH_PUBLIC_KEY }}"
  roles:
    - gvm_scan_account
