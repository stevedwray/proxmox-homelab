---
# Companion vanilla-upstream PentAGI install, co-located on the SAME LXC as
# pentagi-stack (192.168.70.10) so it can share pentagi-stack's existing
# Traefik/DNS/Authentik route with zero edge changes. Deliberately does NOT
# start the compose project -- upstream's docker-compose.yml hardcodes fixed
# container_name values (pentagi, pgvector, scraper, pgexporter) and this
# same host port, so only one of /opt/pentagi-stack or
# /opt/pentagi-upstream-vanilla can be "up" at a time. Switching between them
# is a manual `docker compose down` (on the active one, to free the
# container names) + `docker compose up -d` (on the other) pair -- see the
# switch commands in docs/pentagi-stack/README.md. This playbook only lays
# down config and pulls/validates images so that switch is instant.
#
# Invoke directly against pentagi-stack's own inventory (there is no
# separate stack.yaml/LXC for this companion):
#   ansible-playbook \
#     -i terraform/lxc/environments/pve/pentagi-stack/inventory.yml -u root \
#     terraform/lxc/ansible/playbooks/deploy-pentagi-upstream-vanilla-companion.yml
- name: Deploy vanilla-upstream PentAGI companion (same LXC as pentagi-stack)
  hosts: all
  become: true
  gather_facts: true

  vars:
    vanilla_compose_dir: /opt/pentagi-upstream-vanilla
    # Ansible's pipe lookup removes the final newline even with rstrip=False;
    # restore it so this file is byte-for-byte the upstream tracked object.
    vanilla_compose_content: "{{ lookup('pipe', 'git -C /home/steve/git/pentagi show upstream/main:docker-compose.yml') + '\n' }}"
    vanilla_compose_sha256: >-
      {{ lookup('pipe', "git -C /home/steve/git/pentagi show upstream/main:docker-compose.yml | sha256sum | cut -d ' ' -f1") }}
    vanilla_framework_host: framework.gibbsgreatly.xyz
    vanilla_ollama_model: qwen3.6-35b-a3b-ud:q4_k_m
    vanilla_embedding_model: nomic-embed-text
    vanilla_registry_host: "{{ lookup('env', 'LAB_FQDN_HARBOR') | default('harbor.lab.gibbsgreatly.xyz', true) }}"
    vanilla_cached_images:
      - source: "{{ vanilla_registry_host }}/dockerhub/vxcontrol/pentagi:latest"
        target: vxcontrol/pentagi:latest
      - source: "{{ vanilla_registry_host }}/dockerhub/vxcontrol/pgvector:latest"
        target: vxcontrol/pgvector:latest
      - source: "{{ vanilla_registry_host }}/dockerhub/vxcontrol/scraper:latest"
        target: vxcontrol/scraper:latest
      - source: "{{ vanilla_registry_host }}/quay/prometheuscommunity/postgres-exporter:v0.16.0"
        target: quay.io/prometheuscommunity/postgres-exporter:v0.16.0

  tasks:
    - name: Create vanilla-upstream compose directory
      ansible.builtin.file:
        path: "{{ vanilla_compose_dir }}"
        state: directory
        mode: "0750"

    - name: Write verbatim upstream Docker Compose file
      ansible.builtin.copy:
        content: "{{ vanilla_compose_content }}"
        dest: "{{ vanilla_compose_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Write native Ollama-only vanilla configuration
      ansible.builtin.copy:
        dest: "{{ vanilla_compose_dir }}/.env"
        mode: "0600"
        content: |
          OLLAMA_SERVER_URL=http://{{ vanilla_framework_host }}:11434
          OLLAMA_SERVER_MODEL={{ vanilla_ollama_model }}
          EMBEDDING_URL=http://{{ vanilla_framework_host }}:11434
          EMBEDDING_MODEL={{ vanilla_embedding_model }}
          EMBEDDING_PROVIDER=ollama
          # Same IP:port pentagi-stack's own Traefik route already targets
          # (this LXC's pentest_seg IP) so the route needs zero changes
          # whichever compose project happens to be up.
          PENTAGI_LISTEN_IP={{ ansible_host }}
          PENTAGI_LISTEN_PORT=8443
          SERVER_USE_SSL=false

    - name: Pull upstream images through the Harbor proxy cache
      ansible.builtin.command:
        cmd: "docker pull {{ item.source }}"
      register: vanilla_image_pull
      changed_when: "'Downloaded newer image' in vanilla_image_pull.stdout or 'Pull complete' in vanilla_image_pull.stdout"
      loop: "{{ vanilla_cached_images }}"

    - name: Tag cached images with their upstream Compose names
      ansible.builtin.command:
        cmd: "docker tag {{ item.source }} {{ item.target }}"
      changed_when: false
      loop: "{{ vanilla_cached_images }}"

    - name: Validate verbatim upstream Docker Compose configuration
      ansible.builtin.command:
        cmd: docker compose config
        chdir: "{{ vanilla_compose_dir }}"
      changed_when: false

    - name: Verify written Compose matches upstream reference
      ansible.builtin.command:
        cmd: sha256sum docker-compose.yml
        chdir: "{{ vanilla_compose_dir }}"
      register: vanilla_compose_sha256_check
      changed_when: false
      failed_when: "vanilla_compose_sha256_check.stdout.split()[0] != vanilla_compose_sha256"

    - name: Verify requested Ollama model is visible from this LXC
      ansible.builtin.uri:
        url: "http://{{ vanilla_framework_host }}:11434/api/tags"
        return_content: true
      register: vanilla_ollama_tags
      changed_when: false
      failed_when: "vanilla_ollama_model not in vanilla_ollama_tags.content"

    # Deliberately no "docker compose up -d" here -- this project shares a
    # host port and fixed container names with /opt/pentagi-stack, so only
    # one can be running at a time. Starting it is a manual, explicit switch
    # (see docs/pentagi-stack/README.md), not something this playbook does.
