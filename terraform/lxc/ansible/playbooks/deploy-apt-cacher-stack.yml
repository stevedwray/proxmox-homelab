---
- name: Deploy apt-cacher-ng
  hosts: all
  become: true
  gather_facts: false

  pre_tasks:
    - name: Apply lxc_base role (DNS, CA trust, node_exporter)
      ansible.builtin.include_role:
        name: lxc_base

  tasks:
    - name: Mask portainer-agent service (platform tier — no agent on this host)
      ansible.builtin.systemd:
        name: portainer-agent.service
        masked: true
        enabled: false
      failed_when: false

    - name: Install apt-cacher-ng
      ansible.builtin.apt:
        name: apt-cacher-ng
        state: present
        update_cache: true

    - name: Ensure apt-cacher-ng is enabled and running
      ansible.builtin.systemd:
        name: apt-cacher-ng
        enabled: true
        state: started
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Configure PassThroughPattern to allow HTTPS passthrough
      ansible.builtin.lineinfile:
        path: /etc/apt-cacher-ng/acng.conf
        regexp: "^#?PassThroughPattern:"
        line: "PassThroughPattern: .*"
      notify: Restart apt-cacher-ng
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Check whether UFW is active
      ansible.builtin.command:
        argv:
          - ufw
          - status
      register: ufw_status
      changed_when: false
      failed_when: false

    - name: Allow apt-cacher-ng through UFW
      ansible.builtin.command:
        argv:
          - ufw
          - allow
          - "3142/tcp"
      when: "ufw_status.stdout is search('Status: active')"

  handlers:
    - name: Restart apt-cacher-ng
      ansible.builtin.systemd:
        name: apt-cacher-ng
        state: restarted

- name: Enroll this host as a Wazuh agent (pilot rollout, 2026-08-29)
  hosts: all
  become: true
  gather_facts: false
  tags: [wazuh_agent_rollout]
  vars:
    wazuh_agent_fim_paths:
      - /etc/apt-cacher-ng
    wazuh_agent_group: infra_seg
  roles:
    - wazuh_agent

- name: Provision the dedicated GVM credentialed-scan account (docs/lxc-scan-and-monitoring-rollout/plan.md gvm-06)
  hosts: all
  become: true
  gather_facts: false
  pre_tasks:
    - name: Read this stack's GVM scan credentials from OpenBao
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../../../../scripts/gvm_scan_host_secret.py"
          - --stack
          - apt-cacher-stack
      register: gvm_scan_secret_raw
      delegate_to: localhost
      become: false
      changed_when: false
    - name: Parse the credentials JSON
      ansible.builtin.set_fact:
        gvm_scan_secret: "{{ gvm_scan_secret_raw.stdout | from_json }}"
  vars:
    gvm_scan_account_public_key: "{{ gvm_scan_secret.GVM_SCAN_SSH_PUBLIC_KEY }}"
    gvm_scan_account_sudo_password_hash: "{{ gvm_scan_secret.GVM_SCAN_SUDO_PASSWORD | password_hash('sha512') }}"
  roles:
    - gvm_scan_account

- name: Enable unattended security updates (pilot rollout, 2026-08-30)
  hosts: all
  become: true
  gather_facts: false
  roles:
    - unattended_upgrades
