---
- name: Deploy apt-cacher-ng
  hosts: all
  become: true
  gather_facts: false

  pre_tasks:
    - name: Apply lxc_base role (DNS, CA trust, node_exporter)
      ansible.builtin.include_role:
        name: lxc_base

  tasks:
    - name: Mask portainer-agent service (platform tier — no agent on this host)
      ansible.builtin.systemd:
        name: portainer-agent.service
        masked: true
        enabled: false
      failed_when: false

    - name: Install apt-cacher-ng
      ansible.builtin.apt:
        name: apt-cacher-ng
        state: present
        update_cache: true

    - name: Ensure apt-cacher-ng is enabled and running
      ansible.builtin.systemd:
        name: apt-cacher-ng
        enabled: true
        state: started
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Configure PassThroughPattern to allow HTTPS passthrough
      ansible.builtin.lineinfile:
        path: /etc/apt-cacher-ng/acng.conf
        regexp: "^#?PassThroughPattern:"
        line: "PassThroughPattern: .*"
      notify: Restart apt-cacher-ng
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Check whether UFW is active
      ansible.builtin.command:
        argv:
          - ufw
          - status
      register: ufw_status
      changed_when: false
      failed_when: false

    - name: Allow apt-cacher-ng through UFW
      ansible.builtin.command:
        argv:
          - ufw
          - allow
          - "3142/tcp"
      when: "ufw_status.stdout is search('Status: active')"

  handlers:
    - name: Restart apt-cacher-ng
      ansible.builtin.systemd:
        name: apt-cacher-ng
        state: restarted

- name: Enroll this host as a Wazuh agent (pilot rollout, 2026-08-29)
  hosts: all
  become: true
  gather_facts: false
  vars:
    wazuh_agent_fim_paths:
      - /etc/apt-cacher-ng
  roles:
    - wazuh_agent

- name: Enable unattended security updates (pilot rollout, 2026-08-30)
  hosts: all
  become: true
  gather_facts: false
  roles:
    - unattended_upgrades
