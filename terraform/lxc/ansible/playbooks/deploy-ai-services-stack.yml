# ai-services-stack -- ai_seg zone (pve / pve-test-vm).
# See docs/ai-services-migration/plan.md for the full migration design.
#
# Deploys OpenWebUI and its private SearXNG search backend on a dedicated
# ai_seg LXC. This replaces the bare-metal deployment on framework
# (ansible/00-initial-setup/framework-desktop-openwebui.yml, retained there
# for reference/rollback until the cutover is confirmed stable) -- both
# services are pure network clients of the model-serving layer
# (llamacpp-router/ollama), with no GPU need of their own, so they no longer
# need to share framework's host.
#
# The one real config change versus the framework deployment: OpenWebUI's
# llama.cpp/Ollama routes now cross a real subnet boundary (ai_seg ->
# framework's flat LAN) instead of reaching a same-host Docker gateway, so
# they point at framework.gibbsgreatly.xyz instead of host.docker.internal.

---
- name: Configure Docker base
  hosts: all
  become: true
  gather_facts: true
  roles:
    - lxc_base
    - docker_base

  tasks:
    - name: Configure Docker daemon logging
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "50m",
              "max-file": "7"
            }
          }
      notify: Restart Docker

  handlers:
    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted

- name: Deploy OpenWebUI and SearXNG compose stack
  hosts: all
  become: true
  gather_facts: false

  vars:
    ai_services_compose_dir: /opt/ai-services-stack
    ai_services_lab_domain: "{{ lookup('env', 'LAB_DOMAIN') | mandatory('LAB_DOMAIN env var is required') }}"
    # ai_seg is a deliberately contained zone (same class as pentest_seg)
    # with no direct route to Harbor's infra_seg IP -- confirmed live
    # 2026-08-02 when a raw LAB_IP_HARBOR pull timed out
    # ("context deadline exceeded" reaching Harbor's infra_seg IP
    # directly). pentagi-stack/greenbone-stack (pentest_seg, the other
    # contained zone) already solved this: pull via harbor.${LAB_DOMAIN},
    # routed through Traefik/edge_seg, not Harbor's own IP directly. Uses
    # the same ai_seg -> edge_seg:443 firewall rule this playbook's OIDC
    # route already needs -- no separate Harbor-specific rule required.
    ai_services_registry_host: "{{ lookup('env', 'LAB_FQDN_HARBOR') | default('harbor.' ~ ai_services_lab_domain, true) }}"
    # Pinned by digest rather than :main/:latest -- see
    # ansible/00-initial-setup/framework-desktop-openwebui.yml's header
    # comment for why. Same digests as the framework deployment being
    # replaced (open-webui v0.10.2, searxng 2026.7.19+6da6eee26); a
    # deliberate upgrade should update both playbooks together until the
    # framework deployment is fully decommissioned (plan.md Step 8).
    ai_services_openwebui_image: "{{ ai_services_registry_host }}/ghcr/open-webui/open-webui@sha256:a26effeb220e132482bf7e0560b3404843e7bc40d23051144e062960df8df6b0"  # v0.10.2
    ai_services_searxng_image: "{{ ai_services_registry_host }}/dockerhub/searxng/searxng@sha256:b8ca38ba06eea544d7555e88321e212ddc0d5c3c7de055419cfb2e5c6bf30812"  # 2026.7.19+6da6eee26
    # Container port 8080 published as host port 8081 -- 8080 stays free
    # in case something on this LXC ever wants it, matching edge.yaml's
    # comment. No LAN-facing port collision to avoid here (unlike
    # framework, which also runs llamacpp-router on :8080).
    ai_services_openwebui_port: 8081
    ai_services_searxng_port: 8082
    # Internal direct-TLS endpoint (step-ca issued, mgmt_seg), not the
    # public authentik.${LAB_DOMAIN} route -- corrected 2026-08-02: the
    # public route's cert on pve-test-vm is Let's Encrypt *staging*
    # (untrusted by design), which breaks OpenWebUI's backend-side OIDC
    # discovery fetch even though a human can click through the same cert
    # in a browser. authentik-int has no such issue (real Homelab-CA
    # trust) and its self-reported authorize/token endpoints are fully
    # functional on this hostname (confirmed live, both plain :443 and
    # :9443 work identically). See docs/design/lessons-learned.md's
    # Authentik section and the ai_seg -> mgmt_seg:443 firewall rule this
    # requires (mikrotik-firewall-ai-services-stack.yml).
    ai_services_authentik_fqdn: "{{ lookup('env', 'LAB_FQDN_AUTHENTIK_INTERNAL') | default('authentik-int.' ~ ai_services_lab_domain, true) }}"
    ai_services_openwebui_oidc_client_id: "{{ lookup('env', 'OPENWEBUI_OIDC_CLIENT_ID') | default('openwebui', true) }}"
    ai_services_openwebui_oidc_client_secret: >-
      {{ lookup('env', 'OPENWEBUI_OIDC_CLIENT_SECRET')
         | mandatory('OPENWEBUI_OIDC_CLIENT_SECRET env var is required') }}
    ai_services_openwebui_lmstudio_api_base: "https://llm.{{ ai_services_lab_domain }}/v1"
    # The one real config change versus the framework deployment: this LXC
    # reaches llamacpp-router/ollama across a real ai_seg -> framework
    # subnet hop, not a same-host Docker gateway -- see plan.md Step 3 and
    # the ai_seg -> framework:8080,11434 egress rule it requires.
    # FQDN, not LAB_IP_FRAMEWORK's raw IP -- matches the established
    # precedent for the other contained zone reaching framework the same
    # way: deploy-pentagi-stack.yml's pentagi_framework_host, same
    # FRAMEWORK_HOST env var / framework.gibbsgreatly.xyz default, same
    # :8080/:11434 ports. DNS resolution from containers on this LXC is
    # already proven live (Harbor's own hostname pull succeeded the same
    # way during this deployment).
    ai_services_framework_host: "{{ lookup('env', 'FRAMEWORK_HOST') | default('framework.gibbsgreatly.xyz', true) }}"
    # See the DEFAULT_MODELS env var below for why this exists at all --
    # keep in sync with whichever model is actually kept loaded on
    # framework's llama-swap, not a general "best" default.
    ai_services_openwebui_default_model: "{{ lookup('env', 'OPENWEBUI_DEFAULT_MODEL') | default('Laguna-S-2.1-UD-Q4_K_M-00001-of-00003', true) }}"
    # Plaintext HTTP across a real subnet hop, not same-host -- unlike the
    # SearXNG vars below. Deliberate, not overlooked: llamacpp-router
    # enforces no auth on :8080 to any caller today (confirmed live
    # 2026-08-02, see plan.md Step 3), so this widens network *reach* to
    # an already-unauthenticated service, not authentication exposure --
    # access control here is firewall-only already, same posture as
    # Ollama's :11434. Revisit if the operator decides to add real auth to
    # the router (open question in plan.md).
    ai_services_openwebui_llamacpp_api_base: "http://{{ ai_services_framework_host }}:8080/v1"  # NOSONAR: ansible:S5332 - accepted risk, see plan.md Step 3
    ai_services_openwebui_ollama_api_base: "http://{{ ai_services_framework_host }}:11434"  # NOSONAR: ansible:S5332 - accepted risk, see plan.md Step 3
    ai_services_openwebui_llm_api_key: "{{ lookup('env', 'LLM_GPU_STACK_API_KEY') | mandatory('LLM_GPU_STACK_API_KEY env var is required') }}"
    # Reused as-is from the framework deployment -- signs sessions/JWTs, so
    # a fresh data dir on this new LXC must not mint a new one and silently
    # invalidate the migrated OpenWebUI DB's existing sessions.
    ai_services_openwebui_webui_secret_key: "{{ lookup('env', 'OPENWEBUI_WEBUI_SECRET_KEY') | mandatory('OPENWEBUI_WEBUI_SECRET_KEY env var is required') }}"
    ai_services_searxng_secret_key: "{{ lookup('env', 'SEARXNG_SECRET_KEY') | mandatory('SEARXNG_SECRET_KEY env var is required') }}"
    # OpenWebUI's own RAG web-search talks to SearXNG over the internal
    # Docker network -- unrelated to the LAN-facing port below.
    ai_services_searxng_query_url: "http://searxng:8080/search?q=<query>&format=json"  # NOSONAR: internal-only Docker network
    ai_services_searxng_base_url: "http://searxng:8080/"  # NOSONAR: ansible:S5332 - internal-only Docker network; SearXNG has no published host port
    # Optional, unlike the mandatory secrets above -- web search works
    # without either, just with fewer/lower-quality engines. See
    # docs/design/lessons-learned.md's SearXNG entry for why the default
    # scraped engines mostly don't work from this network and these were
    # added.
    ai_services_brave_search_api_key: "{{ lookup('env', 'BRAVE_SEARCH_API_KEY') | default('', true) }}"
    # SearXNG's built-in `google_cse` engine is hardcoded to a shared
    # third-party CSE token and ignores any api_key/cx configured --
    # confirmed against both this deployed image and upstream SearXNG's
    # current master, no version implements the real Custom Search JSON
    # API. `google_customsearch.py` (searxng-engines/) does, using these
    # two real credentials. cx is a curated small site list, not general
    # web search -- see the engine entry's comment below.
    ai_services_google_cse_id: "{{ lookup('env', 'GOOGLE_CSE_ID') | default('', true) }}"
    ai_services_google_cse_api_key: "{{ lookup('env', 'GOOGLE_CSE_API_KEY') | default('', true) }}"

  tasks:
    - name: Create ai-services-stack compose directory
      ansible.builtin.file:
        path: "{{ ai_services_compose_dir }}"
        state: directory
        mode: "0750"

    - name: Install custom SearXNG engine modules
      ansible.builtin.copy:
        src: "../../stacks/ai-services-stack/searxng-engines/"
        dest: "{{ ai_services_compose_dir }}/searxng-engines/"
        mode: "0640"

    - name: Seed SearXNG settings with JSON output enabled
      community.docker.docker_container:
        name: ai-services-searxng-settings-seed
        image: "{{ ai_services_registry_host }}/dockerhub/library/busybox:1.36"
        state: started
        detach: false
        cleanup: true
        volumes:
          - "ai-services-searxng-data:/etc/searxng"
        command:
          - sh
          - -c
          - |
            if [ ! -f /etc/searxng/settings.yml ]; then
              cat > /etc/searxng/settings.yml <<'EOF'
            use_default_settings: true
            server:
              secret_key: "{{ ai_services_searxng_secret_key }}"
            search:
              formats:
                - html
                - json
            EOF
            fi
      no_log: true

    - name: Ensure SearXNG's engine selection matches what's actually reachable
      ansible.builtin.blockinfile:
        path: "/var/lib/docker/volumes/ai-services-searxng-data/_data/settings.yml"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - working-engines override"
        insertafter: EOF
        block: |
          engines:
            # Confirmed live 2026-08-02: TCP connect to duckduckgo's html
            # endpoint (20.43.x.x, Azure-hosted) times out from this LAN --
            # reproduced from both pve-test-vm and a separate workstation on
            # the same WAN uplink, so it's a network-path issue upstream of
            # this stack, not an ai_seg firewall gap. google cse, startpage,
            # brave, qwant, and yahoo are all reachable but bot-detect and
            # suspend/CAPTCHA a self-hosted SearXNG's scraped requests within
            # a query or two. Left enabled by SearXNG's own defaults
            # (use_default_settings: true), these don't just fail
            # silently -- they eat the whole per-engine timeout window on
            # every query, which is what surfaces to OpenWebUI as
            # "404: No results found from web search" even though other
            # engines would have answered in time. See
            # docs/design/lessons-learned.md's SearXNG entry.
            - name: duckduckgo
              disabled: true
            - name: duckduckgo web
              disabled: true
            - name: google cse
              disabled: true
            - name: startpage
              disabled: true
            - name: brave
              disabled: true
            - name: qwant
              disabled: true
            - name: yahoo
              disabled: true
            - name: presearch
              disabled: true
            # Confirmed live 2026-08-02: both return real, relevant results
            # with no bot-detection pushback from this network -- mwmbl is
            # an independent crowdsourced index, searchmysite indexes
            # personal/independent sites. Neither is enabled by SearXNG's
            # own defaults.
            - name: mwmbl
              disabled: false
            - name: searchmysite
              disabled: false
            # Confirmed live 2026-08-02: scraped Bing, unlike the other
            # scraped engines above, returns clean results with zero
            # bot-detection pushback from this network. Not enabled by
            # SearXNG's own defaults.
            - name: bing
              disabled: false
            {% if ai_services_brave_search_api_key %}
            # Real API, not the scraped `brave` engine (left disabled
            # above) -- structurally avoids the CAPTCHA problem instead of
            # hoping this network's IP reputation improves.
            - name: braveapi
              engine: braveapi
              shortcut: bra
              api_key: "{{ ai_services_brave_search_api_key }}"
              disabled: false
            {% endif %}
            {% if ai_services_google_cse_id and ai_services_google_cse_api_key %}
            # Real Custom Search JSON API via a custom engine module
            # (searxng-engines/google_customsearch.py) -- SearXNG's own
            # google_cse engine (left disabled above) is hardcoded to a
            # shared third-party CSE token and ignores api_key/cx
            # entirely; confirmed absent from upstream SearXNG's current
            # master too, not a version-lag issue. This engine's cx is a
            # small curated site list the operator configured (Google no
            # longer allows new Programmable Search Engines to enable
            # "search the entire web"), so it's a targeted supplement to
            # the general engines above, not a general web search engine.
            - name: google-curated
              engine: google_customsearch
              # Not "goc" -- that shortcut is already reserved by the
              # built-in (disabled) `google cse` engine. SearXNG rejects
              # duplicate shortcuts even when the other engine is
              # disabled, confirmed live 2026-08-02 ("Engine config
              # error: ambiguous shortcut: goc" crashed the worker on
              # every restart until this was changed).
              shortcut: gcu
              api_key: "{{ ai_services_google_cse_api_key }}"
              cx: "{{ ai_services_google_cse_id }}"
              disabled: false
            {% endif %}
      register: ai_services_searxng_settings_reconciled
      no_log: true

    - name: Restart SearXNG after engine settings change
      community.docker.docker_container:
        name: searxng
        state: started
        restart: true
      when: ai_services_searxng_settings_reconciled.changed

    - name: Install OpenWebUI docker-compose.yml
      ansible.builtin.copy:
        dest: "{{ ai_services_compose_dir }}/docker-compose.yml"
        mode: "0640"
        content: |
          # Neither service sets its own `logging:` block -- both inherit
          # the host-level Docker daemon syslog log-driver configured above.
          services:
            openwebui:
              image: {{ ai_services_openwebui_image }}
              container_name: openwebui
              restart: unless-stopped
              ports:
                - "{{ ai_services_openwebui_port }}:8080"
              volumes:
                - ai-services-openwebui-data:/app/backend/data
                # Bind-mounts the LXC host's own trusted CA bundle (already
                # includes the Homelab root CA -- see
                # ansible/00-initial-setup/ai-services-data-migration.yml's
                # "Trust the homelab root CA" play) into the container at
                # the same path Python's default SSL context resolves to
                # on this image (verified: /usr/lib/ssl/cert.pem symlinks
                # here). Without this, OpenWebUI's own backend OIDC
                # discovery fetch to authentik-int.${LAB_DOMAIN}
                # (step-ca-issued cert) fails TLS verification even though
                # the host trusts it fine -- containers have their own
                # separate cert store. Read-only: openwebui never needs to
                # write here.
                - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
                # authlib (OpenWebUI's actual OAuth library) makes its real
                # HTTP calls via httpx, which -- unlike urllib/aiohttp --
                # does NOT consult the system trust store above at all; it
                # loads its own bundled certifi package file exclusively.
                # Confirmed live 2026-08-02: the system-store mount alone
                # left authlib's own discovery fetch failing with the same
                # SSL error, traced via the container's actual traceback
                # (authlib -> httpx_client -> httpx -> httpcore). Mounting
                # the same trusted bundle over certifi's file fixes the
                # actual code path OIDC login uses, not just python's
                # stdlib ssl default.
                - /etc/ssl/certs/ca-certificates.crt:/usr/local/lib/python3.11/site-packages/certifi/cacert.pem:ro
              environment:
                WEBUI_SECRET_KEY: "{{ ai_services_openwebui_webui_secret_key }}"
                ENABLE_OPENAI_API: "true"
                ENABLE_OLLAMA_API: "true"
                OPENAI_API_BASE_URLS: "{{ ai_services_openwebui_lmstudio_api_base }};{{ ai_services_openwebui_llamacpp_api_base }}"
                OPENAI_API_KEYS: "{{ ai_services_openwebui_llm_api_key }};{{ ai_services_openwebui_llm_api_key }}"
                # Not an OpenWebUI setting -- purely so the model-discovery
                # verification task below can tell the LM Studio URL apart
                # from llamacpp's in the semicolon-joined list above.
                LMSTUDIO_API_BASE: "{{ ai_services_openwebui_lmstudio_api_base }}"
                OLLAMA_BASE_URL: "{{ ai_services_openwebui_ollama_api_base }}"
                WEBUI_URL: "https://openwebui.{{ ai_services_lab_domain }}"
                ENABLE_OAUTH_SIGNUP: "true"
                OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
                OAUTH_CLIENT_ID: "{{ ai_services_openwebui_oidc_client_id }}"
                OAUTH_CLIENT_SECRET: "{{ ai_services_openwebui_oidc_client_secret }}"
                OPENID_PROVIDER_URL: "https://{{ ai_services_authentik_fqdn }}/application/o/edge-ai-services-stack-openwebui/.well-known/openid-configuration"
                OAUTH_PROVIDER_NAME: "Authentik"
                OAUTH_SCOPES: "openid email profile"
                ENABLE_WEB_SEARCH: "true"
                WEB_SEARCH_ENGINE: "searxng"
                SEARXNG_QUERY_URL: "{{ ai_services_searxng_query_url }}"
                # Without this, OpenWebUI defaults new chats to whichever
                # model sorts first alphabetically among everything
                # llamacpp-router reports -- not whichever model is
                # actually loaded in VRAM. llama-swap only keeps
                # `--models-max` (3) models loaded at once and evicts on
                # demand; picking an unloaded model from a fresh chat
                # triggers a real load, which for large models can take
                # hours (confirmed live 2026-08-02: an accidental request
                # against an unloaded 30B model started evicting the
                # then-loaded Laguna model, which takes ~7h to reload).
                # Keep this in sync with whichever model the operator is
                # actually keeping warm -- it is not a statement that this
                # specific model is somehow the "right" default in general.
                DEFAULT_MODELS: "{{ ai_services_openwebui_default_model }}"
              depends_on:
                searxng:
                  condition: service_healthy

            searxng:
              image: {{ ai_services_searxng_image }}
              container_name: searxng
              restart: unless-stopped
              ports:
                - "{{ ai_services_searxng_port }}:8080"
              volumes:
                - ai-services-searxng-data:/etc/searxng
                # Real Google Custom Search API engine -- SearXNG's own
                # google_cse module is hardcoded to a shared third-party
                # token and ignores api_key/cx entirely. Single-file bind
                # mount, not a directory mount over engines/ itself --
                # that would mask every built-in engine module (bing,
                # braveapi, mwmbl, etc.) SearXNG's loader imports
                # searx.engines.<name> directly from this directory, so
                # the file must land here by its own filename. See
                # searxng-engines/google_customsearch.py.
                - "{{ ai_services_compose_dir }}/searxng-engines/google_customsearch.py:/usr/local/searxng/searx/engines/google_customsearch.py:ro"
              environment:
                SEARXNG_BASE_URL: "{{ ai_services_searxng_base_url }}"
              healthcheck:
                test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/search?q=test&format=json"]
                interval: 30s
                timeout: 5s
                retries: 3
                start_period: 15s

          volumes:
            ai-services-openwebui-data:
              name: ai-services-openwebui-data
            ai-services-searxng-data:
              name: ai-services-searxng-data

    - name: Deploy OpenWebUI and SearXNG via docker compose
      community.docker.docker_compose_v2:
        project_src: "{{ ai_services_compose_dir }}"
        state: present

    - name: Reconcile infrastructure-managed OpenWebUI connection settings
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - openwebui
          - python
          - -c
          - |
            import json
            import os
            import sqlite3
            import time

            database = "/app/backend/data/webui.db"
            backup = f"{database}.ai-services-stack-pre-connection-fix"
            connection = sqlite3.connect(database)
            openai_base_urls = os.environ["OPENAI_API_BASE_URLS"].split(";")
            openai_api_keys = os.environ["OPENAI_API_KEYS"].split(";")
            desired = {
                "openai.enable": json.dumps(True),
                "openai.api_base_urls": json.dumps(
                    openai_base_urls, separators=(",", ":")
                ),
                "openai.api_keys": json.dumps(
                    openai_api_keys, separators=(",", ":")
                ),
                "ollama.enable": json.dumps(True),
                "ollama.base_urls": json.dumps(
                    [os.environ["OLLAMA_BASE_URL"]], separators=(",", ":")
                ),
                "web.search.enable": json.dumps(True),
                "web.search.engine": json.dumps("searxng"),
                "web.search.searxng_query_url": json.dumps(
                    os.environ["SEARXNG_QUERY_URL"]
                ),
                "webui.url": json.dumps(os.environ["WEBUI_URL"]),
                "ui.default_models": json.dumps(os.environ["DEFAULT_MODELS"]),
            }
            pending = []
            for key, value in desired.items():
                row = connection.execute(
                    "SELECT value FROM config WHERE key = ?", (key,)
                ).fetchone()
                if row is None or row[0] != value:
                    pending.append((key, value))

            if pending:
                if not os.path.exists(backup):
                    backup_connection = sqlite3.connect(backup)
                    connection.backup(backup_connection)
                    backup_connection.close()
                    os.chmod(backup, 0o600)

                updated_at = int(time.time())
                connection.executemany(
                    """
                    INSERT INTO config (key, value, updated_at)
                    VALUES (?, ?, ?)
                    ON CONFLICT(key) DO UPDATE SET
                      value = excluded.value,
                      updated_at = excluded.updated_at
                    """,
                    [(key, value, updated_at) for key, value in pending],
                )
                connection.commit()

            connection.close()
            print(json.dumps({
                "changed": bool(pending),
                "keys": [key for key, _value in pending],
            }))
      register: ai_services_openwebui_connection_reconcile
      changed_when: >-
        (ai_services_openwebui_connection_reconcile.stdout | from_json).changed

    - name: Restart OpenWebUI after connection settings change
      community.docker.docker_compose_v2:
        project_src: "{{ ai_services_compose_dir }}"
        state: restarted
        services:
          - openwebui
      when: ai_services_openwebui_connection_reconcile.changed

    - name: Wait for OpenWebUI after connection reconciliation
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ ai_services_openwebui_port }}/"
        status_code: 200
      register: ai_services_openwebui_health
      retries: 30
      delay: 2
      until: ai_services_openwebui_health.status == 200

    - name: Verify OpenWebUI can discover models from all managed LLM routes
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - openwebui
          - python
          - -c
          - |
            import json
            import os
            import ssl
            import urllib.error
            import urllib.request

            # The LM Studio route (https://llm.{lab_domain}/v1, via Traefik)
            # is handled separately from llamacpp/Ollama below: on
            # non-production LAB_DOMAIN values (pve-test-vm), Traefik's
            # `letsencrypt` resolver deliberately falls back to Let's
            # Encrypt STAGING certs -- documented, intended behavior (see
            # docs/design/lessons-learned.md, "LE staging CA for all
            # pve-test dev passes... this is correct and expected"), not
            # trusted by anything, including this container. That's an
            # existing platform property this migration doesn't change --
            # the plan's own Step 6 validation criteria names llamacpp and
            # Ollama specifically as the routes this migration must prove
            # work, not LM Studio. So an LM Studio TLS-trust failure here
            # is reported but not fatal; llamacpp/Ollama failures still are.
            discovered = {}
            warnings = []
            openai_base_urls = os.environ["OPENAI_API_BASE_URLS"].split(";")
            openai_api_keys = os.environ["OPENAI_API_KEYS"].split(";")
            lmstudio_base_url = os.environ["LMSTUDIO_API_BASE"]
            for base_url, api_key in zip(openai_base_urls, openai_api_keys):
                request = urllib.request.Request(
                    f"{base_url}/models",
                    headers={"Authorization": f"Bearer {api_key}"},
                )
                try:
                    with urllib.request.urlopen(request, timeout=15) as response:
                        discovered[base_url] = [
                            model.get("id")
                            for model in json.load(response).get("data", [])
                            if model.get("id")
                        ]
                except urllib.error.URLError as error:
                    if base_url == lmstudio_base_url and isinstance(
                        error.reason, ssl.SSLCertVerificationError
                    ):
                        warnings.append(f"{base_url}: {error.reason} (expected on non-production LAB_DOMAIN)")
                        continue
                    raise

            with urllib.request.urlopen(
                f"{os.environ['OLLAMA_BASE_URL']}/api/tags", timeout=15
            ) as response:
                discovered[os.environ["OLLAMA_BASE_URL"]] = [
                    model.get("name")
                    for model in json.load(response).get("models", [])
                    if model.get("name")
                ]

            empty_routes = [
                base_url for base_url, models in discovered.items() if not models
            ]
            if empty_routes:
                raise SystemExit(f"managed LLM routes returned no models: {empty_routes}")
            print(json.dumps({"models": discovered, "warnings": warnings}))
