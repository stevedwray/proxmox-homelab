# ai-services-stack -- ai_seg zone (pve / pve-test-vm).
# See docs/ai-services-migration/plan.md for the full migration design.
#
# Deploys OpenWebUI and its private SearXNG search backend on a dedicated
# ai_seg LXC. This replaces the bare-metal deployment on framework
# (ansible/00-initial-setup/framework-desktop-openwebui.yml, retained there
# for reference/rollback until the cutover is confirmed stable) -- both
# services are pure network clients of the model-serving layer
# (llamacpp-router/ollama), with no GPU need of their own, so they no longer
# need to share framework's host.
#
# The one real config change versus the framework deployment: OpenWebUI's
# llama.cpp/Ollama routes now cross a real subnet boundary (ai_seg ->
# framework's flat LAN) instead of reaching a same-host Docker gateway, so
# they point at framework.gibbsgreatly.xyz instead of host.docker.internal.

---
- name: Configure Docker base
  hosts: all
  become: true
  gather_facts: true
  roles:
    - lxc_base
    - docker_base

  tasks:
    - name: Configure Docker daemon logging
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "50m",
              "max-file": "7"
            }
          }
      notify: Restart Docker

  handlers:
    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted

- name: Deploy OpenWebUI and SearXNG compose stack
  hosts: all
  become: true
  gather_facts: false

  vars:
    ai_services_compose_dir: /opt/ai-services-stack
    ai_services_lab_domain: "{{ lookup('env', 'LAB_DOMAIN') | mandatory('LAB_DOMAIN env var is required') }}"
    repo_root: "{{ (playbook_dir + '/../../../..') | realpath }}"
    # ai_seg is a deliberately contained zone (same class as pentest_seg)
    # with no direct route to Harbor's infra_seg IP -- confirmed live
    # 2026-08-02 when a raw LAB_IP_HARBOR pull timed out
    # ("context deadline exceeded" reaching Harbor's infra_seg IP
    # directly). pentagi-stack/greenbone-stack (pentest_seg, the other
    # contained zone) already solved this: pull via harbor.${LAB_DOMAIN},
    # routed through Traefik/edge_seg, not Harbor's own IP directly. Uses
    # the same ai_seg -> edge_seg:443 firewall rule this playbook's OIDC
    # route already needs -- no separate Harbor-specific rule required.
    ai_services_registry_host: "{{ lookup('env', 'LAB_FQDN_HARBOR') | default('harbor.' ~ ai_services_lab_domain, true) }}"
    # Pinned by digest rather than :main/:latest -- see
    # ansible/00-initial-setup/framework-desktop-openwebui.yml's header
    # comment for why. Same digests as the framework deployment being
    # replaced (open-webui v0.10.2, searxng 2026.7.19+6da6eee26); a
    # deliberate upgrade should update both playbooks together until the
    # framework deployment is fully decommissioned (plan.md Step 8).
    ai_services_openwebui_image: "{{ ai_services_registry_host }}/ghcr/open-webui/open-webui@sha256:a26effeb220e132482bf7e0560b3404843e7bc40d23051144e062960df8df6b0"  # v0.10.2
    ai_services_searxng_image: "{{ ai_services_registry_host }}/dockerhub/searxng/searxng@sha256:b8ca38ba06eea544d7555e88321e212ddc0d5c3c7de055419cfb2e5c6bf30812"  # 2026.7.19+6da6eee26
    # Container port 8080 published as host port 8081 -- 8080 stays free
    # in case something on this LXC ever wants it, matching edge.yaml's
    # comment. No LAN-facing port collision to avoid here (unlike
    # framework, which also runs llamacpp-router on :8080).
    ai_services_openwebui_port: 8081
    ai_services_searxng_port: 8082
    # Internal direct-TLS endpoint (step-ca issued, mgmt_seg), not the
    # public authentik.${LAB_DOMAIN} route -- corrected 2026-08-02: the
    # public route's cert on pve-test-vm is Let's Encrypt *staging*
    # (untrusted by design), which breaks OpenWebUI's backend-side OIDC
    # discovery fetch even though a human can click through the same cert
    # in a browser. authentik-int has no such issue (real Homelab-CA
    # trust) and its self-reported authorize/token endpoints are fully
    # functional on this hostname (confirmed live, both plain :443 and
    # :9443 work identically). See docs/design/lessons-learned.md's
    # Authentik section and the ai_seg -> mgmt_seg:443 firewall rule this
    # requires (mikrotik-firewall-ai-services-stack.yml).
    ai_services_authentik_fqdn: "{{ lookup('env', 'LAB_FQDN_AUTHENTIK_INTERNAL') | default('authentik-int.' ~ ai_services_lab_domain, true) }}"
    ai_services_openwebui_oidc_client_id: "{{ lookup('env', 'OPENWEBUI_OIDC_CLIENT_ID') | default('openwebui', true) }}"
    ai_services_openwebui_oidc_client_secret: >-
      {{ lookup('env', 'OPENWEBUI_OIDC_CLIENT_SECRET')
         | mandatory('OPENWEBUI_OIDC_CLIENT_SECRET env var is required') }}
    ai_services_openwebui_lmstudio_api_base: "https://llm.{{ ai_services_lab_domain }}/v1"
    # The one real config change versus the framework deployment: this LXC
    # reaches llamacpp-router/ollama across a real ai_seg -> framework
    # subnet hop, not a same-host Docker gateway -- see plan.md Step 3 and
    # the ai_seg -> framework:8080,11434 egress rule it requires.
    # FQDN, not LAB_IP_FRAMEWORK's raw IP -- matches the established
    # precedent for the other contained zone reaching framework the same
    # way: deploy-pentagi-stack.yml's pentagi_framework_host, same
    # FRAMEWORK_HOST env var / framework.gibbsgreatly.xyz default, same
    # :8080/:11434 ports. DNS resolution from containers on this LXC is
    # already proven live (Harbor's own hostname pull succeeded the same
    # way during this deployment).
    ai_services_framework_host: "{{ lookup('env', 'FRAMEWORK_HOST') | default('framework.gibbsgreatly.xyz', true) }}"
    # Ollama/Laguna is no longer in active use on this platform (operator,
    # 2026-09-22: Nathanw/llama.cpp has proven better performance and
    # reliability here) -- default model switched from Laguna's Ollama tag
    # to Nathanw's actual llama.cpp model id (confirmed live via
    # framework.gibbsgreatly.xyz:8080/v1/models). Keep in sync with
    # whichever model is actually loaded there, not a general "best"
    # default.
    ai_services_openwebui_default_model: "{{ lookup('env', 'OPENWEBUI_DEFAULT_MODEL') | default('/models/qwen3.8-flash-next-q4/UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf', true) }}"
    # Plaintext HTTP across a real subnet hop, not same-host -- unlike the
    # SearXNG vars below. Deliberate, not overlooked: llamacpp-router
    # enforces no auth on :8080 to any caller today (confirmed live
    # 2026-08-02, see plan.md Step 3), so this widens network *reach* to
    # an already-unauthenticated service, not authentication exposure --
    # access control here is firewall-only already. Revisit if the
    # operator decides to add real auth to the router (open question in
    # plan.md).
    ai_services_openwebui_llamacpp_api_base: "http://{{ ai_services_framework_host }}:8080/v1"  # NOSONAR: ansible:S5332 - accepted risk, see plan.md Step 3
    ai_services_openwebui_llm_api_key: "{{ lookup('env', 'LLM_GPU_STACK_API_KEY') | mandatory('LLM_GPU_STACK_API_KEY env var is required') }}"
    # Reused as-is from the framework deployment -- signs sessions/JWTs, so
    # a fresh data dir on this new LXC must not mint a new one and silently
    # invalidate the migrated OpenWebUI DB's existing sessions.
    ai_services_openwebui_webui_secret_key: "{{ lookup('env', 'OPENWEBUI_WEBUI_SECRET_KEY') | mandatory('OPENWEBUI_WEBUI_SECRET_KEY env var is required') }}"
    ai_services_searxng_secret_key: "{{ lookup('env', 'SEARXNG_SECRET_KEY') | mandatory('SEARXNG_SECRET_KEY env var is required') }}"
    # SearXNG remains available as the browser-facing metasearch service.
    # OpenWebUI's AI search uses Brave's standard API directly, avoiding
    # SearXNG's unreliable upstream-engine mix. The account's API key was
    # verified against this endpoint; its LLM Context endpoint returns 400,
    # so do not select brave_llm_context until the Brave plan supports it.
    ai_services_searxng_query_url: "http://searxng:8080/search?q=<query>&format=json"  # NOSONAR: internal-only Docker network
    # SearXNG uses its base URL to generate redirects (including after saving
    # preferences). `searxng:8080` only resolves inside Docker, so it cannot
    # be used here now that the service has a user-facing HTTPS route.
    ai_services_searxng_base_url: "https://searxng.{{ ai_services_lab_domain }}/"
    # Optional, unlike the mandatory secrets above -- web search works
    # without either, just with fewer/lower-quality engines. See
    # docs/design/lessons-learned.md's SearXNG entry for why the default
    # scraped engines mostly don't work from this network and these were
    # added.
    ai_services_brave_search_api_key: "{{ lookup('env', 'BRAVE_SEARCH_API_KEY') | default('', true) }}"

    # deep-research + deep-research-files -- see docs/deep-research/plan.md
    # Phase 4. Built from source (not pulled through Harbor), same pattern
    # as mcp-utility-stack's cve-mcp-server/docs-rag-mcp: this is custom
    # code, not a published upstream image.
    ai_services_deep_research_source_dir: "{{ repo_root }}/terraform/lxc/ansible/files/deep-research-agent"
    ai_services_deep_research_build_dir: "{{ ai_services_compose_dir }}/deep-research-agent"
    # deep-research-files: Phase 1 of docs/reporting-platform/plan.md --
    # the shared reports viewer, generalized from a deep-research-only
    # file server. Now built from its own source (real markdown rendering
    # needs the `markdown` package, not stdlib), same pattern as
    # deep-research's own image above -- no more bind-mounted script.
    ai_services_deep_research_files_source_dir: "{{ repo_root }}/terraform/lxc/ansible/files/deep-research-files"
    ai_services_deep_research_files_build_dir: "{{ ai_services_compose_dir }}/deep-research-files"
    ai_services_deep_research_port: 8090
    ai_services_deep_research_files_port: 8091
    ai_services_deep_research_public_url: "https://deep-research.{{ ai_services_lab_domain }}"
    # Reuses the same Framework FQDN/path already proven for OpenWebUI's
    # llamacpp route above -- not a new egress rule.
    ai_services_deep_research_openai_api_base: "http://{{ ai_services_framework_host }}:8080/v1"  # NOSONAR: ansible:S5332 - accepted risk, matches ai_services_openwebui_llamacpp_api_base above
    ai_services_tavily_api_key: "{{ lookup('env', 'TAVILY_API_KEY') | mandatory('TAVILY_API_KEY env var is required') }}"

    # web-search-mcp + mcpo: headless-browser web search (Playwright/
    # Chromium against Bing/Brave/DuckDuckGo, no API key/quota), replacing
    # Brave's metered Search API (Free-tier quota exhausted 2026-09-16)
    # for OpenWebUI, and DDGS's unstable `backend="auto"` scraping for
    # deep-research (real incident 2026-09-22: DDGS silently routed
    # through search.yahoo.com, which was erroring on every query, and
    # deep-research's Searcher agent had no graceful fallback -- it started
    # guessing URLs blind and burned through its fetch/grep quotas, see
    # docs/deep-research/current-state.md). Originally built and deployed
    # live 2026-09-16 for OpenWebUI only, on a branch
    # (feat/openwebui-web-search-mcp) that was never merged -- recovered
    # here 2026-09-22 and extended to also cover deep-research, its second
    # real consumer. Source (a thin Dockerfile only -- the actual server is
    # git-cloned from upstream at build time, pinned by tag, see the
    # Dockerfile's own header) lives in this repo, same locally-built-on-
    # the-LXC pattern as mcp-utility-stack's docs-rag-mcp.
    ai_services_web_search_mcp_source_dir: "{{ repo_root }}/terraform/lxc/ansible/files/web-search-mcp"
    ai_services_web_search_mcp_build_dir: "{{ ai_services_compose_dir }}/web-search-mcp"
    # Protects mcpo's OpenAPI bridge from anything else reachable on this
    # LXC's internal compose network -- it publishes no host port, but the
    # docker network itself has no other access control.
    ai_services_web_search_mcp_api_key: >-
      {{ lookup('env', 'WEB_SEARCH_MCP_API_KEY')
         | mandatory('WEB_SEARCH_MCP_API_KEY env var is required') }}

  tasks:
    - name: Create ai-services-stack compose directory
      ansible.builtin.file:
        path: "{{ ai_services_compose_dir }}"
        state: directory
        mode: "0750"

    - name: Seed SearXNG settings with JSON output enabled
      community.docker.docker_container:
        name: ai-services-searxng-settings-seed
        image: "{{ ai_services_registry_host }}/dockerhub/library/busybox:1.36"
        state: started
        detach: false
        cleanup: true
        volumes:
          - "ai-services-searxng-data:/etc/searxng"
        command:
          - sh
          - -c
          - |
            if [ ! -f /etc/searxng/settings.yml ]; then
              cat > /etc/searxng/settings.yml <<'EOF'
            use_default_settings: true
            server:
              secret_key: "{{ ai_services_searxng_secret_key }}"
            search:
              formats:
                - html
                - json
            EOF
            fi
      no_log: true

    - name: Ensure SearXNG's engine selection matches what's actually reachable
      ansible.builtin.blockinfile:
        path: "/var/lib/docker/volumes/ai-services-searxng-data/_data/settings.yml"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - working-engines override"
        insertafter: EOF
        block: |
          engines:
            # Confirmed live 2026-08-02: TCP connect to duckduckgo's html
            # endpoint (20.43.x.x, Azure-hosted) times out from this LAN --
            # reproduced from both pve-test-vm and a separate workstation on
            # the same WAN uplink, so it's a network-path issue upstream of
            # this stack, not an ai_seg firewall gap. google cse, startpage,
            # brave, qwant, and yahoo are all reachable but bot-detect and
            # suspend/CAPTCHA a self-hosted SearXNG's scraped requests within
            # a query or two. Left enabled by SearXNG's own defaults
            # (use_default_settings: true), these don't just fail
            # silently -- they eat the whole per-engine timeout window on
            # every query, which is what surfaces to OpenWebUI as
            # "404: No results found from web search" even though other
            # engines would have answered in time. See
            # docs/design/lessons-learned.md's SearXNG entry.
            - name: duckduckgo
              disabled: true
            - name: duckduckgo web
              disabled: true
            - name: google cse
              disabled: true
            - name: startpage
              disabled: true
            - name: brave
              disabled: true
            - name: qwant
              disabled: true
            - name: yahoo
              disabled: true
            - name: presearch
              disabled: true
            # Confirmed live 2026-08-02: both return real, relevant results
            # with no bot-detection pushback from this network -- mwmbl is
            # an independent crowdsourced index, searchmysite indexes
            # personal/independent sites. Neither is enabled by SearXNG's
            # own defaults.
            - name: mwmbl
              disabled: false
            - name: searchmysite
              disabled: false
            # Confirmed live 2026-08-02: scraped Bing, unlike the other
            # scraped engines above, returns clean results with zero
            # bot-detection pushback from this network. Not enabled by
            # SearXNG's own defaults.
            - name: bing
              disabled: false
            {% if ai_services_brave_search_api_key %}
            # Real API, not the scraped `brave` engine (left disabled
            # above) -- structurally avoids the CAPTCHA problem instead of
            # hoping this network's IP reputation improves.
            - name: braveapi
              engine: braveapi
              shortcut: bra
              api_key: "{{ ai_services_brave_search_api_key }}"
              # API-key engines are inactive in SearXNG's defaults.  Setting
              # disabled: false alone leaves the engine removed from both
              # searches and the preferences page.
              inactive: false
              disabled: false
              # Confirmed live 2026-08-02: scraped `bing` returns
              # completely unrelated content (NZ regional news) for
              # recency-flavored queries like "latest X 2026" -- looks
              # like its scraper is picking up Bing's "top stories" news
              # carousel instead of organic results for that query shape
              # (it's fine on other queries, see the mwmbl/searchmysite
              # comment above). braveapi gave genuinely on-topic results
              # for the same query. Weighted above bing's default (1.0)
              # so its results rank higher when both contribute, rather
              # than disabling bing outright -- it's still a free/
              # unlimited fallback for when braveapi's quota is hit.
              weight: 2.0
            {% endif %}
      register: ai_services_searxng_settings_reconciled
      no_log: true

    - name: Check whether the searxng container already exists
      community.docker.docker_container_info:
        name: searxng
      register: ai_services_searxng_container_info

    - name: Restart SearXNG after engine settings change
      community.docker.docker_container:
        name: searxng
        state: started
        restart: true
      when:
        - ai_services_searxng_settings_reconciled.changed
        - ai_services_searxng_container_info.exists
      # On a genuinely fresh LXC (confirmed live 2026-08-02 deploying to
      # pve) the searxng container doesn't exist yet at this point in the
      # playbook -- "Deploy ... via docker compose" below is what creates
      # it. Without the exists guard, docker_container tries to create a
      # container with no image specified and fails outright. Redeploys
      # (container already exists) still restart correctly to pick up
      # the new settings.yml.

    - name: Create deep-research-agent build directory
      ansible.builtin.file:
        path: "{{ ai_services_deep_research_build_dir }}"
        state: directory
        mode: "0750"

    - name: Copy deep-research-agent source (Dockerfile, pyproject.toml, src/)
      ansible.builtin.copy:
        src: "{{ ai_services_deep_research_source_dir }}/"
        dest: "{{ ai_services_deep_research_build_dir }}/"
        mode: preserve
      register: ai_services_deep_research_copy_result

    - name: Create deep-research-files build directory
      ansible.builtin.file:
        path: "{{ ai_services_deep_research_files_build_dir }}"
        state: directory
        mode: "0750"

    - name: Copy deep-research-files source (Dockerfile, serve.py)
      ansible.builtin.copy:
        src: "{{ ai_services_deep_research_files_source_dir }}/"
        dest: "{{ ai_services_deep_research_files_build_dir }}/"
        mode: preserve
      register: ai_services_deep_research_files_copy_result

    - name: Create web-search-mcp build directory
      ansible.builtin.file:
        path: "{{ ai_services_web_search_mcp_build_dir }}"
        state: directory
        mode: "0750"

    - name: Copy web-search-mcp Dockerfile
      ansible.builtin.copy:
        src: "{{ ai_services_web_search_mcp_source_dir }}/Dockerfile"
        dest: "{{ ai_services_web_search_mcp_build_dir }}/Dockerfile"
        mode: "0640"

    - name: Install OpenWebUI docker-compose.yml
      ansible.builtin.copy:
        dest: "{{ ai_services_compose_dir }}/docker-compose.yml"
        mode: "0640"
        content: |
          # Neither service sets its own `logging:` block -- both inherit
          # the host-level Docker daemon syslog log-driver configured above.
          services:
            openwebui:
              image: {{ ai_services_openwebui_image }}
              container_name: openwebui
              restart: unless-stopped
              ports:
                - "{{ ai_services_openwebui_port }}:8080"
              volumes:
                - ai-services-openwebui-data:/app/backend/data
                # Bind-mounts the LXC host's own trusted CA bundle (already
                # includes the Homelab root CA -- see
                # ansible/00-initial-setup/ai-services-data-migration.yml's
                # "Trust the homelab root CA" play) into the container at
                # the same path Python's default SSL context resolves to
                # on this image (verified: /usr/lib/ssl/cert.pem symlinks
                # here). Without this, OpenWebUI's own backend OIDC
                # discovery fetch to authentik-int.${LAB_DOMAIN}
                # (step-ca-issued cert) fails TLS verification even though
                # the host trusts it fine -- containers have their own
                # separate cert store. Read-only: openwebui never needs to
                # write here.
                - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
                # authlib (OpenWebUI's actual OAuth library) makes its real
                # HTTP calls via httpx, which -- unlike urllib/aiohttp --
                # does NOT consult the system trust store above at all; it
                # loads its own bundled certifi package file exclusively.
                # Confirmed live 2026-08-02: the system-store mount alone
                # left authlib's own discovery fetch failing with the same
                # SSL error, traced via the container's actual traceback
                # (authlib -> httpx_client -> httpx -> httpcore). Mounting
                # the same trusted bundle over certifi's file fixes the
                # actual code path OIDC login uses, not just python's
                # stdlib ssl default.
                - /etc/ssl/certs/ca-certificates.crt:/usr/local/lib/python3.11/site-packages/certifi/cacert.pem:ro
              environment:
                WEBUI_SECRET_KEY: "{{ ai_services_openwebui_webui_secret_key }}"
                ENABLE_OPENAI_API: "true"
                # Ollama disabled -- not in active use on this platform
                # (operator, 2026-09-22: Nathanw/llama.cpp has proven
                # better performance/reliability here). ollama-reliability-proxy
                # removed with it -- see git history for the prior config
                # if Ollama ever comes back into use.
                ENABLE_OLLAMA_API: "false"
                OPENAI_API_BASE_URLS: "{{ ai_services_openwebui_lmstudio_api_base }};{{ ai_services_openwebui_llamacpp_api_base }}"
                OPENAI_API_KEYS: "{{ ai_services_openwebui_llm_api_key }};{{ ai_services_openwebui_llm_api_key }}"
                # Not an OpenWebUI setting -- purely so the model-discovery
                # verification task below can tell the LM Studio URL apart
                # from llamacpp's in the semicolon-joined list above.
                LMSTUDIO_API_BASE: "{{ ai_services_openwebui_lmstudio_api_base }}"
                WEBUI_URL: "https://openwebui.{{ ai_services_lab_domain }}"
                ENABLE_OAUTH_SIGNUP: "true"
                OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
                OAUTH_CLIENT_ID: "{{ ai_services_openwebui_oidc_client_id }}"
                OAUTH_CLIENT_SECRET: "{{ ai_services_openwebui_oidc_client_secret }}"
                OPENID_PROVIDER_URL: "https://{{ ai_services_authentik_fqdn }}/application/o/edge-ai-services-stack-openwebui/.well-known/openid-configuration"
                OAUTH_PROVIDER_NAME: "Authentik"
                OAUTH_SCOPES: "openid email profile"
                ENABLE_WEB_SEARCH: "true"
                WEB_SEARCH_ENGINE: "brave"
                BRAVE_SEARCH_API_KEY: "{{ ai_services_brave_search_api_key }}"
                # Brave's free tier permits one request per second. Keeping
                # this sequential avoids a multi-query model immediately
                # exhausting that quota; OpenWebUI retries one 429 once.
                WEB_SEARCH_CONCURRENT_REQUESTS: "1"
                WEB_SEARCH_RESULT_COUNT: "5"
                # Retained only for a deliberate admin switch back to
                # SearXNG; it is not used by Brave's direct API.
                SEARXNG_QUERY_URL: "{{ ai_services_searxng_query_url }}"
                # Without this, OpenWebUI defaults new chats to whichever
                # model sorts first alphabetically among everything
                # llamacpp-router reports -- not whichever model is
                # actually loaded in VRAM. llama-swap only keeps
                # `--models-max` (3) models loaded at once and evicts on
                # demand; picking an unloaded model from a fresh chat
                # triggers a real load, which for large models can take
                # hours (confirmed live 2026-08-02: an accidental request
                # against an unloaded 30B model started evicting the
                # then-loaded Laguna model, which takes ~7h to reload).
                # Keep this in sync with whichever model the operator is
                # actually keeping warm -- it is not a statement that this
                # specific model is somehow the "right" default in general.
                DEFAULT_MODELS: "{{ ai_services_openwebui_default_model }}"
                # Real headless-browser web search (Bing/Brave/DuckDuckGo
                # via Playwright, no API key/quota) fronted by mcpo's
                # OpenAPI bridge -- see web-search-mcp service below and
                # its Dockerfile's header comment for why this exists
                # alongside Brave's Search API here. Declared the same way
                # OpenWebUI itself stores it (JSON list), so a fresh
                # deploy seeds it without a manual Admin Settings -> Tools
                # step.
                TOOL_SERVER_CONNECTIONS: '{{ [{"url": "http://web-search-mcp:8000", "path": "openapi.json", "type": "openapi", "auth_type": "bearer", "key": ai_services_web_search_mcp_api_key, "config": {"enable": true}}] | to_json }}'
              depends_on:
                searxng:
                  condition: service_healthy
                web-search-mcp:
                  condition: service_healthy

            searxng:
              image: {{ ai_services_searxng_image }}
              container_name: searxng
              restart: unless-stopped
              ports:
                - "{{ ai_services_searxng_port }}:8080"
              volumes:
                - ai-services-searxng-data:/etc/searxng
              environment:
                SEARXNG_BASE_URL: "{{ ai_services_searxng_base_url }}"
              healthcheck:
                test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/search?q=test&format=json"]
                interval: 30s
                timeout: 5s
                retries: 3
                start_period: 15s

            # Headless-browser web search (mcpo + web-search-mcp) -- see
            # this stack's own Dockerfile header comment for why. Built
            # locally from source copied in above. No published host
            # port -- reachable only from other containers on this
            # compose network (openwebui and deep-research, both below).
            web-search-mcp:
              build:
                context: ./web-search-mcp
              container_name: web-search-mcp
              restart: unless-stopped
              environment:
                MCPO_API_KEY: "{{ ai_services_web_search_mcp_api_key }}"
              healthcheck:
                test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=10)"]
                interval: 15s
                timeout: 10s
                retries: 10
                start_period: 30s

            deep-research:
              build:
                context: ./deep-research-agent
              container_name: deep-research
              restart: unless-stopped
              command:
                - python
                - src/app.py
                - --web
                - --host
                - "0.0.0.0"
                - --port
                - "{{ ai_services_deep_research_port }}"
                - --auto-approve
                - --public-url
                - "{{ ai_services_deep_research_public_url }}"
              ports:
                - "{{ ai_services_deep_research_port }}:{{ ai_services_deep_research_port }}"
              environment:
                OPENAI_API_BASE: "{{ ai_services_deep_research_openai_api_base }}"
                OPENAI_MODEL: local-model
                # Real authenticated search API, not scraping -- switched
                # 2026-09-22 after confirming live that every
                # unauthenticated scraping path (DDGS's backend="auto",
                # web-search-mcp's headless-browser Bing/Brave scraping,
                # raw HTTP against both Bing and DuckDuckGo) is either
                # silently served wrong results or explicitly CAPTCHA-
                # gated. See tools/web.py's web_search() and
                # docs/deep-research/current-state.md for the full
                # investigation. Free tier: 1000 searches/month.
                TAVILY_API_KEY: "{{ ai_services_tavily_api_key }}"
              # Mounted at ~/.deep-research-agent specifically, NOT the
              # whole /home/app home dir -- real bug found and fixed
              # 2026-09-22: mounting the entire home dir meant every image
              # rebuild's fresh COPY src ./src was silently shadowed at
              # runtime by whatever was already in the persistent volume
              # from Stage B's very first deploy, so every code change
              # since then was being ignored. New volume name
              # (ai-services-deep-research-config, not the old
              # ai-services-deep-research-data) because the old volume's
              # stored content sits at what was /home/app's root (stale
              # src/, pyproject.toml, mixed with the real
              # .deep-research-agent/ one level deeper) -- reusing it at
              # this narrower path would double-nest and break lookup.
              # Nothing in the old volume needs preserving (test-session
              # data only, already established this session). The
              # Dockerfile pre-creates and chowns this exact path so the
              # volume inherits correct ownership on first mount.
              volumes:
                - ai-services-deep-research-config:/home/app/.deep-research-agent
              # Own Graylog-bound logging (not this LXC's daemon-level
              # json-file default -- see deploy-portainer-stack.yml for the
              # same syslog-address/format/tag convention used fleet-wide)
              # since this service is expected to run real, unattended
              # overnight jobs and needs to be observable without opening a
              # browser tab.
              logging:
                driver: syslog
                options:
                  syslog-address: "tcp://127.0.0.1:10514"
                  syslog-format: rfc5424
                  tag: "{% raw %}docker-{{.Name}}{% endraw %}"
              healthcheck:
                test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:{{ ai_services_deep_research_port }}/', timeout=10)"]
                interval: 15s
                timeout: 10s
                retries: 10
                start_period: 20s

            # Shared reports viewer -- Phase 1 of
            # docs/reporting-platform/plan.md. Generalized from a
            # deep-research-only file server (replaced the Stage A
            # stopgap, python3 -m http.server run by hand as root) into
            # the shared convention's viewer: real markdown rendering
            # (needs the `markdown` package, hence a real build now, not
            # a bind-mounted stdlib script) and JSON pretty-printing.
            # deep-research is wrapped as this viewer's one project via a
            # symlink the container creates at startup (see serve.py) --
            # no change to deep-research's own output location.
            deep-research-files:
              build:
                context: ./deep-research-files
              container_name: deep-research-files
              restart: unless-stopped
              ports:
                - "{{ ai_services_deep_research_files_port }}:{{ ai_services_deep_research_files_port }}"
              environment:
                SERVE_HOST: "0.0.0.0"
                SERVE_PORT: "{{ ai_services_deep_research_files_port }}"
                WORKSPACE_DIR: /home/app/.deep-research-agent/workspace
                REPORT_PROJECT_NAME: deep-research
              # Same narrowed volume as deep-research's own service above
              # (see its comment for the 2026-09-22 shadowing bug this
              # fixes) -- read-only here since this container only ever
              # displays deep-research's output, never writes to it.
              volumes:
                - ai-services-deep-research-config:/home/app/.deep-research-agent:ro
              depends_on:
                deep-research:
                  condition: service_started
              # Own Graylog-bound logging (not this LXC's daemon-level
              # json-file default -- see deploy-portainer-stack.yml for the
              # same syslog-address/format/tag convention used fleet-wide)
              # since this service is expected to run real, unattended
              # overnight jobs and needs to be observable without opening a
              # browser tab.
              logging:
                driver: syslog
                options:
                  syslog-address: "tcp://127.0.0.1:10514"
                  syslog-format: rfc5424
                  tag: "{% raw %}docker-{{.Name}}{% endraw %}"
              healthcheck:
                # 404 must count as healthy, not just 200 -- a fresh volume
                # has no workspace dir until deep-research's first real run
                # creates one, and SimpleHTTPRequestHandler correctly 404s
                # on a missing path. Confirmed live 2026-09-21: plain
                # urlopen() raises HTTPError on 404, marking the container
                # unhealthy even though the server itself was working
                # correctly. CMD (not CMD-SHELL) runs argv directly with no
                # shell, so this has to be handled in the Python one-liner
                # itself, not with a shell '||' fallback.
                test: ["CMD", "python3", "-c", "import urllib.error, urllib.request, sys\ntry:\n    urllib.request.urlopen('http://127.0.0.1:{{ ai_services_deep_research_files_port }}/', timeout=10)\nexcept urllib.error.HTTPError as e:\n    sys.exit(0 if e.code == 404 else 1)"]
                interval: 15s
                timeout: 10s
                retries: 10
                start_period: 10s

          volumes:
            ai-services-openwebui-data:
              name: ai-services-openwebui-data
            ai-services-searxng-data:
              name: ai-services-searxng-data
            ai-services-deep-research-config:
              name: ai-services-deep-research-config
      register: ai_services_compose_definition

    - name: Deploy OpenWebUI, SearXNG, and deep-research via docker compose
      community.docker.docker_compose_v2:
        project_src: "{{ ai_services_compose_dir }}"
        state: present
        # No recreate: at all here previously means the module's own
        # default ('auto') always applied -- 'auto' does not reliably
        # recreate on an image-tag-only compose change (confirmed live
        # elsewhere this session). Force recreation whenever the compose
        # file's own content changed.
        recreate: "{{ 'always' if ai_services_compose_definition.changed else 'auto' }}"
        # deep-research and deep-research-files both have a build:
        # section now -- same 'build: always' used by mcp-utility-stack's
        # cve-mcp-server/docs-rag-mcp, its own build-from-source
        # precedent. openwebui/searxng use plain image: references, so
        # this is a no-op for them.
        build: always

    # web-search-mcp publishes no host port (internal-only, see its
    # service block comment), so this checks readiness via docker exec
    # rather than ansible.builtin.uri against 127.0.0.1.
    - name: Wait for web-search-mcp to come up
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - web-search-mcp
          - python3
          - -c
          - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=10)"
      register: ai_services_web_search_mcp_health
      retries: 20
      delay: 5
      until: ai_services_web_search_mcp_health.rc == 0
      changed_when: false
      failed_when: false

    - name: Fail if web-search-mcp never came up
      ansible.builtin.assert:
        that:
          - ai_services_web_search_mcp_health.rc == 0
        fail_msg: "web-search-mcp did not respond on :8000/docs after retries (last rc: {{ ai_services_web_search_mcp_health.rc | default('unknown') }}, stderr: {{ ai_services_web_search_mcp_health.stderr | default('') }})"

    - name: Wait for deep-research-files to come up
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ ai_services_deep_research_files_port }}/"
        status_code: [200, 404]
      register: ai_services_deep_research_files_health
      retries: 30
      delay: 3
      until: ai_services_deep_research_files_health.status is defined and ai_services_deep_research_files_health.status in [200, 404]

    - name: Wait for deep-research to come up
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ ai_services_deep_research_port }}/"
        status_code: [200, 404]
      register: ai_services_deep_research_health
      retries: 30
      delay: 3
      until: ai_services_deep_research_health.status is defined and ai_services_deep_research_health.status in [200, 404]

    - name: Reconcile infrastructure-managed OpenWebUI connection settings
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - openwebui
          - python
          - -c
          - |
            import json
            import os
            import sqlite3
            import time

            database = "/app/backend/data/webui.db"
            backup = f"{database}.ai-services-stack-pre-connection-fix"
            connection = sqlite3.connect(database)
            openai_base_urls = os.environ["OPENAI_API_BASE_URLS"].split(";")
            openai_api_keys = os.environ["OPENAI_API_KEYS"].split(";")
            desired = {
                "openai.enable": json.dumps(True),
                "openai.api_base_urls": json.dumps(
                    openai_base_urls, separators=(",", ":")
                ),
                "openai.api_keys": json.dumps(
                    openai_api_keys, separators=(",", ":")
                ),
                # Ollama disabled -- not in active use on this platform
                # (operator, 2026-09-22: Nathanw/llama.cpp has proven
                # better performance/reliability here).
                "ollama.enable": json.dumps(False),
                "web.search.enable": json.dumps(True),
                "web.search.engine": json.dumps("brave"),
                "web.search.brave_search_api_key": json.dumps(
                    os.environ["BRAVE_SEARCH_API_KEY"]
                ),
                "web.search.concurrent_requests": json.dumps(
                    int(os.environ["WEB_SEARCH_CONCURRENT_REQUESTS"])
                ),
                "web.search.result_count": json.dumps(
                    int(os.environ["WEB_SEARCH_RESULT_COUNT"])
                ),
                "webui.url": json.dumps(os.environ["WEBUI_URL"]),
                "ui.default_models": json.dumps(os.environ["DEFAULT_MODELS"]),
                # Already a JSON string (rendered by the compose file's
                # own `to_json` filter) -- stored as-is, not re-dumped.
                "tool_server.connections": os.environ["TOOL_SERVER_CONNECTIONS"],
            }
            pending = []
            for key, value in desired.items():
                row = connection.execute(
                    "SELECT value FROM config WHERE key = ?", (key,)
                ).fetchone()
                if row is None or row[0] != value:
                    pending.append((key, value))

            if pending:
                if not os.path.exists(backup):
                    backup_connection = sqlite3.connect(backup)
                    connection.backup(backup_connection)
                    backup_connection.close()
                    os.chmod(backup, 0o600)

                updated_at = int(time.time())
                connection.executemany(
                    """
                    INSERT INTO config (key, value, updated_at)
                    VALUES (?, ?, ?)
                    ON CONFLICT(key) DO UPDATE SET
                      value = excluded.value,
                      updated_at = excluded.updated_at
                    """,
                    [(key, value, updated_at) for key, value in pending],
                )
                connection.commit()

            connection.close()
            print(json.dumps({
                "changed": bool(pending),
                "keys": [key for key, _value in pending],
            }))
      register: ai_services_openwebui_connection_reconcile
      changed_when: >-
        (ai_services_openwebui_connection_reconcile.stdout | from_json).changed

    - name: Restart OpenWebUI after connection settings change
      community.docker.docker_compose_v2:
        project_src: "{{ ai_services_compose_dir }}"
        state: restarted
        services:
          - openwebui
      when: ai_services_openwebui_connection_reconcile.changed

    - name: Wait for OpenWebUI after connection reconciliation
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ ai_services_openwebui_port }}/"
        status_code: 200
      register: ai_services_openwebui_health
      retries: 30
      delay: 2
      until: ai_services_openwebui_health.status == 200

    - name: Verify OpenWebUI can discover models from all managed LLM routes
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - openwebui
          - python
          - -c
          - |
            import json
            import os
            import urllib.error
            import urllib.request

            # Flipped back 2026-09-22: Ollama/Laguna removed entirely --
            # not in active use on this platform (operator: Nathanw/
            # llama.cpp has proven better performance/reliability here).
            # llamacpp is the hard requirement again, matching which
            # backend is actually relied on; LM Studio stays soft/optional
            # as before (not confirmed in active use either).
            discovered = {}
            warnings = []
            fatal = []
            lmstudio_base_url = os.environ["LMSTUDIO_API_BASE"]
            openai_base_urls = os.environ["OPENAI_API_BASE_URLS"].split(";")
            openai_api_keys = os.environ["OPENAI_API_KEYS"].split(";")
            for base_url, api_key in zip(openai_base_urls, openai_api_keys):
                is_lmstudio = base_url == lmstudio_base_url
                request = urllib.request.Request(
                    f"{base_url}/models",
                    headers={"Authorization": f"Bearer {api_key}"},
                )
                try:
                    with urllib.request.urlopen(request, timeout=15) as response:
                        models = [
                            model.get("id")
                            for model in json.load(response).get("data", [])
                            if model.get("id")
                        ]
                        if models:
                            discovered[base_url] = models
                        elif is_lmstudio:
                            warnings.append(f"{base_url}: reachable but returned no models (LM Studio not in active use, not fatal)")
                        else:
                            fatal.append(f"{base_url}: reachable but returned no models")
                except urllib.error.URLError as error:
                    if is_lmstudio:
                        warnings.append(f"{base_url}: {error} (LM Studio not in active use, not fatal)")
                    else:
                        fatal.append(f"{base_url}: {error} -- this is the actively-used backend, not optional")

            if fatal:
                raise SystemExit(f"managed LLM route(s) failed: {fatal}")
            print(json.dumps({"models": discovered, "warnings": warnings}))
      changed_when: false

- name: Enable unattended security updates (fleet rollout, 2026-08-30)
  hosts: all
  become: true
  gather_facts: false
  roles:
    - unattended_upgrades
