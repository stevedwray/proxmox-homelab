---
- name: Configure Docker base
  hosts: all
  become: true
  gather_facts: true
  vars:
    docker_registry_host: "{{ registry_host | default('10.57.3.10') }}"
  roles:
    - lxc_base
    - docker_base

  tasks:
    - name: Trust Harbor HTTP registry in Docker daemon
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {
            "insecure-registries": ["{{ docker_registry_host }}"],
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            },
            "storage-driver": "overlay2"
          }
      notify: Restart Docker

    - name: Flush handlers to apply Docker daemon config before stack deploy
      ansible.builtin.meta: flush_handlers

    - name: Mask portainer-agent service (platform tier — no agent on this host)
      ansible.builtin.systemd:
        name: portainer-agent.service
        masked: true
        enabled: false
      failed_when: false

  handlers:
    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted

- name: Deploy Traefik compose stack
  hosts: all
  become: true
  gather_facts: false

  vars:
    proxy_compose_dir: /opt/proxy-stack
    traefik_version: "v3.1.6"
    traefik_image: "{{ registry_host | default('10.57.3.10') }}/dockerhub/library/traefik:{{ traefik_version }}"
    # Optional control-node source dir for generated per-stack Traefik files.
    # When provided, files are published into /opt/proxy-stack/dynamic/ so the
    # active file provider always loads them.
    traefik_generated_source_dir: ""

  tasks:
    - name: Create Traefik directory structure
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ proxy_compose_dir }}", mode: "0750" }
        - { path: "{{ proxy_compose_dir }}/dynamic", mode: "0755" }
        - { path: "{{ proxy_compose_dir }}/certs", mode: "0750" }
        - { path: "{{ proxy_compose_dir }}/certs/letsencrypt", mode: "0700" }
        - { path: "{{ proxy_compose_dir }}/certs/step-ca", mode: "0700" }

    - name: Create ACME storage files with strict permissions
      ansible.builtin.copy:
        dest: "{{ item }}"
        content: ""
        force: false
        mode: "0600"
      loop:
        - "{{ proxy_compose_dir }}/certs/letsencrypt/acme.json"
        - "{{ proxy_compose_dir }}/certs/step-ca/acme.json"

    - name: Write compose secrets env file
      ansible.builtin.copy:
        dest: "{{ proxy_compose_dir }}/.env"
        mode: "0600"
        content: |
          CF_DNS_API_TOKEN={{ lookup('env', 'CF_DNS_API_TOKEN') | mandatory('CF_DNS_API_TOKEN env var is not set') }}

    - name: Write Traefik static configuration
      ansible.builtin.copy:
        dest: "{{ proxy_compose_dir }}/traefik.yml"
        mode: "0640"
        content: |
          api:
            dashboard: true
            insecure: false

          entryPoints:
            web:
              address: ":80"
              http:
                redirections:
                  entryPoint:
                    to: websecure
                    scheme: https
            websecure:
              address: ":443"

          certificatesResolvers:
            letsencrypt:
              acme:
                caServer: "https://acme-staging-v02.api.letsencrypt.org/directory"
                email: "admin@gibbsgreatly.xyz"
                storage: "/certs/letsencrypt/acme.json"
                dnsChallenge:
                  provider: cloudflare
                  resolvers:
                    - "1.1.1.1:53"
                    - "8.8.8.8:53"
            step-ca:
              acme:
                caServer: "https://10.57.1.11/acme/acme/directory"
                email: "admin@gibbsgreatly.xyz"
                storage: "/certs/step-ca/acme.json"
                httpChallenge:
                  entryPoint: web

          providers:
            docker:
              exposedByDefault: false
            file:
              # Active watched directory for all dynamic files.
              # Generated per-stack files must be published into this directory.
              directory: "/etc/traefik/dynamic/"
              watch: true

          log:
            level: INFO

    - name: Write shared Authentik middleware config
      ansible.builtin.copy:
        dest: "{{ proxy_compose_dir }}/dynamic/authentik.yml"
        mode: "0640"
        content: |
          http:
            middlewares:
              authentik:
                forwardAuth:
                  address: "http://10.57.1.10:9000/outpost.goauthentik.io/auth/traefik"
                  trustForwardHeader: true
                  authResponseHeaders:
                    - X-authentik-username
                    - X-authentik-groups
                    - X-authentik-email

    - name: Write wildcard certificate request config
      ansible.builtin.copy:
        dest: "{{ proxy_compose_dir }}/dynamic/certs.yml"
        mode: "0640"
        content: |
          # No defaultGeneratedCert: each router requests its own cert via its
          # certResolver. This prevents the letsencrypt wildcard from shadowing
          # resolver-specific certs (e.g. step-ca cert for authentik).
          {}

    - name: Build combined CA bundle for lego (system CAs + homelab step-ca CA)
      ansible.builtin.shell: |
        cat /etc/ssl/certs/ca-certificates.crt \
            /usr/local/share/ca-certificates/homelab-root.crt \
            > {{ proxy_compose_dir }}/certs/combined-ca.crt
      args:
        executable: /bin/bash
      changed_when: true

    - name: Write Traefik compose definition
      ansible.builtin.copy:
        dest: "{{ proxy_compose_dir }}/docker-compose.yml"
        mode: "0640"
        content: |
          services:
            traefik:
              image: {{ traefik_image }}
              container_name: traefik
              restart: unless-stopped
              env_file: .env
              environment:
                # Combined CA bundle: system root CAs + homelab step-ca root CA.
                # LEGO_CA_CERTIFICATES replaces (not augments) the default CA pool,
                # so both system CAs (for LE) and homelab CA (for step-ca) are needed.
                LEGO_CA_CERTIFICATES: /certs/combined-ca.crt
              ports:
                - "80:80"
                - "443:443"
              volumes:
                - /var/run/docker.sock:/var/run/docker.sock:ro
                - ./traefik.yml:/etc/traefik/traefik.yml:ro
                - ./dynamic:/etc/traefik/dynamic:ro
                - ./certs/letsencrypt:/certs/letsencrypt
                - ./certs/step-ca:/certs/step-ca
                - ./certs/combined-ca.crt:/certs/combined-ca.crt:ro

    - name: Check requested generated Traefik source directory on control node
      ansible.builtin.stat:
        path: "{{ traefik_generated_source_dir }}"
      register: traefik_generated_source_dir_stat
      delegate_to: localhost
      become: false
      when: traefik_generated_source_dir | trim | length > 0

    - name: Assert generated Traefik source directory is valid when provided
      ansible.builtin.assert:
        that:
          - traefik_generated_source_dir_stat.stat.exists
          - traefik_generated_source_dir_stat.stat.isdir
        fail_msg: >-
          traefik_generated_source_dir={{ traefik_generated_source_dir }} must
          exist on the control node and be a directory.
      when: traefik_generated_source_dir | trim | length > 0

    - name: Remove legacy generated Traefik stacks directory
      ansible.builtin.file:
        path: "{{ proxy_compose_dir }}/dynamic/stacks"
        state: absent

    - name: Publish generated Traefik files into active dynamic directory
      ansible.builtin.copy:
        src: "{{ traefik_generated_source_dir }}/"
        dest: "{{ proxy_compose_dir }}/dynamic/"
        mode: "0640"
      when: traefik_generated_source_dir | trim | length > 0

    - name: Validate Traefik compose configuration
      ansible.builtin.command:
        cmd: docker compose -f "{{ proxy_compose_dir }}/docker-compose.yml" config -q
        chdir: "{{ proxy_compose_dir }}"
      changed_when: false

    - name: Start Traefik via compose
      community.docker.docker_compose_v2:
        project_src: "{{ proxy_compose_dir }}"
        state: present
