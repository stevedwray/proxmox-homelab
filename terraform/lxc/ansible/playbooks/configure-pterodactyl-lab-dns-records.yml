# Add a Technitium A record for pterodactyl-lab's Panel, Traefik-fronted
# like every other web-UI stack -- points at Traefik's own IP
# (192.168.30.10), not the container's. Shares that IP with ~15 other
# Traefik-fronted hostnames already live, so this record does not own the
# PTR (same pattern as media-stack-lab's jellyfin/immich records). Narrow
# standalone play, same reasoning as configure-gaming-stack-dns-records.yml
# and media-stack-lab's own DNS hookup: avoids running the full
# technitium-stack provision (the live authoritative DNS server) just to
# add one record.
---
- name: Add Technitium A record for pterodactyl-lab
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    technitium_ip: "{{ lookup('env', 'LAB_IP_TECHNITIUM') | mandatory('LAB_IP_TECHNITIUM env var is required') }}"
    technitium_admin_password: "{{ lookup('env', 'TECHNITIUM_ADMIN_PASSWORD') | mandatory('TECHNITIUM_ADMIN_PASSWORD env var is not set') }}"
    technitium_api_base: "http://{{ technitium_ip }}:5380/api" # nosonar: ansible:S5332 -- Technitium admin API, private mgmt_seg only
    lab_domain: "{{ lookup('env', 'LAB_DOMAIN') | default('lab.gibbsgreatly.xyz', true) }}"
    lab_ip_proxy: "{{ lookup('env', 'LAB_IP_PROXY') | mandatory('LAB_IP_PROXY env var is required') }}"
    pterodactyl_lab_dns_records:
      - { name: "pterodactyl", zone: "{{ lab_domain }}", ip: "{{ lab_ip_proxy }}", ptr: false }

  tasks:
    - name: Log in to Technitium
      ansible.builtin.uri:
        url: "{{ technitium_api_base }}/user/login?user=admin&pass={{ technitium_admin_password | urlencode }}&includeInfo=true"
        method: GET
        return_content: true
      register: technitium_login
      no_log: true
      until: technitium_login.status == 200
      retries: 3
      delay: 5

    - name: Extract session token
      ansible.builtin.set_fact:
        technitium_token: "{{ (technitium_login.content | from_json).token }}"
      no_log: true

    - name: Publish pterodactyl-lab A record via technitium_dns_record
      ansible.builtin.include_role:
        name: technitium_dns_record
      vars:
        technitium_dns_record_records: "{{ pterodactyl_lab_dns_records }}"
