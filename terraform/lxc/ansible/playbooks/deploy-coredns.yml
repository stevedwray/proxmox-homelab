---
- name: Deploy CoreDNS authoritative nameserver
  hosts: dns_stack
  become: true
  gather_facts: false

  vars:
    coredns_version: "1.10.1"
    coredns_binary: "/usr/local/bin/coredns"
    coredns_config_dir: "/etc/coredns"
    coredns_install_dir: "/tmp/coredns-install"
    coredns_seed_zone_src: "{{ playbook_dir }}/../files/coredns-lab.zone"
    coredns_generated_zone_src: ""
    coredns_zone_src: "{{ (coredns_generated_zone_src | trim) if (coredns_generated_zone_src | trim | length > 0) else coredns_seed_zone_src }}"
    coredns_zone_file: "{{ coredns_config_dir }}/lab.zone"
    coredns_zone_stage_file: "{{ coredns_config_dir }}/lab.zone.candidate"

  pre_tasks:
    - name: Wait for SSH to become available after container creation
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 2
        sleep: 3

    - name: Gather facts after the guest is reachable
      ansible.builtin.setup:

  roles:
    - role: lxc_base

  tasks:
    - name: Mask portainer-agent service (platform tier — no agent on this host)
      ansible.builtin.systemd:
        name: portainer-agent.service
        masked: true
        enabled: false
      failed_when: false

    - name: Check whether CoreDNS is already installed
      ansible.builtin.stat:
        path: "{{ coredns_binary }}"
      register: coredns_binary_stat

    - name: Install CoreDNS host dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - tar
          - dnsutils
          - bind9-utils
        state: present
        update_cache: true

    - name: Download CoreDNS release
      ansible.builtin.get_url:
        url: "https://github.com/coredns/coredns/releases/download/v{{ coredns_version }}/coredns_{{ coredns_version }}_linux_amd64.tgz"
        dest: "/tmp/coredns_{{ coredns_version }}_linux_amd64.tgz"
        mode: "0644"
      when: not coredns_binary_stat.stat.exists

    - name: Create CoreDNS installation directory
      ansible.builtin.file:
        path: "{{ coredns_install_dir }}"
        state: directory
        mode: "0755"
      when: not coredns_binary_stat.stat.exists

    - name: Extract CoreDNS binary
      ansible.builtin.unarchive:
        src: "/tmp/coredns_{{ coredns_version }}_linux_amd64.tgz"
        dest: "{{ coredns_install_dir }}"
        remote_src: true
      when: not coredns_binary_stat.stat.exists

    - name: Copy CoreDNS binary to /usr/local/bin
      ansible.builtin.copy:
        src: "{{ coredns_install_dir }}/coredns"
        dest: "{{ coredns_binary }}"
        mode: "0755"
        remote_src: true
      when: not coredns_binary_stat.stat.exists

    - name: Verify CoreDNS version
      ansible.builtin.command: "{{ coredns_binary }} -version"
      changed_when: false
      register: coredns_version_output
      failed_when: "'coredns' not in (coredns_version_output.stdout | lower)"

    - name: Display CoreDNS version
      ansible.builtin.debug:
        msg: "CoreDNS installed: {{ coredns_version_output.stdout }}"

    - name: Create CoreDNS configuration directory
      ansible.builtin.file:
        path: "{{ coredns_config_dir }}"
        state: directory
        mode: "0755"

    - name: Copy CoreDNS configuration file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/coredns.conf"
        dest: "{{ coredns_config_dir }}/coredns.conf"
        mode: "0644"
      notify: Restart CoreDNS service

    - name: Check selected CoreDNS zone source on control node
      ansible.builtin.stat:
        path: "{{ coredns_zone_src }}"
      delegate_to: localhost
      become: false
      register: coredns_zone_source_stat

    - name: Assert selected CoreDNS zone source exists
      ansible.builtin.assert:
        that:
          - coredns_zone_source_stat.stat.exists
          - coredns_zone_source_stat.stat.isreg
        fail_msg: >-
          CoreDNS zone source {{ coredns_zone_src }} does not exist or is not a regular file.
          Leave coredns_generated_zone_src unset to use the seed zone default.

    - name: Stage CoreDNS zone file candidate
      ansible.builtin.copy:
        src: "{{ coredns_zone_src }}"
        dest: "{{ coredns_zone_stage_file }}"
        mode: "0644"

    - name: Validate staged CoreDNS zone syntax
      ansible.builtin.command:
        argv:
          - named-checkzone
          - lab.gibbsgreatly.xyz
          - "{{ coredns_zone_stage_file }}"
      changed_when: false

    - name: Read staged CoreDNS zone for bootstrap guardrails
      ansible.builtin.slurp:
        src: "{{ coredns_zone_stage_file }}"
      register: coredns_zone_stage

    - name: Assert staged CoreDNS zone preserves bootstrap authority records
      ansible.builtin.assert:
        that:
          - (coredns_zone_stage.content | b64decode) is search('(?m)^@\\s+IN\\s+SOA\\s+')
          - (coredns_zone_stage.content | b64decode) is search('(?m)^@\\s+IN\\s+NS\\s+ns1\\.lab\\.gibbsgreatly\\.xyz\\.')
          - (coredns_zone_stage.content | b64decode) is search('(?m)^ns1\\s+IN\\s+A\\s+')
        fail_msg: >-
          Staged CoreDNS zone is missing required bootstrap authority records.
          Refusing to publish because this would remove required non-browser DNS records.

    - name: Publish CoreDNS zone file from staged candidate
      ansible.builtin.copy:
        src: "{{ coredns_zone_stage_file }}"
        dest: "{{ coredns_zone_file }}"
        mode: "0644"
        remote_src: true
      notify: Restart CoreDNS service

    - name: Copy CoreDNS systemd service file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/coredns.service"
        dest: /etc/systemd/system/coredns.service
        mode: "0644"
      notify: Restart CoreDNS service

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable CoreDNS service at boot
      ansible.builtin.systemd:
        name: coredns
        enabled: true

    - name: Start CoreDNS service
      ansible.builtin.systemd:
        name: coredns
        state: started

    - name: Apply pending CoreDNS configuration changes
      ansible.builtin.meta: flush_handlers

    - name: Wait for CoreDNS to be ready
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 53
        timeout: 30

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Verify CoreDNS service is active
      ansible.builtin.assert:
        that:
          - "'coredns.service' in ansible_facts.services"
          - ansible_facts.services['coredns.service'].state == "running"
        fail_msg: "CoreDNS service is not running"

    - name: Test authority query for traefik.lab.gibbsgreatly.xyz
      ansible.builtin.command: dig @127.0.0.1 +short traefik.lab.gibbsgreatly.xyz
      register: coredns_authority_test
      changed_when: false

    - name: Verify authority query returns expected address
      ansible.builtin.assert:
        that:
          - coredns_authority_test.stdout == "10.57.2.10"
        fail_msg: "Authority query did not return expected IP 10.57.2.10"

    - name: Test recursive query for github.com
      ansible.builtin.command: dig @127.0.0.1 +short github.com
      register: coredns_recursion_test
      changed_when: false

    - name: Verify recursive query returns records
      ansible.builtin.assert:
        that:
          - coredns_recursion_test.stdout | length > 0
        fail_msg: "Recursive query for github.com returned no records"

    - name: Clean up temporary installation files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/coredns_{{ coredns_version }}_linux_amd64.tgz"
        - "{{ coredns_install_dir }}"

  handlers:
    - name: Restart CoreDNS service
      ansible.builtin.systemd:
        name: coredns
        state: restarted
