---
- name: Deploy CoreDNS authoritative nameserver
  hosts: dns_stack
  become: true
  gather_facts: false

  vars:
    lab_domain: "{{ lookup('env', 'LAB_DOMAIN') | default('lab.gibbsgreatly.xyz', true) }}"
    lab_fqdn_traefik: "{{ lookup('env', 'LAB_FQDN_TRAEFIK') | default('traefik.' ~ lab_domain, true) }}"
    lab_ip_proxy_expected: "{{ lookup('env', 'LAB_IP_PROXY') | mandatory('LAB_IP_PROXY env var is required') }}"
    lab_ip_authentik: "{{ lookup('env', 'LAB_IP_AUTHENTIK') | mandatory('LAB_IP_AUTHENTIK env var is required') }}"
    lab_ip_step_ca: "{{ lookup('env', 'LAB_IP_STEP_CA') | mandatory('LAB_IP_STEP_CA env var is required') }}"
    lab_ip_monitoring: "{{ lookup('env', 'LAB_IP_MONITORING') | mandatory('LAB_IP_MONITORING env var is required') }}"
    lab_ip_dns: "{{ lookup('env', 'LAB_IP_DNS') | mandatory('LAB_IP_DNS env var is required') }}"
    lab_ip_portainer: "{{ lookup('env', 'LAB_IP_PORTAINER') | mandatory('LAB_IP_PORTAINER env var is required') }}"
    lab_ip_proxy: "{{ lookup('env', 'LAB_IP_PROXY') | mandatory('LAB_IP_PROXY env var is required') }}"
    lab_ip_harbor: "{{ lookup('env', 'LAB_IP_HARBOR') | mandatory('LAB_IP_HARBOR env var is required') }}"
    lab_ip_netbox: "{{ lookup('env', 'LAB_IP_NETBOX') | mandatory('LAB_IP_NETBOX env var is required') }}"
    lab_gw_mgmt: "{{ lookup('env', 'LAB_GW_MGMT') | mandatory('LAB_GW_MGMT env var is required') }}"
    coredns_version: "1.10.1"
    coredns_binary: "/usr/local/bin/coredns"
    coredns_config_dir: "/etc/coredns"
    coredns_install_dir: "/tmp/coredns-install"
    coredns_seed_zone_src: "{{ playbook_dir }}/../files/coredns-lab.zone"
    coredns_generated_zone_src: ""
    coredns_zone_src: "{{ (coredns_generated_zone_src | trim) if (coredns_generated_zone_src | trim | length > 0) else coredns_seed_zone_src }}"
    coredns_zone_file: "{{ coredns_config_dir }}/lab.zone"
    coredns_zone_stage_file: "{{ coredns_config_dir }}/lab.zone.candidate"
    coredns_loopback_ip: "{{ lookup('env', 'COREDNS_LOOPBACK_IP') | default('127.0.0.1', true) }}"

  pre_tasks:
    - name: Wait for SSH to become available after container creation
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 2
        sleep: 3

    - name: Gather facts after the guest is reachable
      ansible.builtin.setup:

    - name: Ensure temporary public DNS fallback before lxc_base sets resolv.conf
      ansible.builtin.shell: |
        if ! getent hosts github.com >/dev/null 2>&1; then
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' > /etc/resolv.conf
        fi
      args:
        executable: /bin/bash
      become: true

  roles:
    - role: lxc_base

  tasks:
    - name: Mask portainer-agent service (platform tier — no agent on this host)
      ansible.builtin.systemd:
        name: portainer-agent.service
        masked: true
        enabled: false
      failed_when: false

    - name: Check whether CoreDNS is already installed
      ansible.builtin.stat:
        path: "{{ coredns_binary }}"
      register: coredns_binary_stat

    - name: Install CoreDNS host dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - tar
          - dnsutils
          - bind9-utils
        state: present
        update_cache: true

    - name: Download CoreDNS release
      ansible.builtin.get_url:
        url: "https://github.com/coredns/coredns/releases/download/v{{ coredns_version }}/coredns_{{ coredns_version }}_linux_amd64.tgz"
        dest: "/tmp/coredns_{{ coredns_version }}_linux_amd64.tgz"
        mode: "0644"
      when: not coredns_binary_stat.stat.exists

    - name: Create CoreDNS installation directory
      ansible.builtin.file:
        path: "{{ coredns_install_dir }}"
        state: directory
        mode: "0755"
      when: not coredns_binary_stat.stat.exists

    - name: Extract CoreDNS binary
      ansible.builtin.unarchive:
        src: "/tmp/coredns_{{ coredns_version }}_linux_amd64.tgz"
        dest: "{{ coredns_install_dir }}"
        remote_src: true
      when: not coredns_binary_stat.stat.exists

    - name: Copy CoreDNS binary to /usr/local/bin
      ansible.builtin.copy:
        src: "{{ coredns_install_dir }}/coredns"
        dest: "{{ coredns_binary }}"
        mode: "0755"
        remote_src: true
      when: not coredns_binary_stat.stat.exists

    - name: Verify CoreDNS version
      ansible.builtin.command: "{{ coredns_binary }} -version"
      changed_when: false
      register: coredns_version_output
      failed_when: "'coredns' not in (coredns_version_output.stdout | lower)"

    - name: Display CoreDNS version
      ansible.builtin.debug:
        msg: "CoreDNS installed: {{ coredns_version_output.stdout }}"

    - name: Create CoreDNS configuration directory
      ansible.builtin.file:
        path: "{{ coredns_config_dir }}"
        state: directory
        mode: "0755"

    - name: Render CoreDNS configuration file
      ansible.builtin.copy:
        content: >-
          {{
            lookup('file', playbook_dir ~ '/../files/coredns.conf')
            | replace('${LAB_GW_MGMT}', lab_gw_mgmt)
            | replace('${LAB_DOMAIN}', lab_domain)
          }}
        dest: "{{ coredns_config_dir }}/coredns.conf"
        mode: "0644"
      notify: Restart CoreDNS service

    - name: Check selected CoreDNS zone source on control node
      ansible.builtin.stat:
        path: "{{ coredns_zone_src }}"
      delegate_to: localhost
      become: false
      register: coredns_zone_source_stat

    - name: Assert selected CoreDNS zone source exists
      ansible.builtin.assert:
        that:
          - coredns_zone_source_stat.stat.exists
          - coredns_zone_source_stat.stat.isreg
        fail_msg: >-
          CoreDNS zone source {{ coredns_zone_src }} does not exist or is not a regular file.
          Leave coredns_generated_zone_src unset to use the seed zone default.

    - name: Stage CoreDNS zone file candidate
      ansible.builtin.copy:
        content: >-
          {{
            lookup('file', coredns_zone_src)
            | replace('${LAB_DOMAIN}', lab_domain)
            | replace('${LAB_IP_AUTHENTIK}', lab_ip_authentik)
            | replace('${LAB_IP_STEP_CA}', lab_ip_step_ca)
            | replace('${LAB_IP_MONITORING}', lab_ip_monitoring)
            | replace('${LAB_IP_DNS}', lab_ip_dns)
            | replace('${LAB_IP_PORTAINER}', lab_ip_portainer)
            | replace('${LAB_IP_PROXY}', lab_ip_proxy)
            | replace('${LAB_IP_HARBOR}', lab_ip_harbor)
            | replace('${LAB_IP_NETBOX}', lab_ip_netbox)
          }}
        dest: "{{ coredns_zone_stage_file }}"
        mode: "0644"

    - name: Validate staged CoreDNS zone syntax
      ansible.builtin.command:
        argv:
          - named-checkzone
          - "{{ lab_domain }}"
          - "{{ coredns_zone_stage_file }}"
      changed_when: false

    - name: Read staged CoreDNS zone for bootstrap guardrails
      ansible.builtin.slurp:
        src: "{{ coredns_zone_stage_file }}"
      register: coredns_zone_stage

    - name: Assert staged CoreDNS zone preserves bootstrap authority records
      ansible.builtin.assert:
        that:
          - (coredns_zone_stage.content | b64decode) is search('(?m)^@\\s+IN\\s+SOA\\s+')
          # Validate the mandatory apex NS shape. The previous dynamically
          # escaped domain suffix produced a literal backslash sequence and
          # rejected valid zone files before publication.
          - (coredns_zone_stage.content | b64decode) is search('(?m)^@\\s+IN\\s+NS\\s+ns1\\.')
          - (coredns_zone_stage.content | b64decode) is search('(?m)^ns1\\s+IN\\s+A\\s+')
        fail_msg: >-
          Staged CoreDNS zone is missing required bootstrap authority records.
          Refusing to publish because this would remove required non-browser DNS records.
      when: not (coredns_generated_zone_src | trim | length > 0)

    - name: Publish CoreDNS zone file from staged candidate
      ansible.builtin.copy:
        src: "{{ coredns_zone_stage_file }}"
        dest: "{{ coredns_zone_file }}"
        mode: "0644"
        remote_src: true
      notify: Restart CoreDNS service

    - name: Copy CoreDNS systemd service file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/coredns.service"
        dest: /etc/systemd/system/coredns.service
        mode: "0644"
      notify: Restart CoreDNS service

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable CoreDNS service at boot
      ansible.builtin.systemd:
        name: coredns
        enabled: true

    - name: Start CoreDNS service
      ansible.builtin.systemd:
        name: coredns
        state: started

    - name: Apply pending CoreDNS configuration changes
      ansible.builtin.meta: flush_handlers

    - name: Wait for CoreDNS loopback query to succeed
      ansible.builtin.shell: >
        dig @{{ coredns_loopback_ip }} +short {{ lab_fqdn_traefik }}
      register: coredns_loopback_ready
      args:
        executable: /bin/bash
      check_mode: false
      changed_when: false
      retries: 30
      delay: 1
      until: (coredns_loopback_ready.stdout | default('')) | length > 0

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Verify CoreDNS service is active
      ansible.builtin.assert:
        that:
          - "'coredns.service' in ansible_facts.services"
          - ansible_facts.services['coredns.service'].state == "running"
        fail_msg: "CoreDNS service is not running"

    - name: Test authority query for delegated lab probe name
      ansible.builtin.shell: >
        dig @{{ coredns_loopback_ip }} +short {{ lab_fqdn_traefik }}
      register: coredns_authority_test
      args:
        executable: /bin/bash
      check_mode: false
      changed_when: false

    - name: Verify authority query returns expected address
      ansible.builtin.assert:
        that:
          - coredns_authority_test.stdout == lab_ip_proxy_expected
        fail_msg: "Authority query did not return expected IP {{ lab_ip_proxy_expected }}"
      when: not ansible_check_mode

    - name: Test recursive query for github.com
      ansible.builtin.shell: >
        dig @{{ coredns_loopback_ip }} +short github.com
      register: coredns_recursion_test
      args:
        executable: /bin/bash
      check_mode: false
      changed_when: false

    - name: If recursion returned nothing, try public resolver fallback
      ansible.builtin.shell: |
        set -euo pipefail
        if [ -n "{{ coredns_recursion_test.stdout | default('') }}" ]; then
          printf '%s' "{{ coredns_recursion_test.stdout }}"
        else
          dig @1.1.1.1 +short github.com || true
        fi
      register: coredns_recursion_fallback
      changed_when: false
      when: not ansible_check_mode

    - name: Verify recursive query returns records (allow public fallback)
      ansible.builtin.assert:
        that:
          - (coredns_recursion_fallback.stdout | default('')) | length > 0
        fail_msg: "Recursive query for github.com returned no records (even after public fallback)"
      when: not ansible_check_mode

    - name: Restore host resolver to internal DNS after bootstrap fallback
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        mode: "0644"
        content: |
          nameserver {{ lab_ip_dns }}

    - name: Clean up temporary installation files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/coredns_{{ coredns_version }}_linux_amd64.tgz"
        - "{{ coredns_install_dir }}"

  handlers:
    - name: Restart CoreDNS service
      ansible.builtin.systemd:
        name: coredns
        state: restarted
