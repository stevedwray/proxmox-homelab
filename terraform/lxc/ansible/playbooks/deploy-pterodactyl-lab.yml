---
- name: Deploy pterodactyl-lab
  hosts: all
  become: true
  gather_facts: true

  vars:
    stack_name: pterodactyl-lab
    pterodactyl_lab_dir: "/opt/stacks/{{ stack_name }}"
    pterodactyl_lab_compose_content: "{{ lookup('file', '../../stacks/' + stack_name + '/docker-compose.yml') }}"
    # Must be the FQDN (routed through Traefik), not LAB_IP_HARBOR -- see
    # docs/harbor-stack/image-sourcing-enforcement.md.
    docker_registry_host: "{{ registry_host | default(lookup('env', 'LAB_FQDN_HARBOR'), true) | default('harbor.' ~ (lookup('env', 'LAB_DOMAIN') | default('lab.gibbsgreatly.xyz', true)), true) }}"

  roles:
    - lxc_base
    - docker_base
    - portainer_agent

  handlers:
    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted
        daemon_reload: true

  tasks:
    - name: Trust Harbor HTTP registry and forward Docker container logs to Graylog
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {
            "insecure-registries": ["{{ docker_registry_host }}"],
            "log-driver": "syslog",
            "log-opts": {
              "syslog-address": "tcp://127.0.0.1:10514",
              "syslog-format": "rfc5424",
              "tag": "{% raw %}docker-{{.Name}}{% endraw %}"
            },
            "storage-driver": "overlay2"
          }
      notify: Restart Docker

    - name: Flush handlers to apply Docker daemon config before stack deploy
      ansible.builtin.meta: flush_handlers

    - name: Create stack directory
      ansible.builtin.file:
        path: "{{ pterodactyl_lab_dir }}"
        state: directory
        mode: "0755"

    - name: Write docker-compose.yml to stack directory
      ansible.builtin.copy:
        content: "{{ pterodactyl_lab_compose_content }}"
        dest: "{{ pterodactyl_lab_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Write compose env file
      ansible.builtin.copy:
        dest: "{{ pterodactyl_lab_dir }}/.env"
        mode: "0600"
        owner: root
        group: root
        content: |
          PTERODACTYL_LAB_DB_PASSWORD={{ lookup('env', 'PTERODACTYL_LAB_DB_PASSWORD') }}
          PTERODACTYL_LAB_DB_ROOT_PASSWORD={{ lookup('env', 'PTERODACTYL_LAB_DB_ROOT_PASSWORD') }}
          LAB_DOMAIN={{ lookup('env', 'LAB_DOMAIN') }}
      no_log: true

    - name: Validate docker compose configuration
      ansible.builtin.command:
        cmd: docker compose config
        chdir: "{{ pterodactyl_lab_dir }}"
      register: pterodactyl_lab_compose_config_check
      changed_when: false
      when: not ansible_check_mode

    - name: Start pterodactyl-lab via docker compose
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ pterodactyl_lab_dir }}"
      register: pterodactyl_lab_compose_up
      changed_when: "'Started' in pterodactyl_lab_compose_up.stdout or 'Created' in pterodactyl_lab_compose_up.stdout"
      when: not ansible_check_mode

    - name: Wait for Panel to accept TCP connections
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 80
        timeout: 180
      when: not ansible_check_mode
      ignore_errors: "{{ ansible_check_mode }}"

- name: Register pterodactyl-lab endpoint with infra Portainer
  hosts: all
  roles:
    - portainer_api
    - portainer_stack
