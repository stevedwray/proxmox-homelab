# Full lifecycle playbook: Docker base → Portainer Agent → Register → Deploy stack
# Expects host vars: app_stack_name, portainer_server_ip, stack_name

---
- name: Configure Docker base and Portainer Agent
  hosts: all
  become: true
  gather_facts: true
  vars:
    docker_registry_host: "{{ registry_host | default(lookup('env', 'LAB_IP_HARBOR'), true) | mandatory('registry_host var or LAB_IP_HARBOR env var is required') }}"
  roles:
    - lxc_base
    - docker_base
    - portainer_agent

  tasks:
    - name: Trust Harbor HTTP registry in Docker daemon
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {
            "insecure-registries": ["{{ docker_registry_host }}"],
            "log-driver": "syslog",
            "log-opts": {
              "syslog-address": "unixgram:///dev/log",
              "syslog-format": "rfc5424",
              "tag": "{% raw %}docker/{{.Name}}{% endraw %}"
            },
            "storage-driver": "overlay2"
          }
      notify: Restart Docker

    - name: Flush handlers to apply Docker daemon config
      ansible.builtin.meta: flush_handlers

  handlers:
    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted

- name: Register endpoint and deploy stack via Portainer API
  hosts: all
  become: false
  gather_facts: false

  vars:
    app_stack_compose_content: "{{ lookup('file', '../../stacks/' + stack_name + '/docker-compose.yml') }}"
    app_stack_name: "{{ stack_name }}"
    app_stack_endpoint_name: "{{ inventory_hostname }}"
    app_stack_server_ip: "{{ portainer_server_ip }}"
    portainer_api_server_ip: "{{ portainer_server_ip }}"
    portainer_api_endpoint_name: "{{ inventory_hostname }}"
    portainer_api_agent_ip: "{{ ansible_host }}"

  roles:
    - portainer_api
    - app_stack
