---
# Adopts the hand-built Omada controller CT (VMID 114, 192.168.1.252) into the
# lab's Ansible flow. See docs/omada-controller/plan.md.
#
# Deliberately NOT included: docker_base (Docker is already installed and
# configured on this CT). lxc_base can still restart dockerd if it updates
# the root CA. The compose project name (`omada`) and volume names
# (omada_omada-data, omada_omada-logs) must stay exactly as they are -- they
# hold the controller database and every switch's configuration.
#
# Run (production approval flow, see AGENTS.md):
#   TASK_APPROVAL=<task> ./with-secrets-prod scripts/provision.sh --stack omada-controller
- name: Manage the Omada controller CT
  hosts: all
  become: true
  gather_facts: true

  vars:
    omada_compose_dir: /srv/docker/omada
    omada_image: "mbentley/omada-controller:{{ omada_version }}"
    # Controller UI TLS: a step-ca cert (SANs: lab FQDN + IP) so Traefik can
    # verify the backend via its global serversTransport.rootCAs. The image reads
    # a full-chain /cert/tls.crt + /cert/tls.key at container start; renewal
    # therefore needs a container restart, so use the 90d maximum (renew at <15d).
    omada_cert_dir: "{{ omada_compose_dir }}/cert"
    omada_fqdn: "omada.{{ lookup('env', 'LAB_DOMAIN') | default('lab.gibbsgreatly.xyz', true) }}"
    omada_root_ca: /usr/local/share/ca-certificates/homelab-root.crt
    omada_step_ca_url: "https://{{ lookup('env', 'LAB_IP_STEP_CA') | mandatory('LAB_IP_STEP_CA env var is required') }}"
    omada_step_ca_provisioner: "{{ lookup('env', 'STEP_CA_PROVISIONER_NAME') | default('homelab-admin', true) }}"
    omada_step_ca_provisioner_password: "{{ lookup('env', 'STEP_CA_PROVISIONER_PASSWORD') | mandatory('STEP_CA_PROVISIONER_PASSWORD env var is required') }}"
    # Wazuh agent (docs/omada-controller/plan.md). Groups are zone names; the
    # flat LAN has none, so `lan` (the zone name the GVM scan config uses).
    wazuh_agent_group: lan
    # Accepts docker.sock access for the wazuh user (root-equivalent on this CT)
    # for container start/stop/die events -- same tradeoff as newt-connector;
    # the CT is unprivileged and the Portainer agent already holds the socket.
    wazuh_agent_docker_monitoring_enabled: true
    # Compose files only; deliberately not exporter.env (credentials).
    wazuh_agent_fim_paths:
      - /srv/docker/omada/docker-compose.yaml
      - /srv/docker/omada-monitoring/compose.yaml

  pre_tasks:
    - name: Refuse to run without a pinned, non-floating version
      ansible.builtin.assert:
        that:
          - omada_version is defined
          - (omada_version | default('')) is match('^[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+$')
        fail_msg: "omada_version must be an exact four-part version (e.g. 5.15.24.19), never latest"

    - name: Refuse to run if the controller data volume is missing (would create a blank controller)
      ansible.builtin.command: docker volume inspect omada_omada-data
      changed_when: false

    # A v6 image started against v5 data (MongoDB 3.6) breaks the controller:
    # v6 ships MongoDB 8 and the data needs the stepwise mongodb-upgrade
    # container first (docs/omada-controller/plan.md Phase D). Compare the major
    # version recorded by the controller itself with the target major.
    - name: Read the controller version that last ran against the data volume
      ansible.builtin.slurp:
        src: /var/lib/docker/volumes/omada_omada-data/_data/LAST_RAN_OMADA_VER.txt
      register: omada_last_ran_raw

    - name: Refuse a major-version jump unless the data has been migrated
      ansible.builtin.assert:
        that:
          - >-
            (omada_last_ran_raw.content | b64decode | trim).split('.')[0]
            == omada_version.split('.')[0]
            or (omada_allow_major_upgrade | default(false) | bool)
        fail_msg: >-
          Data volume last ran {{ omada_last_ran_raw.content | b64decode | trim }} but
          omada_version is {{ omada_version }}: a different major version. Do the
          MongoDB upgrade (plan.md Phase D) first, then pass
          -e omada_allow_major_upgrade=true for that single cutover run only.

  roles:
    - lxc_base
    - role: wazuh_agent
      tags: [wazuh_agent_rollout]

  tasks:
    - name: Ensure the compose project directory exists
      ansible.builtin.file:
        path: "{{ omada_compose_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # ---- Controller UI TLS (step-ca) ----------------------------------------
    - name: Ensure the controller TLS directory exists
      ansible.builtin.file:
        path: "{{ omada_cert_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      tags: [omada_tls]

    - name: Check the current controller TLS certificate
      ansible.builtin.shell: |
        set -euo pipefail
        if [[ -s "{{ omada_cert_dir }}/leaf.crt" && -s "{{ omada_cert_dir }}/tls.key" ]] \
           && openssl x509 -checkend 1296000 -noout -in "{{ omada_cert_dir }}/leaf.crt" >/dev/null 2>&1; then
          echo valid
        else
          echo issue
        fi
      args:
        executable: /bin/bash
      register: omada_tls_state
      changed_when: false
      tags: [omada_tls]

    - name: Issue the controller TLS certificate from step-ca
      when: omada_tls_state.stdout == 'issue'
      tags: [omada_tls]
      block:
        - name: Write temporary step-ca provisioner password file
          ansible.builtin.copy:
            dest: /root/.omada-step-provisioner-password
            content: "{{ omada_step_ca_provisioner_password }}\n"
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: Request certificate with FQDN and IP SANs
          ansible.builtin.command:
            argv:
              - /usr/local/bin/step
              - ca
              - certificate
              - "{{ omada_fqdn }}"
              - "{{ omada_cert_dir }}/leaf.crt"
              - "{{ omada_cert_dir }}/tls.key"
              - --san
              - "{{ omada_fqdn }}"
              - --san
              - "{{ ansible_host }}"
              - --ca-url
              - "{{ omada_step_ca_url }}"
              - --root
              - "{{ omada_root_ca }}"
              - --provisioner
              - "{{ omada_step_ca_provisioner }}"
              - --provisioner-password-file
              - /root/.omada-step-provisioner-password
              - --not-after
              - 2160h
              - --force
          changed_when: true
      always:
        - name: Remove temporary step-ca provisioner password file
          ansible.builtin.file:
            path: /root/.omada-step-provisioner-password
            state: absent

    - name: Assemble the full-chain tls.crt (leaf + intermediate, then the root)
      ansible.builtin.shell: |
        set -euo pipefail
        cat "{{ omada_cert_dir }}/leaf.crt" "{{ omada_root_ca }}" > "{{ omada_cert_dir }}/tls.crt.new"
        if cmp -s "{{ omada_cert_dir }}/tls.crt.new" "{{ omada_cert_dir }}/tls.crt" 2>/dev/null; then
          rm -f "{{ omada_cert_dir }}/tls.crt.new"
          echo same
        else
          mv -f "{{ omada_cert_dir }}/tls.crt.new" "{{ omada_cert_dir }}/tls.crt"
          echo updated
        fi
      args:
        executable: /bin/bash
      register: omada_tls_assemble
      changed_when: omada_tls_assemble.stdout == 'updated'
      when: not ansible_check_mode
      tags: [omada_tls]

    - name: Set controller TLS file modes
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ omada_cert_dir }}/leaf.crt", mode: "0644" }
        - { path: "{{ omada_cert_dir }}/tls.crt", mode: "0644" }
        - { path: "{{ omada_cert_dir }}/tls.key", mode: "0600" }
      when: not ansible_check_mode
      tags: [omada_tls]

    - name: Install the pinned compose file
      ansible.builtin.copy:
        dest: "{{ omada_compose_dir }}/docker-compose.yaml"
        owner: root
        group: root
        mode: "0644"
        backup: true
        content: |
          name: omada
          services:
            omada-controller:
              image: {{ omada_image }}
              container_name: omada-controller
              restart: unless-stopped
              network_mode: host   # Required for device discovery/adoption
              environment:
                - JAVA_OPTS=-Xms512m -Xmx1024m
                - PUID=508
                - PGID=508
                - MANAGE_HTTP_PORT=8088
                - MANAGE_HTTPS_PORT=8043
                - PORTAL_HTTP_PORT=8888
                - PORTAL_HTTPS_PORT=8843
                - SHOW_SERVER_LOGS=true
                - SHOW_MONGODB_LOGS=false
                - SSL_CERT_NAME=tls.crt
                - SSL_KEY_NAME=tls.key
                - TZ=Pacific/Auckland
              volumes:
                - omada-data:/opt/tplink/EAPController/data
                - omada-logs:/opt/tplink/EAPController/logs
                - ./cert:/cert:ro
          volumes:
            omada-data:
            omada-logs:
      register: omada_compose

    - name: Apply the compose file (recreates the container only when it changed)
      ansible.builtin.command: docker compose -f {{ omada_compose_dir }}/docker-compose.yaml up -d
      args:
        chdir: "{{ omada_compose_dir }}"
      when: omada_compose.changed

    - name: Restart the controller to load a changed certificate (compose already did if it recreated)
      ansible.builtin.command: docker compose -f {{ omada_compose_dir }}/docker-compose.yaml restart omada-controller
      args:
        chdir: "{{ omada_compose_dir }}"
      when:
        - not ansible_check_mode
        - omada_tls_assemble.changed | default(false)
        - not omada_compose.changed
      tags: [omada_tls]

    - name: Write the controller TLS renewal script
      ansible.builtin.copy:
        dest: /usr/local/sbin/omada-tls-renew.sh
        owner: root
        group: root
        mode: "0750"
        content: |
          #!/bin/bash
          # Renew the controller UI cert via mTLS with the existing cert (no
          # provisioner password stays on this host), rebuild the full chain, and
          # restart the controller -- the image only reads /cert at start.
          set -euo pipefail
          DIR="{{ omada_cert_dir }}"
          if openssl x509 -checkend 1296000 -noout -in "${DIR}/leaf.crt" >/dev/null 2>&1; then
            echo "omada TLS cert valid for >15d, nothing to do"
            exit 0
          fi
          /usr/local/bin/step ca renew --force \
            --ca-url "{{ omada_step_ca_url }}" \
            --root "{{ omada_root_ca }}" \
            "${DIR}/leaf.crt" "${DIR}/tls.key"
          cat "${DIR}/leaf.crt" "{{ omada_root_ca }}" > "${DIR}/tls.crt"
          chmod 0644 "${DIR}/leaf.crt" "${DIR}/tls.crt"
          chmod 0600 "${DIR}/tls.key"
          docker compose -f {{ omada_compose_dir }}/docker-compose.yaml restart omada-controller
          echo "omada TLS cert renewed; controller restarted"
      tags: [omada_tls]

    - name: Write the controller TLS renewal service and timer
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        owner: root
        group: root
        mode: "0644"  # nosonar: ansible:S2612 -- systemd unit files must be world-readable
        content: "{{ item.content }}"
      loop:
        - name: omada-tls-renew.service
          content: |
            [Unit]
            Description=Renew the Omada controller UI TLS certificate from step-ca
            After=network-online.target docker.service
            Wants=network-online.target

            [Service]
            Type=oneshot
            ExecStart=/usr/local/sbin/omada-tls-renew.sh
        - name: omada-tls-renew.timer
          content: |
            [Unit]
            Description=Daily check of the Omada controller UI TLS certificate

            [Timer]
            OnCalendar=*-*-* 03:20:00
            RandomizedDelaySec=20m
            Persistent=true

            [Install]
            WantedBy=timers.target
      tags: [omada_tls]

    - name: Enable the controller TLS renewal timer
      ansible.builtin.systemd:
        name: omada-tls-renew.timer
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode
      tags: [omada_tls]

    - name: Wait for the controller management port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8043
        timeout: 300
      when: not ansible_check_mode

    - name: Wait for the controller container to report healthy
      ansible.builtin.command: docker inspect -f '{% raw %}{{.State.Health.Status}}{% endraw %}' omada-controller
      register: omada_health
      until: omada_health.stdout == 'healthy'
      retries: 30
      delay: 10
      changed_when: false
      when: not ansible_check_mode
