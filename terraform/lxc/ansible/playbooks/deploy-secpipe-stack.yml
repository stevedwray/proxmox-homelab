# secpipe-stack -- ai_seg zone. CVE correlation/enrichment pipeline, see
# docs/threat-vuln-platform/plan.md. Pure Python + systemd-timer host, no
# Docker service (same execution model as harbor_findings_sync.py/
# gvm_findings_sync.py) -- no docker_base role needed, matching
# step-ca-stack's own precedent for a lightweight non-Docker utility
# stack that still uses the standard Docker-capable base template.

---
- name: Prepare secpipe-stack host
  hosts: all
  become: true
  gather_facts: false

  roles:
    - lxc_base

  pre_tasks:
    - name: Wait for SSH to become available after container creation
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 2

    - name: Gather facts after the guest is reachable
      ansible.builtin.setup:

  tasks:
    - name: Mask portainer-agent service (platform tier -- no agent on this host)
      ansible.builtin.systemd:
        name: portainer-agent.service
        masked: true
        enabled: false
      failed_when: false

- name: Deploy CVE correlation/enrichment sync
  hosts: all
  become: true
  gather_facts: false
  roles:
    - role: cve_enrichment_sync
      when: cve_enrichment_sync_enabled | default(false) | bool

- name: Provision the dedicated GVM credentialed-scan account (docs/lxc-scan-and-monitoring-rollout/plan.md gvm-06)
  hosts: all
  become: true
  gather_facts: false
  pre_tasks:
    - name: Read this stack's GVM scan credentials from OpenBao
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../../../../scripts/gvm_scan_host_secret.py"
          - --stack
          - secpipe-stack
      register: gvm_scan_secret_raw
      delegate_to: localhost
      become: false
      changed_when: false
    - name: Parse the credentials JSON
      ansible.builtin.set_fact:
        gvm_scan_secret: "{{ gvm_scan_secret_raw.stdout | from_json }}"
  vars:
    gvm_scan_account_public_key: "{{ gvm_scan_secret.GVM_SCAN_SSH_PUBLIC_KEY }}"
    gvm_scan_account_sudo_password_hash: "{{ gvm_scan_secret.GVM_SCAN_SUDO_PASSWORD | password_hash('sha512') }}"
  roles:
    - gvm_scan_account

- name: Enroll this host as a Wazuh agent (docs/lxc-scan-and-monitoring-rollout/plan.md waz-02)
  hosts: all
  become: true
  gather_facts: false
  tags: [wazuh_agent_rollout]
  vars:
    wazuh_agent_fim_paths:
      - /opt/cve-enrichment-sync
    wazuh_agent_group: ai_seg
  roles:
    - wazuh_agent

- name: Enable unattended security updates (fleet rollout, 2026-08-30)
  hosts: all
  become: true
  gather_facts: false
  roles:
    - unattended_upgrades
