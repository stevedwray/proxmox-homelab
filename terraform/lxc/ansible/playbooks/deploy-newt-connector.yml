---
- name: Configure Docker base for newt-connector
  hosts: all
  become: true
  gather_facts: true
  vars:
    # Watch the Compose definition but deliberately not its adjacent .env:
    # the latter contains the operator-managed Newt enrollment secret.
    wazuh_agent_fim_paths:
      - /opt/newt-connector/docker-compose.yml
    # This accepts Docker socket access for Wazuh on this high-value,
    # single-workload host; see the shared role's documented tradeoff.
    wazuh_agent_docker_monitoring_enabled: true
    wazuh_agent_group: connector_seg
  roles:
    - lxc_base
    - docker_base
    - role: wazuh_agent
      tags: [wazuh_agent_rollout]

  tasks:
    # No "Trust Harbor HTTP registry in Docker daemon" task here, unlike
    # every other Docker stack's playbook -- connector_seg has no firewall
    # reach to infra_seg or the main Traefik (nextcloud-P3-01), so this
    # host never talks to Harbor. Newt (deployed separately, by the
    # operator -- see STACK_CONTRACT.md) pulls fosrl/newt directly from
    # Docker Hub over the zone's general internet egress rule instead.
    - name: Mask portainer-agent service (platform tier — no agent on this host)
      ansible.builtin.systemd:
        name: portainer-agent.service
        masked: true
        enabled: false
      failed_when: false

    # The Compose file and .env remain operator-managed. This timer only
    # operates the existing `newt` service; it never writes or logs either
    # file, and it keeps old images so rollback remains manual and possible.
    - name: Install weekly Newt image refresh script
      ansible.builtin.copy:
        dest: /usr/local/sbin/newt-image-refresh
        owner: root
        group: root
        mode: "0750"
        content: |
          #!/bin/bash
          set -euo pipefail

          cd /opt/newt-connector
          /usr/bin/docker compose pull newt
          /usr/bin/docker compose up --detach --no-deps newt
          /usr/bin/docker compose ps --status running --services | grep --fixed-strings --line-regexp newt >/dev/null

    - name: Install weekly Newt image refresh service
      ansible.builtin.copy:
        dest: /etc/systemd/system/newt-image-refresh.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Refresh the Newt connector image
          Wants=network-online.target
          After=network-online.target docker.service
          ConditionPathExists=/opt/newt-connector/docker-compose.yml

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/newt-image-refresh

    - name: Install weekly Newt image refresh timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/newt-image-refresh.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Weekly Newt connector image refresh

          [Timer]
          OnCalendar=Sun *-*-* 03:15:00
          RandomizedDelaySec=30m
          Persistent=true

          [Install]
          WantedBy=timers.target

    - name: Enable weekly Newt image refresh timer
      ansible.builtin.systemd:
        name: newt-image-refresh.timer
        enabled: true
        state: started
        daemon_reload: true

- name: Provision the dedicated GVM credentialed-scan account (docs/lxc-scan-and-monitoring-rollout/plan.md gvm-06)
  hosts: all
  become: true
  gather_facts: false
  pre_tasks:
    - name: Read this stack's GVM scan credentials from OpenBao
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../../../../scripts/gvm_scan_host_secret.py"
          - --stack
          - newt-connector
      register: gvm_scan_secret_raw
      delegate_to: localhost
      become: false
      changed_when: false
    - name: Parse the credentials JSON
      ansible.builtin.set_fact:
        gvm_scan_secret: "{{ gvm_scan_secret_raw.stdout | from_json }}"
  vars:
    gvm_scan_account_public_key: "{{ gvm_scan_secret.GVM_SCAN_SSH_PUBLIC_KEY }}"
    gvm_scan_account_sudo_password_hash: "{{ gvm_scan_secret.GVM_SCAN_SUDO_PASSWORD | password_hash('sha512') }}"
  roles:
    - gvm_scan_account

- name: Enable unattended security updates for newt-connector
  hosts: all
  become: true
  gather_facts: false
  roles:
    - unattended_upgrades
