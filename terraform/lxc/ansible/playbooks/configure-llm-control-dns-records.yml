# Add a Technitium A record for llm-control (llama-swap's model control page
# on framework, docs/llama-swap/plan.md), Traefik-fronted like every other
# web UI -- points at Traefik's own IP (192.168.30.10), which already carries
# ~15 other hostnames, so this record does not own the PTR. Narrow standalone
# play, same reasoning as configure-pterodactyl-lab-dns-records.yml: avoids
# running the full technitium-stack provision (the live authoritative DNS
# server) just to add one record. The cluster replicates it to the secondary.
---
- name: Add Technitium A record for llm-control
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    technitium_ip: "{{ lookup('env', 'LAB_IP_TECHNITIUM') | mandatory('LAB_IP_TECHNITIUM env var is required') }}"
    technitium_admin_password: "{{ lookup('env', 'TECHNITIUM_ADMIN_PASSWORD') | mandatory('TECHNITIUM_ADMIN_PASSWORD env var is not set') }}"
    technitium_api_base: "http://{{ technitium_ip }}:5380/api" # nosonar: ansible:S5332 -- Technitium admin API, private mgmt_seg only
    lab_domain: "{{ lookup('env', 'LAB_DOMAIN') | default('lab.gibbsgreatly.xyz', true) }}"
    lab_ip_proxy: "{{ lookup('env', 'LAB_IP_PROXY') | mandatory('LAB_IP_PROXY env var is required') }}"
    llm_control_dns_records:
      - { name: "llm-control", zone: "{{ lab_domain }}", ip: "{{ lab_ip_proxy }}", ptr: false }

  tasks:
    - name: Log in to Technitium
      ansible.builtin.uri:
        url: "{{ technitium_api_base }}/user/login?user=admin&pass={{ technitium_admin_password | urlencode }}&includeInfo=true"
        method: GET
        return_content: true
      register: technitium_login
      no_log: true
      until: technitium_login.status == 200
      retries: 3
      delay: 5

    - name: Extract session token
      ansible.builtin.set_fact:
        technitium_token: "{{ (technitium_login.content | from_json).token }}"
      no_log: true

    - name: Publish llm-control A record via technitium_dns_record
      ansible.builtin.include_role:
        name: technitium_dns_record
      vars:
        technitium_dns_record_records: "{{ llm_control_dns_records }}"
