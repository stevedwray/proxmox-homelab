---
# elasticsearch-stack — single-node Elasticsearch + Kibana findings store.
# See terraform/lxc/stacks/elasticsearch-stack/STACK_CONTRACT.md and
# docs/elasticsearch-stack/plan.md for the full design.
#
# Play 1: Docker base configuration (matches deploy-harbor-stack.yml /
#         deploy-graylog-stack.yml's shape).
# Play 2: Deploy Elasticsearch + Kibana via a Docker Compose file templated
#         inline (heap size computed from the container's real memory
#         budget, same formula deploy-graylog-stack.yml uses for its
#         Data Node — not a static docker-compose.yml in the stack
#         directory, matching Graylog's precedent, not Minecraft's).
#
# No dashboard/pipeline/index-set provisioning here (unlike Graylog's
# playbook) — this stack's own findings assets (index templates, ingest
# pipelines) are applied by a separate `es_findings_ingest` role deployed
# onto harbor-stack and inside pentest_seg, not here. Keep this playbook
# scoped to "get ES+Kibana up and healthy."

- name: Configure Docker base
  hosts: all
  become: true
  gather_facts: true
  vars:
    es_lab_ip_dns: "{{ lookup('env', 'LAB_IP_DNS') | default(dns_server, true) | mandatory('LAB_IP_DNS env var or dns_server inventory var is required') }}"
    # FQDN, not the raw LAB_IP_HARBOR — matches deploy-graylog-stack.yml's
    # proven pattern. Confirmed live 2026-08-17: docker login against the
    # bare Harbor IP fails (its token service redirects to HTTPS on 443,
    # which the raw IP has no valid cert for and refuses); the FQDN works
    # because it goes through Traefik's real TLS termination.
    es_registry_host: "{{ lookup('env', 'LAB_FQDN_HARBOR') | default('harbor.' ~ lookup('env', 'LAB_DOMAIN'), true) }}"
  roles:
    - lxc_base
    - docker_base
    - role: docker_socket_proxy
      when: enable_docker_socket_proxy | default(false) | bool
  tasks:
    - name: Trust Harbor HTTP registry in Docker daemon
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {
            "insecure-registries": ["{{ es_registry_host }}"],
            "dns": ["{{ es_lab_ip_dns }}"],
            "log-driver": "syslog",
            "log-opts": {
              "syslog-address": "tcp://127.0.0.1:10514",
              "syslog-format": "rfc5424",
              "tag": "{% raw %}docker-{{.Name}}{% endraw %}"
            },
            "storage-driver": "overlay2"
          }
      notify: Restart Docker

    - name: Flush handlers to apply Docker daemon config before compose up
      ansible.builtin.meta: flush_handlers

  handlers:
    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted

- name: Deploy Elasticsearch + Kibana
  hosts: all
  become: true
  gather_facts: false
  vars:
    es_compose_dir: /opt/elasticsearch-stack
    es_data_dir: /var/lib/elasticsearch-data   # extra_mount path from stack.yaml — already provisioned by Terraform
    # FQDN, not LAB_IP_HARBOR — see Play 1's identical variable for why.
    es_registry_host: "{{ lookup('env', 'LAB_FQDN_HARBOR') | default('harbor.' ~ lookup('env', 'LAB_DOMAIN'), true) }}"
    es_image_tag: "9.4.5"   # latest tag published for BOTH elastic/elasticsearch and elastic/kibana on Docker Hub as of 2026-08-17 — keep in sync, ES sometimes ships ahead of Kibana
    es_elastic_password: "{{ lookup('env', 'ELASTIC_PASSWORD') | mandatory('ELASTIC_PASSWORD env var is required — new SOPS secret, see STACK_CONTRACT.md Inputs') }}"
    es_kibana_system_password: "{{ lookup('env', 'ELASTIC_KIBANA_SYSTEM_PASSWORD') | mandatory('ELASTIC_KIBANA_SYSTEM_PASSWORD env var is required — new SOPS secret, see STACK_CONTRACT.md Inputs') }}"
    # Same formula deploy-graylog-stack.yml uses for its Data Node heap —
    # half the container's real memory, floor, minimum 1GB. At the
    # conservative 3072MB stack.yaml starting point this resolves to 1GB.
    es_heap_gb: >-
      {{
        [
          1,
          (
            (
              hostvars[inventory_hostname].ansible_memtotal_mb
              | default(hostvars[inventory_hostname].ansible_memory_mb.real.total)
              | int
            ) / 1024 / 2
          ) | round(0, 'floor') | int
        ] | max
      }}
    es_runtime_images:
      - "{{ es_registry_host }}/dockerhub/elastic/elasticsearch:{{ es_image_tag }}"
      - "{{ es_registry_host }}/dockerhub/elastic/kibana:{{ es_image_tag }}"

  tasks:
    - name: Create Elasticsearch compose directory
      ansible.builtin.file:
        path: "{{ es_compose_dir }}"
        state: directory
        mode: "0750"

    - name: Ensure Elasticsearch data directory ownership matches the container's non-root user
      ansible.builtin.file:
        path: "{{ es_data_dir }}"
        state: directory
        owner: "1000"   # the official elasticsearch image's non-root "elasticsearch" user
        group: "1000"
        mode: "0750"

    - name: Write Elasticsearch env file
      ansible.builtin.copy:
        dest: "{{ es_compose_dir }}/elasticsearch.env"
        mode: "0640"
        content: |
          ELASTIC_PASSWORD={{ es_elastic_password }}
          KIBANA_SYSTEM_PASSWORD={{ es_kibana_system_password }}
      no_log: true
      register: es_env_file
      notify: Recreate Elasticsearch stack

    # A real script file, not an inline compose `command:` one-liner --
    # avoids an entire class of bugs already hit and fixed once each
    # (2026-08-17): YAML folded-block indentation silently defeating line
    # folding, Compose pre-parsing ${VAR} inside a command string meant
    # for the container's shell, and unquoted colons in the command value
    # itself being misread as YAML mapping syntax. A real file sidesteps
    # all three -- Ansible writes it verbatim, Compose never has to parse
    # its content, only reference its path.
    - name: Write kibana_system password-set script
      ansible.builtin.copy:
        dest: "{{ es_compose_dir }}/kibana-setup.sh"
        mode: "0750"
        content: |
          #!/bin/bash
          set -euo pipefail
          until curl -s -X POST -u "elastic:${ELASTIC_PASSWORD}" \
              -H "Content-Type: application/json" \
              http://elasticsearch:9200/_security/user/kibana_system/_password \
              -d "{\"password\":\"${KIBANA_SYSTEM_PASSWORD}\"}" \
              | grep -q '^{}'; do
            sleep 5
          done
          echo "kibana_system password set"
      register: es_kibana_setup_script
      notify: Recreate Elasticsearch stack

    - name: Write Elasticsearch docker-compose.yml
      ansible.builtin.copy:
        dest: "{{ es_compose_dir }}/docker-compose.yml"
        mode: "0640"
        content: |
          services:
            elasticsearch:
              image: {{ es_registry_host }}/dockerhub/elastic/elasticsearch:{{ es_image_tag }}
              container_name: elasticsearch-stack-elasticsearch
              env_file: elasticsearch.env
              environment:
                - node.name=elasticsearch-stack
                - discovery.type=single-node
                - xpack.security.enabled=true
                - xpack.security.http.ssl.enabled=false
                - xpack.security.transport.ssl.enabled=false
                - xpack.license.self_generated.type=basic
                - ES_JAVA_OPTS=-Xms{{ es_heap_gb }}g -Xmx{{ es_heap_gb }}g
              ports:
                - "9200:9200"
              volumes:
                - {{ es_data_dir }}:/usr/share/elasticsearch/data
              # No bootstrap.memory_lock/ulimits.memlock — confirmed live 2026-08-17
              # this LXC's nested Docker refuses an unlimited memlock rlimit
              # ("error setting rlimit type 8: operation not permitted"), and
              # deploy-graylog-stack.yml's own proven compose (same nested-LXC
              # constraint) never sets it either. Accepted tradeoff: JVM heap
              # can be swapped under memory pressure — reasonable at this
              # single-node home-lab scale, not a bare-metal deployment.
              restart: unless-stopped
              healthcheck:
                test: ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q 'missing authentication credentials'"]
                interval: 10s
                timeout: 10s
                retries: 60
                start_period: 60s

            # One-shot bootstrap: sets the built-in kibana_system user's password
            # via the ES security API, mirroring Elastic's own official
            # docker-compose.yml reference pattern (elastic/elasticsearch repo,
            # docs/reference/setup/install/docker/docker-compose.yml) rather than
            # inventing a bespoke bootstrap sequence.
            kibana-setup:
              image: {{ es_registry_host }}/dockerhub/elastic/elasticsearch:{{ es_image_tag }}
              container_name: elasticsearch-stack-kibana-setup
              env_file: elasticsearch.env
              depends_on:
                elasticsearch:
                  condition: service_healthy
              restart: "no"
              # A real script file (kibana-setup.sh, written by its own Ansible
              # task above), not an inline command string -- avoids Compose's
              # own ${VAR} pre-processing of command strings and YAML's
              # unquoted-colon-as-mapping-separator parsing, both hit and
              # fixed once each here already (2026-08-17). The script reads
              # ELASTIC_PASSWORD/KIBANA_SYSTEM_PASSWORD from env_file above at
              # real container runtime, not at Compose-parse time.
              volumes:
                - ./kibana-setup.sh:/kibana-setup.sh:ro
              command: ["bash", "/kibana-setup.sh"]

            kibana:
              image: {{ es_registry_host }}/dockerhub/elastic/kibana:{{ es_image_tag }}
              container_name: elasticsearch-stack-kibana
              depends_on:
                elasticsearch:
                  condition: service_healthy
                kibana-setup:
                  condition: service_completed_successfully
              environment:
                - SERVERNAME=kibana
                - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
                - ELASTICSEARCH_USERNAME=kibana_system
                - ELASTICSEARCH_PASSWORD={{ es_kibana_system_password }}
              ports:
                - "5601:5601"
              restart: unless-stopped
              healthcheck:
                test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:5601/ | grep -qE '200|302'"]
                interval: 10s
                timeout: 10s
                retries: 60
                start_period: 60s
      register: es_compose_file
      notify: Recreate Elasticsearch stack

    - name: Authenticate Docker to Harbor registry
      ansible.builtin.shell:
        cmd: >-
          printf '%s' "{{ lookup('env', 'HARBOR_ADMIN_PASSWORD') }}" |
          docker login "{{ es_registry_host }}"
          -u "{{ lookup('env', 'HARBOR_ADMIN') | default('admin') }}"
          --password-stdin
      no_log: true
      changed_when: false

    - name: Pre-pull Elasticsearch/Kibana runtime images from Harbor sequentially
      ansible.builtin.command:
        argv:
          - docker
          - pull
          - "{{ item }}"
      register: es_image_pull
      retries: 5
      delay: 10
      until: es_image_pull.rc == 0
      loop: "{{ es_runtime_images }}"

    - name: Bring up Elasticsearch + Kibana stack
      community.docker.docker_compose_v2:
        project_src: "{{ es_compose_dir }}"
        state: present
        pull: never
        remove_orphans: true
        recreate: "{{ 'always' if (es_env_file.changed or es_compose_file.changed or es_kibana_setup_script.changed) else 'auto' }}"

    - name: Wait for Elasticsearch HTTP port to accept connections
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 9200
        timeout: 180

    - name: Confirm Elasticsearch answers with security enforced
      ansible.builtin.uri:
        url: "http://127.0.0.1:9200/"
        method: GET
        status_code: [401]
      register: es_auth_check
      until: es_auth_check.status == 401
      retries: 30
      delay: 10

    - name: Confirm Elasticsearch cluster health with credentials
      ansible.builtin.uri:
        url: "http://127.0.0.1:9200/_cluster/health"
        method: GET
        url_username: elastic
        url_password: "{{ es_elastic_password }}"
        force_basic_auth: true
        return_content: true
      register: es_cluster_health
      until: es_cluster_health.json.status is defined and es_cluster_health.json.status in ['green', 'yellow']
      retries: 30
      delay: 10

    - name: Wait for Kibana HTTP port to accept connections
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 5601
        timeout: 180

    - name: Confirm Kibana reports available
      ansible.builtin.uri:
        url: "http://127.0.0.1:5601/api/status"
        method: GET
        url_username: elastic
        url_password: "{{ es_elastic_password }}"
        force_basic_auth: true
        return_content: true
        status_code: [200]
      register: es_kibana_status
      until: >-
        es_kibana_status.status == 200 and
        (es_kibana_status.json.status.overall.level | default('')) == 'available'
      retries: 30
      delay: 10

  handlers:
    - name: Recreate Elasticsearch stack
      community.docker.docker_compose_v2:
        project_src: "{{ es_compose_dir }}"
        state: present
        recreate: always
