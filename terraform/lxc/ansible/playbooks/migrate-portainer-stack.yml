---
# Migrates a portainer-agent host from legacy to infrastructure Portainer.
#
# The portainer-agent pairs with the first Portainer server that connects
# after it starts. Pairing state lives in the container writable layer and
# persists across `docker restart`. Legacy Portainer polls its endpoints
# continuously and reconnects within seconds of an agent restart.
#
# This playbook handles that race by:
#   1. Blocking legacy Portainer's IP at the agent host while the transition runs
#   2. Doing a full docker compose down/up (not just restart) to clear pairing state
#   3. Registering the fresh agent with infra Portainer before unblocking
#
# Usage (via provision.sh):
#   ANSIBLE_TAGS=pre_migrate  provision.sh --stack <name>   # step 1+2 only (debug)
#   provision.sh --stack <name>                              # full migration
#
# Usage (direct):
#   source .env
#   ansible-playbook -i terraform/lxc/stacks/<name>/inventory.yml \
#     terraform/lxc/ansible/playbooks/migrate-portainer-stack.yml \
#     -e "@/tmp/<name>.ansible-extra-vars.yml"
#
# Required extra vars (from stack.yaml via provision.sh render_stack_ansible_extra_vars):
#   stack_dir                    — absolute path to the stack directory (auto-injected)
#   portainer_stacks             — list of {name, compose_file} to deploy
#   portainer_migration_legacy_ip (optional, default 192.168.1.4)

- name: Block legacy Portainer and reset agent pairing state
  hosts: all
  become: true
  tags: [pre_migrate]
  vars:
    _legacy_ip: "{{ portainer_migration_legacy_ip | default('192.168.1.4') }}"
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Inspect existing portainer-agent container
      community.docker.docker_container_info:
        name: portainer-agent
      register: portainer_agent_container_info

    - name: Check for modern portainer-agent compose directory
      ansible.builtin.stat:
        path: /opt/portainer-agent/docker-compose.yml
      register: portainer_agent_compose_modern

    - name: Check for legacy portainer compose directory
      ansible.builtin.stat:
        path: /opt/portainer/docker-compose.yml
      register: portainer_agent_compose_legacy

    - name: Resolve agent compose project directory
      ansible.builtin.set_fact:
        portainer_agent_migration_compose_dir: >-
          {{
            '/opt/portainer-agent'
            if portainer_agent_compose_modern.stat.exists
            else (
              '/opt/portainer'
              if portainer_agent_compose_legacy.stat.exists
              else portainer_agent_compose_dir | default('/opt/portainer')
            )
          }}

    - name: Resolve current portainer-agent management mode
      ansible.builtin.set_fact:
        portainer_agent_migration_mode: >-
          {{
            'compose'
            if (
              portainer_agent_container_info.exists
              and (
                portainer_agent_container_info.container.Config.Labels['com.docker.compose.project.working_dir']
                | default('')
              ) | length > 0
            )
            else (
              'systemd'
              if (portainer_agent_service_unit | default('portainer-agent.service')) in ansible_facts.services
              else 'compose'
            )
          }}

    - name: Prefer compose project path from live container labels when available
      ansible.builtin.set_fact:
        portainer_agent_migration_compose_dir: >-
          {{
            portainer_agent_container_info.container.Config.Labels['com.docker.compose.project.working_dir']
          }}
      when:
        - portainer_agent_migration_mode == 'compose'
        - portainer_agent_container_info.exists
        - (portainer_agent_container_info.container.Config.Labels['com.docker.compose.project.working_dir'] | default('')) | length > 0

    - name: Block legacy Portainer from reconnecting during migration
      ansible.builtin.iptables:
        chain: INPUT
        source: "{{ _legacy_ip }}"
        protocol: tcp
        destination_port: "9001"
        jump: DROP

    - name: Bring compose project down (removes container and clears pairing state)
      community.docker.docker_compose_v2:
        project_src: "{{ portainer_agent_migration_compose_dir }}"
        state: absent
      when: portainer_agent_migration_mode == 'compose'

    - name: Stop portainer-agent systemd unit before container reset
      ansible.builtin.systemd:
        name: "{{ portainer_agent_service_unit | default('portainer-agent.service') }}"
        state: stopped
      when: portainer_agent_migration_mode == 'systemd'

    - name: Ensure any previous portainer-agent container is absent
      community.docker.docker_container:
        name: portainer-agent
        state: absent
      when: portainer_agent_migration_mode == 'systemd'

    - name: Bring portainer-agent back up (fresh, no pairing state)
      community.docker.docker_compose_v2:
        project_src: "{{ portainer_agent_migration_compose_dir }}"
        state: present
      when: portainer_agent_migration_mode == 'compose'

    - name: Start portainer-agent systemd unit after container reset
      ansible.builtin.systemd:
        name: "{{ portainer_agent_service_unit | default('portainer-agent.service') }}"
        state: started
        enabled: true
        daemon_reload: true
      when: portainer_agent_migration_mode == 'systemd'

    - name: Wait for agent to be reachable
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:9001/ping"
        method: GET
        status_code: 204
        validate_certs: false
      retries: 15
      delay: 2
      register: _agent_ping
      until: _agent_ping.status == 204

- name: Register endpoint and deploy stacks in infra Portainer
  hosts: all
  tags: [pre_migrate, post_migrate]
  roles:
    - portainer_api
    - portainer_stack

- name: Unblock legacy Portainer
  hosts: all
  become: true
  tags: [post_migrate]
  vars:
    _legacy_ip: "{{ portainer_migration_legacy_ip | default('192.168.1.4') }}"
  tasks:
    - name: Remove iptables block on legacy Portainer
      ansible.builtin.iptables:
        chain: INPUT
        source: "{{ _legacy_ip }}"
        protocol: tcp
        destination_port: "9001"
        jump: DROP
        state: absent
