---
# configure-openbao.yml -- OpenBao's own configuration as code: KV v2 mount,
# audit device, auth methods, policies, AppRole/JWT/OIDC roles.
# Idempotent: re-run after editing anything here or under
# terraform/lxc/stacks/openbao-stack/policies/.
#
# Runs on the workstation against the API with an EXPLICIT admin token that
# the operator exports in this shell only (design doc 13.1, 19):
#   export BAO_TOKEN=<root token or openbao-admin token>
#   TASK_APPROVAL=<task> ./with-secrets-prod ansible-playbook \
#     terraform/lxc/ansible/playbooks/configure-openbao.yml
#
# Deliberately does NOT create AppRole SecretIDs: those are generated by the
# operator by hand so they never pass through Ansible output or any state.
- name: Configure OpenBao
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    openbao_addr: "https://{{ lookup('env', 'LAB_IP_OPENBAO') | mandatory('LAB_IP_OPENBAO env var is required') }}:8200"
    openbao_token: "{{ lookup('env', 'BAO_TOKEN') | mandatory('BAO_TOKEN (explicit admin token) is required') }}"
    openbao_ca: "{{ playbook_dir }}/../../../../certs/homelab-root.crt"
    openbao_ui_fqdn: "{{ lookup('env', 'LAB_FQDN_OPENBAO') | mandatory('LAB_FQDN_OPENBAO env var is required') }}"
    openbao_authentik_fqdn: "{{ lookup('env', 'LAB_FQDN_AUTHENTIK') | mandatory('LAB_FQDN_AUTHENTIK env var is required') }}"
    openbao_oidc_discovery_url: "https://{{ openbao_authentik_fqdn }}/application/o/edge-openbao-stack-openbao/"
    openbao_oidc_client_id: "{{ lookup('env', 'OPENBAO_OIDC_CLIENT_ID') | default('openbao', true) }}"
    openbao_oidc_client_secret: "{{ lookup('env', 'OPENBAO_OIDC_CLIENT_SECRET') | mandatory('OPENBAO_OIDC_CLIENT_SECRET env var is not set') }}"
    openbao_policy_dir: "{{ playbook_dir }}/../../stacks/openbao-stack/policies"
    openbao_static_policies:
      - openbao-admin
      - deploy-common
      - snapshot
      - ci-netbox-populate
      - breakglass
    # terraform/PRODUCTION_NODES is the single source of truth for production
    # nodes (CLAUDE.md); one deploy-<node> AppRole is generated per line.
    openbao_production_nodes: >-
      {{ lookup('file', playbook_dir ~ '/../../../PRODUCTION_NODES').splitlines()
         | map('trim') | reject('match', '^(#|$)') | list }}
    openbao_dev_hosts:
      - pve-test-vm
      - pve-test
    openbao_dev_host_policies: "{{ openbao_dev_hosts | map('regex_replace', '^', 'deploy-host-') | list }}"
    openbao_workstation_cidrs:
      - 192.168.1.0/24
    openbao_lxc_cidr: 192.168.20.16/32
    openbao_github_repo: stevedwray/proxmox-homelab
    openbao_deploy_role_params:
      token_ttl: 5m
      token_max_ttl: 15m
      token_num_uses: 0
      secret_id_ttl: 0
      secret_id_num_uses: 0
      secret_id_bound_cidrs: "{{ openbao_workstation_cidrs }}"
      token_bound_cidrs: "{{ openbao_workstation_cidrs }}"

  tasks:
    - name: Check OpenBao is initialized and unsealed
      ansible.builtin.uri:
        url: "{{ openbao_addr }}/v1/sys/health"
        ca_path: "{{ openbao_ca }}"
        status_code: 200
      changed_when: false

    # ---- Secrets engine + audit -------------------------------------------
    - name: Read mounted secrets engines
      ansible.builtin.uri:
        url: "{{ openbao_addr }}/v1/sys/mounts"
        ca_path: "{{ openbao_ca }}"
        headers: { X-Vault-Token: "{{ openbao_token }}" }
      register: openbao_mounts
      changed_when: false
      no_log: true

    - name: Mount KV v2 at kv/
      ansible.builtin.uri:
        url: "{{ openbao_addr }}/v1/sys/mounts/kv"
        method: POST
        ca_path: "{{ openbao_ca }}"
        headers: { X-Vault-Token: "{{ openbao_token }}" }
        body_format: json
        body: { type: kv, options: { version: "2" }, description: "Homelab secrets (design doc 10)" }
        status_code: [200, 204]
      when: "'kv/' not in openbao_mounts.json.data"
      changed_when: true
      no_log: true

    - name: Set KV v2 version history to 20 per entry
      ansible.builtin.uri:
        url: "{{ openbao_addr }}/v1/kv/config"
        method: POST
        ca_path: "{{ openbao_ca }}"
        headers: { X-Vault-Token: "{{ openbao_token }}" }
        body_format: json
        body: { max_versions: 20, cas_required: false }
        status_code: [200, 204]
      changed_when: false
      no_log: true

    - name: Read audit devices
      ansible.builtin.uri:
        url: "{{ openbao_addr }}/v1/sys/audit"
        ca_path: "{{ openbao_ca }}"
        headers: { X-Vault-Token: "{{ openbao_token }}" }
      register: openbao_audit
      changed_when: false
      no_log: true

    # The audit device itself is declared in openbao.hcl (deploy-openbao.yml):
    # OpenBao rejects API-created audit devices by default
    # (unsafe_allow_api_audit_creation = false). This only verifies it exists.
    - name: Assert the declarative file audit device is enabled
      ansible.builtin.assert:
        that:
          - "'file/' in openbao_audit.json.data"
        fail_msg: >-
          No file/ audit device. Re-run provision.sh --stack openbao-stack so
          openbao.hcl carries the audit "file" "file" block, then re-run this.

    # ---- Auth methods -----------------------------------------------------
    - name: Read enabled auth methods
      ansible.builtin.uri:
        url: "{{ openbao_addr }}/v1/sys/auth"
        ca_path: "{{ openbao_ca }}"
        headers: { X-Vault-Token: "{{ openbao_token }}" }
      register: openbao_auth
      changed_when: false
      no_log: true

    - name: Enable auth methods
      ansible.builtin.uri:
        url: "{{ openbao_addr }}/v1/sys/auth/{{ item.path }}"
        method: POST
        ca_path: "{{ openbao_ca }}"
        headers: { X-Vault-Token: "{{ openbao_token }}" }
        body_format: json
        body: { type: "{{ item.type }}", description: "{{ item.description }}" }
        status_code: [200, 204]
      loop:
        - { path: approle, type: approle, description: "Workstation deploy identities + snapshot job" }
        - { path: jwt-github, type: jwt, description: "GitHub Actions OIDC tokens (CI)" }
        - { path: oidc, type: oidc, description: "Authentik OIDC (humans: UI + writes)" }
      when: (item.path ~ '/') not in openbao_auth.json.data
      changed_when: true
      no_log: true

    - name: Show the OIDC method as a tab on the UI login page
      ansible.builtin.uri:
        url: "{{ openbao_addr }}/v1/sys/auth/oidc/tune"
        method: POST
        ca_path: "{{ openbao_ca }}"
        headers: { X-Vault-Token: "{{ openbao_token }}" }
        body_format: json
        body: { listing_visibility: unauth, description: "Authentik OIDC (humans: UI + writes)" }
        status_code: [200, 204]
      changed_when: false
      no_log: true

    # ---- Policies ---------------------------------------------------------
    - name: Write static policies from policies/*.hcl
      ansible.builtin.uri:
        url: "{{ openbao_addr }}/v1/sys/policies/acl/{{ item }}"
        method: PUT
        ca_path: "{{ openbao_ca }}"
        headers: { X-Vault-Token: "{{ openbao_token }}" }
        body_format: json
        body: { policy: "{{ lookup('file', openbao_policy_dir ~ '/' ~ item ~ '.hcl') }}" }
        status_code: [200, 204]
      loop: "{{ openbao_static_policies }}"
      changed_when: false
      no_log: true

    - name: Write one read-only host policy per node
      ansible.builtin.uri:
        url: "{{ openbao_addr }}/v1/sys/policies/acl/deploy-host-{{ item }}"
        method: PUT
        ca_path: "{{ openbao_ca }}"
        headers: { X-Vault-Token: "{{ openbao_token }}" }
        body_format: json
        body:
          policy: |
            # Generated by configure-openbao.yml -- read-only access to one node's host scope.
            path "kv/data/hosts/{{ item }}" {
              capabilities = ["read"]
            }
        status_code: [200, 204]
      loop: "{{ openbao_production_nodes + openbao_dev_hosts }}"
      changed_when: false
      no_log: true

    # ---- AppRoles ---------------------------------------------------------
    - name: Write deploy-dev AppRole (non-production environments)
      ansible.builtin.uri:
        url: "{{ openbao_addr }}/v1/auth/approle/role/deploy-dev"
        method: POST
        ca_path: "{{ openbao_ca }}"
        headers: { X-Vault-Token: "{{ openbao_token }}" }
        body_format: json
        body: "{{ openbao_deploy_role_params | combine({'token_policies': ['deploy-common'] + openbao_dev_host_policies}) }}"
        status_code: [200, 204]
      changed_when: false
      no_log: true

    - name: Write one deploy-<node> AppRole per production node
      ansible.builtin.uri:
        url: "{{ openbao_addr }}/v1/auth/approle/role/deploy-{{ item }}"
        method: POST
        ca_path: "{{ openbao_ca }}"
        headers: { X-Vault-Token: "{{ openbao_token }}" }
        body_format: json
        body: "{{ openbao_deploy_role_params | combine({'token_policies': ['deploy-common', 'deploy-host-' ~ item]}) }}"
        status_code: [200, 204]
      loop: "{{ openbao_production_nodes }}"
      changed_when: false
      no_log: true

    - name: Write snapshot AppRole (usable only from the OpenBao LXC itself)
      ansible.builtin.uri:
        url: "{{ openbao_addr }}/v1/auth/approle/role/snapshot"
        method: POST
        ca_path: "{{ openbao_ca }}"
        headers: { X-Vault-Token: "{{ openbao_token }}" }
        body_format: json
        body:
          token_policies: [snapshot]
          token_ttl: 5m
          token_max_ttl: 10m
          secret_id_ttl: 0
          secret_id_bound_cidrs: ["{{ openbao_lxc_cidr }}"]
          token_bound_cidrs: ["{{ openbao_lxc_cidr }}"]
        status_code: [200, 204]
      changed_when: false
      no_log: true

    - name: Write breakglass AppRole (generate-root-token only; design doc 19)
      ansible.builtin.uri:
        url: "{{ openbao_addr }}/v1/auth/approle/role/breakglass"
        method: POST
        ca_path: "{{ openbao_ca }}"
        headers: { X-Vault-Token: "{{ openbao_token }}" }
        body_format: json
        body:
          token_policies: [breakglass]
          token_ttl: 15m
          token_max_ttl: 15m
          secret_id_ttl: 0
          secret_id_bound_cidrs: "{{ openbao_workstation_cidrs }}"
          token_bound_cidrs: "{{ openbao_workstation_cidrs }}"
        status_code: [200, 204]
      changed_when: false
      no_log: true

    # ---- JWT (GitHub Actions) ---------------------------------------------
    - name: Configure jwt-github against GitHub's Actions OIDC issuer
      ansible.builtin.uri:
        url: "{{ openbao_addr }}/v1/auth/jwt-github/config"
        method: POST
        ca_path: "{{ openbao_ca }}"
        headers: { X-Vault-Token: "{{ openbao_token }}" }
        body_format: json
        body:
          oidc_discovery_url: https://token.actions.githubusercontent.com
          bound_issuer: https://token.actions.githubusercontent.com
        status_code: [200, 204]
      changed_when: false
      no_log: true

    - name: Write ci-netbox-populate JWT role (main-branch netbox-populate workflow only)
      ansible.builtin.uri:
        url: "{{ openbao_addr }}/v1/auth/jwt-github/role/ci-netbox-populate"
        method: POST
        ca_path: "{{ openbao_ca }}"
        headers: { X-Vault-Token: "{{ openbao_token }}" }
        body_format: json
        body:
          role_type: jwt
          user_claim: repository
          bound_audiences: [openbao]
          bound_claims_type: string
          bound_claims:
            repository: "{{ openbao_github_repo }}"
            ref: refs/heads/main
            job_workflow_ref: "{{ openbao_github_repo }}/.github/workflows/netbox-populate.yml@refs/heads/main"
          token_policies: [ci-netbox-populate]
          token_ttl: 10m
          token_max_ttl: 15m
        status_code: [200, 204]
      changed_when: false
      no_log: true

    # ---- OIDC (Authentik) -------------------------------------------------
    - name: Configure oidc against Authentik (public issuer URL, same as browsers)
      ansible.builtin.uri:
        url: "{{ openbao_addr }}/v1/auth/oidc/config"
        method: POST
        ca_path: "{{ openbao_ca }}"
        headers: { X-Vault-Token: "{{ openbao_token }}" }
        body_format: json
        body:
          oidc_discovery_url: "{{ openbao_oidc_discovery_url }}"
          oidc_client_id: "{{ openbao_oidc_client_id }}"
          oidc_client_secret: "{{ openbao_oidc_client_secret }}"
          default_role: homelab-admin
        status_code: [200, 204]
      changed_when: false
      no_log: true

    - name: Write homelab-admin OIDC role (Authentik group homelab-admins)
      ansible.builtin.uri:
        url: "{{ openbao_addr }}/v1/auth/oidc/role/homelab-admin"
        method: POST
        ca_path: "{{ openbao_ca }}"
        headers: { X-Vault-Token: "{{ openbao_token }}" }
        body_format: json
        body:
          role_type: oidc
          user_claim: preferred_username
          groups_claim: groups
          bound_claims:
            groups: [homelab-admins]
          oidc_scopes: [profile, email]
          allowed_redirect_uris:
            - "https://{{ openbao_ui_fqdn }}/ui/vault/auth/oidc/oidc/callback"
            - http://localhost:8250/oidc/callback
          token_policies: [openbao-admin]
          token_ttl: 1h
          token_max_ttl: 1h
        status_code: [200, 204]
      changed_when: false
      no_log: true

    - name: Report configured identities
      ansible.builtin.debug:
        msg: >-
          Configured AppRoles deploy-dev, {{ openbao_production_nodes | map('regex_replace', '^', 'deploy-') | join(', ') }},
          snapshot, breakglass; JWT role ci-netbox-populate; OIDC role homelab-admin.
          SecretIDs are NOT created here -- see plan operator block B.
