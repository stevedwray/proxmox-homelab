---
- name: Test docker_socket_proxy role (syntax check only)
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    # This playbook is intentionally safe and source-only by default.
    # Do not run this against a live system unless you intend to deploy.
    enable_docker_socket_proxy: false
    docker_socket_proxy_bind_addr: 127.0.0.1
    docker_socket_proxy_listen_port: 2375
    docker_socket_proxy_project_dir: /tmp/docker-socket-proxy-test

  roles:
    # Only include the role under test. Do not pull in runtime-changing roles
    # such as `docker_base` which may attempt to start services on localhost.
    - role: docker_socket_proxy
