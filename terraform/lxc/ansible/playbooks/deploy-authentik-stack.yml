---
# Authentik stack lifecycle:
# Docker base -> deploy local compose -> validate health

- name: Configure Docker base
  hosts: all
  become: true
  gather_facts: true
  roles:
    - lxc_base
    - docker_base
    - role: docker_socket_proxy
      when: enable_docker_socket_proxy | default(false) | bool

  tasks:
    - name: Mask portainer-agent service (platform tier — no agent on this host)
      ansible.builtin.systemd:
        name: portainer-agent.service
        masked: true
        enabled: false
      failed_when: false

- name: Deploy Authentik compose stack
  hosts: all
  become: true
  gather_facts: false

  vars:
    authentik_compose_dir: /opt/authentik-stack
    authentik_compose_path: /opt/authentik-stack/docker-compose.yml
    authentik_compose_content: "{{ lookup('file', '../../stacks/authentik-stack/docker-compose.yml') }}"
    authentik_step_cli_version: "0.30.2"
    authentik_step_cli_install_dir: /tmp/step-cli-install
    authentik_step_cli_cert_dir: "{{ authentik_compose_dir }}/certs/direct"
    authentik_step_cli_root_cert: /usr/local/share/ca-certificates/homelab-root.crt
    authentik_step_cli_cert_file: "{{ authentik_step_cli_cert_dir }}/tls.crt"
    authentik_step_cli_key_file: "{{ authentik_step_cli_cert_dir }}/tls.key"
    authentik_step_cli_password_file: "{{ authentik_compose_dir }}/.step/provisioner-password.txt"
    authentik_step_ca_url: "https://{{ lookup('env', 'LAB_IP_STEP_CA') | mandatory('LAB_IP_STEP_CA env var is required') }}"
    authentik_step_ca_provisioner: "{{ lookup('env', 'STEP_CA_PROVISIONER_NAME') | default('homelab-admin', true) }}"
    authentik_step_ca_provisioner_password: "{{ lookup('env', 'STEP_CA_PROVISIONER_PASSWORD') | mandatory('STEP_CA_PROVISIONER_PASSWORD env var is not set') }}"
    authentik_registry_host: "{{ lookup('env', 'LAB_FQDN_HARBOR') if lookup('env', 'TF_VAR_proxmox_node', default='') == 'pve' else registry_host | default(lookup('env', 'LAB_IP_HARBOR'), true) | mandatory('registry_host var or LAB_IP_HARBOR env var is required') }}"
    authentik_insecure_host: "{{ lookup('env', 'LAB_IP_HARBOR') | mandatory('LAB_IP_HARBOR env var is required') }}"
    authentik_image_version: "2024.12.3"
    authentik_nginx_version: "1.27-alpine"
    authentik_secret_key: "{{ lookup('env', 'AUTHENTIK_SECRET_KEY') | mandatory('AUTHENTIK_SECRET_KEY env var is not set') }}"
    authentik_postgres_password: "{{ lookup('env', 'AUTHENTIK_POSTGRES_PASSWORD') | mandatory('AUTHENTIK_POSTGRES_PASSWORD env var is not set') }}"
    authentik_superuser_password: "{{ lookup('env', 'AUTHENTIK_SUPERUSER_PASSWORD') | mandatory('AUTHENTIK_SUPERUSER_PASSWORD env var is not set') }}"
    authentik_superuser_api_token: "{{ lookup('env', 'AUTHENTIK_SUPERUSER_API_TOKEN') | mandatory('AUTHENTIK_SUPERUSER_API_TOKEN env var is not set') }}"
    authentik_ldap_service_password: "{{ lookup('env', 'AUTHENTIK_LDAP_SERVICE_PASSWORD') | default(authentik_superuser_password, true) }}"
    lab_admin_username: "{{ lookup('env', 'LAB_ADMIN_USERNAME') | default('steve', true) }}"
    lab_domain: "{{ lookup('env', 'LAB_DOMAIN') | default('lab.gibbsgreatly.xyz', true) }}"
    lab_admin_email: "{{ lookup('env', 'LAB_ADMIN_EMAIL') | default(lab_admin_username ~ '@' ~ lab_domain, true) }}"
    authentik_lab_ip_dns: "{{ lookup('env', 'LAB_IP_DNS') | default(dns_server, true) | mandatory('LAB_IP_DNS env var or dns_server inventory var is required') }}"
    authentik_steve_password: "{{ lookup('env', 'AUTHENTIK_STEVE_PASSWORD') | mandatory('AUTHENTIK_STEVE_PASSWORD env var is not set') }}"
    authentik_internal_tls_fqdn: "{{ lookup('env', 'LAB_FQDN_AUTHENTIK_INTERNAL') | default('authentik-int.' ~ lab_domain, true) }}"

  tasks:
    - name: Create Authentik compose directory
      ansible.builtin.file:
        path: "{{ authentik_compose_dir }}"
        state: directory
        mode: "0750"

    - name: Ensure .ldap-outpost.env placeholder exists before any compose command
      ansible.builtin.file:
        path: "{{ authentik_compose_dir }}/.ldap-outpost.env"
        state: touch
        mode: "0600"
        modification_time: preserve
        access_time: preserve
      changed_when: false

    - name: Write docker-compose.yml
      ansible.builtin.copy:
        dest: "{{ authentik_compose_path }}"
        mode: "0640"
        content: "{{ authentik_compose_content }}"

    - name: Create direct TLS asset directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ authentik_compose_dir }}/nginx", mode: "0750" }
        - { path: "{{ authentik_compose_dir }}/certs", mode: "0750" }
        - { path: "{{ authentik_step_cli_cert_dir }}", mode: "0750" }
        - { path: "{{ authentik_compose_dir }}/.step", mode: "0700" }

    - name: Check whether step CLI is installed
      ansible.builtin.stat:
        path: /usr/local/bin/step
      register: authentik_step_cli_stat

    - name: Ensure DNS is configured for external downloads
      ansible.builtin.shell: |
        if ! nslookup github.com 1>/dev/null 2>&1; then
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' > /etc/resolv.conf
        fi
      args:
        executable: /bin/bash
      when:
        - not authentik_step_cli_stat.stat.exists
        - not ansible_check_mode

    - name: Download step CLI release
      ansible.builtin.get_url:
        url: "https://github.com/smallstep/cli/releases/download/v{{ authentik_step_cli_version }}/step_linux_{{ authentik_step_cli_version }}_amd64.tar.gz"
        dest: "/tmp/step_linux_{{ authentik_step_cli_version }}_amd64.tar.gz"
        mode: "0644"
      when:
        - not authentik_step_cli_stat.stat.exists
        - not ansible_check_mode

    - name: Create step CLI temporary extraction directory
      ansible.builtin.file:
        path: "{{ authentik_step_cli_install_dir }}"
        state: directory
        mode: "0755"
      when:
        - not authentik_step_cli_stat.stat.exists
        - not ansible_check_mode

    - name: Extract step CLI archive
      ansible.builtin.unarchive:
        src: "/tmp/step_linux_{{ authentik_step_cli_version }}_amd64.tar.gz"
        dest: "{{ authentik_step_cli_install_dir }}"
        remote_src: true
      when:
        - not authentik_step_cli_stat.stat.exists
        - not ansible_check_mode

    - name: Locate extracted step binary
      ansible.builtin.find:
        paths: "{{ authentik_step_cli_install_dir }}"
        patterns: step
        file_type: file
      register: authentik_step_cli_find
      when:
        - not authentik_step_cli_stat.stat.exists
        - not ansible_check_mode

    - name: Install step CLI binary from nested archive path
      ansible.builtin.copy:
        src: "{{ authentik_step_cli_install_dir }}/step_{{ authentik_step_cli_version }}/bin/step"
        dest: /usr/local/bin/step
        mode: "0755"
        remote_src: true
      when:
        - not authentik_step_cli_stat.stat.exists
        - not ansible_check_mode

    - name: Clean up temporary step CLI extraction directory
      ansible.builtin.file:
        path: "{{ authentik_step_cli_install_dir }}"
        state: absent
      when:
        - not ansible_check_mode

    - name: Clean up step CLI archive
      ansible.builtin.file:
        path: "/tmp/step_linux_{{ authentik_step_cli_version }}_amd64.tar.gz"
        state: absent
      when:
        - not ansible_check_mode

    - name: Verify step CLI is installed and executable
      ansible.builtin.command:
        cmd: /usr/local/bin/step version
      register: authentik_step_cli_version_check
      changed_when: false

    - name: Check if step-ca is reachable before Authentik direct TLS cert issuance
      ansible.builtin.wait_for:
        host: "{{ lookup('env', 'LAB_IP_STEP_CA') }}"
        port: 443
        timeout: 5
      register: authentik_step_ca_reachable
      ignore_errors: true
      when: not ansible_check_mode

    - name: Warn when step-ca is not yet reachable for Authentik direct TLS
      ansible.builtin.debug:
        msg: >-
          step-ca at {{ lookup('env', 'LAB_IP_STEP_CA') }}:443 is not reachable.
          Skipping Authentik direct TLS cert issuance — re-run provision after step-ca is deployed.
      when:
        - not ansible_check_mode
        - authentik_step_ca_reachable.failed | default(true)

    - name: Authentik direct TLS cert issuance
      when:
        - not ansible_check_mode
        - not (authentik_step_ca_reachable.failed | default(true))
      block:
        - name: Write step-ca provisioner password file for Authentik direct cert issuance
          ansible.builtin.copy:
            dest: "{{ authentik_step_cli_password_file }}"
            mode: "0600"
            content: "{{ authentik_step_ca_provisioner_password }}\n"
          no_log: true

        - name: Ensure step-ca root cert is present before issuing Authentik direct cert
          ansible.builtin.stat:
            path: "{{ authentik_step_cli_root_cert }}"
          register: authentik_step_cli_root_cert_stat

        - name: Fail when homelab root cert is missing on host
          ansible.builtin.fail:
            msg: "Required trust anchor {{ authentik_step_cli_root_cert }} is missing on host. Ensure lxc_base/trust-homelab-ca has run before Authentik direct TLS issuance."
          when: not authentik_step_cli_root_cert_stat.stat.exists

        - name: Issue or renew Authentik direct TLS certificate from step-ca
          ansible.builtin.shell: |
            set -euo pipefail

            issue_needed=0

            if [[ ! -s "{{ authentik_step_cli_cert_file }}" || ! -s "{{ authentik_step_cli_key_file }}" ]]; then
              issue_needed=1
            elif ! openssl x509 -checkend 2592000 -noout -in "{{ authentik_step_cli_cert_file }}" >/dev/null 2>&1; then
              issue_needed=1
            fi

            if [[ "${issue_needed}" -eq 1 ]]; then
              /usr/local/bin/step ca certificate "{{ authentik_internal_tls_fqdn }}" "{{ authentik_step_cli_cert_file }}" "{{ authentik_step_cli_key_file }}" \
                --san "{{ authentik_internal_tls_fqdn }}" \
                --ca-url "{{ authentik_step_ca_url }}" \
                --root "{{ authentik_step_cli_root_cert }}" \
                --provisioner "{{ authentik_step_ca_provisioner }}" \
                --provisioner-password-file "{{ authentik_step_cli_password_file }}" \
                --not-after 720h \
                --force >/dev/null
              echo "issued"
            fi
          args:
            executable: /bin/bash
          register: authentik_step_cert_issue
          changed_when: "'issued' in authentik_step_cert_issue.stdout"
          no_log: true

        - name: Ensure Authentik direct TLS private key permissions are strict
          ansible.builtin.file:
            path: "{{ authentik_step_cli_key_file }}"
            owner: root
            group: root
            mode: "0600"

    - name: Write Authentik direct TLS nginx config (TLS — step-ca cert issued)
      ansible.builtin.copy:
        dest: "{{ authentik_compose_dir }}/nginx/direct-tls.conf"
        mode: "0640"
        content: |
          server {
            listen 9443 ssl;
            server_name {{ authentik_internal_tls_fqdn }};

            ssl_certificate /certs/direct/tls.crt;
            ssl_certificate_key /certs/direct/tls.key;

            location / {
              proxy_pass http://server:9000;  # nosonar: ansible:S5332 — Docker-internal hostname, never reaches SDN
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto https;
              proxy_read_timeout 300;
            }
          }
      when: not (authentik_step_ca_reachable.failed | default(true))

    - name: Write Authentik nginx fallback config (HTTP — step-ca not yet available)
      ansible.builtin.copy:
        dest: "{{ authentik_compose_dir }}/nginx/direct-tls.conf"
        mode: "0640"
        content: |
          server {
            listen 9443;
            server_name {{ authentik_internal_tls_fqdn }};

            location / {
              proxy_pass http://server:9000;  # nosonar: ansible:S5332 — Docker-internal hostname, never reaches SDN
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_read_timeout 300;
            }
          }
      when: authentik_step_ca_reachable.failed | default(true)

    - name: Write Authentik environment file
      ansible.builtin.copy:
        dest: "{{ authentik_compose_dir }}/.env"
        mode: "0600"
        content: |
          AUTHENTIK_SECRET_KEY={{ authentik_secret_key }}
          AUTHENTIK_POSTGRES_PASSWORD={{ authentik_postgres_password }}
          AUTHENTIK_SUPERUSER_PASSWORD={{ authentik_superuser_password }}
          AUTHENTIK_BOOTSTRAP_PASSWORD={{ authentik_superuser_password }}
          AUTHENTIK_BOOTSTRAP_TOKEN={{ authentik_superuser_api_token }}
          AUTHENTIK_IMAGE_VERSION={{ authentik_image_version }}
          REGISTRY_HOST={{ authentik_registry_host }}
      no_log: true

    - name: Restart direct_tls nginx container to load renewed cert
      ansible.builtin.command:
        cmd: docker compose -f "{{ authentik_compose_path }}" restart direct_tls
        chdir: "{{ authentik_compose_dir }}"
      when:
        - not ansible_check_mode
        - not (authentik_step_ca_reachable.failed | default(true))
        - authentik_step_cert_issue is defined
        - authentik_step_cert_issue.changed

    - name: Trust Harbor HTTP registry in Docker daemon
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {
            "insecure-registries": ["{{ authentik_insecure_host }}"],
            "dns": ["{{ authentik_lab_ip_dns }}"],
            "log-driver": "syslog",
            "log-opts": {
              "syslog-address": "tcp://127.0.0.1:10514",
              "syslog-format": "rfc5424",
              "tag": "{% raw %}docker-{{.Name}}{% endraw %}"
            },
            "storage-driver": "overlay2"
          }
      register: authentik_docker_daemon_config

    - name: Restart Docker to apply registry trust
      ansible.builtin.systemd:
        name: docker
        state: restarted
      when:
        - not ansible_check_mode
        - authentik_docker_daemon_config.changed

    - name: Validate Authentik compose
      ansible.builtin.command:
        cmd: docker compose -f "{{ authentik_compose_path }}" config -q
        chdir: "{{ authentik_compose_dir }}"
      register: authentik_compose_validate
      changed_when: false
      when: not ansible_check_mode

    - name: Fail if compose invalid
      ansible.builtin.fail:
        msg: "docker compose config failed: {{ authentik_compose_validate.stderr | default(authentik_compose_validate.stdout) }}"
      when:
        - not ansible_check_mode
        - authentik_compose_validate.rc != 0

    - name: Ensure temporary public DNS fallback so Docker can pull images
      ansible.builtin.shell: |
        if ! getent hosts registry-1.docker.io >/dev/null 2>&1; then
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' > /etc/resolv.conf
        fi
      args:
        executable: /bin/bash
      become: true
      when: not ansible_check_mode

    - name: Check if Harbor registry is reachable
      ansible.builtin.command:
        cmd: "nc -z -w 5 {{ authentik_insecure_host }} 80"
      register: authentik_harbor_reachable
      failed_when: false
      changed_when: false
      when: not ansible_check_mode

    - name: Pre-pull Authentik images from public registries (Harbor not yet available)
      when:
        - not ansible_check_mode
        - authentik_harbor_reachable.rc is not defined or authentik_harbor_reachable.rc != 0
      block:
        - name: Pull goauthentik server image from ghcr.io
          ansible.builtin.command:
            cmd: "docker pull ghcr.io/goauthentik/server:{{ authentik_image_version }}"

        - name: Tag goauthentik server with Harbor proxy cache path
          ansible.builtin.command:
            cmd: "docker tag ghcr.io/goauthentik/server:{{ authentik_image_version }} {{ authentik_registry_host }}/ghcr/goauthentik/server:{{ authentik_image_version }}"

        - name: Pull nginx image from Docker Hub
          ansible.builtin.command:
            cmd: "docker pull nginx:{{ authentik_nginx_version }}"

        - name: Tag nginx with Harbor proxy cache path
          ansible.builtin.command:
            cmd: "docker tag nginx:{{ authentik_nginx_version }} {{ authentik_registry_host }}/dockerhub/library/nginx:{{ authentik_nginx_version }}"

        - name: Pull postgres image from Docker Hub
          ansible.builtin.command:
            cmd: "docker pull postgres:16-alpine"

        - name: Pull redis image from Docker Hub
          ansible.builtin.command:
            cmd: "docker pull redis:alpine"

        - name: Pull cadvisor image from gcr.io
          ansible.builtin.command:
            cmd: "docker pull gcr.io/cadvisor/cadvisor:v0.49.1"

        - name: Pull Authentik LDAP outpost image from ghcr.io
          ansible.builtin.command:
            cmd: "docker pull ghcr.io/goauthentik/ldap:{{ authentik_image_version }}"

        - name: Tag Authentik LDAP outpost image with Harbor proxy cache path
          ansible.builtin.command:
            cmd: "docker tag ghcr.io/goauthentik/ldap:{{ authentik_image_version }} {{ authentik_registry_host }}/ghcr/goauthentik/ldap:{{ authentik_image_version }}"

    - name: Check if Authentik LDAP image is available locally
      ansible.builtin.command:
        cmd: "docker image inspect {{ authentik_registry_host }}/ghcr/goauthentik/ldap:{{ authentik_image_version }}"
      register: authentik_ldap_image_check
      failed_when: false
      changed_when: false
      when: not ansible_check_mode

    - name: Pull and tag Authentik LDAP outpost image when not locally cached
      when:
        - not ansible_check_mode
        - authentik_ldap_image_check.rc != 0
      block:
        - name: Pull Authentik LDAP outpost image from ghcr.io
          ansible.builtin.command:
            cmd: "docker pull ghcr.io/goauthentik/ldap:{{ authentik_image_version }}"

        - name: Tag Authentik LDAP outpost image with Harbor proxy cache path
          ansible.builtin.command:
            cmd: "docker tag ghcr.io/goauthentik/ldap:{{ authentik_image_version }} {{ authentik_registry_host }}/ghcr/goauthentik/ldap:{{ authentik_image_version }}"

    - name: Authenticate Docker to Harbor registry (when Harbor is reachable)
      ansible.builtin.shell:
        cmd: >-
          printf '%s' "{{ lookup('env', 'HARBOR_ADMIN_PASSWORD') }}" |
          docker login "{{ authentik_registry_host }}"
          -u "{{ lookup('env', 'HARBOR_ADMIN') | default('admin') }}"
          --password-stdin
      no_log: true
      changed_when: false
      ignore_errors: true
      register: authentik_docker_login
      when:
        - not ansible_check_mode
        - authentik_harbor_reachable.rc is defined
        - authentik_harbor_reachable.rc == 0

    - name: Start Authentik via compose
      community.docker.docker_compose_v2:
        project_src: "{{ authentik_compose_dir }}"
        state: present
        pull: "{{ 'never' if (authentik_harbor_reachable.rc is not defined or authentik_harbor_reachable.rc != 0 or (authentik_docker_login is defined and authentik_docker_login.failed)) else 'policy' }}"
        recreate: "{{ 'always' if authentik_docker_daemon_config.changed else 'auto' }}"
        remove_orphans: true
      when: not ansible_check_mode

    - name: Restore host resolver to internal DNS after bootstrap fallback
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        mode: "0644"
        content: |
          nameserver {{ authentik_lab_ip_dns }}

    - name: Wait for Authentik live health endpoint
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/-/health/live/"
        method: GET
        status_code: [200, 204]
      register: authentik_live_health
      retries: 30
      delay: 10
      until: authentik_live_health.status in [200, 204]
      when: not ansible_check_mode

    - name: Wait for Authentik ready health endpoint
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/-/health/ready/"
        method: GET
        status_code: [200, 204]
      register: authentik_ready_health
      retries: 30
      delay: 10
      until: authentik_ready_health.status in [200, 204]
      when: not ansible_check_mode

    - name: Wait for Authentik direct TLS endpoint with verified cert chain
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --show-error
          - --fail
          - --cacert
          - "{{ authentik_step_cli_root_cert }}"
          - --resolve
          - "{{ authentik_internal_tls_fqdn }}:9443:{{ ansible_host }}"
          - "https://{{ authentik_internal_tls_fqdn }}:9443/-/health/live/"
      register: authentik_direct_tls_health
      changed_when: false
      retries: 30
      delay: 10
      until: authentik_direct_tls_health.rc == 0
      when: not ansible_check_mode


    - name: Confirm bootstrap credentials were injected
      ansible.builtin.debug:
        msg: >-
          Authentik is healthy at http://{{ ansible_host }}:9000/.
          AUTHENTIK_BOOTSTRAP_PASSWORD and AUTHENTIK_BOOTSTRAP_TOKEN were
          injected from SOPS via .env. The akadmin account and API token are
          created automatically on first boot — no manual setup wizard required.
      when: not ansible_check_mode


    - name: Confirm direct TLS is available
      ansible.builtin.debug:
        msg: >-
          Authentik is healthy at http://{{ ansible_host }}:9000/.
          Internal direct TLS is available at https://{{ authentik_internal_tls_fqdn }}:9443/.
          AUTHENTIK_BOOTSTRAP_PASSWORD and AUTHENTIK_BOOTSTRAP_TOKEN were
          injected from SOPS via .env. The akadmin account and API token are
          created automatically on first boot — no manual setup wizard required.

    - name: Check if lab admin user exists in Authentik
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/core/users/?username={{ lab_admin_username }}"
        method: GET
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
          Content-Type: "application/json"
        status_code: [200, 403]
      register: authentik_steve_check
      retries: 12
      delay: 10
      until: authentik_steve_check.status == 200
      no_log: true
      when: not ansible_check_mode

    - name: Create lab admin user in Authentik
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/core/users/"
        method: POST
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          username: "{{ lab_admin_username }}"
          name: "Steve"
          email: "{{ lab_admin_email }}"
          is_active: true
          groups: []
        status_code: [201]
      register: authentik_steve_create
      when:
        - not ansible_check_mode
        - (authentik_steve_check.json.pagination.count | int) == 0
      no_log: true

    - name: Resolve lab admin user PK
      ansible.builtin.set_fact:
        steve_pk: >-
          {{
            (authentik_steve_check.json.results[0].pk
            if (authentik_steve_check.json.pagination.count | int) > 0
            else authentik_steve_create.json.pk) | int
          }}
      no_log: true
      when: not ansible_check_mode

    - name: Set lab admin user password in Authentik
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/core/users/{{ steve_pk }}/set_password/"
        method: POST
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          password: "{{ authentik_steve_password }}"
        status_code: [204]
      no_log: true
      when: not ansible_check_mode

    - name: Confirm lab admin user provisioned
      ansible.builtin.debug:
        msg: "Authentik user '{{ lab_admin_username }}' is present and password is set (pk={{ steve_pk }})."
      when: not ansible_check_mode

    - name: Ensure homelab-admins group exists in Authentik
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/core/groups/?name=homelab-admins"
        method: GET
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
          Content-Type: "application/json"
        status_code: [200]
      register: authentik_homelab_admins_check
      no_log: true
      when: not ansible_check_mode

    - name: Create homelab-admins group when missing
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/core/groups/"
        method: POST
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          name: "homelab-admins"
          is_superuser: false
        status_code: [201]
      register: authentik_homelab_admins_create
      when:
        - not ansible_check_mode
        - (authentik_homelab_admins_check.json.pagination.count | int) == 0
      no_log: true

    - name: Resolve homelab-admins group PK
      ansible.builtin.set_fact:
        homelab_admins_pk: >-
          {{
            (authentik_homelab_admins_check.json.results[0].pk
            if (authentik_homelab_admins_check.json.pagination.count | int) > 0
            else authentik_homelab_admins_create.json.pk)
          }}
      no_log: true
      when: not ansible_check_mode

    - name: Add lab admin user to homelab-admins group
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/core/groups/{{ homelab_admins_pk }}/add_user/"
        method: POST
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          pk: "{{ steve_pk }}"
        status_code: [204]
      no_log: true
      when: not ansible_check_mode

    - name: Confirm homelab-admins group provisioned with lab admin user
      ansible.builtin.debug:
        msg: "Authentik group 'homelab-admins' is present (pk={{ homelab_admins_pk }}) and {{ lab_admin_username }} (pk={{ steve_pk }}) is a member."
      when: not ansible_check_mode

    # LDAP outpost — needed for Graylog LDAP auth service.
    # The ldap container in docker-compose reads AUTHENTIK_TOKEN from .ldap-outpost.env.
    # We create the provider + outpost idempotently and write the token before restarting the container.

    - name: Ensure .ldap-outpost.env placeholder exists before compose starts
      ansible.builtin.file:
        path: "{{ authentik_compose_dir }}/.ldap-outpost.env"
        state: touch
        mode: "0600"
        modification_time: preserve
        access_time: preserve
      changed_when: false

    - name: Resolve invalidation flow for LDAP provider
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/flows/instances/?slug=default-provider-invalidation-flow"  # nosonar: ansible:S5332 — internal Authentik API on private SDN
        method: GET
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
        status_code: [200]
      register: authentik_ldap_invalidation_flow
      no_log: true
      when: not ansible_check_mode

    - name: Resolve default password stage for Graylog LDAP flow
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/stages/password/?name=default-authentication-password"  # nosonar: ansible:S5332 — internal Authentik API on private SDN
        method: GET
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
        status_code: [200]
      register: authentik_default_password_stage
      no_log: true
      when: not ansible_check_mode

    - name: Resolve default login stage for Graylog LDAP flow
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/stages/user_login/?name=default-authentication-login"  # nosonar: ansible:S5332 — internal Authentik API on private SDN
        method: GET
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
        status_code: [200]
      register: authentik_default_login_stage
      no_log: true
      when: not ansible_check_mode

    - name: Resolve stage PKs for Graylog LDAP flow
      ansible.builtin.set_fact:
        authentik_default_password_stage_pk: "{{ authentik_default_password_stage.json.results[0].pk }}"
        authentik_default_login_stage_pk: "{{ authentik_default_login_stage.json.results[0].pk }}"
      when: not ansible_check_mode

    # In Authentik 2026.x, the LDAP outpost calls the authorization flow directly
    # (not a separate authentication flow). The authorization flow must have
    # authentication: none and contain identification + password + user_login stages.
    - name: Check if ldap-authz-flow exists
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/flows/instances/?slug=ldap-authz-flow"  # nosonar: ansible:S5332 — internal Authentik API on private SDN
        method: GET
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
        status_code: [200]
      register: authentik_ldap_authz_flow_check
      no_log: true
      when: not ansible_check_mode

    - name: Create ldap-authz-flow authorization flow
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/flows/instances/"  # nosonar: ansible:S5332 — internal Authentik API on private SDN
        method: POST
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          name: "ldap-authz-flow"
          slug: "ldap-authz-flow"
          title: "LDAP Authorization Flow"
          designation: "authorization"
          authentication: "none"
          policy_engine_mode: "any"
          compatibility_mode: false
          layout: "stacked"
          denied_action: "message_continue"
        status_code: [201]
      register: authentik_ldap_authz_flow_create
      when:
        - not ansible_check_mode
        - (authentik_ldap_authz_flow_check.json.pagination.count | int) == 0
      no_log: true

    - name: Resolve ldap-authz-flow PK
      ansible.builtin.set_fact:
        authentik_ldap_authz_flow_pk: >-
          {{
            (authentik_ldap_authz_flow_check.json.results[0].pk
            if (authentik_ldap_authz_flow_check.json.pagination.count | int) > 0
            else authentik_ldap_authz_flow_create.json.pk)
          }}
      when: not ansible_check_mode

    - name: Check if Authentik LDAP provider exists
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/providers/ldap/?name=edge-graylog-ldap-provider"  # nosonar: ansible:S5332 — internal Authentik API on private SDN
        method: GET
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
        status_code: [200]
      register: authentik_ldap_provider_check
      no_log: true
      when: not ansible_check_mode

    - name: Create Authentik LDAP provider
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/providers/ldap/"  # nosonar: ansible:S5332 — internal Authentik API on private SDN
        method: POST
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          name: "edge-graylog-ldap-provider"
          base_dn: "dc=ldap,dc=goauthentik,dc=io"
          search_mode: "direct"
          bind_mode: "direct"
          authorization_flow: "{{ authentik_ldap_authz_flow_pk }}"
          invalidation_flow: "{{ authentik_ldap_invalidation_flow.json.results[0].pk }}"
        status_code: [201]
      register: authentik_ldap_provider_create
      when:
        - not ansible_check_mode
        - (authentik_ldap_provider_check.json.pagination.count | int) == 0
      no_log: true

    - name: Resolve LDAP provider PK
      ansible.builtin.set_fact:
        ldap_provider_pk: >-
          {{
            (authentik_ldap_provider_check.json.results[0].pk
            if (authentik_ldap_provider_check.json.pagination.count | int) > 0
            else authentik_ldap_provider_create.json.pk) | int
          }}
      when: not ansible_check_mode

    - name: Check if Graylog LDAP application exists
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/core/applications/?slug=edge-graylog-ldap"  # nosonar: ansible:S5332 — internal Authentik API on private SDN
        method: GET
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
        status_code: [200]
      register: authentik_graylog_ldap_app_check
      no_log: true
      when: not ansible_check_mode

    - name: Create Graylog LDAP application
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/core/applications/"  # nosonar: ansible:S5332 — internal Authentik API on private SDN
        method: POST
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          name: "edge-graylog-ldap-app"
          slug: "edge-graylog-ldap"
          provider: "{{ ldap_provider_pk }}"
        status_code: [201]
      register: authentik_graylog_ldap_app_create
      when:
        - not ansible_check_mode
        - (authentik_graylog_ldap_app_check.json.pagination.count | int) == 0
      no_log: true

    - name: Resolve Graylog LDAP application PK
      ansible.builtin.set_fact:
        authentik_graylog_ldap_app_pk: >-
          {{
            (authentik_graylog_ldap_app_check.json.results[0].pk
            if (authentik_graylog_ldap_app_check.json.pagination.count | int) > 0
            else authentik_graylog_ldap_app_create.json.pk)
          }}
      when: not ansible_check_mode

    - name: Check if LDAP service user exists
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/core/users/?username=ldapservice"  # nosonar: ansible:S5332 — internal Authentik API on private SDN
        method: GET
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
        status_code: [200]
      register: authentik_ldap_service_user_check
      no_log: true
      when: not ansible_check_mode

    - name: Create LDAP service user
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/core/users/"  # nosonar: ansible:S5332 — internal Authentik API on private SDN
        method: POST
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          username: "ldapservice"
          name: "LDAP Service"
          email: "ldapservice@{{ lab_domain }}"
          is_active: true
          groups: []
        status_code: [201]
      register: authentik_ldap_service_user_create
      when:
        - not ansible_check_mode
        - (authentik_ldap_service_user_check.json.pagination.count | int) == 0
      no_log: true

    - name: Resolve LDAP service user PK
      ansible.builtin.set_fact:
        authentik_ldap_service_user_pk: >-
          {{
            (authentik_ldap_service_user_check.json.results[0].pk
            if (authentik_ldap_service_user_check.json.pagination.count | int) > 0
            else authentik_ldap_service_user_create.json.pk) | int
          }}
      when: not ansible_check_mode

    - name: Set LDAP service user password
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/core/users/{{ authentik_ldap_service_user_pk }}/set_password/"  # nosonar: ansible:S5332 — internal Authentik API on private SDN
        method: POST
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          password: "{{ authentik_ldap_service_password }}"
        status_code: [204]
      no_log: true
      when: not ansible_check_mode

    # In Authentik 2026.x, object-level permissions must be granted via roles.
    # The assigned_by_users endpoint was removed. We create a dedicated role and
    # assign it to the ldapservice user so it can search the full LDAP directory.
    - name: Check if ldap-search-full-directory role exists
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/rbac/roles/?name=ldap-search-full-directory"  # nosonar: ansible:S5332 — internal Authentik API on private SDN
        method: GET
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
        status_code: [200]
      register: authentik_ldap_search_role_check
      no_log: true
      when: not ansible_check_mode

    - name: Create ldap-search-full-directory role
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/rbac/roles/"  # nosonar: ansible:S5332 — internal Authentik API on private SDN
        method: POST
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          name: "ldap-search-full-directory"
        status_code: [201]
      register: authentik_ldap_search_role_create
      when:
        - not ansible_check_mode
        - (authentik_ldap_search_role_check.json.pagination.count | default(0) | int) == 0
      no_log: true

    - name: Resolve ldap-search-full-directory role PK
      ansible.builtin.set_fact:
        authentik_ldap_search_role_pk: >-
          {{
            (authentik_ldap_search_role_check.json.results[0].pk
            if (authentik_ldap_search_role_check.json.pagination.count | default(0) | int) > 0
            else authentik_ldap_search_role_create.json.pk)
          }}
      when: not ansible_check_mode

    - name: Grant search_full_directory permission to ldap-search-full-directory role on LDAP provider
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/rbac/permissions/assigned_by_roles/{{ authentik_ldap_search_role_pk }}/assign/"  # nosonar: ansible:S5332 — internal Authentik API on private SDN
        method: POST
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          permissions:
            - "authentik_providers_ldap.search_full_directory"
          model: "authentik_providers_ldap.ldapprovider"
          object_pk: "{{ ldap_provider_pk | string }}"
        status_code: [200]
      no_log: true
      when: not ansible_check_mode

    - name: Assign ldap-search-full-directory role to ldapservice user
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/core/users/{{ authentik_ldap_service_user_pk }}/"  # nosonar: ansible:S5332 — internal Authentik API on private SDN
        method: PATCH
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          roles:
            - "{{ authentik_ldap_search_role_pk }}"
        status_code: [200]
      no_log: true
      when: not ansible_check_mode

    - name: Check if Graylog LDAP identification stage exists
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/stages/identification/?name=graylog-ldap-identification"  # nosonar: ansible:S5332 — internal Authentik API on private SDN
        method: GET
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
        status_code: [200]
      register: authentik_graylog_ldap_ident_stage_check
      no_log: true
      when: not ansible_check_mode

    - name: Create Graylog LDAP identification stage
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/stages/identification/"  # nosonar: ansible:S5332 — internal Authentik API on private SDN
        method: POST
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          name: "graylog-ldap-identification"
          user_fields:
            - "username"
            - "email"
          password_stage: "{{ authentik_default_password_stage_pk }}"
          case_insensitive_matching: true
          show_matched_user: true
          sources: []
          show_source_labels: false
          pretend_user_exists: true
        status_code: [201]
      register: authentik_graylog_ldap_ident_stage_create
      when:
        - not ansible_check_mode
        - (authentik_graylog_ldap_ident_stage_check.json.pagination.count | int) == 0
      no_log: true

    - name: Resolve Graylog LDAP identification stage PK
      ansible.builtin.set_fact:
        authentik_graylog_ldap_ident_stage_pk: >-
          {{
            (authentik_graylog_ldap_ident_stage_check.json.results[0].pk
            if (authentik_graylog_ldap_ident_stage_check.json.pagination.count | int) > 0
            else authentik_graylog_ldap_ident_stage_create.json.pk)
          }}
      when: not ansible_check_mode

    - name: Check stage bindings for ldap-authz-flow
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/flows/bindings/?target={{ authentik_ldap_authz_flow_pk }}"  # nosonar: ansible:S5332 — internal Authentik API on private SDN
        method: GET
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
        status_code: [200]
      register: authentik_ldap_authz_flow_bindings
      no_log: true
      when: not ansible_check_mode

    - name: Bind identification stage into ldap-authz-flow
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/flows/bindings/"  # nosonar: ansible:S5332 — internal Authentik API on private SDN
        method: POST
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          target: "{{ authentik_ldap_authz_flow_pk }}"
          stage: "{{ authentik_graylog_ldap_ident_stage_pk }}"
          order: 10
          policy_engine_mode: "any"
          evaluate_on_plan: false
          re_evaluate_policies: true
          invalid_response_action: "retry"
        status_code: [201]
      when:
        - not ansible_check_mode
        - >-
          (authentik_ldap_authz_flow_bindings.json.pagination.count | int) == 0 or
          ((authentik_ldap_authz_flow_bindings.json.results | default([])
            | selectattr('stage', 'eq', authentik_graylog_ldap_ident_stage_pk) | list | length) == 0)
      no_log: true

    - name: Bind password stage into ldap-authz-flow
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/flows/bindings/"  # nosonar: ansible:S5332 — internal Authentik API on private SDN
        method: POST
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          target: "{{ authentik_ldap_authz_flow_pk }}"
          stage: "{{ authentik_default_password_stage_pk }}"
          order: 20
          policy_engine_mode: "any"
          evaluate_on_plan: false
          re_evaluate_policies: true
          invalid_response_action: "retry"
        status_code: [201]
      when:
        - not ansible_check_mode
        - >-
          (authentik_ldap_authz_flow_bindings.json.pagination.count | int) == 0 or
          ((authentik_ldap_authz_flow_bindings.json.results | default([])
            | selectattr('stage', 'eq', authentik_default_password_stage_pk) | list | length) == 0)
      no_log: true

    - name: Bind user login stage into ldap-authz-flow
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/flows/bindings/"  # nosonar: ansible:S5332 — internal Authentik API on private SDN
        method: POST
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          target: "{{ authentik_ldap_authz_flow_pk }}"
          stage: "{{ authentik_default_login_stage_pk }}"
          order: 30
          policy_engine_mode: "any"
          evaluate_on_plan: false
          re_evaluate_policies: true
          invalid_response_action: "retry"
        status_code: [201]
      when:
        - not ansible_check_mode
        - >-
          (authentik_ldap_authz_flow_bindings.json.pagination.count | int) == 0 or
          ((authentik_ldap_authz_flow_bindings.json.results | default([])
            | selectattr('stage', 'eq', authentik_default_login_stage_pk) | list | length) == 0)
      no_log: true

    - name: Ensure LDAP provider uses ldap-authz-flow as authorization flow
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/providers/ldap/{{ ldap_provider_pk }}/"  # nosonar: ansible:S5332 — internal Authentik API on private SDN
        method: PATCH
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          authorization_flow: "{{ authentik_ldap_authz_flow_pk }}"
        status_code: [200]
      no_log: true
      when: not ansible_check_mode

    - name: Check if Authentik LDAP outpost exists
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/outposts/instances/?name=edge-graylog-ldap-outpost"  # nosonar: ansible:S5332 — internal Authentik API on private SDN
        method: GET
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
        status_code: [200]
      register: authentik_ldap_outpost_check
      no_log: true
      when: not ansible_check_mode

    - name: Resolve matching LDAP outpost records by name
      ansible.builtin.set_fact:
        authentik_ldap_outpost_matches: >-
          {{
            authentik_ldap_outpost_check.json.results | default([])
            | selectattr('name', 'eq', 'edge-graylog-ldap-outpost')
            | list
          }}
      when: not ansible_check_mode

    - name: Fetch Authentik default outpost config
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/outposts/instances/default_settings/"  # nosonar: ansible:S5332 — internal Authentik API on private SDN
        method: GET
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
        status_code: [200]
      register: authentik_default_outpost_config
      no_log: true
      when: not ansible_check_mode

    - name: Create Authentik LDAP outpost
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/outposts/instances/"  # nosonar: ansible:S5332 — internal Authentik API on private SDN
        method: POST
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          name: "edge-graylog-ldap-outpost"
          type: "ldap"
          providers: ["{{ ldap_provider_pk }}"]
          service_connection: null
          config: "{{ authentik_default_outpost_config.json.config }}"
        status_code: [201]
      register: authentik_ldap_outpost_create
      when:
        - not ansible_check_mode
        - (authentik_ldap_outpost_matches | default([]) | length) == 0
      no_log: true

    - name: Resolve LDAP outpost token identifier
      ansible.builtin.set_fact:
        ldap_outpost_token_id: >-
          {{
            (authentik_ldap_outpost_matches[0].token_identifier
            if (authentik_ldap_outpost_matches | default([]) | length) > 0
            else authentik_ldap_outpost_create.json.token_identifier)
          }}
      when: not ansible_check_mode

    - name: Fetch LDAP outpost service token key
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/api/v3/core/tokens/{{ ldap_outpost_token_id }}/view_key/"  # nosonar: ansible:S5332 — internal Authentik API on private SDN
        method: GET
        headers:
          Authorization: "Bearer {{ authentik_superuser_api_token }}"
        status_code: [200]
      register: authentik_ldap_token_key
      no_log: true
      when: not ansible_check_mode

    - name: Write .ldap-outpost.env with LDAP outpost token
      ansible.builtin.copy:
        dest: "{{ authentik_compose_dir }}/.ldap-outpost.env"
        mode: "0600"
        content: |
          AUTHENTIK_HOST=http://{{ ansible_host }}:9000
          AUTHENTIK_TOKEN={{ authentik_ldap_token_key.json.key }}
      no_log: true
      register: authentik_ldap_env_write
      when: not ansible_check_mode

    - name: Recreate LDAP outpost container to pick up token
      ansible.builtin.command:
        cmd: docker compose -f "{{ authentik_compose_path }}" up -d --no-deps --force-recreate ldap
        chdir: "{{ authentik_compose_dir }}"
      when:
        - not ansible_check_mode
        - authentik_ldap_env_write.changed

    - name: Wait for Authentik LDAP outpost to become healthy
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 3389
        timeout: 60
      when: not ansible_check_mode
