# NetBox stack lifecycle: Docker base → Portainer Agent → provision config → register → deploy
# Extends the standard deploy-stack.yml with NetBox-specific host preparation.

---
- name: Configure Docker base and Portainer Agent
  hosts: all
  become: true
  gather_facts: true
  roles:
    - docker_base
    - portainer_agent

- name: Provision NetBox configuration files on host
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Create NetBox configuration directory
      ansible.builtin.file:
        path: /srv/docker/netbox/configuration
        state: directory
        mode: "0755"

    - name: Copy NetBox configuration files
      ansible.builtin.copy:
        src: "../../stacks/{{ stack_name }}/configuration/{{ item }}"
        dest: "/srv/docker/netbox/configuration/{{ item }}"
        mode: "0644"
      loop:
        - configuration.py
        - extra.py
        - plugins.py
        - logging.py

- name: Register endpoint and deploy stack via Portainer API
  hosts: all
  become: false
  gather_facts: false

  vars:
    app_stack_compose_content: "{{ lookup('file', '../../stacks/' + stack_name + '/docker-compose.yml') }}"
    app_stack_endpoint_name: "{{ inventory_hostname }}"
    app_stack_server_ip: "{{ portainer_server_ip }}"
    portainer_api_server_ip: "{{ portainer_server_ip }}"
    portainer_api_endpoint_name: "{{ inventory_hostname }}"
    portainer_api_agent_ip: "{{ ansible_host }}"

  roles:
    - portainer_api
    - app_stack
