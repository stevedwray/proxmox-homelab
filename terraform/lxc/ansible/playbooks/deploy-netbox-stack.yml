# NetBox stack lifecycle: Docker base -> provision config -> deploy -> superuser + API token
# Extends the standard deploy-stack.yml with NetBox-specific host preparation.

---
- name: Configure Docker base
  hosts: all
  become: true
  gather_facts: true
  vars:
    docker_registry_host: "{{ registry_host | default(lookup('env', 'LAB_IP_HARBOR'), true) | mandatory('registry_host var or LAB_IP_HARBOR env var is required') }}"
    netbox_lab_ip_dns: "{{ lookup('env', 'LAB_IP_DNS') | default(dns_server, true) | mandatory('LAB_IP_DNS env var or dns_server inventory var is required') }}"
  roles:
    - lxc_base
    - docker_base

  tasks:
    - name: Trust Harbor HTTP registry in Docker daemon
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {
            "insecure-registries": ["{{ docker_registry_host }}"],
            "dns": ["{{ netbox_lab_ip_dns }}"],
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            },
            "storage-driver": "overlay2"
          }
      notify: Restart Docker

    - name: Flush handlers to apply Docker daemon config before stack deploy
      ansible.builtin.meta: flush_handlers

    - name: Mask portainer-agent service (platform tier — no agent on this host)
      ansible.builtin.systemd:
        name: portainer-agent.service
        masked: true
        enabled: false
      failed_when: false

  handlers:
    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted

- name: Provision NetBox configuration files on host
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Create NetBox configuration directory
      ansible.builtin.file:
        path: /srv/docker/netbox/configuration
        state: directory
        mode: "0750"

    - name: Copy NetBox configuration files
      ansible.builtin.copy:
        src: "../../stacks/{{ stack_name }}/configuration/{{ item }}"
        dest: "/srv/docker/netbox/configuration/{{ item }}"
        mode: "0640"
      loop:
        - configuration.py
        - extra.py
        - plugins.py
        - logging.py

- name: Deploy NetBox compose stack
  hosts: all
  become: true
  gather_facts: false

  vars:
    direct_stack_name: "netbox"
    direct_stack_compose_dir: "/srv/docker/netbox"
    direct_stack_compose_content: "{{ lookup('file', '../../stacks/' + stack_name + '/docker-compose.yml') }}"
    direct_stack_env:
      - name: NETBOX_DB_PASSWORD
        value: "{{ lookup('env', 'NETBOX_DB_PASSWORD') | mandatory('NETBOX_DB_PASSWORD env var is not set') }}"
      - name: NETBOX_REDIS_PASSWORD
        value: "{{ lookup('env', 'NETBOX_REDIS_PASSWORD') | mandatory('NETBOX_REDIS_PASSWORD env var is not set') }}"
      - name: NETBOX_REDIS_CACHE_PASSWORD
        value: "{{ lookup('env', 'NETBOX_REDIS_CACHE_PASSWORD') | mandatory('NETBOX_REDIS_CACHE_PASSWORD env var is not set') }}"
      - name: NETBOX_SECRET_KEY
        value: "{{ lookup('env', 'NETBOX_SECRET_KEY') | mandatory('NETBOX_SECRET_KEY env var is not set') }}"
      - name: NETBOX_API_TOKEN_PEPPER
        value: "{{ lookup('env', 'NETBOX_API_TOKEN_PEPPER') | mandatory('NETBOX_API_TOKEN_PEPPER env var is not set') }}"
      - name: REGISTRY_HOST
        value: "{{ registry_host | default(lookup('env', 'LAB_IP_HARBOR'), true) | mandatory('registry_host var or LAB_IP_HARBOR env var is required') }}"

  roles:
    - direct_stack

- name: Create NetBox superuser and API token
  hosts: all
  become: true
  gather_facts: false

  vars:
    netbox_container: "netbox-netbox-1"
    netbox_manage: /opt/netbox/venv/bin/python /opt/netbox/netbox/manage.py
    netbox_lab_domain: "{{ lookup('env', 'LAB_DOMAIN') | default('lab.gibbsgreatly.xyz', true) }}"
    netbox_lab_admin_username: "{{ lookup('env', 'LAB_ADMIN_USERNAME') | default('steve', true) }}"
    netbox_lab_admin_email: "{{ lookup('env', 'LAB_ADMIN_EMAIL') | default(netbox_lab_admin_username ~ '@' ~ netbox_lab_domain, true) }}"
    netbox_superuser_username: admin
    netbox_superuser_email: >-
      {{
        lookup('env', 'NETBOX_SUPERUSER_EMAIL')
        | default('admin@' ~ (lookup('env', 'TF_VAR_domain') | default('gibbsgreatly.xyz', true)), true)
      }}
    netbox_superuser_password: "{{ lookup('env', 'NETBOX_SUPERUSER_PASSWORD') | mandatory('NETBOX_SUPERUSER_PASSWORD env var is not set') }}"
    netbox_api_token: "{{ lookup('env', 'NETBOX_SUPERUSER_API_TOKEN') | mandatory('NETBOX_SUPERUSER_API_TOKEN env var is not set') }}"
    netbox_steve_username: "{{ lookup('env', 'NETBOX_STEVE_USERNAME') | default(netbox_lab_admin_username, true) }}"
    netbox_steve_email: "{{ lookup('env', 'NETBOX_STEVE_EMAIL') | default(netbox_lab_admin_email, true) }}"
    netbox_breakglass_username: "{{ lookup('env', 'NETBOX_BREAKGLASS_USERNAME') | default('breakglass', true) }}"
    netbox_breakglass_email: "{{ lookup('env', 'NETBOX_BREAKGLASS_EMAIL') | default('breakglass@localhost', true) }}"
    netbox_breakglass_password: "{{ lookup('env', 'BREAKGLASS_PASSWORD') | default(netbox_superuser_password, true) }}"

  tasks:
    - name: Wait for NetBox to be healthy
      ansible.builtin.command:
        cmd: docker inspect --format '{{ '{{' }} .State.Health.Status {{ '}}' }}' {{ netbox_container }}
      register: netbox_health
      retries: 40
      delay: 10
      until: netbox_health.stdout == 'healthy'
      changed_when: false

    - name: Create superuser if not exists
      ansible.builtin.command:
        cmd: >-
          docker exec
          -e DJANGO_SUPERUSER_PASSWORD={{ netbox_superuser_password }}
          {{ netbox_container }}
          {{ netbox_manage }} createsuperuser
          --no-input
          --username {{ netbox_superuser_username }}
          --email {{ netbox_superuser_email }}
      register: netbox_superuser_result
      changed_when: "'Superuser created' in netbox_superuser_result.stderr"
      failed_when:
        - netbox_superuser_result.rc != 0
        - "'already taken' not in netbox_superuser_result.stderr"
      no_log: true

    - name: Ensure steve and breakglass local NetBox admin users exist
      ansible.builtin.shell:
        cmd: |
          docker exec -i \
            -e NB_STEVE_USER \
            -e NB_STEVE_EMAIL \
            -e NB_BREAKGLASS_USER \
            -e NB_BREAKGLASS_EMAIL \
            -e NB_BREAKGLASS_PASSWORD \
            {{ netbox_container }} \
            {{ netbox_manage }} shell <<'PYEOF'
          import os
          from django.contrib.auth import get_user_model

          User = get_user_model()
          user_field_names = {field.name for field in User._meta.get_fields()}
          changed = False

          def admin_defaults(email):
              defaults = {
                  'email': email,
                  'is_superuser': True,
              }
              if 'is_staff' in user_field_names:
                  defaults['is_staff'] = True
              if 'is_active' in user_field_names:
                  defaults['is_active'] = True
              return defaults

          def sync_admin_user(user, email, use_password, password_value=None):
              updates = []
              if user.email != email:
                  user.email = email
                  updates.append('email')
              if 'is_active' in user_field_names and not user.is_active:
                  user.is_active = True
                  updates.append('is_active')
              if 'is_staff' in user_field_names and not user.is_staff:
                  user.is_staff = True
                  updates.append('is_staff')
              if not user.is_superuser:
                  user.is_superuser = True
                  updates.append('is_superuser')
              if use_password:
                  if not user.check_password(password_value):
                      user.set_password(password_value)
                      updates.append('password')
              elif user.has_usable_password():
                  user.set_unusable_password()
                  updates.append('password')
              if updates:
                  user.save(update_fields=updates)
                  return True
              return False

          steve, steve_created = User.objects.get_or_create(
              username=os.environ['NB_STEVE_USER'],
              defaults=admin_defaults(os.environ['NB_STEVE_EMAIL']),
          )
          if steve_created or sync_admin_user(steve, os.environ['NB_STEVE_EMAIL'], False):
              changed = True

          breakglass, breakglass_created = User.objects.get_or_create(
              username=os.environ['NB_BREAKGLASS_USER'],
              defaults=admin_defaults(os.environ['NB_BREAKGLASS_EMAIL']),
          )
          if breakglass_created or sync_admin_user(
              breakglass,
              os.environ['NB_BREAKGLASS_EMAIL'],
              True,
              os.environ['NB_BREAKGLASS_PASSWORD'],
          ):
              changed = True

          print('CHANGED' if changed else 'UNCHANGED')
          PYEOF
      environment:
        NB_STEVE_USER: "{{ netbox_steve_username }}"
        NB_STEVE_EMAIL: "{{ netbox_steve_email }}"
        NB_BREAKGLASS_USER: "{{ netbox_breakglass_username }}"
        NB_BREAKGLASS_EMAIL: "{{ netbox_breakglass_email }}"
        NB_BREAKGLASS_PASSWORD: "{{ netbox_breakglass_password }}"
      register: netbox_local_admins_result
      changed_when: "'CHANGED' in netbox_local_admins_result.stdout"
      failed_when:
        - netbox_local_admins_result.rc != 0
      no_log: true

    - name: Provision API token (idempotent)
      ansible.builtin.shell:
        cmd: |
          docker exec -i \
            -e NB_USER='{{ netbox_superuser_username }}' \
            -e NB_TOKEN='{{ netbox_api_token }}' \
            {{ netbox_container }} \
            {{ netbox_manage }} shell <<'PYEOF'
          import os
          from django.contrib.auth import get_user_model
          from users.models import Token
          User = get_user_model()
          u = User.objects.get(username=os.environ['NB_USER'])
          if Token.objects.filter(user=u, description='automation').exists():
              print('EXISTS')
          else:
              t = Token(user=u, version=1, description='automation', write_enabled=True)
              t.token = os.environ['NB_TOKEN']
              t.save()
              print('CREATED')
          PYEOF
      register: netbox_token_result
      changed_when: "'CREATED' in netbox_token_result.stdout"
      failed_when:
        - netbox_token_result.rc != 0
      no_log: true

    - name: Display token status
      ansible.builtin.debug:
        msg: "API token: {{ 'created' if 'CREATED' in netbox_token_result.stdout else 'already exists' }}"
