---
- name: Install rsyslog
  ansible.builtin.apt:
    name: rsyslog
    state: present
    update_cache: false

- name: Disable imklog in LXC (no /proc/kmsg — prevents partial init blocking imtcp bind)
  ansible.builtin.lineinfile:
    path: /etc/rsyslog.conf
    regexp: '^module\(load="imklog"\)'
    line: '#module(load="imklog")   # disabled: LXC containers cannot access /proc/kmsg'
    backrefs: true
  notify: Restart rsyslog

- name: Remove stale victorialogs-named config (renamed to log-forwarding)
  ansible.builtin.file:
    path: /etc/rsyslog.d/90-victorialogs.conf
    state: absent
  notify: Restart rsyslog

- name: Write log forwarding config
  ansible.builtin.template:
    src: log-forwarding.conf.j2
    dest: /etc/rsyslog.d/90-log-forwarding.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart rsyslog

- name: Enable and start rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    enabled: true
    state: started
    daemon_reload: false

- name: Flush handlers to apply rsyslog config before port availability check
  ansible.builtin.meta: flush_handlers

- name: Ensure rsyslog is listening on Docker TCP log port 10514
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 10514
    timeout: 15

# Optional Graylog inbound relay: accept appliance/host syslog on :514 and
# forward to the configured rsyslog_forward_target (typically 127.0.0.1:5140).
- name: Write Graylog inbound relay config
  ansible.builtin.template:
    src: graylog_inbound.conf.j2
    dest: /etc/rsyslog.d/91-graylog-inbound.conf
    owner: root
    group: root
    mode: "0644"
  when: rsyslog_inbound_enabled | bool
  notify: Restart rsyslog

- name: Remove Graylog inbound relay config when not enabled
  ansible.builtin.file:
    path: /etc/rsyslog.d/91-graylog-inbound.conf
    state: absent
  when: not (rsyslog_inbound_enabled | bool)
  notify: Restart rsyslog

- name: Flush handlers to apply inbound rsyslog config before port check
  ansible.builtin.meta: flush_handlers

- name: Ensure rsyslog is listening on inbound syslog TCP port
  ansible.builtin.wait_for:
    host: 0.0.0.0
    port: "{{ rsyslog_inbound_tcp_port }}"
    timeout: 15
  when: rsyslog_inbound_enabled | bool
