---
- name: Install rsyslog
  ansible.builtin.apt:
    name: rsyslog
    state: present
    update_cache: false

- name: Disable imklog in LXC (no /proc/kmsg — prevents partial init blocking imtcp bind)
  ansible.builtin.lineinfile:
    path: /etc/rsyslog.conf
    regexp: '^module\(load="imklog"\)'
    line: '#module(load="imklog")   # disabled: LXC containers cannot access /proc/kmsg'
    backrefs: true
  notify: Restart rsyslog

- name: Write VictoriaLogs forwarding config
  ansible.builtin.template:
    src: victorialogs.conf.j2
    dest: /etc/rsyslog.d/90-victorialogs.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart rsyslog

- name: Enable and start rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    enabled: true
    state: started
    daemon_reload: false

- name: Ensure rsyslog is listening on Docker TCP log port 10514
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 10514
    timeout: 15
