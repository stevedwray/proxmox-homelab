# terraform/ansible/shared-roles/portainer_agent/defaults/main.yml

---
# Portainer Agent configuration defaults
portainer_agent_compose_dir: "/opt/portainer"
portainer_agent_compose_path: "/opt/portainer/docker-compose.yml"
portainer_agent_service_unit: "portainer-agent.service"
portainer_agent_image: "portainer/agent:2.27.3"
portainer_agent_port: 9001
portainer_agent_fqdn: "{{ inventory_hostname }}"
portainer_agent_network_subnet: "172.31.250.0/24"
portainer_agent_network_gateway: "172.31.250.1"
