# terraform/ansible/shared-roles/portainer_common/tasks/endpoint.yml
---
# Expects:
# - portainer_api_host, portainer_port_http (from group_vars/all.yml)
# - portainer_admin_password (var) OR env PORTAINER_ADMIN_PASSWORD

- name: Wait for Portainer API
  ansible.builtin.wait_for:
    host: "{{ portainer_api_host }}"
    port: "{{ portainer_port_http }}"
    timeout: 120
  delegate_to: localhost
  become: false

- name: Authenticate with Portainer
  ansible.builtin.uri:
    url: "http://{{ portainer_api_host }}:{{ portainer_port_http }}/api/auth"
    method: POST
    body_format: json
    body:
      Username: "{{ portainer_admin_user | default('admin') }}"
      Password: "{{ portainer_admin_password | default(lookup('env','PORTAINER_ADMIN_PASSWORD')) }}"
    headers:
      Content-Type: "application/json"
    status_code: 200
  register: portainer_auth
  delegate_to: localhost
  become: false
  no_log: true

- name: Set JWT
  ansible.builtin.set_fact:
    portainer_jwt: "{{ portainer_auth.json.jwt }}"

- name: Get Portainer endpoints
  ansible.builtin.uri:
    url: "http://{{ portainer_api_host }}:{{ portainer_port_http }}/api/endpoints"
    method: GET
    headers:
      Authorization: "Bearer {{ portainer_jwt }}"
    status_code: 200
  register: _pc_endpoints
  delegate_to: localhost
  become: false

- name: Create local endpoint if none exists
  ansible.builtin.uri:
    url: "http://{{ portainer_api_host }}:{{ portainer_port_http }}/api/endpoints"
    method: POST
    body_format: form-urlencoded
    body:
      Name: "local"
      URL: "unix:///var/run/docker.sock"
      EndpointCreationType: "1"
    headers:
      Authorization: "Bearer {{ portainer_jwt }}"
    status_code: 200
  register: _pc_created_endpoint
  when: (_pc_endpoints.json | length) == 0
  delegate_to: localhost
  become: false

- name: Set endpoint id from created
  ansible.builtin.set_fact:
    portainer_local_endpoint_id: "{{ _pc_created_endpoint.json.Id }}"
  when: (_pc_endpoints.json | length) == 0

- name: Try to find 'local' endpoint id
  ansible.builtin.set_fact:
    portainer_local_endpoint_id: "{{ item.Id }}"
  loop: "{{ _pc_endpoints.json }}"
  when: portainer_local_endpoint_id is not defined and item.Name == 'local'

- name: Fallback to first endpoint id
  ansible.builtin.set_fact:
    portainer_local_endpoint_id: "{{ (_pc_endpoints.json | first).Id }}"
  when: portainer_local_endpoint_id is not defined
