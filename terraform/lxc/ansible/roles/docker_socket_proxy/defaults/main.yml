---
# Defaults for docker_socket_proxy role
enable_docker_socket_proxy: false
# Self-sufficient rather than depending on the including playbook's own
# *_registry_host var (they're all named differently: docker_registry_host,
# monitoring_registry_host, effective_registry_host, ...). Must be the FQDN
# (routed through Traefik), not LAB_IP_HARBOR -- Harbor's registry auth
# realm always echoes back external_url's https scheme regardless of which
# host/port the client connected on, so a pull against the raw container IP
# fails. See docs/harbor-stack/image-sourcing-enforcement.md.
docker_socket_proxy_registry_host: "{{ lookup('env', 'LAB_FQDN_HARBOR') | default('harbor.' ~ (lookup('env', 'LAB_DOMAIN') | default('lab.gibbsgreatly.xyz', true)), true) }}"
docker_socket_proxy_image: "{{ docker_socket_proxy_registry_host }}/dockerhub/tecnativa/docker-socket-proxy:latest"
docker_socket_proxy_listen_port: 2375
docker_socket_proxy_bind_addr: "{{ ansible_default_ipv4.address | default('127.0.0.1') }}"
docker_socket_proxy_project_dir: /opt/docker-socket-proxy
# Socket-proxy environment model (match Tecnativa/docker-socket-proxy)
# Control mutating methods and explicit endpoint groups via env flags.
# Defaults keep POST disabled and enable only the minimal discovery endpoints.
docker_socket_proxy_post: false
docker_socket_proxy_containers: true
docker_socket_proxy_info: true
docker_socket_proxy_images: false
# Extra environment entries (dict) to render into the compose template if needed
docker_socket_proxy_env_extra: {}
