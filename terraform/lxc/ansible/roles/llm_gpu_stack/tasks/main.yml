# Native (no Docker) HIP build of llama.cpp + router-mode systemd service.
# See docs/framework/llamacpp-router-mode-deployment.md for the deployment
# pattern this codifies and
# docs/framework/proxmox-strix-halo-setup-notes.md for the GPU-enablement
# findings behind it. Does not fetch model weights -- that stays an
# operator action against the running service (drop a .gguf into
# llm_gpu_stack_models_dir, GET /v1/models?reload=1).

---
- name: Install ROCm/HIP and llama.cpp build dependencies
  ansible.builtin.apt:
    name:
      - rocm-dev
      - rocm-smi
      - cmake
      - build-essential
      - git
      - libcurl4-openssl-dev
    state: present
    update_cache: true

- name: Confirm /dev/kfd is visible inside the container (device_passthrough sanity check)
  ansible.builtin.stat:
    path: /dev/kfd
  register: llm_gpu_stack_kfd_stat
  failed_when: not llm_gpu_stack_kfd_stat.stat.exists

- name: Confirm /dev/dri render node is visible inside the container
  ansible.builtin.stat:
    path: /dev/dri/renderD128
  register: llm_gpu_stack_dri_stat
  failed_when: not llm_gpu_stack_dri_stat.stat.exists

- name: Clone llama.cpp
  ansible.builtin.git:
    repo: "{{ llm_gpu_stack_llamacpp_repo }}"
    dest: "{{ llm_gpu_stack_llamacpp_dir }}"
    version: master
    update: true
  register: llm_gpu_stack_llamacpp_checkout

- name: Resolve HIP compiler/path (hipconfig)
  ansible.builtin.shell: |
    set -euo pipefail
    echo "HIPCXX=$(hipconfig -l)/clang"
    echo "HIP_PATH=$(hipconfig -R)"
  args:
    executable: /bin/bash
  changed_when: false
  register: llm_gpu_stack_hipconfig

- name: Check for existing HIP build
  ansible.builtin.stat:
    path: "{{ llm_gpu_stack_llamacpp_dir }}/build-hip/bin/llama-server"
  register: llm_gpu_stack_build_marker

- name: Configure llama.cpp HIP build (cmake)
  ansible.builtin.command:
    cmd: >-
      cmake -S . -B build-hip
      -DGGML_HIP=ON
      -DAMDGPU_TARGETS={{ llm_gpu_stack_amdgpu_target }}
      -DCMAKE_BUILD_TYPE=Release
    chdir: "{{ llm_gpu_stack_llamacpp_dir }}"
  environment: "{{ dict(llm_gpu_stack_hipconfig.stdout_lines | map('split', '=') | list) }}"
  when: llm_gpu_stack_llamacpp_checkout.changed or not llm_gpu_stack_build_marker.stat.exists

- name: Build llama.cpp (HIP, release) -- skipped if already built and repo unchanged
  ansible.builtin.command:
    cmd: cmake --build build-hip --config Release -j{{ ansible_processor_vcpus | default(ansible_processor_count, true) }}
    chdir: "{{ llm_gpu_stack_llamacpp_dir }}"
  when: llm_gpu_stack_llamacpp_checkout.changed or not llm_gpu_stack_build_marker.stat.exists

- name: Verify llama-server binary exists after build
  ansible.builtin.stat:
    path: "{{ llm_gpu_stack_llamacpp_dir }}/build-hip/bin/llama-server"
  register: llm_gpu_stack_final_binary
  failed_when: not llm_gpu_stack_final_binary.stat.exists

- name: Ensure models directory exists
  ansible.builtin.file:
    path: "{{ llm_gpu_stack_models_dir }}"
    state: directory
    mode: "0755"

- name: Ensure API key directory exists (only when an API key is configured)
  ansible.builtin.file:
    path: /etc/llama-router
    state: directory
    mode: "0700"
  when: llm_gpu_stack_api_key | length > 0

- name: Write router API key (mode 0600 -- kept off the command line and out of the world-readable unit file)
  ansible.builtin.copy:
    dest: /etc/llama-router/api-key
    content: "{{ llm_gpu_stack_api_key }}"
    mode: "0600"
  when: llm_gpu_stack_api_key | length > 0
  no_log: true

- name: Install llama-router systemd unit
  ansible.builtin.template:
    src: llama-router.service.j2
    dest: /etc/systemd/system/llama-router.service
    mode: "0644"
  notify: Reload systemd and restart llama-router

- name: Ensure llama-router service is enabled
  ansible.builtin.systemd:
    name: llama-router
    enabled: true
    daemon_reload: true
