---
# Extra file/directory paths for this host's FIM (syscheck) watch, on top
# of Wazuh's own built-in OS-level defaults (/etc, /bin, /sbin, /usr/bin,
# /usr/sbin) which this role's ossec.conf template always includes. Each
# including playbook sets this to the paths that actually matter for its
# own stack (compose file, app config, TLS material) -- empty by default
# so a stack that forgets to set it still gets a working, if minimal,
# FIM baseline rather than a task failure.
wazuh_agent_fim_paths: []

# Fleet-wide agent_groups (docs/lxc-scan-and-monitoring-rollout/plan.md,
# waz-01, added 2026-09-29 -- the pilot-era comment here used to say
# "revisit grouping if/when this becomes a fleet-wide rollout"; that's
# now). One zone group per host, not a list -- the including playbook
# passes its own stack's zone value (e.g. "infra_seg") literally, same as
# it already passes wazuh_agent_fim_paths. Empty string means "no group"
# (skips the ensure-group task and the -G enrollment flag entirely), so
# this stays backward compatible with any host that doesn't set it.
wazuh_agent_group: ""

# Off by default -- deliberate opt-in, not "on wherever Docker happens
# to be present". The docker-listener wodle runs as the wazuh user and
# needs docker.sock access, which in practice means adding wazuh to the
# docker group -- i.e. root-equivalent host access for the agent
# process, trading away the isolation it otherwise has as an
# unprivileged user. Only set this true for a host where that tradeoff
# has been deliberately accepted (see docs/wazuh-stack/).
wazuh_agent_docker_monitoring_enabled: false
