# terraform/ansible/shared-roles/app_stack/defaults/main.yml

---
# Portainer server connection details.
# Prefer the generated inventory host var when present.
# Current active pve-test fallback: 10.57.1.20.
app_stack_server_ip: "{{ portainer_server_ip | default('10.57.1.20') }}"
app_stack_server_port: "9000"

# Authentication credentials
app_stack_admin_user: "admin"
app_stack_admin_password: "{{ lookup('env', 'PORTAINER_ADMIN_PASSWORD') | mandatory('PORTAINER_ADMIN_PASSWORD environment variable is not set') }}"

# Stack deployment configuration
app_stack_name: "nginx-test"
app_stack_endpoint_name: "{{ inventory_hostname }}"
app_stack_prune_on_update: true

# Stack environment variables passed to Portainer (list of {name, value} dicts)
# These are resolved as ${VAR} in the compose file by Portainer.
app_stack_env: []

# Default nginx stack compose content
app_stack_compose_content: |
  version: '3.8'
  services:
    nginx:
      image: nginx:alpine
      container_name: nginx-test
      ports:
        - "80:80"
      restart: unless-stopped
