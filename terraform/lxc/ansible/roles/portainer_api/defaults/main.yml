# terraform/ansible/shared-roles/portainer_api/defaults/main.yml

---
# Portainer server connection details.
# Prefer the generated inventory host var when present.
# Current active pve-test fallback: 10.57.1.20.
portainer_api_server_ip: "{{ portainer_server_ip | default('10.57.1.20') }}"
portainer_api_server_port: "9000"

# Authentication credentials
portainer_api_admin_user: "admin"
portainer_api_admin_password: "{{ lookup('env', 'PORTAINER_ADMIN_PASSWORD') | mandatory('PORTAINER_ADMIN_PASSWORD environment variable is not set') }}"

# Agent registration details (these should be overridden by the calling stack)
portainer_api_endpoint_name: "{{ inventory_hostname }}"
portainer_api_agent_ip: "{{ ansible_host }}"
portainer_api_agent_port: "9001"
