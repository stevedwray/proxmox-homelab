---
- name: Remove scheduled Harbor re-pull when not explicitly enabled
  when: not (harbor_repull_enabled | bool)
  block:
    - name: Stop and disable harbor-repull timer
      ansible.builtin.systemd:
        name: harbor-repull.timer
        state: stopped
        enabled: false
      failed_when: false

    - name: Stop harbor-repull service if present
      ansible.builtin.systemd:
        name: harbor-repull.service
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove harbor-repull units and files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/harbor-repull.timer
        - /etc/systemd/system/harbor-repull.service
        - "{{ harbor_repull_dir }}"
      notify: Reload systemd

    - name: Clear stale harbor-repull service failure state
      ansible.builtin.command:
        cmd: systemctl reset-failed harbor-repull.service harbor-repull.timer
      failed_when: false
      changed_when: false

- name: Install scheduled Harbor re-pull when explicitly enabled
  when: harbor_repull_enabled | bool
  block:
    - name: Create harbor-repull directory
      ansible.builtin.file:
        path: "{{ harbor_repull_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Copy harbor-repull script
      ansible.builtin.copy:
        src: harbor_repull.py
        dest: "{{ harbor_repull_dir }}/harbor_repull.py"
        owner: root
        group: root
        mode: "0750"

    - name: Copy known-image manifest
      ansible.builtin.copy:
        src: manifest.txt
        dest: "{{ harbor_repull_manifest_path }}"
        owner: root
        group: root
        mode: "0644"

    # ---------------------------------------------------------------
    # Mirror-push credential (pull-then-push fix -- see
    # docs/harbor-stack/README.md Open Investigation)
    # ---------------------------------------------------------------

    - name: Check for existing harbor-repull mirror push credential
      ansible.builtin.stat:
        path: "{{ harbor_repull_dir }}/mirror-push.env"
      register: harbor_repull_mirror_credential_stat

    - name: Generate a unique name for this role's mirror-push robot
      ansible.builtin.set_fact:
        harbor_repull_mirror_robot_suffix: "{{ now(fmt='%s') }}-{{ 9999 | random }}"
      when: not harbor_repull_mirror_credential_stat.stat.exists

    # Deliberately a fresh, uniquely-named robot rather than a fixed name
    # reused across deploys -- Harbor's GET /robots does not reliably
    # list/return project-scoped robots (confirmed in
    # deploy-pentagi-stack.yml), so an existence check or delete-by-lookup
    # before recreating isn't trustworthy. A unique name sidesteps that
    # entirely: this task only ever runs when the local credential file is
    # missing, so POST always succeeds with 201 the first time -- no 409
    # case to handle, and no dependency on SOPS, since the secret only ever
    # needs to exist on this one host. Deliberately NOT the shared
    # 'robot$ci-runner' system-level robot -- its SOPS secret is already
    # known stale (see docs/harbor-stack/README.md,
    # [[project_harbor_ci_robot_credential_mismatch]] in memory) and that
    # credential is also shared with GitHub Actions CI workflows.
    - name: Create project-scoped Harbor robot for harbor-repull mirror pushes
      ansible.builtin.uri:
        url: "http://{{ harbor_repull_admin_host }}:{{ harbor_repull_admin_port }}/api/v2.0/robots"
        method: POST
        url_username: "{{ harbor_repull_admin_user }}"
        url_password: "{{ harbor_repull_admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "repull-push-{{ harbor_repull_mirror_robot_suffix }}"
          description: "harbor_repull role only (ci-runner-01) -- push/pull for the mirror project's pull-then-push artifacts, not shared with CI"
          duration: -1
          level: "project"
          permissions:
            - kind: "project"
              namespace: "{{ harbor_repull_mirror_project }}"
              access:
                - resource: "repository"
                  action: "pull"
                - resource: "repository"
                  action: "push"
        status_code: 201
      register: harbor_repull_mirror_robot_create
      when: not harbor_repull_mirror_credential_stat.stat.exists
      delegate_to: localhost
      no_log: true

    - name: Write harbor-repull mirror push credential file
      ansible.builtin.copy:
        dest: "{{ harbor_repull_dir }}/mirror-push.env"
        owner: root
        group: root
        mode: "0600"
        content: |
          # harbor-repull mirror push credential - managed by Ansible, do not edit by hand
          HARBOR_REPULL_MIRROR_USER={{ harbor_repull_mirror_robot_create.json.name }}
          HARBOR_REPULL_MIRROR_PASSWORD={{ harbor_repull_mirror_robot_create.json.secret }}
      when: not harbor_repull_mirror_credential_stat.stat.exists
      no_log: true

    - name: Write harbor-repull systemd service
      ansible.builtin.template:
        src: harbor-repull.service.j2
        dest: /etc/systemd/system/harbor-repull.service
        owner: root
        group: root
        mode: "0644"  # nosonar: ansible:S2612 - standard systemd unit file permissions
      notify: Reload systemd

    - name: Write harbor-repull systemd timer
      ansible.builtin.template:
        src: harbor-repull.timer.j2
        dest: /etc/systemd/system/harbor-repull.timer
        owner: root
        group: root
        mode: "0644"  # nosonar: ansible:S2612 - standard systemd unit file permissions
      notify: Reload systemd

    - name: Flush handlers before enabling timer
      ansible.builtin.meta: flush_handlers

    - name: Enable and start harbor-repull timer
      ansible.builtin.systemd:
        name: harbor-repull.timer
        enabled: true
        state: started
      when: not ansible_check_mode
