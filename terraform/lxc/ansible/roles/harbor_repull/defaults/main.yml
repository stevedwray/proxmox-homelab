---
# Defaults for harbor_repull role — see
# docs/harbor-stack/image-sourcing-enforcement.md Stage C.

# Explicit opt-in, matching portainer_backup_enabled's pattern — this role
# should only ever be included on the one host running the job (ci-runner-01),
# not on every stack that happens to include shared roles.
harbor_repull_enabled: false

harbor_repull_dir: /opt/harbor-repull
harbor_repull_manifest_path: "{{ harbor_repull_dir }}/manifest.txt"
harbor_repull_log_path: /var/log/harbor-repull.log

# Must be the FQDN (routed through Traefik), not LAB_IP_HARBOR — see
# docs/harbor-stack/image-sourcing-enforcement.md Finding 5.
harbor_repull_registry_host: "{{ lookup('env', 'LAB_FQDN_HARBOR') | default('harbor.' ~ (lookup('env', 'LAB_DOMAIN') | default('lab.gibbsgreatly.xyz', true)), true) }}"

# systemd OnCalendar expression. Default: once daily, off-the-hour to avoid
# a thundering-herd alignment with other scheduled jobs.
harbor_repull_on_calendar: "*-*-* 03:17:00"

# Push-based mirror project (fixes the proxy-cache tag-creation bug -- see
# docs/harbor-stack/README.md Open Investigation). After a successful pull,
# any manifest entry whose project prefix isn't in
# harbor_repull_mirror_skip_projects also gets docker-tagged and pushed
# into harbor_repull_mirror_project, so it ends up durably tagged and
# scan-tracked instead of relying on the broken proxy-cache tag-creation
# path.
#
# Originally skipped dockerhub here, on the assumption its native
# docker-hub adapter always tags correctly. A full production vulnerability
# audit (2026-08-15) disproved that: grafana-oss, victoria-metrics, traefik,
# and portainer-ce -- all dockerhub, all pulled nightly by this same role --
# showed up with a single untagged artifact each. Root cause not fully
# chased down (retention's tag_selectors likely can't protect an artifact
# that loses its tag for any reason, regardless of adapter type), but the
# fix already built here is adapter-agnostic, so mirror everything instead
# of trying to special-case which adapters are "safe".
harbor_repull_mirror_project: mirror
harbor_repull_mirror_skip_projects: []

# Harbor admin API access, needed only to provision this role's own
# project-scoped push robot (see tasks/main.yml) -- never used at runtime
# by harbor_repull.py itself, which only ever uses the robot credential
# written to harbor_repull_dir.
harbor_repull_admin_host: "{{ lookup('env', 'LAB_IP_HARBOR') | mandatory('LAB_IP_HARBOR env var not set') }}"
harbor_repull_admin_port: "{{ lookup('env', 'HARBOR_HTTP_PORT') | default(80, true) }}"
harbor_repull_admin_user: admin
harbor_repull_admin_password: "{{ lookup('env', 'HARBOR_ADMIN_PASSWORD') | mandatory('HARBOR_ADMIN_PASSWORD env var not set') }}"
