---
# Native Icinga 2 HA pair for argon-01/argon-02 (+ SmokePing and, optionally,
# Icinga Web on argon-01). Docker, Portainer Agent, Wazuh Agent, node_exporter
# and rsyslog forwarding are untouched. Debian's icinga2 drops to the
# `nagios` user for every invocation (CLI included), so anything icinga2 must
# write or read is nagios-owned, not root-owned -- see runbook Stage 1.4.

- name: Assert this role only targets the two Argon Pis
  ansible.builtin.assert:
    that:
      - inventory_hostname in icinga_observer_nodes
    fail_msg: >-
      icinga_observer only targets {{ icinga_observer_nodes.keys() | list }};
      refusing to run against {{ inventory_hostname }}.
    quiet: true

- name: Assert the Stage 2 core-check rollout is scoped to valid groups
  ansible.builtin.assert:
    that:
      - icinga_observer_core_check_groups is sequence
      - icinga_observer_core_check_groups is not string
      - icinga_observer_core_check_groups | difference(['router', 'dns', 'pve', 'metrics', 'internal_services', 'oci']) | length == 0
      - icinga_observer_core_check_groups | intersect(['dns', 'pve', 'metrics', 'internal_services']) | length == 0 or 'router' in icinga_observer_core_check_groups
      - not (icinga_observer_enable_oci_ssh_probe | bool) or 'oci' in icinga_observer_core_check_groups
    fail_msg: >-
      Stage 2 groups must be router, dns, pve, metrics, internal_services or
      oci. LAN groups require router; the OCI SSH probe requires oci.
    quiet: true

# --- Packages ---------------------------------------------------------------
- name: Install Icinga 2 and plugin packages (both Pis)
  ansible.builtin.include_tasks: install.yml
  vars:
    install_packages: "{{ icinga_observer_packages_common }}"
    install_probe: icinga2
    install_recommends: false

# Order matters: msmtp-mta (replaces exim4) and nginx-light must exist before
# smokeping, whose dependencies would otherwise pull in exim4 and apache2.
- name: Install nginx, fcgiwrap and a non-listening MTA (argon-01 only)
  ansible.builtin.include_tasks: install.yml
  vars:
    install_packages: "{{ icinga_observer_packages_master_only }}"
    install_probe: nginx-light
    install_recommends: false
  when: icinga_observer_is_master | bool

- name: Install SmokePing without its apache2 recommendation (argon-01 only)
  ansible.builtin.include_tasks: install.yml
  vars:
    install_packages: [smokeping]
    install_probe: smokeping
    install_recommends: false
  when: icinga_observer_is_master | bool

- name: Remove the apache2 and exim4 daemons SmokePing's stock dependencies pulled in
  ansible.builtin.apt:
    name: "{{ icinga_observer_packages_unwanted }}"
    state: absent
    purge: true

# --- Narrow host firewall (cluster port: peer only; SmokePing backend: Traefik only) ---
# nftables.service is inactive on these Pis and iptables (nf_tables backend)
# governs INPUT with policy ACCEPT and no other rules; Docker manages only its
# own FORWARD/NAT chains. iptables-persistent is not installed (it would also
# try to persist Docker's dynamic rules), so a small oneshot unit re-applies
# the idempotent script on boot, before icinga2.
- name: Write the firewall script
  ansible.builtin.template:
    src: firewall.sh.j2
    dest: /usr/local/sbin/icinga-cluster-firewall.sh
    owner: root
    group: root
    mode: "0750"
  notify: Apply Icinga observer firewall

- name: Install the firewall systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/icinga-cluster-firewall.service
    owner: root
    group: root
    mode: "0644"  # nosonar: ansible:S2612 — systemd unit file must be world-readable
    content: |
      [Unit]
      Description=Icinga observer host firewall (cluster port peer-only, SmokePing backend Traefik-only)
      Before=icinga2.service
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/icinga-cluster-firewall.sh
      RemainAfterExit=true

      [Install]
      WantedBy=multi-user.target
  notify: Apply Icinga observer firewall

- name: Enable the firewall unit
  ansible.builtin.systemd:
    name: icinga-cluster-firewall.service
    enabled: true
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"

# The rules must exist before icinga2 listens on a fresh host.
- name: Apply the firewall now
  ansible.builtin.meta: flush_handlers

# --- Directories and trust ----------------------------------------------------
- name: Ensure icinga2's certificate directory is nagios-owned
  ansible.builtin.file:
    path: "{{ icinga_observer_cert_dir }}"
    state: directory
    owner: nagios
    group: nagios
    mode: "0700"

- name: Create the notification scripts directory (nagios-owned -- icinga2 executes these as nagios)
  ansible.builtin.file:
    path: "{{ icinga_observer_scripts_dir }}"
    state: directory
    owner: nagios
    group: nagios
    mode: "0700"

- name: Create the check scripts directory (both Pis)
  ansible.builtin.file:
    path: "{{ icinga_observer_check_scripts_dir }}"
    state: directory
    owner: root
    group: nagios
    mode: "0750"

- name: Install the DNS-over-TCP check on both Pis before enabling the DNS group
  ansible.builtin.template:
    src: check-dns-tcp.sh.j2
    dest: "{{ icinga_observer_check_scripts_dir }}/check-dns-tcp.sh"
    owner: nagios
    group: nagios
    mode: "0700"

- name: Install the homelab root CA for plugin-side verification of internal (step-ca) services
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../certs/homelab-root.crt"
    dest: "{{ icinga_observer_ca_bundle }}"
    owner: root
    group: nagios
    mode: "0644"  # nosonar: ansible:S2612 — public CA certificate

- name: Create zones.d directory (configuration master only)
  ansible.builtin.file:
    path: "{{ icinga_observer_zones_d_dir }}/master"
    state: directory
    owner: root
    group: nagios
    mode: "0750"
  when: icinga_observer_is_master | bool

# --- Certificates -------------------------------------------------------------
# Local CA generated on argon-01 during the initial controlled deployment; the
# private CA key never leaves /var/lib/icinga2/ca and is never copied to this
# repo or to OpenBao (runbook Stage 1.1). Internal cluster trust only: no
# browser ever sees these -- browser-facing TLS is Let's Encrypt, never this CA
# or step-ca.
- name: Check whether the local CA already exists (master)
  ansible.builtin.stat:
    path: /var/lib/icinga2/ca/ca.crt
  register: icinga_observer_ca_stat
  when: icinga_observer_is_master | bool

- name: Create the local Icinga CA (master, first run only)
  ansible.builtin.command: icinga2 pki new-ca
  when:
    - icinga_observer_is_master | bool
    - not icinga_observer_ca_stat.stat.exists

- name: Check whether this node's certificate already exists
  ansible.builtin.stat:
    path: "{{ icinga_observer_cert_dir }}/{{ icinga_observer_self_name }}.crt"
  register: icinga_observer_cert_stat

- name: Generate this node's private key and CSR
  ansible.builtin.command: >-
    icinga2 pki new-cert --cn {{ icinga_observer_self_name }}
    --key {{ icinga_observer_cert_dir }}/{{ icinga_observer_self_name }}.key
    --csr {{ icinga_observer_cert_dir }}/{{ icinga_observer_self_name }}.csr
    --cert {{ icinga_observer_cert_dir }}/{{ icinga_observer_self_name }}.crt
  when: not icinga_observer_cert_stat.stat.exists

- name: Self-sign the master's own certificate from its local CA
  ansible.builtin.command: >-
    icinga2 pki sign-csr
    --csr {{ icinga_observer_cert_dir }}/{{ icinga_observer_self_name }}.csr
    --cert {{ icinga_observer_cert_dir }}/{{ icinga_observer_self_name }}.crt
  notify: reload icinga2
  when:
    - icinga_observer_is_master | bool
    - not icinga_observer_cert_stat.stat.exists

# The master and peer are deployed as two separate --limit runs (runbook
# Stage 1.1), so nothing here may rely on same-play hostvars from a run that
# already exited. `delegate_to` opens a fresh connection to argon-01 for these
# few tasks regardless of this invocation's --limit set.
- name: Read the master's CA certificate
  ansible.builtin.slurp:
    src: /var/lib/icinga2/ca/ca.crt
  delegate_to: "{{ icinga_observer_master_name }}"
  register: icinga_observer_ca_cert_b64
  when: not ansible_check_mode

- name: Distribute the CA certificate to this node
  ansible.builtin.copy:
    dest: "{{ icinga_observer_cert_dir }}/ca.crt"
    owner: nagios
    group: nagios
    mode: "0644"  # nosonar: ansible:S2612 — public CA certificate; directory is nagios 0700
    content: "{{ icinga_observer_ca_cert_b64.content | b64decode }}"
  notify: reload icinga2
  when:
    - not ansible_check_mode
    - icinga_observer_ca_cert_b64 is defined
    - icinga_observer_ca_cert_b64 is not skipped

- name: Check whether this node's certificate is already signed by the shared CA (peer only)
  # `icinga2 pki new-cert` writes a self-signed placeholder at the same
  # --cert path as a side effect of generating the key/CSR, so a bare
  # exists-check wrongly looked "done" for the peer (2026-10-25).
  ansible.builtin.command: >-
    openssl verify -CAfile {{ icinga_observer_cert_dir }}/ca.crt
    {{ icinga_observer_cert_dir }}/{{ icinga_observer_self_name }}.crt
  register: icinga_observer_peer_cert_verify
  changed_when: false
  failed_when: false
  when:
    - not icinga_observer_is_master | bool
    - not ansible_check_mode

- name: Read this node's own CSR to send for signing (peer only)
  ansible.builtin.slurp:
    src: "{{ icinga_observer_cert_dir }}/{{ icinga_observer_self_name }}.csr"
  register: icinga_observer_own_csr_b64
  when:
    - not icinga_observer_is_master | bool
    - not ansible_check_mode
    - icinga_observer_peer_cert_verify.rc != 0

- name: Copy this node's CSR onto the master for signing (peer only)
  ansible.builtin.copy:
    dest: "/tmp/{{ icinga_observer_self_name }}.csr"
    owner: nagios
    group: nagios
    mode: "0600"
    content: "{{ icinga_observer_own_csr_b64.content | b64decode }}"
  delegate_to: "{{ icinga_observer_master_name }}"
  when:
    - not icinga_observer_is_master | bool
    - not ansible_check_mode
    - icinga_observer_own_csr_b64 is defined
    - icinga_observer_own_csr_b64 is not skipped

- name: Sign this node's certificate on the master (peer only)
  ansible.builtin.command: >-
    icinga2 pki sign-csr --csr /tmp/{{ icinga_observer_self_name }}.csr
    --cert /tmp/{{ icinga_observer_self_name }}.crt
  delegate_to: "{{ icinga_observer_master_name }}"
  changed_when: true
  when:
    - not icinga_observer_is_master | bool
    - not ansible_check_mode
    - icinga_observer_own_csr_b64 is defined
    - icinga_observer_own_csr_b64 is not skipped

- name: Read the signed certificate back from the master (peer only)
  ansible.builtin.slurp:
    src: "/tmp/{{ icinga_observer_self_name }}.crt"
  delegate_to: "{{ icinga_observer_master_name }}"
  register: icinga_observer_own_cert_signed
  when:
    - not icinga_observer_is_master | bool
    - not ansible_check_mode
    - icinga_observer_own_csr_b64 is defined
    - icinga_observer_own_csr_b64 is not skipped

- name: Remove this node's temporary CSR/cert copies from the master (peer only)
  ansible.builtin.file:
    path: "/tmp/{{ icinga_observer_self_name }}.{{ item }}"
    state: absent
  delegate_to: "{{ icinga_observer_master_name }}"
  loop:
    - csr
    - crt
  when:
    - not icinga_observer_is_master | bool
    - not ansible_check_mode
    - icinga_observer_own_csr_b64 is defined
    - icinga_observer_own_csr_b64 is not skipped

- name: Install the master-signed certificate (peer only)
  ansible.builtin.copy:
    dest: "{{ icinga_observer_cert_dir }}/{{ icinga_observer_self_name }}.crt"
    owner: nagios
    group: nagios
    mode: "0644"  # nosonar: ansible:S2612 — public node certificate; directory is nagios 0700
    content: "{{ icinga_observer_own_cert_signed.content | b64decode }}"
  notify: reload icinga2
  when:
    - not icinga_observer_is_master | bool
    - not ansible_check_mode
    - icinga_observer_own_cert_signed is defined
    - icinga_observer_own_cert_signed is not skipped

- name: Enforce private key permissions
  ansible.builtin.file:
    path: "{{ icinga_observer_cert_dir }}/{{ icinga_observer_self_name }}.key"
    owner: nagios
    group: nagios
    mode: "0600"
  ignore_errors: "{{ ansible_check_mode }}"

# Earlier revisions kept the material in /etc/icinga2/pki and pointed the
# ApiListener at it with deprecated cert_path/key_path/ca_path attributes;
# icinga2 copied it into the standard directory itself. Drop the duplicate
# private key once the standard-location certificate is proven good.
- name: Verify the certificate in the standard location
  ansible.builtin.command: >-
    openssl verify -CAfile {{ icinga_observer_cert_dir }}/ca.crt
    {{ icinga_observer_cert_dir }}/{{ icinga_observer_self_name }}.crt
  register: icinga_observer_cert_verify
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Remove the legacy PKI directory (duplicate private key)
  ansible.builtin.file:
    path: "{{ icinga_observer_legacy_pki_dir }}"
    state: absent
  when: not ansible_check_mode and icinga_observer_cert_verify.rc == 0

# --- Core configuration -------------------------------------------------------
- name: Render constants.conf
  ansible.builtin.template:
    src: constants.conf.j2
    dest: /etc/icinga2/constants.conf
    owner: root
    group: nagios
    mode: "0640"
  notify: reload icinga2

- name: Render zones.conf
  ansible.builtin.template:
    src: zones.conf.j2
    dest: /etc/icinga2/zones.conf
    owner: root
    group: nagios
    mode: "0640"
  notify: reload icinga2

- name: Render icinga2.conf
  ansible.builtin.template:
    src: icinga2.conf.j2
    dest: /etc/icinga2/icinga2.conf
    owner: root
    group: nagios
    mode: "0640"
  notify: reload icinga2

- name: Render the ApiListener feature (bound to this Pi's LAN address)
  ansible.builtin.template:
    src: api.conf.j2
    dest: /etc/icinga2/features-available/api.conf
    owner: root
    group: nagios
    mode: "0640"
  notify: reload icinga2

- name: Render host/peer objects (configuration master only)
  ansible.builtin.template:
    src: hosts.conf.j2
    dest: "{{ icinga_observer_zones_d_dir }}/master/hosts.conf"
    owner: root
    group: nagios
    mode: "0640"
  when: icinga_observer_is_master | bool
  notify: reload icinga2

- name: Render service checks (configuration master only)
  ansible.builtin.template:
    src: services.conf.j2
    dest: "{{ icinga_observer_zones_d_dir }}/master/services.conf"
    owner: root
    group: nagios
    mode: "0640"
  when: icinga_observer_is_master | bool
  notify: reload icinga2

- name: Render notification objects (configuration master only, Stage 3)
  ansible.builtin.template:
    src: notifications.conf.j2
    dest: "{{ icinga_observer_zones_d_dir }}/master/notifications.conf"
    owner: root
    group: nagios
    mode: "0640"
  when:
    - icinga_observer_is_master | bool
    - icinga_observer_enable_notifications | bool
  notify: reload icinga2

- name: Remove notification objects when Stage 3 is not yet enabled
  ansible.builtin.file:
    path: "{{ icinga_observer_zones_d_dir }}/master/notifications.conf"
    state: absent
  when:
    - icinga_observer_is_master | bool
    - not icinga_observer_enable_notifications | bool
  notify: reload icinga2

# --- Notification scripts and secrets (Stage 3) -------------------------------
# Secrets are injected by ./with-secrets-prod at deploy time and written to a
# nagios-only file; nothing reads OpenBao at runtime.
- name: Assert notification secrets are present when rendering scripts
  ansible.builtin.assert:
    that:
      - icinga_observer_discord_webhook_url | length > 0
      - icinga_observer_telegram_bot_token | length > 0
      - icinga_observer_telegram_chat_id | length > 0
    fail_msg: >-
      ICINGA_DISCORD_WEBHOOK_URL, ICINGA_TELEGRAM_BOT_TOKEN and
      ICINGA_TELEGRAM_CHAT_ID must all be set. Run via ./with-secrets-prod
      once services/icinga-observer exists in OpenBao and the manifest.
    quiet: true
  when:
    - icinga_observer_is_master | bool
    - icinga_observer_enable_notifications | bool
    - not ansible_check_mode

- name: Write the notification EnvironmentFile (configuration master only)
  ansible.builtin.copy:
    dest: "{{ icinga_observer_env_file }}"
    owner: nagios
    group: nagios
    mode: "0600"
    content: |
      ICINGA_DISCORD_WEBHOOK_URL={{ icinga_observer_discord_webhook_url }}
      ICINGA_TELEGRAM_BOT_TOKEN={{ icinga_observer_telegram_bot_token }}
      ICINGA_TELEGRAM_CHAT_ID={{ icinga_observer_telegram_chat_id }}
  no_log: true
  when:
    - icinga_observer_is_master | bool
    - icinga_observer_enable_notifications | bool
    - not ansible_check_mode

- name: Render the Discord notification script (configuration master only)
  ansible.builtin.template:
    src: notification-discord.sh.j2
    dest: "{{ icinga_observer_scripts_dir }}/notification-discord.sh"
    owner: nagios
    group: nagios
    mode: "0700"
  when:
    - icinga_observer_is_master | bool
    - icinga_observer_enable_notifications | bool

- name: Render the Telegram notification script (configuration master only)
  ansible.builtin.template:
    src: notification-telegram.sh.j2
    dest: "{{ icinga_observer_scripts_dir }}/notification-telegram.sh"
    owner: nagios
    group: nagios
    mode: "0700"
  when:
    - icinga_observer_is_master | bool
    - icinga_observer_enable_notifications | bool

- name: Create the notification audit log
  ansible.builtin.file:
    path: /var/log/icinga2/notifications-audit.log
    state: touch
    owner: nagios
    group: nagios
    mode: "0640"
    access_time: preserve
    modification_time: preserve
  when:
    - icinga_observer_is_master | bool
    - icinga_observer_enable_notifications | bool

# --- Features ---------------------------------------------------------------
- name: Enable the Icinga 2 API feature
  ansible.builtin.command: icinga2 feature enable api
  register: icinga_observer_api_feature
  changed_when: "'already enabled' not in icinga_observer_api_feature.stdout"
  notify: reload icinga2

# Icinga's own log lives in /var/log/icinga2/icinga2.log, which rsyslog does
# not read; the syslog feature sends warning-and-above to /dev/log so the
# existing Pi rsyslog forwarding ships it to Graylog (evidence only).
- name: Enable the syslog feature (Icinga warnings and errors reach Graylog via rsyslog)
  ansible.builtin.command: icinga2 feature enable syslog
  register: icinga_observer_syslog_feature
  changed_when: "'already enabled' not in icinga_observer_syslog_feature.stdout"
  notify: reload icinga2

- name: Validate Icinga 2 configuration before enabling the service
  ansible.builtin.command: icinga2 daemon -C
  register: icinga_observer_config_check
  changed_when: false
  check_mode: false

- name: Enable and start icinga2
  ansible.builtin.systemd:
    name: icinga2
    enabled: true
    state: started
    daemon_reload: true
  when: icinga_observer_config_check.rc == 0
  ignore_errors: "{{ ansible_check_mode }}"

# --- nginx / SmokePing (argon-01 only) ----------------------------------------
# The package's default site listens on 0.0.0.0:80 with the stock welcome page.
- name: Disable the default nginx site (argon-01 only)
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  when: icinga_observer_is_master | bool
  notify: Restart nginx

- name: Render SmokePing configuration (argon-01 only)
  ansible.builtin.template:
    src: smokeping-config.j2
    dest: /etc/smokeping/config.d/Targets
    owner: root
    group: root
    mode: "0644"  # nosonar: ansible:S2612 — non-secret targets; smokeping's CGI (www-data) must read it, like the package's other config.d/* (0644)
  when:
    - icinga_observer_is_master | bool
    - icinga_observer_enable_smokeping | bool
  notify: Restart smokeping

- name: Set SmokePing CGI URL to the browser-facing address (argon-01 only)
  ansible.builtin.lineinfile:
    path: /etc/smokeping/config.d/General
    regexp: '^cgiurl\s*='
    line: "cgiurl   = {{ icinga_observer_smokeping_cgi_url }}"
  when:
    - icinga_observer_is_master | bool
    - icinga_observer_enable_smokeping | bool
  notify: Restart smokeping

- name: Render the SmokePing nginx vhost (argon-01 only)
  ansible.builtin.template:
    src: smokeping-nginx.conf.j2
    dest: /etc/nginx/sites-available/smokeping.conf
    owner: root
    group: root
    mode: "0640"
  when:
    - icinga_observer_is_master | bool
    - icinga_observer_enable_smokeping | bool
  notify: Restart nginx

- name: Enable the SmokePing nginx site (argon-01 only)
  ansible.builtin.file:
    src: /etc/nginx/sites-available/smokeping.conf
    dest: /etc/nginx/sites-enabled/smokeping.conf
    state: link
  when:
    - icinga_observer_is_master | bool
    - icinga_observer_enable_smokeping | bool
  notify: Restart nginx
  ignore_errors: "{{ ansible_check_mode }}"

- name: Enable and start smokeping, nginx and fcgiwrap (argon-01 only)
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - smokeping
    - nginx
    - fcgiwrap
  when:
    - icinga_observer_is_master | bool
    - icinga_observer_enable_smokeping | bool
  ignore_errors: "{{ ansible_check_mode }}"

# --- Icinga Web 2 + Icinga DB (argon-01 only, Stage 5) ---------------------------
- name: Icinga Web 2, Icinga DB and the Let's Encrypt certificate
  ansible.builtin.include_tasks: web.yml
  when:
    - icinga_observer_is_master | bool
    - icinga_observer_enable_web | bool
