---
- name: Remove scheduled T-Pot findings ingest when not explicitly enabled
  when: not (tpot_findings_ingest_enabled | bool)
  block:
    - name: Stop and disable tpot-findings-ingest timer
      ansible.builtin.systemd:
        name: tpot-findings-ingest.timer
        state: stopped
        enabled: false
      failed_when: false

    - name: Stop tpot-findings-ingest service if present
      ansible.builtin.systemd:
        name: tpot-findings-ingest.service
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove tpot-findings-ingest units and files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/tpot-findings-ingest.timer
        - /etc/systemd/system/tpot-findings-ingest.service
        - "{{ tpot_findings_ingest_dir }}"
      notify: Reload systemd

    - name: Clear stale tpot-findings-ingest service failure state
      ansible.builtin.command:
        cmd: systemctl reset-failed tpot-findings-ingest.service tpot-findings-ingest.timer
      failed_when: false
      changed_when: false

- name: Install scheduled T-Pot findings ingest when explicitly enabled
  when: tpot_findings_ingest_enabled | bool
  block:
    - name: Create tpot-findings-ingest directory
      ansible.builtin.file:
        path: "{{ tpot_findings_ingest_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Copy tpot_findings_sync.py
      ansible.builtin.copy:
        src: tpot_findings_sync.py
        dest: "{{ tpot_findings_ingest_dir }}/tpot_findings_sync.py"
        owner: root
        group: root
        mode: "0750"

    # ---------------------------------------------------------------
    # SSH tunnel key -- a dedicated keypair for this sync job (never the
    # operator's own interactive `steve` login key), sourced from
    # OpenBao. See defaults/main.yml and docs/tpot-honeypot/plan.md
    # Phase 2 for why this is mandatory rather than silently skipped.
    # ---------------------------------------------------------------

    - name: Materialize the T-Pot SSH tunnel private key
      ansible.builtin.copy:
        content: "{{ tpot_findings_ingest_ssh_private_key }}"
        dest: "{{ tpot_findings_ingest_ssh_key_path }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    # ---------------------------------------------------------------
    # Scoped OpenSearch internal user (destination) -- extends the
    # existing es_findings_writer role's index_patterns to also cover
    # tpot-events*, same technique wazuh_findings_ingest/
    # cve_enrichment_sync already used. Idempotent PUT.
    # ---------------------------------------------------------------

    - name: Check for existing OpenSearch findings-writer credential
      ansible.builtin.stat:
        path: "{{ tpot_findings_ingest_dir }}/es-user.env"
      register: tpot_findings_ingest_es_credential_stat

    - name: Check if OpenSearch is reachable before provisioning its scoped user
      ansible.builtin.wait_for:
        host: "{{ tpot_findings_ingest_elasticsearch_host }}"
        port: 9200
        timeout: 5
      register: tpot_findings_ingest_es_reachable
      ignore_errors: true
      when: not tpot_findings_ingest_es_credential_stat.stat.exists

    - name: Warn and skip OpenSearch user provisioning when it is not yet reachable
      ansible.builtin.debug:
        msg: >-
          OpenSearch at {{ tpot_findings_ingest_elasticsearch_host }}:9200 is not
          reachable (timeout). Skipping tpot-findings-ingest user creation --
          re-run provision once opensearch-stack is reachable.
      when:
        - not tpot_findings_ingest_es_credential_stat.stat.exists
        - tpot_findings_ingest_es_reachable.failed | default(true)

    - name: Generate a random password for the scoped OpenSearch user
      ansible.builtin.set_fact:
        tpot_findings_ingest_es_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
      when:
        - not tpot_findings_ingest_es_credential_stat.stat.exists
        - not (tpot_findings_ingest_es_reachable.failed | default(true))
      no_log: true

    - name: Ensure es_findings_writer role exists in OpenSearch (extended to tpot-events*)
      ansible.builtin.uri:
        url: "{{ tpot_findings_ingest_elasticsearch_url }}/_plugins/_security/api/roles/{{ tpot_findings_ingest_es_role_name }}"
        method: PUT
        url_username: "{{ tpot_findings_ingest_elastic_admin_user }}"
        url_password: "{{ tpot_findings_ingest_elastic_admin_password }}"
        validate_certs: "{{ not tpot_findings_ingest_es_no_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body:
          index_permissions:
            - index_patterns:
                - "harbor-findings*"
                - "gvm-findings*"
                - "es-findings-sync-state"
                - "unified-cve-exposure*"
                - "wazuh-findings*"
                - "tpot-events*"
              allowed_actions:
                - "create_index"
                - "write"
                - "read"
        status_code: [200, 201]
      delegate_to: localhost

    - name: Ensure scoped OpenSearch user exists
      ansible.builtin.uri:
        url: "{{ tpot_findings_ingest_elasticsearch_url }}/_plugins/_security/api/internalusers/{{ tpot_findings_ingest_es_user_name }}"
        method: PUT
        url_username: "{{ tpot_findings_ingest_elastic_admin_user }}"
        url_password: "{{ tpot_findings_ingest_elastic_admin_password }}"
        validate_certs: "{{ not tpot_findings_ingest_es_no_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body:
          password: "{{ tpot_findings_ingest_es_password }}"
          opendistro_security_roles:
            - "{{ tpot_findings_ingest_es_role_name }}"
          description: "tpot_findings_ingest service account (secpipe-stack) -- never the admin superuser"
        status_code: [200, 201]
      when:
        - not tpot_findings_ingest_es_credential_stat.stat.exists
        - not (tpot_findings_ingest_es_reachable.failed | default(true))
      delegate_to: localhost
      no_log: true

    - name: Write OpenSearch findings-writer credential file
      ansible.builtin.copy:
        dest: "{{ tpot_findings_ingest_dir }}/es-user.env"
        owner: root
        group: root
        mode: "0600"
        content: |
          # tpot-findings-ingest OpenSearch user credential - managed by Ansible, do not edit by hand
          ES_FINDINGS_USER={{ tpot_findings_ingest_es_user_name }}
          ES_FINDINGS_PASSWORD={{ tpot_findings_ingest_es_password }}
      when:
        - not tpot_findings_ingest_es_credential_stat.stat.exists
        - not (tpot_findings_ingest_es_reachable.failed | default(true))
      no_log: true

    - name: Write tpot-findings-ingest systemd service
      ansible.builtin.template:
        src: tpot-findings-ingest.service.j2
        dest: /etc/systemd/system/tpot-findings-ingest.service
        owner: root
        group: root
        mode: "0644"  # nosonar: ansible:S2612 - standard systemd unit file permissions
      notify: Reload systemd

    - name: Write tpot-findings-ingest systemd timer
      ansible.builtin.template:
        src: tpot-findings-ingest.timer.j2
        dest: /etc/systemd/system/tpot-findings-ingest.timer
        owner: root
        group: root
        mode: "0644"  # nosonar: ansible:S2612 - standard systemd unit file permissions
      notify: Reload systemd

    - name: Flush handlers before enabling timer
      ansible.builtin.meta: flush_handlers

    - name: Enable and start tpot-findings-ingest timer
      ansible.builtin.systemd:
        name: tpot-findings-ingest.timer
        enabled: true
        state: started
      when: not ansible_check_mode
