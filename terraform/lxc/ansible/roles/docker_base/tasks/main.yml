# terraform/ansible/shared-roles/docker_base/tasks/main.yml

---
- name: Ensure Docker service is running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Install Docker Python SDK via system packages
  ansible.builtin.apt:
    name: python3-docker
    state: present
    update_cache: true

- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present

- name: Add user to docker group
  ansible.builtin.user:
    name: root
    groups: docker
    append: true

- name: Check if registry mirror should be configured
  ansible.builtin.set_fact:
    docker_base_configure_mirror: "{{ enable_registry_mirror | default(false) | bool and docker_registry_mirror is defined }}"

- name: Configure Docker daemon for registry mirror
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    backup: true
    mode: '0644'
  notify: restart docker
  when: docker_base_configure_mirror | bool

- name: Restart Docker service if configuration changed
  ansible.builtin.systemd:
    name: docker
    state: restarted
  when: docker_base_configure_mirror | bool

- name: Wait for Docker daemon to restart
  ansible.builtin.wait_for:
    port: 2375
    host: localhost
    timeout: 30
  failed_when: false
  when: docker_base_configure_mirror | bool

- name: Verify Docker daemon is responsive
  ansible.builtin.command: docker info
  register: docker_base_docker_info
  changed_when: false
  retries: 5
  delay: 2
  until: docker_base_docker_info.rc == 0
  when: docker_base_configure_mirror | bool

- name: Validate registry mirror configuration
  ansible.builtin.shell:
    cmd: set -o pipefail && docker info | grep -A 5 "Registry Mirrors"
    executable: /bin/bash
  register: docker_base_registry_check
  changed_when: false
  failed_when: false
  when: docker_base_configure_mirror | bool

- name: Display registry mirror status
  ansible.builtin.debug:
    msg: "Registry mirror configured: {{ docker_registry_mirror if docker_base_configure_mirror else 'Not configured' }}"

- name: Test registry connectivity
  ansible.builtin.uri:
    url: "http://{{ docker_registry_mirror }}:5001/v2/"
    method: GET
    timeout: 10
  register: docker_base_registry_test
  failed_when: false
  when: docker_base_configure_mirror | bool

- name: Display registry connectivity status
  ansible.builtin.debug:
    msg: "Registry connectivity: {{ 'Success' if docker_base_registry_test.status == 200 else 'Failed' }}"
  when: docker_base_configure_mirror | bool
