---
# Defaults for cve_enrichment_sync role -- see docs/threat-vuln-platform/
# plan.md. Explicit opt-in, matching es_findings_ingest_enabled/
# gvm_findings_ingest_enabled's pattern -- only ever included on
# secpipe-stack, gated by a flag so it never silently attaches to any
# other host that happens to reuse this role file.
cve_enrichment_sync_enabled: false

cve_enrichment_sync_dir: /opt/cve-enrichment-sync
cve_enrichment_sync_log_path: /var/log/cve-enrichment-sync.log

# Daily, after both Harbor's repull/scan cycle (finishes ~04:20-04:35 UTC,
# see project_harbor_alerting_automation_plan memory) and GVM's own
# findings-ingest timer (19:00 UTC) -- gives a comfortable margin so
# both source indices are fresh before this runs.
cve_enrichment_sync_on_calendar: "*-*-* 21:00:00"

# --- cve-mcp-server connection -------------------------------------------
# mcp-utility-stack lives in the same ai_seg zone as this stack -- no
# cross-zone firewall rule needed for this hop. Confirmed live during
# planning: a real MCP tools/list call against this exact URL succeeded.
cve_enrichment_sync_mcp_host: "{{ lookup('env', 'LAB_IP_MCP_UTILITY') | mandatory('LAB_IP_MCP_UTILITY env var is required') }}"
cve_enrichment_sync_mcp_url: "http://{{ cve_enrichment_sync_mcp_host }}:8000/mcp"
cve_enrichment_sync_triage_depth: standard

# --- LLM provider (see cve_enrichment_sync.py's module docstring and
# plan.md's "LLM narrative step" / Phase 6 sections) ----------------------
# Still anthropic for the standing scheduled timer as of 2026-09-01 --
# the operator has confirmed framework's local Ollama GPU now has
# standing capacity (the 2026-08-18 "occupied with benchmarking" reason
# no longer applies) and wants to migrate, but that switch happens after
# validating output quality via small --max-cves-capped manual test runs
# (cve_enrichment_sync_max_cves below), not by flipping this default
# blind. Swap this default once that validation is done.
cve_enrichment_sync_llm_provider: anthropic
cve_enrichment_sync_anthropic_api_key: "{{ lookup('env', 'ANTHROPIC_API_KEY') | default('', true) }}"
cve_enrichment_sync_openai_api_key: "{{ lookup('env', 'OPENAI_API_KEY') | default('', true) }}"
# Framework's llama-server (Nathanw llama.cpp fork), which replaced Ollama
# on framework in 2026-09 -- docs/framework-ip-and-port/plan.md. By name,
# never by IP. The key is the same LLM_GPU_STACK_API_KEY the server is
# started with; it lands in llm-user.env, never in a unit's Environment=.
cve_enrichment_sync_llamacpp_url: "http://{{ lookup('env', 'LAB_FQDN_FRAMEWORK') | default('framework.gibbsgreatly.xyz', true) }}:8080"
cve_enrichment_sync_llamacpp_model: qwen3.8-flash-next
cve_enrichment_sync_llamacpp_api_key: "{{ lookup('env', 'LLM_GPU_STACK_API_KEY') | default('', true) }}"
# Output cap per call. The prompt plus this must fit the server's context
# (framework_llamacpp_chat_ctx_size = 131072, ansible/00-initial-setup/
# framework-desktop-llamacpp-native.yml) -- the reasoning model spends part
# of this cap thinking before any content appears. 4096 was too tight:
# confirmed live 2026-09-29, 5 of 15 deep-dive CVEs got zero content
# (finish_reason='length') at that cap. Raised to 16384 -- still a small
# fraction of the 131k context, plenty of headroom for both the prompt and
# a generous reasoning budget.
cve_enrichment_sync_llamacpp_max_tokens: 16384

# Caps CVEs processed per run (0 = unlimited, the standing scheduled
# timer's behavior). Set to a small number (e.g. 10-20) for a fast manual
# test run -- see the "quick test run" invocation in plan.md's Phase 6
# section -- without waiting on or paying for a full-corpus sweep.
cve_enrichment_sync_max_cves: 0

# --- OpenSearch connection -----------------------------------------------
# Same opensearch-stack target and HTTPS/self-signed-cert reasoning as
# es_findings_ingest/gvm_findings_ingest's own defaults.
cve_enrichment_sync_elasticsearch_host: "{{ lookup('env', 'LAB_IP_OPENSEARCH') | mandatory('LAB_IP_OPENSEARCH env var is required') }}"
cve_enrichment_sync_elasticsearch_url: "https://{{ cve_enrichment_sync_elasticsearch_host }}:9200"
cve_enrichment_sync_es_no_verify_tls: true

# OpenSearch admin superuser -- needed only to bootstrap this role's own
# scoped OpenSearch user and to idempotently apply index templates
# (es_setup_assets.py, shared with es_findings_ingest/gvm_findings_ingest).
# Never used at runtime by cve_enrichment_sync.py.
cve_enrichment_sync_elastic_admin_user: admin
cve_enrichment_sync_elastic_admin_password: "{{ lookup('env', 'OPENSEARCH_ADMIN_PASSWORD') | mandatory('OPENSEARCH_ADMIN_PASSWORD env var is required') }}"

# Reuses es_findings_ingest's own es_findings_writer OpenSearch role
# (this role's own tasks/main.yml extends its index_patterns to include
# unified-cve-exposure*) rather than defining a second role. A distinct
# internal-user identity keeps this role's credential independently
# rotatable/revocable from es_findings_ingest's and gvm_findings_ingest's.
# This role also needs read access to harbor-findings/gvm-findings (for
# the CVE aggregation) and update access (for the severity_assessed
# write-back) -- OpenSearch's "write" action group is documented to
# include indices:data/write/update/byquery, so the existing "write"+
# "read" grant should already cover both without a broader role change.
# Verify this live on first real deploy rather than trusting the docs
# alone -- update this comment once confirmed.
cve_enrichment_sync_es_role_name: es_findings_writer
cve_enrichment_sync_es_user_name: cve_enrichment_sync

# --- CVE deep-dive (Phase 11) ---------------------------------------------
# Separate, narrower, architecture-aware pass over only the worst/most-
# exploitable CVEs -- see cve_deep_dive.py's module docstring. Explicit
# opt-in, independent of cve_enrichment_sync_enabled's own gate (though it
# only ever actually runs nested inside that flag's block, since it reuses
# that role's directory/credentials). Operator-confirmed 2026-09-03: use
# Ollama/laguna from day one for this new work -- NOT a switch of
# cve_enrichment_sync_llm_provider's own standing default above, which
# stays gated behind its own separate quality-validation step.
cve_enrichment_sync_deep_dive_enabled: false

# Weekly, not daily -- the shortlist (KEV-listed/PoC-available CVEs
# already in production) doesn't meaningfully change day to day, and each
# assessment is a heavier prompt (full architecture context) than the
# routine narrative. Sundays, well after the daily 21:00 UTC enrichment
# sync plus margin.
cve_enrichment_sync_deep_dive_on_calendar: "Sun *-*-* 23:00:00"

# How many of the worst CVEs (by risk_score, KEV-listed or PoC-available,
# in_production:true) get a full architecture-aware assessment per run.
cve_enrichment_sync_deep_dive_top_n: 15

# Same Framework llama-server endpoint as the routine narrative -- kept as
# its own variables so the deep-dive can move independently.
cve_enrichment_sync_deep_dive_llamacpp_url: "{{ cve_enrichment_sync_llamacpp_url }}"
cve_enrichment_sync_deep_dive_llamacpp_model: "{{ cve_enrichment_sync_llamacpp_model }}"
