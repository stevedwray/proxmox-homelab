# terraform/ansible/shared-roles/lxc_tun_device/tasks/main.yml

---
- name: Get container VMID via SSH command
  command: pct list
  register: pct_list
  delegate_to: "{{ pve_host }}"
  vars:
    ansible_user: "{{ pve_ssh_user | default('root') }}"
    ansible_ssh_private_key_file: "{{ hostvars[inventory_hostname]['ansible_ssh_private_key_file'] }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

- name: Find container VMID by hostname
  set_fact:
    container_vmid: "{{ item.split()[0] }}"
  loop: "{{ pct_list.stdout_lines }}"
  when: 
    - item is defined
    - inventory_hostname in item
  delegate_to: localhost

- name: Debug container search
  debug:
    msg: 
      - "Looking for hostname: {{ inventory_hostname }}"
      - "Found VMID: {{ container_vmid | default('NOT FOUND') }}"
      - "PCT list output: {{ pct_list.stdout_lines }}"

- name: Fail if container VMID not found
  fail:
    msg: "Container with hostname '{{ inventory_hostname }}' not found in pct list"
  when: container_vmid is not defined

- name: Check if tun device configuration already exists
  lineinfile:
    path: "/etc/pve/lxc/{{ container_vmid }}.conf"
    line: "lxc.cgroup2.devices.allow: c 10:200 rwm"
    state: present
  delegate_to: "{{ pve_host }}"
  vars:
    ansible_user: "{{ pve_ssh_user | default('root') }}"
    ansible_ssh_private_key_file: "{{ hostvars[inventory_hostname]['ansible_ssh_private_key_file'] }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
  check_mode: yes
  register: tun_config_check

- name: Skip configuration if already present
  debug:
    msg: "Tun device already configured for container {{ container_vmid }}"
  when: not tun_config_check.changed

- name: Configure tun device if needed
  block:
    - name: Stop container for configuration
      command: pct stop {{ container_vmid }}
      delegate_to: "{{ pve_host }}"
      vars:
        ansible_user: "{{ pve_ssh_user | default('root') }}"
        ansible_ssh_private_key_file: "{{ hostvars[inventory_hostname]['ansible_ssh_private_key_file'] }}"
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
      register: stop_result
      failed_when: stop_result.rc != 0 and "not running" not in stop_result.stderr

    - name: Wait for container to stop
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        state: stopped
        timeout: 30

    - name: Configure /dev/net/tun in LXC config
      lineinfile:
        path: "/etc/pve/lxc/{{ container_vmid }}.conf"
        line: "{{ item }}"
        backup: yes
      loop:
        - "lxc.cgroup2.devices.allow: c 10:200 rwm"
        - "lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file"
      delegate_to: "{{ pve_host }}"
      vars:
        ansible_user: "{{ pve_ssh_user | default('root') }}"
        ansible_ssh_private_key_file: "{{ hostvars[inventory_hostname]['ansible_ssh_private_key_file'] }}"
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

    - name: Start container
      command: pct start {{ container_vmid }}
      delegate_to: "{{ pve_host }}"
      vars:
        ansible_user: "{{ pve_ssh_user | default('root') }}"
        ansible_ssh_private_key_file: "{{ hostvars[inventory_hostname]['ansible_ssh_private_key_file'] }}"
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

    - name: Wait for container to come back online
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 120

    - name: Verify tun device exists
      command: pct exec {{ container_vmid }} -- ls -la /dev/net/tun
      delegate_to: "{{ pve_host }}"
      vars:
        ansible_user: "{{ pve_ssh_user | default('root') }}"
        ansible_ssh_private_key_file: "{{ hostvars[inventory_hostname]['ansible_ssh_private_key_file'] }}"
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
      register: tun_verify
      failed_when: false

    - name: Display tun device status
      debug:
        msg: "Tun device verification: {{ 'SUCCESS' if tun_verify.rc == 0 else 'FAILED - device not found' }}"

  when: tun_config_check.changed
