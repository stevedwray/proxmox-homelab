---
# Default values for LXC tun device configuration
# pve_host and ansible_ssh_private_key_file should come from inventory.
# container_vmid is also available from inventory (set by Terraform).

# Container VMID - prefer the inventory variable set by Terraform;
# falls back to env var for backward compatibility.
container_vmid: "{{ vmid | default(lookup('env', 'CONTAINER_VMID')) }}"
