---
- name: Configure guest DNS resolver
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      nameserver {{ dns_server }}
    owner: root
    group: root
    mode: "0644"
  when: dns_server | default('', true) | string | length > 0

- name: Fall back to public DNS if configured resolver is not yet reachable
  ansible.builtin.shell: |
    if ! getent hosts deb.debian.org >/dev/null 2>&1; then
      printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' > /etc/resolv.conf
    fi
  args:
    executable: /bin/bash
  changed_when: false
  when: dns_server | default('', true) | string | length > 0

- name: Check if apt-cacher-ng is reachable before configuring proxy
  ansible.builtin.wait_for:
    host: "{{ apt_cacher_host }}"
    port: 3142
    timeout: 3
  register: lxc_base_apt_cacher_reachable
  ignore_errors: true
  when:
    - apt_cacher_host | default('', true) | string | length > 0
    - ansible_host | default('', true) | string != apt_cacher_host | string

- name: Configure apt to use apt-cacher-ng proxy
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/01proxy
    content: |
      Acquire::http::Proxy "http://{{ apt_cacher_host }}:3142";
    owner: root
    group: root
    mode: "0644"
  when:
    - apt_cacher_host | default('', true) | string | length > 0
    - ansible_host | default('', true) | string != apt_cacher_host | string
    - not (lxc_base_apt_cacher_reachable.failed | default(false))

- name: Remove apt-cacher-ng proxy config when apt-cacher is disabled or unreachable
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/01proxy
    state: absent
  when: >-
    apt_cacher_host | default('', true) | string | length == 0
    or ansible_host | default('', true) | string == apt_cacher_host | string
    or (lxc_base_apt_cacher_reachable.failed | default(false))

- name: Check for env-specific homelab root CA on control node
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../../../certs/homelab-root.{{ lookup('env', 'PVE_ENV') }}.crt"
  delegate_to: localhost
  become: false
  register: lxc_base_env_ca_stat
  when: lookup('env', 'PVE_ENV') | length > 0

- name: Check whether shared homelab root CA exists on control node
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../../../certs/homelab-root.crt"
  delegate_to: localhost
  become: false
  register: lxc_base_homelab_root_ca_local

- name: Resolve root CA source path (env-specific if available, else shared)
  ansible.builtin.set_fact:
    lxc_base_root_ca_src: >-
      {{ (playbook_dir + '/../../../../certs/homelab-root.' + lookup('env', 'PVE_ENV') + '.crt')
         if (lxc_base_env_ca_stat.stat.exists | default(false))
         else (playbook_dir + '/../../../../certs/homelab-root.crt') }}
    lxc_base_root_ca_exists: >-
      {{ (lxc_base_env_ca_stat.stat.exists | default(false)) or lxc_base_homelab_root_ca_local.stat.exists }}

- name: Install homelab root CA on managed host
  ansible.builtin.copy:
    src: "{{ lxc_base_root_ca_src }}"
    dest: /usr/local/share/ca-certificates/homelab-root.crt
    mode: "0644"
  when: lxc_base_root_ca_exists | bool
  register: lxc_base_homelab_root_ca_copy

- name: Refresh CA trust store after root CA update
  ansible.builtin.command:
    cmd: update-ca-certificates
  when:
    - lxc_base_root_ca_exists | bool
    - lxc_base_homelab_root_ca_copy.changed

- name: Ensure machine-id exists for host and cAdvisor identity
  ansible.builtin.command:
    cmd: systemd-machine-id-setup
    creates: /etc/machine-id

- name: Stop and mask OpenIPMI service in LXC guests
  ansible.builtin.systemd:
    name: openipmi
    state: stopped
    enabled: false
    masked: true
  failed_when: false

- name: Remove OpenIPMI package from LXC guests
  ansible.builtin.apt:
    name: openipmi
    state: absent
    purge: true
  failed_when: false

- name: Clear stale OpenIPMI failed unit state
  ansible.builtin.command:
    cmd: systemctl reset-failed openipmi.service
  failed_when: false
  changed_when: false

- name: Install node_exporter for OS metrics collection
  ansible.builtin.include_role:
    name: node_exporter
  when: monitoring_enabled | default(true) | bool

- name: Install rsyslog and configure forwarding to VictoriaLogs
  ansible.builtin.include_role:
    name: rsyslog_forward
  when: monitoring_enabled | default(true) | bool

- name: Stop promtail service if present (replaced by rsyslog/VictoriaLogs)
  ansible.builtin.systemd:
    name: promtail
    state: stopped
    enabled: false
  failed_when: false

- name: Remove promtail package if installed
  ansible.builtin.apt:
    name: promtail
    state: absent
    purge: true
  failed_when: false
