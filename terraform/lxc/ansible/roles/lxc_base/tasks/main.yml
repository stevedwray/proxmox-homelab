---
- name: Configure guest DNS resolver
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      nameserver {{ dns_server }}
    owner: root
    group: root
    mode: "0644"
  when: dns_server | default('', true) | string | length > 0

- name: Configure apt to use apt-cacher-ng proxy
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/01proxy
    content: |
      Acquire::http::Proxy "http://{{ apt_cacher_host }}:3142";
    owner: root
    group: root
    mode: "0644"
  when:
    - apt_cacher_host | default('', true) | string | length > 0
    - ansible_host | default('', true) | string != apt_cacher_host | string

- name: Remove apt-cacher-ng proxy config when disabled
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/01proxy
    state: absent
  when: >-
    apt_cacher_host | default('', true) | string | length == 0
    or ansible_host | default('', true) | string == apt_cacher_host | string
