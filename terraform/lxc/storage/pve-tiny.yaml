version: 1

# pve-tiny has one small disk, stock Proxmox install: local (dir) +
# local-lvm (lvm-thin) only, no ZFS pool, no custom infrastructure-*
# storage pools. Confirmed live via /nodes/pve-tiny/storage (2026-09-17).
# Mirrors terraform/lxc/storage/pve-test.yaml's non-ZFS profile shape —
# pve-test is the existing precedent for a standalone node without the
# ZFS-backed infrastructure-containers pool pve/pve-test-vm have.

defaults:
  storage_profile: platform-default
  extra_mount_profile: durable-default
  template_profile: local-template

templates:
  default:
    name: debian-13.1-2-docker-template.tar.gz

storage_backends:
  local-lvm:
    content_types: [images, rootdir]
    backend_type: lvm-thin
  local:
    content_types: [backup, iso, vztmpl]
    backend_type: dir

profiles:
  platform-default:
    rootfs_storage: local-lvm
    docker_storage: local-lvm
    rootfs_required_content_type: rootdir
    docker_required_content_type: rootdir

extra_mount_profiles:
  durable-default:
    storage: local-lvm
    required_content_type: rootdir

template_profiles:
  local-template:
    storage: local
    required_content_type: vztmpl
    allowed_templates:
      - debian-13.1-2-docker-template.tar.gz

legacy_rootfs_storage_profiles:
  local-lvm: platform-default

legacy_extra_mount_storage_profiles:
  local-lvm: durable-default

legacy_template_storage_profiles:
  local: local-template
