# Proxmox-only network intent for the pve-test-vm environment.
# This file is declarative; Terraform reads it to drive SDN VNet creation
# (configure-network-sdn-vnet.yml) and to attach LXC containers to the
# correct bridge and VLAN.
#
# Network model: Proxmox SDN VLAN zones — the MikroTik is the L3 gateway
# for all zones. No routing or NAT is performed on the Proxmox host.
# Inter-zone traffic flows through the MikroTik, which enforces firewall
# policy at the router.
#
# Physical setup:
#   pve-test-vm (VM on pve, 192.168.1.41) NIC → MikroTik trunk port
#     Untagged (native): LAN — 192.168.1.0/24
#     Tagged VLAN 10: build_seg — 192.168.10.0/24, gw 192.168.10.1
#     Tagged VLAN 20: mgmt_seg  — 192.168.20.0/24, gw 192.168.20.1
#     Tagged VLAN 30: edge_seg  — 192.168.30.0/24, gw 192.168.30.1
#     Tagged VLAN 40: infra_seg — 192.168.40.0/24, gw 192.168.40.1
#
# Automation note: `configure-network-sdn-vnet.yml` now handles
# `zone_type: vlan` for `pve-test-vm` SDN attachment creation. The remaining
# out-of-band dependency is the MikroTik side: VLAN interfaces, gateway IPs,
# DNS behavior, and firewall policy must already exist before stack
# provisioning relies on direct routed access.

proxmox:
  target_node: pve-test-vm
  pve_host: ${proxmox_host}

attachments:
  # -------------------------------------------------------------------------
  # vmbr0 — Legacy bridge attachment
  #
  # This attachment remains only for legacy/test stacks that still use the
  # default bridge path.
  # -------------------------------------------------------------------------
  lan:
    description: Default LAN bridge — used only by legacy/test stacks (test-lxc, test-docker).
      All active platform stacks use named SDN zones.
    type: bridge
    bridge: vmbr0
    vlan_tag: null
    firewall: true

  # -------------------------------------------------------------------------
  # test_dhcp_seg — Throwaway DHCP mechanism-test zone (VLAN 90, 192.168.90.0/24)
  #
  # Purpose: Isolated Stage A validation zone for the DHCP refactor workspace.
  # This exists only in pve-test-vm, is not mirrored to pve, and is intended
  # for one disposable client plus MikroTik relay -> Technitium DHCP testing.
  # Gateway: MikroTik VLAN 90 interface (192.168.90.1) — manual TM-09 setup.
  # Container pattern: temporary client boots with a static IP first so the
  # current Terraform/LXC pipeline can provision it deterministically, then the
  # guest interface is flipped to DHCP in-guest before the real Stage A tests.
  # -------------------------------------------------------------------------
  test_dhcp_seg:
    description: Throwaway DHCP mechanism-test zone for docs/dhcp-refactor Stage A
    type: sdn_vnet
    bridge: tvdhcp
    firewall: false
    sdn:
      zone: tvdhcp
      zone_type: vlan
      bridge: vmbr0
      nodes:
        - pve-test-vm
      vnet: tvdhcp
      vlan_tag: 90
      alias: pve-test-vm DHCP mechanism-test segment
      subnet: "192.168.90.0/24"
      gateway: "192.168.90.1"
      snat: false

  # -------------------------------------------------------------------------
  # infra_seg — Infrastructure artifact services (VLAN 40, 192.168.40.0/24)
  #
  # Purpose: Registry, artifact cache, and IPAM. Deployed early in the build
  #   sequence (second, after Portainer) because all other zones depend on
  #   Harbor for image pulls and apt-cacher for apt proxy.
  # Gateway: MikroTik VLAN 40 interface (192.168.40.1)
  # Containers: Harbor (192.168.40.10), apt-cacher (192.168.40.11), NetBox (192.168.40.12)
  # -------------------------------------------------------------------------
  infra_seg:
    description: Infrastructure services — registry, artifact cache, IPAM
    type: sdn_vnet
    bridge: tvinfra
    firewall: false
    sdn:
      zone: tvinfra
      zone_type: vlan
      bridge: vmbr0
      nodes:
        - pve-test-vm
      vnet: tvinfra
      vlan_tag: 40
      alias: pve-test-vm infrastructure segment
      subnet: "${lab_subnet_infra_cidr}"
      gateway: "${lab_gw_infra}"
      snat: false

  # -------------------------------------------------------------------------
  # mgmt_seg — Management plane (VLAN 20, 192.168.20.0/24)
  #
  # Purpose: Identity, PKI, and observability.
  # Gateway: MikroTik VLAN 20 interface (192.168.20.1)
  # Containers: Authentik (192.168.20.10), step-ca (192.168.20.11),
  #             Monitoring (192.168.20.12)
  # -------------------------------------------------------------------------
  mgmt_seg:
    description: Management plane — identity, PKI, monitoring
    type: sdn_vnet
    bridge: tvmgmt
    firewall: true
    sdn:
      zone: tvmgmt
      zone_type: vlan
      bridge: vmbr0
      nodes:
        - pve-test-vm
      vnet: tvmgmt
      vlan_tag: 20
      alias: pve-test-vm management segment
      subnet: "${lab_subnet_mgmt_cidr}"
      gateway: "${lab_gw_mgmt}"
      snat: false

  # -------------------------------------------------------------------------
  # edge_seg — Public ingress (VLAN 30, 192.168.30.0/24)
  #
  # Purpose: The only ingress path from the LAN into internal services.
  # Gateway: MikroTik VLAN 30 interface (192.168.30.1)
  # Containers: Traefik (192.168.30.10)
  # -------------------------------------------------------------------------
  edge_seg:
    description: Edge ingress — reverse proxy only
    type: sdn_vnet
    bridge: tvedge
    firewall: true
    sdn:
      zone: tvedge
      zone_type: vlan
      bridge: vmbr0
      nodes:
        - pve-test-vm
      vnet: tvedge
      vlan_tag: 30
      alias: pve-test-vm edge segment
      subnet: "${lab_subnet_edge_cidr}"
      gateway: "${lab_gw_edge}"
      snat: false

  # -------------------------------------------------------------------------
  # build_seg — CI build workloads (VLAN 10, 192.168.10.0/24)
  #
  # Purpose: Self-hosted CI runner execution environment.
  # Gateway: MikroTik VLAN 10 interface (192.168.10.1)
  # Containers: ci-runner-01 (192.168.10.63, VMID 10063)
  # -------------------------------------------------------------------------
  seg_c:
    description: CI build workload zone
    type: sdn_vnet
    bridge: tvnetc
    firewall: false
    sdn:
      zone: tvsegc
      zone_type: vlan
      bridge: vmbr0
      nodes:
        - pve-test-vm
      vnet: tvnetc
      vlan_tag: 10
      alias: pve-test-vm build segment
      subnet: "${lab_subnet_build_cidr}"
      gateway: "${lab_gw_build}"
      snat: false

  # -------------------------------------------------------------------------
  # pentest_seg — PentAGI autonomous pentesting agent (VLAN 70, 192.168.70.0/24)
  #
  # Purpose: dedicated zone for a Docker-socket-holding, root-equivalent-
  #   within-its-own-daemon workload (PentAGI's control plane spawns its own
  #   sibling execution containers). Not merged into infra_seg/mgmt_seg per
  #   NFR-03 default-deny reasoning — same precedent as ai_seg on
  #   pve-framework (docs/framework-integration/decisions.md Decision 4).
  # Gateway: MikroTik VLAN 70 interface (192.168.70.1) — live since 2026-07-26.
  # Containers: pentagi-stack (192.168.70.110 — renumbered 2026-07-26 from .10,
  #   freeing .10 as the canonical IP for the future pve deployment)
  #
  # Real containment exists at the MikroTik for this zone specifically (see
  # docs/pentagi-stack/plan.md §0) — pentest_seg can reach infra_seg
  # (Harbor/apt-cacher), framework.gibbsgreatly.xyz (Ollama/SearXNG),
  # LAB_TARGET (192.168.1.113, full port range), and the internet, with an
  # explicit deny to everything else. edge_seg reaches pentest_seg:8443 for
  # Traefik. This is enforced at the router; not generated by Terraform
  # (same known cross-zone-firewall gap as every other zone here) — the
  # policies: block below documents it, it doesn't create it.
  # -------------------------------------------------------------------------
  pentest_seg:
    description: PentAGI autonomous pentesting agent — dedicated, contained zone
    type: sdn_vnet
    bridge: tvpent
    firewall: false
    sdn:
      zone: tvpent
      zone_type: vlan
      bridge: vmbr0
      nodes:
        - pve-test-vm
      vnet: tvpent
      vlan_tag: 70
      alias: pve-test-vm pentest segment
      subnet: "${lab_subnet_pentest_cidr}"
      gateway: "${lab_gw_pentest}"
      snat: false

zones:
  test_dhcp_seg:
    description: Throwaway DHCP mechanism-test zone for the Technitium relay validation
    attachment: test_dhcp_seg
    containers:
      - "dhcp-test-client-01 (planned VMID 138) — 192.168.90.61 initial static boot, then flipped to DHCP in-guest"
  infra_seg:
    description: Infrastructure services — Harbor, apt-cacher, NetBox
    attachment: infra_seg
    containers:
      - "Harbor (VMID 40010)    — ${lab_ip_harbor}"
      - "apt-cacher (VMID 40011) — ${lab_ip_apt_cacher}"
      - "NetBox (VMID 40012)    — ${lab_ip_netbox}"
  mgmt_seg:
    description: Management plane — Portainer, Authentik, step-ca, Monitoring
    attachment: mgmt_seg
    containers:
      - "Portainer (VMID 20020)  — ${lab_ip_portainer}"
      - "Authentik (VMID 20010)  — ${lab_ip_authentik}"
      - "step-ca (VMID 20011)    — ${lab_ip_step_ca}"
      - "Monitoring (VMID 20012) — ${lab_ip_monitoring}"
  edge_seg:
    description: Edge ingress — Traefik reverse proxy
    attachment: edge_seg
    containers:
      - "Traefik (VMID 30010) — ${lab_ip_proxy}"
  build_seg:
    description: CI build workload zone
    attachment: seg_c
    containers:
      - "ci-runner-01 (VMID 10063) — ${lab_ip_ci_runner}"
  pentest_seg:
    description: PentAGI autonomous pentesting agent — dedicated, contained zone
    attachment: pentest_seg
    containers:
      - "pentagi-stack — ${lab_ip_pentagi}"

inventory:
  proxmox_nodes:
    - host: "${proxmox_host}"
      token_id_env: PROXMOX_READONLY_TOKEN_ID
      token_secret_env: PROXMOX_READONLY_TOKEN_SECRET
    - host: "pve.gibbsgreatly.xyz"
      host_ip: "192.168.1.2"
      token_id_env: PVE_READONLY_TOKEN_ID
      token_secret_env: PVE_READONLY_TOKEN_SECRET
      portainer_url: "https://management-stack.gibbsgreatly.xyz:9443"
      portainer_api_key_env: PORTAINER_TOKEN
  static_hosts:
    - name: pve-test-vm
      role: hypervisor-vm
      ip: 192.168.1.41
      description: "Proxmox test hypervisor — VM on pve (LAN management IP)"
    - name: linux-desktop
      role: workstation
      ip: 192.168.1.104
      description: "Linux desktop workstation"
    - name: argon-01
      role: iot
      ip: 192.168.1.22
      description: "Raspberry Pi — argon-01"
    - name: argon-02
      role: iot
      ip: 192.168.1.23
      description: "Raspberry Pi — argon-02"

policies:
  - from: edge_seg
    to: mgmt_seg
    protocol: tcp
    ports: [9000, 9443]
    description: Traefik forward-auth to Authentik (9000 HTTP, 9443 HTTPS)
  - from: edge_seg
    to: mgmt_seg
    protocol: tcp
    ports: [5380]
    description: Traefik to Technitium admin console/API (docs/dns-refactor Decision 4)
  - from: mgmt_seg
    to: edge_seg
    protocol: tcp
    ports: [80]
    description: step-ca ACME httpChallenge callback to Traefik
  - from: build_seg
    to: mgmt_seg
    protocol: tcp
    ports: [9000, 8428, 3100]
    description: ci-runner to Authentik (9000), VictoriaMetrics (8428), Loki (3100)
  - from: all_zones
    to: infra_seg
    protocol: tcp
    ports: [80, 443, 3142]
    description: All zones and LAN → Harbor (80/443) and apt-cacher (3142)
  - from: edge_seg
    to: pentest_seg
    protocol: tcp
    ports: [8443]
    description: Traefik to the PentAGI UI (docs/pentagi-stack/plan.md Phase 3)
  - from: pentest_seg
    to: infra_seg
    protocol: tcp
    ports: [3142]
    description: pentagi-stack apt proxy (apt-cacher, reached directly at its infra_seg IP)
  - from: pentest_seg
    to: 192.168.30.110
    protocol: tcp
    ports: [80, 443]
    description: >-
      pentagi-stack image pulls (Harbor) — corrected 2026-07-26: harbor.$${LAB_DOMAIN}
      resolves to Traefik's edge_seg IP, not Harbor's own infra_seg IP, so this
      must open to edge_seg, not infra_seg. Discovered live: all four PentAGI
      image pulls timed out until this was added — see docs/pentagi-stack/plan.md.
  - from: pentest_seg
    to: 192.168.1.8
    protocol: tcp
    ports: [11434, 8082]
    description: pentagi-stack to framework.gibbsgreatly.xyz (Ollama, SearXNG)
  - from: pentest_seg
    to: 192.168.1.113
    protocol: all
    ports: []
    description: pentagi-stack to LAB_TARGET (Metasploitable 2) — destination-scoped, not port-scoped; authorized pentest target only
  - from: pentest_seg
    to: default
    protocol: all
    ports: []
    description: Explicit deny — pentest_seg has no other reachability beyond the above plus internet egress (real containment, unlike every other zone here today)
