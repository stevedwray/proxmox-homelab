# Proxmox-only network intent for the pve-test environment.
# This file is declarative only for now; later steps will wire it into
# Terraform NIC attachment and Proxmox firewall policy generation.

proxmox:
  target_node: pve-test
  pve_host: pve-test.gibbsgreatly.xyz

attachments:
  # Out-of-band prerequisite: for any SDN subnet with a gateway defined below,
  # the home router must have a static route pointing that subnet back to
  # pve-test (192.168.1.40) as the next hop.
  #
  # Current required route:
  #   10.57.0.0/24 via 192.168.1.40   (seg_c: build_seg / artifacts_seg)
  #
  # MikroTik command:
  #   /ip route add dst-address=<subnet> gateway=192.168.1.40 comment="pve-test SDN <seg>"
  #
  # Without these routes, LAN -> SDN container ingress will not work, and
  # container traffic bound for the internet will have no SNAT fallback.
  lan:
    description: Default LAN bridge for bridge-based validation zones on pve-test
    type: bridge
    bridge: vmbr0
    vlan_tag: null
    firewall: true
  seg_a:
    description: First SDN VNet attachment for microsegmentation validation on pve-test
    type: sdn_vnet
    bridge: tvneta
    firewall: true
    sdn:
      zone: tvsega
      zone_type: simple
      nodes:
        - pve-test
      vnet: tvneta
      alias: pve-test network layer
  seg_b:
    description: Second SDN VNet attachment for independent microsegmentation validation
    type: sdn_vnet
    bridge: tvnetb
    firewall: true
    sdn:
      zone: tvsegb
      zone_type: simple
      nodes:
        - pve-test
      vnet: tvnetb
      alias: pve-test network layer 2
  seg_c:
    description: Third SDN VNet attachment for artifact flow validation on pve-test
    type: sdn_vnet
    bridge: tvnetc
    firewall: true
    sdn:
      zone: tvsegc
      zone_type: simple
      nodes:
        - pve-test
      vnet: tvnetc
      alias: pve-test network layer 3
      subnet: "10.57.0.0/24"
      gateway: "10.57.0.1"
      snat: true

zones:
  apps:
    description: Application workload zone on the default LAN bridge
    attachment: lan
  infra:
    description: Service endpoint zone on the default LAN bridge
    attachment: lan
  isolated:
    description: Bridge-attached isolated zone with no inbound policy overrides
    attachment: lan
  apps_seg:
    description: Application workload zone on the first SDN VNet
    attachment: seg_a
  infra_seg:
    description: Service endpoint zone on the first SDN VNet
    attachment: seg_a
  media_seg:
    description: Application workload zone on the second SDN VNet
    attachment: seg_b
  observe_seg:
    description: Service endpoint zone on the second SDN VNet
    attachment: seg_b
  build_seg:
    description: Build workload zone on the third SDN VNet
    attachment: seg_c
  artifacts_seg:
    description: Artifact service zone on the third SDN VNet
    attachment: seg_c

policies:
  - from: apps
    to: infra
    protocol: tcp
    ports: [8080, 9000]
    description: apps can reach infra on tcp/8080 and tcp/9000
  - from: apps_seg
    to: infra_seg
    protocol: tcp
    ports: [8080]
    description: apps_seg can reach infra_seg on tcp/8080
  - from: media_seg
    to: observe_seg
    protocol: tcp
    ports: [8080]
    description: media_seg can reach observe_seg on tcp/8080
  - from: build_seg
    to: artifacts_seg
    protocol: tcp
    ports: [5000, 8081]
    description: build_seg can reach artifacts_seg on tcp/5000 and tcp/8081
