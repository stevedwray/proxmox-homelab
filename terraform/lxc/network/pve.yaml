# Proxmox-only network intent for the pve production environment.
#
# Target model (Task 04): VLAN-backed SDN zones bound to vmbr0, matching the
# active platform zone contract used by stack metadata:
#   - build_seg
#   - mgmt_seg
#   - edge_seg
#   - infra_seg
#
# Values for subnets/gateways are templated to avoid fake certainty. The
# operator-provided production env overlay controls their concrete values.

proxmox:
  target_node: pve
  pve_host: ${proxmox_host}

attachments:
  infra_seg:
    description: Infrastructure services - registry, artifact cache, IPAM
    type: sdn_vnet
    bridge: tvinfra
    firewall: false
    sdn:
      zone: tvinfra
      zone_type: vlan
      bridge: vmbr0
      nodes:
        - pve
      vnet: tvinfra
      vlan_tag: 40
      alias: pve infrastructure segment
      subnet: "${lab_subnet_infra_cidr}"
      gateway: "${lab_gw_infra}"
      snat: false

  mgmt_seg:
    description: Management plane - identity, PKI, monitoring
    type: sdn_vnet
    bridge: tvmgmt
    # Keep the Proxmox VNet firewall disabled until cross-zone rule generation
    # is fixed in main.tf and promoted beyond pve-test validation.
    firewall: false
    sdn:
      zone: tvmgmt
      zone_type: vlan
      bridge: vmbr0
      nodes:
        - pve
      vnet: tvmgmt
      vlan_tag: 20
      alias: pve management segment
      subnet: "${lab_subnet_mgmt_cidr}"
      gateway: "${lab_gw_mgmt}"
      snat: false

  edge_seg:
    description: Edge ingress - reverse proxy only
    type: sdn_vnet
    bridge: tvedge
    # Keep the Proxmox VNet firewall disabled until cross-zone rule generation
    # is fixed in main.tf and promoted beyond pve-test validation.
    firewall: false
    sdn:
      zone: tvedge
      zone_type: vlan
      bridge: vmbr0
      nodes:
        - pve
      vnet: tvedge
      vlan_tag: 30
      alias: pve edge segment
      subnet: "${lab_subnet_edge_cidr}"
      gateway: "${lab_gw_edge}"
      snat: false

  build_seg:
    description: CI build workload zone
    type: sdn_vnet
    bridge: tvnetc
    firewall: false
    sdn:
      zone: tvsegc
      zone_type: vlan
      bridge: vmbr0
      nodes:
        - pve
      vnet: tvnetc
      vlan_tag: 10
      alias: pve build segment
      subnet: "${lab_subnet_build_cidr}"
      gateway: "${lab_gw_build}"
      snat: false

zones:
  infra_seg:
    description: Infrastructure services - Harbor, apt-cacher, NetBox
    attachment: infra_seg
  mgmt_seg:
    description: Management plane - Portainer, Authentik, step-ca, Monitoring, CoreDNS
    attachment: mgmt_seg
  edge_seg:
    description: Edge ingress - Traefik reverse proxy
    attachment: edge_seg
  build_seg:
    description: CI build workload zone
    attachment: build_seg

policies:
  - from: edge_seg
    to: mgmt_seg
    protocol: tcp
    ports: [9000, 9443]
    description: Traefik forward-auth to Authentik
  - from: mgmt_seg
    to: edge_seg
    protocol: tcp
    ports: [80]
    description: step-ca ACME httpChallenge callback to Traefik
  - from: build_seg
    to: mgmt_seg
    protocol: tcp
    ports: [9000, 8428, 3100]
    description: CI runner to Authentik and monitoring APIs
  - from: all_zones
    to: infra_seg
    protocol: tcp
    ports: [80, 443, 3142]
    description: All zones and LAN to Harbor and apt-cacher
