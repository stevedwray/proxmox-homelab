# Proxmox-only network intent for the pve production environment.
# Mirrors the zone structure of pve-test.yaml; SDN zones/vnets already exist
# on pve with the same VNet names (tvmgmt, tvedge, tvinfra, tvnetc/tvsegc).
#
# Network model: Proxmox SDN VLAN zones — the MikroTik is the L3 gateway
# for all zones. No routing or NAT is performed on the Proxmox host.
# Inter-zone traffic flows through the MikroTik, which enforces firewall
# policy at the router.
#
# Physical setup:
#   pve NIC → MikroTik trunk port
#     Tagged VLAN 10: build_seg — 192.168.10.0/24, gw 192.168.10.1
#     Tagged VLAN 20: mgmt_seg  — 192.168.20.0/24, gw 192.168.20.1
#     Tagged VLAN 30: edge_seg  — 192.168.30.0/24, gw 192.168.30.1
#     Tagged VLAN 40: infra_seg — 192.168.40.0/24, gw 192.168.40.1

proxmox:
  target_node: pve
  pve_host: ${proxmox_host}

attachments:
  lan:
    description: Default LAN bridge — used only by legacy/test stacks.
    type: bridge
    bridge: vmbr0
    vlan_tag: null
    firewall: false

  # infra_seg — Infrastructure artifact services (VLAN 40, 192.168.40.0/24)
  infra_seg:
    description: Infrastructure services — registry, artifact cache, IPAM
    type: sdn_vnet
    bridge: tvinfra
    firewall: false
    sdn:
      zone: tvinfra
      zone_type: vlan
      bridge: vmbr0
      nodes:
        - pve
      vnet: tvinfra
      vlan_tag: 40
      alias: pve infrastructure segment
      subnet: "${lab_subnet_infra_cidr}"
      gateway: "${lab_gw_infra}"
      snat: false

  # mgmt_seg — Management plane (VLAN 20, 192.168.20.0/24)
  mgmt_seg:
    description: Management plane — identity, PKI, monitoring
    type: sdn_vnet
    bridge: tvmgmt
    firewall: false
    sdn:
      zone: tvmgmt
      zone_type: vlan
      bridge: vmbr0
      nodes:
        - pve
      vnet: tvmgmt
      vlan_tag: 20
      alias: pve management segment
      subnet: "${lab_subnet_mgmt_cidr}"
      gateway: "${lab_gw_mgmt}"
      snat: false

  # edge_seg — Public ingress (VLAN 30, 192.168.30.0/24)
  edge_seg:
    description: Edge ingress — reverse proxy only
    type: sdn_vnet
    bridge: tvedge
    firewall: false
    sdn:
      zone: tvedge
      zone_type: vlan
      bridge: vmbr0
      nodes:
        - pve
      vnet: tvedge
      vlan_tag: 30
      alias: pve edge segment
      subnet: "${lab_subnet_edge_cidr}"
      gateway: "${lab_gw_edge}"
      snat: false

  # seg_c — CI build workloads (VLAN 10, 192.168.10.0/24)
  seg_c:
    description: CI build workload zone
    type: sdn_vnet
    bridge: tvnetc
    firewall: false
    sdn:
      zone: tvsegc
      zone_type: vlan
      bridge: vmbr0
      nodes:
        - pve
      vnet: tvnetc
      vlan_tag: 10
      alias: pve build segment
      subnet: "${lab_subnet_build_cidr}"
      gateway: "${lab_gw_build}"
      snat: false

  # -------------------------------------------------------------------------
  # pentest_seg — PentAGI autonomous pentesting agent (VLAN 70, 192.168.70.0/24)
  #
  # Mirrors pve-test-vm.yaml's pentest_seg (dedicated, contained zone — not
  # merged into infra_seg/mgmt_seg per NFR-03 default-deny reasoning, same
  # precedent as ai_seg on pve-framework, Decision 4). pve and pve-test-vm
  # are separate standalone Proxmox instances, so the tvpent zone/vnet name
  # is reused here without conflict.
  # Gateway: MikroTik VLAN 70 interface (192.168.70.1), same trunk/VLAN as
  # pve-test-vm's instance, shared subnet.
  # Containers: pentagi-stack (192.168.70.10 — canonical; pve-test-vm's own
  # instance uses .110, freed for this purpose 2026-07-26).
  #   greenbone-stack (192.168.70.11 — canonical; pve-test-vm's own instance
  #   uses .111, base+100 convention). Not yet deployed here — added to this
  #   file for parity/documentation ahead of an eventual pve promotion, per
  #   docs/greenbone-stack/plan.md.
  #
  # See docs/pentagi-stack/plan.md for the pve-test-vm precedent this
  # mirrors, including the real MikroTik containment policy this zone needs
  # once live (Traefik -> pentest_seg:8443/8080, pentest_seg -> infra_seg
  # apt-cacher, pentest_seg -> edge_seg Harbor, pentest_seg -> LLM_GPU host,
  # pentest_seg -> authorized pentest target, explicit deny to everything
  # else).
  # -------------------------------------------------------------------------
  pentest_seg:
    description: PentAGI autonomous pentesting agent — dedicated, contained zone
    type: sdn_vnet
    bridge: tvpent
    firewall: false
    sdn:
      zone: tvpent
      zone_type: vlan
      bridge: vmbr0
      nodes:
        - pve
      vnet: tvpent
      vlan_tag: 70
      alias: pve pentest segment
      subnet: "${lab_subnet_pentest_cidr}"
      gateway: "${lab_gw_pentest}"
      snat: false

zones:
  infra_seg:
    description: Infrastructure services — Harbor, apt-cacher, NetBox
    attachment: infra_seg
    containers:
      - "Harbor (VMID 40010)    — ${lab_ip_harbor}"
      - "apt-cacher (VMID 40011) — ${lab_ip_apt_cacher}"
      - "NetBox (VMID 40012)    — ${lab_ip_netbox}"
  mgmt_seg:
    description: Management plane — Portainer, Authentik, step-ca, Monitoring, dns
    attachment: mgmt_seg
    containers:
      - "Portainer (VMID 20020)  — ${lab_ip_portainer}"
      - "Authentik (VMID 20010)  — ${lab_ip_authentik}"
      - "step-ca (VMID 20011)    — ${lab_ip_step_ca}"
      - "Monitoring (VMID 20012) — ${lab_ip_monitoring}"
      - "technitium-stack — ${lab_ip_technitium} — LIVE authoritative DNS for lab.gibbsgreatly.xyz (MikroTik lab-zone-delegate points here; see docs/dns-refactor/README.md)"
      - "dns-stack (VMID 20013)  — ${lab_ip_dns} — ROLLBACK ONLY, cut over to technitium-stack above; not the active delegate target"
  edge_seg:
    description: Edge ingress — Traefik reverse proxy
    attachment: edge_seg
    containers:
      - "Traefik (VMID 30010) — ${lab_ip_proxy}"
  build_seg:
    description: CI build workload zone
    attachment: seg_c
    containers:
      - "ci-runner-01 (VMID 10063) — ${lab_ip_ci_runner}"
  pentest_seg:
    description: PentAGI autonomous pentesting agent — dedicated, contained zone
    attachment: pentest_seg
    containers:
      - "pentagi-stack — ${lab_ip_pentagi}"
      - "greenbone-stack — ${lab_ip_greenbone} — not yet deployed, see docs/greenbone-stack/plan.md"

policies:
  - from: edge_seg
    to: ai_seg
    protocol: tcp
    ports: [80, 443]
    description: >-
      Traefik to AI-stack web UIs and the llama-server API. Cross-node:
      ai_seg is defined in network/pve-framework.yaml (VLAN 50, on
      fe-pve), not here — see the matching entry there and
      docs/framework-integration/decisions.md Decision 4.
  - from: edge_seg
    to: mgmt_seg
    protocol: tcp
    ports: [9000, 9443]
    description: Traefik forward-auth to Authentik
  - from: edge_seg
    to: mgmt_seg
    protocol: tcp
    ports: [5380]
    description: Traefik to Technitium admin console/API (docs/dns-refactor Decision 4)
  - from: mgmt_seg
    to: edge_seg
    protocol: tcp
    ports: [80]
    description: step-ca ACME httpChallenge callback to Traefik
  - from: build_seg
    to: mgmt_seg
    protocol: tcp
    ports: [9000, 8428, 3100]
    description: CI runner to Authentik and monitoring APIs
  - from: all_zones
    to: infra_seg
    protocol: tcp
    ports: [80, 443, 3142]
    description: All zones and LAN to Harbor and apt-cacher
  - from: infra_seg
    to: mgmt_seg
    protocol: tcp
    ports: [9000, 9443]
    description: NetBox to Portainer socket proxy and Authentik
  - from: edge_seg
    to: pentest_seg
    protocol: tcp
    ports: [8443]
    description: Traefik to the PentAGI UI (mirrors pve-test-vm.yaml)
  - from: edge_seg
    to: pentest_seg
    protocol: tcp
    ports: [8080]
    description: >-
      Traefik to the Greenbone GSA web UI — a custom plain-HTTP nginx
      server block, not gsad's own port (mirrors pve-test-vm.yaml; not
      yet deployed here — see docs/greenbone-stack/plan.md)
  - from: mgmt_seg
    to: pentest_seg
    protocol: tcp
    ports: [9187]
    description: monitoring-stack (VictoriaMetrics) scraping pentagi-stack's pgexporter
  - from: pentest_seg
    to: infra_seg
    protocol: tcp
    ports: [3142]
    description: pentagi-stack apt proxy (apt-cacher, reached directly at its infra_seg IP)
  - from: pentest_seg
    to: 192.168.30.10
    protocol: tcp
    ports: [80, 443]
    description: >-
      pentagi-stack image pulls (Harbor) — harbor.$${LAB_DOMAIN} resolves to
      Traefik's edge_seg IP, not Harbor's own infra_seg IP (same gotcha hit
      live on pve-test-vm — see docs/pentagi-stack/plan.md).
  - from: pentest_seg
    to: 192.168.1.8
    protocol: tcp
    ports: [11434, 8082, 8080]
    description: >-
      pentagi-stack to framework.gibbsgreatly.xyz (Ollama for embeddings,
      SearXNG, and llamacpp-router's native multi-model OpenAI-compatible
      endpoint -- the adviser/pentester/coder chat-completion provider as
      of 2026-07-28, replacing Ollama for that role specifically).
  - from: pentest_seg
    to: 192.168.20.14
    protocol: tcp
    ports: [514]
    description: >-
      pentagi-stack rsyslog forwarding to Graylog. Missed on the first pass --
      only the inbound mgmt_seg -> pentest_seg:9187 scrape rule was added;
      this outbound leg is what rsyslog itself needs and was timing out
      until this was added (confirmed live via journalctl on pentagi-stack).
  - from: pentest_seg
    to: 192.168.20.11
    protocol: tcp
    ports: [443]
    description: >-
      pentagi-stack's node_exporter issuing/renewing its TLS cert from
      step-ca (node_exporter role's step ca certificate call,
      node_exporter_step_ca_url defaults to https://<step-ca>, i.e. 443).
      Other zones reach step-ca without an explicit rule because they
      aren't contained like pentest_seg is -- this makes it explicit here.
  - from: mgmt_seg
    to: pentest_seg
    protocol: tcp
    ports: [8080]
    description: monitoring-stack (VictoriaMetrics) scraping pentagi-stack's cAdvisor
  - from: 192.168.1.113
    to: pentest_seg
    protocol: all
    ports: []
    description: >-
      Authorized lab target (Metasploitable 2) <-> pentagi-stack, fully
      open both directions for this single host pair. Originally scoped
      to just PentAGI's deterministic per-flow port range
      (docker.BaseContainerPortsNumber=28000, 2 ports/flow) for
      reverse-shell/callback traffic under DOCKER_NETWORK=host, but
      widened 2026-07-28: confirmed live that an agent picking an
      arbitrary LPORT outside that range (e.g. testing
      cmd/unix/reverse_perl on 4444/4445/5555) gets silently dropped by
      the narrower rule, producing a clean-looking "exploit ran, no
      errors, but no session" failure that's actually a firewall drop,
      not a real bug. For active validation testing, that ambiguity
      costs more than the narrower scope is worth -- still scoped to
      only this single authorized target, not all of 192.168.1.0/24.
  - from: pentest_seg
    to: 192.168.1.113
    protocol: all
    ports: []
    description: >-
      Mirrors the rule above -- explicit outbound leg to the same single
      authorized target, so nothing about port/protocol choice on either
      side of this one host pair can introduce test ambiguity.
  - from: pentest_seg
    to: mgmt_seg
    protocol: tcp
    ports: [3389, 6636]
    description: >-
      greenbone-stack to Authentik's LDAP outpost (mirrors pve-test-vm.yaml;
      not yet applied here — greenbone-stack isn't deployed on pve yet).
  - from: pentest_seg
    to: default
    protocol: all
    ports: []
    description: Explicit deny — pentest_seg has no other reachability beyond the above plus internet egress

inventory:
  proxmox_nodes:
    - host: "${proxmox_host}"
      host_ip: "192.168.1.2"
      token_id_env: PROXMOX_READONLY_TOKEN_ID
      token_secret_env: PROXMOX_READONLY_TOKEN_SECRET
      portainer_url: "https://management-stack.gibbsgreatly.xyz:9443"
      portainer_api_key_env: PORTAINER_TOKEN
  static_hosts:
    - name: pve-test-vm
      role: hypervisor-vm
      ip: 192.168.1.41
      description: "Proxmox test hypervisor — VM on pve (LAN management IP)"
    - name: linux-desktop
      role: workstation
      ip: 192.168.1.104
      description: "Linux desktop workstation"
    - name: argon-01
      role: iot
      ip: 192.168.1.22
      description: "Raspberry Pi — argon-01"
    - name: argon-02
      role: iot
      ip: 192.168.1.23
      description: "Raspberry Pi — argon-02"
    - name: framework
      role: ai-workstation
      ip: 192.168.1.8
      description: "framework.gibbsgreatly.xyz — bare-metal Ubuntu 26.04, AI/LLM development host (not a Proxmox VM; see docs/framework-ubuntu/plan.md)"
      services:
        - name: lmstudio
          port: 8090
          protocol: tcp
          description: "LM Studio — Vulkan backend, interactive Copilot use"
        - name: llamacpp
          port: 8080
          protocol: tcp
          description: "llama.cpp server — HIP backend, agentic/autonomous use"
        - name: ollama
          port: 11434
          protocol: tcp
          description: "Ollama — ROCm backend"
        - name: openwebui
          port: 8081
          protocol: tcp
          description: "OpenWebUI — chat UI, Authentik SSO"
        - name: searxng
          port: 8082
          protocol: tcp
          description: "SearXNG — web search, used by OpenWebUI RAG and directly by other LAN projects"
