# terraform/torrent-stack/ansible/cleanup.yml

---
- name: Unregister Torrent Stack from Server
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    portainer_server_ip: "{{ lookup('env', 'PORTAINER_SERVER_IP') | default('192.168.1.70') }}"
    portainer_server_port: "9000" 
    portainer_admin_user: "admin"
    portainer_admin_password: "{{ lookup('env', 'PORTAINER_ADMIN_PASSWORD') }}"
    agent_hostname: "{{ lookup('env', 'AGENT_HOSTNAME') | default('torrent-stack') }}"
    
  tasks:
    - name: Get Portainer authentication token
      ansible.builtin.uri:
        url: "http://{{ portainer_server_ip }}:{{ portainer_server_port }}/api/auth"
        method: POST
        body_format: json
        body:
          Username: "{{ portainer_admin_user }}"
          Password: "{{ portainer_admin_password }}"
        status_code: 200
        timeout: 30
      register: auth_response
      ignore_errors: true

    - name: Skip cleanup if authentication failed
      ansible.builtin.debug:
        msg: "Authentication failed - skipping agent cleanup (server may already be destroyed)"
      when: auth_response.failed | default(false)

    - name: Get list of endpoints to find target endpoint
      ansible.builtin.uri:
        url: "http://{{ portainer_server_ip }}:{{ portainer_server_port }}/api/endpoints"
        method: GET
        headers:
          Authorization: "Bearer {{ auth_response.json.jwt }}"
        status_code: 200
        timeout: 30
      register: endpoints_response
      when: not (auth_response.failed | default(false))
      ignore_errors: true

    - name: Find target endpoint ID by name
      ansible.builtin.set_fact:
        target_endpoint_id: "{{ item.Id }}"
        target_endpoint_name: "{{ item.Name }}"
      loop: "{{ endpoints_response.json | default([]) }}"
      when: 
        - not (auth_response.failed | default(false))
        - not (endpoints_response.failed | default(false))
        - item.Name == agent_hostname

    - name: Skip cleanup if endpoint not found
      ansible.builtin.debug:
        msg: "Endpoint '{{ agent_hostname }}' not found - may already be unregistered"
      when: target_endpoint_id is not defined

    - name: Remove any stacks associated with this endpoint
      ansible.builtin.uri:
        url: "http://{{ portainer_server_ip }}:{{ portainer_server_port }}/api/stacks"
        method: GET
        headers:
          Authorization: "Bearer {{ auth_response.json.jwt }}"
        status_code: 200
      register: stacks_response
      when: target_endpoint_id is defined
      ignore_errors: true

    - name: Delete associated stacks
      ansible.builtin.uri:
        url: "http://{{ portainer_server_ip }}:{{ portainer_server_port }}/api/stacks/{{ item.Id }}?endpointId={{ target_endpoint_id }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ auth_response.json.jwt }}"
        status_code: [204, 404]
      loop: "{{ stacks_response.json | default([]) }}"
      when:
        - target_endpoint_id is defined
        - not (stacks_response.failed | default(false))
        - item.EndpointId == (target_endpoint_id | int)
      ignore_errors: true

    - name: Unregister agent endpoint from Portainer server
      ansible.builtin.uri:
        url: "http://{{ portainer_server_ip }}:{{ portainer_server_port }}/api/endpoints/{{ target_endpoint_id }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ auth_response.json.jwt }}"
        status_code: [204, 404]
        timeout: 30
      register: cleanup_result
      when: target_endpoint_id is defined
      ignore_errors: true

    - name: Display cleanup result
      ansible.builtin.debug:
        msg: "Agent '{{ target_endpoint_name | default(agent_hostname) }}' successfully unregistered from Portainer server"
      when: 
        - target_endpoint_id is defined
        - not (cleanup_result.failed | default(false))

    - name: Display cleanup failure
      ansible.builtin.debug:
        msg: "Failed to unregister agent - this may be expected if server is already destroyed"
      when: cleanup_result.failed | default(false)