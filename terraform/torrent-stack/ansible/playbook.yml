# terraform/torrent-stack/ansible/playbook.yml

---
- name: Apply base Docker configuration with registry mirror
  hosts: portainer_agents
  remote_user: root
  become: true
  vars:
    docker_registry_mirror: "{{ lookup('env', 'REGISTRY_MIRROR_IP') | default('192.168.1.70') }}"
    enable_registry_mirror: "{{ lookup('env', 'ENABLE_REGISTRY_MIRROR') | default('true') | bool }}"
  roles:
    - ../../ansible/shared-roles/docker_base

- name: Configure Portainer Agent
  hosts: portainer_agents
  remote_user: root
  become: true
  vars:
    portainer_server_ip: "{{ hostvars['localhost']['portainer_server_ip'] | default('192.168.1.70') }}"
  roles:
    - ../../ansible/shared-roles/portainer_agent

- name: Register Agent with Portainer Server
  hosts: portainer_agents
  vars:
    portainer_server_ip: "{{ hostvars['localhost']['portainer_server_ip'] | default('192.168.1.70') }}"
    portainer_endpoint_name: "{{ inventory_hostname }}"
  roles:
    - ../../ansible/shared-roles/portainer_api

- name: Create required directories for torrent stack
  hosts: portainer_agents
  remote_user: root
  become: true
  tasks:
    - name: Create torrent application directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
        owner: '1000'
        group: '1000'
      loop:
        - /config/torrents/gluetun
        - /config/torrents/gluetun/wireguard
        - /config/torrents/qbittorrent
        - /config/torrents/prowlarr
        - /config/torrents/radarr
        - /config/torrents/sonarr
        - /config/torrents/lidarr
        - /media/video
        - /media/music
        - /downloads

- name: Debug environment variables
  hosts: portainer_agents
  tasks:
    - name: Show CONTAINER_VMID from environment
      debug:
        msg: "CONTAINER_VMID: {{ lookup('env', 'CONTAINER_VMID') }}"
      delegate_to: localhost
      
- name: Configure LXC container for VPN access
  hosts: portainer_agents
  vars:
    proxmox_api_url: "{{ lookup('env', 'TF_VAR_proxmox_api_url') }}"
    proxmox_node: "{{ lookup('env', 'TF_VAR_proxmox_node') | default('pvetest') }}"
    proxmox_token_id: "{{ lookup('env', 'TF_VAR_pm_api_token_id') }}"
    proxmox_token_secret: "{{ lookup('env', 'TF_VAR_pm_api_token_secret') }}"
    proxmox_host: "pvetest.gibbsgreatly.xyz"  # Your Proxmox host for SSH
  roles:
    - ../../ansible/shared-roles/lxc_tun_device

- name: Deploy Torrent Stack
  hosts: portainer_agents
  vars:
    portainer_server_ip: "{{ hostvars['localhost']['portainer_server_ip'] | default('192.168.1.70') }}"
    app_stack_name: "{{ inventory_hostname }}"
    app_stack_endpoint_name: "{{ inventory_hostname }}"
    app_stack_compose_content: |
      version: '3.8'
      services:
        gluetun:
          image: qmcgaw/gluetun
          container_name: gluetun
          cap_add:
            - NET_ADMIN
          devices:
            - /dev/net/tun
          environment:
            - VPN_TYPE=wireguard
            - TZ=Pacific/Auckland
            - VPN_SERVICE_PROVIDER=custom
            - HEALTH_TARGET_ADDRESS=8.8.8.8
            - HEALTH_VPN_DURATION_INITIAL=10s
          volumes:
            - /config/torrents/gluetun:/gluetun
            - /config/torrents/gluetun/wireguard:/gluetun/wireguard
          ports:
            - 8080:8888
          restart: unless-stopped
        qbittorrent:
          image: lscr.io/linuxserver/qbittorrent
          container_name: qbittorrent
          network_mode: "service:gluetun"
          depends_on:
            - gluetun
          environment:
            - PUID=1000
            - PGID=1000
            - TZ=Pacific/Auckland
            - WEBUI_PORT=8888
          volumes:
            - /config/torrents/qbittorrent:/config
            - /downloads:/downloads
          restart: unless-stopped
        flaresolverr:
          image: ghcr.io/flaresolverr/flaresolverr:latest
          container_name: flaresolverr
          environment:
            - LOG_LEVEL=info
            - TZ=Pacific/Auckland
          ports:
            - 8191:8191
          restart: unless-stopped
        prowlarr:
          image: lscr.io/linuxserver/prowlarr:latest
          container_name: prowlarr
          ports:
            - 9696:9696
          environment:
            - PUID=1000
            - PGID=1000
            - TZ=Pacific/Auckland
          volumes:
            - /config/torrents/prowlarr:/config
          restart: unless-stopped
        radarr:
          image: lscr.io/linuxserver/radarr:latest
          container_name: radarr
          ports:
            - 7878:7878
          environment:
            - PUID=1000
            - PGID=1000
            - TZ=Pacific/Auckland
          volumes:
            - /config/torrents/radarr:/config
            - /media/video:/media
            - /downloads:/downloads
          restart: unless-stopped
        sonarr:
          image: lscr.io/linuxserver/sonarr:latest
          container_name: sonarr
          ports:
            - 8989:8989
          environment:
            - PUID=1000
            - PGID=1000
            - TZ=Pacific/Auckland
          volumes:
            - /config/torrents/sonarr:/config
            - /media/video:/media
            - /downloads:/downloads
          restart: unless-stopped
        lidarr:
          image: lscr.io/linuxserver/lidarr:latest
          container_name: lidarr
          ports:
            - 8686:8686
          environment:
            - PUID=1000
            - PGID=1000
            - TZ=Pacific/Auckland
          volumes:
            - /config/torrents/lidarr:/config
            - /media/music:/media/music
            - /downloads:/downloads
          restart: unless-stopped
  roles:
    - ../../ansible/shared-roles/app_stack