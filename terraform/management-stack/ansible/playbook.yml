# terraform/management-stack/ansible/playbook.yml

---
- name: Prepare SSH known_hosts for management node
  hosts: localhost
  gather_facts: no
  vars:
    known_hosts_path: "~/.ssh/known_hosts"
    mgmt_host_ip: "{{ hostvars['management-stack'].ansible_host | default('192.168.1.70') }}"
  tasks:
    - name: Remove stale key (ignore if it's not there)
      ansible.builtin.command: "ssh-keygen -R {{ mgmt_host_ip }} -f {{ known_hosts_path }}"
      register: rm_key
      failed_when: false
      changed_when: rm_key.rc == 0

    - name: Scan and add current host key
      ansible.builtin.shell: "ssh-keyscan -T 5 -H {{ mgmt_host_ip }} >> {{ known_hosts_path }}"
      changed_when: true

- name: Apply base Docker configuration to all hosts
  hosts: all
  remote_user: root
  become: true
  roles:
    - ../../ansible/shared-roles/docker_base

- name: Deploy Portainer Server
  hosts: portainer_server
  remote_user: root
  become: true
  vars:
    portainer_container_name: "portainer"
    portainer_image: "portainer/portainer-ce:latest"
  roles:
    - portainer_server
  ignore_errors: true  # Allow playbook to continue if Portainer admin already exists

- name: Deploy Harbor Container Registry
  hosts: portainer_server
  remote_user: root
  become: false
  gather_facts: true

  pre_tasks:
    - name: Verify required environment variables for Harbor
      ansible.builtin.fail:
        msg: "Required environment variable {{ item }} is not set"
      when: 
        - lookup('env', item) == ''
      loop:
        - 'HARBOR_ADMIN_PASSWORD'
        - 'PORTAINER_ADMIN_PASSWORD'
      delegate_to: localhost

    - name: Wait for Portainer to be ready
      ansible.builtin.wait_for:
        host: "{{ ansible_default_ipv4.address }}"
        port: 9000
        timeout: 60
      delegate_to: localhost

  roles:
    - role: ../../ansible/shared-roles/harbor
      vars:
        portainer_server_ip: "{{ ansible_default_ipv4.address }}"

- name: Deploy Nginx Proxy Manager
  hosts: portainer_server
  remote_user: root
  become: true
  gather_facts: true

  roles:
    - role: ../../ansible/shared-roles/nginx_proxy_manager

- name: Deployment Summary
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Display final deployment summary
      ansible.builtin.debug:
        msg:
          - "Management Stack Deployment Complete!"
          - "- Portainer:           http://{{ portainer_fqdn }}:{{ portainer_port_http }}"
          - "- Harbor Registry:     http://{{ registry_fqdn }}"
          - "- Harbor UI:           http://{{ registry_ui_fqdn }}"
          - "- Trivy Server:        http://{{ trivy_fqdn }}"
          - "- Nginx Proxy Manager: http://{{ npm_fqdn }}"
