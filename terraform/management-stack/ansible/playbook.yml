# terraform/management-stack/ansible/playbook.yml

---
- name: Apply base Docker configuration to all hosts
  hosts: all
  remote_user: root
  become: true
  roles:
    - ../../ansible/shared-roles/docker_base

- name: Deploy Portainer Server
  hosts: portainer_server
  remote_user: root
  become: true
  vars:
    portainer_container_name: "portainer"
    portainer_image: "portainer/portainer-ce:latest"
  roles:
    - portainer_server
  ignore_errors: yes  # Allow playbook to continue if Portainer admin already exists

- name: Deploy Harbor Container Registry
  hosts: portainer_server
  remote_user: root
  become: false
  gather_facts: yes

  pre_tasks:
    - name: Verify required environment variables for Harbor
      ansible.builtin.fail:
        msg: "Required environment variable {{ item }} is not set"
      when: 
        - lookup('env', item) == ''
      loop:
        - 'HARBOR_ADMIN_PASSWORD'
        - 'PORTAINER_ADMIN_PASSWORD'
      delegate_to: localhost

    - name: Wait for Portainer to be ready
      ansible.builtin.wait_for:
        host: "{{ ansible_default_ipv4.address }}"
        port: 9000
        timeout: 60
      delegate_to: localhost

  roles:
    - role: ../../ansible/shared-roles/harbor
      vars:
        portainer_server_ip: "{{ ansible_default_ipv4.address }}"

- name: Deploy Nginx Proxy Manager
  hosts: portainer_server
  remote_user: root
  become: true
  gather_facts: yes

  roles:
    - role: ../../ansible/shared-roles/nginx_proxy_manager

- name: Deployment Summary
  hosts: localhost
  gather_facts: no
  vars:
    mgmt_host: "{{ hostvars['management-stack'].ansible_host | default('management-stack') }}"
    portainer_port_http:  "{{ lookup('env','PORTAINER_PORT_HTTP')  | default('9000') }}"
    harbor_registry_port: "{{ lookup('env','HARBOR_REGISTRY_PORT') | default('5000') }}"
    harbor_ui_port:       "{{ lookup('env','HARBOR_UI_PORT')       | default('5001') }}"
    trivy_port:           "{{ lookup('env','TRIVY_PORT')           | default('4954') }}"
    npm_admin_port:       "{{ lookup('env','NPM_ADMIN_PORT')       | default('81') }}"
    npm_http_port:        "{{ lookup('env','NPM_HTTP_PORT')        | default('80') }}"
    npm_https_port:       "{{ lookup('env','NPM_HTTPS_PORT')       | default('443') }}"
  tasks:
    - name: Display final deployment summary
      ansible.builtin.debug:
        msg:
          - "Management Stack Deployment Complete!"
          - "- Portainer: http://{{ mgmt_host }}:{{ portainer_port_http }}"
          - "- Harbor Registry: http://{{ mgmt_host }}:{{ harbor_registry_port }}"
          - "- Harbor UI:       http://{{ mgmt_host }}:{{ harbor_ui_port }}"
          - "- Trivy Server:    http://{{ mgmt_host }}:{{ trivy_port }}"
          - "- Nginx Proxy Manager: http://{{ mgmt_host }}:{{ npm_admin_port }} (admin UI), HTTP={{ npm_http_port }}, HTTPS={{ npm_https_port }}"
