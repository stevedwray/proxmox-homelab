# terraform/management-stack/ansible/playbook.yml

---
- name: Apply base Docker configuration to all hosts
  hosts: all
  remote_user: root
  become: true
  roles:
    - ../../ansible/shared-roles/docker_base

- name: Deploy Portainer Server
  hosts: portainer_server
  remote_user: root
  become: true
  vars:
    portainer_container_name: "portainer"
    portainer_image: "portainer/portainer-ce:latest"
    portainer_port_http: 9000
    portainer_port_https: 9443
  roles:
    - portainer_server
  ignore_errors: yes  # Allow playbook to continue if Portainer admin already exists

- name: Deploy Harbor Container Registry
  hosts: portainer_server
  remote_user: root
  become: false
  gather_facts: yes
  vars:
    enable_harbor: "{{ lookup('env', 'TF_VAR_enable_harbor') == 'true' }}"
  
  pre_tasks:
    - name: Verify required environment variables for Harbor
      ansible.builtin.fail:
        msg: "Required environment variable {{ item }} is not set"
      when: 
        - enable_harbor | bool
        - lookup('env', item) == ''
      loop:
        - 'HARBOR_ADMIN_PASSWORD'
        - 'PORTAINER_ADMIN_PASSWORD'
      delegate_to: localhost

    - name: Wait for Portainer to be ready
      ansible.builtin.wait_for:
        host: "{{ ansible_default_ipv4.address }}"
        port: 9000
        timeout: 60
      delegate_to: localhost

  roles:
    - role: ../../ansible/shared-roles/harbor
      when: enable_harbor | bool
      vars:
        portainer_server_ip: "{{ ansible_default_ipv4.address }}"

- name: Deploy Nginx Proxy Manager
  hosts: portainer_server
  remote_user: root
  become: true
  gather_facts: yes
  vars:
    enable_npm: "{{ lookup('env', 'ENABLE_NPM') == 'true' }}"

  pre_tasks:
    - name: Check if NPM is enabled
      ansible.builtin.debug:
        msg: "NPM deployment: {{ 'Enabled' if enable_npm else 'Disabled' }}"

  roles:
    - role: ../../ansible/shared-roles/nginx_proxy_manager
      when: enable_npm | bool

  post_tasks:
    - name: Display final deployment summary
      ansible.builtin.debug:
        msg:
          - "Management Stack Deployment Complete!"
          - "- Portainer: http://{{ ansible_default_ipv4.address }}:9000"
          - "- Harbor: http://{{ ansible_default_ipv4.address }}:80 ({{ 'Enabled' if (lookup('env', 'TF_VAR_enable_harbor') == 'true') else 'Disabled' }})"
          - "- Nginx Proxy Manager: http://{{ ansible_default_ipv4.address }}:81 ({{ 'Enabled' if enable_npm else 'Disabled' }})"
          - "{{ '- NPM Admin: Use existing credentials if migrated, or admin/changeme for fresh install' if enable_npm else '' }}"
