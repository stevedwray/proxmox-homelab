# File: management-stack/ansible/inventory.yml

all:
  children:
    management_stack:
      hosts:
        management-stack:
          ansible_host: 192.168.1.70
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
          ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ControlMaster=no -o ControlPersist=no -o ServerAliveInterval=30'
          ansible_ssh_retries: 3
          ansible_timeout: 30
          