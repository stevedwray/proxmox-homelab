# terraform/agent-stack/ansible/playbook.yml

---
- name: Apply base Docker configuration with registry mirror
  hosts: portainer_agents
  remote_user: root
  become: true
  vars:
    docker_registry_mirror: "{{ lookup('env', 'REGISTRY_MIRROR_IP') | default('192.168.1.70') }}"
    enable_registry_mirror: "{{ lookup('env', 'ENABLE_REGISTRY_MIRROR') | default('true') | bool }}"
  roles:
    - ../../ansible/shared-roles/docker_base

- name: Configure Portainer Agent
  hosts: portainer_agents
  remote_user: root
  become: true
  vars:
    # Override any defaults if needed
    portainer_server_ip: "{{ hostvars['localhost']['portainer_server_ip'] | default('192.168.1.70') }}"
  roles:
    - ../../ansible/shared-roles/portainer_agent

- name: Register Agent with Portainer Server
  hosts: portainer_agents
  vars:
    # Pass server IP from Terraform or use default
    portainer_server_ip: "{{ hostvars['localhost']['portainer_server_ip'] | default('192.168.1.70') }}"
    # Use inventory hostname as endpoint name
    portainer_endpoint_name: "{{ inventory_hostname }}"
  roles:
    - ../../ansible/shared-roles/portainer_api

- name: Deploy Nginx Test Stack
  hosts: portainer_agents
  vars:
    # Portainer connection details
    portainer_server_ip: "{{ hostvars['localhost']['portainer_server_ip'] | default('192.168.1.70') }}"
    # Stack configuration
    app_stack_name: "nginx-test-{{ inventory_hostname }}"
    app_stack_endpoint_name: "{{ inventory_hostname }}"
  roles:
    - ../../ansible/shared-roles/app_stack
