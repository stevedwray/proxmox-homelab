---
# Set NPM configuration variables from env (with sane defaults)
- name: Set NPM configuration variables
  set_fact:
    npm_data_target: "{{ lookup('env', 'NPM_DATA_TARGET') | default('/srv/npm/data') }}"
    npm_letsencrypt_target: "{{ lookup('env', 'NPM_LETSENCRYPT_TARGET') | default('/srv/npm/letsencrypt') }}"
    portainer_server_ip: "{{ ansible_default_ipv4.address }}"
    portainer_admin_password: "{{ lookup('env', 'PORTAINER_ADMIN_PASSWORD') }}"

- name: Ensure NPM data directories in container
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ npm_data_target }}"
    - "{{ npm_letsencrypt_target }}"

- name: Wait for Portainer to be ready
  wait_for:
    port: 9000
    host: localhost
    timeout: 120

# Authenticate with Portainer API
- name: Authenticate with Portainer
  uri:
    url: "http://{{ portainer_server_ip }}:9000/api/auth"
    method: POST
    body_format: json
    body:
      Username: "admin"
      Password: "{{ portainer_admin_password }}"
    headers:
      Content-Type: "application/json"
    timeout: 30
  register: auth_response

- name: Set JWT token
  set_fact:
    jwt_token: "{{ auth_response.json.jwt }}"

# Discover endpoint ID (do NOT assume 1)
- name: Get Portainer endpoints
  uri:
    url: "http://{{ portainer_server_ip }}:9000/api/endpoints"
    method: GET
    headers:
      Authorization: "Bearer {{ jwt_token }}"
    status_code: 200
    timeout: 30
  register: npm_portainer_endpoints

- name: Find local endpoint ID
  set_fact:
    npm_local_endpoint_id: "{{ item.Id }}"
  loop: "{{ npm_portainer_endpoints.json }}"
  when: item.Name == 'local'

- name: Fail if no local endpoint found
  fail:
    msg: "No 'local' endpoint found. Available: {{ npm_portainer_endpoints.json | map(attribute='Name') | list }}"
  when: npm_local_endpoint_id is not defined

# Create/Update NPM stack via Portainer API
- name: Create NPM Docker Compose stack
  uri:
    url: "http://{{ portainer_server_ip }}:9000/api/stacks/create/standalone/string?endpointId={{ npm_local_endpoint_id }}"
    method: POST
    headers:
      Authorization: "Bearer {{ jwt_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      method: "string"
      type: "standalone"
      Name: "nginx-proxy-manager"
      StackFileContent: |
        version: '3.8'
        services:
          nginx-proxy-manager:
            image: jc21/nginx-proxy-manager:latest
            container_name: nginx-proxy-manager
            restart: unless-stopped
            ports:
              - "80:80"
              - "81:81"
              - "443:443"
            volumes:
              - {{ npm_data_target }}:/data
              - {{ npm_letsencrypt_target }}:/etc/letsencrypt
            environment:
              DISABLE_IPV6: "true"
              LOG_LEVEL: "info"
            networks:
              - npm_network
            healthcheck:
              test: ["CMD-SHELL", "curl -f http://localhost:81 || exit 1"]
              interval: 30s
              timeout: 10s
              retries: 3
              start_period: 30s
        networks:
          npm_network:
            driver: bridge
      Env: []
    timeout: 60
  register: stack_creation

- name: Wait for NPM to be responsive
  wait_for:
    port: 81
    host: localhost
    timeout: 180
    delay: 10

- name: Verify NPM is running
  uri:
    url: "http://localhost:81"
    method: GET
    timeout: 10
  register: npm_health
  retries: 5
  delay: 10

- name: Display NPM status
  debug:
    msg: "NPM deployed successfully - Access at http://{{ ansible_default_ipv4.address }}:81"
