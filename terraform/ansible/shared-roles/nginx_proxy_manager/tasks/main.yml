# terraform/ansible/shared-roles/nginx_proxy_manager/tasks/main.yml
---
# Set NPM configuration variables (paths + auth); ports come from defaults/
- name: Set NPM configuration variables
  ansible.builtin.set_fact:
    npm_data_target: "{{ lookup('env', 'NPM_DATA_TARGET') | default('/srv/npm/data') }}"
    npm_letsencrypt_target: "{{ lookup('env', 'NPM_LETSENCRYPT_TARGET') | default('/srv/npm/letsencrypt') }}"
    portainer_admin_password: "{{ lookup('env', 'PORTAINER_ADMIN_PASSWORD') }}"

# Normalize ports to integers (handles empty env values safely)
- name: Normalize NPM ports
  ansible.builtin.set_fact:
    npm_http_port_i:  "{{ (npm_http_port  | default('80',  true)) | int }}"
    npm_admin_port_i: "{{ (npm_admin_port | default('81',  true)) | int }}"
    npm_https_port_i: "{{ (npm_https_port | default('443', true)) | int }}"

- name: Ensure NPM data directories in container
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ npm_data_target }}"
    - "{{ npm_letsencrypt_target }}"

# Build compose content as a string variable
- name: Build NPM docker-compose content
  ansible.builtin.set_fact:
    npm_compose: |
      version: '3.8'
      services:
        nginx-proxy-manager:
          image: jc21/nginx-proxy-manager:latest
          container_name: nginx-proxy-manager
          restart: unless-stopped
          ports:
            - "{{ npm_http_port_i }}:80"
            - "{{ npm_admin_port_i }}:81"
            - "{{ npm_https_port_i }}:443"
          volumes:
            - {{ npm_data_target }}:/data
            - {{ npm_letsencrypt_target }}:/etc/letsencrypt
          environment:
            DISABLE_IPV6: "true"
            LOG_LEVEL: "info"
          networks:
            - npm_network
          healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:81 || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
      networks:
        npm_network:
          driver: bridge

# === shared: auth + endpoint discovery
- import_role:
    name: ../../ansible/shared-roles/portainer_common
    tasks_from: endpoint.yml

# === shared: idempotent stack ensure
- import_role:
    name: ../../ansible/shared-roles/portainer_common
    tasks_from: stack_present.yml
  vars:
    stack_name: "nginx-proxy-manager"
    stackfile_content: "{{ npm_compose }}"
    prune_on_update: true

- name: Wait for NPM admin UI to be responsive
  ansible.builtin.wait_for:
    port: "{{ npm_admin_port_i }}"
    host: localhost
    timeout: 180
    delay: 10

- name: Verify NPM is running
  ansible.builtin.uri:
    url: "http://localhost:{{ npm_admin_port_i }}"
    method: GET
    timeout: 10
  register: npm_health
  retries: 5
  delay: 10

- name: Display NPM status
  ansible.builtin.debug:
    msg: "NPM ensured successfully — http://{{ ansible_default_ipv4.address }}:{{ npm_admin_port_i }}"
