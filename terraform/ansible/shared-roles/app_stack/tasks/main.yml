# terraform/ansible/shared-roles/app_stack/tasks/main.yml

---
- name: Get Portainer authentication token
  ansible.builtin.uri:
    url: "http://{{ portainer_server_ip }}:{{ portainer_server_port }}/api/auth"
    method: POST
    body_format: json
    body:
      Username: "{{ portainer_admin_user }}"
      Password: "{{ portainer_admin_password }}"
    status_code: 200
  register: auth_response
  delegate_to: localhost
  run_once: true

- name: Set auth token fact
  ansible.builtin.set_fact:
    portainer_token: "{{ auth_response.json.jwt }}"
  delegate_to: localhost
  run_once: true

- name: Get list of endpoints to find target endpoint ID
  ansible.builtin.uri:
    url: "http://{{ portainer_server_ip }}:{{ portainer_server_port }}/api/endpoints"
    method: GET
    headers:
      Authorization: "Bearer {{ portainer_token }}"
    status_code: 200
  register: endpoints_response
  delegate_to: localhost
  run_once: true

- name: Find target endpoint ID by name
  ansible.builtin.set_fact:
    target_endpoint_id: "{{ item.Id }}"
  loop: "{{ endpoints_response.json }}"
  when: item.Name == app_stack_endpoint_name
  delegate_to: localhost

- name: Fail if endpoint not found
  ansible.builtin.fail:
    msg: "Endpoint '{{ app_stack_endpoint_name }}' not found in Portainer"
  when: target_endpoint_id is not defined
  delegate_to: localhost

- name: Check if stack already exists
  ansible.builtin.uri:
    url: "http://{{ portainer_server_ip }}:{{ portainer_server_port }}/api/stacks"
    method: GET
    headers:
      Authorization: "Bearer {{ portainer_token }}"
    status_code: 200
  register: existing_stacks_response
  delegate_to: localhost

- name: Find existing stack ID
  ansible.builtin.set_fact:
    existing_stack_id: "{{ item.Id }}"
  loop: "{{ existing_stacks_response.json }}"
  when: item.Name == app_stack_name
  delegate_to: localhost

- name: Remove existing stack if it exists
  ansible.builtin.uri:
    url: "http://{{ portainer_server_ip }}:{{ portainer_server_port }}/api/stacks/{{ existing_stack_id }}?endpointId={{ target_endpoint_id }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ portainer_token }}"
    status_code: [204, 404]
  when: existing_stack_id is defined
  delegate_to: localhost
  ignore_errors: true

- name: Wait for endpoint to be ready
  ansible.builtin.uri:
    url: "http://{{ portainer_server_ip }}:{{ portainer_server_port }}/api/endpoints/{{ target_endpoint_id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ portainer_token }}"
    status_code: 200
  register: endpoint_status
  retries: 10
  delay: 5
  until: endpoint_status.json.Status == 1
  delegate_to: localhost

- name: Deploy Docker Compose stack via Portainer API
  ansible.builtin.uri:
    url: "http://{{ portainer_server_ip }}:{{ portainer_server_port }}/api/stacks/create/standalone/string?endpointId={{ target_endpoint_id }}"
    method: POST
    headers:
      Authorization: "Bearer {{ portainer_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      method: "string"
      type: "standalone"
      Name: "{{ app_stack_name }}"
      StackFileContent: "{{ app_stack_compose_content }}"
      Env: []
    status_code: 200
    timeout: 60
  register: stack_deployment_result
  retries: 3
  delay: 10
  until: stack_deployment_result.status == 200
  delegate_to: localhost

- name: Display deployment result
  ansible.builtin.debug:
    msg: "Stack '{{ app_stack_name }}' successfully deployed with ID: {{ stack_deployment_result.json.Id }} on endpoint '{{ app_stack_endpoint_name }}'"
  delegate_to: localhost
