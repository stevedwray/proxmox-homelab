# terraform/ansible/shared-roles/portainer_api/defaults/main.yml

---
# Portainer Server connection details
portainer_server_ip: "192.168.1.70"
portainer_server_port: "9000"

# Authentication credentials
portainer_admin_user: "admin"
portainer_admin_password: "{{ lookup('env', 'PORTAINER_ADMIN_PASSWORD') | mandatory('PORTAINER_ADMIN_PASSWORD environment variable is not set') }}"

# Agent registration details (these should be overridden by the calling stack)
portainer_endpoint_name: "{{ inventory_hostname }}"
portainer_agent_ip: "{{ ansible_host }}"
portainer_agent_port: "9001"
