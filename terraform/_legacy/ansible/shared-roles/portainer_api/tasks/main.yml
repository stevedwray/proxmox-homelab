# terraform/ansible/shared-roles/portainer_api/tasks/main.yml

---
- name: Get Portainer authentication token
  ansible.builtin.uri:
    url: "http://{{ portainer_server_ip }}:{{ portainer_server_port }}/api/auth"
    method: POST
    body_format: json
    body:
      Username: "{{ portainer_admin_user }}"
      Password: "{{ portainer_admin_password }}"
    status_code: 200
  register: auth_response
  delegate_to: localhost
  run_once: true

- name: Set auth token fact
  ansible.builtin.set_fact:
    portainer_token: "{{ auth_response.json.jwt }}"
  delegate_to: localhost
  run_once: true

- name: Register agent with Portainer Server
  ansible.builtin.uri:
    url: "http://{{ portainer_server_ip }}:{{ portainer_server_port }}/api/endpoints"
    method: POST
    headers:
      Authorization: "Bearer {{ portainer_token }}"
    body_format: form-urlencoded
    body:
      Name: "{{ portainer_endpoint_name }}"
      URL: "tcp://{{ portainer_agent_ip }}:{{ portainer_agent_port }}"
      EndpointCreationType: 2
      TLS: "true"
      TLSSkipVerify: "true"
      TLSSkipClientVerify: "true"
    status_code: 200
  register: registration_result
  delegate_to: localhost

- name: Display registration result
  ansible.builtin.debug:
    msg: "Agent '{{ portainer_endpoint_name }}' successfully registered with ID: {{ registration_result.json.Id }}"
  delegate_to: localhost