depends_on:
  - rp-29-strip-down-disposable-validation-containers
task_doc: docs/refactor-remove-portainer/tasks/30-classify-and-prune-disposable-sdn-objects.md
validation_note: |
  This task may legitimately complete as a no-op. Remove only SDN objects whose
  disposable and unused status is proven by host evidence and retained-stack
  analysis. Do not mix in Terraform or Ansible code changes.

context: |
  After the disposable validation CTs are gone, the remaining SDN footprint on
  pve-test needs to be classified. The goal is to remove only disposable
  leftovers and keep retained baseline network objects intact.

objective: |
  Classify current SDN objects as retained or disposable, and prune only the
  disposable leftovers that are proven unused.

workflow:
  steps:
    - Verify Task 29a evidence is present, explicitly marked complete, and preflight confirms pve-test.
    - Capture live SDN zones and VNets from pve-test.
    - Compare live SDN objects with the retained baseline and stack metadata.
    - Remove only proven-unused disposable objects, or record an explicit no-op.
    - Write docs/refactor-remove-portainer/reports/30-classify-and-prune-disposable-sdn-objects-report.md.
    - Stop after reporting and return control to the architect session.

postconditions:
  criteria:
    - Disposable SDN leftovers are removed only when safe.
    - Or the task records a validated no-op if nothing is safely removable.
    - No Sonar or Snyk scan is required for this exploratory cleanup step.

stop_conditions:
  - Preflight does not confirm pve-test.
  - Task 29a evidence is missing from disk or does not show Status: complete.
  - Dependency analysis cannot prove that a live SDN object is safe to remove.
  - Any attempted SDN object removal fails.
