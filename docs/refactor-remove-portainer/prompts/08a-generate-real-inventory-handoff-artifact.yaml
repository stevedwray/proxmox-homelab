---
id: rp-08a-real-inventory-handoff
title: "Generate real inventory handoff artifact for Task 09 preflight"
type: development
status: blocked
depends_on:
  - rp-00-inventory-template
  - rp-07-classify-stacks
  - rp-08-remove-local-exec
  - rp-08b-retire-legacy-stack-cleanup-path
task_doc: docs/refactor-remove-portainer/tasks/08a-generate-real-inventory-handoff-artifact.md
validation_note: |
  Run the pve-test preflight.
  Run source-only validation on harbor-stack metadata and terragrunt plan.
  Run task-complete validation with test -f, grep ansible_playbook, the python3
  extraction command, and terragrunt state show local_file.ansible_inventory.
  Run SonarCloud: ./with-secrets /home/steve/.local/bin/sonar-scanner

context: |
  Task 09 is blocked because no real generated inventory.yml handoff artifact
  exists yet. Decision 4 requires generated inventory to be the explicit
  Terraform -> Ansible handoff. This task creates or proves one representative
  artifact only; it is not Task 09 and it is not the rebuild gate.

  Task 08a cannot be retried unchanged. The prior attempt showed that
  destroy-time null_resource.stack_cleanup behavior can still invoke
  ansible-playbook cleanup paths during apply. Task 08b must retire that legacy
  path before Task 08a is executable.

  The representative stack is fixed to harbor-stack because Task 09 already
  validates against it, it declares ansible_playbook plus deployment_tier, and
  it exercises the normal platform handoff without making portainer-stack the
  special-case validator.

objective: |
  Produce and verify one real Terraform-generated harbor-stack inventory.yml
  artifact so Task 09 can start from a validated handoff file instead of being
  blocked on an implicit missing prerequisite.

workflow:
  steps:
    - Run preflight exactly as documented in the task doc. Stop on any target
      other than pve-test.
    - Run source-only detection for legacy stack_cleanup destroy-time Ansible
      cleanup behavior in terraform/lxc/main.tf. If detected, stop and return
      to Task 08b without running terragrunt apply.
    - Confirm harbor-stack still declares ansible_playbook and deployment_tier,
      and confirm terraform/lxc/main.tf still writes inventory.yml through
      local_file.ansible_inventory.
    - Run ./with-secrets bash -c 'cd terraform/lxc/stacks/harbor-stack && terragrunt plan'
      and keep the task narrow. Stop if the plan would widen into broader
      orchestration, undocumented targeting, or unrelated drift.
    - If terraform/lxc/stacks/harbor-stack/inventory.yml is absent, run
      ./with-secrets bash -c 'cd terraform/lxc/stacks/harbor-stack && terragrunt apply'
      as the minimum live action needed to generate the artifact.
    - If the artifact already exists, only treat the task as a no-op after
      proving Terraform provenance with terragrunt state show
      local_file.ansible_inventory.
    - Validate that inventory.yml exists, contains ansible_playbook, and that
      the python3 extraction command returns deploy-harbor-stack.
    - Do not create inventory.yml manually.
    - Do not run scripts/provision.sh.
    - Do not widen the task into full platform provisioning or the rebuild gate.

postconditions:
  criteria:
    - terraform/lxc/stacks/harbor-stack/inventory.yml exists as a real generated artifact.
    - The artifact contains ansible_playbook: deploy-harbor-stack.
    - The python3 extraction command returns deploy-harbor-stack.
    - terragrunt state show local_file.ansible_inventory proves Terraform manages the file.
    - The task stops at the handoff artifact and does not implement Task 09.

stop_conditions:
  - terraform/lxc/main.tf still contains destroy-time stack_cleanup behavior
    that invokes ansible-playbook cleanup.yml.
  - harbor-stack no longer declares ansible_playbook or deployment_tier: platform.
  - terragrunt plan or terragrunt apply would require bootstrapping another stack,
    invoking Ansible, or widening into full platform orchestration.
  - terragrunt plan or terragrunt apply reveals unrelated drift beyond the
    representative harbor-stack boundary.
  - inventory.yml exists but terragrunt state show local_file.ansible_inventory
    cannot prove Terraform manages it.
  - inventory.yml is absent after apply, ansible_playbook is missing, or the
    python3 extraction command does not return deploy-harbor-stack.
  - the task would require undocumented production-targeting or non-pve-test behavior.
