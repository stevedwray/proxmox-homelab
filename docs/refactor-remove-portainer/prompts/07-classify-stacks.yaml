---
id: rp-07-classify-stacks
title: "Add explicit deployment_tier to all stack.yaml files"
type: development
status: pending
depends_on: []
task_doc: docs/refactor-remove-portainer/tasks/07-classify-stacks.md
validation_note: |
  stack.yaml changes are metadata only and do not affect Terraform plan output.
  Confirm with terragrunt run-all plan after editing.

context: |
  The deployment_tier field classifies each stack for provision.sh and makes intent
  explicit. Every stack.yaml must declare it explicitly — there are no silent defaults.
  This task is independent and can run before or after Tasks 02-06.

  The following five platform stacks already have Portainer-free playbooks and require
  no playbook changes (only stack.yaml classification):
    portainer-stack, step-ca-stack, dns-stack, apt-cacher-stack, ci-runner-01

  The following five platform stacks have playbooks being updated in Tasks 02-06:
    harbor-stack, authentik-stack, monitoring-stack, proxy-stack, netbox-stack

  All ten must have deployment_tier: platform and portainer_agent: false in stack.yaml.

objective: |
  Add deployment_tier: platform and portainer_agent: false to all ten platform
  stack.yaml files. Confirm terraform plan is clean after the change.

workflow:
  steps:
    - Read each of the ten platform stack.yaml files before editing.
    - For each platform stack, add or set deployment_tier: platform and
      portainer_agent: false. If portainer_agent is already true, set it to false.
    - For any Phase 06 app stack stack.yaml files that exist (pihole-stack, arr-stack,
      jellyfin-stack, game-stack), add deployment_tier: apps.
    - Do not edit test-docker, test-lxc, or net-* stacks.
    - Run terragrunt run-all plan to confirm no infrastructure changes.

postconditions:
  criteria:
    - All ten platform stacks have deployment_tier: platform and portainer_agent: false.
    - No platform stack has portainer_agent: true.
    - Terraform plan is clean.

stop_conditions:
  - A platform stack has portainer_agent: true but no corresponding playbook in
    Tasks 02-06 — report the inconsistency before setting it to false.
  - Terraform plan shows any infrastructure change after the edits.
