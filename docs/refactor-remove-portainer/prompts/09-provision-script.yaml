---
id: rp-09-provision-script
title: "Create explicit Ansible orchestration path"
type: development
status: pending
depends_on:
  - rp-00-inventory-template
  - rp-07-classify-stacks
  - rp-08-remove-local-exec
task_doc: docs/refactor-remove-portainer/tasks/09-create-provision-script.md
validation_note: |
  Run shellcheck scripts/provision.sh.
  Test with ./with-secrets ./scripts/provision.sh --check --stack harbor-stack.
  Run SonarCloud: ./with-secrets /home/steve/.local/bin/sonar-scanner

context: |
  Terraform no longer calls Ansible for stack configuration. This script is the
  replacement orchestrator. It reads the inventory.yml files Terraform generates and
  runs each stack's playbook in dependency order. ansible_playbook is now a host var
  in the inventory after Task 00.

  The script must set the same ANSIBLE_* environment variables that the removed
  null_resource.ansible_provision was setting in main.tf.

  The task package now treats stack.yaml as the source of orchestration intent.
  Use deployment_tier and depends_on from stack metadata wherever practical, while
  preserving the approved current platform bootstrap order from decisions.md.

objective: |
  Create scripts/provision.sh with --tier, --stack, and --check flags. The script
  reads ansible_playbook from generated inventory.yml and derives target stacks
  from stack metadata rather than from a stale hardcoded list.

workflow:
  steps:
    - Read a generated inventory.yml (e.g. terraform/lxc/stacks/harbor-stack/inventory.yml)
      to confirm ansible_playbook is present as a host var and verify the Python3
      extraction expression produces the expected value. Use python3 (available in this
      environment) rather than yq (not installed). The extraction one-liner is:
        python3 -c "import yaml,sys; inv=yaml.safe_load(sys.stdin); grp=next(iter(inv['all']['children'].values())); host=next(iter(grp['hosts'].values())); print(host.get('ansible_playbook',''))" < inventory.yml
    - Read stack.yaml metadata to determine deployment_tier / depends_on handling.
    - Check the removed local-exec block in git history or from main.tf to confirm the
      exact ANSIBLE_* environment variable values (ANSIBLE_HOST_KEY_CHECKING, ANSIBLE_CONFIG,
      ANSIBLE_ROLES_PATH, ANSIBLE_LOCAL_TEMP, ANSIBLE_SSH_CONTROL_PATH_DIR).
    - Create scripts/provision.sh using the task document as the contract. Use the
      python3 extraction expression for ansible_playbook. Adjust the expression if the
      actual inventory structure differs from what the template produces.
    - Make the script executable with chmod +x.
    - Run shellcheck scripts/provision.sh — fix any issues.
    - Test the SKIP path with a stack that has no ansible_playbook, such as test-lxc
      if inventory exists.
    - If pve-test is up, test with --check --stack harbor-stack.
    - Update stack_apply in scripts/teardown-deploy-test.sh as specified in the task
      document: after the run_logged "deploy-${stack}" terragrunt apply call and before
      validate_stack_smoke, add guard_pve_test and run_logged "provision-${stack}" calling
      ./with-secrets ./scripts/provision.sh --stack "${stack}".

postconditions:
  criteria:
    - shellcheck passes with no errors or warnings.
    - Script outputs SKIP for stacks with no inventory.yml.
    - Script outputs SKIP for stacks with no ansible_playbook in inventory.
    - Script derives orchestration targets from stack metadata.
    - ./with-secrets ./scripts/provision.sh --check --stack harbor-stack exits 0.
    - stack_apply in scripts/teardown-deploy-test.sh calls provision.sh after terragrunt apply.

stop_conditions:
  - ansible_playbook is not in the generated inventory despite Task 00 being complete
    — report the inventory structure and inventory.tpl content.
  - The script design requires a silent hardcoded stack list that cannot be justified
    from stack metadata and decisions.md — report the gap before proceeding.
  - python3 or the yaml module is not available — report the python3 version and
    module availability before proceeding. (Note: python3 3.14.4 is confirmed available.)
  - The python3 extraction expression fails or returns an unexpected value against a
    real generated inventory — report the actual inventory structure and python3 version.
  - shellcheck reports errors that cannot be fixed without changing the script design
    — report the errors.
