---
id: rp-03-authentik-playbook
title: "Update authentik playbook — remove portainer_agent"
type: development
status: complete
depends_on: [rp-01-direct-stack-role]
task_doc: docs/refactor-remove-portainer/tasks/03-update-authentik-playbook.md
validation_note: |
  Run ansible-lint on the playbook from terraform/lxc/ansible/ after editing.
  Run SonarCloud: ./with-secrets /home/steve/.local/bin/sonar-scanner

context: |
  Authentik is the identity provider and bootstrap-critical. The playbook currently
  installs a Portainer agent on the container via the portainer_agent role in Play 1.
  Authentik's Docker deployment uses community.docker.docker_compose_v2 inline — it
  does NOT use app_stack. The actual deployment is already Portainer-independent.
  The only change needed is removing portainer_agent and masking the service.

  Play 2 contains Authentik-specific configuration that is critical for bootstrap:
  env file writing with AUTHENTIK_BOOTSTRAP_TOKEN and AUTHENTIK_BOOTSTRAP_PASSWORD,
  Docker daemon registry trust, compose validation, docker_compose_v2 deployment, and
  live/ready health checks. Play 2 must not be modified.

objective: |
  Remove portainer_agent from Play 1, add the platform-tier service mask task from the
  task document, rename the play. Do not touch Play 2.

workflow:
  steps:
    - Read the full playbook terraform/lxc/ansible/playbooks/deploy-authentik-stack.yml.
    - Confirm Play 1 has roles lxc_base, docker_base, portainer_agent and no app_stack.
    - Confirm Play 2 uses community.docker.docker_compose_v2 and has live/ready health
      checks. Confirm it does not use portainer_api or app_stack.
    - "In Play 1: remove portainer_agent from the roles list. Remove any portainer_agent_*
      vars. If Play 1 has no tasks section, add one containing only the service mask task
      from the task document (systemd task: name portainer-agent.service, masked true,
      enabled false, failed_when false). If it already has a tasks section, append the
      mask task at the end. Rename the play to Configure Docker base."
    - Do not change Play 2 in any way.
    - Run ansible-lint from terraform/lxc/ansible/.
    - Add a run_logged "syntax-check-deploy-authentik-stack" step to run_source_preflight_checks
      in scripts/teardown-deploy-test.sh as specified in the task document.
    - Run scripts/teardown-deploy-test.sh source-preflight to confirm the syntax check passes.

postconditions:
  criteria:
    - grep -in portainer returns only the mask task service name string.
    - ansible-lint passes.
    - Play 2 health checks and bootstrap credential injection are intact.
    - scripts/teardown-deploy-test.sh source-preflight passes syntax-check-deploy-authentik-stack.

stop_conditions:
  - portainer_agent role appears in Play 2 — report before proceeding.
  - Play 1 contains any inline task doing Portainer API work beyond the role inclusion
    — report before removing.
