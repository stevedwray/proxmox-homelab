validation_note: |
  Keep the platform-only helper narrow, make it non-interactive, and update the
  downstream task contracts so inventory-content-driven
  null_resource.ansible_provision replacement is treated as orchestration-only
  churn until Task 08 removes that resource.
branching_note: |
  Cut a short-lived branch from dev/pve-test for this one task. Validate on
  that branch. Do not merge to main. If the task is verified and tied to an
  issue, commit with Closes #N and report the branch name, commit SHA, and
  merge readiness back to the architecture session.

context: |
  Task 00 showed two remaining downstream validation problems:
  1. the platform-only helper can stop on an interactive backend migration prompt
  2. inventory-content changes can legitimately replace null_resource.ansible_provision
     before Task 08 removes it

objective: |
  Make downstream plan validation non-interactive and align the task contracts
  with the current Terraform boundary before retrying Task 00 or Task 07.

workflow:
  steps:
    - Read scripts/validate-portainer-refactor-platform-plan.sh, terraform/lxc/main.tf,
      terraform/lxc/terragrunt.hcl, the runbook, Task 00 doc, Task 07 doc, and both prompts.
    - Keep the helper platform-only and fail-fast, but make it complete non-interactively.
    - Do not widen it to test-docker, test-lxc, the root terraform/lxc unit, or net-* stacks.
    - Update the runbook so downstream dry-plan checks distinguish acceptable
      orchestration-only null-resource churn from unacceptable LXC infrastructure drift.
    - Update Task 00 and its prompt to allow local_file.ansible_inventory content diffs
      plus null_resource.ansible_provision replacement when that replacement is driven only
      by inventory_content.
    - Keep generated inventory greps as optional evidence only when inventory.yml artifacts
      already exist locally.
    - Update Task 07 and its prompt only as needed for consistency with the hardened helper.
    - Unblock Task 00 and Task 07 in the package.
    - Run shellcheck on the helper.
    - Run ./scripts/validate-portainer-refactor-platform-plan.sh.

postconditions:
  criteria:
    - The platform-only helper completes non-interactively.
    - Task 00 now allows documented orchestration-only null-resource churn.
    - Task 00 and Task 07 both reference the hardened helper consistently.
    - Task 00 and Task 07 are unblocked in the package.

stop_conditions:
  - Making the helper non-interactive would require widening validation scope.
  - null_resource.ansible_provision replacement implies real LXC infrastructure drift.
  - Resolving the backend prompt would require live apply or manual state surgery.
