---
id: rp-08-remove-local-exec
title: "Remove ansible_provision null_resource from Terraform"
type: development
status: pending
depends_on:
  - rp-02-harbor-playbook
  - rp-03-authentik-playbook
  - rp-04-monitoring-playbook
  - rp-05-proxy-playbook
  - rp-06-netbox-playbook
task_doc: docs/refactor-remove-portainer/tasks/08-remove-terraform-local-exec.md
validation_note: |
  Run Snyk IaC after this task:
  /home/steve/.local/bin/snyk iac test terraform/

context: |
  Terraform currently invokes Ansible for stack configuration via null_resource.
  ansible_provision. All platform playbooks have been updated (Tasks 02-06) so Ansible
  can be run independently. This task removes that local-exec invocation.

  IMPORTANT: main.tf contains five other null_resources that call ansible-playbook for
  Proxmox host-level infrastructure operations. These must be retained:
    configure_network_sdn_attachment, configure_keyctl, prime_sdn_host_route,
    configure_network_firewall, configure_network_vnet_firewall

  Only null_resource.ansible_provision is removed. The ansible_playbook field in
  local_file.ansible_inventory is also retained — provision.sh reads it.

objective: |
  Remove null_resource.ansible_provision from terraform/lxc/main.tf. Retain all five
  infrastructure null_resources. Confirm plan shows only that resource's removal.

workflow:
  steps:
    - Read terraform/lxc/main.tf in full.
    - Locate null_resource.ansible_provision (search for ansible_provision in resource
      names). Read its full block.
    - Remove the entire null_resource.ansible_provision block.
    - Check null_resource.stack_cleanup — read it in full. If it invokes the stack
      configuration playbook on destroy, remove only that ansible-playbook call. If it
      does other cleanup, retain those parts or stop and report.
    - Remove depends_on entries in other resources that reference ansible_provision.
    - Remove locals exclusively used by ansible_provision and not by any retained
      resource or local_file.ansible_inventory.
    - Run terraform fmt on main.tf.
    - Run terragrunt run-all plan — must show only null_resource.ansible_provision[0]
      removal, no infrastructure changes.
    - Run snyk iac test terraform/.

postconditions:
  criteria:
    - grep -n ansible_provision terraform/lxc/main.tf returns no resource declarations.
    - All five infrastructure null_resources are present and unchanged.
    - local_file.ansible_inventory still passes ansible_playbook to the template.
    - terraform plan is clean.
    - Snyk IaC clean.

stop_conditions:
  - null_resource.ansible_provision cannot be found under that name — search for the
    local-exec pattern and report what is found.
  - A retained null_resource has depends_on pointing to ansible_provision — flag before
    removing that dependency.
  - terraform plan shows any LXC infrastructure change after the edit.
  - stack_cleanup invokes both the stack playbook and other non-playbook work in the
    same local-exec block — report the block content.
