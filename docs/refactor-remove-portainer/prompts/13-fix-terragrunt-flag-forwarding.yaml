    - Update runbook final rebuild-gate destroy/apply commands to forward flags
      after `--`.
    - Align 02-terraform-ansible-separation.md, 03-refactor-plan.md, and
      terraform/lxc/README.md so they do not conflict with runbook wording.
    - Run source-only command checks plus Sonar.

