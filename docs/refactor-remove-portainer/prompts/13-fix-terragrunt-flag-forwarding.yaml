context: |
  The latest rebuild-gate attempt stopped with needs-package-update, not an
  implementation failure. Terragrunt stopped at the first destroy command
  because the package currently places `-auto-approve` directly after `destroy`
  in `terragrunt run --all ...` form.

  Terragrunt 1.0.2 requires OpenTofu/Terraform flags to be forwarded after
  `--` (for example: `terragrunt run --all -- destroy -auto-approve`).

objective: |
  Update package docs so operator-facing rebuild-gate commands consistently use
  valid Terragrunt flag forwarding while preserving:
  - stack-only `--working-dir terraform/lxc/stacks`
  - non-interactive execution
  - the explicit Terraform -> inventory -> Ansible model

