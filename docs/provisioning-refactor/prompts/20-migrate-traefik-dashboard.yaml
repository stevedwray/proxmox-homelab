---
id: pr-20-migrate-traefik-dashboard
title: "Migrate Traefik dashboard route"
type: deployment
status: pending
depends_on:
  - pr-18-migrate-portainer
  - pr-19-migrate-netbox
task_doc: docs/provisioning-refactor/tasks/20-migrate-traefik-dashboard.md
validation_note: |
  When this task changes Python, shell, or YAML files, run SonarCloud through
  ./with-secrets because the Sonar token is stored in SOPS:
  ./with-secrets /home/steve/.local/bin/sonar-scanner

context: |
  Migrate exactly one host: traefik.lab.gibbsgreatly.xyz.

objective: |
  Move dashboard route/DNS/Auth to stack-owned provisioning using api@internal.

settings: |
  apiVersion: homelab.gibbsgreatly.xyz/v1alpha1
  kind: EdgeManifest
  metadata:
    name: proxy-edge
    stack: proxy-stack
  spec:
    routes:
      - name: traefik-dashboard
        host: traefik.lab.gibbsgreatly.xyz
        backend:
          type: traefikService
          service: api@internal
        dns:
          enabled: true
          target: 10.57.2.10
          ttl: 5m
        tls:
          resolver: letsencrypt
        auth:
          mode: forwardAuth

workflow:
  steps:
    - Verify pve-test targeting.
    - Add proxy-stack/edge.yaml.
    - Dry-run with intended replacement host.
    - Confirm api@internal handling.
    - Apply generated state and remove central route in one publish unit.
    - Validate Authentik redirect.

postconditions:
  criteria:
    - Dashboard route is generated and all migrated routes still work.
    - Full baseline reconcile-edge.py run, with no manifest args, passes with zero issues.
    - Generated route includes Authentik forward-auth middleware.
    - api@internal renders as a Traefik service reference, not a load balancer URL.
