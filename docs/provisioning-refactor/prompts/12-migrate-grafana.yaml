---
id: pr-12-migrate-grafana
title: "Migrate Grafana to stack-owned provisioning"
type: deployment
status: pending
depends_on:
  - pr-11-migrate-authentik
task_doc: docs/provisioning-refactor/tasks/12-migrate-grafana.md

context: |
  Migrate exactly one service: grafana.lab.gibbsgreatly.xyz. Grafana uses native
  OIDC; do not add Traefik forward-auth.

objective: |
  Grafana route and DNS are stack-owned while Grafana OIDC remains authoritative.

workflow:
  steps:
    - id: preflight
      name: Verify pve-test targeting
      commands:
        - "./with-secrets bash -c 'echo $TF_VAR_proxmox_node'"
    - id: manifest
      name: Add monitoring stack edge manifest
      commands:
        - "Create or update terraform/lxc/stacks/monitoring-stack/edge.yaml"
    - id: apply
      name: Render, publish, and validate
      commands:
        - "Run validator"
        - "Render Traefik and DNS"
        - "Confirm no Traefik forward-auth"
        - "Validate Grafana OIDC behavior"
    - id: cleanup
      name: Remove legacy Grafana route only
      commands:
        - "Delete central Grafana router/service after generated path works"

postconditions:
  criteria:
    - id: no-double-auth
      description: Grafana is not protected by both forward-auth and OIDC
