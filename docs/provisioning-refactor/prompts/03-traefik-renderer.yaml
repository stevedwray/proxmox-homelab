---
id: pr-03-traefik-renderer
title: "Implement Traefik dynamic config renderer"
type: development
status: pending
depends_on:
  - pr-02-manifest-validator
task_doc: docs/provisioning-refactor/tasks/03-traefik-renderer.md

context: |
  Render per-stack Traefik dynamic config from validated manifests. Keep central
  Traefik runtime config unchanged.

objective: |
  Generate deterministic files equivalent to /opt/proxy-stack/dynamic/stacks/<stack>.yml.

workflow:
  steps:
    - id: validate-input
      name: Validate manifests first
      commands:
        - "Call manifest validator"
    - id: render
      name: Render per-stack files
      commands:
        - "Map auth modes to middleware usage"
        - "Map url and traefikService backends"
        - "Sort output deterministically"
    - id: collision-check
      name: Detect collisions
      commands:
        - "Check generated hosts against generated manifests"
        - "Check generated hosts against central legacy proxy routes"
    - id: tests
      name: Validate output
      commands:
        - "Parse YAML"
        - "Check semantic references"

postconditions:
  criteria:
    - id: dry-run-safe
      description: Renderer can run without deploying or removing central routes
