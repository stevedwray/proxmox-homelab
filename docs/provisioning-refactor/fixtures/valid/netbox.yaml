apiVersion: homelab.gibbsgreatly.xyz/v1alpha1
kind: EdgeManifest
metadata:
  name: netbox-edge
  stack: netbox-stack
spec:
  routes:
    - name: netbox
      host: netbox.lab.gibbsgreatly.xyz
      backend:
        type: url
        url: http://10.57.1.26:8000
      dns:
        enabled: true
        target: 10.57.2.10
        ttl: 5m
      tls:
        resolver: letsencrypt
      auth:
        mode: forwardAuth
