apiVersion: homelab.gibbsgreatly.xyz/v1alpha1
kind: EdgeManifest
metadata:
  name: bad-domain-edge
  stack: test-stack
spec:
  routes:
    - name: bad-domain
      host: bad.example.com
      backend:
        type: url
        url: http://10.57.1.32:8080
      dns:
        enabled: true
        target: 10.57.2.10
        ttl: 5m
      tls:
        resolver: letsencrypt
      auth:
        mode: forwardAuth
