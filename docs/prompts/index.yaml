---
# Session Prompt Index
#
# Each entry is a YAML file in this directory that defines a discrete unit of
# development work. Use the file as the system prompt for a Claude Code session
# to get a fully-briefed agent ready to do that specific task.
#
# Types:
#   remediation  - fixing code that exists but is incorrect or incomplete
#   deployment   - executing the IaC against pve-test (Mode 2 work)
#   development  - writing new code, playbooks, or Terraform
#   operations   - discovery, validation, or read-only work
#
# Status values:
#   pending      - not started
#   in-progress  - partially complete
#   complete     - done and merged

prompts:

  # ── Phase 04 Remediation ────────────────────────────────────────────────────
  # These must be done before any clean rebuild pass. Current playbooks bake
  # credentials into on-disk files — they must be fixed first.
  #
  # Gate semantics:
  # - remediation prompts are code-hardening gates (playbook/template correctness)
  # - deployment prompts are runtime gates (real secrets, apply, health checks)

  - id: rem-01-authentik-secrets
    file: remediation-01-authentik-secrets.yaml
    title: "Fix Authentik playbook — code hardening gate for SOPS env_file pattern"
