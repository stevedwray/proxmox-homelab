---
id: p05-03-cosign-signing
title: "Generate Cosign keys and add image signing to CI"
phase: "05"
type: development
status: pending
github_issue: "#110"
task_doc: docs/plan/tasks/05-supply-chain-03-cosign-signing.md

context: |
  Phase 05 supply chain — image signing. Cosign provides cryptographic proof that
  an image was built by this CI pipeline and has passed the Trivy scan. Images are
  signed by digest (not tag) to prevent tag mutation attacks.

  Key generation happens once on the workstation. The public key is committed to
  the repo; the private key is stored as a GitHub Actions secret. Signing only runs
  after trivy-image-scan passes — never sign an image that failed the scan.

  SECURITY WARNING: cosign.key must never be committed to git. Verify .gitignore
  before ANY git add operation in this task.

preconditions:
  repository:
    - id: gitignore
      description: cosign.key is in .gitignore (verify before generating)
      verify: "grep cosign.key .gitignore"
      action_if_missing: "echo 'cosign.key' >> .gitignore && git add .gitignore && git commit -m 'chore: add cosign.key to gitignore'"
    - id: trivy-job-exists
      description: trivy-image-scan job exists in CI workflow
      verify: "grep -r 'trivy-image-scan' .github/workflows/"
      expect: Match found

  infrastructure:
    - id: cosign-cli
      description: cosign CLI is available on the workstation
      verify: "cosign version"
      action_if_missing: Install from https://github.com/sigstore/cosign/releases

    - id: ci-runner
      description: ci-runner-01 is registered and online
      verify: "gh run list --limit 1"

objective: |
  cosign.pub is committed to certs/cosign.pub. cosign.key is NOT in git.
  COSIGN_KEY and COSIGN_PASSWORD are set as GitHub Actions secrets.
  Cosign is installed on ci-runner-01 at a pinned version.
  A sign-image CI job exists that runs after trivy-image-scan and signs by digest.

branch: feat/cosign-signing

workflow:
  tooling:
    note: |
      Key generation runs on the workstation with the cosign CLI.
      ./with-secrets ansible-playbook to re-run ci-runner playbook.
      Run ansible commands from terraform/lxc/ansible so roles_path resolves correctly.
      gh to set GitHub Actions secrets.
      NEVER commit cosign.key — check git status before every git add.

  steps:
    - id: 1
      name: Create branch
      commands:
        - git checkout dev/pve-test && git pull
        - git checkout -b feat/cosign-signing

    - id: 2
      name: Verify cosign.key is in .gitignore (BEFORE key generation)
      commands:
        - "grep cosign.key .gitignore"
      decision:
        if_absent: |
          echo 'cosign.key' >> .gitignore
          git add .gitignore
          git commit -m "chore: add cosign.key to gitignore"

    - id: 3
      name: Generate key pair on workstation
      commands:
        - "cosign generate-key-pair"
      notes:
        - Enter a strong passphrase — this becomes COSIGN_PASSWORD
        - Creates cosign.key (encrypted private key) and cosign.pub (public key)
        - cosign.key stays on disk temporarily to be stored as a GH secret — then can be deleted

    - id: 4
      name: Store private key and password as GitHub Actions secrets
      commands:
        - "cat cosign.key | gh secret set COSIGN_KEY"
        - "gh secret set COSIGN_PASSWORD"
      notes:
        - COSIGN_KEY value is the entire PEM content of cosign.key
        - COSIGN_PASSWORD is the passphrase used when generating

    - id: 5
      name: Add cosign.pub to repo
      commands:
        - "mkdir -p certs"
        - "cp cosign.pub certs/cosign.pub"
        - "git status | grep cosign.key"
      expected: cosign.key must NOT appear in git status output before adding

    - id: 6
      name: Check current Cosign stable release
      commands:
        - "WebFetch: https://github.com/sigstore/cosign/releases/latest — note the version"

    - id: 7
      name: Add Cosign install task to deploy-ci-runner.yml
      commands:
        - "Read: terraform/lxc/ansible/playbooks/deploy-ci-runner.yml"
      change: |
        Add Cosign install task:

          - name: Install Cosign <VERSION>
            ansible.builtin.shell: |
              curl -sSfL \
                "https://github.com/sigstore/cosign/releases/download/v<VERSION>/cosign-linux-amd64" \
                -o /usr/local/bin/cosign && chmod +x /usr/local/bin/cosign
            args:
              creates: /usr/local/bin/cosign

    - id: 8
      name: Re-run ci-runner playbook to install Cosign
      commands:
        - cd /home/steve/git/proxmox-homelab/terraform/lxc/ansible
        - "../../../with-secrets ansible -i '10.57.0.63,' -u root all -m ping"
        - "../../../with-secrets ansible-playbook -i '10.57.0.63,' -u root playbooks/deploy-ci-runner.yml"
        - "ssh root@10.57.0.63 'cosign version'"

    - id: 9
      name: Add sign-image CI job
      change: |
        Add to the build workflow, AFTER trivy-image-scan:

          sign-image:
            name: Sign image
            runs-on: [self-hosted, pve-test, build]
            needs: [trivy-image-scan]
            steps:
              - name: Sign image by digest
                env:
                  COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
                  COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
                run: |
                  echo "$COSIGN_KEY" > /tmp/cosign.key
                  IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' \
                    10.57.3.10/<project>/<image>:${{ github.sha }})
                  cosign sign --key /tmp/cosign.key "$IMAGE_DIGEST"
                  rm -f /tmp/cosign.key

        The job must use needs: [trivy-image-scan] — images that fail the scan are NOT signed.

    - id: 10
      name: Verify cosign.key is NOT staged
      commands:
        - "git status | grep cosign.key"
      expected: Empty output — cosign.key must not appear

    - id: 11
      name: Security scan
      commands:
        - "./with-secrets sonar-scanner"

    - id: 12
      name: Commit and merge
      commands:
        - git add certs/cosign.pub terraform/lxc/ansible/playbooks/deploy-ci-runner.yml .github/workflows/
        - "git status | grep cosign.key"
        - |
          git commit -m "feat(ci): add Cosign image signing — key pair, CI job, runner install

          Closes #110

          Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>"
        - git checkout dev/pve-test && git merge feat/cosign-signing
        - git push origin dev/pve-test
        - gh issue close 110 --comment "Fixed in $(git rev-parse HEAD)"

postconditions:
  criteria:
    - id: public-key-committed
      description: cosign.pub is in the repo under certs/
      verify: "git ls-files certs/cosign.pub"
      expect: "certs/cosign.pub"

    - id: private-key-not-committed
      description: cosign.key is NOT in git
      verify: "git ls-files cosign.key"
      expect: Empty output

    - id: gh-secrets-set
      description: COSIGN_KEY and COSIGN_PASSWORD are set as GitHub Actions secrets
      verify: "gh secret list | grep -E 'COSIGN_KEY|COSIGN_PASSWORD'"
      expect: Both listed

    - id: cosign-on-runner
      description: Cosign installed on ci-runner-01
      verify: "ssh root@10.57.0.63 'cosign version'"

    - id: sign-job-exists
      description: sign-image job in CI workflow with needs trivy-image-scan
      verify: "grep -A3 'sign-image' .github/workflows/ | grep 'needs.*trivy'"
      expect: Match found

security_scan:
  when: Before merging
  commands:
    - "./with-secrets sonar-scanner"

merge:
  target: dev/pve-test

notes:
  - After Phase 06 produces real image builds, verify signing works end-to-end:
    'cosign verify --key certs/cosign.pub 10.57.3.10/<project>/<image>@<digest>'
  - cosign.key may be deleted from the workstation after the GH secret is set —
    it is encrypted and regenerable, but the passphrase must be remembered
  - Sign images by digest (sha256:...) not by tag — tags are mutable, digests are not
