---
id: rem-01-authentik-secrets
title: "Fix Authentik playbook — secrets injection via SOPS env_file"
phase: "04-remediation"
type: remediation
status: pending
task_doc: docs/plan/tasks/04-core-services-01-deploy-authentik.md

context: |
  The Authentik stack playbook (deploy-authentik-stack.yml) currently writes
  AUTHENTIK_SECRET_KEY, AUTHENTIK_POSTGRES_PASSWORD, and related credentials
  directly into the docker-compose.yml file on disk inside the LXC at
  /opt/authentik-stack/docker-compose.yml. This means every rebuild or playbook
  re-run leaves literal credentials in a file inside the container.

  The correct pattern is:
  1. ./with-secrets injects SOPS secrets as environment variables into the shell
  2. The Ansible playbook reads those env vars using lookup('env', 'VAR_NAME')
  3. The playbook writes a /opt/authentik-stack/.env file with the values
  4. docker-compose.yml references env_file: .env and contains no literal values
  5. Container environment: blocks reference ${VAR_NAME} syntax

  This task fixes the playbook to implement the env_file pattern. It is a code
  change only — no containers are started during this task.

preconditions:
  repository:
    - id: branch
      description: Working on dev/pve-test or a short-lived branch from it
      verify: "git branch --show-current"
    - id: playbook-exists
      description: deploy-authentik-stack.yml exists
      verify: "ls terraform/lxc/ansible/playbooks/deploy-authentik-stack.yml"
  secrets:
    - key: AUTHENTIK_SECRET_KEY
      note: Must have a real value in terraform/secrets.enc.yaml (not CHANGEME_)
      verify: |
        SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt \
          sops --decrypt terraform/secrets.enc.yaml | grep AUTHENTIK_SECRET_KEY
    - key: AUTHENTIK_POSTGRES_PASSWORD
      verify: same as above
    - key: AUTHENTIK_SUPERUSER_PASSWORD
      verify: same as above
  no_running_containers: |
    This is a code-only task. No Authentik container needs to be running.
    Validation is done by inspecting the playbook output on a test deploy.

objective: |
  deploy-authentik-stack.yml writes a /opt/authentik-stack/.env file sourced from
  SOPS-injected environment variables, docker-compose.yml uses env_file: .env and
  contains no literal credential values, and ./with-secrets wraps all invocations.

branch: fix/authentik-secrets-injection

workflow:
  tooling:
    note: |
      All commands that need secrets must be wrapped with ./with-secrets.
      Run ansible commands from terraform/lxc/ansible so roles_path resolves correctly.
      Never use source .env directly. Never pass secrets via --extra-vars.
      Read/Edit/Write tools are used for code changes; Bash only for verification.

  steps:
    - id: 1
      name: Create branch
      commands:
        - git checkout dev/pve-test && git pull
        - git checkout -b fix/authentik-secrets-injection

    - id: 2
      name: Read the current playbook
      description: |
        Understand the current structure before making changes.
      commands:
        - "Read: terraform/lxc/ansible/playbooks/deploy-authentik-stack.yml"
      notes:
        - Identify every place a secret value is embedded (environment:, vars:, copy: content:)
        - Note which tasks write docker-compose.yml or any config file

    - id: 3
      name: Read the current compose file (if one is templated in the playbook)
      commands:
        - "Look for template: or copy: content: blocks that produce docker-compose.yml"
        - "Read the inline compose YAML within the playbook"

    - id: 4
      name: Implement the env_file pattern
      description: |
        Replace any inline secrets with the three-part env_file pattern.
      changes_needed:
        - part: Write .env task
          description: |
            Add an Ansible task that writes /opt/authentik-stack/.env from
            SOPS-injected environment variables:

              - name: Write secrets to .env
                copy:
                  content: |
                    AUTHENTIK_SECRET_KEY={{ lookup('env', 'AUTHENTIK_SECRET_KEY') }}
                    AUTHENTIK_POSTGRES_PASSWORD={{ lookup('env', 'AUTHENTIK_POSTGRES_PASSWORD') }}
                    AUTHENTIK_SUPERUSER_PASSWORD={{ lookup('env', 'AUTHENTIK_SUPERUSER_PASSWORD') }}
                  dest: /opt/authentik-stack/.env
                  mode: '0600'

        - part: docker-compose.yml
          description: |
            The compose file must:
            - Add env_file: .env at the service level (or top-level)
            - Remove all environment: blocks that contain literal values
            - Keep environment: blocks that contain ${VAR_NAME} references
            Example service block:
              authentik-server:
                image: 10.57.3.10/ghcr/goauthentik/server:${AUTHENTIK_TAG}
                env_file: .env
                environment:
                  AUTHENTIK_REDIS__HOST: redis
                  AUTHENTIK_POSTGRESQL__HOST: postgresql

        - part: Playbook invocation
          description: |
            Ensure the playbook is called with ./with-secrets, not source .env.
            The playbook itself should NOT have any vars: or extra_vars: containing
            secret values.

    - id: 5
      name: Verify no secrets in playbook or compose template
      commands:
        - "Grep: pattern=CHANGEME|password.*:.*[A-Za-z0-9]{8} in terraform/lxc/ansible/playbooks/deploy-authentik-stack.yml"
        - "Grep: pattern=AUTHENTIK_SECRET_KEY.*:.*[A-Za-z0-9] in same file"
      expected: No matches — secrets appear only as {{ lookup('env', ...) }} references

    - id: 6
      name: Test run against a live Authentik container (if available)
      description: |
        If an Authentik container is running on pve-test, run the fixed playbook
        and verify the resulting .env file contains real values and the compose
        file contains no literal credentials.
      commands:
        - cd /home/steve/git/proxmox-homelab/terraform/lxc/ansible
        - "../../../with-secrets ansible -i '10.57.1.10,' all -m ping"
        - "../../../with-secrets ansible-playbook -i '10.57.1.10,' playbooks/deploy-authentik-stack.yml"
        - "pct exec 150 -- cat /opt/authentik-stack/.env"
        - "pct exec 150 -- grep -c CHANGEME /opt/authentik-stack/docker-compose.yml"
      expected:
        - ansible ping succeeds before playbook run
        - .env file contains real values (non-empty, non-CHANGEME)
        - grep returns 0 (no CHANGEME in compose)
        - .env file has mode 0600

    - id: 7
      name: Security scan
      commands:
        - "./with-secrets sonar-scanner"
      notes:
        - Stop and present options if any new issues are found

    - id: 8
      name: Commit and merge
      commands:
        - git add terraform/lxc/ansible/playbooks/deploy-authentik-stack.yml
        - |
          git commit -m "fix(authentik): inject secrets from SOPS via env_file pattern

          Replace hardcoded credentials in docker-compose.yml with env_file .env.
          ./with-secrets injects SOPS secrets; playbook writes .env at mode 0600.
          No literal credentials remain in any on-disk file.

          Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>"
        - git checkout dev/pve-test && git merge fix/authentik-secrets-injection
        - git push origin dev/pve-test

postconditions:
  criteria:
    - id: no-secrets-in-playbook
      description: No literal credential values in the playbook file
      verify: "grep -n 'password\\|secret_key\\|api_token' terraform/lxc/ansible/playbooks/deploy-authentik-stack.yml"
      expect: Only lookup('env', ...) references and variable names — no literal values

    - id: env-file-mode
      description: .env file is written with mode 0600
      verify: "pct exec 150 -- stat -c '%a' /opt/authentik-stack/.env"
      expect: "600"

    - id: compose-no-literals
      description: docker-compose.yml on disk contains no literal credential values
      verify: "pct exec 150 -- grep -c CHANGEME /opt/authentik-stack/docker-compose.yml"
      expect: "0"

    - id: service-still-healthy
      description: Authentik health endpoints still return 204 after playbook re-run
      verify: "curl -s -o /dev/null -w '%{http_code}' http://10.57.1.10:9000/-/health/ready/"
      expect: "204"

security_scan:
  when: Before merging — stop if new issues found
  commands:
    - "./with-secrets sonar-scanner"

merge:
  target: dev/pve-test

notes:
  - The .env file must be owned by root with mode 0600 — not world-readable
  - docker-compose.yml may still reference ${VAR_NAME} syntax; that is correct
    (Docker Compose reads these from the env_file at runtime)
  - AUTHENTIK_SUPERUSER_API_TOKEN is NOT written to .env on deploy — it is populated
    manually after first-boot and stored in terraform/secrets.enc.yaml only
  - If the playbook uses a Jinja2 template file (.j2) for the compose, the same
    principle applies — no literal values, only {{ lookup('env', 'VAR') }} references
