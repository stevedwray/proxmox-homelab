---
id: rem-04-step-ca-secrets
title: "Fix step-ca playbook — STEP_CA_PASSWORD from env, not extra-vars"
phase: "04-remediation"
type: remediation
status: pending
task_doc: docs/plan/tasks/04-core-services-04-deploy-step-ca.md

context: |
  The step-ca playbook (deploy-step-ca.yml) currently relies on receiving
  STEP_CA_PASSWORD via --extra-vars from the calling command, like:
    ansible-playbook ... --extra-vars "step_ca_password=${STEP_CA_PASSWORD}"

  This is incorrect for two reasons:
  1. The secret appears on the command line, which may be logged by shell history
     or process monitors
  2. It requires the caller to know the variable name mapping — coupling the
     invocation to the playbook internals

  The correct pattern is:
  1. ./with-secrets injects STEP_CA_PASSWORD as an environment variable
  2. The playbook reads it with: {{ lookup('env', 'STEP_CA_PASSWORD') }}
  3. The password is written to /etc/step-ca/password.txt (mode 0600) by the playbook
  4. No --extra-vars at call time

  step-ca does not use Docker Compose, so the env_file pattern does not apply.
  The password.txt file serves the same purpose — it is the on-disk secret that
  the step-ca daemon reads at startup.

preconditions:
  repository:
    - id: playbook-exists
      description: deploy-step-ca.yml exists
      verify: "ls terraform/lxc/ansible/playbooks/deploy-step-ca.yml"
  secrets:
    - key: STEP_CA_PASSWORD
      verify: |
        SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt \
          sops --decrypt terraform/secrets.enc.yaml | grep STEP_CA_PASSWORD
    - key: STEP_CA_PROVISIONER_PASSWORD
      verify: same pattern as above

objective: |
  deploy-step-ca.yml reads STEP_CA_PASSWORD via lookup('env', 'STEP_CA_PASSWORD') —
  no --extra-vars at invocation. /etc/step-ca/password.txt is written by the playbook
  at mode 0600. All calling commands use ./with-secrets ansible-playbook with no
  secret arguments.

branch: fix/step-ca-secrets

workflow:
  tooling:
    note: |
      ./with-secrets wraps all ansible-playbook calls.
      Run ansible commands from terraform/lxc/ansible so roles_path resolves correctly.
      The playbook uses lookup('env', ...) to read the password.
      No --extra-vars for any secret value.

  steps:
    - id: 1
      name: Create branch
      commands:
        - git checkout dev/pve-test && git pull
        - git checkout -b fix/step-ca-secrets

    - id: 2
      name: Read existing playbook
      commands:
        - "Read: terraform/lxc/ansible/playbooks/deploy-step-ca.yml"
      notes:
        - Find every use of step_ca_password, extra_vars, or --password-file
        - Note how /etc/step-ca/password.txt is currently written

    - id: 3
      name: Fix password handling
      changes:
        - part: vars or extra_vars reference
          description: |
            Replace any vars: step_ca_password: "{{ step_ca_password }}" pattern
            with a direct lookup:
              step_ca_password: "{{ lookup('env', 'STEP_CA_PASSWORD') }}"

            Or inline the lookup wherever the value is used.

        - part: Write password.txt task
          description: |
            Ensure the task that writes /etc/step-ca/password.txt uses the env lookup:

              - name: Write CA password file
                copy:
                  content: "{{ lookup('env', 'STEP_CA_PASSWORD') }}"
                  dest: /etc/step-ca/password.txt
                  mode: '0600'
                  owner: step
                  group: step

        - part: step ca init command
          description: |
            The step ca init command uses --password-file /etc/step-ca/password.txt
            This is correct — do not pass the password on the command line.
            Ensure the password.txt is written BEFORE step ca init runs.

        - part: Any STEP_CA_PROVISIONER_PASSWORD usage
          description: |
            Apply the same lookup pattern for STEP_CA_PROVISIONER_PASSWORD if the
            playbook uses it separately.

    - id: 4
      name: Check no --extra-vars in any session prompt or calling script
      commands:
        - "Grep: pattern=extra.vars.*step_ca in docs/plan/tasks/"
        - "Grep: pattern=extra.vars.*step_ca in docs/prompts/"
      notes:
        - Update any documentation that still shows --extra-vars "step_ca_password=..."

    - id: 5
      name: Test run (if pve-test available)
      commands:
        - cd /home/steve/git/proxmox-homelab/terraform/lxc/ansible
        - "../../../with-secrets ansible -i '10.57.1.11,' -u root all -m ping"
        - "../../../with-secrets ansible-playbook -i '10.57.1.11,' -u root playbooks/deploy-step-ca.yml"
        - "pct exec 152 -- curl -sk https://10.57.1.11/health"
      expected:
        - ansible ping succeeds before playbook run
        - Playbook runs without --extra-vars
        - step-ca health returns 200

    - id: 6
      name: Security scan
      commands:
        - "./with-secrets sonar-scanner"

    - id: 7
      name: Commit and merge
      commands:
        - git add terraform/lxc/ansible/playbooks/deploy-step-ca.yml
        - |
          git commit -m "fix(step-ca): read STEP_CA_PASSWORD from SOPS env, not extra-vars

          Playbook uses lookup('env', 'STEP_CA_PASSWORD') and writes password.txt
          at mode 0600. No --extra-vars for secrets at invocation.

          Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>"
        - git checkout dev/pve-test && git merge fix/step-ca-secrets
        - git push origin dev/pve-test

postconditions:
  criteria:
    - id: no-extra-vars-in-playbook
      description: Playbook does not require step_ca_password extra var
      verify: "grep -n 'extra_vars\\|step_ca_password.*:.*step_ca_password' terraform/lxc/ansible/playbooks/deploy-step-ca.yml"
      expect: No matches showing a var that must be passed externally

    - id: password-file-mode
      description: /etc/step-ca/password.txt has mode 0600
      verify: "pct exec 152 -- stat -c '%a' /etc/step-ca/password.txt"
      expect: "600"

    - id: step-ca-healthy
      description: step-ca still responds after playbook re-run
      verify: "curl -sk https://10.57.1.11/health"
      expect: HTTP 200

security_scan:
  when: Before merging
  commands:
    - "./with-secrets sonar-scanner"

merge:
  target: dev/pve-test

notes:
  - password.txt contains only the password string — no newline issues in the copy: content: task Use content: "{{ lookup('env', 'STEP_CA_PASSWORD') }}" (not a multi-line block scalar)"
  - The step-ca daemon runs as a dedicated user (step). Ensure password.txt ownership matches
    what the systemd unit expects.
  - CA rebuild: every time deploy-step-ca.yml runs on a fresh LXC, step ca init generates a NEW root CA keypair. The committed certs/homelab-root.crt becomes stale. See docs/plan/tasks/04-core-services-04-deploy-step-ca.md Known Gaps for the full impact.
