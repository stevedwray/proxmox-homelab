---
id: rem-04-step-ca-secrets
title: "Validate step-ca secret handling — code hardening gate complete"
phase: "04-remediation"
type: remediation
status: complete
task_doc: docs/plan/tasks/04-core-services-04-deploy-step-ca.md

context: |
  This remediation is already implemented in the live codebase.

  The current step-ca playbook reads STEP_CA_PASSWORD and
  STEP_CA_PROVISIONER_PASSWORD from environment variables injected by
  ./with-secrets. It writes local password files under /etc/step-ca at mode 0600
  and does not require --extra-vars for any secret value.

  Use this prompt only to verify that this behavior has not regressed and to keep
  prompts, task docs, and status documents aligned with the current implementation.

  step-ca does not use Docker Compose, so the env_file pattern does not apply.
  The password.txt file serves the same purpose — it is the on-disk secret that
  the step-ca daemon reads at startup.

preconditions:
  repository:
    - id: playbook-exists
      description: deploy-step-ca.yml exists
      verify: "ls terraform/lxc/ansible/playbooks/deploy-step-ca.yml"
  secrets:
    - key: STEP_CA_PASSWORD
      verify: |
        SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt \
          sops --decrypt terraform/secrets.enc.yaml | grep STEP_CA_PASSWORD
    - key: STEP_CA_PROVISIONER_PASSWORD
      verify: same pattern as above

objective: |
  Keep deploy-step-ca.yml regression-free: it must continue to read both step-ca
  secrets via lookup('env', ...), require no --extra-vars at invocation, and
  write password files at mode 0600. Active prompts and task docs must reflect
  that this secret-handling remediation is complete.

branch: docs/step-ca-remediation-audit

workflow:
  tooling:
    note: |
      ./with-secrets wraps all ansible-playbook calls.
      Run ansible commands from terraform/lxc/ansible so roles_path resolves correctly.
      The live playbook already uses lookup('env', ...) for both passwords.
      No --extra-vars for any secret value.

  steps:
    - id: 1
      name: Confirm current implementation
      commands:
        - "Read: terraform/lxc/ansible/playbooks/deploy-step-ca.yml"
        - "Grep: pattern=STEP_CA_PASSWORD|STEP_CA_PROVISIONER_PASSWORD in terraform/lxc/ansible/playbooks/deploy-step-ca.yml"

      notes:
        - Confirm both secrets are read via lookup('env', ...)
        - Confirm password.txt and provisioner-password.txt are written before bootstrap
        - Confirm no --extra-vars secret mapping is required

    - id: 2
      name: Audit active documentation
      commands:
        - "Grep: pattern=step_ca_password|STEP_CA_PASSWORD|STEP_CA_PROVISIONER_PASSWORD|extra.vars in docs/prompts/ docs/plan/tasks/ docs/plan/"
      notes:
        - Update active step-ca docs that still describe a pending extra-vars remediation
        - Ignore generated cache copies under .terragrunt-cache when auditing source files

    - id: 3
      name: Repair documentation drift only if needed
      changes:
        - part: prompt and index state
          description: |
            Mark rem-04 complete in docs/prompts/index.yaml and describe it as a
            completed code-hardening gate rather than pending implementation work.

        - part: status and task docs
          description: |
            Update development-status.md and the step-ca task docs so the remaining
            gaps are CA rotation, trust distribution ordering, and rebuild sequencing
            rather than secret transport.

        - part: playbook regression fallback
          description: |
            If the playbook ever regresses, restore env lookups for both passwords,
            keep password files on disk at mode 0600, and continue to avoid
            command-line secret injection.

    - id: 4
      name: Optional runtime validation on pve-test
      commands:
        - cd /home/steve/git/proxmox-homelab/terraform/lxc/ansible
        - "../../../with-secrets ansible -i '10.57.1.11,' -u root all -m ping"
        - "../../../with-secrets ansible-playbook -i '10.57.1.11,' -u root playbooks/deploy-step-ca.yml"
        - "pct exec 152 -- curl -sk https://10.57.1.11/health"
      notes:
        - Validation must still run with no --extra-vars for secrets
        - Treat any non-pve-test target as a blocker

    - id: 5
      name: Security scan when source files changed
      commands:
        - "./with-secrets sonar-scanner"
      expected:
        - Scan passes, or scan findings are reviewed before merge

postconditions:
  criteria:
    - id: no-extra-vars-in-playbook
      description: Playbook does not require any step-ca secret extra var
      verify: "grep -n 'extra_vars\\|step_ca_password.*:.*step_ca_password' terraform/lxc/ansible/playbooks/deploy-step-ca.yml"
      expect: No matches showing a var that must be passed externally

    - id: env-lookups-present
      description: Playbook reads both step-ca secrets from environment lookups
      verify: "grep -n \"lookup('env', 'STEP_CA_PASSWORD')\\|lookup('env', 'STEP_CA_PROVISIONER_PASSWORD')\" terraform/lxc/ansible/playbooks/deploy-step-ca.yml"
      expect: Matches for both secrets

    - id: password-file-mode
      description: /etc/step-ca/password.txt has mode 0600
      verify: "pct exec 152 -- stat -c '%a' /etc/step-ca/password.txt"
      expect: "600"

    - id: docs-aligned
      description: Active step-ca prompt and status docs no longer describe this remediation as pending
      verify: "grep -n 'status: complete\|code hardening gate complete\|Secrets managed | step-ca | 152 | Yes' docs/prompts/remediation-04-step-ca-secrets.yaml docs/prompts/index.yaml docs/plan/development-status.md docs/plan/tasks/04-core-services-04-deploy-step-ca.md"
      expect: Matches showing completed remediation and current secret-handling state

    - id: step-ca-healthy
      description: step-ca still responds after playbook re-run
      verify: "curl -sk https://10.57.1.11/health"
      expect: HTTP 200

security_scan:
  when: Before merging
  commands:
    - "./with-secrets sonar-scanner"

merge:
  target: dev/pve-test

notes:
  - "password.txt and provisioner-password.txt should remain single-value files sourced from env lookups."
  - The current systemd unit runs as root unless explicitly changed. If a dedicated service user is introduced later, update password-file ownership and docs together.
  - CA rebuild: every time deploy-step-ca.yml runs on a fresh LXC, step ca init generates a NEW root CA keypair. The committed certs/homelab-root.crt becomes stale. See docs/plan/tasks/04-core-services-04-deploy-step-ca.md Known Gaps for the full impact.
