---
id: p06-01-workload-discovery
title: "Discover and document existing application workloads"
phase: "06"
type: operations
status: pending
github_issue: "#113"
task_doc: docs/plan/tasks/06-app-stacks-01-discover-workloads.md

context: |
  Read-only discovery pass to document all existing application workloads before
  migrating them to app_seg/game_seg. This task does not change, restart, or
  touch any running service. Output is a populated migration table in the phase doc
  and NetBox records for each workload.

  Services expected to be discovered:
  - arr stack (Radarr, Sonarr, Prowlarr, Bazarr, etc.)
  - Jellyfin
  - Pi-hole
  - Game services (Minecraft, etc.)
  - Nginx Proxy Manager (to be decommissioned — note current routes it serves)

preconditions:
  repository:
    - id: phase-doc-exists
      description: phase-06-app-stacks.md has a migration table to fill in
      verify: "grep -c 'migration table' docs/plan/phase-06-app-stacks.md"

  infrastructure:
    - id: ssh-access
      description: SSH access to relevant Proxmox host(s) where app containers run
      verify: "ssh root@<proxmox-host> 'hostname'"
    - id: netbox
      description: NetBox accessible at 192.168.1.30
      verify: "curl -s http://192.168.1.30/api/ | jq .status"

objective: |
  docs/plan/phase-06-app-stacks.md migration table is fully populated with VMID, IP,
  hostname, services, config paths, data mounts, image versions, and NFS/special storage
  for each workload. NetBox records are created or updated. No service is changed.

branch: feat/workload-discovery

workflow:
  tooling:
    note: |
      All commands are read-only. No docker restart, pct restart, or config changes.
      Use Bash for SSH commands, Read/Edit/Write for updating docs.

  steps:
    - id: 1
      name: Enumerate all containers and VMs
      commands:
        - "ssh root@<proxmox-host> 'pct list'"
        - "ssh root@<proxmox-host> 'qm list'"
      notes:
        - Run on all Proxmox hosts in the environment
        - Note VMID, name, status, and IP for each

    - id: 2
      name: For each application container, collect details
      per_container:
        - "ssh root@<container-ip> 'docker ps --format \"{{.Image}} {{.Names}}\"'"
        - "ssh root@<proxmox-host> 'pct config <vmid> | grep -E \"mp[0-9]|rootfs|net\"'"
        - "ssh root@<container-ip> 'mount | grep nfs'"
        - "ssh root@<container-ip> 'docker ps --format \"table {{.Image}}\t{{.Names}}\t{{.Status}}\"'"
      notes:
        - Note any NFS mounts — these need special handling during migration
        - Record exact image versions including tags (for Harbor mirroring)
        - Note config directories (usually /config, /opt, /etc/<service>)

    - id: 3
      name: Note Nginx Proxy Manager routes
      commands:
        - "ssh root@<npm-ip> 'docker exec nginx-proxy-manager cat /data/nginx/proxy_host/*.conf 2>/dev/null || echo N/A'"
      notes:
        - NPM will be decommissioned — Traefik replaces it
        - Document all routes NPM serves so they can be recreated in Traefik

    - id: 4
      name: Update phase-06-app-stacks.md migration table
      commands:
        - "Read: docs/plan/phase-06-app-stacks.md"
        - "Edit: fill in the migration table with discovered data"
      columns_to_fill:
        - VMID
        - Current IP
        - Hostname
        - Services (docker images)
        - Config paths
        - Data mounts (NFS or local)
        - Image versions (for Harbor mirroring)
        - Notes (GPU passthrough, special requirements)

    - id: 5
      name: Update NetBox
      instructions: |
        Access http://192.168.1.30 (NetBox):
        For each discovered workload:
        - Virtualization → Virtual Machines → Create or update record
        - Set VMID, primary IP, platform (Proxmox LXC or VM)
        - Add services running on that IP under IPAM → IP Addresses

    - id: 6
      name: Commit
      commands:
        - git checkout dev/pve-test && git pull
        - git checkout -b feat/workload-discovery
        - git add docs/plan/phase-06-app-stacks.md
        - |
          git commit -m "docs(phase-06): document existing application workloads from discovery

          Closes #113

          Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>"
        - git checkout dev/pve-test && git merge feat/workload-discovery
        - git push origin dev/pve-test
        - gh issue close 113 --comment "Fixed in $(git rev-parse HEAD)"

postconditions:
  criteria:
    - id: table-populated
      description: Migration table in phase-06-app-stacks.md has all rows populated
      verify: "grep -c '|.*10\.' docs/plan/phase-06-app-stacks.md"
      expect: One row per discovered workload

    - id: nfs-noted
      description: NFS mounts are identified and noted in the table
      verify: "grep -i nfs docs/plan/phase-06-app-stacks.md"

    - id: image-versions
      description: Docker image versions recorded (for Harbor mirroring)
      verify: "grep -E ':[0-9]' docs/plan/phase-06-app-stacks.md"

    - id: netbox-updated
      description: NetBox has records for all discovered workloads
      verify: "Manual check in NetBox UI"

notes:
  - This task unblocks p06-02 (SDN zones) through p06-06 (game services)
  - Pay special attention to Pi-hole — it is DNS critical path
    Switching DNS resolvers must be planned carefully to avoid outages
  - arr stack containers typically share NAS/NFS storage for media — document mount paths
  - GPU passthrough (Jellyfin) requires extra Terraform config — note the device IDs
