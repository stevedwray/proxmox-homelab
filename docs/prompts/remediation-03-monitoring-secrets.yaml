---
id: rem-03-monitoring-secrets
title: "Validate Monitoring playbook - code hardening gate complete"
phase: "04-remediation"
type: remediation
status: complete
task_doc: docs/plan/tasks/04-core-services-05-deploy-monitoring.md

depends_on:
  - dep-01-authentik

context: |
  This remediation is already implemented in the live codebase.

  The monitoring stack playbook currently follows the hardened secret pattern:

  1) ./with-secrets injects SOPS values as environment variables
  2) The playbook writes /opt/monitoring-stack/.env from lookup('env', ...)
  3) docker-compose.yml uses env_file: .env for Grafana secret inputs
  4) No Grafana secret values are rendered inline in compose content

  IMPORTANT SCOPE: This task is remediation-only (code and static validation).
  Full stack deployment and runtime bring-up validation remain in dep-04-monitoring.

  REMEDIATION VS DEPLOYMENT READINESS:
  - rem-03 requires keys to exist in SOPS (placeholders are acceptable only to
    unblock code hardening)
  - dep-04 requires real values (CHANGEME_* is not acceptable for deployment)

preconditions:
  repository:
    - id: branch
      description: Working on dev/pve-test or short-lived branch from it
      verify: "git branch --show-current"
    - id: playbook-exists
      description: deploy-monitoring-stack.yml exists
      verify: "ls terraform/lxc/ansible/playbooks/deploy-monitoring-stack.yml"

  secrets:
    - key: GRAFANA_ADMIN_PASSWORD
      description: Key exists in SOPS (value may be placeholder at remediation stage)
      verify: |
        SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt \
          sops --decrypt terraform/secrets.enc.yaml | grep '^GRAFANA_ADMIN_PASSWORD:'
    - key: GRAFANA_OAUTH_CLIENT_ID
      description: Key exists in SOPS (value may be placeholder at remediation stage)
      verify: |
        SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt \
          sops --decrypt terraform/secrets.enc.yaml | grep '^GRAFANA_OAUTH_CLIENT_ID:'
    - key: GRAFANA_OAUTH_CLIENT_SECRET
      description: Key exists in SOPS (value may be placeholder at remediation stage)
      verify: |
        SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt \
          sops --decrypt terraform/secrets.enc.yaml | grep '^GRAFANA_OAUTH_CLIENT_SECRET:'

objective: |
  Keep deploy-monitoring-stack.yml regression-free: Grafana secrets must remain
  sourced via .env + env_file pattern only, with no inline secret assignments
  in compose content. Ensure all three Grafana secret keys exist in
  terraform/secrets.enc.yaml.

branch: docs/monitoring-remediation-audit

out_of_scope:
  - terragrunt apply and stack bring-up
  - manual Grafana UI login and datasource operations
  - runtime health and restart-survival checks
  - closing deployment issue #107 (handled by dep-04)

workflow:
  tooling:
    note: |
      ./with-secrets wraps ansible-playbook and terragrunt calls.
      Never source .env directly. Never pass secrets via --extra-vars.

  steps:
    - id: 1
      name: Create working branch
      commands:
        - git checkout dev/pve-test && git pull
        - git checkout -b fix/monitoring-secrets-injection

    - id: 2
      name: Inspect current secret usage in playbook
      commands:
        - "Read: terraform/lxc/ansible/playbooks/deploy-monitoring-stack.yml"
      notes:
        - Identify inline Grafana secret assignments in compose content
        - Identify whether a .env file task already exists

    - id: 3
      name: Ensure SOPS keys exist
      commands:
        - |
          SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt \
            sops --decrypt terraform/secrets.enc.yaml \
            | grep -E '^GRAFANA_ADMIN_PASSWORD:|^GRAFANA_OAUTH_CLIENT_ID:|^GRAFANA_OAUTH_CLIENT_SECRET:'
      decision:
        if_any_key_missing: |
          Add missing key(s) in terraform/secrets.enc.yaml.

          If the real Authentik OIDC value is not yet available, use a
          CHANGEME_ placeholder for the missing key only. This is acceptable for
          rem-03 and must be replaced before dep-04 deployment.

          Edit command:
          SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt sops terraform/secrets.enc.yaml

    - id: 4
      name: Implement env_file remediation in playbook
      changes:
        - part: Write .env task
          description: |
            Ensure playbook writes /opt/monitoring-stack/.env using the GF_ key names
            that Grafana reads natively, sourced from Ansible vars backed by lookup('env', ...):

              - name: Write monitoring secrets env file
                copy:
                  content: |
                    GF_SECURITY_ADMIN_PASSWORD={{ grafana_admin_password }}
                    GF_AUTH_GENERIC_OAUTH_CLIENT_ID={{ grafana_oauth_client_id }}
                    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET={{ grafana_oauth_client_secret }}
                  dest: /opt/monitoring-stack/.env
                  mode: '0600'
                no_log: true

        - part: docker-compose template updates
          description: |
            In the grafana service block:
            - add env_file: .env
            - remove inline secret entries:
              GF_SECURITY_ADMIN_PASSWORD
              GF_AUTH_GENERIC_OAUTH_CLIENT_ID
              GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
            - keep non-secret Grafana/OAuth settings in environment:
      notes:
        - Only apply code changes if the current playbook regresses from this pattern

    - id: 5
      name: Static verification (required)
      commands:
        - "grep -n 'env_file:' terraform/lxc/ansible/playbooks/deploy-monitoring-stack.yml"
        - "grep -n 'lookup(.*GRAFANA_ADMIN_PASSWORD' terraform/lxc/ansible/playbooks/deploy-monitoring-stack.yml"
        - "grep -n 'lookup(.*GRAFANA_OAUTH_CLIENT_ID' terraform/lxc/ansible/playbooks/deploy-monitoring-stack.yml"
        - "grep -n 'lookup(.*GRAFANA_OAUTH_CLIENT_SECRET' terraform/lxc/ansible/playbooks/deploy-monitoring-stack.yml"
        - "grep -n 'GF_SECURITY_ADMIN_PASSWORD' terraform/lxc/ansible/playbooks/deploy-monitoring-stack.yml"
        - "grep -n 'GF_AUTH_GENERIC_OAUTH_CLIENT_ID' terraform/lxc/ansible/playbooks/deploy-monitoring-stack.yml"
        - "grep -n 'GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET' terraform/lxc/ansible/playbooks/deploy-monitoring-stack.yml"
        - "awk '/name: Write monitoring compose definition/{in_block=1} in_block && /^    - name: / && $0 !~ /name: Write monitoring compose definition/{exit} in_block{print}' terraform/lxc/ansible/playbooks/deploy-monitoring-stack.yml | grep -n 'GF_SECURITY_ADMIN_PASSWORD\|GF_AUTH_GENERIC_OAUTH_CLIENT_ID\|GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET' || true"
      expected:
        - env_file:.env present in grafana service
        - lookup('env', ...) references present for all three keys
        - GF_* keys present in .env task
        - removed inline secret keys are absent from compose definition block

    - id: 6
      name: Optional runtime sanity check (only if target is available)
      optional: true
      commands:
        - cd /home/steve/git/proxmox-homelab/terraform/lxc/ansible
        - "../../../with-secrets ansible -i '10.57.1.12,' -u root all -m ping"
        - "../../../with-secrets ansible-playbook -i '10.57.1.12,' -u root playbooks/deploy-monitoring-stack.yml"
        - "pct exec 154 -- stat -c '%a' /opt/monitoring-stack/.env"
        - "pct exec 154 -- grep -c 'GRAFANA_ADMIN_PASSWORD.*=' /opt/monitoring-stack/docker-compose.yml"
      expected:
        - ansible ping succeeds
        - .env exists with mode 600
        - compose grep returns 0

    - id: 7
      name: Security scan
      commands:
        - "./with-secrets sonar-scanner"

    - id: 8
      name: Commit remediation changes
      commands:
        - git add terraform/lxc/ansible/playbooks/deploy-monitoring-stack.yml terraform/secrets.enc.yaml
        - |
          git commit -m "fix(monitoring): use SOPS env_file pattern for Grafana secrets

          Write Grafana secrets to /opt/monitoring-stack/.env (0600) using GF_ key names,
          read via env_file, and remove inline Grafana secret assignments from compose content.

          Remediation gate only — runtime bring-up tracked in dep-04 (#107)."

postconditions:
  criteria:
    - id: no-inline-grafana-secrets
      description: Grafana secret keys are not rendered inline in compose content
      verify: 'awk ''/name: Write monitoring compose definition/{in_block=1} in_block && /^    - name: / && $0 !~ /name: Write monitoring compose definition/{exit} in_block{print}'' terraform/lxc/ansible/playbooks/deploy-monitoring-stack.yml | grep -n "GF_SECURITY_ADMIN_PASSWORD\|GF_AUTH_GENERIC_OAUTH_CLIENT_ID\|GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET"'
      expect: No matches in compose definition block

    - id: env-file-pattern-in-place
      description: Playbook writes .env with lookup('env', ...) for all three keys and uses env_file
      verify: 'grep -n "GRAFANA_ADMIN_PASSWORD\|GRAFANA_OAUTH_CLIENT_ID\|GRAFANA_OAUTH_CLIENT_SECRET\|env_file: .env" terraform/lxc/ansible/playbooks/deploy-monitoring-stack.yml'
      expect: All required lines present

    - id: sops-keys-present
      description: All three Grafana secret keys exist in secrets.enc.yaml
      verify: |
        SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt \
          sops --decrypt terraform/secrets.enc.yaml \
          | grep -E '^GRAFANA_ADMIN_PASSWORD:|^GRAFANA_OAUTH_CLIENT_ID:|^GRAFANA_OAUTH_CLIENT_SECRET:'
      expect: Three lines returned

handoff_to_dep04:
  required_before_deploy:
    - Replace any CHANGEME_* Grafana OAuth values with real values from Authentik OIDC provider
    - Re-run SOPS verify command and confirm no CHANGEME_* remains for Grafana keys

security_scan:
  when: Before merge
  commands:
    - "./with-secrets sonar-scanner"

merge:
  target: dev/pve-test

notes:
  - GRAFANA_OAUTH_CLIENT_ID and GRAFANA_OAUTH_CLIENT_SECRET originate from an Authentik OIDC provider created during dep-01.
  - If these values are still placeholders, rem-03 may still be complete as code remediation, but dep-04 must not proceed.
  - GF_AUTH_GENERIC_OAUTH_AUTH_URL, TOKEN_URL, and API_URL are not secrets and should remain in compose environment settings.
