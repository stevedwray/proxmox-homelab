---
id: rem-03-monitoring-secrets
title: "Fix Monitoring playbook — secrets injection via SOPS env_file"
phase: "04-remediation"
type: remediation
status: pending
task_doc: docs/plan/tasks/04-core-services-05-deploy-monitoring.md

context: |
  The monitoring stack playbook (deploy-monitoring-stack.yml) currently writes
  GRAFANA_ADMIN_PASSWORD, GRAFANA_OAUTH_CLIENT_ID, and GRAFANA_OAUTH_CLIENT_SECRET
  directly into /opt/monitoring-stack/docker-compose.yml inside the LXC.

  The correct pattern is identical to the Authentik fix:
  1. ./with-secrets injects SOPS secrets as env vars
  2. The playbook writes /opt/monitoring-stack/.env from lookup('env', 'VAR_NAME')
  3. docker-compose.yml uses env_file: .env — no literal values
  4. Grafana container reads ${GRAFANA_ADMIN_PASSWORD} etc. from the env_file

  Additionally, GRAFANA_OAUTH_CLIENT_ID may be missing from secrets.enc.yaml
  (it was not in the original secrets inventory). If it is absent, it must be added.

  This task is a code change only. The GRAFANA_OAUTH_CLIENT_ID and
  GRAFANA_OAUTH_CLIENT_SECRET values come from the Authentik OIDC provider created
  manually during task dep-01-authentik (a known rebuild gap until
  terraform-provider-authentik is implemented).

preconditions:
  repository:
    - id: branch
      description: Working on dev/pve-test or a short-lived branch from it
      verify: "git branch --show-current"
    - id: playbook-exists
      description: deploy-monitoring-stack.yml exists
      verify: "ls terraform/lxc/ansible/playbooks/deploy-monitoring-stack.yml"
  secrets:
    - key: GRAFANA_ADMIN_PASSWORD
      verify: |
        SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt \
          sops --decrypt terraform/secrets.enc.yaml | grep GRAFANA_ADMIN_PASSWORD
    - key: GRAFANA_OAUTH_CLIENT_ID
      note: May need to be added — check if present
      verify: |
        SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt \
          sops --decrypt terraform/secrets.enc.yaml | grep GRAFANA_OAUTH_CLIENT_ID
    - key: GRAFANA_OAUTH_CLIENT_SECRET
      verify: same pattern as above

objective: |
  deploy-monitoring-stack.yml writes /opt/monitoring-stack/.env from SOPS-injected
  environment variables, docker-compose.yml uses env_file:.env with no literal
  Grafana credential values, and all three Grafana secret keys exist in
  terraform/secrets.enc.yaml.

branch: fix/monitoring-secrets-injection

workflow:
  tooling:
    note: |
      ./with-secrets wraps all ansible-playbook and terragrunt calls.
      Never source .env directly. Never --extra-vars for secrets.

  steps:
    - id: 1
      name: Create branch
      commands:
        - git checkout dev/pve-test && git pull
        - git checkout -b fix/monitoring-secrets-injection

    - id: 2
      name: Check GRAFANA_OAUTH_CLIENT_ID exists in SOPS
      commands:
        - |
          SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt \
            sops --decrypt terraform/secrets.enc.yaml | grep GRAFANA_OAUTH_CLIENT_ID
      decision:
        if_absent: |
          Add GRAFANA_OAUTH_CLIENT_ID to terraform/secrets.enc.yaml. For now, add
          it with a placeholder value (CHANGEME_grafana_oauth_client_id) since the
          real value comes from Authentik OIDC provider setup (task dep-01-authentik).

          To add: SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt sops terraform/secrets.enc.yaml
        if_present: Continue to step 3

    - id: 3
      name: Read existing playbook
      commands:
        - "Read: terraform/lxc/ansible/playbooks/deploy-monitoring-stack.yml"
      notes:
        - Identify every place a secret value appears (environment:, vars:, copy: content:)
        - Note which tasks write docker-compose.yml

    - id: 4
      name: Implement env_file pattern
      changes:
        - part: Write .env task
          description: |
            Add an Ansible task to write /opt/monitoring-stack/.env:

              - name: Write secrets to .env
                copy:
                  content: |
                    GRAFANA_ADMIN_PASSWORD={{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') }}
                    GRAFANA_OAUTH_CLIENT_ID={{ lookup('env', 'GRAFANA_OAUTH_CLIENT_ID') }}
                    GRAFANA_OAUTH_CLIENT_SECRET={{ lookup('env', 'GRAFANA_OAUTH_CLIENT_SECRET') }}
                  dest: /opt/monitoring-stack/.env
                  mode: '0600'

        - part: docker-compose.yml template
          description: |
            Update the compose template in the playbook:
            - Add env_file: .env to the grafana service
            - Remove GF_SECURITY_ADMIN_PASSWORD, GF_AUTH_GENERIC_OAUTH_CLIENT_ID,
              GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET from inline environment: blocks
            - Keep GF_AUTH_GENERIC_OAUTH_ENABLED=true and non-secret OAuth config
              (AUTH_URL, TOKEN_URL, etc.) in environment: — these are not secrets

    - id: 5
      name: Verify no secrets in files
      commands:
        - "Grep: pattern=GRAFANA_ADMIN_PASSWORD.*:.*[A-Za-z0-9] in deploy-monitoring-stack.yml"
        - "Grep: pattern=GRAFANA_OAUTH_CLIENT_SECRET.*:.*[A-Za-z0-9] in deploy-monitoring-stack.yml"
      expected: Only lookup('env', ...) references — no literal values

    - id: 6
      name: Test run (if pve-test available)
      commands:
        - "./with-secrets ansible-playbook -i '10.57.1.12,' terraform/lxc/ansible/playbooks/deploy-monitoring-stack.yml"
        - "pct exec 154 -- cat /opt/monitoring-stack/.env"
        - "pct exec 154 -- grep -c 'GRAFANA_ADMIN_PASSWORD.*=' /opt/monitoring-stack/docker-compose.yml"
        - "curl -s http://10.57.1.12:3000/api/health | jq .database"
      expected:
        - .env exists with real values
        - compose file grep returns 0 (no literal password)
        - Grafana health returns "ok"

    - id: 7
      name: Security scan
      commands:
        - "./with-secrets sonar-scanner"

    - id: 8
      name: Commit and merge
      commands:
        - git add terraform/lxc/ansible/playbooks/deploy-monitoring-stack.yml terraform/secrets.enc.yaml
        - |
          git commit -m "fix(monitoring): inject Grafana secrets from SOPS via env_file pattern

          Replace hardcoded credentials in docker-compose.yml with env_file .env.
          Add GRAFANA_OAUTH_CLIENT_ID to secrets.enc.yaml if absent.
          No literal credentials remain in any on-disk file.

          Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>"
        - git checkout dev/pve-test && git merge fix/monitoring-secrets-injection
        - git push origin dev/pve-test

postconditions:
  criteria:
    - id: no-secrets-in-playbook
      description: No literal Grafana credentials in the playbook
      verify: "grep -n 'GRAFANA_ADMIN_PASSWORD\\|OAUTH_CLIENT' terraform/lxc/ansible/playbooks/deploy-monitoring-stack.yml"
      expect: Only lookup('env', ...) references

    - id: env-file-written
      description: .env file exists with mode 0600
      verify: "pct exec 154 -- stat -c '%a' /opt/monitoring-stack/.env"
      expect: "600"

    - id: compose-no-literals
      description: docker-compose.yml has no literal Grafana password
      verify: "pct exec 154 -- grep -c 'GRAFANA_ADMIN_PASSWORD.*=' /opt/monitoring-stack/docker-compose.yml"
      expect: "0"

    - id: grafana-healthy
      description: Grafana still returns healthy after playbook re-run
      verify: "curl -s http://10.57.1.12:3000/api/health | jq .database"
      expect: '"ok"'

    - id: all-three-keys-in-sops
      description: All three Grafana secret keys exist in secrets.enc.yaml
      verify: |
        SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt \
          sops --decrypt terraform/secrets.enc.yaml \
          | grep -E 'GRAFANA_ADMIN_PASSWORD|GRAFANA_OAUTH_CLIENT_ID|GRAFANA_OAUTH_CLIENT_SECRET'
      expect: Three lines returned

security_scan:
  when: Before merging
  commands:
    - "./with-secrets sonar-scanner"

merge:
  target: dev/pve-test

notes:
  - GRAFANA_OAUTH_CLIENT_ID and GRAFANA_OAUTH_CLIENT_SECRET come from an Authentik OIDC
    provider created manually after Authentik first-boot. If they are still CHANGEME_ in
    SOPS, the monitoring stack will deploy but Grafana OIDC login will fail. That is
    expected until task dep-01-authentik Step 7 is completed.
  - GF_AUTH_GENERIC_OAUTH_AUTH_URL and GF_AUTH_GENERIC_OAUTH_TOKEN_URL are NOT secrets — they are Authentik URLs and should stay in the compose environment: block, not in .env
  - VictoriaMetrics and Loki have no secrets — their service blocks in compose do not need env_file
