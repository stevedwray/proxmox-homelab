---
id: dep-05-browser-ingress
title: "Wire browser-facing service UIs through Traefik and Authentik — runtime gate"
phase: "04"
type: deployment
status: pending
depends_on:
  - rem-05-browser-ingress
  - dep-02-traefik
github_issue: "#144"
task_doc: docs/plan/tasks/04-core-services-06-browser-ingress-wiring.md

context: |
  This is a runtime gate prompt.

  rem-05-browser-ingress added four routes to the Traefik playbook. This session:
  1. Reconfigures the Authentik Proxy Provider outpost to domain-level mode
  2. Redeploys Traefik to push the new routes
  3. Updates MikroTik DNS records
  4. Validates all six service URLs

  Authentik outpost mode change is a manual step — terraform-provider-authentik not yet built.
  The existing traefik-forwardauth Proxy Provider must be changed from
  "Forward auth (single application)" to "Forward auth (domain level)" in the Authentik UI.
  Domain-level mode sets a shared auth cookie for .gibbsgreatly.xyz and covers all subdomains
  without per-application redirect URI configuration.

  DNS state before this session:
  - traefik.lab.gibbsgreatly.xyz → 10.57.2.10 (correct)
  - grafana.gibbsgreatly.xyz → 10.57.2.10 (correct)
  - authentik.gibbsgreatly.xyz → missing
  - portainer.gibbsgreatly.xyz → 192.168.1.4 (stale — must update)
  - harbor.gibbsgreatly.xyz → 192.168.1.4 (stale — must update)
  - netbox.gibbsgreatly.xyz → missing

  Browser ingress and certificate policy:
  - All browser-facing routes use certResolver: letsencrypt (LE staging on pve-test)
  - step-ca certificates must not be used for any of these routes
  - TLS terminates at Traefik; all backends served over plain HTTP

preconditions:
  repository:
    - id: rem-05-done
      description: rem-05-browser-ingress is complete — playbook has all six routes
      verify: "grep -cE 'authentik\\.gibbsgreatly|portainer\\.gibbsgreatly|harbor\\.gibbsgreatly|netbox\\.gibbsgreatly' terraform/lxc/ansible/playbooks/deploy-proxy-stack.yml"
      expect: "4 or more matches"

    - id: branch
      description: On dev/pve-test (rem-05 merged) or feat/browser-ingress-wiring
      verify: "git branch --show-current"

  secrets:
    - key: CF_DNS_API_TOKEN
      verify: |
        SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt \
          sops --decrypt terraform/secrets.enc.yaml | grep CF_DNS_API_TOKEN
      expect: Real value present

  infrastructure:
    - id: proxmox-target
      verify: "./with-secrets bash -c 'echo $TF_VAR_proxmox_node'"
      expect: pve-test

    - id: authentik-healthy
      verify: "curl -s -o /dev/null -w '%{http_code}' http://10.57.1.10:9000/-/health/ready/"
      expect: "200 or 204"

    - id: traefik-running
      verify: "ssh root@pve-test.gibbsgreatly.xyz 'pct status 153'"
      expect: "status: running"

objective: |
  All six browser-facing service URLs return valid HTTPS responses through Traefik.
  Authentik, Portainer, and NetBox are protected by Authentik domain-level forward-auth.
  Harbor and Grafana use their own native auth. All DNS records resolve to 10.57.2.10.

workflow:
  tooling:
    note: |
      Use ./with-secrets for all terragrunt and ansible-playbook calls.
      Run ansible commands from terraform/lxc/ansible/ so roles_path resolves correctly.
      Always pass -u root for direct ansible/ansible-playbook runs with inline IP inventory.
      Never pass secrets via --extra-vars; never source .env.
      This is a deployment session — do not make code changes beyond what rem-05 already merged.

  steps:
    - id: 1
      name: Verify preconditions
      commands:
        - "./with-secrets bash -c 'echo Node=$TF_VAR_proxmox_node'"
        - "curl -s -o /dev/null -w '%{http_code}' http://10.57.1.10:9000/-/health/ready/"
        - "ssh root@pve-test.gibbsgreatly.xyz 'pct status 153'"
        - "for h in authentik portainer harbor netbox; do echo -n \"$h → \"; dig +short @192.168.1.1 $h.gibbsgreatly.xyz || echo 'no record'; done"

    - id: 2
      name: "MANUAL — Reconfigure Authentik Proxy Provider to domain-level mode"
      type: manual
      instructions: |
        1. Open http://10.57.1.10:9000 and log in as admin
        2. Go to Admin UI → Applications → Providers
        3. Find the 'traefik-forwardauth' Proxy Provider and click Edit
        4. Change the Forward auth mode from "Forward auth (single application)"
           to "Forward auth (domain level)"
        5. Set Cookie domain to: .gibbsgreatly.xyz
        6. Save the provider
        7. Go to Admin UI → Applications → Outposts
        8. Find the outpost that uses traefik-forwardauth and click Update
           (this triggers the outpost to reload its configuration)
        9. Wait ~30 seconds for the outpost to apply the new config

        NOTE: After this change, the existing traefik.lab.gibbsgreatly.xyz dashboard protection
        continues to work. The domain-level mode is a superset of single-application mode.

    - id: 3
      name: Ping Traefik LXC before playbook
      commands:
        - cd /home/steve/git/proxmox-homelab/terraform/lxc/ansible
        - "../../../with-secrets ansible -i '10.57.2.10,' -u root all -m ping"

    - id: 4
      name: Redeploy Traefik playbook to push new routes
      commands:
        - cd /home/steve/git/proxmox-homelab/terraform/lxc/ansible
        - "../../../with-secrets ansible-playbook -i '10.57.2.10,' -u root playbooks/deploy-proxy-stack.yml"
      notes:
        - Playbook is idempotent — safe to run against a running Traefik
        - Traefik file provider watches /etc/traefik/dynamic/ and reloads automatically
        - No container restart required — Traefik picks up config changes within seconds

    - id: 5
      name: Verify new routes are live in Traefik dynamic config
      commands:
        - "ssh root@pve-test.gibbsgreatly.xyz 'pct exec 153 -- grep -E \"authentik\\.gibbsgreatly|portainer\\.gibbsgreatly|harbor\\.gibbsgreatly|netbox\\.gibbsgreatly\" /opt/proxy-stack/dynamic/authentik.yml'"
      expect: Four hostname matches

    - id: 6
      name: Update MikroTik DNS static records
      commands:
        - |
          ssh admin@192.168.1.1 '
            /ip dns static add name=authentik.gibbsgreatly.xyz address=10.57.2.10
            /ip dns static add name=netbox.gibbsgreatly.xyz address=10.57.2.10
            /ip dns static set [find name=portainer.gibbsgreatly.xyz] address=10.57.2.10
            /ip dns static set [find name=harbor.gibbsgreatly.xyz] address=10.57.2.10
            /ip dns static print where name~"gibbsgreatly"
          '
      notes:
        - If portainer.gibbsgreatly.xyz record does not exist, use 'add' instead of 'set'
        - Same for harbor.gibbsgreatly.xyz
        - Verify MikroTik SSH access before running (admin@192.168.1.1)

    - id: 7
      name: Verify DNS resolves to Traefik for all six hostnames
      commands:
        - "for h in traefik.lab grafana authentik portainer harbor netbox; do echo -n \"$h.gibbsgreatly.xyz → \"; dig +short @192.168.1.1 $h.gibbsgreatly.xyz; done"
      expect: All six return 10.57.2.10

    - id: 8
      name: Validate all six service URLs
      commands:
        - "curl -skI --resolve authentik.gibbsgreatly.xyz:443:10.57.2.10 https://authentik.gibbsgreatly.xyz | grep -E 'HTTP/[0-9.]+ [0-9]+'"
        - "curl -skI --resolve portainer.gibbsgreatly.xyz:443:10.57.2.10 https://portainer.gibbsgreatly.xyz | grep -E 'HTTP/[0-9.]+ [0-9]+|[Ll]ocation:'"
        - "curl -skI --resolve harbor.gibbsgreatly.xyz:443:10.57.2.10 https://harbor.gibbsgreatly.xyz | grep -E 'HTTP/[0-9.]+ [0-9]+'"
        - "curl -skI --resolve netbox.gibbsgreatly.xyz:443:10.57.2.10 https://netbox.gibbsgreatly.xyz | grep -E 'HTTP/[0-9.]+ [0-9]+|[Ll]ocation:'"
        - "curl -skI --resolve grafana.gibbsgreatly.xyz:443:10.57.2.10 https://grafana.gibbsgreatly.xyz | grep -E 'HTTP/[0-9.]+ [0-9]+'"
        - "curl -skI --resolve traefik.lab.gibbsgreatly.xyz:443:10.57.2.10 https://traefik.lab.gibbsgreatly.xyz/dashboard/ | grep -E 'HTTP/[0-9.]+ [0-9]+|[Ll]ocation:'"
      expect:
        - authentik: 200 or 302
        - portainer: 302 to Authentik authorize URL
        - harbor: 200 or 302
        - netbox: 302 to Authentik authorize URL
        - grafana: 200 or 302
        - traefik: 302 to Authentik authorize URL

    - id: 9
      name: Verify staging LE cert on all new routes
      commands:
        - "for h in authentik portainer harbor netbox; do echo \"=== $h ===\"; curl -sv https://$h.gibbsgreatly.xyz 2>&1 | grep -i 'issuer'; done"
      expect: All show "(STAGING) Let's Encrypt" — NOT Homelab CA

postconditions:
  criteria:
    - id: authentik-route
      description: authentik.gibbsgreatly.xyz returns 200 or 302 via Traefik
      verify: "curl -skI --resolve authentik.gibbsgreatly.xyz:443:10.57.2.10 https://authentik.gibbsgreatly.xyz | grep -E 'HTTP/[0-9.]+ (200|302)'"
      expect: Match

    - id: portainer-forward-auth
      description: portainer.gibbsgreatly.xyz redirects to Authentik authorize
      verify: "curl -skI --resolve portainer.gibbsgreatly.xyz:443:10.57.2.10 https://portainer.gibbsgreatly.xyz | grep 'location:' | grep 'authentik\\|application/o/authorize'"
      expect: Authentik authorize URL in location header

    - id: harbor-route
      description: harbor.gibbsgreatly.xyz returns 200 or 302 via Traefik
      verify: "curl -skI --resolve harbor.gibbsgreatly.xyz:443:10.57.2.10 https://harbor.gibbsgreatly.xyz | grep -E 'HTTP/[0-9.]+ (200|302)'"
      expect: Match

    - id: netbox-forward-auth
      description: netbox.gibbsgreatly.xyz redirects to Authentik authorize
      verify: "curl -skI --resolve netbox.gibbsgreatly.xyz:443:10.57.2.10 https://netbox.gibbsgreatly.xyz | grep 'location:' | grep 'authentik\\|application/o/authorize'"
      expect: Authentik authorize URL in location header

    - id: dns-correct
      description: All four updated DNS records resolve to 10.57.2.10
      verify: "for h in authentik portainer harbor netbox; do dig +short @192.168.1.1 $h.gibbsgreatly.xyz; done"
      expect: Four lines each showing 10.57.2.10

    - id: staging-cert
      description: New routes serve LE staging cert (not step-ca, not production LE)
      verify: "curl -sv https://portainer.gibbsgreatly.xyz 2>&1 | grep -i 'STAGING'"
      expect: "(STAGING) Let's Encrypt" in issuer

notes:
  - Traefik file provider watches /etc/traefik/dynamic/ and hot-reloads — no container restart needed
  - If portainer returns 200 instead of 302, the Authentik outpost domain-level reconfiguration may
    not have taken effect yet — wait 60 seconds and retry
  - Harbor will return 200 (its own login page) — this is correct, no forward-auth on Harbor
  - MikroTik SSH may require key-based auth — verify access before running DNS commands
  - After DNS update, flush the local resolver if needed: resolvectl flush-caches
