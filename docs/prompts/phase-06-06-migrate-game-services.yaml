---
id: p06-06-migrate-game-services
title: "Migrate game services to game_seg"
phase: "06"
type: deployment
status: pending
github_issue: "#118"
task_doc: docs/plan/tasks/06-app-stacks-06-migrate-game-services.md

context: |
  Game servers (Minecraft, etc.) are isolated in game_seg (10.61.0.0/24) to separate
  them from production application workloads. Discovery (p06-01) must have documented
  which game servers exist, their ports, and any persistent world data paths.

  Game servers typically need:
  - Persistent world data (must be preserved across migration)
  - Port forwarding from LAN (Minecraft default: TCP 25565)
  - Sufficient CPU/memory (game servers are CPU-intensive under load)

preconditions:
  repository:
    - id: discovery-done
      description: Game services documented in phase-06-app-stacks.md
      verify: "grep -i -E 'minecraft|game' docs/plan/phase-06-app-stacks.md"

    - id: game-seg-ready
      description: game_seg zone exists (p06-02 complete)
      verify: "ssh root@pve-test.gibbsgreatly.xyz 'pvesh get /nodes/pve-test/sdn/zones'"
      expect: game_seg listed

    - id: stack-files
      description: game-stack/stack.yaml and deploy-game-stack.yml exist
      verify: |
        ls terraform/lxc/stacks/game-stack/stack.yaml
        ls terraform/lxc/ansible/playbooks/deploy-game-stack.yml

  infrastructure:
    - id: harbor-has-images
      description: Game server images mirrored to Harbor
      verify: "curl -s http://10.57.3.10/api/v2.0/repositories | jq '.[].name' | grep -i game"

objective: |
  Game services are running in a new LXC (game_seg at 10.61.x.x). World data is
  preserved. Ports are accessible from LAN. Old game server container is destroyed.

workflow:
  tooling:
    note: |
      Use ./with-secrets for terragrunt and ansible-playbook.
      Warn players before migration — game servers cause data loss if stopped mid-play.
      Back up world data before any destructive steps.

  steps:
    - id: 1
      name: Stop game servers and back up world data
      commands:
        - "ssh root@<old-game-ip> 'docker exec minecraft rcon-cli save-all'"
        - "ssh root@<old-game-ip> 'docker stop minecraft'"
        - "scp -r root@<old-game-ip>:/data/minecraft /tmp/minecraft-world-backup/"
      notes:
        - Always save-all and stop cleanly before copying world data
        - Warn any players before stopping

    - id: 2
      name: Snapshot old LXC
      commands:
        - "ssh root@pve-test.gibbsgreatly.xyz 'pct snapshot <old-vmid> pre-migration'"

    - id: 3
      name: Apply new game LXC
      commands:
        - cd /home/steve/git/proxmox-homelab/terraform/lxc/stacks/game-stack
        - "../../../../with-secrets terragrunt apply"
      notes:
        - IP in game_seg range: 10.61.0.10 or per discovery plan
        - Ensure sufficient CPU and memory in stack.yaml

    - id: 4
      name: Run playbook and restore world data
      commands:
        - "./with-secrets ansible-playbook -i '<new-ip>,' terraform/lxc/ansible/playbooks/deploy-game-stack.yml"
        - "scp -r /tmp/minecraft-world-backup/* root@<new-ip>:/data/minecraft/"
        - "ssh root@<new-ip> 'docker compose start'"

    - id: 5
      name: Verify game server is running
      commands:
        - "ssh root@<new-ip> 'docker logs minecraft | tail -20'"
        - "nc -zv <new-ip> 25565"
      expect: Server is listening on game port

    - id: 6
      name: Test connection from LAN
      instructions: |
        Connect to the game server from a client device at <new-ip>:25565.
        Verify players can join and the world data is intact.

    - id: 7
      name: Destroy old game server
      commands:
        - "ssh root@pve-test.gibbsgreatly.xyz 'pct stop <old-vmid> && pct destroy <old-vmid>'"

    - id: 8
      name: Commit
      commands:
        - git add terraform/lxc/stacks/game-stack/ terraform/lxc/ansible/playbooks/deploy-game-stack.yml
        - |
          git commit -m "feat(game-stack): migrate game services to game_seg

          Closes #118

          Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>"
        - git checkout dev/pve-test && git merge feat/game-stack
        - git push origin dev/pve-test
        - gh issue close 118 --comment "Fixed in $(git rev-parse HEAD)"

postconditions:
  criteria:
    - id: server-running
      description: Game server is listening on its port
      verify: "nc -zv <new-ip> 25565"
      expect: Connection successful

    - id: world-data-intact
      description: World data preserved from old server
      verify: "Manual check — connect from a game client"

    - id: old-destroyed
      description: Old game LXC is destroyed
      verify: "ssh root@pve-test.gibbsgreatly.xyz 'pct list | grep <old-vmid>'"
      expect: No match

notes:
  - Back up world data before stopping the old server — once players have built things,
    losing progress is highly visible and frustrating
  - Minecraft uses TCP 25565 by default; other games have different ports
  - game_seg may need firewall rules to allow LAN access to game ports
    Check MikroTik ACLs if LAN clients cannot connect after migration
