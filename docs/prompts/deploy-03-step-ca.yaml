---
id: dep-03-step-ca
title: "Deploy step-ca internal CA (VMID 152)"
phase: "04"
type: deployment
status: pending
depends_on:
  - dep-02-traefik
  - rem-04-step-ca-secrets
task_doc: docs/plan/tasks/04-core-services-04-deploy-step-ca.md
github_issue: "#125"

context: |
  Mode 2 (rebuild) execution. Deploy step-ca as a systemd service (not Docker) at
  10.57.1.11 in mgmt_seg. step-ca issues ACME certificates for internal lab routes
  using the httpChallenge method — step-ca calls back to Traefik on port 80 to verify.

  CRITICAL REBUILD IMPACT: step ca init generates a NEW root CA keypair on every
  fresh LXC deployment. After this task:
  - certs/homelab-root.crt in the repo must be updated with the new root cert
  - trust-homelab-ca.yml must be run against ALL already-deployed containers
    (retroactive CA trust distribution)
  - Any cert previously issued by the old CA becomes invalid

  After deploy, Traefik's step-ca resolver block is activated — it can now obtain
  certs for lab.gibbsgreatly.xyz routes (though the ACME storage will still be
  empty until a route actually requests a cert via certresolver=step-ca).

preconditions:
  repository:
    - id: remediation-done
      description: rem-04-step-ca-secrets is complete — playbook reads from env
      verify: "grep -c 'lookup.*env.*STEP_CA_PASSWORD' terraform/lxc/ansible/playbooks/deploy-step-ca.yml"
      expect: "1 or more"

  secrets:
    - key: STEP_CA_PASSWORD
      verify: |
        SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt \
          sops --decrypt terraform/secrets.enc.yaml | grep STEP_CA_PASSWORD
    - key: STEP_CA_PROVISIONER_PASSWORD
      verify: same pattern

  infrastructure:
    - id: traefik-running
      description: Traefik running at 10.57.2.10
      verify: "curl -o /dev/null -w '%{http_code}' http://10.57.2.10"
      expect: "301 or 302"

    - id: ip-available
      description: 10.57.1.11 is not in use
      verify: "ping -c 2 -W 1 10.57.1.11 && echo IN_USE || echo available"
      expect: available

    - id: mikrotik-policy
      description: MikroTik allows mgmt_seg → edge_seg tcp/80 (httpChallenge callback)
      verify: Manual check — this MikroTik rule must exist for ACME to work
      note: See terraform/lxc/network/pve-test.yaml for the expected rule

objective: |
  LXC VMID 152 is running at 10.57.1.11. step-ca serves ACME at
  https://10.57.1.11/acme/acme/directory. certs/homelab-root.crt is updated in
  the repo. Homelab root CA is trusted on Traefik container and Proxmox host.
  Traefik step-ca resolver can reach the ACME directory from inside the container.

workflow:
  tooling:
    note: |
      Use ./with-secrets for all terragrunt and ansible-playbook calls.
      Run ansible commands from terraform/lxc/ansible so roles_path resolves correctly.
      Inline IP inventories default to the local shell username; always pass -u root for direct ansible/ansible-playbook validation runs.
      step-ca runs as a systemd service — there is no Docker Compose.
      trust-homelab-ca.yml runs against the IP of each already-deployed container.

  steps:
    - id: 1
      name: Verify preconditions
      commands:
        - "./with-secrets bash -c 'echo Node=$TF_VAR_proxmox_node'"
        - "curl -o /dev/null -w '%{http_code}' http://10.57.2.10"
        - "ping -c 2 -W 1 10.57.1.11 || echo IP available"

    - id: 2
      name: Apply step-ca LXC
      commands:
        - cd /home/steve/git/proxmox-homelab/terraform/lxc/stacks/step-ca-stack
        - "../../../../with-secrets terragrunt apply"
      notes:
        - VMID 152, IP 10.57.1.11/24, gateway 10.57.1.1, zone mgmt_seg
        - No docker_storage_size — step-ca is a systemd service

    - id: 3
      name: Run Ansible playbook
      commands:
        - cd /home/steve/git/proxmox-homelab/terraform/lxc/ansible
        - "../../../with-secrets ansible -i '10.57.1.11,' -u root all -m ping"
        - "../../../with-secrets ansible-playbook -i '10.57.1.11,' -u root playbooks/deploy-step-ca.yml"
      notes:
        - If ping fails with UNREACHABLE, fix SSH auth/inventory before running the playbook
        - Playbook runs without --extra-vars for secrets
        - Wait for CA to be healthy (playbook should poll until ready)

    - id: 4
      name: Verify ACME directory
      commands:
        - "curl -sk https://10.57.1.11/acme/acme/directory | jq ."
      expect: JSON with newNonce, newAccount, newOrder keys

    - id: 5
      name: Fetch new root CA cert and commit to repo
      commands:
        - "step ca root /tmp/homelab-root.crt --ca-url https://10.57.1.11 --fingerprint <fingerprint>"
        - "cp /tmp/homelab-root.crt certs/homelab-root.crt"
        - "git add certs/homelab-root.crt"
        - |
          git commit -m "chore: update homelab root CA cert after step-ca rebuild

          Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>"
      notes:
        - The fingerprint is shown in the step-ca deploy logs or can be obtained with
          'step ca health --ca-url https://10.57.1.11' and inspecting the output
        - certs/homelab-root.crt is a public cert — safe to commit

    - id: 6
      name: Retroactive CA trust distribution
      description: |
        Run trust-homelab-ca.yml against every already-deployed LXC and the Proxmox host.
        This is mandatory — containers deployed before step-ca will not trust the new CA.
      commands:
        - cd /home/steve/git/proxmox-homelab/terraform/lxc/ansible
        - "../../../with-secrets ansible -i '10.57.2.10,' -u root all -m ping"
        - "../../../with-secrets ansible-playbook -i '10.57.2.10,' -u root playbooks/trust-homelab-ca.yml"
        - "../../../with-secrets ansible -i '10.57.1.10,' -u root all -m ping"
        - "../../../with-secrets ansible-playbook -i '10.57.1.10,' -u root playbooks/trust-homelab-ca.yml"
        - "../../../with-secrets ansible -i '192.168.1.40,' -u root all -m ping"
        - "../../../with-secrets ansible-playbook -i '192.168.1.40,' -u root playbooks/trust-homelab-ca.yml"
      notes:
        - Add any other LXC IPs that were deployed before step-ca
        - trust-homelab-ca.yml copies certs/homelab-root.crt and runs update-ca-certificates
        - WARNING — run only against managed service hosts, never end-user devices

    - id: 7
      name: Verify Traefik resolver from inside container
      commands:
        - "TRAEFIK_VMID=$(pct list | awk 'NR>1 && ($4==\"proxy-stack\" || $4==\"traefik\") {print $1; exit}')"
        - "test -n \"$TRAEFIK_VMID\""
        - "pct exec $TRAEFIK_VMID -- curl -s --cacert /usr/local/share/ca-certificates/homelab-root.crt https://10.57.1.11/acme/acme/directory | jq ."
      expect: ACME directory JSON returned without TLS error

    - id: 8
      name: Verify step-ca ACME storage in Traefik is still empty
      commands:
        - "pct exec 153 -- wc -c /opt/proxy-stack/certs/step-ca/acme.json"
      expect: "0 bytes — no internal certs issued yet (expected at this stage)"

postconditions:
  criteria:
    - id: lxc-running
      description: VMID 152 is running
      verify: "ssh root@pve-test.gibbsgreatly.xyz 'pct status 152'"
      expect: "status: running"

    - id: acme-directory
      description: ACME directory is reachable
      verify: "curl -sk https://10.57.1.11/acme/acme/directory | jq .newNonce"
      expect: URL string returned

    - id: root-cert-committed
      description: certs/homelab-root.crt is up to date in the repo
      verify: "git log --oneline certs/homelab-root.crt | head -1"
      expect: Recent commit message about step-ca rebuild

    - id: ca-trusted-on-traefik
      description: Homelab CA is trusted on the Traefik container
      verify: "pct exec 153 -- curl -s https://10.57.1.11/acme/acme/directory | jq .newNonce"
      expect: URL string returned (no TLS error)

    - id: ca-trusted-on-host
      description: Homelab CA is trusted on the Proxmox host
      verify: "ssh root@pve-test.gibbsgreatly.xyz 'curl -s https://10.57.1.11/acme/acme/directory | jq .newNonce'"
      expect: URL string returned

notes:
  - If step ca root requires --fingerprint, check step-ca startup logs via
    'pct exec 152 -- journalctl -u step-ca --no-pager | grep fingerprint'
  - CA rebuild impact: certs/homelab-root.crt changes on every rebuild. If Monitoring
    is already deployed and references this cert, re-run trust-homelab-ca.yml on VMID 154 too.
  - This deployment unblocks dep-04-monitoring
