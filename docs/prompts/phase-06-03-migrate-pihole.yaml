---
id: p06-03-migrate-pihole
title: "Migrate Pi-hole to app_seg (VMID 160)"
phase: "06"
type: deployment
status: pending
github_issue: "#115"
task_doc: docs/plan/tasks/06-app-stacks-03-migrate-pihole.md

context: |
  Pi-hole is the primary DNS resolver for all LAN clients. It is currently running
  somewhere on the existing Proxmox setup. This migration moves it to a new LXC
  (VMID 160) at 10.60.0.10 in app_seg.

  DNS IS CRITICAL PATH. The migration strategy is:
  1. Deploy new Pi-hole at 10.60.0.10 while old one is still running
  2. Verify new Pi-hole resolves correctly
  3. Switch client DNS resolvers to 10.60.0.10
  4. Verify clients work with the new IP
  5. Only then destroy the old Pi-hole

  Pi-hole image must be sourced from Harbor at 10.57.3.10/homelab/apps/pihole:<pin>.
  Mirror the image to Harbor before deploying if not already done in Phase 03b.

preconditions:
  repository:
    - id: discovery-done
      description: Old Pi-hole VMID, IP, config paths documented in phase-06-app-stacks.md
      verify: "grep -i pihole docs/plan/phase-06-app-stacks.md | grep '10\.'"

    - id: zones-ready
      description: app_seg zone exists in Proxmox (p06-02 complete)
      verify: "ssh root@pve-test.gibbsgreatly.xyz 'pvesh get /nodes/pve-test/sdn/zones'"
      expect: app_seg listed

    - id: stack-files
      description: pihole-stack/stack.yaml and deploy-pihole-stack.yml exist
      verify: |
        ls terraform/lxc/stacks/pihole-stack/stack.yaml
        ls terraform/lxc/ansible/playbooks/deploy-pihole-stack.yml

  secrets:
    - key: PIHOLE_WEB_PASSWORD
      verify: |
        SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt \
          sops --decrypt terraform/secrets.enc.yaml | grep PIHOLE_WEB_PASSWORD

  infrastructure:
    - id: harbor-has-pihole
      description: Pi-hole image available in Harbor
      verify: "curl -s http://10.57.3.10/api/v2.0/repositories | jq '.[].name' | grep pihole"
      action_if_missing: |
        ssh root@<harbor-host> "docker pull pihole/pihole:<tag> && \
          docker tag pihole/pihole:<tag> 10.57.3.10/homelab/apps/pihole:<tag> && \
          docker push 10.57.3.10/homelab/apps/pihole:<tag>"

    - id: old-pihole-ip
      description: Old Pi-hole IP known from discovery
      verify: "grep pihole docs/plan/phase-06-app-stacks.md | grep current"

    - id: new-ip-available
      description: 10.60.0.10 is not in use
      verify: "ping -c 2 -W 1 10.60.0.10 && echo IN_USE || echo available"
      expect: available

    - id: app-seg-routing
      description: LAN clients (192.168.1.0/24) can reach 10.60.0.0/24 via MikroTik
      verify: "ping -c 2 -W 1 10.60.0.1"
      expect: "Reply from 10.60.0.1 (MikroTik gateway for app_seg)"

objective: |
  New Pi-hole LXC (VMID 160) is running at 10.60.0.10 in app_seg. Blocklists are
  loaded. DNS queries from LAN clients resolve correctly via the new IP. Old Pi-hole
  container is destroyed. 10.60.0.10 is registered in NetBox.

workflow:
  tooling:
    note: |
      Use ./with-secrets for terragrunt and ansible-playbook.
      Run ansible commands from terraform/lxc/ansible so roles_path resolves correctly.
      Keep old Pi-hole running until new one is fully verified.
      DNS cutover is the most risky step — have a rollback ready.

  steps:
    - id: 1
      name: Mirror Pi-hole image to Harbor (if not already done)
      commands:
        - "curl -s http://10.57.3.10/api/v2.0/repositories | jq '.[].name' | grep pihole"
      decision:
        if_absent: |
          Pull the image on a Docker-capable host, tag, and push to Harbor:
          docker pull pihole/pihole:<tag>
          docker tag pihole/pihole:<tag> 10.57.3.10/homelab/apps/pihole:<tag>
          docker push 10.57.3.10/homelab/apps/pihole:<tag>

    - id: 2
      name: Export config from old Pi-hole
      commands:
        - "ssh root@<old-pihole-ip> 'docker exec pihole pihole -a -t /tmp/pihole_backup.tar.gz'"
        - "scp root@<old-pihole-ip>:/tmp/pihole_backup.tar.gz /tmp/pihole_backup.tar.gz"
      notes:
        - Keep this backup until the new Pi-hole is verified working

    - id: 3
      name: Snapshot old Pi-hole LXC before destruction
      commands:
        - "ssh root@pve-test.gibbsgreatly.xyz 'pct snapshot <old-vmid> pre-migration --vmstate'"

    - id: 4
      name: Apply new Pi-hole LXC
      commands:
        - cd /home/steve/git/proxmox-homelab/terraform/lxc/stacks/pihole-stack
        - "../../../../with-secrets terragrunt apply"
      notes:
        - VMID 160, IP 10.60.0.10/24, gateway 10.60.0.1, zone app_seg

    - id: 5
      name: Run Ansible playbook
      commands:
        - cd /home/steve/git/proxmox-homelab/terraform/lxc/ansible
        - "../../../with-secrets ansible -i '10.60.0.10,' all -m ping"
        - "../../../with-secrets ansible-playbook -i '10.60.0.10,' playbooks/deploy-pihole-stack.yml"

    - id: 6
      name: Restore Pi-hole config backup
      commands:
        - "scp /tmp/pihole_backup.tar.gz root@10.60.0.10:/tmp/"
        - "ssh root@10.60.0.10 'docker exec pihole pihole -a -i /tmp/pihole_backup.tar.gz'"

    - id: 7
      name: Verify new Pi-hole before DNS cutover
      commands:
        - "dig @10.60.0.10 google.com +short"
        - "dig @10.60.0.10 harbor-stack.lab.gibbsgreatly.xyz +short"
        - "curl -s http://10.60.0.10/admin/ | grep -c 'Pi-hole'"
      expect:
        - Public DNS resolves correctly
        - Internal lab names resolve via CoreDNS delegation
        - Pi-hole admin UI is accessible

    - id: 8
      name: "MANUAL — DNS cutover"
      type: manual
      instructions: |
        Only proceed when step 7 passes.
        On the MikroTik (or your DHCP server), update the DNS server for LAN clients
        from the old Pi-hole IP to 10.60.0.10.
        Wait 2–5 minutes for DHCP leases to refresh, then verify from a workstation:
          nslookup google.com  (should resolve via 10.60.0.10)
          ping harbor-stack.lab.gibbsgreatly.xyz

    - id: 9
      name: Verify LAN clients work with new IP
      commands:
        - "dig google.com"
        - "curl -s https://grafana.gibbsgreatly.xyz/api/health | jq .database"
      expect: Both work through the new Pi-hole

    - id: 10
      name: Destroy old Pi-hole LXC
      commands:
        - "ssh root@pve-test.gibbsgreatly.xyz 'pct stop <old-vmid> && pct destroy <old-vmid>'"
      notes:
        - Only run after DNS cutover is confirmed working for 30+ minutes

    - id: 11
      name: Update NetBox and commit
      commands:
        - "Update NetBox: retire old IP, register 10.60.0.10 for Pi-hole"
        - git add terraform/lxc/stacks/pihole-stack/ terraform/lxc/ansible/playbooks/deploy-pihole-stack.yml
        - |
          git commit -m "feat(pihole): migrate Pi-hole to app_seg at 10.60.0.10 (VMID 160)

          Closes #115

          Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>"
        - git checkout dev/pve-test && git merge feat/pihole-stack
        - git push origin dev/pve-test
        - gh issue close 115 --comment "Fixed in $(git rev-parse HEAD)"

postconditions:
  criteria:
    - id: lxc-running
      description: VMID 160 running at 10.60.0.10
      verify: "ssh root@pve-test.gibbsgreatly.xyz 'pct status 160'"
      expect: "status: running"

    - id: dns-resolves
      description: LAN clients resolve DNS via 10.60.0.10
      verify: "dig @10.60.0.10 google.com +short"
      expect: IP address returned

    - id: blocklists-active
      description: Pi-hole admin shows active blocklists
      verify: "curl -s http://10.60.0.10/admin/"
      expect: Pi-hole admin UI showing domains blocked

    - id: old-destroyed
      description: Old Pi-hole LXC is gone
      verify: "ssh root@pve-test.gibbsgreatly.xyz 'pct list | grep <old-vmid>'"
      expect: No match

rollback_plan:
  trigger: DNS cutover causes resolution failures
  steps:
    - Revert MikroTik/DHCP DNS server back to old Pi-hole IP
    - If old Pi-hole was destroyed prematurely, restore from snapshot:
      "ssh root@pve-test.gibbsgreatly.xyz 'pct restore <old-vmid> <snapshot-name>'"

notes:
  - Pi-hole is DNS critical path — do not destroy the old container until the new one
    has been serving LAN clients successfully for at least 30 minutes
  - The Pi-hole web password comes from SOPS as PIHOLE_WEB_PASSWORD
  - If Pi-hole uses a NAS for query logs or blocklist storage, ensure the new LXC
    has the same NFS mount configured in stack.yaml
