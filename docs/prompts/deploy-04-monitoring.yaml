---
id: dep-04-monitoring
title: "Deploy monitoring stack - VictoriaMetrics + Grafana + Loki (VMID 154) — runtime gate"
phase: "04"
type: deployment
status: pending
depends_on:
  - dep-01-authentik
  - dep-03-step-ca
  - rem-03-monitoring-secrets
task_doc: docs/plan/tasks/04-core-services-05-deploy-monitoring.md
github_issue: "#107"

context: |
  This is a runtime gate prompt.

  Mode 2 (rebuild) execution for the monitoring stack. Deploy this stack only
  after rem-03 has hardened secret handling in the playbook.

  HARD DEPENDENCIES:
  - rem-03-monitoring-secrets is complete and playbook uses env_file pattern
  - GRAFANA_ADMIN_PASSWORD, GRAFANA_OAUTH_CLIENT_ID, and
    GRAFANA_OAUTH_CLIENT_SECRET are real values in SOPS (no CHANGEME_)
  - Target node is pve-test (never pve)

  This stack deploys VictoriaMetrics, Grafana, Loki, and Promtail.

preconditions:
  repository:
    - id: remediation-gate
      description: rem-03 complete - env_file present and inline Grafana secret keys removed from compose content template
      verify: "grep -q 'env_file:' terraform/lxc/ansible/playbooks/deploy-monitoring-stack.yml && ! awk '/name: Write monitoring compose definition/{in_block=1} in_block && /^    - name: / && $0 !~ /name: Write monitoring compose definition/{exit} in_block{print}' terraform/lxc/ansible/playbooks/deploy-monitoring-stack.yml | grep -q 'GF_SECURITY_ADMIN_PASSWORD\\|GF_AUTH_GENERIC_OAUTH_CLIENT_ID\\|GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET'"
      expect: command exits 0

  infrastructure:
    - id: proxmox-target
      description: TF_VAR_proxmox_node resolves to pve-test
      verify: "./with-secrets bash -c 'echo $TF_VAR_proxmox_node'"
      expect: pve-test

    - id: memory
      description: pve-test has 32 GB RAM for full Phase 04 stack
      verify: "ssh root@pve-test.gibbsgreatly.xyz 'free -h | grep Mem'"
      expect: "~31 GiB total"

    - id: authentik-healthy
      description: Authentik health endpoint returns ready
      verify: "curl -s -o /dev/null -w '%{http_code}' http://10.57.1.10:9000/-/health/ready/"
      expect: "204"

    - id: traefik-running
      description: Traefik is reachable on 10.57.2.10
      verify: "curl -s -o /dev/null -w '%{http_code}' http://10.57.2.10"
      expect: "301 or 302"

    - id: stepca-running
      description: step-ca ACME endpoint is reachable
      verify: "curl -sk https://10.57.1.11/acme/acme/directory | jq .newNonce"
      expect: URL string

    - id: ip-available
      description: 10.57.1.12 is not already in use
      verify: "ping -c 2 -W 1 10.57.1.12 >/dev/null 2>&1 && echo IN_USE || echo AVAILABLE"
      expect: AVAILABLE

  secrets:
    - id: grafana-secrets-present
      description: all three Grafana keys exist in SOPS
      verify: |
        SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt \
          sops --decrypt terraform/secrets.enc.yaml \
          | grep -E '^GRAFANA_ADMIN_PASSWORD:|^GRAFANA_OAUTH_CLIENT_ID:|^GRAFANA_OAUTH_CLIENT_SECRET:'
      expect: three lines

    - id: grafana-secrets-real
      description: Grafana keys are real values, not placeholders
      verify: |
        SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt \
          sops --decrypt terraform/secrets.enc.yaml \
          | grep -E '^GRAFANA_ADMIN_PASSWORD:|^GRAFANA_OAUTH_CLIENT_ID:|^GRAFANA_OAUTH_CLIENT_SECRET:' \
          | grep -q 'CHANGEME_' && echo PLACEHOLDER || echo REAL
      expect: REAL

objective: |
  Provision and configure monitoring-stack (VMID 154, 10.57.1.12, mgmt_seg),
  with Grafana healthy, VictoriaMetrics and Loki reachable, Traefik route
  functional, and no literal Grafana credentials on disk.

workflow:
  tooling:
    note: |
      Use ./with-secrets for all terragrunt and ansible-playbook calls.
      Run Ansible from terraform/lxc/ansible for correct role resolution.
      Inline inventory checks must include -u root.
      Never pass secrets via --extra-vars.

  steps:
    - id: 1
      name: Verify guardrails and real secrets
      commands:
        - "./with-secrets bash -c 'echo Node=$TF_VAR_proxmox_node'"
        - |
          SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt \
            sops --decrypt terraform/secrets.enc.yaml \
            | grep -E '^GRAFANA_ADMIN_PASSWORD:|^GRAFANA_OAUTH_CLIENT_ID:|^GRAFANA_OAUTH_CLIENT_SECRET:'
        - |
          SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt \
            sops --decrypt terraform/secrets.enc.yaml \
            | grep -E '^GRAFANA_ADMIN_PASSWORD:|^GRAFANA_OAUTH_CLIENT_ID:|^GRAFANA_OAUTH_CLIENT_SECRET:' \
            | grep -q 'CHANGEME_' && echo 'BLOCKED: placeholders present' || echo 'OK: real values'
      decision:
        if_target_not_pve_test: Stop immediately and treat as targeting error.
        if_placeholders_present: |
          Stop deployment. Return to dep-01-authentik OIDC setup and update
          terraform/secrets.enc.yaml with real Grafana OAuth values.

    - id: 2
      name: Apply monitoring LXC infrastructure
      commands:
        - cd /home/steve/git/proxmox-homelab/terraform/lxc/stacks/monitoring-stack
        - "../../../../with-secrets terragrunt apply"
      notes:
        - Expected shape: VMID 154, IP 10.57.1.12/24, gw 10.57.1.1, zone mgmt_seg

    - id: 3
      name: Configure monitoring stack via Ansible
      commands:
        - cd /home/steve/git/proxmox-homelab/terraform/lxc/ansible
        - "../../../with-secrets ansible -i '10.57.1.12,' -u root all -m ping"
        - "../../../with-secrets ansible-playbook -i '10.57.1.12,' -u root playbooks/deploy-monitoring-stack.yml"

    - id: 4
      name: Validate service health
      commands:
        - "curl -s http://10.57.1.12:3000/api/health | jq .database"
        - "curl -s http://10.57.1.12:8428/metrics | head -5"
        - "curl -s http://10.57.1.12:3100/ready"
      expect:
        - Grafana returns '"ok"'
        - VictoriaMetrics returns metrics output
        - Loki returns ready

    - id: 5
      name: Validate secrets are not on disk
      commands:
        - "pct exec 154 -- stat -c '%a' /opt/monitoring-stack/.env"
        - "pct exec 154 -- grep -c 'GRAFANA_ADMIN_PASSWORD.*=' /opt/monitoring-stack/docker-compose.yml"
      expect:
        - .env mode is 600
        - compose grep returns 0

    - id: 6
      name: Validate provisioned datasources file and Traefik route
      commands:
        - "pct exec 154 -- test -f /opt/monitoring-stack/grafana/provisioning/datasources/datasources.yml && echo DATASOURCES_OK"
        - "curl -k -o /dev/null -w '%{http_code}' https://grafana.gibbsgreatly.xyz"
      expect:
        - DATASOURCES_OK
        - 200 or 302

    - id: 7
      name: Restart survival check
      commands:
        - "ssh root@pve-test.gibbsgreatly.xyz 'pct restart 154'"
        - |
          for i in $(seq 1 12); do
            state=$(curl -s http://10.57.1.12:3000/api/health | jq -r .database 2>/dev/null || true)
            if [ "$state" = "ok" ]; then
              echo OK
              exit 0
            fi
            echo "retry $i"
          done
          echo FAILED
          exit 1
      expect:
        - OK

    - id: 8
      name: OOM check on host
      commands:
        - "ssh root@pve-test.gibbsgreatly.xyz 'dmesg | grep -i oom | tail -5'"
      expect: no new OOM events after deployment

    - id: 9
      name: Security scan
      commands:
        - "./with-secrets sonar-scanner"

postconditions:
  criteria:
    - id: lxc-running
      description: VMID 154 is running
      verify: "ssh root@pve-test.gibbsgreatly.xyz 'pct status 154'"
      expect: "status: running"

    - id: grafana-healthy
      description: Grafana API reports database ok
      verify: "curl -s http://10.57.1.12:3000/api/health | jq .database"
      expect: '"ok"'

    - id: vm-healthy
      description: VictoriaMetrics serves metrics
      verify: "curl -s http://10.57.1.12:8428/metrics | head -1"
      expect: "# HELP or vm_"

    - id: loki-ready
      description: Loki readiness endpoint returns ready
      verify: "curl -s http://10.57.1.12:3100/ready"
      expect: ready

    - id: no-inline-secrets-on-disk
      description: docker-compose on disk contains no literal Grafana secret assignment
      verify: "pct exec 154 -- grep -c 'GRAFANA_ADMIN_PASSWORD.*=' /opt/monitoring-stack/docker-compose.yml"
      expect: "0"

    - id: route-works
      description: Grafana route responds through Traefik
      verify: "curl -k -o /dev/null -w '%{http_code}' https://grafana.gibbsgreatly.xyz"
      expect: "200 or 302"

    - id: no-oom
      description: Host OOM state unchanged by monitoring stack
      verify: "ssh root@pve-test.gibbsgreatly.xyz 'dmesg | grep -i oom | wc -l'"
      expect: "0 or unchanged baseline"

security_scan:
  when: Before merge
  commands:
    - "./with-secrets sonar-scanner"

merge:
  target: dev/pve-test

notes:
  - If rem-03 is not complete, stop and complete remediation first.
  - If any Grafana secret is CHANGEME_, deployment is blocked by design.
  - GF_AUTH_GENERIC_OAUTH_AUTH_URL, TOKEN_URL, and API_URL are non-secret config values.
