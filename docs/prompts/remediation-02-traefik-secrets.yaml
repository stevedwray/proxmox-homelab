---
id: rem-02-traefik-secrets
title: "Fix Traefik playbook — secrets injection, LE staging CA, cert persistence"
phase: "04-remediation"
type: remediation
status: pending
task_doc: docs/plan/tasks/04-core-services-03-deploy-traefik.md

context: |
  Three distinct problems exist in the Traefik stack that block rebuild-safety:

  1. CF_DNS_API_TOKEN is written in plaintext into /opt/proxy-stack/docker-compose.yml
     inside the LXC. The fix is the env_file pattern: write a SOPS-sourced .env file
     and reference ${CF_DNS_API_TOKEN} in the compose.

  2. The production Let's Encrypt CA URL (acme-v02.api.letsencrypt.org) is in traefik.yml.
     All pve-test dev passes must use the staging CA to avoid consuming rate-limit quota.
     Fix: caServer: https://acme-staging-v02.api.letsencrypt.org/directory

  3. The ACME cert storage (acme.json) lives inside the LXC filesystem at
     /opt/proxy-stack/certs/. Rebuilding the LXC destroys it. Fix: add a Proxmox host
     bind-mount in stack.yaml so the certs directory survives LXC rebuild:
       mounts:
         - host_path: /opt/traefik-certs
           container_path: /opt/proxy-stack/certs

  This task fixes all three issues. It is primarily a code change; a test run against
  a running Traefik LXC is optional but recommended if pve-test is available.

preconditions:
  repository:
    - id: branch
      description: Working on dev/pve-test or a short-lived branch from it
      verify: "git branch --show-current"
    - id: playbook-exists
      description: deploy-proxy-stack.yml exists
      verify: "ls terraform/lxc/ansible/playbooks/deploy-proxy-stack.yml"
    - id: stack-yaml-exists
      description: proxy-stack/stack.yaml exists
      verify: "ls terraform/lxc/stacks/proxy-stack/stack.yaml"
  secrets:
    - key: CF_DNS_API_TOKEN
      note: Must have a real value in terraform/secrets.enc.yaml
      verify: |
        SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt \
          sops --decrypt terraform/secrets.enc.yaml | grep CF_DNS_API_TOKEN

objective: |
  deploy-proxy-stack.yml writes /opt/proxy-stack/.env from SOPS-injected env,
  docker-compose.yml uses env_file:.env with no literal CF_DNS_API_TOKEN,
  traefik.yml uses the LE staging CA URL, and stack.yaml declares a Proxmox host
  bind-mount for /opt/proxy-stack/certs.

branch: fix/traefik-secrets-and-config

workflow:
  tooling:
    note: |
      All invocations: ./with-secrets ansible-playbook ... or ./with-secrets terragrunt ...
      Never source .env directly. Never --extra-vars for secrets.
      stack.yaml changes require a terragrunt apply to take effect.

  steps:
    - id: 1
      name: Create branch
      commands:
        - git checkout dev/pve-test && git pull
        - git checkout -b fix/traefik-secrets-and-config

    - id: 2
      name: Read existing files
      commands:
        - "Read: terraform/lxc/ansible/playbooks/deploy-proxy-stack.yml"
        - "Read: terraform/lxc/stacks/proxy-stack/stack.yaml"
      notes:
        - Identify where CF_DNS_API_TOKEN appears as a literal value
        - Check current caServer URL in the traefik.yml template within the playbook
        - Check whether stack.yaml has a mounts: section

    - id: 3
      name: "Fix 1 — Implement env_file pattern for CF_DNS_API_TOKEN"
      description: |
        Add a task to write /opt/proxy-stack/.env, update compose to use env_file.
      changes:
        - |
          Add to playbook (before docker compose up task):
            - name: Write secrets to .env
              copy:
                content: |
                  CF_DNS_API_TOKEN={{ lookup('env', 'CF_DNS_API_TOKEN') }}
                dest: /opt/proxy-stack/.env
                mode: '0600'

        - |
          In the docker-compose.yml template within the playbook:
          Replace any literal CF_DNS_API_TOKEN value with env_file pattern:
            services:
              traefik:
                env_file: .env
                environment:
                  - CF_DNS_API_TOKEN  (or remove if .env covers it)

    - id: 4
      name: "Fix 2 — Switch traefik.yml to LE staging CA"
      description: |
        Find the certificatesResolvers.letsencrypt.acme.caServer line in the
        traefik.yml template. Change to staging URL.
      change: |
        caServer: https://acme-staging-v02.api.letsencrypt.org/directory

        (Production URL to use only when promoting to pve:
         https://acme-v02.api.letsencrypt.org/directory)

    - id: 5
      name: "Fix 3 — Add certs bind-mount to stack.yaml"
      description: |
        Add a Proxmox host bind-mount so acme.json survives LXC rebuild.
        The host directory /opt/traefik-certs must be created manually on the
        Proxmox host before the first terragrunt apply (or added as an Ansible task
        targeting the Proxmox host).
      change: |
        In terraform/lxc/stacks/proxy-stack/stack.yaml, add:
          mounts:
            - host_path: /opt/traefik-certs
              container_path: /opt/proxy-stack/certs

        Verify how mounts are declared in the existing harbor-stack/stack.yaml
        or the Terraform module documentation to match the correct key names.

    - id: 6
      name: Verify no secrets in files
      commands:
        - "Grep: pattern=CF_DNS_API_TOKEN.*=.*[A-Za-z0-9] in deploy-proxy-stack.yml"
        - "Grep: pattern=acme-v02\\.api\\.letsencrypt\\.org in deploy-proxy-stack.yml"
      expected:
        - CF_DNS_API_TOKEN appears only as lookup('env', ...) reference
        - acme-staging-v02 URL is present; acme-v02 (production) is NOT present

    - id: 7
      name: Test run (if pve-test available)
      commands:
        - "./with-secrets ansible-playbook -i '10.57.2.10,' terraform/lxc/ansible/playbooks/deploy-proxy-stack.yml"
        - "pct exec 153 -- cat /opt/proxy-stack/.env"
        - "pct exec 153 -- grep CF_DNS_API_TOKEN /opt/proxy-stack/docker-compose.yml"
        - "pct exec 153 -- grep caServer /opt/proxy-stack/traefik.yml"
      expected:
        - .env contains real CF_DNS_API_TOKEN value
        - docker-compose.yml has no literal token value
        - traefik.yml shows staging CA URL

    - id: 8
      name: Security scan
      commands:
        - "./with-secrets sonar-scanner"
      notes:
        - Stop and present options if new issues found

    - id: 9
      name: Commit and merge
      commands:
        - git add terraform/lxc/ansible/playbooks/deploy-proxy-stack.yml terraform/lxc/stacks/proxy-stack/stack.yaml
        - |
          git commit -m "fix(traefik): secrets via env_file, LE staging CA, cert persistence bind-mount

          - CF_DNS_API_TOKEN written to .env at mode 0600 via SOPS injection
          - docker-compose.yml references env_file:.env, no literal token
          - traefik.yml uses LE staging CA (not production) for pve-test passes
          - stack.yaml adds Proxmox host bind-mount for certs/ directory

          Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>"
        - git checkout dev/pve-test && git merge fix/traefik-secrets-and-config
        - git push origin dev/pve-test

postconditions:
  criteria:
    - id: no-token-in-compose
      description: docker-compose.yml contains no literal CF_DNS_API_TOKEN value
      verify: "pct exec 153 -- grep -c 'CF_DNS_API_TOKEN.*=' /opt/proxy-stack/docker-compose.yml"
      expect: "0 (or match shows only env var reference, not a token value)"

    - id: env-file-mode
      description: .env file has mode 0600
      verify: "pct exec 153 -- stat -c '%a' /opt/proxy-stack/.env"
      expect: "600"

    - id: staging-ca
      description: traefik.yml uses LE staging CA
      verify: "pct exec 153 -- grep caServer /opt/proxy-stack/traefik.yml"
      expect: "acme-staging-v02.api.letsencrypt.org"

    - id: bind-mount-in-stack
      description: stack.yaml declares the certs bind-mount
      verify: "grep -A2 'host_path.*traefik-certs' terraform/lxc/stacks/proxy-stack/stack.yaml"
      expect: "host_path: /opt/traefik-certs and container_path: /opt/proxy-stack/certs"

    - id: traefik-still-running
      description: Traefik still redirects HTTP to HTTPS
      verify: "curl -o /dev/null -w '%{http_code}' http://10.57.2.10"
      expect: "301 or 302"

security_scan:
  when: Before merging — stop if new issues found
  commands:
    - "./with-secrets sonar-scanner"

merge:
  target: dev/pve-test

notes:
  - The Proxmox host directory /opt/traefik-certs must exist before terragrunt apply
    so the bind-mount succeeds. Either create it manually or add an Ansible task that
    runs against 192.168.1.40 (the pve-test host). Do NOT create it inside the LXC.
  - After adding the bind-mount, a terragrunt apply is required to reconfigure the LXC.
    This will restart the container. Have a rollback plan (pct restore snapshot) if needed.
  - The staging CA cert shows "(STAGING) Let's Encrypt" in browsers — this is correct
    and expected for pve-test. Do not change to production for any pve-test work.
  - The existing /opt/proxy-stack/certs/letsencrypt/acme.json (production cert, 13295 bytes)
    was obtained with the production CA. After switching to staging, a new staging cert will
    be requested. The production cert remains valid but is not used on pve-test after this fix.
