---
id: p06-02-create-sdn-zones
title: "Create app_seg and game_seg SDN zones"
phase: "06"
type: development
status: pending
github_issue: "#114"
task_doc: docs/plan/tasks/06-app-stacks-02-create-sdn-zones.md

context: |
  Before any Phase 06 application containers can be deployed, two new SDN VLAN
  zones must exist in Proxmox. All current zones (build_seg, mgmt_seg, edge_seg,
  infra_seg) were added using the proxmox-sdn-setup.yml Ansible playbook because
  the Terraform SDN provisioner only supports Simple zones (not VLAN zones).

  Zones to create:
  - app_seg: VLAN ID TBD, subnet 10.60.0.0/24, gateway 10.60.0.1
  - game_seg: VLAN ID TBD, subnet 10.61.0.0/24, gateway 10.61.0.1

  The MikroTik router must also have the corresponding VLAN interfaces added
  (same pattern as existing zones in terraform/lxc/network/pve-test.yaml).
  MikroTik changes are currently manual — there is no IaC for MikroTik (TM-09).

preconditions:
  repository:
    - id: discovery-done
      description: p06-01 workload discovery is complete — subnet plan confirmed
      verify: "grep -c '10.60\|10.61' docs/plan/phase-06-app-stacks.md"

  infrastructure:
    - id: no-conflicts
      description: 10.60.0.0/24 and 10.61.0.0/24 not in use on pve-test
      verify: |
        ssh root@pve-test.gibbsgreatly.xyz 'ip route show | grep -E "10\.60\.|10\.61\."'
      expect: Empty output (subnets not in use)

    - id: phase-04-running
      description: Phase 04 stack is healthy
      verify: "curl -s -o /dev/null -w '%{http_code}' http://10.57.1.10:9000/-/health/ready/"
      expect: "204"

objective: |
  app_seg and game_seg VLAN zones exist in Proxmox SDN. The corresponding VLAN
  interfaces exist on the MikroTik router. Subnets 10.60.0.0/24 and 10.61.0.0/24
  are registered in NetBox. An LXC can be provisioned into each new zone.

branch: feat/app-seg-zones

workflow:
  tooling:
    note: |
      VLAN zone creation via the proxmox-sdn-setup.yml Ansible playbook or Proxmox UI.
      Terraform does not support VLAN zones — do not attempt via terragrunt apply.
      MikroTik changes are manual — follow pve-test.yaml for the command pattern.

  steps:
    - id: 1
      name: Review existing zone definitions
      commands:
        - "Read: terraform/lxc/network/pve-test.yaml"
        - "Read: ansible/00-initial-setup/proxmox-sdn-setup.yml"
      notes:
        - Note the VLAN IDs and bridge names used for existing zones
        - Identify the next available VLAN IDs for app_seg and game_seg

    - id: 2
      name: Verify no subnet conflicts
      commands:
        - "ssh root@pve-test.gibbsgreatly.xyz 'ip route show | grep -E \"10\\.60\\.|10\\.61\\.\"'"
        - "ssh root@pve-test.gibbsgreatly.xyz 'pvesh get /nodes/pve-test/sdn/zones'"
      expect: Both should show empty/no conflict

    - id: 3
      name: Add zone definitions to the SDN config
      description: |
        Follow the same approach used for existing zones. If proxmox-sdn-setup.yml
        manages zones declaratively, add the new zones to its variable list.
        If zones are defined in pve-test.yaml, add the new entries there.
      commands:
        - "Edit: the appropriate config file to add app_seg and game_seg zone definitions"
        - "Read: ansible/00-initial-setup/proxmox-sdn-setup.yml to confirm the apply mechanism"

    - id: 4
      name: Apply SDN zones to Proxmox
      commands:
        - "./with-secrets ansible-playbook ansible/00-initial-setup/proxmox-sdn-setup.yml"
        - "ssh root@pve-test.gibbsgreatly.xyz 'pvesh get /nodes/pve-test/sdn/zones'"
      expect: app_seg (tvapps or similar) and game_seg (tvgames or similar) listed

    - id: 5
      name: "MANUAL — Add VLAN interfaces to MikroTik"
      type: manual
      instructions: |
        The MikroTik router needs VLAN interfaces for app_seg and game_seg.
        Follow the same pattern as existing zones documented in pve-test.yaml.
        Commands to run on the MikroTik (adjust VLAN IDs to match what was assigned):

          /interface vlan add interface=ether1 name=vlan60 vlan-id=60
          /ip address add address=10.60.0.1/24 interface=vlan60
          /interface vlan add interface=ether1 name=vlan61 vlan-id=61
          /ip address add address=10.61.0.1/24 interface=vlan61

        Verify routing works after: ping 10.60.0.1 from pve-test

    - id: 6
      name: Register subnets in NetBox
      instructions: |
        Access http://192.168.1.30 → IPAM → Prefixes → Add:
        - 10.60.0.0/24  Description: app_seg — Pi-hole, arr stack, Jellyfin
        - 10.61.0.0/24  Description: game_seg — game servers

    - id: 7
      name: Security scan (Terraform modified)
      commands:
        - "/home/steve/.local/bin/snyk iac test terraform/"

    - id: 8
      name: Commit and merge
      commands:
        - git checkout dev/pve-test && git pull
        - git checkout -b feat/app-seg-zones
        - git add terraform/lxc/network/ ansible/00-initial-setup/
        - |
          git commit -m "feat(network): add app_seg (10.60.0.0/24) and game_seg (10.61.0.0/24) SDN zones

          Closes #114

          Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>"
        - git checkout dev/pve-test && git merge feat/app-seg-zones
        - git push origin dev/pve-test
        - gh issue close 114 --comment "Fixed in $(git rev-parse HEAD)"

postconditions:
  criteria:
    - id: app-seg-exists
      description: app_seg zone visible in Proxmox
      verify: "ssh root@pve-test.gibbsgreatly.xyz 'pvesh get /nodes/pve-test/sdn/zones'"
      expect: app_seg zone listed

    - id: game-seg-exists
      description: game_seg zone visible in Proxmox
      verify: same as above
      expect: game_seg zone listed

    - id: mikrotik-routing
      description: Routing to new subnets works from pve-test
      verify: "ssh root@pve-test.gibbsgreatly.xyz 'ip route show | grep 10.60.0.0'"
      expect: Route via SDN bridge

    - id: netbox-registered
      description: Both subnets in NetBox
      verify: "Manual check in NetBox UI → IPAM → Prefixes"

security_scan:
  when: Before merging (Terraform files modified)
  commands:
    - "/home/steve/.local/bin/snyk iac test terraform/"

merge:
  target: dev/pve-test

notes:
  - VLAN IDs must not conflict with existing zones (VLAN 10 build, 20 mgmt, 30 edge, 40 infra)
  - Suggested: VLAN 60 for app_seg, VLAN 61 for game_seg
  - MikroTik trunk port must be configured to allow the new VLAN IDs through to pve-test
  - This task unblocks p06-03 through p06-06
