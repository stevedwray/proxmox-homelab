---
# Teardown/Deploy Test Prompt Index
#
# These prompts map one-to-one to docs/teardown-test/tasks.
# Use one prompt per AI-agent session.

prompts:
  - id: tt-00-normalize-completion-state
    file: 00-normalize-completion-state.yaml
    title: "Normalize completion state before teardown test"
    type: documentation
    status: pending
    task_doc: docs/teardown-test/tasks/00-normalize-completion-state.md

  - id: tt-01-answer-test-variables
    file: 01-answer-test-variables.yaml
    title: "Answer teardown test variables"
    type: documentation
    status: pending
    depends_on: [tt-00-normalize-completion-state]
    task_doc: docs/teardown-test/tasks/01-answer-test-variables.md

  - id: tt-02-inventory-scope-and-order
    file: 02-inventory-scope-and-order.yaml
    title: "Inventory scope and dependency order"
    type: documentation
    status: pending
    depends_on: [tt-01-answer-test-variables]
    task_doc: docs/teardown-test/tasks/02-inventory-scope-and-order.md

  - id: tt-03-backup-restore-readiness
    file: 03-backup-restore-readiness.yaml
    title: "Verify backup and restore readiness"
    type: operational-planning
    status: pending
    depends_on: [tt-02-inventory-scope-and-order]
    task_doc: docs/teardown-test/tasks/03-backup-restore-readiness.md

  - id: tt-04-source-edge-preflight
    file: 04-source-edge-preflight.yaml
    title: "Run source and edge preflight"
    type: validation
    status: pending
    depends_on: [tt-03-backup-restore-readiness]
    task_doc: docs/teardown-test/tasks/04-source-edge-preflight.md

  - id: tt-05-destroy-rehearsal
    file: 05-destroy-rehearsal.yaml
    title: "Execute approved destroy rehearsal"
    type: destructive-execution
    status: pending
    depends_on: [tt-04-source-edge-preflight]
    task_doc: docs/teardown-test/tasks/05-destroy-rehearsal.md

  - id: tt-06-foundation-redeploy
    file: 06-foundation-redeploy.yaml
    title: "Redeploy foundation services"
    type: deployment
    status: pending
    depends_on: [tt-05-destroy-rehearsal]
    task_doc: docs/teardown-test/tasks/06-foundation-redeploy.md

  - id: tt-07-edge-foundation-redeploy
    file: 07-edge-foundation-redeploy.yaml
    title: "Redeploy edge foundation"
    type: deployment
    status: pending
    depends_on: [tt-06-foundation-redeploy]
    task_doc: docs/teardown-test/tasks/07-edge-foundation-redeploy.md

  - id: tt-08-edge-reconciliation-activation
    file: 08-edge-reconciliation-activation.yaml
    title: "Activate edge reconciliation"
    type: deployment
    status: pending
    depends_on: [tt-07-edge-foundation-redeploy]
    task_doc: docs/teardown-test/tasks/08-edge-reconciliation-activation.md

  - id: tt-09-remaining-platform-redeploy
    file: 09-remaining-platform-redeploy.yaml
    title: "Redeploy remaining platform stacks"
    type: deployment
    status: pending
    depends_on: [tt-08-edge-reconciliation-activation]
    task_doc: docs/teardown-test/tasks/09-remaining-platform-redeploy.md

  - id: tt-10-end-to-end-validation
    file: 10-end-to-end-validation.yaml
    title: "Run end-to-end validation"
    type: validation
    status: pending
    depends_on: [tt-09-remaining-platform-redeploy]
    task_doc: docs/teardown-test/tasks/10-end-to-end-validation.md

  - id: tt-11-evidence-closeout
    file: 11-evidence-closeout.yaml
    title: "Close out evidence and follow-ups"
    type: documentation
    status: pending
    depends_on: [tt-10-end-to-end-validation]
    task_doc: docs/teardown-test/tasks/11-evidence-closeout.md
