---
id: tt-10-end-to-end-validation
title: "Run end-to-end validation"
type: validation
status: pending
depends_on:
  - tt-09-remaining-platform-redeploy
task_doc: docs/teardown-test/tasks/10-end-to-end-validation.md

context: |
  The rebuild is not complete until DNS, HTTPS, auth, registry, API, and
  reconciler checks all pass.

objective: |
  Prove the rebuilt platform satisfies the target behavior.

workflow:
  steps:
    - Validate VMIDs, IPs, and selected stack presence.
    - Validate all browser DNS records through authoritative and delegated resolvers.
    - Validate HTTPS/certificate/auth behavior.
    - Validate Harbor registry path and key service APIs.
    - Run full edge reconciler dry-run with no manifest args.
    - Stop on any regression.

postconditions:
  criteria:
    - End-to-end platform validation has pass/fail evidence.
