  # --- NetBox discovery ---

  - id: df-netbox-socket-proxy
    name: NetBox docker-socket-proxy discovery
    from: p-netbox
    to: [p-harbor, p-authentik, p-monitoring, p-portainer, p-traefik]
    protocol: tcp
    port: 2375
    transport_security: none
    auth: none
    data_classification: internal
    data: >
      Read-only Docker API responses: container list, image list, running
      service names, port bindings. Used by populate.py to discover services
      for NetBox inventory.
    trigger: on-demand  # when populate.py is run
    trust_boundary_crossing: tb-mgmt-to-infra  # netbox (infra) → mgmt hosts
    inferred_from: docker_socket_proxy_targets in stack.yaml files
    notes: >
      Docker socket proxy is unauthenticated plain-HTTP on each host's IP.
      The socket proxy filters to read-only Docker API paths, but any host
      that can reach port 2375 gets read access to the Docker daemon metadata.
      MikroTik zone policy is the only access control.

