    data: >
      Portainer API queries for stack and container listings, used as a
      discovery source when docker-socket-proxy is not available.
    trigger: on-demand
    trust_boundary_crossing: tb-mgmt-to-infra
    inferred_from: pve.yaml policy (infra_seg → mgmt_seg :9000/:9443)

