  # --- DNS ---

  - id: df-lxc-to-dns
    name: LXC containers resolve lab.gibbsgreatly.xyz via CoreDNS
    from: [p-traefik, p-authentik, p-harbor, p-apt-cacher, p-netbox, p-monitoring, p-portainer, p-step-ca, p-ci-runner]
    to: p-dns
    protocol: udp+tcp
    port: 53
    transport_security: none
    auth: none
    data_classification: internal
    data: >
      DNS queries for lab.gibbsgreatly.xyz hostnames (e.g. harbor.lab.gibbsgreatly.xyz,
      authentik.lab.gibbsgreatly.xyz). Queries are forwarded from each LXC's
      gateway (MikroTik) which delegates the lab zone to CoreDNS.
    trigger: runtime
    trust_boundary_crossing: varies  # depends on LXC zone
    inferred_from: dns_server pointing to VLAN gateway in stack.yaml; CoreDNS zone delegation from MikroTik
    notes: >
      LXCs use the MikroTik gateway as their DNS server, not CoreDNS directly.
      MikroTik delegates lab.gibbsgreatly.xyz to the CoreDNS LXC.
