all:
  children:
    # Debian template builder containers
    debian_template_builder:
      hosts:
        debian_builder:
          ansible_host: "{{ ansible_host_ip_map.debian_template_builder }}"
          ansible_user: root
          ansible_ssh_private_key_file: "{{ lookup('env', 'ANSIBLE_PRIVATE_KEY_FILE') | default('~/.ssh/id_ed25519') }}"
          ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

    # Alpine template builder containers
    alpine_template_builder:
      hosts:
        alpine_builder:
          ansible_host: "{{ ansible_host_ip_map.alpine_template_builder }}"
          ansible_user: root
          ansible_ssh_private_key_file: "{{ lookup('env', 'ANSIBLE_PRIVATE_KEY_FILE') | default('~/.ssh/id_ed25519') }}"
          ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          ansible_python_interpreter: /usr/bin/python3

    # Enhanced template containers
    debian_template_enhanced:
      hosts:
        debian_enhanced:
          ansible_host: "{{ ansible_host_ip_map.debian_template_enhanced }}"
          ansible_user: root
          ansible_ssh_private_key_file: "{{ lookup('env', 'ANSIBLE_PRIVATE_KEY_FILE') | default('~/.ssh/id_ed25519') }}"
          ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

    alpine_template_enhanced:
      hosts:
        alpine_enhanced:
          ansible_host: "{{ ansible_host_ip_map.alpine_template_enhanced }}"
          ansible_user: root
          ansible_ssh_private_key_file: "{{ lookup('env', 'ANSIBLE_PRIVATE_KEY_FILE') | default('~/.ssh/id_ed25519') }}"
          ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          ansible_python_interpreter: /usr/bin/python3

    # Framework Desktop - bare-metal Ubuntu 26, AI/LLM workloads (not Proxmox,
    # not Terraform-managed; see docs/framework-ubuntu/plan.md)
    framework:
      hosts:
        framework.gibbsgreatly.xyz:
          ansible_host: "{{ lookup('env', 'FRAMEWORK_HOST_IP') | default('framework.gibbsgreatly.xyz', true) }}"
          ansible_user: steve
          ansible_ssh_private_key_file: "{{ lookup('env', 'ANSIBLE_PRIVATE_KEY_FILE') | default('~/.ssh/id_ed25519') }}"
          ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
      vars:
        ansible_python_interpreter: /usr/bin/python3
