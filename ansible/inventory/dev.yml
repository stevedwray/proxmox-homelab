all:
  children:
    # Proxmox dev/test server
    proxmox:
      children:
        proxmox_testbed:
          hosts:
            pve-test.gibbsgreatly.xyz:
              ansible_host: "{{ lookup('env', 'PROXMOX_TESTBED_HOST_IP') | default('pve-test.gibbsgreatly.xyz') }}"
              ansible_user: root
              pmx_enable_nftables_firewall: true

      vars:
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

    # Debian template builder containers
    debian_template_builder:
      hosts:
        debian_builder:
          ansible_host: 192.168.1.50
          ansible_user: root
          ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

    # Alpine template builder containers
    alpine_template_builder:
      hosts:
        alpine_builder:
          ansible_host: 192.168.1.52
          ansible_user: root
          ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          ansible_python_interpreter: /usr/bin/python3

    # Enhanced template containers
    debian_template_enhanced:
      hosts:
        debian_enhanced:
          ansible_host: 192.168.1.51
          ansible_user: root
          ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

    alpine_template_enhanced:
      hosts:
        alpine_enhanced:
          ansible_host: 192.168.1.53
          ansible_user: root
          ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          ansible_python_interpreter: /usr/bin/python3
