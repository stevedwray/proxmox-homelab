all:
  children:
    proxmox:
      hosts:
        pvetest:
          ansible_host: pvetest.gibbsgreatly.xyz
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
    template_builder:
      hosts:
        template-builder:
          ansible_host: 192.168.1.50
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
    template_enhanced:
      hosts:
        template-enhanced:
          ansible_host: 192.168.1.51  # Different IP
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
    test_containers:
      hosts:
        test-1:
          ansible_host: "{{ hostvars['pvetest']['container_ips']['test-1'] | default('dhcp') }}"
          ansible_user: root
          container_id: 101
        test-2:
          ansible_host: "{{ hostvars['pvetest']['container_ips']['test-2'] | default('dhcp') }}"
          ansible_user: root
          container_id: 102
      vars:
        ansible_ssh_private_key_file: ~/.ssh/id_rsa
