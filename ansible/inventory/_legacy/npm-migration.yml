all:
  hosts:
    management_stack:
      ansible_host: 192.168.1.4
      ansible_user: root
      ansible_ssh_private_key_file: ~/.ssh/id_rsa
    proxmox_host:
      ansible_host: 192.168.1.2
      ansible_user: root
      ansible_ssh_private_key_file: ~/.ssh/id_rsa

  vars:
    ansible_host_key_checking: false
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
