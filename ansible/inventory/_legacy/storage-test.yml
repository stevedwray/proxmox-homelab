# FILE: inventory/storage-test.yml
# Ansible inventory for Proxmox storage testing

all:
  children:
    proxmox:
      children:
        proxmox_testbed:
          hosts:
            pvetest02.gibbsgreatly.xyz:
              ansible_host: 192.168.1.30
              ansible_user: root
              ansible_ssh_private_key_file: ~/.ssh/id_rsa

        # Future: proxmox_production group would go here
        # proxmox_production:
        #   hosts:
        #     pve01.gibbsgreatly.xyz:
        #       ansible_host: 192.168.1.10

      vars:
        # Common Proxmox variables (apply to ALL Proxmox hosts)
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
