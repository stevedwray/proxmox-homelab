---
# Hardened Alpine LXC template builder with security best practices
- name: Create and configure hardened Alpine LXC template
  hosts: proxmox
  become: yes
  vars:
    template_id: "{{ lxc_template_id | default(901) }}"
    template_hostname: "{{ lxc_template_hostname | default('alpine-template-builder') }}"
    template_ip: "{{ lxc_template_ip | default('192.168.1.52') }}"
    template_memory: "{{ lxc_template_memory | default(1024) }}"
    template_cores: "{{ lxc_template_cores | default(1) }}"
    template_disk: "{{ lxc_template_disk | default('4') }}"
    base_template: "{{ lxc_base_template | default('local:vztmpl/alpine-3.22-default_20250617_amd64.tar.xz') }}"
    storage_pool: "{{ lxc_storage_pool | default('local-zfs') }}"
    network_bridge: "{{ lxc_network_bridge | default('vmbr0') }}"
    gateway_ip: "{{ lxc_gateway_ip | default('192.168.1.1') }}"

  tasks:
    - name: Clean up existing container if present
      shell: |
        set -o pipefail
        if pct list | grep -q "^\s*{{ template_id }}\s"; then
          pct destroy {{ template_id }} --purge --force || true
          sleep 2
        fi
      changed_when: true

    - name: Create and start Alpine container
      shell: >
        pct create {{ template_id }} {{ base_template }}
        --hostname {{ template_hostname }}
        --memory {{ template_memory }} --cores {{ template_cores }} --rootfs {{ storage_pool }}:{{ template_disk }}
        --net0 name=eth0,bridge={{ network_bridge }},ip={{ template_ip }}/24,gw={{ gateway_ip }}
        --ssh-public-keys ~/.ssh/id_rsa.pub
        --features nesting=1,keyctl=1
        --start
      changed_when: true

    - name: Wait for container to be running
      shell: pct status {{ template_id }}
      register: container_status
      until: "'running' in container_status.stdout"
      retries: 10
      delay: 3
      changed_when: false

    - name: Bootstrap essential packages and basic security hardening via pct exec
      changed_when: true
      shell: |
        set -o pipefail
        pct exec {{ template_id }} -- ash -c '
        # Update and install available packages
        apk update
        apk add --no-cache openssh python3 sudo shadow tzdata iptables
        apk add --no-cache docker docker-compose docker-cli-compose
        apk add --no-cache curl vim htop unzip git py3-pip net-tools ca-certificates

        # Generate SSH keys
        ssh-keygen -A

        # Basic SSH hardening (keep it simple)
        sed -i "s/#PermitRootLogin.*/PermitRootLogin prohibit-password/" /etc/ssh/sshd_config
        sed -i "s/#PasswordAuthentication.*/PasswordAuthentication no/" /etc/ssh/sshd_config
        sed -i "s/#MaxAuthTries.*/MaxAuthTries 3/" /etc/ssh/sshd_config
        echo "ClientAliveInterval 300" >> /etc/ssh/sshd_config
        echo "ClientAliveCountMax 2" >> /etc/ssh/sshd_config

        # Enable and start SSH
        rc-update add sshd default
        rc-service sshd start

        # Create automation user
        adduser -D -s /bin/ash -G wheel automation
        echo "automation:*" | chpasswd -e

        # Configure SSH access
        mkdir -p /home/automation/.ssh /root/.ssh
        echo "{{ lookup("file", "~/.ssh/id_rsa.pub") }}" > /home/automation/.ssh/authorized_keys
        echo "{{ lookup("file", "~/.ssh/id_rsa.pub") }}" > /root/.ssh/authorized_keys
        chown -R automation:automation /home/automation/.ssh
        chmod 700 /home/automation/.ssh /root/.ssh
        chmod 600 /home/automation/.ssh/authorized_keys /root/.ssh/authorized_keys

        # Configure sudo
        echo "%wheel ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/wheel

        # Basic kernel security settings
        cat > /etc/sysctl.d/99-security.conf << "SYSCTLEOF"
        net.ipv4.conf.all.send_redirects = 0
        net.ipv4.conf.all.accept_redirects = 0
        net.ipv4.conf.all.secure_redirects = 0
        net.ipv4.conf.all.accept_source_route = 0
        net.ipv4.ip_forward = 0
        net.ipv4.tcp_syncookies = 1
        kernel.dmesg_restrict = 1
        fs.suid_dumpable = 0
        SYSCTLEOF

        sysctl -p /etc/sysctl.d/99-security.conf

        # Set timezone
        ln -sf /usr/share/zoneinfo/Pacific/Auckland /etc/localtime
        echo "Pacific/Auckland" > /etc/timezone

        # Restart SSH
        rc-service sshd restart
        '

    - name: Verify SSH connectivity
      wait_for:
        host: "{{ template_ip }}"
        port: 22
        timeout: 60

    - name: Remove old SSH host key from known_hosts
      delegate_to: localhost
      shell: ssh-keygen -f "{{ ansible_env.HOME }}/.ssh/known_hosts" -R "{{ template_ip }}"
      failed_when: false
      changed_when: true
      become: no

- name: Configure hardened Alpine container via SSH
  hosts: alpine_template_builder
  become: yes
  gather_facts: no
  vars:
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

  tasks:
    - name: Configure Docker and basic firewall
      changed_when: true
      raw: |
        # Docker configuration
        mkdir -p /etc/docker
        cat > /etc/docker/daemon.json << 'DOCKEREOF'
        {
          "log-driver": "json-file",
          "log-opts": {
            "max-size": "10m",
            "max-file": "3"
          },
          "storage-driver": "overlay2",
          "no-new-privileges": true
        }
        DOCKEREOF

        # Docker service setup
        rc-update add docker boot
        adduser automation docker

        # Basic iptables firewall
        cat > /etc/local.d/firewall.start << 'FWEOF'
        #!/bin/ash
        # Basic firewall rules
        iptables -F
        iptables -P INPUT DROP
        iptables -P FORWARD DROP
        iptables -P OUTPUT ACCEPT
        iptables -A INPUT -i lo -j ACCEPT
        iptables -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT
        iptables -A INPUT -p tcp --dport 22 -j ACCEPT
        iptables -A INPUT -p tcp --dport 9001 -j ACCEPT
        FWEOF
        chmod +x /etc/local.d/firewall.start

    - name: Create basic management scripts
      changed_when: true
      raw: |
        # Create security check script
        cat > /usr/local/bin/security-check << 'EOF'
        #!/bin/ash
        echo "=== Security Status Check ==="
        echo "SSH Configuration:"
        grep -E "PermitRootLogin|PasswordAuthentication|MaxAuthTries" /etc/ssh/sshd_config
        echo ""
        echo "Firewall Rules:"
        iptables -L INPUT -n
        echo ""
        echo "Docker Status:"
        docker info --format 'Docker running: {{ "{{" }}.ServerVersion{{ "}}" }}'
        echo ""
        echo "Running Containers:"
        docker ps --format "table {{ "{{" }}.Names{{ "}}" }}\t{{ "{{" }}.Status{{ "}}" }}\t{{ "{{" }}.Ports{{ "}}" }}"
        EOF
        chmod 755 /usr/local/bin/security-check

    - name: Create Portainer setup with security
      changed_when: true
      raw: |
        mkdir -p /opt/portainer
        cat > /opt/portainer/docker-compose.yml << 'EOF'
        version: '3.8'
        services:
          portainer-agent:
            image: portainer/agent:2.21.1
            container_name: portainer-agent
            restart: unless-stopped
            ports:
              - "9001:9001"
            volumes:
              - /var/run/docker.sock:/var/run/docker.sock:ro
              - /var/lib/docker/volumes:/var/lib/docker/volumes:ro
            environment:
              - AGENT_CLUSTER_ADDR=tasks.agent
            logging:
              driver: "json-file"
              options:
                max-size: "10m"
                max-file: "3"
            security_opt:
              - no-new-privileges:true
            read_only: true
            tmpfs:
              - /tmp:rw,noexec,nosuid,size=1G
        EOF

        # Create hardened management script
        cat > /usr/local/bin/portainer-agent << 'EOF'
        #!/bin/ash
        cd /opt/portainer
        case "$1" in
          start)
            echo "Starting Portainer Agent..."
            docker-compose up -d
            ;;
          stop)
            echo "Stopping Portainer Agent..."
            docker-compose down
            ;;
          restart)
            echo "Restarting Portainer Agent..."
            docker-compose restart
            ;;
          status)
            docker-compose ps
            ;;
          logs)
            docker-compose logs
            ;;
          scan)
            echo "Running security scan..."
            trivy image portainer/agent:2.21.1
            ;;
          benchmark)
            echo "Running Docker security benchmark..."
            docker-bench-security
            ;;
          *)
            echo "Usage: $0 {start|stop|restart|status|logs|scan|benchmark}"
            ;;
        esac
        EOF
        chmod 755 /usr/local/bin/portainer-agent

    - name: Create security monitoring script
      changed_when: true
      raw: |
        cat > /usr/local/bin/security-check << 'EOF'
        #!/bin/ash
        echo "=== Security Status Check ==="
        echo "Firewall Status:"
        ufw status
        echo ""
        echo "Fail2ban Status:"
        fail2ban-client status
        echo ""
        echo "SSH Security:"
        sshd -T | grep -E "PermitRootLogin|PasswordAuthentication|MaxAuthTries"
        echo ""
        echo "Docker Security:"
        docker info --format '{{json .SecurityOptions}}'
        echo ""
        echo "Running Containers:"
        docker ps --format "table {{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}\t{{ '{{' }}.Ports{{ '}}' }}"
        EOF
        chmod 755 /usr/local/bin/security-check

    - name: Clean up for template conversion
      changed_when: true
      raw: |
        # Clear caches and logs
        apk cache clean
        rm -rf /var/cache/apk/* /tmp/* /var/tmp/*
        find /var/log -name "*.log" -exec truncate -s 0 {} \;

        # Clear history
        rm -f /root/.ash_history /home/*/.ash_history /home/*/.bash_history

        # Remove SSH host keys (regenerated on first boot)
        rm -f /etc/ssh/ssh_host_*_key*

- name: Convert to template
  hosts: proxmox
  become: yes
  vars:
    template_id: "{{ lxc_template_id | default(901) }}"
  tasks:
    - name: Stop and convert container to template
      shell: |
        pct stop {{ template_id }}
        pct template {{ template_id }}
      changed_when: true

    - name: Display success message
      debug:
        msg: |
          Hardened Alpine LXC template {{ template_id }} created successfully!

          Security Features:
            ✓ SSH hardened (password auth disabled, connection limits)
            ✓ Basic iptables firewall configured
            ✓ Docker security configuration
            ✓ Kernel security parameters applied
            ✓ Minimal package set

          Management Commands:
            - security-check (check security status)
            - portainer-agent {start|stop|restart|status|logs}

          Usage:
            pct clone {{ template_id }} <new_id> --hostname <hostname>
