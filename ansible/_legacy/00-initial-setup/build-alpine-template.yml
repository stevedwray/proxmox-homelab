---
# 01-base-system/build-lxc-template-alpine.yml
- name: Create and configure Alpine LXC template
  hosts: proxmox
  become: yes
  vars:
    template_id: "{{ lxc_template_id | default(901) }}"
    template_hostname: "{{ lxc_template_hostname | default('alpine-template-builder') }}"
    template_ip: "{{ lxc_template_ip | default('192.168.1.52') }}"
    template_memory: "{{ lxc_template_memory | default(1024) }}"
    template_cores: "{{ lxc_template_cores | default(1) }}"
    template_disk: "{{ lxc_template_disk | default('4') }}"
    base_template: "{{ lxc_base_template | default('local:vztmpl/alpine-3.22-default_20250617_amd64.tar.xz') }}"
    storage_pool: "{{ lxc_storage_pool | default('local-zfs') }}"
    network_bridge: "{{ lxc_network_bridge | default('vmbr0') }}"
    gateway_ip: "{{ lxc_gateway_ip | default('192.168.1.1') }}"

  tasks:
    - name: Check if template container already exists
      shell: |
        set -o pipefail
        pct list | grep -q "^\s*{{ template_id }}\s"
      register: container_exists
      failed_when: false
      changed_when: false

    - name: Debug container existence check
      debug:
        msg: "Container {{ template_id }} exists check: rc={{ container_exists.rc }}"

    - name: Force destroy existing container if it exists
      shell: pct destroy {{ template_id }} --purge --force
      when: container_exists.rc == 0
      failed_when: false
      changed_when: true

    - name: Wait a moment for cleanup
      pause:
        seconds: 2
      when: container_exists.rc == 0

    - name: Download Alpine template if not present
      shell: pveam download local alpine-3.22-default_20250617_amd64.tar.xz
      failed_when: false
      changed_when: true
      when: container_exists.rc != 0

    - name: Create base LXC container
      changed_when: true
      shell: >
        pct create {{ template_id }} {{ base_template }}
        --hostname {{ template_hostname }}
        --memory {{ template_memory }}
        --cores {{ template_cores }}
        --rootfs {{ storage_pool }}:{{ template_disk }}
        --net0 name=eth0,bridge={{ network_bridge }},ip={{ template_ip }}/24,gw={{ gateway_ip }}
        --ssh-public-keys ~/.ssh/id_rsa.pub
        --features nesting=1,keyctl=1
      when: container_exists.rc != 0

    - name: Start the container
      shell: pct start {{ template_id }}
      changed_when: true
      when: container_exists.rc != 0

    - name: Wait for container to be running
      shell: pct status {{ template_id }}
      register: container_status
      until: "'running' in container_status.stdout"
      retries: 10
      delay: 5
      changed_when: false

    - name: Install and configure SSH via pct exec
      changed_when: true
      shell: |
        set -o pipefail
        pct exec {{ template_id }} -- ash -c "
        set -e
        echo 'Starting package installation...'
        apk update
        apk add --no-cache openssh sudo shadow bash python3

        echo 'Verifying Python installation...'
        python3 --version
        which python3

        echo 'Generating SSH host keys...'
        ssh-keygen -A

        echo 'Configuring SSH service...'
        rc-update add sshd default

        echo 'Starting SSH service...'
        rc-service sshd start

        echo 'Verifying SSH is running...'
        sleep 3
        if ! pgrep sshd > /dev/null; then
            echo 'ERROR: SSH daemon not running!'
            ps aux | grep ssh
            rc-service sshd status
            exit 1
        fi

        echo 'SSH is running, checking port...'
        netstat -tlnp | grep :22 || echo 'Port 22 not found in netstat'

        echo 'SSH setup completed successfully!'
        "
      register: ssh_install_result

    - name: Display SSH installation output
      debug:
        var: ssh_install_result.stdout_lines

    - name: Verify SSH is actually listening
      shell: |
        set -o pipefail
        pct exec {{ template_id }} -- netstat -tlnp | grep :22
      register: ssh_port_check
      failed_when: false
      changed_when: false

    - name: Show SSH port status
      debug:
        msg: "SSH port check: {{ ssh_port_check.stdout | default('No SSH port found') }}"

    - name: Wait for SSH to be available
      wait_for:
        host: "{{ template_ip }}"
        port: 22
        delay: 5
        timeout: 60
      when: ssh_port_check.rc == 0

    - name: Clean up old SSH host key from known_hosts
      delegate_to: localhost
      shell: ssh-keygen -f "{{ ansible_env.HOME }}/.ssh/known_hosts" -R "{{ template_ip }}"
      failed_when: false
      changed_when: true
      become: no

- name: Initial container setup via pct exec
  hosts: proxmox
  become: yes
  vars:
    template_id: "{{ lxc_template_id | default(901) }}"
    template_ip: "{{ lxc_template_ip | default('192.168.1.52') }}"

  tasks:
    - name: Configure automation user via pct exec
      changed_when: true
      shell: |
        set -o pipefail
        pct exec {{ template_id }} -- ash -c "
        echo 'Creating automation user...'
        adduser -D -s /bin/ash -G wheel automation
        echo 'automation:*' | chpasswd -e

        echo 'Setting up SSH keys...'
        mkdir -p /home/automation/.ssh
        echo '{{ lookup('file', '~/.ssh/id_rsa.pub') }}' > /home/automation/.ssh/authorized_keys
        chown -R automation:automation /home/automation/.ssh
        chmod 700 /home/automation/.ssh
        chmod 600 /home/automation/.ssh/authorized_keys

        echo 'Configuring sudo...'
        echo '%wheel ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/wheel

        echo 'Configuring root SSH access...'
        sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
        mkdir -p /root/.ssh
        echo '{{ lookup('file', '~/.ssh/id_rsa.pub') }}' > /root/.ssh/authorized_keys
        chmod 700 /root/.ssh
        chmod 600 /root/.ssh/authorized_keys

        echo 'Restarting SSH service...'
        rc-service sshd restart
        sleep 3

        echo 'User setup completed successfully!'
        "
      register: user_setup_result

    - name: Display user setup output
      debug:
        var: user_setup_result.stdout_lines

- name: Configure the Alpine LXC container via SSH
  hosts: alpine_template_builder
  become: yes
  gather_facts: no
  vars:
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
    template_packages:
      # Basic system tools
      - curl
      - wget
      - vim
      - htop
      - unzip
      - git
      - python3
      - py3-pip
      - net-tools
      - openssh
      - sudo
      - shadow
      - ca-certificates
      - gnupg
      # Network diagnostic tools
      - tcpdump
      - traceroute
      - nmap
      - bind-tools
      - busybox-extras
      # Additional utilities
      - tree
      - less
      - nano
      - bash
      - coreutils
      - util-linux

  tasks:
    - name: Install Python for Ansible (raw command)
      raw: apk add --no-cache python3
      changed_when: false

    - name: Gather facts now that Python is available
      setup:

    - name: Update package cache
      apk:
        update_cache: yes

    - name: Upgrade all packages
      apk:
        upgrade: yes

    - name: Install standard packages
      apk:
        name: "{{ template_packages }}"
        state: present

    - name: Install tzdata package for timezone support
      apk:
        name: tzdata
        state: present

    - name: Configure timezone
      shell: |
        ln -sf /usr/share/zoneinfo/Pacific/Auckland /etc/localtime
        echo "Pacific/Auckland" > /etc/timezone
      changed_when: true

    - name: Ensure automation user exists with proper configuration
      user:
        name: automation
        groups: wheel
        shell: /bin/ash
        create_home: yes
        password: '*'  # Disabled password

    - name: Add wheel group to sudoers
      copy:
        content: '%wheel ALL=(ALL) NOPASSWD:ALL'
        dest: /etc/sudoers.d/wheel
        mode: '0440'

    - name: Configure auto-login for console
      block:
        - name: Configure inittab for auto-login
          lineinfile:
            path: /etc/inittab
            regexp: '^tty1::'
            line: 'tty1::respawn:/sbin/getty -nl /bin/login-root 38400 tty1'
            backup: yes

        - name: Create login-root script
          copy:
            content: |
              #!/bin/ash
              exec /bin/login -f root
            dest: /bin/login-root
            mode: '0755'

    - name: Configure SSH for automation user
      authorized_key:
        user: automation
        state: present
        key: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"

    - name: Install Docker (optional)
      block:
        - name: Add Docker repository
          changed_when: true
          shell: |
            echo "https://dl-cdn.alpinelinux.org/alpine/edge/community" >> /etc/apk/repositories
            apk update

        - name: Install Docker packages
          apk:
            name:
              - docker
              - docker-compose
              - docker-cli-compose
            state: present

        - name: Add automation user to docker group
          user:
            name: automation
            groups: docker
            append: yes

        - name: Enable and start Docker service
          service:
            name: docker
            enabled: yes
            state: started

        - name: Add docker to boot runlevel
          shell: rc-update add docker boot
          changed_when: true

        - name: Install Docker Compose (latest version)
          get_url:
            url: "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64"
            dest: /usr/local/bin/docker-compose
            mode: '0755'
            owner: root
            group: root

        - name: Create docker-compose symlink
          file:
            src: /usr/local/bin/docker-compose
            dest: /usr/bin/docker-compose
            state: link

        - name: Verify Docker Compose installation
          command: docker-compose --version
          register: compose_version
          failed_when: false
          changed_when: false

      when: install_docker | default(true)

    - name: Set up Portainer Agent
      block:
        - name: Create portainer directory
          file:
            path: /opt/portainer
            state: directory
            mode: '0755'

        - name: Create Portainer Agent docker-compose file
          copy:
            content: |
              version: '3.8'
              services:
                portainer-agent:
                  image: portainer/agent:2.21.1
                  container_name: portainer-agent
                  restart: unless-stopped
                  ports:
                    - "9001:9001"
                  volumes:
                    - /var/run/docker.sock:/var/run/docker.sock
                    - /var/lib/docker/volumes:/var/lib/docker/volumes
                  environment:
                    - AGENT_CLUSTER_ADDR=tasks.agent
                  networks:
                    - portainer-agent
                  logging:
                    driver: "json-file"
                    options:
                      max-size: "10m"
                      max-file: "3"

              networks:
                portainer-agent:
                  external: false
            dest: /opt/portainer/docker-compose.yml
            mode: '0644'

        - name: Create Portainer Agent init script
          copy:
            content: |
              #!/sbin/openrc-run
              # Portainer Agent OpenRC service

              name="portainer-agent"
              description="Portainer Agent"

              command="/usr/local/bin/docker-compose"
              command_args="up -d"
              command_background="yes"
              pidfile="/run/${RC_SVCNAME}.pid"

              directory="/opt/portainer"

              depend() {
                  need docker
                  after docker
              }

              start_pre() {
                  cd ${directory}
              }

              stop() {
                  cd ${directory}
                  ${command} down
              }
            dest: /etc/init.d/portainer-agent
            mode: '0755'

        - name: Add Portainer Agent to default runlevel (but don't start in template)
          shell: rc-update add portainer-agent default
          changed_when: true

        - name: Create Portainer Agent management script
          copy:
            content: |
              #!/bin/ash
              # Portainer Agent management script

              case "$1" in
                start)
                  echo "Starting Portainer Agent..."
                  rc-service portainer-agent start
                  ;;
                stop)
                  echo "Stopping Portainer Agent..."
                  rc-service portainer-agent stop
                  ;;
                restart)
                  echo "Restarting Portainer Agent..."
                  rc-service portainer-agent restart
                  ;;
                status)
                  rc-service portainer-agent status
                  echo ""
                  docker ps | grep portainer-agent
                  ;;
                logs)
                  docker logs portainer-agent
                  ;;
                *)
                  echo "Usage: $0 {start|stop|restart|status|logs}"
                  exit 1
                  ;;
              esac
            dest: /usr/local/bin/portainer-agent
            mode: '0755'

      when: install_docker | default(true)

    - name: Clean up for template creation
      block:
        - name: Clear package cache
          changed_when: true
          shell: |
            apk cache clean
            rm -rf /var/cache/apk/*
            rm -rf /tmp/*
            rm -rf /var/tmp/*

        - name: Clear bash/ash history
          changed_when: true
          shell: |
            history -c 2>/dev/null || true
            rm -f /root/.ash_history /home/*/.ash_history /home/*/.bash_history
          failed_when: false

        - name: Clear log files
          changed_when: true
          shell: |
            find /var/log -type f -name "*.log" -exec truncate -s 0 {} \;
            rm -rf /tmp/*
            rm -rf /var/tmp/*
          failed_when: false

        - name: Clear SSH host keys (will be regenerated on first boot)
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/ssh/ssh_host_rsa_key
            - /etc/ssh/ssh_host_rsa_key.pub
            - /etc/ssh/ssh_host_ecdsa_key
            - /etc/ssh/ssh_host_ecdsa_key.pub
            - /etc/ssh/ssh_host_ed25519_key
            - /etc/ssh/ssh_host_ed25519_key.pub

- name: Convert container to template
  hosts: proxmox
  become: yes
  vars:
    template_id: "{{ lxc_template_id | default(901) }}"

  tasks:
    - name: Stop the container
      shell: pct stop {{ template_id }}
      failed_when: false # Don't fail if already stopped
      changed_when: true

    - name: Convert container to template
      shell: pct template {{ template_id }}
      changed_when: true

    # ---------------------------------------------------------------------------
    # Packaging: make a linked clone -> strip NIC -> vzdump -> rename -> cleanup
    # ---------------------------------------------------------------------------
    - name: Ensure dump directory exists
      file:
        path: "{{ lxc_dumpdir | default('/var/lib/vz/template/cache') }}"
        state: directory
        mode: '0755'

    - name: Create linked clone from template {{ template_id }} -> {{ lxc_clone_id | default(801) }}
      command: "pct clone {{ template_id }} {{ lxc_clone_id | default(801) }} --hostname {{ lxc_clone_hostname | default('alpine-template-clone') }} --full 0"
      args:
        creates: "/etc/pve/lxc/{{ lxc_clone_id | default(801) }}.conf"

    - name: "Remove net0 from clone (pct set -delete)"
      command: "pct set {{ lxc_clone_id | default(801) }} -delete net0"
      register: del_net
      changed_when: del_net.rc == 0
      failed_when: false

    - name: "Fallback remove net0 by setting none"
      command: "pct set {{ lxc_clone_id | default(801) }} -net0 none"
      when: del_net.rc != 0
      register: del_net_fallback
      changed_when: del_net_fallback.rc == 0
      failed_when: false

    - name: Run vzdump to produce gzipped template archive
      command: "vzdump {{ lxc_clone_id | default(801) }} --mode {{ lxc_vzdump_mode | default('stop') }} --compress {{ lxc_vzdump_compress | default('gzip') }} --dumpdir {{ lxc_dumpdir | default('/var/lib/vz/template/cache') }}"
      register: vzdump_run
      changed_when: true

    - name: Combine stdout/stderr for parsing
      set_fact:
        vzdump_output: "{{ (vzdump_run.stdout | default('')) ~ '\n' ~ (vzdump_run.stderr | default('')) }}"

    - name: Split vzdump output into lines
      set_fact:
        vzdump_lines: "{{ vzdump_output.splitlines() }}"

    - name: Pick the line that announces the archive path
      set_fact:
        vzdump_line: "{{ (vzdump_lines | select('search', 'creating vzdump archive ') | list | first) | default('') }}"

    - name: Extract archive path from the selected line
      set_fact:
        vzdump_archive_path: "{{ vzdump_line | regex_replace(\".*creating vzdump archive '\", '') | regex_replace(\"'.*\", '') }}"

    - name: Fail if vzdump archive path could not be parsed
      fail:
        msg: "Could not parse vzdump archive path from output:\n{{ vzdump_run.stdout }}{{ '\n' if vzdump_run.stderr else '' }}{{ vzdump_run.stderr | default('') }}"
      when: vzdump_archive_path | length == 0

    - name: Stat final template path
      stat:
        path: "{{ lxc_dumpdir | default('/var/lib/vz/template/cache') }}/{{ lxc_final_template_filename | default('alpine-docker-template.tar.gz') }}"
      register: final_tmpl_stat

    - name: Backup existing destination if present
      shell: |
        ts=$(date +%Y%m%d-%H%M%S)
        mv "{{ lxc_dumpdir | default('/var/lib/vz/template/cache') }}/{{ lxc_final_template_filename | default('alpine-docker-template.tar.gz') }}" "{{ lxc_dumpdir | default('/var/lib/vz/template/cache') }}/{{ lxc_final_template_filename | default('alpine-docker-template.tar.gz') }}.bak.$ts"
      args:
        warn: false
      when: final_tmpl_stat.stat.exists
      changed_when: true

    - name: Rename vzdump tarball to final template name
      command: "mv {{ vzdump_archive_path }} {{ lxc_dumpdir | default('/var/lib/vz/template/cache') }}/{{ lxc_final_template_filename | default('alpine-docker-template.tar.gz') }}"
      changed_when: true

    - name: Ensure final template archive has sane perms
      file:
        path: "{{ lxc_dumpdir | default('/var/lib/vz/template/cache') }}/{{ lxc_final_template_filename | default('alpine-docker-template.tar.gz') }}"
        mode: '0644'

    - name: Destroy linked clone {{ lxc_clone_id | default(801) }}
      command: "pct destroy {{ lxc_clone_id | default(801) }} --purge 1"
      register: destroy_clone
      failed_when: destroy_clone.rc not in [0,2]
      changed_when: destroy_clone.rc == 0

    - name: Destroy template {{ template_id }}
      command: "pct destroy {{ template_id }} --purge 1"
      register: destroy_tpl
      failed_when: destroy_tpl.rc not in [0,2]
      changed_when: destroy_tpl.rc == 0

    - name: Display packaging result
      debug:
        msg: |
          Alpine template packaged successfully.
          -> {{ lxc_dumpdir | default('/var/lib/vz/template/cache') }}/{{ lxc_final_template_filename | default('alpine-docker-template.tar.gz') }}

          Key differences from Debian template:
          - Uses apk package manager instead of apt
          - Uses OpenRC instead of systemd
          - Uses ash shell by default (bash is also installed)
          - Smaller resource footprint
