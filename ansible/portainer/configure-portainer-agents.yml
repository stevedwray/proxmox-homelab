---
- name: Configure Portainer Agent (bind on container iface, not host IP)
  hosts: portainer_agents
  become: true
  vars:
    compose_dir: "/opt/portainer"
    compose_path: "/opt/portainer/docker-compose.yml"
    agent_service_unit: "portainer-agent.service"
    agent_image: "portainer/agent:latest"
    agent_port: 9001
    domain: "gibbsgreatly.xyz"
    agent_fqdn: "{{ hostvars[inventory_hostname].agent_fqdn | default(inventory_hostname ~ '.' ~ domain) }}"
  tasks:
    - name: Ensure compose dir exists
      ansible.builtin.file:
        path: "{{ compose_dir }}"
        state: directory
        mode: '0755'

    - name: Write docker-compose.yml (NO AGENT_HOST)
      ansible.builtin.copy:
        dest: "{{ compose_path }}"
        mode: '0644'
        content: |
          version: "3.8"
          services:
            portainer-agent:
              image: {{ agent_image }}
              container_name: portainer-agent
              hostname: {{ agent_fqdn }}
              restart: unless-stopped
              ports:
                - "{{ agent_port }}:{{ agent_port }}"
              volumes:
                - /var/run/docker.sock:/var/run/docker.sock
                - /var/lib/docker/volumes:/var/lib/docker/volumes

    - name: Validate compose
      ansible.builtin.command:
        cmd: docker compose -f "{{ compose_path }}" config -q
        chdir: "{{ compose_dir }}"
      register: compose_validate
      changed_when: false

    - name: Fail if compose invalid
      ansible.builtin.fail:
        msg: "docker compose config failed: {{ compose_validate.stderr | default(compose_validate.stdout) }}"
      when: compose_validate.rc != 0

    - name: Restart Portainer Agent
      ansible.builtin.systemd:
        name: "{{ agent_service_unit }}"
        state: restarted
        enabled: true
        daemon_reload: true

    - name: Wait for Agent HTTPS ping (self-signed OK)
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:{{ agent_port }}/ping"
        method: GET
        status_code: 204
        validate_certs: no
        return_content: no
        timeout: 10
      register: ping
      retries: 15
      delay: 2
      until: ping.status == 204
