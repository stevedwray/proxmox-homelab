# File: ansible/sock-shop/deploy-multi-container.yml
# Deploy multi-container Sock Shop stack (frontend, database, user service)
---
- name: Deploy Sock Shop Multi-Container Stack
  hosts: sock_shop_containers
  become: yes
  serial: 1

  tasks:
    - name: Wait for all containers to be ready
      wait_for_connection:
        timeout: 300

    - name: Regenerate SSH host keys if missing
      shell: ssh-keygen -A
      args:
        creates: /etc/ssh/ssh_host_rsa_key

    - name: Restart SSH service
      systemd:
        name: ssh
        state: restarted

    - name: Ensure Docker is running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create sock-shop Docker network
      docker_network:
        name: sock-shop
        driver: bridge

- name: Deploy Database Services
  hosts: sock_shop_database
  become: yes

  tasks:
    - name: Deploy MongoDB for catalogue
      docker_container:
        name: catalogue-db
        image: mongo:4.4
        state: started
        restart_policy: unless-stopped
        networks:
          - name: sock-shop
        volumes:
          - /data/sock-shop/catalogue-db:/data/db

    - name: Deploy MySQL for user service
      docker_container:
        name: user-db
        image: weaveworksdemos/user-db:0.3.0
        state: started
        restart_policy: unless-stopped
        networks:
          - name: sock-shop
        env:
          MYSQL_ROOT_PASSWORD: fake_password
          MYSQL_DATABASE: socksdb

    - name: Deploy Redis for session store
      docker_container:
        name: session-db
        image: redis:alpine
        state: started
        restart_policy: unless-stopped
        networks:
          - name: sock-shop

- name: Deploy User Service
  hosts: sock_shop_user
  become: yes

  tasks:
    - name: Deploy User service
      docker_container:
        name: user
        image: weaveworksdemos/user:0.4.7
        state: started
        restart_policy: unless-stopped
        networks:
          - name: sock-shop
        env:
          DATABASE_URL: "mysql://root:fake_password@192.168.1.61:3306/socksdb"

- name: Deploy Frontend and Catalogue
  hosts: sock_shop_frontend
  become: yes

  tasks:
    - name: Deploy Catalogue service
      docker_container:
        name: catalogue
        image: weaveworksdemos/catalogue:0.3.5
        state: started
        restart_policy: unless-stopped
        networks:
          - name: sock-shop
        env:
          DATABASE_URL: "mongodb://192.168.1.61:27017/catalogue"

    - name: Deploy Sock Shop Frontend
      docker_container:
        name: front-end
        image: weaveworksdemos/front-end:0.3.12
        state: started
        restart_policy: unless-stopped
        ports:
          - "80:8079"
        networks:
          - name: sock-shop
        env:
          SESSION_REDIS: "192.168.1.61:6379"
          CATALOGUE_ENDPOINT: "catalogue:80"
          USER_ENDPOINT: "192.168.1.62:80"
          CART_ENDPOINT: "carts:80"
          ORDERS_ENDPOINT: "orders:80"
        extra_hosts:
          - "user:192.168.1.62"
          - "catalogue-db:192.168.1.61"
          - "user-db:192.168.1.61"
          - "session-db:192.168.1.61"

    - name: Display deployment status
      debug:
        msg: |
          Multi-container Sock Shop deployed successfully!
          Access URL: http://192.168.1.60
          Database: 192.168.1.61
          User Service: 192.168.1.62
