# File: ansible/sock-shop/deploy-frontend.yml
# Deploy Sock Shop Frontend for initial testing
---
- name: Deploy Sock Shop Frontend
  hosts: sock_shop_frontend
  become: yes
  vars:
    docker_network_name: "sock-shop"

  tasks:
    - name: Wait for container to be ready
      wait_for_connection:
        timeout: 300

    - name: Regenerate SSH host keys if missing
      shell: ssh-keygen -A
      args:
        creates: /etc/ssh/ssh_host_rsa_key

    - name: Restart SSH service
      systemd:
        name: ssh
        state: restarted

    - name: Ensure Docker is running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create sock-shop Docker network
      docker_network:
        name: "{{ docker_network_name }}"
        driver: bridge

    - name: Create application directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /data/sock-shop
        - /config/sock-shop
        - /logs/sock-shop

    - name: Deploy Sock Shop Frontend container
      docker_container:
        name: front-end
        image: weaveworksdemos/front-end:0.3.12
        state: started
        restart_policy: unless-stopped
        ports:
          - "80:8079"
        networks:
          - name: "{{ docker_network_name }}"
        env:
          SESSION_REDIS: "session-db:6379"
          CATALOGUE_ENDPOINT: "catalogue:80"
          USER_ENDPOINT: "user:80"
          CART_ENDPOINT: "carts:80"
          ORDERS_ENDPOINT: "orders:80"
        log_driver: json-file
        log_options:
          max-size: "10m"
          max-file: "3"

    - name: Deploy mock catalogue service
      docker_container:
        name: catalogue
        image: weaveworksdemos/catalogue:0.3.5
        state: started
        restart_policy: unless-stopped
        networks:
          - name: "{{ docker_network_name }}"
        env:
          ZIPKIN: "zipkin:9411"
        log_driver: json-file
        log_options:
          max-size: "10m"
          max-file: "3"

    - name: Display deployment status
      debug:
        msg: |
          Sock Shop Frontend deployed successfully!
          Access URL: http://192.168.1.60
          Container Status: Use 'container-info' script to check services
