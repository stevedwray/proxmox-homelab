# File: ansible/sock-shop/deploy-complete.yml
# Deploy complete Sock Shop microservices stack
---
- name: Initialize all containers
  hosts: sock_shop_containers
  become: yes
  serial: 3

  tasks:
    - name: Wait for container readiness
      wait_for_connection:
        timeout: 300

    - name: Regenerate SSH host keys
      shell: ssh-keygen -A
      args:
        creates: /etc/ssh/ssh_host_rsa_key

    - name: Restart SSH service
      systemd:
        name: ssh
        state: restarted

    - name: Ensure Docker is running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create sock-shop network
      docker_network:
        name: sock-shop
        driver: bridge

    - name: Create application directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /data/sock-shop
        - /config/sock-shop
        - /logs/sock-shop

- name: Deploy Database Layer
  hosts: sock_shop_database
  become: yes

  tasks:
    - name: Deploy MongoDB for catalogue
      docker_container:
        name: catalogue-db
        image: mongo:4.4
        state: started
        restart_policy: unless-stopped
        networks:
          - name: sock-shop
        volumes:
          - /data/sock-shop/catalogue-db:/data/db

    - name: Deploy MySQL for users
      docker_container:
        name: user-db
        image: weaveworksdemos/user-db:0.3.0
        state: started
        restart_policy: unless-stopped
        networks:
          - name: sock-shop
        env:
          MYSQL_ROOT_PASSWORD: fake_password
          MYSQL_DATABASE: socksdb

    - name: Deploy MongoDB for orders
      docker_container:
        name: orders-db
        image: mongo:4.4
        state: started
        restart_policy: unless-stopped
        networks:
          - name: sock-shop
        volumes:
          - /data/sock-shop/orders-db:/data/db

    - name: Deploy Redis for session store
      docker_container:
        name: session-db
        image: redis:alpine
        state: started
        restart_policy: unless-stopped
        networks:
          - name: sock-shop

    - name: Deploy RabbitMQ for messaging
      docker_container:
        name: queue-master
        image: rabbitmq:3.8-management
        state: started
        restart_policy: unless-stopped
        networks:
          - name: sock-shop
        ports:
          - "15672:15672"  # Management UI
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: admin

- name: Deploy Core Services
  hosts: "sock_shop_user:sock_shop_catalogue:sock_shop_carts:sock_shop_orders"
  become: yes
  serial: 1

  tasks:
    - name: Deploy User service
      docker_container:
        name: user
        image: weaveworksdemos/user:0.4.7
        state: started
        restart_policy: unless-stopped
        networks:
          - name: sock-shop
        env:
          DATABASE_URL: "mysql://root:fake_password@192.168.1.67:3306/socksdb"
      when: inventory_hostname == 'sock_shop_user'

    - name: Deploy Catalogue service
      docker_container:
        name: catalogue
        image: weaveworksdemos/catalogue:0.3.5
        state: started
        restart_policy: unless-stopped
        networks:
          - name: sock-shop
        env:
          DATABASE_URL: "mongodb://192.168.1.67:27017/catalogue"
      when: inventory_hostname == 'sock_shop_catalogue'

    - name: Deploy Carts service
      docker_container:
        name: carts
        image: weaveworksdemos/carts:0.4.8
        state: started
        restart_policy: unless-stopped
        networks:
          - name: sock-shop
        env:
          DATABASE_URL: "mongodb://192.168.1.67:27017/carts"
      when: inventory_hostname == 'sock_shop_carts'

    - name: Deploy Orders service
      docker_container:
        name: orders
        image: weaveworksdemos/orders:0.4.7
        state: started
        restart_policy: unless-stopped
        networks:
          - name: sock-shop
        env:
          DATABASE_URL: "mongodb://192.168.1.67:27017/orders"
      when: inventory_hostname == 'sock_shop_orders'

- name: Deploy Support Services
  hosts: "sock_shop_payment:sock_shop_shipping"
  become: yes

  tasks:
    - name: Deploy Payment service
      docker_container:
        name: payment
        image: weaveworksdemos/payment:0.4.3
        state: started
        restart_policy: unless-stopped
        networks:
          - name: sock-shop
      when: inventory_hostname == 'sock_shop_payment'

    - name: Deploy Shipping service
      docker_container:
        name: shipping
        image: weaveworksdemos/shipping:0.4.8
        state: started
        restart_policy: unless-stopped
        networks:
          - name: sock-shop
        env:
          QUEUE_URI: "amqp://admin:admin@192.168.1.67:5672/"
      when: inventory_hostname == 'sock_shop_shipping'

- name: Deploy Frontend
  hosts: sock_shop_frontend
  become: yes

  tasks:
    - name: Deploy Sock Shop Frontend
      docker_container:
        name: front-end
        image: weaveworksdemos/front-end:0.3.12
        state: started
        restart_policy: unless-stopped
        ports:
          - "80:8079"
        networks:
          - name: sock-shop
        env:
          SESSION_REDIS: "192.168.1.67:6379"
          CATALOGUE_ENDPOINT: "192.168.1.62:80"
          USER_ENDPOINT: "192.168.1.61:80"
          CART_ENDPOINT: "192.168.1.63:80"
          ORDERS_ENDPOINT: "192.168.1.64:80"
          PAYMENT_ENDPOINT: "192.168.1.65:80"
          SHIPPING_ENDPOINT: "192.168.1.66:80"

- name: Verify Deployment
  hosts: sock_shop_containers
  become: yes

  tasks:
    - name: Check Docker container status
      command: docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
      register: docker_status

    - name: Display container status
      debug:
        var: docker_status.stdout_lines

    - name: Display deployment summary
      debug:
        msg: |
          Sock Shop microservices deployment complete!
          Frontend: http://192.168.1.60
          RabbitMQ Management: http://192.168.1.67:15672 (admin/admin)
          All services should be running and connected.
      when: inventory_hostname == 'sock_shop_frontend'
