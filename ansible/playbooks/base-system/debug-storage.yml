---
# FILE: debug-storage.yml
# Quick debug playbook to check partition and variable status

- name: Debug storage configuration
  hosts: proxmox_testbed
  become: true
  gather_facts: true

  tasks:
    - name: Check partition table
      command: parted /dev/sda print
      register: partition_check
      changed_when: false

    - name: Show partition table
      debug:
        var: partition_check.stdout_lines

    - name: Check hot_storage variable
      debug:
        var: hot_storage

    - name: Check if partition 4 exists
      debug:
        msg: "Partition 4 check: '4' in partition output = {{ '4' in partition_check.stdout }}"

    - name: Check devices properly
      shell: ls -la /dev/sda[0-9]* 2>/dev/null || echo "No numbered partitions found"
      register: sda_devices
      changed_when: false

    - name: Show sda devices
      debug:
        var: sda_devices.stdout_lines

    - name: Test partition creation condition (fixed logic)
      debug:
        msg: 
          - "hot_storage.enabled: {{ hot_storage.enabled | default('NOT DEFINED') }}"
          - "Partition 4 exists: {{ ' 4 ' in partition_check.stdout }}"
          - "Should create partition: {{ hot_storage.enabled | default(false) and (' 4 ' not in partition_check.stdout) }}"
