---
# File: ansible/01-base-system/build-debian-template.yml
# Purpose: Build a Proxmox-compatible Debian 12 LXC template (.tar.zst) the “Proxmox way”
# Scope: only runs on host named `pvetest` (ensure inventory has that exact hostname)

- name: Build Debian Proxmox LXC template (tarball style, built-ins only)
  hosts: pvetest
  become: true

  vars:
    debian_release: bookworm                # Debian 12
    template_workdir: /tmp/debian-12-base
    rootfs: "{{ template_workdir }}/rootfs"
    template_cache: /var/lib/vz/template/cache
    template_name: debian-12-base_ansible_amd64.tar.zst

  environment:
    DEBIAN_FRONTEND: noninteractive

  tasks:
    - name: Ensure build dependencies are installed
      ansible.builtin.apt:
        name:
          - debootstrap
          - rsync
          - gnupg
          - zstd
        state: present
        update_cache: true

    - name: Create working directory
      ansible.builtin.file:
        path: "{{ rootfs }}"
        state: directory
        mode: '0755'

    - name: Bootstrap Debian {{ debian_release }} into rootfs
      ansible.builtin.command: >
        debootstrap --arch=amd64 {{ debian_release }} {{ rootfs }} http://deb.debian.org/debian
      args:
        creates: "{{ rootfs }}/bin/sh"

    - name: Configure apt sources.list
      ansible.builtin.copy:
        dest: "{{ rootfs }}/etc/apt/sources.list"
        mode: '0644'
        content: |
          deb http://deb.debian.org/debian {{ debian_release }} main contrib non-free non-free-firmware
          deb http://security.debian.org/debian-security {{ debian_release }}-security main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian {{ debian_release }}-updates main contrib non-free non-free-firmware

    - name: Copy resolver into chroot (for apt)
      ansible.builtin.copy:
        src: /etc/resolv.conf
        dest: "{{ rootfs }}/etc/resolv.conf"
        remote_src: true
        mode: '0644'

    - name: Ensure chroot mount points exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      loop:
        - "{{ rootfs }}/proc"
        - "{{ rootfs }}/sys"
        - "{{ rootfs }}/dev"
        - "{{ rootfs }}/dev/pts"

    - name: Prepare, provision, and clean rootfs
      block:
        - name: Bind-mount /proc, /sys, /dev, /dev/pts
          ansible.builtin.command: "{{ item }}"
          loop:
            - "mount --bind /proc {{ rootfs }}/proc"
            - "mount --bind /sys {{ rootfs }}/sys"
            - "mount --bind /dev {{ rootfs }}/dev"
            - "mount --bind /dev/pts {{ rootfs }}/dev/pts"

        - name: apt-get update inside chroot
          ansible.builtin.command: >
            chroot {{ rootfs }} /usr/bin/env bash -lc "apt-get update"
          register: chroot_update
          changed_when: "'Get:' in chroot_update.stdout or chroot_update.rc == 0"

        - name: Install baseline packages inside chroot
          ansible.builtin.command: >
            chroot {{ rootfs }} /usr/bin/env bash -lc
            "apt-get -y install
             systemd-sysv apt-utils iproute2 iputils-ping net-tools
             openssh-server sudo ca-certificates curl gnupg locales tzdata &&
             locale-gen en_US.UTF-8 || true &&
             systemctl mask apt-daily.service apt-daily-upgrade.service || true"
          register: chroot_install
          changed_when: chroot_install.rc == 0

        - name: Clean apt caches, SSH host keys, tmp inside chroot
          ansible.builtin.command: >
            chroot {{ rootfs }} /usr/bin/env bash -lc
            "apt-get clean &&
             rm -rf /var/cache/apt/* /var/lib/apt/lists/* &&
             rm -f /etc/ssh/ssh_host_* &&
             rm -rf /tmp/* /var/tmp/*"
          changed_when: true

      always:
        - name: Unmount bind mounts (best-effort)
          ansible.builtin.command: "{{ item }}"
          loop:
            - "umount -l {{ rootfs }}/dev/pts"
            - "umount -l {{ rootfs }}/dev"
            - "umount -l {{ rootfs }}/proc"
            - "umount -l {{ rootfs }}/sys"
          ignore_errors: true

    - name: Create Proxmox LXC template archive
      ansible.builtin.command: >
        tar --numeric-owner --zstd
        -cf {{ template_cache }}/{{ template_name }}
        --transform='s,^,rootfs/,'
        -C {{ rootfs }} .
      args:
        creates: "{{ template_cache }}/{{ template_name }}"

    - name: Verify template exists
      ansible.builtin.stat:
        path: "{{ template_cache }}/{{ template_name }}"
      register: template_stat

    - name: Show result
      ansible.builtin.debug:
        msg: "Template archive created: {{ template_stat.stat.path }}"
