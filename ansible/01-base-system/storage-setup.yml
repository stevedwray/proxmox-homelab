---
# FILE: playbooks/base-system/storage-setup.yml
# Updated for LVM infrastructure storage on boot disk
# ZFS pools for dedicated storage drives

- name: Testbed storage configuration - LVM Infrastructure + ZFS Pools
  hosts: proxmox_testbed
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/proxmox.yml
    - ../group_vars/proxmox_testbed.yml

  pre_tasks:
    # =====================================
    # System validation and safety checks
    # =====================================
    - name: Validate target system hardware layout
      block:
        - name: Check boot device exists and is correct size
          stat:
            path: "{{ storage_devices.boot_device }}"
          register: boot_device_check
          failed_when: not boot_device_check.stat.exists

        - name: Get boot device size
          shell: "lsblk -bno SIZE {{ storage_devices.boot_device }} | head -1"
          register: boot_device_size
          
        - name: Validate boot device size (expecting ~100GB for testbed)
          assert:
            that: boot_device_size.stdout | int > 90000000000  # 90GB minimum
            fail_msg: "Boot device {{ storage_devices.boot_device }} is too small: {{ (boot_device_size.stdout | int / 1000000000) | round(1) }}GB"

        - name: Check if ZFS pools already exist or devices are clean
          shell: "zpool status {{ item.key }} 2>/dev/null && echo 'configured' || echo 'needs_setup'"
          register: pool_status
          loop: "{{ zfs_pools | dict2items }}"
          failed_when: false

        - name: Check device state for pools that need setup
          shell: "lsblk -no FSTYPE {{ item.item.value.device }} | grep -v '^$' | wc -l"
          register: device_usage
          loop: "{{ pool_status.results }}"
          when: item.stdout == 'needs_setup'
          failed_when: device_usage.stdout | int > 0

    - name: Check for running containers/VMs
      shell: "pct list 2>/dev/null | grep -c running || true"
      register: running_containers
      
    - name: Check for running VMs
      shell: "qm list 2>/dev/null | grep -c running || true"
      register: running_vms

    - name: Warn about active workloads
      pause:
        prompt: |
          WARNING: Found {{ running_containers.stdout }} running containers and {{ running_vms.stdout }} running VMs.
          Storage operations may disrupt running services.
          Press ENTER to continue or Ctrl+C to abort.
      when: (running_containers.stdout | int > 0) or (running_vms.stdout | int > 0)

    - name: Validate system is Proxmox
      stat:
        path: /etc/pve
      register: proxmox_check
      failed_when: not proxmox_check.stat.exists

    - name: Update package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages for storage management
      package:
        name: "{{ required_packages }}"
        state: present

    - name: Verify ZFS storage devices exist
      stat:
        path: "{{ item }}"
      loop:
        - "{{ storage_devices.security_device }}"
        - "{{ storage_devices.gaming_device }}"
        - "{{ storage_devices.monitoring_device }}"
      register: device_check

    - name: Verify required ZFS devices are available
      assert:
        that: device_check.results | selectattr('stat.exists') | list | length == 3
        fail_msg: "Not all required ZFS devices are available"

  tasks:
    # =====================================
    # LVM Infrastructure Storage (Boot disk)
    # =====================================

    - name: Get current LVM volume group info
      shell: "vgdisplay -c | grep -E '^[[:space:]]*[^:]+:' | head -1 | cut -d: -f1"
      register: vg_name_result
      failed_when: vg_name_result.stdout == ""
      
    - name: Set volume group name fact
      set_fact:
        volume_group: "{{ vg_name_result.stdout.strip() }}"

    - name: Check if infrastructure logical volume exists
      shell: "lvdisplay {{ volume_group }}/{{ infrastructure_storage.lv_name }} >/dev/null 2>&1 && echo 'exists' || echo 'missing'"
      register: infrastructure_lv_check
      changed_when: false

    - name: Get volume group free space
      shell: "vgdisplay {{ volume_group }} | grep 'Free' | awk '{print $7}' | sed 's/[<>]//g'"
      register: vg_free_space
      when: infrastructure_lv_check.stdout == 'missing'

    - name: Create infrastructure logical volume
      community.general.lvol:
        vg: "{{ volume_group }}"
        lv: "{{ infrastructure_storage.lv_name }}"
        size: "{{ infrastructure_storage.size }}"
        state: present
      when: infrastructure_lv_check.stdout == 'missing'

    - name: Check if infrastructure LV needs formatting
      command: "blkid -s TYPE -o value /dev/{{ volume_group }}/{{ infrastructure_storage.lv_name }}"
      register: infrastructure_fs_check
      changed_when: false
      failed_when: false

    - name: Format infrastructure logical volume
      filesystem:
        fstype: "{{ infrastructure_storage.filesystem }}"
        dev: "/dev/{{ volume_group }}/{{ infrastructure_storage.lv_name }}"
        opts: "-L {{ infrastructure_storage.filesystem_label }}"
      when: infrastructure_fs_check.rc != 0

    - name: Create infrastructure mount point
      file:
        path: "{{ infrastructure_storage.mount_point }}"
        state: directory
        mode: '0755'

    - name: Add infrastructure storage to fstab
      mount:
        path: "{{ infrastructure_storage.mount_point }}"
        src: "/dev/{{ volume_group }}/{{ infrastructure_storage.lv_name }}"
        fstype: "{{ infrastructure_storage.filesystem }}"
        opts: "{{ infrastructure_storage.mount_options }}"
        state: present

    - name: Mount infrastructure storage
      mount:
        path: "{{ infrastructure_storage.mount_point }}"
        src: "/dev/{{ volume_group }}/{{ infrastructure_storage.lv_name }}"
        fstype: "{{ infrastructure_storage.filesystem }}"
        opts: "{{ infrastructure_storage.mount_options }}"
        state: mounted

    # =====================================
    # Hot storage partition (NVMe-safe)
    # =====================================

    - name: Detect NVMe-style partition suffix
      set_fact:
        partition_suffix: "{{ 'p' if (storage_devices.boot_device | basename) is match('^nvme') else '' }}"

    - name: Read existing partition table
      community.general.parted:
        device: "{{ storage_devices.boot_device }}"
        unit: GiB
        state: info
      register: boot_parted

    - name: Determine if hot partition exists
      set_fact:
        hot_partition_path: "{{ storage_devices.boot_device }}{{ partition_suffix }}{{ hot_storage.partition_number }}"
        hot_partition_exists: "{{ (boot_parted.partitions | selectattr('num','equalto', hot_storage.partition_number | int) | list | length) > 0 }}"
      when: hot_storage.enabled | default(false)

    - name: Create hot storage partition
      community.general.parted:
        device: "{{ storage_devices.boot_device }}"
        number: "{{ hot_storage.partition_number }}"
        label: gpt
        name: hot-storage
        part_start: 43GiB
        part_end: 100%
        state: present
      when:
        - hot_storage.enabled | default(false)
        - not hot_partition_exists

    - name: Check if hot partition needs formatting
      command: "blkid -s LABEL -o value {{ hot_partition_path }}"
      register: hot_label_check
      changed_when: false
      failed_when: false
      when: hot_storage.enabled | default(false)

    - name: Format hot storage partition (if missing or wrong label)
      filesystem:
        fstype: ext4
        dev: "{{ hot_partition_path }}"
        opts: "-L {{ hot_storage.filesystem_label }}"
      when:
        - hot_storage.enabled | default(false)
        - hot_label_check.rc != 0 or hot_label_check.stdout != hot_storage.filesystem_label

    - name: Create hot storage mount point
      file:
        path: "{{ hot_storage.mount_point }}"
        state: directory
        mode: '0755'
      when: hot_storage.enabled | default(false)

    - name: Add hot storage to fstab
      mount:
        path: "{{ hot_storage.mount_point }}"
        src: "LABEL={{ hot_storage.filesystem_label }}"
        fstype: ext4
        opts: "{{ hot_storage.mount_options }}"
        state: present
      when: hot_storage.enabled | default(false)

    - name: Mount hot storage
      mount:
        path: "{{ hot_storage.mount_point }}"
        src: "LABEL={{ hot_storage.filesystem_label }}"
        fstype: ext4
        opts: "{{ hot_storage.mount_options }}"
        state: mounted
      when: hot_storage.enabled | default(false)

    # =====================================
    # ZFS pools (idempotent) - Dedicated drives only
    # =====================================

    - name: Check if ZFS pools exist
      shell: "zpool status {{ item.key }} 2>/dev/null && echo 'exists' || echo 'missing'"
      register: pool_existence_check
      loop: "{{ zfs_pools | dict2items }}"
      failed_when: false
      changed_when: false

    - name: Wipe filesystem signatures from devices (if pool missing)
      command: "wipefs -a {{ item.item.value.device }}"
      loop: "{{ pool_existence_check.results }}"
      when: 
        - item.stdout == 'missing'
        - item.item.value.enabled | default(true)

    - name: Create ZFS pools (only if missing)
      community.general.zpool:
        name: "{{ item.item.key }}"
        state: present
        vdevs:
          - disks:
              - "{{ item.item.value.device }}"
        pool_properties:
          ashift: "{{ item.item.value.properties.ashift }}"
          autotrim: "on"
      loop: "{{ pool_existence_check.results }}"
      when: 
        - item.stdout == 'missing'
        - item.item.value.enabled | default(true)

    # Handle existing pools - only set autotrim if not already on
    - name: Check current autotrim setting for existing pools
      shell: "zpool get -H -o value autotrim {{ item.item.key }}"
      loop: "{{ pool_existence_check.results }}"
      when: item.stdout == 'exists'
      register: current_autotrim
      changed_when: false

    - name: Enable autotrim on existing pools (if not already enabled)
      command: "zpool set autotrim=on {{ item.item.item.key }}"
      loop: "{{ current_autotrim.results }}"
      when: 
        - item is not skipped
        - item.stdout != "on"

    - name: Set ZFS pool root dataset properties
      community.general.zfs:
        name: "{{ item.key }}"
        state: present
        extra_zfs_properties:
          compression: "{{ item.value.properties.compression }}"
          atime: "{{ item.value.properties.atime }}"
          xattr: "sa"
          acltype: "posix"
      loop: "{{ zfs_pools | dict2items }}"
      when: item.value.enabled | default(true)

    # =====================================
    # ZFS datasets with workload-specific tuning
    # =====================================

    - name: Create Security datasets
      community.general.zfs:
        name: "{{ item.name }}"
        state: present
        extra_zfs_properties: "{{ item.properties }}"
      loop: "{{ security_datasets }}"

    - name: Create Gaming datasets
      community.general.zfs:
        name: "{{ item.name }}"
        state: present
        extra_zfs_properties: "{{ item.properties }}"
      loop: "{{ gaming_datasets }}"

    - name: Create Monitoring datasets
      community.general.zfs:
        name: "{{ item.name }}"
        state: present
        extra_zfs_properties: "{{ item.properties }}"
      loop: "{{ monitoring_datasets }}"

    # =====================================
    # Infrastructure directories (LVM mount)
    # =====================================

    - name: Create infrastructure storage directories
      file:
        path: "{{ infrastructure_storage.mount_point }}/{{ item }}"
        state: directory
        mode: '0755'
      loop: "{{ infrastructure_directories }}"

    # =====================================
    # Hot storage directories
    # =====================================

    - name: Create hot storage directories
      file:
        path: "{{ hot_storage.mount_point }}/{{ item }}"
        state: directory
        mode: '0755'
      loop: "{{ hot_storage_directories }}"
      when: hot_storage.enabled | default(false)

    # =====================================
    # Proxmox storage configuration (Mixed ZFS + Directory)
    # =====================================

    - name: Configure Proxmox ZFS storage pools
      blockinfile:
        path: /etc/pve/storage.cfg
        marker: "# {mark} ANSIBLE MANAGED ZFS STORAGE POOLS"
        block: |
          {% for storage in proxmox_zfs_storage %}
          {% if storage.enabled | default(true) %}
          # {{ storage.description | default(storage.name) }}
          zfspool: {{ storage.name }}
                  pool {{ storage.pool }}
                  content {{ storage.content | join(',') }}
                  nodes {{ storage.nodes | default([ansible_hostname]) | join(',') }}
          {% if storage.sparse is defined %}
                  sparse {{ storage.sparse | ternary('1', '0') }}
          {% endif %}
          {% if storage.krbd is defined %}
                  krbd {{ storage.krbd | ternary('1', '0') }}
          {% endif %}
          {% if storage.preallocation is defined %}
                  preallocation {{ storage.preallocation }}
          {% endif %}
          {% if storage.blocksize is defined %}
                  blocksize {{ storage.blocksize }}
          {% endif %}
          {% if storage.maxfiles is defined %}
                  maxfiles {{ storage.maxfiles }}
          {% endif %}

          {% endif %}
          {% endfor %}

    - name: Configure Proxmox directory storage
      blockinfile:
        path: /etc/pve/storage.cfg
        marker: "# {mark} ANSIBLE MANAGED DIRECTORY STORAGE"
        block: |
          {% for storage in proxmox_directory_storage %}
          {% if storage.enabled | default(true) %}
          # {{ storage.description | default(storage.name) }}
          dir: {{ storage.name }}
                  path {{ storage.path }}
                  content {{ storage.content | join(',') }}
                  nodes {{ storage.nodes | default([ansible_hostname]) | join(',') }}
          {% if storage.shared is defined %}
                  shared {{ storage.shared | ternary('1', '0') }}
          {% endif %}
          {% if storage.maxfiles is defined %}
                  maxfiles {{ storage.maxfiles }}
          {% endif %}
          {% if storage.preallocate is defined %}
                  preallocate {{ storage.preallocate | ternary('1', '0') }}
          {% endif %}
          {% if storage.format is defined %}
                  format {{ storage.format }}
          {% endif %}

          {% endif %}
          {% endfor %}

    - name: Configure Proxmox NFS storage
      blockinfile:
        path: /etc/pve/storage.cfg
        marker: "# {mark} ANSIBLE MANAGED NFS STORAGE"
        block: |
          {% for storage in proxmox_nfs_storage | default([]) %}
          {% if storage.enabled | default(true) %}
          # {{ storage.description | default(storage.name) }}
          nfs: {{ storage.name }}
                  server {{ storage.server }}
                  export {{ storage.export }}
                  content {{ storage.content | join(',') }}
                  nodes {{ storage.nodes | default([ansible_hostname]) | join(',') }}
          {% if storage.options is defined %}
                  options {{ storage.options }}
          {% endif %}
          {% if storage.maxfiles is defined %}
                  maxfiles {{ storage.maxfiles }}
          {% endif %}

          {% endif %}
          {% endfor %}

    - name: Configure Proxmox CIFS storage  
      blockinfile:
        path: /etc/pve/storage.cfg
        marker: "# {mark} ANSIBLE MANAGED CIFS STORAGE"
        block: |
          {% for storage in proxmox_cifs_storage | default([]) %}
          {% if storage.enabled | default(true) %}
          # {{ storage.description | default(storage.name) }}
          cifs: {{ storage.name }}
                  server {{ storage.server }}
                  share {{ storage.share }}
                  content {{ storage.content | join(',') }}
                  nodes {{ storage.nodes | default([ansible_hostname]) | join(',') }}
          {% if storage.username is defined %}
                  username {{ storage.username }}
          {% endif %}
          {% if storage.password is defined %}
                  password {{ storage.password }}
          {% endif %}
          {% if storage.domain is defined %}
                  domain {{ storage.domain }}
          {% endif %}
          {% if storage.options is defined %}
                  options {{ storage.options }}
          {% endif %}
          {% if storage.maxfiles is defined %}
                  maxfiles {{ storage.maxfiles }}
          {% endif %}

          {% endif %}
          {% endfor %}

  post_tasks:
    - name: Analyze configuration state for summary
      set_fact:
        pools_existed: "{{ pool_status.results | selectattr('stdout', 'match', '.*configured$') | list | length }}"
        total_pools: "{{ zfs_pools | length }}"
        hot_partition_existed: "{{ hot_partition_exists | default(false) }}"
        infrastructure_lv_existed: "{{ infrastructure_lv_check.stdout == 'exists' }}"
        changes_made: "{{ ansible_play_batch | length > 0 and (ansible_play_recap[inventory_hostname].changed | default(0)) > 5 }}"

    - name: Display configuration state summary
      debug:
        msg:
          - "=== STORAGE CONFIGURATION ANALYSIS ==="
          - "System validation: PASSED"
          - "ZFS pools found: {{ pools_existed }}/{{ total_pools }} already configured"
          - "Hot storage partition: {{ 'EXISTS' if hot_partition_existed else 'CREATED' }}"
          - "Infrastructure LV: {{ 'EXISTS' if infrastructure_lv_existed else 'CREATED' }}"
          - "Configuration state: {{ 'MAINTAINED (no changes needed)' if not changes_made else 'UPDATED (changes applied)' }}"
          - ""
          - "=== STORAGE LAYOUT ==="
          - "Boot disk (/dev/sda):"
          - "  - LVM: {{ volume_group }}/{{ infrastructure_storage.lv_name }} → {{ infrastructure_storage.mount_point }}"
          - "  - Hot storage: {{ hot_storage.mount_point }} ({{ 'active' if hot_storage.enabled else 'disabled' }})"
          - "ZFS Pools:"
          - "  - {{ zfs_pools.keys() | list | join(', ') }}"
          - ""
          - "=== PROXMOX STORAGE ==="
          - "Infrastructure: {{ infrastructure_storage.mount_point }} (directory storage)"
          - "ZFS pools: {{ zfs_pools.keys() | list | join('-containers, ') }}-containers"
          - ""
          - "=== SYSTEM STATUS ==="
          - "Storage automation: COMPLETED SUCCESSFULLY"
          - "System ready for: {{ 'continued operation' if not changes_made else 'tiered application deployment' }}"
          - ""
          - "Next steps:"
          - "  - Deploy infrastructure containers: Use infrastructure-storage"
          - "  - Deploy workload containers: Use *-containers storage"
          - "  - Verify pools: zpool status"
          - "  - Check mounts: df -h"
          - "  - View Proxmox storage: pvesm status"
