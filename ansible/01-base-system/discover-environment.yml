---
# Use this to discover settings for new Proxmox environments
- name: Discover Proxmox environment settings
  hosts: "{{ target_host | default('proxmox') }}"
  become: yes
  tasks:
    - name: Get storage information
      shell: pvesm status
      register: storage_info

    - name: Get network bridges
      shell: ip link show type bridge
      register: bridge_info

    - name: Get network configuration
      shell: ip route show default
      register: default_route

    - name: Check available container IDs
      shell: pct list | awk '{print $1}' | grep -E '^[0-9]+$' | sort -n | tail -5
      register: used_ids
      failed_when: false

    - name: Display environment configuration template
      debug:
        msg: |

          === PROXMOX ENVIRONMENT DISCOVERY ===

          Available Storage:
          {{ storage_info.stdout }}

          Network Bridges:
          {{ bridge_info.stdout }}

          Default Route:
          {{ default_route.stdout }}

          Recently Used Container IDs:
          {{ used_ids.stdout }}

          === SUGGESTED host_vars/{{ inventory_hostname }}.yml ===
          ---
          # Storage (choose one that supports containers)
          {% for line in storage_info.stdout_lines[1:] %}
          {% set storage_name = line.split()[0] %}
          {% set storage_type = line.split()[1] %}
          {% if storage_type in ['zfspool', 'lvm', 'lvmthin', 'dir'] %}
          # lxc_storage_pool: "{{ storage_name }}"  # {{ storage_type }}
          {% endif %}
          {% endfor %}

          # Network (usually vmbr0)
          {% for line in bridge_info.stdout_lines %}
          {% if 'vmbr' in line %}
          # lxc_network_bridge: "{{ line.split()[1].rstrip(':') }}"
          {% endif %}
          {% endfor %}

          # Update these with your actual network settings:
          # lxc_gateway_ip: "YOUR_GATEWAY_IP"
          # lxc_template_ip: "AVAILABLE_IP_FOR_TEMPLATE"

          # Template ID (use an unused high number)
          # lxc_template_id: 900
