# FILE: ansible/01-base-system/base-config.yml
# Purpose: Proxmox base networking + IPv6 (SLAAC) setup right after initial install.
# - Fixes repository configuration (removes enterprise repos, adds no-subscription repos)
# - Installs ifupdown2 so we can reload networking cleanly
# - Configures /etc/network/interfaces for vmbr0 with IPv4 and IPv6 (SLAAC) and MTU=1480
# - Persists IPv6 sysctl so RAs are accepted (accept_ra=2) and autoconf is on
# - Applies sysctl and reloads networking
# NOTE: This playbook intentionally makes **no changes to LXCs**. New containers
#       should be created with IPv6=SLAAC (e.g., ip6=auto in net0) outside of this playbook.

- name: Proxmox base system setup (network + IPv6)
  hosts: proxmox   # adjust to your inventory group
  become: true
  vars:
    pmx_bridge_name: vmbr0
    pmx_bridge_port: ens33
    pmx_ipv4_addr: 192.168.1.9/24
    pmx_ipv4_gw: 192.168.1.1
    pmx_bridge_mtu: 1480           # set 1500 if/when PMTU is fixed upstream
    pmx_sysctl_path: /etc/sysctl.d/99-ipv6.conf
    pmx_interfaces_path: /etc/network/interfaces

  pre_tasks:
    - name: Ensure we are on a Debian-family host (Proxmox)
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
        fail_msg: "This playbook is intended for Proxmox/Debian-family hosts only."

  tasks:
    - name: Find all files containing enterprise repository references
      ansible.builtin.shell: |
        find /etc/apt -name "*.list" -exec grep -l "enterprise.proxmox.com" {} \; 2>/dev/null || true
      register: enterprise_files
      changed_when: false

    - name: Remove or disable enterprise repository entries from all sources
      ansible.builtin.shell: |
        find /etc/apt -name "*.list" -exec sed -i '/enterprise\.proxmox\.com/d' {} \;
      register: sed_result
      changed_when: true

    - name: Ensure no-subscription PVE repository exists
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/pve-no-subscription.list
        content: "deb http://download.proxmox.com/debian/pve trixie pve-no-subscription\n"
        mode: "0644"

    - name: Ensure no-subscription Ceph repository exists
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/ceph-no-subscription.list
        content: "deb http://download.proxmox.com/debian/ceph-squid trixie no-subscription\n"
        mode: "0644"

    - name: Update apt with --allow-releaseinfo-change to handle repository changes
      ansible.builtin.shell: |
        apt update --allow-releaseinfo-change --allow-unauthenticated 2>/dev/null || apt update --allow-releaseinfo-change || apt update
      register: apt_update_result
      retries: 2
      delay: 3
      changed_when: false
      failed_when: false  # Don't fail the playbook on apt update issues

    - name: Check if apt update was successful
      ansible.builtin.debug:
        msg:
          - "Apt update result: {{ apt_update_result.rc }}"
          - "Enterprise repos should now be removed or ignored"
      when: apt_update_result.rc != 0

    - name: Install networking tooling (ifupdown2) for reliable reloads
      ansible.builtin.apt:
        name:
          - ifupdown2
        state: present
        update_cache: false  # Already updated above

    - name: Backup existing /etc/network/interfaces if present
      ansible.builtin.copy:
        src: "{{ pmx_interfaces_path }}"
        dest: "{{ pmx_interfaces_path }}.pre-ansible.bak"
        remote_src: true
      ignore_errors: true

    - name: Deploy /etc/network/interfaces with IPv6 SLAAC on {{ pmx_bridge_name }}
      ansible.builtin.copy:
        dest: "{{ pmx_interfaces_path }}"
        mode: "0644"
        content: |
          # FILE: /etc/network/interfaces
          # Managed by Ansible (ansible/01-base-system/base-config.yml)
          # Proxmox bridge with IPv6 SLAAC + lowered MTU for PMTU workaround

          auto lo
          iface lo inet loopback

          iface {{ pmx_bridge_port }} inet manual

          auto {{ pmx_bridge_name }}
          iface {{ pmx_bridge_name }} inet static
              address {{ pmx_ipv4_addr }}
              gateway {{ pmx_ipv4_gw }}
              bridge-ports {{ pmx_bridge_port }}
              bridge-stp off
              bridge-fd 0
              mtu {{ pmx_bridge_mtu }}

          # IPv6 via SLAAC; accept router advertisements even if forwarding is enabled
          iface {{ pmx_bridge_name }} inet6 auto
              accept_ra 2
      notify: Reload networking

    - name: Deploy IPv6 sysctl overrides (accept RA + autoconf)
      ansible.builtin.copy:
        dest: "{{ pmx_sysctl_path }}"
        mode: "0644"
        content: |
          # FILE: /etc/sysctl.d/99-ipv6.conf
          # Managed by Ansible (ansible/01-base-system/base-config.yml)
          # Ensure host accepts RAs (even with forwarding) and autoconfigures IPv6.

          net.ipv6.conf.all.disable_ipv6 = 0
          net.ipv6.conf.default.disable_ipv6 = 0
          net.ipv6.conf.all.autoconf = 1
          net.ipv6.conf.default.autoconf = 1
          net.ipv6.conf.{{ pmx_bridge_name }}.accept_ra = 2
          net.ipv6.conf.{{ pmx_bridge_name }}.autoconf = 1

          # Optional: avoid privacy (temporary) addresses on the host
          net.ipv6.conf.default.use_tempaddr = 0
          net.ipv6.conf.{{ pmx_bridge_name }}.use_tempaddr = 0
      notify: Apply sysctl

    - name: Apply sysctl immediately
      ansible.builtin.command: sysctl --system
      changed_when: "'* Applying /etc/sysctl.d' in result.stdout"
      register: result

    - name: Reload networking (idempotent)
      ansible.builtin.command: ifreload -a
      changed_when: false

    - name: Show IPv6 address on bridge
      ansible.builtin.command: ip -6 addr show dev {{ pmx_bridge_name }}
      register: ip6_addr
      changed_when: false

    - name: Show IPv6 routes
      ansible.builtin.command: ip -6 route show
      register: ip6_route
      changed_when: false

    - name: IPv6 status summary (non-fatal)
      ansible.builtin.debug:
        msg:
          - "IPv6 addresses on {{ pmx_bridge_name }}:\n{{ ip6_addr.stdout }}"
          - "IPv6 routes:\n{{ ip6_route.stdout }}"

  handlers:
    - name: Apply sysctl
      ansible.builtin.command: sysctl --system

    - name: Reload networking
      ansible.builtin.command: ifreload -a
