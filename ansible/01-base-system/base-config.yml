---
- name: Configure Proxmox base system
  hosts: proxmox
  become: yes
  vars:
    packages_to_install:
      - curl
      - wget
      - vim
      - htop
      - unzip
      - git
      - python3
      - python3-pip
      - iftop
      - iotop
      - net-tools
      - smartmontools
  tasks:
    - name: Disable enterprise PVE repository (comment all lines)
      replace:
        path: /etc/apt/sources.list.d/pve-enterprise.sources
        regexp: '^(.*)$'
        replace: '# \1'
        backup: yes
      failed_when: false

    - name: Disable enterprise Ceph repository (comment all lines)
      replace:
        path: /etc/apt/sources.list.d/ceph.sources
        regexp: '^(.*)$'
        replace: '# \1'
        backup: yes
      failed_when: false

    - name: Add no-subscription repository (deb822 format)
      copy:
        content: |
          Types: deb
          URIs: http://download.proxmox.com/debian/pve
          Suites: trixie
          Components: pve-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
        dest: /etc/apt/sources.list.d/proxmox.sources
        backup: yes

    - name: Update package cache
      apt:
        update_cache: yes

    - name: Upgrade all packages
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes

    - name: Install base packages
      apt:
        name: "{{ packages_to_install }}"
        state: present

    - name: Configure timezone
      timezone:
        name: "{{ timezone | default('UTC') }}"

    - name: Disable subscription nag using shell command
      shell: |
        sed -i 's/res.data.status.toLowerCase() !== '\''active'\''/false/' /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js

    - name: Disable HA services for single node setup
      systemd:
        name: "{{ item }}"
        enabled: no
        state: stopped
      loop:
        - pve-ha-lrm
        - pve-ha-crm
        - corosync
      failed_when: false
