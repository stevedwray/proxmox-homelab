---
# FILE: ansible/01-base-system/base-config.yml
# Purpose: Base post-install configuration for Proxmox VE 9 (Debian 13 / trixie)
# Behavior:
#   - Prefer HTTPS for Proxmox/CEPH repos; AUTO-FALLBACK to HTTP if TLS SAN mismatch (probe)
#   - Remove enterprise repos; keep deb822 sources authoritative
#   - Optional Ceph repo; optional network and IPv6 tuning
#   - Disable subscription nag (optional)
#   - Non-fatal apt cache refresh to avoid run aborts on mirror hiccups

- name: Proxmox VE 9 base configuration
  hosts: proxmox
  become: true
  gather_facts: true

  vars:
    # --- Repository controls ---
    pmx_enable_ceph_repo: true
    pmx_repo_suite: "{{ ansible_distribution_release }}"   # 'trixie' on PVE 9
    pmx_ceph_release: squid                                # e.g., squid

    # Prefer HTTPS; probe may switch to HTTP if the presented cert is wrong
    pmx_probe_https: true
    pmx_proxmox_repo_scheme_default: "https"
    pmx_ceph_repo_scheme_default: "https"

    # (Optional) If IPv6 path is flaky/slow, force APT to use IPv4
    pmx_apt_force_ipv4: false

    # --- Nag screen controls ---
    pmx_disable_subscription_nag: true

    # --- IPv6 host tuning ---
    pmx_ipv6_tune: true
    pmx_ipv6_use_tempaddr: 0
    pmx_ipv6_accept_ra: 2
    pmx_ipv6_autoconf: 1

    # --- Network interface management (SAFE DEFAULT OFF) ---
    pmx_manage_network: false
    pmx_interfaces_path: /etc/network/interfaces
    pmx_primary_iface: "{{ ansible_default_ipv4.interface | default('eth0') }}"
    pmx_ipv4_addr: "192.168.1.10/24"
    pmx_ipv4_gw: "192.168.1.1"

  pre_tasks:
    - name: Assert Debian 13 (trixie) and Proxmox environment
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Debian'
          - ansible_distribution_major_version | int >= 13
        fail_msg: "This playbook targets Debian 13 (Proxmox VE 9)."
        success_msg: "Debian {{ ansible_distribution_version }} detected; proceeding."

    - name: Check if ifreload exists
      ansible.builtin.stat:
        path: /usr/sbin/ifreload
      register: ifreload_bin
      tags: [network]

    # ----- HTTPS probe (optional, prefers HTTPS but can fall back) -----
    - name: (IPv4 only) Resolve IPv4 for download.proxmox.com when forcing IPv4
      ansible.builtin.shell: getent ahostsv4 download.proxmox.com | awk 'NR==1{print $1}'
      register: pmx_v4
      changed_when: false
      failed_when: false
      when: pmx_apt_force_ipv4
      tags: [verify, repos]

    - name: Choose probe target host (IP if forcing IPv4, else hostname)
      ansible.builtin.set_fact:
        pmx_probe_target: "{{ (pmx_apt_force_ipv4 and (pmx_v4.stdout | default('') | length > 0)) | ternary(pmx_v4.stdout, 'download.proxmox.com') }}"
      tags: [verify, repos]

    - name: Probe TLS cert SAN for download.proxmox.com (prefer HTTPS, fallback if mismatch)
      ansible.builtin.shell: |
        timeout 5 openssl s_client -connect {{ pmx_probe_target }}:443 -servername download.proxmox.com < /dev/null 2>/dev/null \
        | openssl x509 -noout -text
      args:
        executable: /bin/bash
      register: pmx_tls_probe
      changed_when: false
      failed_when: false
      when: pmx_probe_https
      tags: [verify, repos]

    - name: Initialize repo schemes from defaults
      ansible.builtin.set_fact:
        pmx_proxmox_repo_scheme: "{{ pmx_proxmox_repo_scheme_default }}"
        pmx_ceph_repo_scheme: "{{ pmx_ceph_repo_scheme_default }}"
      tags: [verify, repos]

    - name: Determine if TLS probe SAN looks correct
      ansible.builtin.set_fact:
        pmx_tls_san_ok: "{{ (pmx_tls_probe.rc | default(1)) == 0 and ('DNS:download.proxmox.com' in (pmx_tls_probe.stdout | default('')) or 'Subject: CN=download.proxmox.com' in (pmx_tls_probe.stdout | default(''))) }}"
      when: pmx_probe_https
      tags: [verify, repos]

    - name: Fallback to HTTP for Proxmox/CEPH repos if SAN mismatch
      ansible.builtin.set_fact:
        pmx_proxmox_repo_scheme: "http"
        pmx_ceph_repo_scheme: "http"
      when:
        - pmx_probe_https
        - not (pmx_tls_san_ok | default(false) | bool)
      tags: [verify, repos]

    - name: Report probe decision (informational)
      ansible.builtin.debug:
        msg:
          - "TLS probe for download.proxmox.com: {{ 'OK' if (pmx_tls_san_ok | default(false)) else 'MISMATCH/FAILED or probe disabled' }}"
          - "Using scheme for Proxmox repo: {{ pmx_proxmox_repo_scheme }}"
          - "Using scheme for Ceph repo: {{ pmx_ceph_repo_scheme }}"
      tags: [verify, repos]

  tasks:
    # ------------------------------
    # Repositories (deb822-first)
    # ------------------------------

    - name: Ensure Debian base repos (deb822)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/debian.sources
        mode: "0644"
        content: |
          Types: deb deb-src
          URIs: https://deb.debian.org/debian/
          Suites: {{ pmx_repo_suite }} {{ pmx_repo_suite }}-updates
          Components: main non-free-firmware
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

          Types: deb deb-src
          URIs: https://security.debian.org/debian-security/
          Suites: {{ pmx_repo_suite }}-security
          Components: main non-free-firmware
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
      notify: apt-update
      tags: [repos, debian]

    - name: Configure Proxmox no-subscription repo (deb822)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/proxmox.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: {{ pmx_proxmox_repo_scheme }}://download.proxmox.com/debian/pve
          Suites: {{ pmx_repo_suite }}
          Components: pve-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
      notify: apt-update
      tags: [repos, proxmox]

    - name: Configure Ceph no-subscription repo (deb822)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/ceph.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: {{ pmx_ceph_repo_scheme }}://download.proxmox.com/debian/ceph-{{ pmx_ceph_release }}
          Suites: {{ pmx_repo_suite }}
          Components: no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
      when: pmx_enable_ceph_repo
      notify: apt-update
      tags: [repos, ceph]

    - name: Remove Ceph repo when disabled
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/ceph.sources
        state: absent
      when: not pmx_enable_ceph_repo
      tags: [repos, ceph]

    - name: Remove PVE enterprise repo (deb822) if present
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/pve-enterprise.sources
        state: absent
      tags: [repos, cleanup]

    - name: Find legacy .list files
      ansible.builtin.find:
        paths:
          - /etc/apt
          - /etc/apt/sources.list.d
        patterns: "*.list"
        file_type: file
      register: apt_list_files
      tags: [repos, cleanup]

    - name: Comment enterprise lines in .list files (cleanup)
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: '^(.*enterprise\.proxmox\.com.*)$'
        replace: '# \1'
      loop: "{{ apt_list_files.files }}"
      when: apt_list_files.matched | int > 0
      failed_when: false
      tags: [repos, cleanup]

    - name: Remove legacy .list repo files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/pve-no-subscription.list
        - /etc/apt/sources.list.d/ceph-no-subscription.list
      tags: [repos, cleanup]

    # (Optional) Force APT to use IPv4 to avoid slow v6 fallbacks
    - name: Write APT config to force IPv4 (optional)
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99force-ipv4
        mode: "0644"
        content: |
          Acquire::ForceIPv4 "{{ 'true' if pmx_apt_force_ipv4 else 'false' }}";
      tags: [repos, debian]

    # ------------------------------
    # Cache refresh & verification
    # ------------------------------

    - name: Ensure apt cache is up to date (verification, non-fatal)
      ansible.builtin.apt:
        update_cache: yes
      register: apt_update_nonfatal
      changed_when: false
      failed_when: false
      tags: [verify]

    # ------------------------------
    # Disable subscription nag (optional)
    # ------------------------------

    - name: Check for subscription nag marker
      ansible.builtin.shell: >
        grep -q "No valid subscription" /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
      register: nag_check
      changed_when: false
      failed_when: false
      when: pmx_disable_subscription_nag
      tags: [ui, nag]

    - name: Disable subscription nag screen (surgical replace)
      ansible.builtin.replace:
        path: /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
        regexp: "if \\(res\\.data\\.status !== 'active'\\)"
        replace: "if (false)"
        backup: yes
      when:
        - pmx_disable_subscription_nag
        - nag_check is defined and nag_check.rc == 0
      notify: restart pveproxy
      tags: [ui, nag]

    # ------------------------------
    # IPv6 host tuning for SLAAC (does not touch LXCs)
    # ------------------------------

    - name: Apply IPv6 sysctl tuning for SLAAC (host only)
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-proxmox-ipv6-slaac.conf
        mode: "0644"
        content: |
          # FILE: /etc/sysctl.d/99-proxmox-ipv6-slaac.conf
          net.ipv6.conf.all.accept_ra = {{ pmx_ipv6_accept_ra }}
          net.ipv6.conf.default.accept_ra = {{ pmx_ipv6_accept_ra }}
          net.ipv6.conf.all.autoconf = {{ pmx_ipv6_autoconf }}
          net.ipv6.conf.default.autoconf = {{ pmx_ipv6_autoconf }}
          net.ipv6.conf.all.use_tempaddr = {{ pmx_ipv6_use_tempaddr }}
          net.ipv6.conf.default.use_tempaddr = {{ pmx_ipv6_use_tempaddr }}
      when: pmx_ipv6_tune
      tags: [network, ipv6]

    - name: Reload sysctl settings
      ansible.builtin.command: sysctl --system
      when: pmx_ipv6_tune
      changed_when: false
      tags: [network, ipv6]

    # ------------------------------
    # Optional: manage /etc/network/interfaces (SAFE DEFAULT OFF)
    # ------------------------------

    - name: Write /etc/network/interfaces for static IPv4 + SLAAC IPv6
      ansible.builtin.copy:
        dest: "{{ pmx_interfaces_path }}"
        mode: "0644"
        content: |
          # FILE: {{ pmx_interfaces_path }}
          auto lo
          iface lo inet loopback

          auto {{ pmx_primary_iface }}
          iface {{ pmx_primary_iface }} inet static
            address {{ pmx_ipv4_addr }}
            gateway {{ pmx_ipv4_gw }}
          iface {{ pmx_primary_iface }} inet6 auto

          auto vmbr0
          iface vmbr0 inet manual
            bridge-ports none
            bridge-stp off
            bridge-fd 0
          iface vmbr0 inet6 manual
      when: pmx_manage_network
      notify: ifreload
      tags: [network, ipv4, ipv6]

    # ------------------------------
    # Repository verification
    # ------------------------------

    - name: Verify PVE repository configuration
      ansible.builtin.command: apt-cache policy proxmox-ve
      register: apt_policy_pve
      changed_when: false
      failed_when: false
      tags: [verify]

    - name: Verify Ceph repository configuration (ceph-common)
      ansible.builtin.command: apt-cache policy ceph-common
      register: apt_policy_ceph
      changed_when: false
      failed_when: false
      tags: [verify]

    - name: Search for active enterprise repo references (ignore commented lines, skip backups)
      ansible.builtin.shell: |
        set -Eeuo pipefail
        # Recursive grep with include/exclude instead of xargs to avoid rc=123
        grep -R -Hn -E --binary-files=without-match \
          --include='*.list' --include='*.sources' \
          --exclude='*~' --exclude='*@????-*' \
          '^[[:space:]]*[^#].*enterprise\.proxmox\.com' /etc/apt || true
      args:
        executable: /bin/bash
      register: enterprise_refs
      changed_when: false
      failed_when: false
      tags: [verify]

    - name: Repository status summary
      ansible.builtin.debug:
        msg:
          - "PVE policy:\n{{ apt_policy_pve.stdout | default('') }}"
          - "Ceph policy:\n{{ apt_policy_ceph.stdout | default('') }}"
          - "Enterprise refs (should be empty):\n{{ enterprise_refs.stdout | default('') }}"
      tags: [verify]

    - name: Assert PVE no-subscription is active
      ansible.builtin.assert:
        that:
          - "'download.proxmox.com' in (apt_policy_pve.stdout | default(''))"
        fail_msg: "PVE repo is not pointing at download.proxmox.com (no-subscription)!"
        success_msg: "PVE repo OK (download.proxmox.com detected)."
      tags: [verify]

    - name: Assert Ceph no-subscription is active (skip if ceph-common unknown)
      ansible.builtin.assert:
        that:
          - "apt_policy_ceph.rc != 0 or 'download.proxmox.com' in (apt_policy_ceph.stdout | default(''))"
        fail_msg: "Ceph repo not pointing at download.proxmox.com (no-subscription)!"
        success_msg: "Ceph repo OK or Ceph not configured."
      tags: [verify]

    - name: Assert no enterprise repository references remain
      ansible.builtin.assert:
        that:
          - "(enterprise_refs.stdout | default('')) == ''"
        fail_msg: "Enterprise repository references still present in apt sources!"
        success_msg: "No enterprise repository references found."
      tags: [verify]

  handlers:
    - name: apt-update
      ansible.builtin.apt:
        update_cache: yes

    - name: restart pveproxy
      ansible.builtin.systemd:
        name: pveproxy
        state: restarted

    - name: ifreload
      ansible.builtin.command: ifreload -a
      when: ifreload_bin.stat.exists
