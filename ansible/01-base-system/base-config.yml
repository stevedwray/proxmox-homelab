---
- name: Configure Proxmox base system
  hosts: proxmox
  become: yes
  vars:
    packages_to_install:
      - curl
      - wget
      - vim
      - htop
      - unzip
      - git
      - python3
      - python3-pip
  tasks:
    - name: Disable enterprise PVE repository
      replace:
        path: /etc/apt/sources.list.d/pve-enterprise.sources
        regexp: '^(.*)$'
        replace: '# \1'
        backup: yes

    - name: Disable enterprise Ceph repository
      replace:
        path: /etc/apt/sources.list.d/ceph.sources
        regexp: '^(.*)$'
        replace: '# \1'
        backup: yes

    - name: Add no-subscription repository
      copy:
        content: "deb http://download.proxmox.com/debian/pve trixie pve-no-subscription\n"
        dest: /etc/apt/sources.list.d/pve-no-subscription.list
        backup: yes

    - name: Remove duplicate no-subscription sources file if exists
      file:
        path: /etc/apt/sources.list.d/pve-no-subscription.sources
        state: absent

    - name: Update package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install base packages
      apt:
        name: "{{ packages_to_install }}"
        state: present

    - name: Configure timezone
      timezone:
        name: "{{ timezone | default('UTC') }}"

    - name: Setup SSH keys
      authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ lookup('file', ssh_public_key_path) }}"
        state: present
      when: ssh_public_key_path is defined
