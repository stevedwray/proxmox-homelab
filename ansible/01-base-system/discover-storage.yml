---
# 01-base-system/discover-storage.yml
- name: Discover available Proxmox storage
  hosts: proxmox
  become: yes
  tasks:
    - name: List available storage
      shell: pvesm status
      register: storage_status

    - name: Display storage information
      debug:
        msg: "{{ storage_status.stdout_lines }}"

    - name: List available container templates
      shell: pveam available --section system | grep -E "(debian|ubuntu)" | head -10
      register: available_templates
      failed_when: false

    - name: Display available templates
      debug:
        msg: "{{ available_templates.stdout_lines }}"

    - name: Check for existing containers
      shell: pct list
      register: existing_containers

    - name: Display existing containers
      debug:
        msg: "{{ existing_containers.stdout_lines }}"

    - name: Show ZFS pools if any
      shell: zpool list
      register: zfs_pools
      failed_when: false

    - name: Display ZFS pools
      debug:
        msg: "{{ zfs_pools.stdout_lines }}"
      when: zfs_pools.rc == 0
