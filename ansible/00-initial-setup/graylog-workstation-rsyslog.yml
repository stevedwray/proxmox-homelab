---
# Enrol the operator workstation (Garuda/Arch) in Graylog log shipping, warning
# and above only (docs/alerting/plan.md, Phase 0.4; operator decision 2026-10-24).
#
# Standard rsyslog, not a bespoke forwarder: imjournal reads the systemd journal
# (Arch has no /var/log/syslog) and one rule forwards severity <= warning to
# Graylog as RFC 5424 over TCP, with a disk-assisted queue so a Graylog restart
# loses nothing. The rsyslog_forward role is Debian/apt/LXC-shaped, so this is
# its own small play. rsyslog comes from the chaotic-aur repo.
#
# Run (asks for the sudo password):
#   ./with-secrets ansible-playbook -i ansible/inventory/inventory.yml \
#     ansible/00-initial-setup/graylog-workstation-rsyslog.yml --limit garuda --ask-become-pass
#
# Verify: logger -p user.warning 'WORKSTATION_FWD_PROOF', then in Graylog
#   relay_src_ip:192.168.1.104 AND message:WORKSTATION_FWD_PROOF
#   (an info-level logger line must NOT arrive: that is the filter working)
# Rollback: restore /etc/rsyslog.conf from the timestamped backup beside it, or
#   systemctl disable --now rsyslog && pacman -Rns rsyslog

- name: Ship the workstation journal (warning and above) to Graylog
  hosts: garuda
  become: true
  gather_facts: false

  vars:
    graylog_host: "{{ lookup('env', 'LAB_IP_GRAYLOG') | mandatory('LAB_IP_GRAYLOG env var is required') }}"
    graylog_port: "514"

  tasks:
    - name: Install rsyslog (chaotic-aur)
      community.general.pacman:
        name: rsyslog
        state: present

    - name: Create the rsyslog spool directory
      ansible.builtin.file:
        path: /var/spool/rsyslog
        state: directory
        owner: root
        group: root
        mode: "0700"

    # Replaces the distro default rather than adding a drop-in: the default may
    # already load imjournal or log locally, and a second copy would duplicate or
    # fail. backup keeps the original. validate refuses to install a config that
    # rsyslogd itself rejects (it also catches a missing module).
    - name: Write rsyslog.conf (journal in, warning and above out)
      ansible.builtin.copy:
        dest: /etc/rsyslog.conf
        owner: root
        group: root
        mode: "0644"
        backup: true
        validate: rsyslogd -N1 -f %s
        content: |
          # Managed by ansible/00-initial-setup/graylog-workstation-rsyslog.yml
          global(workDirectory="/var/spool/rsyslog")

          # IgnorePreviousMessages: on first start do not replay the whole journal.
          module(load="imjournal" StateFile="imjournal.state" IgnorePreviousMessages="on")

          # %programname%, not %syslogtag%: clean APPNAME, no [PID], no 32-char cut.
          template(name="GraylogForward" type="string"
            string="<%PRI%>1 %TIMESTAMP:::date-rfc3339% %HOSTNAME% %programname% %PROCID% - %STRUCTURED-DATA% %msg%\n")

          # Severity 4 is warning; lower numbers are more severe.
          if $syslogseverity <= 4 then {
            action(type="omfwd" target="{{ graylog_host }}" port="{{ graylog_port }}" protocol="tcp"
                   Template="GraylogForward"
                   queue.type="LinkedList" queue.filename="graylog-fwd"
                   queue.maxDiskSpace="64m" queue.saveOnShutdown="on"
                   action.resumeRetryCount="-1")
          }
      notify: Restart rsyslog

    - name: Enable and start rsyslog
      ansible.builtin.systemd:
        name: rsyslog
        enabled: true
        state: started

  handlers:
    - name: Restart rsyslog
      ansible.builtin.systemd:
        name: rsyslog
        state: restarted
