---
# mikrotik-dns-lab-zone-delegate.yml
#
# Phase 2 DNS delegation: switches MikroTik from static A records (Phase 1)
# to a type=FWD entry for lab.gibbsgreatly.xyz that forwards to CoreDNS.
#
# Prerequisite: CoreDNS deployed and authoritative on the configured LAB_IP_DNS endpoint (Phase 04b).
# Run AFTER: mikrotik-dns-lab-zone-baseline.yml has been applied.
#
# What it does:
#   1. Removes all static DNS entries tagged comment=lab-zone-baseline from MikroTik.
#   2. Adds a single type=FWD regexp entry delegating lab.gibbsgreatly.xyz to the configured CoreDNS endpoint.
#   3. Validates resolution of a lab-zone name via all four SDN gateway resolvers.
#   4. Validates that non-lab names still resolve (public recursion path preserved).
#
# Usage (run from the repo root):
#   ./with-secrets bash -c '
#     ansible-playbook ansible/00-initial-setup/mikrotik-dns-lab-zone-delegate.yml \
#       --extra-vars "mikrotik_host=${MIKROTIK_HOST} mikrotik_user=${MIKROTIK_ADMIN} mikrotik_password=${MIKROTIK_ADMIN_PASSWORD}"
#   '
#
# Required env vars (sourced via with-secrets from terraform/secrets.enc.yaml or .env):
#   MIKROTIK_HOST            — MikroTik router IP or hostname
#   MIKROTIK_ADMIN           — MikroTik admin automation username
#   MIKROTIK_ADMIN_PASSWORD  — MikroTik admin automation password
#
# After running this playbook, delegated queries should resolve via the configured LAB_GW_* resolvers,
# and public recursion should still succeed through the configured management resolver.

- name: Delegate lab.gibbsgreatly.xyz from MikroTik static A records to CoreDNS FWD
  hosts: localhost
  gather_facts: false

  vars:
    mikrotik_host: "{{ lookup('env', 'MIKROTIK_HOST') | mandatory('MIKROTIK_HOST env var is required') }}"
    mikrotik_rest_base_url: "https://{{ mikrotik_host }}/rest"
    mikrotik_user: >-
      {{
        lookup('env', 'MIKROTIK_ADMIN')
        | default(lookup('env', 'MIKROTIK_USER'), true)
        | default('api-user', true)
      }}
    mikrotik_password: >-
      {{
        lookup('env', 'MIKROTIK_ADMIN_PASSWORD')
        | default(lookup('env', 'MIKROTIK_PASSWORD'), true)
      }}

    coredns_ip: "{{ lookup('env', 'LAB_IP_DNS') | mandatory('LAB_IP_DNS env var is required') }}"
    fwd_regexp: "(^|\\.)lab\\.gibbsgreatly\\.xyz$"
    fwd_comment: "lab-zone-delegate"
    baseline_comment: "lab-zone-baseline"

    # Validation probes — all four SDN gateway resolvers
    delegated_probes:
      - resolver: "{{ lookup('env', 'LAB_GW_BUILD') | mandatory('LAB_GW_BUILD env var is required') }}"
        name: "traefik.lab.gibbsgreatly.xyz"
        expected: "{{ lookup('env', 'LAB_IP_PROXY') | mandatory('LAB_IP_PROXY env var is required') }}"
      - resolver: "{{ lookup('env', 'LAB_GW_MGMT') | mandatory('LAB_GW_MGMT env var is required') }}"
        name: "traefik.lab.gibbsgreatly.xyz"
        expected: "{{ lookup('env', 'LAB_IP_PROXY') | mandatory('LAB_IP_PROXY env var is required') }}"
      - resolver: "{{ lookup('env', 'LAB_GW_EDGE') | mandatory('LAB_GW_EDGE env var is required') }}"
        name: "traefik.lab.gibbsgreatly.xyz"
        expected: "{{ lookup('env', 'LAB_IP_PROXY') | mandatory('LAB_IP_PROXY env var is required') }}"
      - resolver: "{{ lookup('env', 'LAB_GW_INFRA') | mandatory('LAB_GW_INFRA env var is required') }}"
        name: "traefik.lab.gibbsgreatly.xyz"
        expected: "{{ lookup('env', 'LAB_IP_PROXY') | mandatory('LAB_IP_PROXY env var is required') }}"

    public_probe_resolver: "{{ lookup('env', 'LAB_GW_MGMT') | mandatory('LAB_GW_MGMT env var is required') }}"
    public_probe_name: "github.com"

  pre_tasks:
    - name: Assert MikroTik password is set
      ansible.builtin.assert:
        that:
          - mikrotik_password | length > 0
        fail_msg: >-
          No MikroTik password. Set MIKROTIK_ADMIN_PASSWORD or MIKROTIK_PASSWORD.

    - name: Assert MikroTik user is set
      ansible.builtin.assert:
        that:
          - mikrotik_user | length > 0
        fail_msg: >-
          No MikroTik user. Set MIKROTIK_ADMIN or MIKROTIK_USER.

  tasks:
    # ── Step 1: Fetch all existing static DNS entries ──────────────────────────

    - name: Fetch all DNS static entries from MikroTik
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/ip/dns/static"
        method: GET
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        status_code: 200
      register: existing_dns
      no_log: true

    # ── Step 2: Remove Phase 1 static A baseline entries ──────────────────────

    - name: Build list of Phase 1 baseline entries to remove
      ansible.builtin.set_fact:
        baseline_entries: >-
          {{
            existing_dns.json
            | selectattr('comment', 'defined')
            | selectattr('comment', 'equalto', baseline_comment)
            | list
          }}

    - name: Remove Phase 1 lab-zone-baseline static A entries
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/ip/dns/static/{{ item['.id'] }}"
        method: DELETE
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200, 204]
      loop: "{{ baseline_entries }}"
      no_log: true

    - name: Report Phase 1 entries removed
      ansible.builtin.debug:
        msg: "Removed {{ baseline_entries | length }} lab-zone-baseline static A entries."

    # ── Step 3: Check whether FWD entry already exists ────────────────────────

    - name: Check for existing lab-zone-delegate FWD entry
      ansible.builtin.set_fact:
        existing_fwd_entries: >-
          {{
            existing_dns.json
            | selectattr('comment', 'defined')
            | selectattr('comment', 'equalto', fwd_comment)
            | list
          }}

    # ── Step 4: Add FWD delegation entry ──────────────────────────────────────

    - name: Add FWD delegation entry for lab.gibbsgreatly.xyz → CoreDNS
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/ip/dns/static/add"
        method: POST
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          regexp: "{{ fwd_regexp }}"
          type: "FWD"
          forward-to: "{{ coredns_ip }}"
          ttl: "5m"
          comment: "{{ fwd_comment }}"
        status_code: [200, 201]
      when: existing_fwd_entries | length == 0
      no_log: true

    - name: Skip FWD entry creation (already present)
      ansible.builtin.debug:
        msg: "FWD entry for lab.gibbsgreatly.xyz already exists, skipping."
      when: existing_fwd_entries | length > 0

    # ── Step 5: Validate delegated resolution through all SDN resolvers ───────

    - name: Probe lab-zone name through each SDN gateway resolver
      ansible.builtin.command:
        cmd: "dig @{{ item.resolver }} +short +time=5 +tries=2 {{ item.name }}"
      register: delegated_results
      loop: "{{ delegated_probes }}"
      changed_when: false

    - name: Assert delegated probes return expected IP
      ansible.builtin.assert:
        that:
          - item.stdout | trim == item.item.expected
        fail_msg: >-
          Resolver {{ item.item.resolver }} returned '{{ item.stdout | trim }}'
          for {{ item.item.name }}, expected {{ item.item.expected }}.
          Check MikroTik FWD entry and that CoreDNS ({{ coredns_ip }}) is reachable
          from MikroTik with UDP/TCP 53.
        success_msg: >-
          {{ item.item.resolver }} → {{ item.item.name }} = {{ item.stdout | trim }} ✓
      loop: "{{ delegated_results.results }}"

    # ── Step 6: Validate public (non-delegated) path is preserved ─────────────

    - name: Probe public name through mgmt_seg gateway resolver
      ansible.builtin.command:
        cmd: "dig @{{ public_probe_resolver }} +short +time=5 +tries=2 {{ public_probe_name }}"
      register: public_probe_result
      changed_when: false

    - name: Assert public probe returns an answer (non-delegated path preserved)
      ansible.builtin.assert:
        that:
          - public_probe_result.stdout | trim | length > 0
        fail_msg: >-
          Resolver {{ public_probe_resolver }} returned no answer for {{ public_probe_name }}.
          MikroTik recursive forwarding path may be broken.
        success_msg: >-
          {{ public_probe_resolver }} → {{ public_probe_name }} = {{ public_probe_result.stdout | trim }} ✓

    # ── Step 7: Print validation summary ──────────────────────────────────────

    - name: Print validation summary
      ansible.builtin.debug:
        msg:
          - "=== Phase 2 DNS delegation validation ==="
          - "FWD entry: lab.gibbsgreatly.xyz → {{ coredns_ip }} (CoreDNS)"
          - "Delegated resolution:"
          - "  @{{ delegated_probes[0].resolver }} {{ delegated_probes[0].name }} = {{ delegated_results.results[0].stdout | trim }}"
          - "  @{{ delegated_probes[1].resolver }} {{ delegated_probes[1].name }} = {{ delegated_results.results[1].stdout | trim }}"
          - "  @{{ delegated_probes[2].resolver }} {{ delegated_probes[2].name }} = {{ delegated_results.results[2].stdout | trim }}"
          - "  @{{ delegated_probes[3].resolver }} {{ delegated_probes[3].name }} = {{ delegated_results.results[3].stdout | trim }}"
          - "Non-delegated (public probe):"
          - "  @{{ public_probe_resolver }} {{ public_probe_name }} = {{ public_probe_result.stdout | trim }}"
          - "=== Delegation phase complete ==="
