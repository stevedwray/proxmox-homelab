---
# Monitoring integration for the T-Pot honeypot host (Graylog logs, cAdvisor
# metrics for monitoring-stack/Grafana, Wazuh agent), per
# docs/tpot-honeypot/monitoring-plan.md.
#
# HOST LAYER ONLY: this playbook never touches ~/tpotce/, T-Pot's compose
# project, or the Docker daemon (no install, restart or daemon.json change).
# cAdvisor runs as its own compose project in /opt/cadvisor-docker.
#
# Tags (run one at a time, each is a separate operator action):
#   logs      rsyslog_forward -> Graylog. MikroTik already allows
#             192.168.1.0/24 -> Graylog tcp/514 (shared-graylog-ingress).
#   cadvisor  cAdvisor on tcp/8083 (9100 is held by a T-Pot docker-proxy, so
#             node_exporter cannot be used). Scraped by monitoring-stack's
#             `cadvisor` job.
#   hwmon     node_exporter as a Docker-published container on tcp/8084
#             (hardware sensors, docs/hw-monitoring/) plus the Pi 5 PMIC
#             rail textfile timer. A host-level listener cannot be used:
#             T-Pot's INPUT chain ends in an NFQUEUE catch-all that hands any
#             port outside its allow-list to honeytrap. Docker-published
#             ports (DNAT) bypass INPUT, same as cAdvisor. Plain HTTP, no
#             basic auth (same trust as cAdvisor); scraped by monitoring-
#             stack's `node_exporter_hw_plain` job.
#   wazuh     wazuh_agent -> manager 1514/1515 (already allowed from
#             192.168.1.0/24). Needs the host route from
#             tpot-host-baseline.yml (tpot_extra_host_routes: 192.168.40.15)
#             applied FIRST -- T-Pot's Docker 192.168.32.0/20 bridge
#             otherwise swallows traffic to the manager.
#
# Run (from repo root; env comes from the prod wrapper):
#   ANSIBLE_ROLES_PATH=terraform/lxc/ansible/roles TASK_APPROVAL=<task> \
#     ./with-secrets-prod ansible-playbook \
#     -i ansible/inventory/inventory.yml \
#     ansible/00-initial-setup/tpot-monitoring.yml --tags logs
# Required env: LAB_IP_GRAYLOG (logs); LAB_IP_WAZUH,
# WAZUH_AGENT_AUTHD_PASSWORD, WAZUH_API_PASSWORD (wazuh).

- name: Integrate the T-Pot host with lab monitoring
  hosts: tpot
  become: true
  gather_facts: true

  vars:
    tpot_cadvisor_image: "ghcr.io/google/cadvisor:v0.60.5"
    tpot_cadvisor_port: 8083
    tpot_cadvisor_dir: /opt/cadvisor-docker
    tpot_nodeexp_image: "quay.io/prometheus/node-exporter:v1.12.1"
    tpot_nodeexp_port: 8084
    tpot_nodeexp_dir: /opt/node-exporter-docker
    tpot_nodeexp_textfile_dir: /var/lib/node_exporter/textfile_collector

  tasks:
    - name: Install rsyslog_forward for Graylog log shipping
      ansible.builtin.include_role:
        name: rsyslog_forward
        apply:
          tags: [logs]
      vars:
        # Real hardware with a real kernel log -- keep imklog enabled, same
        # as framework-desktop-bootstrap.yml.
        rsyslog_forward_disable_imklog: false
      tags: [logs]

    - name: Create cAdvisor docker-compose directory
      ansible.builtin.file:
        path: "{{ tpot_cadvisor_dir }}"
        state: directory
        mode: "0755"
      tags: [cadvisor]

    - name: Install cAdvisor docker-compose.yml
      ansible.builtin.copy:
        dest: "{{ tpot_cadvisor_dir }}/docker-compose.yml"
        mode: "0644"
        content: |
          services:
            cadvisor:
              image: {{ tpot_cadvisor_image }}
              container_name: cadvisor
              restart: unless-stopped
              ports:
                - "{{ tpot_cadvisor_port }}:8080"
              volumes:
                - /:/rootfs:ro
                - /var/run:/var/run:ro
                - /sys:/sys:ro
                - /var/lib/docker:/var/lib/docker:ro
                - /etc/machine-id:/etc/machine-id:ro
      register: tpot_cadvisor_compose
      tags: [cadvisor]

    - name: Bring up cAdvisor via docker compose
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ tpot_cadvisor_dir }}"
      register: tpot_cadvisor_up
      changed_when: "'Started' in tpot_cadvisor_up.stderr or 'Created' in tpot_cadvisor_up.stderr"
      tags: [cadvisor]

    - name: Create node_exporter docker-compose and textfile directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ tpot_nodeexp_dir }}"
        - "{{ tpot_nodeexp_textfile_dir }}"
      tags: [hwmon]

    - name: Install node_exporter docker-compose.yml (hwmon + textfile collectors only)
      ansible.builtin.copy:
        dest: "{{ tpot_nodeexp_dir }}/docker-compose.yml"
        mode: "0644"
        content: |
          services:
            node-exporter:
              image: {{ tpot_nodeexp_image }}
              container_name: node-exporter-hw
              restart: unless-stopped
              command:
                - --path.sysfs=/host/sys
                - --collector.disable-defaults
                - --collector.hwmon
                - --collector.textfile
                - --collector.textfile.directory=/textfile
              ports:
                - "{{ tpot_nodeexp_port }}:9100"
              volumes:
                - /sys:/host/sys:ro
                - {{ tpot_nodeexp_textfile_dir }}:/textfile:ro
      register: tpot_nodeexp_compose
      tags: [hwmon]

    - name: Bring up node_exporter via docker compose
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ tpot_nodeexp_dir }}"
      register: tpot_nodeexp_up
      changed_when: "'Started' in tpot_nodeexp_up.stderr or 'Created' in tpot_nodeexp_up.stderr or 'Recreated' in tpot_nodeexp_up.stderr"
      tags: [hwmon]

    - name: Copy Pi PMIC textfile script
      ansible.builtin.copy:
        src: files/rpi_pmic_textfile.py
        dest: /usr/local/bin/rpi_pmic_textfile.py
        mode: "0755"
      tags: [hwmon]

    - name: Write Pi PMIC textfile service and timer
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        mode: "0644"
        content: "{{ item.content }}"
      loop:
        - name: rpi-pmic-textfile.service
          content: "[Unit]\nDescription=Write Pi PMIC rails for node_exporter\n\n[Service]\nType=oneshot\nExecStart=/usr/bin/python3 /usr/local/bin/rpi_pmic_textfile.py {{ tpot_nodeexp_textfile_dir }}/rpi_pmic.prom\n"
        - name: rpi-pmic-textfile.timer
          content: "[Unit]\nDescription=Refresh Pi PMIC rails\n\n[Timer]\nOnBootSec=30s\nOnUnitActiveSec=30s\n\n[Install]\nWantedBy=timers.target\n"
      tags: [hwmon]

    - name: Enable the PMIC timer
      ansible.builtin.systemd:
        name: rpi-pmic-textfile.timer
        enabled: true
        state: started
        daemon_reload: true
      tags: [hwmon]

    - name: Install the Wazuh agent (docker monitoring deliberately OFF)
      ansible.builtin.include_role:
        name: wazuh_agent
        apply:
          tags: [wazuh]
      vars:
        wazuh_agent_group: "tpot-honeypot"
        # docker.sock access on a honeypot host is deliberately refused.
        wazuh_agent_docker_monitoring_enabled: false
        wazuh_agent_fim_paths: []
      tags: [wazuh]
