---
- name: Reconcile MikroTik build_seg VLAN data-plane path
  hosts: localhost
  gather_facts: false

  vars:
    mikrotik_host: "{{ lookup('env', 'MIKROTIK_HOST') | mandatory('MIKROTIK_HOST env var is required') }}"
    mikrotik_rest_base_url: "https://{{ mikrotik_host }}/rest"
    mikrotik_user: "{{ lookup('env', 'MIKROTIK_USER') }}"
    mikrotik_password: "{{ lookup('env', 'MIKROTIK_PASSWORD') }}"

    bridge_name: bridgeLocal
    trunk_interface: ether5
    build_vlan_name: vlan10-build
    build_gateway_cidr: "{{ (lookup('env', 'LAB_GW_BUILD') | mandatory('LAB_GW_BUILD env var is required')) ~ '/24' }}"
    tagged_vlans:
      - 10
      - 20
      - 30
      - 40
    native_vlan_ports:
      - bridgeLocal
      - ether1
      - ether3
      - ether4
      - ether5
      - wifi1
      - wifi2

  pre_tasks:
    - name: Assert MikroTik credentials are present
      ansible.builtin.assert:
        that:
          - mikrotik_user | length > 0
          - mikrotik_password | length > 0
        fail_msg: Set MIKROTIK_USER and MIKROTIK_PASSWORD via with-secrets.

  tasks:
    - name: Read bridge definition
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/interface/bridge"
        method: GET
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        status_code: 200
      register: bridge_result
      no_log: true

    - name: Locate target bridge object
      ansible.builtin.set_fact:
        bridge_obj: >-
          {{
            (bridge_result.json | selectattr('name', 'equalto', bridge_name) | list | first)
            | default({})
          }}

    - name: Assert target bridge exists
      ansible.builtin.assert:
        that:
          - bridge_obj != {}
        fail_msg: Expected bridgeLocal to exist on active MikroTik.

    - name: Read bridge ports
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/interface/bridge/port"
        method: GET
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        status_code: 200
      register: bridge_port_result
      no_log: true

    - name: Locate trunk bridge port object
      ansible.builtin.set_fact:
        trunk_bridge_port_obj: >-
          {{
            (bridge_port_result.json | selectattr('interface', 'equalto', trunk_interface) | list | first)
            | default({})
          }}

    - name: Ensure trunk bridge port remains attached and accepts tagged frames
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/interface/bridge/port/{{ trunk_bridge_port_obj['.id'] }}"
        method: PATCH
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          frame-types: admit-all
          ingress-filtering: "false"
        status_code: [200, 201]
      when:
        - trunk_bridge_port_obj != {}
        - >-
          trunk_bridge_port_obj['frame-types'] | default('') != 'admit-all'
          or trunk_bridge_port_obj['ingress-filtering'] | default('true') != 'false'
      no_log: true

    - name: Read VLAN interfaces
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/interface/vlan"
        method: GET
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        status_code: 200
      register: vlan_result
      no_log: true

    - name: Locate build VLAN object
      ansible.builtin.set_fact:
        build_vlan_obj: >-
          {{
            (vlan_result.json | selectattr('name', 'equalto', build_vlan_name) | list | first)
            | default({})
          }}

    - name: Ensure build VLAN is bound to bridge CPU interface
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/interface/vlan/{{ build_vlan_obj['.id'] }}"
        method: PATCH
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          interface: "{{ bridge_name }}"
          disabled: "false"
        status_code: [200, 201]
      when:
        - build_vlan_obj != {}
        - build_vlan_obj.interface != bridge_name or (build_vlan_obj.disabled | default('false')) == 'true'
      no_log: true

    - name: Read IP addresses
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/ip/address"
        method: GET
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        status_code: 200
      register: ip_result
      no_log: true

    - name: Locate build gateway address object
      ansible.builtin.set_fact:
        build_ip_obj: >-
          {{
            (ip_result.json | selectattr('address', 'equalto', build_gateway_cidr) | list | first)
            | default({})
          }}

    - name: Ensure build gateway remains attached to build VLAN
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/ip/address/{{ build_ip_obj['.id'] }}"
        method: PATCH
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          interface: "{{ build_vlan_name }}"
          disabled: "false"
        status_code: [200, 201]
      when:
        - build_ip_obj != {}
        - build_ip_obj.interface != build_vlan_name or (build_ip_obj.disabled | default('false')) == 'true'
      no_log: true

    - name: Read bridge VLAN table
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/interface/bridge/vlan"
        method: GET
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        status_code: 200
      register: bridge_vlan_result
      no_log: true

    - name: Add native VLAN 1 bridge entry when missing
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/interface/bridge/vlan/add"
        method: POST
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          bridge: "{{ bridge_name }}"
          vlan-ids: "1"
          untagged: "{{ native_vlan_ports | join(',') }}"
        status_code: [200, 201]
      when: >-
        (bridge_vlan_result.json | selectattr('vlan-ids', 'equalto', '1') | list | length) == 0
      no_log: true

    - name: Add tagged bridge VLAN entries when missing
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/interface/bridge/vlan/add"
        method: POST
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          bridge: "{{ bridge_name }}"
          vlan-ids: "{{ item | string }}"
          tagged: "{{ bridge_name }},{{ trunk_interface }}"
        status_code: [200, 201]
      loop: "{{ tagged_vlans }}"
      when: >-
        (bridge_vlan_result.json | selectattr('vlan-ids', 'equalto', item | string) | list | length) == 0
      no_log: true

    - name: Enable bridge VLAN filtering
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/interface/bridge/{{ bridge_obj['.id'] }}"
        method: PATCH
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          vlan-filtering: "true"
        status_code: [200, 201]
      when: bridge_obj['vlan-filtering'] | default('false') != 'true'
      no_log: true

    - name: Read final bridge state
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/interface/bridge"
        method: GET
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        status_code: 200
      register: final_bridge_result
      no_log: true

    - name: Read final bridge VLAN table
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/interface/bridge/vlan"
        method: GET
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        status_code: 200
      register: final_bridge_vlan_result
      no_log: true

    - name: Validate final build trunk model
      ansible.builtin.assert:
        that:
          - final_bridge_obj['vlan-filtering'] == 'true'
          - final_build_vlan_entry != {}
          - trunk_interface in (final_build_vlan_entry.tagged | default(''))
          - bridge_name in (final_build_vlan_entry.tagged | default(''))
        fail_msg: VLAN10 trunk model was not reconciled as expected.
        success_msg: VLAN10 trunk model now exists on bridgeLocal and ether5.
      vars:
        final_bridge_obj: >-
          {{
            (final_bridge_result.json | selectattr('name', 'equalto', bridge_name) | list | first)
            | default({})
          }}
        final_build_vlan_entry: >-
          {{
            (final_bridge_vlan_result.json | selectattr('vlan-ids', 'equalto', '10') | list | first)
            | default({})
          }}
