---
- name: Reconcile MikroTik build_seg VLAN data-plane path
  hosts: localhost
  gather_facts: false

  vars:
    mikrotik_host: "{{ lookup('env', 'MIKROTIK_HOST') | mandatory('MIKROTIK_HOST env var is required') }}"
    mikrotik_rest_base_url: "https://{{ mikrotik_host }}/rest"
    mikrotik_user: "{{ lookup('env', 'MIKROTIK_USER') }}"
    mikrotik_password: "{{ lookup('env', 'MIKROTIK_PASSWORD') }}"

    bridge_name: bridgeLocal
    trunk_interface: ether5
    build_vlan_name: vlan10-build
    build_gateway_cidr: "{{ (lookup('env', 'LAB_GW_BUILD') | mandatory('LAB_GW_BUILD env var is required')) ~ '/24' }}"
    mgmt_gateway_cidr: "{{ (lookup('env', 'LAB_GW_MGMT') | mandatory('LAB_GW_MGMT env var is required')) ~ '/24' }}"
    edge_gateway_cidr: "{{ (lookup('env', 'LAB_GW_EDGE') | mandatory('LAB_GW_EDGE env var is required')) ~ '/24' }}"
    infra_gateway_cidr: "{{ (lookup('env', 'LAB_GW_INFRA') | mandatory('LAB_GW_INFRA env var is required')) ~ '/24' }}"
    migrated_gateway_bindings:
      - name: mgmt
        interface: vlan20-mgmt
        cidr: "{{ mgmt_gateway_cidr }}"
        legacy_cidr: 10.57.1.1/24
        comment: pve-test mgmt_seg gw
      - name: edge
        interface: vlan30-edge
        cidr: "{{ edge_gateway_cidr }}"
        legacy_cidr: 10.57.2.1/24
        comment: pve-test edge_seg gw
      - name: infra
        interface: vlan40-infra
        cidr: "{{ infra_gateway_cidr }}"
        legacy_cidr: 10.57.3.1/24
        comment: pve-test infra_seg gw
    tagged_vlans:
      - 10
      - 20
      - 30
      - 40
    native_vlan_ports:
      - bridgeLocal
      - ether1
      - ether3
      - ether4
      - ether5
      - wifi1
      - wifi2

  pre_tasks:
    - name: Assert MikroTik credentials are present
      ansible.builtin.assert:
        that:
          - mikrotik_user | length > 0
          - mikrotik_password | length > 0
        fail_msg: Set MIKROTIK_USER and MIKROTIK_PASSWORD via with-secrets.

  tasks:
    - name: Read bridge definition
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/interface/bridge"
        method: GET
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        status_code: 200
      register: bridge_result
      no_log: true

    - name: Locate target bridge object
      ansible.builtin.set_fact:
        bridge_obj: >-
          {{
            (bridge_result.json | selectattr('name', 'equalto', bridge_name) | list | first)
            | default({})
          }}

    - name: Assert target bridge exists
      ansible.builtin.assert:
        that:
          - bridge_obj != {}
        fail_msg: Expected bridgeLocal to exist on active MikroTik.

    - name: Read bridge ports
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/interface/bridge/port"
        method: GET
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        status_code: 200
      register: bridge_port_result
      no_log: true

    - name: Locate trunk bridge port object
      ansible.builtin.set_fact:
        trunk_bridge_port_obj: >-
          {{
            (bridge_port_result.json | selectattr('interface', 'equalto', trunk_interface) | list | first)
            | default({})
          }}

    - name: Ensure trunk bridge port remains attached and accepts tagged frames
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/interface/bridge/port/{{ trunk_bridge_port_obj['.id'] }}"
        method: PATCH
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          frame-types: admit-all
          ingress-filtering: "false"
        status_code: [200, 201]
      when:
        - trunk_bridge_port_obj != {}
        - >-
          trunk_bridge_port_obj['frame-types'] | default('') != 'admit-all'
          or trunk_bridge_port_obj['ingress-filtering'] | default('true') != 'false'
      no_log: true

    - name: Read VLAN interfaces
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/interface/vlan"
        method: GET
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        status_code: 200
      register: vlan_result
      no_log: true

    - name: Locate build VLAN object
      ansible.builtin.set_fact:
        build_vlan_obj: >-
          {{
            (vlan_result.json | selectattr('name', 'equalto', build_vlan_name) | list | first)
            | default({})
          }}

    - name: Ensure build VLAN is bound to bridge CPU interface
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/interface/vlan/{{ build_vlan_obj['.id'] }}"
        method: PATCH
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          interface: "{{ bridge_name }}"
          disabled: "false"
        status_code: [200, 201]
      when:
        - build_vlan_obj != {}
        - build_vlan_obj.interface != bridge_name or (build_vlan_obj.disabled | default('false')) == 'true'
      no_log: true

    - name: Read IP addresses
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/ip/address"
        method: GET
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        status_code: 200
      register: ip_result
      no_log: true

    - name: Locate build gateway address object
      ansible.builtin.set_fact:
        build_ip_obj: >-
          {{
            (ip_result.json | selectattr('address', 'equalto', build_gateway_cidr) | list | first)
            | default({})
          }}

    - name: Ensure build gateway remains attached to build VLAN
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/ip/address/{{ build_ip_obj['.id'] }}"
        method: PATCH
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          interface: "{{ build_vlan_name }}"
          disabled: "false"
        status_code: [200, 201]
      when:
        - build_ip_obj != {}
        - build_ip_obj.interface != build_vlan_name or (build_ip_obj.disabled | default('false')) == 'true'
      no_log: true

    - name: Locate migrated gateway address objects
      ansible.builtin.set_fact:
        migrated_gateway_ip_objs: >-
          {{
            (migrated_gateway_ip_objs | default({}))
            | combine({
              (item.name): (
                (ip_result.json | selectattr('address', 'equalto', item.cidr) | list | first)
                | default({})
              )
            })
          }}
      loop: "{{ migrated_gateway_bindings }}"

    - name: Add migrated gateway IP when missing
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/ip/address/add"
        method: POST
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          address: "{{ item.cidr }}"
          interface: "{{ item.interface }}"
          comment: "{{ item.comment }}"
          disabled: "false"
        status_code: [200, 201]
      loop: "{{ migrated_gateway_bindings }}"
      when: migrated_gateway_ip_objs[item.name] == {}
      no_log: true

    - name: Ensure migrated gateway IP is attached to target VLAN
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/ip/address/{{ migrated_gateway_ip_objs[item.name]['.id'] }}"
        method: PATCH
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          interface: "{{ item.interface }}"
          disabled: "false"
          comment: "{{ item.comment }}"
        status_code: [200, 201]
      loop: "{{ migrated_gateway_bindings }}"
      when:
        - migrated_gateway_ip_objs[item.name] != {}
        - >-
          migrated_gateway_ip_objs[item.name].interface != item.interface
          or (migrated_gateway_ip_objs[item.name].disabled | default('false')) == 'true'
      no_log: true

    - name: Read refreshed IP addresses after gateway reconcile
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/ip/address"
        method: GET
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        status_code: 200
      register: refreshed_ip_result
      no_log: true

    - name: Locate legacy migrated gateway address objects
      ansible.builtin.set_fact:
        legacy_gateway_ip_objs: >-
          {{
            (legacy_gateway_ip_objs | default({}))
            | combine({
              (item.name): (
                (refreshed_ip_result.json | selectattr('address', 'equalto', item.legacy_cidr) | list | first)
                | default({})
              )
            })
          }}
      loop: "{{ migrated_gateway_bindings }}"

    - name: Remove legacy migrated gateway addresses
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/ip/address/{{ legacy_gateway_ip_objs[item.name]['.id'] }}"
        method: DELETE
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200, 204]
      loop: "{{ migrated_gateway_bindings }}"
      when: legacy_gateway_ip_objs[item.name] != {}
      no_log: true

    - name: Read bridge VLAN table
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/interface/bridge/vlan"
        method: GET
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        status_code: 200
      register: bridge_vlan_result
      no_log: true

    - name: Add native VLAN 1 bridge entry when missing
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/interface/bridge/vlan/add"
        method: POST
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          bridge: "{{ bridge_name }}"
          vlan-ids: "1"
          untagged: "{{ native_vlan_ports | join(',') }}"
        status_code: [200, 201]
      when: >-
        (bridge_vlan_result.json | selectattr('vlan-ids', 'equalto', '1') | list | length) == 0
      no_log: true

    - name: Add tagged bridge VLAN entries when missing
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/interface/bridge/vlan/add"
        method: POST
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          bridge: "{{ bridge_name }}"
          vlan-ids: "{{ item | string }}"
          tagged: "{{ bridge_name }},{{ trunk_interface }}"
        status_code: [200, 201]
      loop: "{{ tagged_vlans }}"
      when: >-
        (bridge_vlan_result.json | selectattr('vlan-ids', 'equalto', item | string) | list | length) == 0
      no_log: true

    - name: Enable bridge VLAN filtering
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/interface/bridge/{{ bridge_obj['.id'] }}"
        method: PATCH
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          vlan-filtering: "true"
        status_code: [200, 201]
      when: bridge_obj['vlan-filtering'] | default('false') != 'true'
      no_log: true

    - name: Read final bridge state
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/interface/bridge"
        method: GET
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        status_code: 200
      register: final_bridge_result
      no_log: true

    - name: Read final IP addresses
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/ip/address"
        method: GET
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        status_code: 200
      register: final_ip_result
      no_log: true

    - name: Read final bridge VLAN table
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/interface/bridge/vlan"
        method: GET
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        status_code: 200
      register: final_bridge_vlan_result
      no_log: true

    - name: Validate final build trunk model
      ansible.builtin.assert:
        that:
          - final_bridge_obj['vlan-filtering'] == 'true'
          - final_build_vlan_entry != {}
          - trunk_interface in (final_build_vlan_entry.tagged | default(''))
          - bridge_name in (final_build_vlan_entry.tagged | default(''))
          - >-
            (final_ip_result.json | selectattr('address', 'equalto', mgmt_gateway_cidr) | list | length) > 0
          - >-
            (final_ip_result.json | selectattr('address', 'equalto', edge_gateway_cidr) | list | length) > 0
          - >-
            (final_ip_result.json | selectattr('address', 'equalto', infra_gateway_cidr) | list | length) > 0
          - >-
            (final_ip_result.json | selectattr('address', 'equalto', '10.57.1.1/24') | list | length) == 0
          - >-
            (final_ip_result.json | selectattr('address', 'equalto', '10.57.2.1/24') | list | length) == 0
          - >-
            (final_ip_result.json | selectattr('address', 'equalto', '10.57.3.1/24') | list | length) == 0
        fail_msg: VLAN10 trunk model was not reconciled as expected.
        success_msg: VLAN10 trunk model plus mgmt/edge/infra gateway migration reconciled.
      vars:
        final_bridge_obj: >-
          {{
            (final_bridge_result.json | selectattr('name', 'equalto', bridge_name) | list | first)
            | default({})
          }}
        final_build_vlan_entry: >-
          {{
            (final_bridge_vlan_result.json | selectattr('vlan-ids', 'equalto', '10') | list | first)
            | default({})
          }}
