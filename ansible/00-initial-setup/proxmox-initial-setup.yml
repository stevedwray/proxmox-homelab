---
# FILE: ansible/01-base-system/base-config.yml
# Purpose: Base post-install configuration for Proxmox VE 9 (Debian 13 / trixie)
# - Switch to no-subscription repos (deb822)
# - Remove/disable enterprise repos (deb822 + legacy .list)
# - Optional Ceph no-subscription
# - Disable subscription nag popup in Web UI
# - IPv6 host tuning for SLAAC (safe; does NOT touch LXCs)
# - Setup Terraform automation user and API token
# - Idempotent verification that repos are correct

- name: Proxmox VE 9 base configuration
  hosts: "{{ target_hosts | default('proxmox_production') }}"
  become: true
  gather_facts: true

  vars:
    # --- Repository controls ---
    pmx_enable_ceph_repo: true                 # set false if you do not use Ceph on this node
    pmx_repo_suite: "{{ ansible_distribution_release }}"  # should be 'trixie' on PVE 9

    # --- Nag screen controls ---
    pmx_disable_subscription_nag: true

    # --- IPv6 host tuning ---
    pmx_ipv6_tune: true                        # controls sysctl tuning below
    pmx_ipv6_use_tempaddr: 0                   # 0 = stable EUI-64; 2 = prefer temporary
    pmx_ipv6_accept_ra: 2                      # 2 = accept RAs even if forwarding toggles
    pmx_ipv6_autoconf: 1                       # enable SLAAC on host interfaces by default

    # --- Network interface management (SAFE DEFAULT OFF) ---
    # If you want this playbook to write /etc/network/interfaces, set to true and
    # define the variables for your environment. Otherwise nothing is changed.
    pmx_manage_network: false
    pmx_interfaces_path: /etc/network/interfaces

    # Example host network variables (ONLY used when pmx_manage_network: true)
    pmx_primary_iface: "{{ ansible_default_ipv4.interface | default('eth0') }}"
    pmx_ipv4_addr: "192.168.1.10/24"
    pmx_ipv4_gw: "192.168.1.1"

    # --- Terraform automation setup ---
    pmx_setup_terraform_user: true            # set false to skip automation user setup
    pmx_terraform_user: "automation@pve"
    pmx_terraform_token_id: "terraform"
    pmx_terraform_rotate_token: true          # always create fresh token

  pre_tasks:
    - name: Assert Debian 13 (trixie) and Proxmox environment
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Debian'
          - ansible_distribution_major_version | int >= 13
        fail_msg: "This playbook targets Debian 13 (Proxmox VE 9)."
        success_msg: "Debian {{ ansible_distribution_version }} detected; proceeding."

  tasks:
    # ------------------------------
    # Repositories (deb822-first)
    # ------------------------------

    - name: Ensure Debian base repos (deb822)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/debian.sources
        mode: "0644"
        content: |
          Types: deb deb-src
          URIs: https://deb.debian.org/debian/
          Suites: {{ pmx_repo_suite }} {{ pmx_repo_suite }}-updates
          Components: main non-free-firmware
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

          Types: deb deb-src
          URIs: https://security.debian.org/debian-security/
          Suites: {{ pmx_repo_suite }}-security
          Components: main non-free-firmware
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
      notify: Apt-update

    - name: Configure Proxmox no-subscription repo (deb822)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/proxmox.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: http://download.proxmox.com/debian/pve
          Suites: {{ pmx_repo_suite }}
          Components: pve-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
      notify: Apt-update

    - name: Configure Ceph no-subscription repo (deb822)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/ceph.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: http://download.proxmox.com/debian/ceph-squid
          Suites: {{ pmx_repo_suite }}
          Components: no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
      when: pmx_enable_ceph_repo
      notify: Apt-update

    - name: Remove Ceph repo when disabled
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/ceph.sources
        state: absent
      when: not pmx_enable_ceph_repo

    - name: Remove PVE enterprise repo (deb822) if present
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/pve-enterprise.sources
        state: absent

    - name: Comment out enterprise entries in legacy .list files on remote
      ansible.builtin.find:
        paths:
          - /etc/apt
          - /etc/apt/sources.list.d
        patterns: "*.list"
        file_type: file
      register: apt_list_files

    - name: Comment enterprise lines in .list files (cleanup)
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: '^(.*enterprise\.proxmox\.com.*)$'
        replace: '# \1'
      loop: "{{ apt_list_files.files }}"
      when: apt_list_files.matched | int > 0
      failed_when: false

    - name: Remove legacy .list repo files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/pve-no-subscription.list
        - /etc/apt/sources.list.d/ceph-no-subscription.list

    - name: Ensure apt cache is up to date after repo changes
      ansible.builtin.apt:
        update_cache: true
      changed_when: false

    - name: Upgrade all packages after repo switch
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true

    # ------------------------------
    # Disable subscription nag (optional)
    # ------------------------------

    - name: Check for subscription nag marker (PVE 8/9 JS pattern)
      ansible.builtin.shell: >
        grep -q "res.data.status.toLowerCase() !== 'active'"
        /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
      register: nag_check
      changed_when: false
      failed_when: false
      when: pmx_disable_subscription_nag

    - name: Disable subscription nag screen (surgical replace)
      ansible.builtin.replace:
        path: /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
        regexp: "res\\.data\\.status\\.toLowerCase\\(\\) !== 'active'"
        replace: "false"
        backup: true
      when:
        - pmx_disable_subscription_nag
        - nag_check is defined and nag_check.rc == 0
      notify: Restart pveproxy

    # ------------------------------
    # Terraform automation user setup
    # ------------------------------

    - name: Create Terraform automation user
      ansible.builtin.command: >
        pveum user add {{ pmx_terraform_user }} --comment "Terraform automation account"
      register: _terraform_user_add
      failed_when: _terraform_user_add.rc not in [0, 2]
      changed_when: _terraform_user_add.rc == 0
      when: pmx_setup_terraform_user

    - name: Grant Administrator role to Terraform user
      ansible.builtin.command: >
        pveum aclmod / -user {{ pmx_terraform_user }} -role Administrator
      register: _terraform_user_acl
      failed_when: _terraform_user_acl.rc != 0
      changed_when: false
      when: pmx_setup_terraform_user

    - name: List existing tokens for Terraform user
      ansible.builtin.command: >
        pveum user token list {{ pmx_terraform_user }} --output-format json
      register: _terraform_token_list
      changed_when: false
      when: pmx_setup_terraform_user

    - name: Check if Terraform token exists
      ansible.builtin.set_fact:
        terraform_token_exists: >-
          {{ (_terraform_token_list.stdout | from_json) | selectattr('tokenid', 'equalto', pmx_terraform_token_id) | list | length > 0 }}
      when: pmx_setup_terraform_user

    - name: Remove existing Terraform token (rotation enabled)
      ansible.builtin.command: >
        pveum user token remove {{ pmx_terraform_user }} {{ pmx_terraform_token_id }}
      register: _terraform_token_rm
      failed_when: _terraform_token_rm.rc not in [0, 2]
      changed_when: _terraform_token_rm.rc == 0
      when:
        - pmx_setup_terraform_user
        - terraform_token_exists
        - pmx_terraform_rotate_token

    - name: Create Terraform API token (privsep=0)
      ansible.builtin.command: >
        pveum user token add {{ pmx_terraform_user }} {{ pmx_terraform_token_id }} --privsep 0 --output-format json
      register: _terraform_token_add
      changed_when: true
      when:
        - pmx_setup_terraform_user
        - (not terraform_token_exists) or pmx_terraform_rotate_token

    - name: Parse Terraform token details
      ansible.builtin.set_fact:
        terraform_api_token_id: "{{ pmx_terraform_user }}!{{ pmx_terraform_token_id }}"
        terraform_api_token_secret: "{{ (_terraform_token_add.stdout | from_json).value | default('') }}"
      no_log: true
      when:
        - pmx_setup_terraform_user
        - _terraform_token_add is defined
        - _terraform_token_add.stdout is defined

    - name: Display Terraform API token information
      ansible.builtin.debug:
        msg:
          - "*** SAVE THIS SECRET NOW - it cannot be retrieved again ***"
          - "Terraform API Token ID: {{ terraform_api_token_id | default('Not created') }}"
          - "Terraform API Token Secret: {{ terraform_api_token_secret | default('Not available') }}"
          - ""
          - "Add these to your Terraform configuration or Bitwarden:"
          - "TF_VAR_pm_api_token_id={{ terraform_api_token_id | default('') }}"
          - "TF_VAR_pm_api_token_secret={{ terraform_api_token_secret | default('') }}"
      when: pmx_setup_terraform_user

    # ------------------------------
    # IPv6 host tuning for SLAAC (does not touch LXCs)
    # ------------------------------

    - name: Apply IPv6 sysctl tuning for SLAAC (host only)
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-proxmox-ipv6-slaac.conf
        mode: "0644"
        content: |
          # FILE: /etc/sysctl.d/99-proxmox-ipv6-slaac.conf
          # Purpose: Ensure host accepts Router Advertisements and uses SLAAC
          net.ipv6.conf.all.accept_ra = {{ pmx_ipv6_accept_ra }}
          net.ipv6.conf.default.accept_ra = {{ pmx_ipv6_accept_ra }}
          net.ipv6.conf.all.autoconf = {{ pmx_ipv6_autoconf }}
          net.ipv6.conf.default.autoconf = {{ pmx_ipv6_autoconf }}
          net.ipv6.conf.all.use_tempaddr = {{ pmx_ipv6_use_tempaddr }}
          net.ipv6.conf.default.use_tempaddr = {{ pmx_ipv6_use_tempaddr }}
      when: pmx_ipv6_tune

    - name: Reload sysctl settings
      ansible.builtin.command: sysctl --system
      when: pmx_ipv6_tune
      changed_when: false

    # ------------------------------
    # Optional: manage /etc/network/interfaces (SAFE DEFAULT OFF)
    # ------------------------------

    - name: Write /etc/network/interfaces for static IPv4 + SLAAC IPv6
      ansible.builtin.copy:
        dest: "{{ pmx_interfaces_path }}"
        mode: "0644"
        content: |
          # FILE: {{ pmx_interfaces_path }}
          # Managed by Ansible — static IPv4, SLAAC IPv6
          source /etc/network/interfaces.d/*

          auto lo
          iface lo inet loopback

          auto {{ pmx_primary_iface }}
          iface {{ pmx_primary_iface }} inet static
            address {{ pmx_ipv4_addr }}
            gateway {{ pmx_ipv4_gw }}

          iface {{ pmx_primary_iface }} inet6 auto
            accept_ra {{ pmx_ipv6_accept_ra }}
            autoconf {{ pmx_ipv6_autoconf }}
            # use_tempaddr {{ pmx_ipv6_use_tempaddr }}
      when: pmx_manage_network
      notify: Ifreload

    # ------------------------------
    # Verification (fail loud if wrong)
    # ------------------------------

    - name: Ensure apt cache is up to date (verification)
      ansible.builtin.apt:
        update_cache: true
      changed_when: false

    - name: Verify PVE repository configuration
      ansible.builtin.command: apt-cache policy proxmox-ve
      register: apt_policy_pve
      changed_when: false
      failed_when: false

    - name: Verify Ceph repository configuration (ceph-common)
      ansible.builtin.command: apt-cache policy ceph-common
      register: apt_policy_ceph
      changed_when: false
      failed_when: false

    - name: Search for active enterprise repo references (ignore commented lines, skip backups)
      ansible.builtin.shell: |
        set -euo pipefail
        find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) \
          ! -regex '.*(~|@[0-9]{4}-.*)$' -print0 \
        | xargs -0 grep -Hn -E '^[[:space:]]*[^#].*enterprise\.proxmox\.com' || true
      register: enterprise_refs
      changed_when: false

    - name: Repository status summary
      ansible.builtin.debug:
        msg:
          - "PVE policy:\n{{ apt_policy_pve.stdout | default('') }}"
          - "Ceph policy:\n{{ apt_policy_ceph.stdout | default('') }}"
          - "Enterprise refs (should be empty):\n{{ enterprise_refs.stdout | default('') }}"

    - name: Assert PVE no-subscription is active
      ansible.builtin.assert:
        that:
          - "'download.proxmox.com' in (apt_policy_pve.stdout | default(''))"
        fail_msg: "PVE repo is not pointing at download.proxmox.com (no-subscription)!"
        success_msg: "PVE repo OK (download.proxmox.com detected)."

    - name: Assert Ceph no-subscription is active (skip if ceph-common unknown)
      ansible.builtin.assert:
        that:
          - "apt_policy_ceph.rc != 0 or 'download.proxmox.com' in (apt_policy_ceph.stdout | default(''))"
        fail_msg: "Ceph repo not pointing at download.proxmox.com (no-subscription)!"
        success_msg: "Ceph repo OK or Ceph not configured."

    - name: Assert enterprise repos are gone
      ansible.builtin.assert:
        that:
          - "(enterprise_refs.stdout | default('')) == ''"
        fail_msg: "Enterprise repository references still present!"
        success_msg: "No enterprise repository references found."

    - name: Verify Terraform user permissions (when enabled)
      ansible.builtin.command: >
        pveum user permissions {{ pmx_terraform_user }} --output-format json
      register: _terraform_perms_check
      changed_when: false
      failed_when: false
      when: pmx_setup_terraform_user

    - name: Assert Terraform user has proper permissions
      ansible.builtin.assert:
        that:
          - "'VM.Allocate' in (_terraform_perms_check.stdout | default(''))"
          - "'Datastore.AllocateSpace' in (_terraform_perms_check.stdout | default(''))"
        fail_msg: "Terraform user missing required permissions!"
        success_msg: "Terraform user permissions verified."
      when: pmx_setup_terraform_user

  handlers:
    - name: Apt-update
      ansible.builtin.apt:
        update_cache: true

    - name: Restart pveproxy
      ansible.builtin.systemd:
        name: pveproxy
        state: restarted

    - name: Ifreload
      ansible.builtin.command: ifreload -a
      changed_when: true
