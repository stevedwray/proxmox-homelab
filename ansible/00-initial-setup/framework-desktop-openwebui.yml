---
# Deploys OpenWebUI and its private SearXNG search backend on the Framework
# Desktop. This is the bare-metal replacement for ai-services-stack; the old
# Terraform/LXC playbook remains untouched pending Phase 8 cleanup.
#
# Run with common secrets loaded:
#   PVE_ENV= ./with-secrets ansible-playbook -i ansible/inventory/ \
#     ansible/00-initial-setup/framework-desktop-openwebui.yml

- name: Install Docker and deploy OpenWebUI with SearXNG
  hosts: framework
  become: true
  gather_facts: true

  vars:
    framework_openwebui_dir: /opt/openwebui-docker
    framework_openwebui_data_dir: /mnt/container-storage/openwebui-data
    framework_searxng_data_dir: /mnt/container-storage/searxng-data
    # Pinned by digest rather than :main/:latest -- floating tags gave no
    # reproducibility or controlled upgrade path (a routine `docker compose
    # pull` could silently change behavior, as happened with OpenWebUI's own
    # native-function-calling default -- see decisions.md). These are the
    # exact digests already validated end-to-end on this host as of
    # 2026-07-23: open-webui v0.10.2, searxng 2026.7.19+6da6eee26. To
    # deliberately upgrade: pull the new tag, capture its RepoDigest
    # (`docker inspect <image> --format '{{.RepoDigests}}'`), update the pin
    # below, `--syntax-check`, redeploy, then re-verify per plan.md Phase 6.
    framework_openwebui_image: "harbor.lab.gibbsgreatly.xyz/ghcr/open-webui/open-webui@sha256:a26effeb220e132482bf7e0560b3404843e7bc40d23051144e062960df8df6b0"  # v0.10.2
    framework_searxng_image: "harbor.lab.gibbsgreatly.xyz/dockerhub/searxng/searxng@sha256:b8ca38ba06eea544d7555e88321e212ddc0d5c3c7de055419cfb2e5c6bf30812"  # 2026.7.19+6da6eee26
    # Host port 8080 belongs to the retained llamacpp-router dev backend.
    # Traefik is the public entry point, so OpenWebUI uses an unambiguous
    # host-side port while continuing to listen on 8080 in its container.
    framework_openwebui_port: 8081
    framework_lab_domain: "{{ lookup('env', 'LAB_DOMAIN') | default('lab.gibbsgreatly.xyz', true) }}"
    framework_authentik_fqdn: "{{ lookup('env', 'LAB_FQDN_AUTHENTIK') | default('authentik.' ~ framework_lab_domain, true) }}"
    framework_openwebui_oidc_client_id: "{{ lookup('env', 'OPENWEBUI_OIDC_CLIENT_ID') | default('openwebui', true) }}"
    framework_openwebui_oidc_client_secret: >-
      {{ lookup('env', 'OPENWEBUI_OIDC_CLIENT_SECRET')
         | mandatory('OPENWEBUI_OIDC_CLIENT_SECRET env var is required') }}
    framework_openwebui_lmstudio_api_base: "https://llm.{{ framework_lab_domain }}/v1"
    framework_openwebui_llamacpp_api_base: "http://host.docker.internal:8080/v1"  # NOSONAR: same-host Docker gateway
    framework_openwebui_ollama_api_base: "http://host.docker.internal:11434"  # NOSONAR: same-host Docker gateway
    framework_openwebui_llm_api_key: "{{ lookup('env', 'LLM_GPU_STACK_API_KEY') | mandatory('LLM_GPU_STACK_API_KEY env var is required') }}"
    # Explicitly managed rather than left to OpenWebUI's own auto-generate-
    # and-store-in-the-data-dir default: signs sessions/JWTs, so a fresh
    # data dir on a rebuilt host must not silently mint a new one and log
    # everyone out. Value is the key already in live use, promoted into
    # secrets.common.enc.yaml rather than rotated, to avoid invalidating
    # current sessions.
    framework_openwebui_webui_secret_key: "{{ lookup('env', 'OPENWEBUI_WEBUI_SECRET_KEY') | mandatory('OPENWEBUI_WEBUI_SECRET_KEY env var is required') }}"
    framework_searxng_secret_key: "{{ lookup('env', 'SEARXNG_SECRET_KEY') | mandatory('SEARXNG_SECRET_KEY env var is required') }}"
    framework_searxng_query_url: "http://searxng:8080/search?q=<query>&format=json"  # NOSONAR: internal-only Docker network
    framework_searxng_base_url: "http://searxng:8080/"  # NOSONAR: ansible:S5332 - internal-only Docker network; SearXNG has no published host port

  pre_tasks:
    - name: Refuse test-domain configuration on the production Framework host
      ansible.builtin.assert:
        that:
          - framework_lab_domain == 'lab.gibbsgreatly.xyz'
          - framework_authentik_fqdn == 'authentik.lab.gibbsgreatly.xyz'
        fail_msg: >-
          Framework requires the production lab domain. Run this playbook with
          common secrets only: PVE_ENV= ./with-secrets ansible-playbook ...

  tasks:
    - name: Install Docker and Compose plugin
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true

    - name: Ensure docker service is enabled and running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Create OpenWebUI compose and persistent data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ framework_openwebui_dir }}"
        - "{{ framework_openwebui_data_dir }}"
        - "{{ framework_searxng_data_dir }}"

    - name: Seed SearXNG settings with JSON output enabled
      ansible.builtin.copy:
        dest: "{{ framework_searxng_data_dir }}/settings.yml"
        mode: "0644"
        force: false
        content: |
          use_default_settings: true
          server:
            secret_key: "{{ framework_searxng_secret_key }}"
          search:
            formats:
              - html
              - json

    - name: Install OpenWebUI docker-compose.yml
      ansible.builtin.copy:
        dest: "{{ framework_openwebui_dir }}/docker-compose.yml"
        mode: "0640"
        content: |
          services:
            openwebui:
              image: {{ framework_openwebui_image }}
              container_name: openwebui
              restart: unless-stopped
              ports:
                - "{{ framework_openwebui_port }}:8080"
              extra_hosts:
                - "host.docker.internal:host-gateway"
              volumes:
                - {{ framework_openwebui_data_dir }}:/app/backend/data
              environment:
                WEBUI_SECRET_KEY: "{{ framework_openwebui_webui_secret_key }}"
                ENABLE_OPENAI_API: "true"
                ENABLE_OLLAMA_API: "true"
                OPENAI_API_BASE_URLS: "{{ framework_openwebui_lmstudio_api_base }};{{ framework_openwebui_llamacpp_api_base }}"
                OPENAI_API_KEYS: "{{ framework_openwebui_llm_api_key }};{{ framework_openwebui_llm_api_key }}"
                OLLAMA_BASE_URL: "{{ framework_openwebui_ollama_api_base }}"
                WEBUI_URL: "https://openwebui.{{ framework_lab_domain }}"
                ENABLE_OAUTH_SIGNUP: "true"
                OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
                OAUTH_CLIENT_ID: "{{ framework_openwebui_oidc_client_id }}"
                OAUTH_CLIENT_SECRET: "{{ framework_openwebui_oidc_client_secret }}"
                OPENID_PROVIDER_URL: "https://{{ framework_authentik_fqdn }}/application/o/edge-ai-services-stack-openwebui/.well-known/openid-configuration"
                OAUTH_PROVIDER_NAME: "Authentik"
                OAUTH_SCOPES: "openid email profile"
                ENABLE_WEB_SEARCH: "true"
                WEB_SEARCH_ENGINE: "searxng"
                SEARXNG_QUERY_URL: "{{ framework_searxng_query_url }}"
              depends_on:
                searxng:
                  condition: service_healthy
              logging:
                driver: json-file
                options:
                  max-size: "10m"
                  max-file: "3"

            searxng:
              image: {{ framework_searxng_image }}
              container_name: searxng
              restart: unless-stopped
              volumes:
                - {{ framework_searxng_data_dir }}:/etc/searxng
              environment:
                SEARXNG_BASE_URL: "{{ framework_searxng_base_url }}"
              healthcheck:
                test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/search?q=test&format=json"]
                interval: 30s
                timeout: 5s
                retries: 3
                start_period: 15s
              logging:
                driver: json-file
                options:
                  max-size: "10m"
                  max-file: "3"

    - name: Bring up OpenWebUI and SearXNG via docker compose
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ framework_openwebui_dir }}"
      register: framework_openwebui_up
      changed_when: >-
        'Started' in framework_openwebui_up.stderr or
        'Created' in framework_openwebui_up.stderr

    - name: Reconcile infrastructure-managed OpenWebUI connection settings
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - openwebui
          - python
          - -c
          - |
            import json
            import os
            import sqlite3
            import time

            database = "/app/backend/data/webui.db"
            backup = f"{database}.phase6-pre-connection-fix"
            connection = sqlite3.connect(database)
            openai_base_urls = os.environ["OPENAI_API_BASE_URLS"].split(";")
            openai_api_keys = os.environ["OPENAI_API_KEYS"].split(";")
            desired = {
                "openai.enable": json.dumps(True),
                "openai.api_base_urls": json.dumps(
                    openai_base_urls, separators=(",", ":")
                ),
                "openai.api_keys": json.dumps(
                    openai_api_keys, separators=(",", ":")
                ),
                "ollama.enable": json.dumps(True),
                "ollama.base_urls": json.dumps(
                    [os.environ["OLLAMA_BASE_URL"]], separators=(",", ":")
                ),
                "web.search.enable": json.dumps(True),
                "web.search.engine": json.dumps("searxng"),
                "web.search.searxng_query_url": json.dumps(
                    os.environ["SEARXNG_QUERY_URL"]
                ),
                "webui.url": json.dumps(os.environ["WEBUI_URL"]),
            }
            pending = []
            for key, value in desired.items():
                row = connection.execute(
                    "SELECT value FROM config WHERE key = ?", (key,)
                ).fetchone()
                if row is None or row[0] != value:
                    pending.append((key, value))

            if pending:
                if not os.path.exists(backup):
                    backup_connection = sqlite3.connect(backup)
                    connection.backup(backup_connection)
                    backup_connection.close()
                    os.chmod(backup, 0o600)

                updated_at = int(time.time())
                connection.executemany(
                    """
                    INSERT INTO config (key, value, updated_at)
                    VALUES (?, ?, ?)
                    ON CONFLICT(key) DO UPDATE SET
                      value = excluded.value,
                      updated_at = excluded.updated_at
                    """,
                    [(key, value, updated_at) for key, value in pending],
                )
                connection.commit()

            connection.close()
            print(json.dumps({
                "changed": bool(pending),
                "keys": [key for key, _value in pending],
            }))
      register: framework_openwebui_connection_reconcile
      changed_when: >-
        (framework_openwebui_connection_reconcile.stdout | from_json).changed

    - name: Restart OpenWebUI after connection settings change
      ansible.builtin.command: docker compose restart openwebui
      args:
        chdir: "{{ framework_openwebui_dir }}"
      when: framework_openwebui_connection_reconcile.changed
      changed_when: true

    - name: Wait for OpenWebUI after connection reconciliation
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ framework_openwebui_port }}/"
        status_code: 200
      register: framework_openwebui_health
      retries: 30
      delay: 2
      until: framework_openwebui_health.status == 200

    - name: Verify OpenWebUI can discover models from all managed LLM routes
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - openwebui
          - python
          - -c
          - |
            import json
            import os
            import urllib.request

            discovered = {}
            openai_base_urls = os.environ["OPENAI_API_BASE_URLS"].split(";")
            openai_api_keys = os.environ["OPENAI_API_KEYS"].split(";")
            for base_url, api_key in zip(openai_base_urls, openai_api_keys):
                request = urllib.request.Request(
                    f"{base_url}/models",
                    headers={"Authorization": f"Bearer {api_key}"},
                )
                with urllib.request.urlopen(request, timeout=15) as response:
                    discovered[base_url] = [
                        model.get("id")
                        for model in json.load(response).get("data", [])
                        if model.get("id")
                    ]

            with urllib.request.urlopen(
                f"{os.environ['OLLAMA_BASE_URL']}/api/tags", timeout=15
            ) as response:
                discovered[os.environ["OLLAMA_BASE_URL"]] = [
                    model.get("name")
                    for model in json.load(response).get("models", [])
                    if model.get("name")
                ]

            empty_routes = [
                base_url for base_url, models in discovered.items() if not models
            ]
            if empty_routes:
                raise SystemExit(f"managed LLM routes returned no models: {empty_routes}")
            print(json.dumps({"models": discovered}))
      changed_when: false
