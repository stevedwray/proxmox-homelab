---
# Framework Desktop: llama-swap as the model control page, per
# docs/llama-swap/plan.md.
#
#   llama-swap.service  :8099  web UI + API, no login of its own. Users log in
#     through Authentik at https://llm-control.<lab domain> (Traefik route in
#     terraform/lxc/stacks/llm-gpu-stack/edge.yaml). files/llama-swap/llama-swap.nft
#     lets only Traefik and framework itself reach :8099.
#     -> starts one llama-server at a time on the normal 0.0.0.0:8080, using
#        the build, model and flags in /home/steve/llama-swap/config.yaml
#
# Clients keep using llama-server on :8080 directly; they never go through
# llama-swap, so only the control page switches models.
#
# The config is WRITTEN by `llama-builds swap-config` (framework-desktop-llama-builds.yml,
# run that first) from the model catalogue files/llama-swap/models.json and
# the builds on disk: one entry per model and backend (docs/llama-swap/plan.md,
# phase 4). Don't edit it by hand; edit models.json and run
# `llama-builds swap-config`. This playbook writes it only if it is missing.
#
# The boot default (models.json "default") is loaded by
# llama-swap-preload.service, not a preload hook in the config: the hook also
# fires on every config reload and would load over whatever was loaded.
#
# Phase 1 (default): installs and starts llama-swap idle. Touches nothing
# else -- the hand-run GLM on :8080 and nathanw-llamacpp.service are left
# alone, and no model is loaded.
#
# Phase 2 (-e framework_llama_swap_cutover=true): also stops the hand-run
# GLM llama-server and stops + disables nathanw-llamacpp.service (unit file
# kept). :8080 is then free for a model loaded from the control page.
# nathanw-llamacpp-embed.service (:8085) is never touched.
#
# A changed binary, env file or unit restarts llama-swap, which stops the
# model it started. Don't re-run it during a benchmark.
#
# Stop (docs/llama-swap/plan.md, "Rollback"): run this playbook with
# -e framework_llama_swap_enabled=false. llama-swap was adopted on 2026-10-09
# and the old nathanw-llamacpp.service chat unit is gone, so stopping it
# leaves :8080 empty. Rolling back a llama.cpp build is `llama-builds
# rollback <backend>` instead (framework-desktop-llama-builds.yml).
#
# Run (same OpenBao profile as framework-desktop-llamacpp-native.yml):
#   TASK_APPROVAL=<task> ./with-secrets-prod ansible-playbook \
#     -i ansible/inventory/inventory.yml \
#     ansible/00-initial-setup/framework-desktop-llama-swap.yml

- name: Manage llama-swap on the Framework Desktop
  hosts: framework
  become: true
  gather_facts: false

  vars:
    framework_llama_swap_enabled: true
    framework_llama_swap_cutover: false
    framework_llama_swap_version: "260"
    framework_llama_swap_sha256: d856a908507560cbdc253300bcf49092c7ead3c85098687428b0c9d4832ff46d
    framework_llama_swap_tarball: "llama-swap_{{ framework_llama_swap_version }}_linux_amd64.tar.gz"
    framework_llama_swap_url: "https://github.com/mostlygeek/llama-swap/releases/download/v{{ framework_llama_swap_version }}/{{ framework_llama_swap_tarball }}"
    framework_llama_swap_install_dir: "/opt/llama-swap/{{ framework_llama_swap_version }}"
    framework_llama_swap_bin: /usr/local/bin/llama-swap
    framework_llama_swap_user: steve
    framework_llama_swap_config_dir: /home/steve/llama-swap
    framework_llama_swap_config: /home/steve/llama-swap/config.yaml
    framework_llama_swap_etc_dir: /etc/llama-swap
    framework_llama_swap_nft: /etc/llama-swap/llama-swap.nft
    framework_llama_swap_port: 8099
    framework_llama_swap_model_port: 8080
    framework_llama_swap_required_paths:
      # Builds managed by framework-desktop-llama-builds.yml (run it, and
      # build fork + upstream, first). Candidate and HIP builds are optional.
      - /storage/llama-builds/fork/current/bin/llama-server
      - /storage/llama-builds/upstream/current/bin/llama-server
      - /usr/local/bin/llama-builds
      - /etc/llama-builds/models.json

  tasks:
    - name: Rollback -- stop llama-swap and hand :8080 back
      when: not framework_llama_swap_enabled | bool
      block:
        - name: Stop and disable llama-swap (its llama-server children stop with it)
          ansible.builtin.systemd_service:
            name: llama-swap.service
            state: stopped
            enabled: false

        - name: Wait for port 8080 to be free
          ansible.builtin.wait_for:
            port: "{{ framework_llama_swap_model_port }}"
            state: stopped
            timeout: 120

        - name: Stop here -- :8080 is now empty (the old chat unit was retired 2026-10-09)
          ansible.builtin.meta: end_host

    - name: Check the builds, llama-builds and the model catalogue exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ framework_llama_swap_required_paths }}"
      register: framework_llama_swap_paths

    - name: Fail if any required file is missing
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "{{ item.item }} is missing."
      loop: "{{ framework_llama_swap_paths.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Create the versioned install directory
      ansible.builtin.file:
        path: "{{ framework_llama_swap_install_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download the llama-swap release (checksum pinned)
      ansible.builtin.get_url:
        url: "{{ framework_llama_swap_url }}"
        dest: "{{ framework_llama_swap_install_dir }}/llama-swap.tar.gz"
        checksum: "sha256:{{ framework_llama_swap_sha256 }}"
        owner: root
        group: root
        mode: "0644"

    - name: Unpack the llama-swap binary
      ansible.builtin.unarchive:
        src: "{{ framework_llama_swap_install_dir }}/llama-swap.tar.gz"
        dest: "{{ framework_llama_swap_install_dir }}"
        remote_src: true
        include:
          - llama-swap
        creates: "{{ framework_llama_swap_install_dir }}/llama-swap"

    - name: Point /usr/local/bin/llama-swap at this version
      ansible.builtin.file:
        src: "{{ framework_llama_swap_install_dir }}/llama-swap"
        dest: "{{ framework_llama_swap_bin }}"
        state: link
        force: true
      notify: Restart llama-swap

    - name: Install llm-memgate (memory pre-flight for each model start)
      ansible.builtin.copy:
        src: files/llama-swap/llm-memgate
        dest: /usr/local/bin/llm-memgate
        owner: root
        group: root
        mode: "0755"

    - name: Create the config directory
      ansible.builtin.file:
        path: "{{ framework_llama_swap_config_dir }}"
        state: directory
        owner: "{{ framework_llama_swap_user }}"
        group: "{{ framework_llama_swap_user }}"
        mode: "0755"

    # Only when missing (a fresh install: nothing can be loaded yet, hence
    # --force). Otherwise llama-builds owns it; see the header.
    - name: Write the config from the model catalogue (only if missing)
      ansible.builtin.command:
        argv: [/usr/local/bin/llama-builds, swap-config, --force]
        creates: "{{ framework_llama_swap_config }}"
      become_user: "{{ framework_llama_swap_user }}"

    - name: Create /etc/llama-swap
      ansible.builtin.file:
        path: "{{ framework_llama_swap_etc_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write the :8099 firewall table (Traefik + localhost only)
      ansible.builtin.copy:
        src: files/llama-swap/llama-swap.nft
        dest: "{{ framework_llama_swap_nft }}"
        owner: root
        group: root
        mode: "0644"
      register: framework_llama_swap_nft_file

    # Loaded now, before the login is removed below, so :8099 is never open
    # without it. llama-swap.service reloads it on every start.
    - name: Load the :8099 firewall table
      ansible.builtin.command:
        argv: [nft, -f, "{{ framework_llama_swap_nft }}"]
      changed_when: framework_llama_swap_nft_file.changed

    - name: Validate the live config
      ansible.builtin.command:
        argv:
          - "{{ framework_llama_swap_bin }}"
          - -config
          - "{{ framework_llama_swap_config }}"
          - -validate
      changed_when: false

    - name: Write the llama-swap unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/llama-swap.service
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by proxmox-homelab ansible/00-initial-setup/framework-desktop-llama-swap.yml -- do not edit by hand
          [Unit]
          Description=llama-swap -- llama.cpp model control page, port {{ framework_llama_swap_port }} (models on {{ framework_llama_swap_model_port }})
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User={{ framework_llama_swap_user }}
          # "+" runs as root: only the firewall step needs it.
          ExecStartPre=+/usr/sbin/nft -f {{ framework_llama_swap_nft }}
          ExecStart={{ framework_llama_swap_bin }} -config {{ framework_llama_swap_config }} -listen 0.0.0.0:{{ framework_llama_swap_port }} -watch-config
          # on-failure, as nathanw-llamacpp.service: a deliberate stop stays stopped.
          Restart=on-failure
          RestartSec=5
          # Stopping llama-swap also stops every llama-server it started.
          KillMode=control-group
          TimeoutStopSec=90
          ExecStopPost=+/usr/sbin/nft delete table inet llama_swap

          [Install]
          WantedBy=multi-user.target
      notify: Restart llama-swap

    # Phase 2 only. The pkill pattern matches the hand-run GLM (started with
    # -m first), never a llama-server that llama-swap started (--host first).
    - name: Cutover -- free :8080 for models loaded from llama-swap
      when: framework_llama_swap_cutover | bool
      block:
        - name: Stop and disable nathanw-llamacpp.service (unit file kept for rollback)
          ansible.builtin.systemd_service:
            name: nathanw-llamacpp.service
            state: stopped
            enabled: false

        - name: Stop the hand-run upstream llama-server (GLM-5.3-Flash evaluation)
          ansible.builtin.command:
            argv:
              - pkill
              - -TERM
              - -f
              - "^/home/steve/llama.cpp-upstream/build-vk/bin/llama-server -m /mnt/nvme2/models-gguf/glm-5.3-flash/"
          register: framework_llama_swap_pkill
          changed_when: framework_llama_swap_pkill.rc == 0
          failed_when: framework_llama_swap_pkill.rc not in [0, 1]

        - name: Wait for port 8080 to be free
          ansible.builtin.wait_for:
            port: "{{ framework_llama_swap_model_port }}"
            state: stopped
            timeout: 120
          when: framework_llama_swap_pkill.rc == 0

    - name: Enable and start llama-swap
      ansible.builtin.systemd_service:
        name: llama-swap.service
        enabled: true
        state: started
        daemon_reload: true

    # Loads models.json's default at boot if nothing is loaded. Enabled, not
    # started here: this playbook never loads a model.
    - name: Write the boot preload unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/llama-swap-preload.service
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by proxmox-homelab ansible/00-initial-setup/framework-desktop-llama-swap.yml -- do not edit by hand
          [Unit]
          Description=Load the default model in llama-swap at boot (llama-builds preload)
          After=llama-swap.service
          Requires=llama-swap.service

          [Service]
          Type=oneshot
          User={{ framework_llama_swap_user }}
          ExecStart=/usr/local/bin/llama-builds preload
          # The biggest models take minutes to load from NVMe.
          TimeoutStartSec=1000

          [Install]
          WantedBy=multi-user.target

    - name: Enable the boot preload (not started now)
      ansible.builtin.systemd_service:
        name: llama-swap-preload.service
        enabled: true
        daemon_reload: true

    - name: Flush handlers so a changed binary or unit takes effect
      ansible.builtin.meta: flush_handlers

    - name: Wait for llama-swap's /health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ framework_llama_swap_port }}/health"
        status_code: 200
      register: framework_llama_swap_health
      until: framework_llama_swap_health.status == 200
      retries: 30
      delay: 2

    - name: Check the :8099 firewall table is loaded
      ansible.builtin.command:
        argv: [nft, list, table, inet, llama_swap]
      changed_when: false

    # Listing models does not load one. No model is loaded by this playbook.
    - name: Check llama-swap lists its models
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ framework_llama_swap_port }}/v1/models"
        return_content: true
        status_code: 200
      register: framework_llama_swap_models
      failed_when: framework_llama_swap_models.json.data | length == 0

    - name: Show the model IDs llama-swap serves
      ansible.builtin.debug:
        msg: "{{ framework_llama_swap_models.json.data | map(attribute='id') | list }}"

  handlers:
    - name: Restart llama-swap
      ansible.builtin.systemd_service:
        name: llama-swap.service
        state: restarted
        daemon_reload: true
