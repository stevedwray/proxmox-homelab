---
# Framework Desktop native llama.cpp servers -- the Nathanw Strix-Halo fork,
# native Vulkan build at /home/steve/llama.cpp/build-vk. This is the
# platform's LLM serving layer now that Ollama is gone from framework
# (docs/framework-ip-and-port/plan.md, Phase C).
#
#   nathanw-llamacpp.service        chat/completions  :8080  API key required
#   nathanw-llamacpp-embed.service  embeddings        :8085  no key (reached only
#                                                     from ai_seg via MikroTik)
#
# Takes over the hand-written /etc/systemd/system/nathanw-llamacpp.service
# in place (same unit name). Flags carried over from it unchanged:
# -m, --host 0.0.0.0, --port 8080, --ctx-size, --n-gpu-layers 999, and no
# --parallel (auto: 4 slots sharing one unified KV cache -- setting
# --parallel explicitly can split the context per slot, so it is left out).
# Added: --alias (stable model name for clients instead of the GGUF path),
# --metrics (Prometheus endpoint, replaces the Ollama textfile collector)
# and --api-key-file (LLM_GPU_STACK_API_KEY, the key the Traefik
# llm.${LAB_DOMAIN} route and OpenWebUI already use).
#
# Memory: framework is a 122GB unified-memory APU and the chat model is
# ~111GB resident. The embeddings model is ~0.3GB. The pre-flight refuses to
# change anything unless MemAvailable is above
# framework_llamacpp_min_available_mb. Restarting the chat unit is a stop
# then a start of the same model (never two copies at once).
#
# Run (framework is not a Proxmox production node, so plain ./with-secrets):
#   PVE_ENV= ./with-secrets ansible-playbook -i ansible/inventory/inventory.yml \
#     ansible/00-initial-setup/framework-desktop-llamacpp-native.yml

- name: Manage native llama.cpp servers on the Framework Desktop
  hosts: framework
  become: true
  gather_facts: false

  vars:
    framework_llamacpp_user: steve
    framework_llamacpp_bin: /home/steve/llama.cpp/build-vk/bin/llama-server
    framework_llamacpp_workdir: /home/steve/llama.cpp/build-vk/bin
    framework_llamacpp_log_dir: /home/steve/llamacpp-native-test
    framework_llamacpp_key_dir: /etc/llamacpp
    framework_llamacpp_key_file: /etc/llamacpp/api-key
    framework_llamacpp_api_key: "{{ lookup('env', 'LLM_GPU_STACK_API_KEY') | mandatory('LLM_GPU_STACK_API_KEY env var is required') }}"
    framework_llamacpp_min_available_mb: 4096

    framework_llamacpp_chat_model: /mnt/nvme2/models-gguf/qwen3.8-flash-next-q4/UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf
    framework_llamacpp_chat_alias: qwen3.8-flash-next
    framework_llamacpp_chat_port: 8080
    # Total KV context shared by all slots. 8192 is what the hand-written
    # unit ran with. Raise it only to a value measured per plan.md
    # "Operator: measure chat context".
    framework_llamacpp_chat_ctx_size: 8192

    framework_llamacpp_embed_model: /mnt/nvme2/models-gguf/nomic-embed-text-v1.5/nomic-embed-text-v1.5.f16.gguf
    framework_llamacpp_embed_alias: nomic-embed-text
    framework_llamacpp_embed_port: 8085
    # One slot, 2048 tokens: nomic-embed-text-v1.5's training context, and
    # above docs-rag-mcp's ~1500-token chunk cap (chunking.py
    # MAX_CHUNK_TOKENS). Each chunk is one ubatch.
    framework_llamacpp_embed_ctx_size: 2048

  tasks:
    - name: Check the llama-server binary and both model files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ framework_llamacpp_bin }}"
        - "{{ framework_llamacpp_chat_model }}"
        - "{{ framework_llamacpp_embed_model }}"
      register: framework_llamacpp_paths

    - name: Fail if any required file is missing
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: >-
          {{ item.item }} is missing. The embeddings GGUF is downloaded by the
          operator first -- see plan.md "Operator: download the embeddings model".
      loop: "{{ framework_llamacpp_paths.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read MemAvailable
      ansible.builtin.command:
        cmd: awk '/^MemAvailable:/ {print int($2/1024)}' /proc/meminfo
      register: framework_llamacpp_mem_available_mb
      changed_when: false

    - name: Refuse to continue on low memory (unified-memory APU, see header)
      ansible.builtin.assert:
        that: framework_llamacpp_mem_available_mb.stdout | int >= framework_llamacpp_min_available_mb
        fail_msg: >-
          MemAvailable is {{ framework_llamacpp_mem_available_mb.stdout }}MB,
          below {{ framework_llamacpp_min_available_mb }}MB. Find what else is
          holding memory before (re)starting llama-server.

    - name: Create the API key directory
      ansible.builtin.file:
        path: "{{ framework_llamacpp_key_dir }}"
        state: directory
        owner: root
        group: "{{ framework_llamacpp_user }}"
        mode: "0750"

    - name: Write the API key file
      ansible.builtin.copy:
        dest: "{{ framework_llamacpp_key_file }}"
        content: "{{ framework_llamacpp_api_key }}\n"
        owner: root
        group: "{{ framework_llamacpp_user }}"
        mode: "0640"
      no_log: true
      notify: Restart chat server

    - name: Write the chat server unit (takes over the hand-written one)
      ansible.builtin.copy:
        dest: /etc/systemd/system/nathanw-llamacpp.service
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by proxmox-homelab ansible/00-initial-setup/framework-desktop-llamacpp-native.yml -- do not edit by hand
          [Unit]
          Description=Nathanw llama.cpp fork (native Vulkan) -- chat/completions, port {{ framework_llamacpp_chat_port }}
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User={{ framework_llamacpp_user }}
          WorkingDirectory={{ framework_llamacpp_workdir }}
          ExecStart={{ framework_llamacpp_bin }} -m {{ framework_llamacpp_chat_model }} --alias {{ framework_llamacpp_chat_alias }} --host 0.0.0.0 --port {{ framework_llamacpp_chat_port }} --ctx-size {{ framework_llamacpp_chat_ctx_size }} --n-gpu-layers 999 --metrics --api-key-file {{ framework_llamacpp_key_file }}
          # on-failure (not always) so `systemctl stop` is respected and stays stopped --
          # only an actual crash triggers a restart. This is what lets the operator take
          # manual command-line control after stopping the service.
          Restart=on-failure
          RestartSec=5
          StandardOutput=append:{{ framework_llamacpp_log_dir }}/server.log
          StandardError=append:{{ framework_llamacpp_log_dir }}/server.log

          [Install]
          WantedBy=multi-user.target
      notify: Restart chat server

    - name: Write the embeddings server unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/nathanw-llamacpp-embed.service
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by proxmox-homelab ansible/00-initial-setup/framework-desktop-llamacpp-native.yml -- do not edit by hand
          [Unit]
          Description=Nathanw llama.cpp fork (native Vulkan) -- embeddings ({{ framework_llamacpp_embed_alias }}), port {{ framework_llamacpp_embed_port }}
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User={{ framework_llamacpp_user }}
          WorkingDirectory={{ framework_llamacpp_workdir }}
          ExecStart={{ framework_llamacpp_bin }} -m {{ framework_llamacpp_embed_model }} --alias {{ framework_llamacpp_embed_alias }} --host 0.0.0.0 --port {{ framework_llamacpp_embed_port }} --embeddings --pooling mean --ctx-size {{ framework_llamacpp_embed_ctx_size }} --parallel 1 --batch-size {{ framework_llamacpp_embed_ctx_size }} --ubatch-size {{ framework_llamacpp_embed_ctx_size }} --n-gpu-layers 999 --metrics
          Restart=on-failure
          RestartSec=5
          StandardOutput=append:{{ framework_llamacpp_log_dir }}/embed.log
          StandardError=append:{{ framework_llamacpp_log_dir }}/embed.log

          [Install]
          WantedBy=multi-user.target
      notify: Restart embeddings server

    - name: Flush handlers so changed units restart before the checks below
      ansible.builtin.meta: flush_handlers

    - name: Enable and start both servers
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - nathanw-llamacpp.service
        - nathanw-llamacpp-embed.service

    - name: Wait for each server's /health (the chat model takes minutes to load)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ item }}/health"
        status_code: 200
      register: framework_llamacpp_health
      until: framework_llamacpp_health.status == 200
      retries: 60
      delay: 10
      loop:
        - "{{ framework_llamacpp_chat_port }}"
        - "{{ framework_llamacpp_embed_port }}"

    - name: Chat server rejects a request without the API key
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ framework_llamacpp_chat_port }}/v1/chat/completions"
        method: POST
        body_format: json
        body: {model: "{{ framework_llamacpp_chat_alias }}", messages: [{role: user, content: "hi"}], max_tokens: 1}
        status_code: 401

    - name: Chat server serves /metrics with the API key
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ framework_llamacpp_chat_port }}/metrics"
        headers:
          Authorization: "Bearer {{ framework_llamacpp_api_key }}"
        status_code: 200
      no_log: true

    - name: Embeddings server returns a 768-dim vector
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ framework_llamacpp_embed_port }}/v1/embeddings"
        method: POST
        body_format: json
        body: {model: "{{ framework_llamacpp_embed_alias }}", input: ["embedding smoke test"]}
        return_content: true
        status_code: 200
      register: framework_llamacpp_embed_probe
      failed_when: framework_llamacpp_embed_probe.json.data[0].embedding | length != 768

  handlers:
    - name: Restart chat server
      ansible.builtin.systemd_service:
        name: nathanw-llamacpp.service
        state: restarted
        daemon_reload: true

    - name: Restart embeddings server
      ansible.builtin.systemd_service:
        name: nathanw-llamacpp-embed.service
        state: restarted
        daemon_reload: true
