---
# Framework Desktop native llama.cpp: the embeddings server and the API key.
#
#   nathanw-llamacpp-embed.service  embeddings (nomic-embed-text)  :8085  no key
#                                   (reached only from ai_seg via MikroTik)
#   /etc/llamacpp/api-key           the key every chat model on :8080 uses
#                                   (LLM_GPU_STACK_API_KEY; llama-swap's model
#                                   entries pass --api-key-file)
#
# Chat models on :8080 are started by llama-swap (framework-desktop-llama-swap.yml,
# docs/llama-swap/plan.md), adopted 2026-10-09. The old chat unit,
# nathanw-llamacpp.service, is retired: this playbook stops, disables and
# deletes it if it is still there.
#
# The embeddings server runs the Nathanw fork's current build from
# llama-builds (framework-desktop-llama-builds.yml):
# /storage/llama-builds/fork/current. `llama-builds promote fork` therefore
# changes its build too, at its next restart.
#
# Run (framework is not a Proxmox node, but it needs pve's OpenBao profile --
# LLM_GPU_STACK_API_KEY -- so it goes through the prod wrapper with an inline
# approval):
#   TASK_APPROVAL=<task> ./with-secrets-prod ansible-playbook \
#     -i ansible/inventory/inventory.yml \
#     ansible/00-initial-setup/framework-desktop-llamacpp-native.yml
- name: Manage the native llama.cpp embeddings server on the Framework Desktop
  hosts: framework
  become: true
  gather_facts: false

  vars:
    framework_llamacpp_user: steve
    framework_llamacpp_build: /storage/llama-builds/fork/current
    framework_llamacpp_bin: /storage/llama-builds/fork/current/bin/llama-server
    framework_llamacpp_log_dir: /home/steve/llamacpp-native-test
    framework_llamacpp_key_dir: /etc/llamacpp
    framework_llamacpp_key_file: /etc/llamacpp/api-key
    framework_llamacpp_api_key: "{{ lookup('env', 'LLM_GPU_STACK_API_KEY') | mandatory('LLM_GPU_STACK_API_KEY env var is required') }}"
    framework_llamacpp_min_available_mb: 4096

    framework_llamacpp_embed_model: /mnt/nvme2/models-gguf/nomic-embed-text-v1.5/nomic-embed-text-v1.5.f16.gguf
    framework_llamacpp_embed_alias: nomic-embed-text
    framework_llamacpp_embed_port: 8085
    # One slot, 2048 tokens: nomic-embed-text-v1.5's training context, and
    # above docs-rag-mcp's ~1500-token chunk cap (chunking.py
    # MAX_CHUNK_TOKENS). Each chunk is one ubatch.
    framework_llamacpp_embed_ctx_size: 2048

  tasks:
    - name: Check the llama-server build and the embeddings model exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ framework_llamacpp_bin }}"
        - "{{ framework_llamacpp_embed_model }}"
      register: framework_llamacpp_paths

    - name: Fail if any required file is missing
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: >-
          {{ item.item }} is missing. The fork build comes from
          framework-desktop-llama-builds.yml and `llama-builds build fork`; the
          embeddings GGUF is downloaded by the operator.
      loop: "{{ framework_llamacpp_paths.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read MemAvailable
      ansible.builtin.command:
        cmd: awk '/^MemAvailable:/ {print int($2/1024)}' /proc/meminfo
      register: framework_llamacpp_mem_available_mb
      changed_when: false

    - name: Refuse to continue on low memory (unified-memory APU)
      ansible.builtin.assert:
        that: framework_llamacpp_mem_available_mb.stdout | int >= framework_llamacpp_min_available_mb
        fail_msg: >-
          MemAvailable is {{ framework_llamacpp_mem_available_mb.stdout }}MB,
          below {{ framework_llamacpp_min_available_mb }}MB. Find what else is
          holding memory before (re)starting llama-server.

    - name: Create the API key directory
      ansible.builtin.file:
        path: "{{ framework_llamacpp_key_dir }}"
        state: directory
        owner: root
        group: "{{ framework_llamacpp_user }}"
        mode: "0750"

    - name: Write the API key file
      ansible.builtin.copy:
        dest: "{{ framework_llamacpp_key_file }}"
        content: "{{ framework_llamacpp_api_key }}\n"
        owner: root
        group: "{{ framework_llamacpp_user }}"
        mode: "0640"
      no_log: true

    # Retired 2026-10-09: llama-swap starts the chat models now.
    - name: Check for the retired chat unit
      ansible.builtin.stat:
        path: /etc/systemd/system/nathanw-llamacpp.service
      register: framework_llamacpp_old_chat_unit

    - name: Stop and disable the retired chat unit
      ansible.builtin.systemd_service:
        name: nathanw-llamacpp.service
        enabled: false
        state: stopped
      when: framework_llamacpp_old_chat_unit.stat.exists

    - name: Delete the retired chat unit
      ansible.builtin.file:
        path: /etc/systemd/system/nathanw-llamacpp.service
        state: absent
      when: framework_llamacpp_old_chat_unit.stat.exists
      notify: Reload systemd

    - name: Write the embeddings server unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/nathanw-llamacpp-embed.service
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by proxmox-homelab ansible/00-initial-setup/framework-desktop-llamacpp-native.yml -- do not edit by hand
          [Unit]
          Description=Nathanw llama.cpp fork (native Vulkan, llama-builds fork/current) -- embeddings ({{ framework_llamacpp_embed_alias }}), port {{ framework_llamacpp_embed_port }}
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User={{ framework_llamacpp_user }}
          WorkingDirectory={{ framework_llamacpp_build }}/bin
          ExecStart={{ framework_llamacpp_bin }} -m {{ framework_llamacpp_embed_model }} --alias {{ framework_llamacpp_embed_alias }} --host 0.0.0.0 --port {{ framework_llamacpp_embed_port }} --embeddings --pooling mean --ctx-size {{ framework_llamacpp_embed_ctx_size }} --parallel 1 --batch-size {{ framework_llamacpp_embed_ctx_size }} --ubatch-size {{ framework_llamacpp_embed_ctx_size }} --n-gpu-layers 999 --metrics
          Restart=on-failure
          RestartSec=5
          StandardOutput=append:{{ framework_llamacpp_log_dir }}/embed.log
          StandardError=append:{{ framework_llamacpp_log_dir }}/embed.log

          [Install]
          WantedBy=multi-user.target
      notify: Restart embeddings server

    - name: Flush handlers so a changed unit restarts before the checks below
      ansible.builtin.meta: flush_handlers

    - name: Enable and start the embeddings server
      ansible.builtin.systemd_service:
        name: nathanw-llamacpp-embed.service
        enabled: true
        state: started
        daemon_reload: true

    - name: Wait for the embeddings server's /health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ framework_llamacpp_embed_port }}/health"
        status_code: 200
      register: framework_llamacpp_health
      until: framework_llamacpp_health.status == 200
      retries: 30
      delay: 5

    - name: Embeddings server returns a 768-dim vector
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ framework_llamacpp_embed_port }}/v1/embeddings"
        method: POST
        body_format: json
        body: {model: "{{ framework_llamacpp_embed_alias }}", input: ["embedding smoke test"]}
        return_content: true
        status_code: 200
      register: framework_llamacpp_embed_probe
      failed_when: framework_llamacpp_embed_probe.json.data[0].embedding | length != 768

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart embeddings server
      ansible.builtin.systemd_service:
        name: nathanw-llamacpp-embed.service
        state: restarted
        daemon_reload: true
