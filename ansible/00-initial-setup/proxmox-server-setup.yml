---
# File: ansible/01-base-system/proxmox-server-validation.yml
# Read-only validation playbook for Proxmox server configuration
# This playbook only checks and reports - it does NOT make changes

- name: Validate Proxmox Server Configuration (Read-Only)
  hosts: proxmox
  become: yes
  gather_facts: yes
  vars:
    automation_user: automation

  tasks:
    # Phase 1: System Information
    - name: Display Proxmox system information
      debug:
        msg:
          - "Proxmox VE Version: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Kernel: {{ ansible_kernel }}"
          - "Architecture: {{ ansible_architecture }}"
          - "Memory: {{ ansible_memtotal_mb }}MB"
          - "CPU Cores: {{ ansible_processor_vcpus }}"
          - "Hostname: {{ ansible_hostname }}"
          - "FQDN: {{ ansible_fqdn }}"

    - name: Validate this is a Proxmox VE system
      assert:
        that:
          - "'pve' in ansible_kernel"
        fail_msg: "This does not appear to be a Proxmox VE system. Expected PVE kernel but found: {{ ansible_kernel }}"
        success_msg: "Confirmed Proxmox VE system with kernel: {{ ansible_kernel }}"

    # Phase 2: Repository Configuration Check
    - name: Check repository files
      find:
        paths: /etc/apt/sources.list.d/
        patterns: "*.sources"
      register: current_repos

    - name: Check enterprise repository status
      shell: |
        if ls /etc/apt/sources.list.d/pve-enterprise.sources 2>/dev/null; then
          if grep -q "^Types:" /etc/apt/sources.list.d/pve-enterprise.sources; then
            echo "enabled"
          else
            echo "disabled"
          fi
        else
          echo "missing"
        fi
      register: enterprise_repo_status
      changed_when: false

    - name: Check no-subscription repository status
      shell: |
        if ls /etc/apt/sources.list.d/*no-subscription* /etc/apt/sources.list.d/proxmox.sources 2>/dev/null; then
          echo "present"
        else
          echo "missing"
        fi
      register: nosubscription_repo_status
      changed_when: false

    # Phase 3: User Configuration Check
    - name: Check if automation user exists
      getent:
        database: passwd
        key: "{{ automation_user }}"
      register: automation_user_check
      failed_when: false

    - name: Check automation user sudo configuration
      stat:
        path: "/etc/sudoers.d/{{ automation_user }}"
      register: automation_sudo_check
      when: not automation_user_check.failed

    - name: Check if PVE automation user exists
      shell: |
        set -o pipefail
        pveum user list | grep -q "automation@pve"
      register: pve_user_check
      failed_when: false
      changed_when: false

    # Phase 4: Service and Security Check
    - name: Check subscription nag status
      shell: |
        if [ -f /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js ]; then
          if grep -q "res.data.status.toLowerCase() !== 'active'" /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js; then
            echo "present"
          else
            echo "removed"
          fi
        else
          echo "file_missing"
        fi
      register: subscription_nag_status
      changed_when: false

    - name: Check required packages
      package_facts:
        manager: apt

    # Phase 5: Generate Validation Report
    - name: Generate validation summary
      debug:
        msg:
          - "================================================"
          - "         PROXMOX SERVER VALIDATION REPORT"
          - "================================================"
          - ""
          - "Server: {{ ansible_fqdn }} ({{ ansible_default_ipv4.address }})"
          - "Version: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Kernel: {{ ansible_kernel }}"
          - ""
          - "Repository Configuration:"
          - "  Enterprise repo: {{ enterprise_repo_status.stdout }}"
          - "  No-subscription repo: {{ nosubscription_repo_status.stdout }}"
          - ""
          - "User Configuration:"
          - "  System user 'automation': {{ 'EXISTS' if not automation_user_check.failed else 'MISSING' }}"
          - "  Automation sudo config: {{ 'CONFIGURED' if automation_sudo_check.stat.exists | default(false) else 'MISSING' }}"
          - "  PVE user 'automation@pve': {{ 'EXISTS' if pve_user_check.rc == 0 else 'MISSING' }}"
          - ""
          - "Security Configuration:"
          - "  Subscription nag: {{ subscription_nag_status.stdout }}"
          - "  Sudo package: {{ 'INSTALLED' if 'sudo' in ansible_facts.packages else 'MISSING' }}"
          - ""
          - "Storage and Network:"
          - "  Available storage: {{ ansible_mounts | selectattr('mount', 'match', '^/.*') | list | length }} mounts"
          - "  Network interfaces: {{ ansible_interfaces | length }}"
          - ""
          - "Issues Found:"
          - "{{ validation_issues | default(['None detected']) | join('\n') }}"
          - "================================================"
