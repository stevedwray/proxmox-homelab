---
- name: Configure Proxmox SDN VLAN zones
  hosts: "{{ target_hosts | default('proxmox_testbed') }}"
  become: true
  gather_facts: true

  vars:
    # Subnet/gateway per VNet, resolved from env at task time (avoids ${} legacy var issue)
    sdn_subnet_tvinfra: "{{ lookup('env', 'lab_subnet_infra_cidr') }}"
    sdn_gw_tvinfra: "{{ lookup('env', 'lab_gw_infra') }}"
    sdn_subnet_tvmgmt: "{{ lookup('env', 'lab_subnet_mgmt_cidr') }}"
    sdn_gw_tvmgmt: "{{ lookup('env', 'lab_gw_mgmt') }}"
    sdn_subnet_tvedge: "{{ lookup('env', 'lab_subnet_edge_cidr') }}"
    sdn_gw_tvedge: "{{ lookup('env', 'lab_gw_edge') }}"
    sdn_subnet_tvnetc: "{{ lookup('env', 'lab_subnet_build_cidr') }}"
    sdn_gw_tvnetc: "{{ lookup('env', 'lab_gw_build') }}"
    sdn_subnet_tvgames: "192.168.60.0/24"
    sdn_gw_tvgames: "192.168.60.1"
    proxmox_sdn_attachments: >-
      {{
        attachments
        | dict2items
        | selectattr('value.type', 'equalto', 'sdn_vnet')
        | list
      }}

  tasks:
    - name: Load network intent for target environment
      ansible.builtin.include_vars:
        file: "../../terraform/lxc/network/{{ lookup('env', 'PVE_ENV') | default('pve-test', true) }}.yaml"

    - name: Inject resolved subnet and gateway into SDN attachments
      ansible.builtin.set_fact:
        proxmox_sdn_attachments: >-
          {%- set ns = namespace(result=[]) -%}
          {%- for item in proxmox_sdn_attachments -%}
            {%- set vnet = item.value.sdn.vnet -%}
            {%- set subnet = lookup('vars', 'sdn_subnet_' + vnet) -%}
            {%- set gateway = lookup('vars', 'sdn_gw_' + vnet) -%}
            {%- set new_item = item | combine({'value': item.value | combine({'sdn': item.value.sdn | combine({'subnet': subnet, 'gateway': gateway})})}, recursive=True) -%}
            {%- set _ = ns.result.append(new_item) -%}
          {%- endfor -%}
          {{ ns.result }}

    - name: Assert VLAN SDN source of truth matches target node
      ansible.builtin.assert:
        that:
          - proxmox.target_node == (lookup('env', 'TF_VAR_proxmox_node') | default('pve-test', true))
          - proxmox_sdn_attachments | length == 5
          - proxmox_sdn_attachments | map(attribute='value.sdn.zone_type') | unique == ['vlan']
          - proxmox_sdn_attachments | map(attribute='value.sdn.bridge') | unique == ['vmbr0']
        fail_msg: "The loaded SDN network definition does not match the expected VLAN model for {{ proxmox.target_node }}."
        success_msg: "Loaded VLAN SDN definition for {{ proxmox.target_node }} from terraform/lxc/network/{{ lookup('env', 'PVE_ENV') | default('pve-test', true) }}.yaml."

    - name: Read current SDN zones
      ansible.builtin.command:
        cmd: pvesh get /cluster/sdn/zones --output-format json
      register: proxmox_sdn_zones_result
      changed_when: false

    - name: Read current SDN VNets
      ansible.builtin.command:
        cmd: pvesh get /cluster/sdn/vnets --output-format json
      register: proxmox_sdn_vnets_result
      changed_when: false

    - name: Create missing SDN VLAN zones
      ansible.builtin.command:
        argv:
          - pvesh
          - create
          - /cluster/sdn/zones
          - --type
          - "{{ item.value.sdn.zone_type }}"
          - --zone
          - "{{ item.value.sdn.zone }}"
          - --bridge
          - "{{ item.value.sdn.bridge }}"
          - --nodes
          - "{{ item.value.sdn.nodes | join(',') }}"
      loop: "{{ proxmox_sdn_attachments }}"
      when: >-
        (proxmox_sdn_zones_result.stdout | from_json
        | selectattr('zone', 'equalto', item.value.sdn.zone)
        | list | length) == 0
      register: proxmox_sdn_zone_create_result
      changed_when: true

    - name: Assert existing SDN zones match the source of truth
      ansible.builtin.assert:
        that:
          - current_zone.type == item.value.sdn.zone_type
          - current_zone.bridge == item.value.sdn.bridge
          - (current_zone.nodes | default('')) == (item.value.sdn.nodes | join(','))
        fail_msg: "Existing SDN zone {{ item.value.sdn.zone }} does not match the network intent for {{ proxmox.target_node }}."
        success_msg: "Existing SDN zone {{ item.value.sdn.zone }} matches the source of truth."
      vars:
        current_zone: >-
          {{
            (proxmox_sdn_zones_result.stdout | from_json
            | selectattr('zone', 'equalto', item.value.sdn.zone)
            | list | first | default({}))
          }}
      loop: "{{ proxmox_sdn_attachments }}"
      when: >-
        (proxmox_sdn_zones_result.stdout | from_json
        | selectattr('zone', 'equalto', item.value.sdn.zone)
        | list | length) > 0

    - name: Create missing SDN VNets
      ansible.builtin.command:
        argv:
          - pvesh
          - create
          - /cluster/sdn/vnets
          - --vnet
          - "{{ item.value.sdn.vnet }}"
          - --zone
          - "{{ item.value.sdn.zone }}"
          - --tag
          - "{{ item.value.sdn.vlan_tag | string }}"
          - --alias
          - "{{ item.value.sdn.alias }}"
      loop: "{{ proxmox_sdn_attachments }}"
      when: >-
        (proxmox_sdn_vnets_result.stdout | from_json
        | selectattr('vnet', 'equalto', item.value.sdn.vnet)
        | list | length) == 0
      register: proxmox_sdn_vnet_create_result
      changed_when: true

    - name: Assert existing SDN VNets match the source of truth
      ansible.builtin.assert:
        that:
          - current_vnet.zone == item.value.sdn.zone
          - (current_vnet.tag | string) == (item.value.sdn.vlan_tag | string)
          - (current_vnet.alias | default('')) == item.value.sdn.alias
        fail_msg: "Existing SDN VNet {{ item.value.sdn.vnet }} does not match the network intent for {{ proxmox.target_node }}."
        success_msg: "Existing SDN VNet {{ item.value.sdn.vnet }} matches the source of truth."
      vars:
        current_vnet: >-
          {{
            (proxmox_sdn_vnets_result.stdout | from_json
            | selectattr('vnet', 'equalto', item.value.sdn.vnet)
            | list | first | default({}))
          }}
      loop: "{{ proxmox_sdn_attachments }}"
      when: >-
        (proxmox_sdn_vnets_result.stdout | from_json
        | selectattr('vnet', 'equalto', item.value.sdn.vnet)
        | list | length) > 0

    - name: Configure SDN subnets for each VNet
      ansible.builtin.include_tasks: tasks/proxmox-sdn-subnet.yml
      loop: "{{ proxmox_sdn_attachments }}"
      loop_control:
        loop_var: sdn_attachment
        label: "{{ sdn_attachment.value.sdn.vnet }}"

    - name: Disable Proxmox cluster firewall (test nodes run without guest bridge firewall)
      ansible.builtin.shell: |
        cat > /etc/pve/firewall/cluster.fw <<'EOF'
        [OPTIONS]
        enable: 0
        EOF
        chmod 0640 /etc/pve/firewall/cluster.fw
      args:
        executable: /bin/bash
      changed_when: true
      notify: Restart pve-firewall

    - name: Apply pending SDN changes
      ansible.builtin.command:
        cmd: pvesh set /cluster/sdn
      changed_when: false

    - name: Read final SDN zones
      ansible.builtin.command:
        cmd: pvesh get /cluster/sdn/zones --output-format json
      register: proxmox_sdn_final_zones_result
      changed_when: false

    - name: Read final SDN VNets
      ansible.builtin.command:
        cmd: pvesh get /cluster/sdn/vnets --output-format json
      register: proxmox_sdn_final_vnets_result
      changed_when: false

    - name: Read live Linux link interfaces
      ansible.builtin.command:
        cmd: ip -br link
      register: proxmox_sdn_link_result
      changed_when: false

    - name: Assert expected SDN zones exist
      ansible.builtin.assert:
        that:
          - expected_zones | difference(current_zones) | length == 0
        fail_msg: "One or more expected SDN zones are missing after playbook execution."
        success_msg: "All expected SDN zones exist on {{ proxmox.target_node }}."
      vars:
        expected_zones: "{{ proxmox_sdn_attachments | map(attribute='value.sdn.zone') | list }}"
        current_zones: "{{ proxmox_sdn_final_zones_result.stdout | from_json | map(attribute='zone') | list }}"

    - name: Assert expected SDN VNets exist on the node
      ansible.builtin.assert:
        that:
          - expected_vnets | difference(current_vnets) | length == 0
        fail_msg: "One or more expected SDN VNets are missing after applying SDN config."
        success_msg: "All expected SDN VNets exist on {{ proxmox.target_node }}."
      vars:
        expected_vnets: "{{ proxmox_sdn_attachments | map(attribute='value.sdn.vnet') | list }}"
        current_vnets: "{{ proxmox_sdn_final_vnets_result.stdout | from_json | map(attribute='vnet') | list }}"

    - name: Assert expected VNet bridges exist on the node
      ansible.builtin.assert:
        that:
          - expected_bridges | difference(current_bridges) | length == 0
        fail_msg: "One or more expected SDN VNet bridges are missing after applying SDN config."
        success_msg: "All expected SDN VNet bridges exist on {{ proxmox.target_node }}."
      vars:
        expected_bridges: "{{ proxmox_sdn_attachments | map(attribute='value.sdn.vnet') | list }}"
        current_bridges: "{{ proxmox_sdn_link_result.stdout_lines | map('regex_replace', '\\s+.*$', '') | list }}"

  handlers:
    - name: Restart pve-firewall
      ansible.builtin.systemd:
        name: pve-firewall
        state: restarted
