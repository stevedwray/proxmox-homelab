---
- name: Reconcile MikroTik build_seg VLAN10 gateway path
  hosts: localhost
  gather_facts: false

  vars:
    mikrotik_host: "{{ lookup('env', 'MIKROTIK_HOST') | default('192.168.1.251', true) }}"
    mikrotik_rest_base_url: "https://{{ mikrotik_host }}/rest"
    mikrotik_user: "{{ lookup('env', 'MIKROTIK_USER') }}"
    mikrotik_password: "{{ lookup('env', 'MIKROTIK_PASSWORD') }}"

    build_vlan_name: vlan10-build
    trunk_interface: ether5
    build_gateway_cidr: 10.57.0.1/24

  pre_tasks:
    - name: Assert MikroTik credentials are present
      ansible.builtin.assert:
        that:
          - mikrotik_user | length > 0
          - mikrotik_password | length > 0
        fail_msg: Set MIKROTIK_USER and MIKROTIK_PASSWORD via with-secrets.

  tasks:
    - name: Read MikroTik bridge ports
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/interface/bridge/port"
        method: GET
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        status_code: 200
      register: bridge_port_result
      no_log: true

    - name: Locate trunk bridge port object
      ansible.builtin.set_fact:
        trunk_bridge_port_obj: >-
          {{
            (bridge_port_result.json | selectattr('interface', 'equalto', trunk_interface) | list | first)
            | default({})
          }}

    - name: Ensure trunk bridge port accepts tagged ingress
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/interface/bridge/port/{{ trunk_bridge_port_obj['.id'] }}"
        method: PATCH
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          frame-types: "admit-all"
          ingress-filtering: "false"
        status_code: [200, 201]
      when:
        - trunk_bridge_port_obj != {}
        - (trunk_bridge_port_obj['ingress-filtering'] | default('true')) != 'false'
      no_log: true

    - name: Read MikroTik VLAN interfaces
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/interface/vlan"
        method: GET
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        status_code: 200
      register: vlan_result
      no_log: true

    - name: Locate build VLAN object
      ansible.builtin.set_fact:
        build_vlan_obj: >-
          {{
            (vlan_result.json | selectattr('name', 'equalto', build_vlan_name) | list | first)
            | default({})
          }}

    - name: Create build VLAN interface when missing
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/interface/vlan/add"
        method: POST
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          name: "{{ build_vlan_name }}"
          interface: "{{ trunk_interface }}"
          vlan-id: "10"
          comment: "pve-test build_seg gateway"
        status_code: [200, 201]
      when: build_vlan_obj == {}
      no_log: true

    - name: Re-point build VLAN to trunk interface when needed
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/interface/vlan/{{ build_vlan_obj['.id'] }}"
        method: PATCH
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          interface: "{{ trunk_interface }}"
          disabled: "false"
        status_code: [200, 201]
      when:
        - build_vlan_obj != {}
        - build_vlan_obj.interface != trunk_interface or (build_vlan_obj.disabled | default('false')) == 'true'
      no_log: true

    - name: Read MikroTik IP addresses
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/ip/address"
        method: GET
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        status_code: 200
      register: ip_result
      no_log: true

    - name: Locate build gateway IP object
      ansible.builtin.set_fact:
        build_ip_obj: >-
          {{
            (ip_result.json | selectattr('address', 'equalto', build_gateway_cidr) | list | first)
            | default({})
          }}

    - name: Add build gateway IP when missing
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/ip/address/add"
        method: POST
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          address: "{{ build_gateway_cidr }}"
          interface: "{{ build_vlan_name }}"
          comment: "pve-test build_seg gw"
        status_code: [200, 201]
      when: build_ip_obj == {}
      no_log: true

    - name: Re-point build gateway IP to build VLAN when needed
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/ip/address/{{ build_ip_obj['.id'] }}"
        method: PATCH
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          interface: "{{ build_vlan_name }}"
          disabled: "false"
        status_code: [200, 201]
      when:
        - build_ip_obj != {}
        - build_ip_obj.interface != build_vlan_name or (build_ip_obj.disabled | default('false')) == 'true'
      no_log: true

    - name: Validate build VLAN and gateway mapping
      ansible.builtin.uri:
        url: "{{ mikrotik_rest_base_url }}/interface/vlan"
        method: GET
        user: "{{ mikrotik_user }}"
        password: "{{ mikrotik_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        status_code: 200
      register: final_vlan_result
      no_log: true

    - name: Validate final build VLAN path
      ansible.builtin.assert:
        that:
          - final_build_vlan.interface == trunk_interface
          - (final_build_vlan.disabled | default('false')) == 'false'
        fail_msg: build VLAN interface is not correctly mapped to the trunk interface.
        success_msg: build VLAN interface now mapped to trunk interface.
      vars:
        final_build_vlan: >-
          {{
            (final_vlan_result.json | selectattr('name', 'equalto', build_vlan_name) | list | first)
            | default({})
          }}
