---
# FILE: playbooks/templates/build-debian-template.yml
# Purpose: Create a standardized Debian LXC template with Docker and automation tools
# Updated for production storage layout and proper variable management

- name: Create and configure Debian LXC template
  hosts: proxmox_production
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/proxmox.yml
    - ../group_vars/proxmox_production.yml

  vars:
    # Template configuration (can be overridden via extra vars)
    template_id: "{{ debian_template.container_id | default(900) }}"
    template_hostname: "{{ debian_template.hostname | default('debian-template-builder') }}"
    template_ip: "{{ debian_template.ip | default('192.168.1.50') }}"
    template_memory: "{{ debian_template.memory | default(2048) }}"
    template_cores: "{{ debian_template.cores | default(2) }}"
    template_disk: "{{ debian_template.disk | default('8G') }}"

    # Use infrastructure storage for template building (directory storage)
    storage_pool: "{{ debian_template.storage_pool | default('infrastructure-storage') }}"

    # Base template and network settings
    base_template: "{{ debian_template.base_template | default('local:vztmpl/debian-13-standard_13.0-1_amd64.tar.zst') }}"
    base_template_file: "{{ base_template | regex_replace('^local:vztmpl/', '') }}"
    debian_template_version: "{{ (base_template_file.split('_') | length > 1) | ternary(base_template_file.split('_')[1], '13') }}"
    network_bridge: "{{ proxmox_network.bridge | default('vmbr0') }}"
    gateway_ip: "{{ proxmox_network.gateway | default('192.168.1.1') }}"

    # Template packaging settings
    clone_id: "{{ debian_template.clone_id | default(800) }}"
    clone_hostname: "{{ debian_template.clone_hostname | default('debian-template-clone') }}"
    final_template_filename: "{{ debian_template.final_filename | default('debian-' ~ debian_template_version ~ '-docker-template.tar.gz') }}"
    template_dumpdir: "{{ debian_template.dumpdir | default('/var/lib/vz/template/cache') }}"
    template_ssh_user: "{{ debian_template.ssh_user | default('automation') }}"
    template_ssh_private_key_file: "{{ debian_template.ssh_private_key_file | default('~/.ssh/id_rsa') }}"
    template_ssh_common_args: "{{ debian_template.ssh_common_args | default('-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null') }}"
    template_public_key_path: "{{ debian_template.ssh_public_key_path | default('~/.ssh/id_rsa.pub') }}"
    enable_root_ssh_login: "{{ debian_template.enable_root_ssh_login | default(false) }}"

    # Feature flags
    install_docker: "{{ debian_template.install_docker | default(true) }}"
    install_portainer_agent: "{{ debian_template.install_portainer_agent | default(true) }}"
    cleanup_template: "{{ debian_template.cleanup_template | default(true) }}"

  pre_tasks:
    - name: Validate template configuration
      ansible.builtin.assert:
        that:
          - template_id is defined
          - template_ip is defined
          - storage_pool is defined
        fail_msg: "Template configuration incomplete. Check debian_template variables."

    - name: Validate Docker channel selection
      ansible.builtin.assert:
        that:
          - debian_template.docker_channel | default('debian') in ['debian', 'upstream']
        fail_msg: "Invalid docker_channel. Use 'debian' or 'upstream'."

    - name: Verify controller SSH public key exists
      ansible.builtin.stat:
        path: "{{ template_public_key_path | expanduser }}"
      delegate_to: localhost
      become: false
      register: controller_pubkey

    - name: Assert controller SSH public key availability
      ansible.builtin.assert:
        that:
          - controller_pubkey.stat.exists
        fail_msg: "SSH public key not found at {{ template_public_key_path }} on control node."

    - name: Display template build configuration
      ansible.builtin.debug:
        msg: |
          Building Debian template with configuration:
          - Container ID: {{ template_id }}
          - Hostname: {{ template_hostname }}
          - IP: {{ template_ip }}
          - Storage: {{ storage_pool }}
          - Memory: {{ template_memory }}MB
          - Cores: {{ template_cores }}
          - Disk: {{ template_disk }}

  tasks:
    # =====================================
    # Container Creation and Initial Setup
    # =====================================

    - name: Check if template container already exists
      ansible.builtin.command: pct config {{ template_id }}
      register: container_exists
      failed_when: false
      changed_when: false

    - name: Refresh Proxmox appliance catalog
      ansible.builtin.command: pveam update
      changed_when: false

    - name: Check if base template is available
      ansible.builtin.shell: |
        set -o pipefail
        pveam list local | awk '{print $2}' | grep -Fxq "{{ base_template_file }}"
      args:
        executable: /bin/bash
      register: template_available
      failed_when: false
      changed_when: false

    - name: Download Debian 13 template if not present
      ansible.builtin.command: pveam download local {{ base_template_file }}
      changed_when: true
      when:
        - container_exists.rc != 0
        - template_available.rc != 0

    - name: Create base LXC container
      ansible.builtin.shell: >
        pct create {{ template_id }} {{ base_template }}
        --hostname {{ template_hostname }}
        --memory {{ template_memory }}
        --cores {{ template_cores }}
        --rootfs {{ storage_pool }}:{{ template_disk }}
        --net0 name=eth0,bridge={{ network_bridge }},ip={{ template_ip }}/24,gw={{ gateway_ip }}
        --features nesting=1,keyctl=1
        --onboot 0
        --protection 0
        --start
      when: container_exists.rc != 0
      register: container_creation
      changed_when: true

    - name: Wait for container to be running
      ansible.builtin.command: pct status {{ template_id }}
      register: container_status
      until: "'running' in container_status.stdout"
      retries: 10
      delay: 5
      when: container_exists.rc != 0
      changed_when: false

    - name: Wait for SSH to be available
      ansible.builtin.wait_for:
        host: "{{ template_ip }}"
        port: 22
        delay: 10
        timeout: 300
      when: container_exists.rc != 0

    # =====================================
    # Initial SSH and User Setup via pct exec
    # =====================================

    - name: Configure SSH and create automation user via pct exec
      ansible.builtin.shell: |
        pct exec {{ template_id }} -- bash -c "
        apt update && apt install -y openssh-server sudo curl wget
        systemctl enable ssh
        systemctl start ssh

        # Create automation user
        useradd -m -s /bin/bash -G sudo automation
        mkdir -p /home/automation/.ssh
        echo '{{ lookup('file', template_public_key_path | expanduser) }}' > /home/automation/.ssh/authorized_keys
        chown -R automation:automation /home/automation/.ssh
        chmod 700 /home/automation/.ssh
        chmod 600 /home/automation/.ssh/authorized_keys
        echo 'automation ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/automation
        "
      when: container_exists.rc != 0
      changed_when: true

    - name: Optionally enable root SSH login in template builder container
      ansible.builtin.shell: |
        pct exec {{ template_id }} -- bash -c "
        mkdir -p /root/.ssh
        echo '{{ lookup('file', template_public_key_path | expanduser) }}' > /root/.ssh/authorized_keys
        chmod 700 /root/.ssh
        chmod 600 /root/.ssh/authorized_keys
        sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
        systemctl restart ssh
        "
      when:
        - container_exists.rc != 0
        - enable_root_ssh_login
      changed_when: true

    - name: Register template builder host for follow-up configuration
      ansible.builtin.add_host:
        name: "{{ template_hostname }}"
        groups: debian_template_runtime_builder
        ansible_host: "{{ template_ip }}"
        ansible_user: "{{ template_ssh_user }}"
        ansible_ssh_private_key_file: "{{ template_ssh_private_key_file }}"
        ansible_ssh_common_args: "{{ template_ssh_common_args }}"

- name: Configure the LXC container via SSH
  hosts: debian_template_runtime_builder
  become: true
  gather_facts: false
  vars_files:
    - ../group_vars/proxmox.yml
    - ../group_vars/proxmox_production.yml
  vars:
    install_docker: "{{ debian_template.install_docker | default(true) }}"
    install_portainer_agent: "{{ debian_template.install_portainer_agent | default(true) }}"
    cleanup_template: "{{ debian_template.cleanup_template | default(true) }}"
    template_public_key_path: "{{ debian_template.ssh_public_key_path | default('~/.ssh/id_rsa.pub') }}"
    enable_root_console_autologin: "{{ debian_template.enable_root_console_autologin | default(false) }}"
    docker_channel: "{{ debian_template.docker_channel | default('debian') }}"
    docker_compose_cli: >-
      {{ debian_template.docker_compose_cli
         | default((docker_channel == 'debian')
         | ternary('/usr/bin/docker-compose', '/usr/bin/docker compose')) }}
    docker_packages_debian:
      - docker.io
      - docker-compose
    docker_packages_upstream:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    template_packages:
      # Core system tools
      - curl
      - wget
      - vim
      - emacs-nox
      - htop
      - htop
      - unzip
      - zip
      - git
      - rsync
      - screen
      - tmux

      # Python and development tools
      - python3
      - python3-pip
      - python3-venv
      - build-essential

      # Network and system utilities
      - net-tools
      - openssh-server
      - sudo
      - systemd
      - dbus
      - ca-certificates
      - gnupg
      - lsb-release
      - apt-transport-https

      # Network diagnostic tools
      - tcpdump
      - netstat-nat
      - traceroute
      - nmap
      - dnsutils
      - telnet
      - iptables
      - ufw

      # File and system utilities
      - tree
      - less
      - nano
      - jq
      - bc
      - lsof
      - psmisc

      # Archive and compression tools
      - tar
      - gzip
      - bzip2
      - xz-utils

  pre_tasks:
    - name: Skip runtime container configuration in check mode
      ansible.builtin.meta: end_play
      when: ansible_check_mode

    - name: Gather facts for runtime container configuration
      ansible.builtin.setup:

  tasks:
    - name: Update package cache and upgrade system
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        autoremove: true
        autoclean: true

    - name: Install standard packages
      ansible.builtin.apt:
        name: "{{ template_packages }}"
        state: present

    - name: Configure timezone
      community.general.timezone:
        name: "{{ debian_template.timezone | default('Pacific/Auckland') }}"

    - name: Ensure automation user configuration is correct
      ansible.builtin.user:
        name: automation
        groups: sudo
        shell: /bin/bash
        create_home: true
        password: "*" # Disabled password

    - name: Configure automation user sudoers
      ansible.builtin.copy:
        content: "automation ALL=(ALL) NOPASSWD:ALL"
        dest: /etc/sudoers.d/automation
        mode: "0440"

    - name: Configure SSH for automation user
      ansible.posix.authorized_key:
        user: automation
        state: present
        key: "{{ lookup('file', template_public_key_path | expanduser) }}"

    # =====================================
    # Docker Installation (Optional)
    # =====================================

    - name: Install Docker
      when: install_docker
      block:
        - name: Install Docker packages from Debian repositories
          ansible.builtin.apt:
            name: "{{ docker_packages_debian }}"
            state: present
          when: docker_channel == 'debian'

        - name: Create directory for Docker GPG key
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"
          when: docker_channel == 'upstream'

        - name: Download and install Docker GPG key
          ansible.builtin.shell: |
            set -o pipefail
            curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
            chmod 644 /etc/apt/keyrings/docker.gpg
          args:
            executable: /bin/bash
          changed_when: true
          when: docker_channel == 'upstream'

        - name: Add Docker repository
          ansible.builtin.apt_repository:
            repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
            state: present
          when: docker_channel == 'upstream'

        - name: Update apt cache after adding Docker repo
          ansible.builtin.apt:
            update_cache: true
          when: docker_channel == 'upstream'

        - name: Install Docker packages from upstream repository
          ansible.builtin.apt:
            name: "{{ docker_packages_upstream }}"
            state: present
          when: docker_channel == 'upstream'

        - name: Add automation user to docker group
          ansible.builtin.user:
            name: automation
            groups: docker
            append: true

        - name: Enable Docker service (but don't start in template)
          ansible.builtin.systemd:
            name: docker
            enabled: true
            state: stopped

    # =====================================
    # Portainer Agent Setup (Optional)
    # =====================================

    - name: Set up Portainer Agent
      when: install_portainer_agent and install_docker
      block:
        - name: Create portainer directory
          ansible.builtin.file:
            path: /opt/portainer
            state: directory
            mode: "0750"

        - name: Create Portainer Agent docker-compose file
          ansible.builtin.copy:
            content: |
              version: '3.8'
              services:
                portainer-agent:
                  image: portainer/agent:2.21.1
                  container_name: portainer-agent
                  restart: unless-stopped
                  ports:
                    - "9001:9001"
                  volumes:
                    - /var/run/docker.sock:/var/run/docker.sock
                    - /var/lib/docker/volumes:/var/lib/docker/volumes
                  environment:
                    - AGENT_CLUSTER_ADDR=tasks.agent
                  networks:
                    - portainer-agent
                  logging:
                    driver: "json-file"
                    options:
                      max-size: "10m"
                      max-file: "3"

              networks:
                portainer-agent:
                  external: false
            dest: /opt/portainer/docker-compose.yml
            mode: "0640"

        - name: Create Portainer Agent systemd service
          ansible.builtin.copy:
            content: |
              [Unit]
              Description=Portainer Agent
              Requires=docker.service
              After=docker.service

              [Service]
              Type=oneshot
              RemainAfterExit=yes
              WorkingDirectory=/opt/portainer
              ExecStart={{ docker_compose_cli }} up -d
              ExecStop={{ docker_compose_cli }} down
              TimeoutStartSec=0

              [Install]
              WantedBy=multi-user.target
            dest: /etc/systemd/system/portainer-agent.service
            mode: "0644"

        - name: Enable Portainer Agent service (but don't start in template)
          ansible.builtin.systemd:
            name: portainer-agent
            enabled: true
            daemon_reload: true

        - name: Create Portainer Agent management script
          ansible.builtin.copy:
            content: |
              #!/bin/bash
              # Portainer Agent management script

              case "$1" in
                start)
                  echo "Starting Docker and Portainer Agent..."
                  systemctl start docker
                  sleep 2
                  systemctl start portainer-agent
                  ;;
                stop)
                  echo "Stopping Portainer Agent..."
                  systemctl stop portainer-agent
                  ;;
                restart)
                  echo "Restarting Portainer Agent..."
                  systemctl restart portainer-agent
                  ;;
                status)
                  systemctl status portainer-agent
                  echo ""
                  docker ps | grep portainer-agent 2>/dev/null || echo "Portainer agent container not running"
                  ;;
                logs)
                  docker logs portainer-agent 2>/dev/null || echo "No portainer-agent container found"
                  ;;
                *)
                  echo "Usage: $0 {start|stop|restart|status|logs}"
                  exit 1
                  ;;
              esac
            dest: /usr/local/bin/portainer-agent
            mode: "0755"

    # =====================================
    # System Configuration and Hardening
    # =====================================

    - name: Configure console auto-login for root
      when: enable_root_console_autologin
      block:
        - name: Create getty override directory
          ansible.builtin.file:
            path: /etc/systemd/system/console-getty.service.d
            state: directory
            mode: "0755"

        - name: Configure console auto-login
          ansible.builtin.copy:
            content: |
              [Service]
              ExecStart=
              ExecStart=-/sbin/agetty --noissue --autologin root --noclear %I $TERM
            dest: /etc/systemd/system/console-getty.service.d/autologin.conf
            mode: "0644"

        - name: Create getty@tty1 override directory
          ansible.builtin.file:
            path: /etc/systemd/system/getty@tty1.service.d
            state: directory
            mode: "0755"

        - name: Configure tty1 auto-login
          ansible.builtin.copy:
            content: |
              [Service]
              ExecStart=
              ExecStart=-/sbin/agetty --noissue --autologin root --noclear %I $TERM
            dest: /etc/systemd/system/getty@tty1.service.d/autologin.conf
            mode: "0644"

        - name: Reload systemd daemon
          ansible.builtin.systemd:
            daemon_reload: true

    # =====================================
    # Template Cleanup
    # =====================================

    - name: Clean up for template creation
      when: cleanup_template
      block:
        - name: Stop services that shouldn't run in template
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: stopped
          loop:
            - docker
            - portainer-agent
          failed_when: false

        - name: Clear package cache
          ansible.builtin.apt:
            autoclean: true
            autoremove: true

        - name: Clear bash history for all users
          ansible.builtin.shell: |
            find /home -name ".bash_history" -delete
            find /root -name ".bash_history" -delete
            history -c
          failed_when: false
          changed_when: false

        - name: Clear temporary files and logs
          ansible.builtin.shell: |
            find /var/log -type f -name "*.log" -exec truncate -s 0 {} \;
            find /var/log -type f -name "*.log.*" -delete
            rm -rf /tmp/*
            rm -rf /var/tmp/*
            rm -rf /var/cache/apt/archives/*.deb
          failed_when: false
          changed_when: false

        - name: Clear SSH host keys (will be regenerated on first boot)
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/ssh/ssh_host_rsa_key
            - /etc/ssh/ssh_host_rsa_key.pub
            - /etc/ssh/ssh_host_ecdsa_key
            - /etc/ssh/ssh_host_ecdsa_key.pub
            - /etc/ssh/ssh_host_ed25519_key
            - /etc/ssh/ssh_host_ed25519_key.pub

        - name: Clear machine-id (will be regenerated)
          ansible.builtin.shell: |
            truncate -s 0 /etc/machine-id
            rm -f /var/lib/dbus/machine-id
          failed_when: false
          changed_when: false

- name: Convert container to template and package
  hosts: proxmox_production
  become: true
  gather_facts: false
  vars_files:
    - ../group_vars/proxmox.yml
    - ../group_vars/proxmox_production.yml

  vars:
    template_id: "{{ debian_template.container_id | default(900) }}"
    clone_id: "{{ debian_template.clone_id | default(800) }}"
    clone_hostname: "{{ debian_template.clone_hostname | default('debian-template-clone') }}"
    base_template: "{{ debian_template.base_template | default('local:vztmpl/debian-13-standard_13.0-1_amd64.tar.zst') }}"
    base_template_file: "{{ base_template | regex_replace('^local:vztmpl/', '') }}"
    debian_template_version: "{{ (base_template_file.split('_') | length > 1) | ternary(base_template_file.split('_')[1], '13') }}"
    final_template_filename: "{{ debian_template.final_filename | default('debian-' ~ debian_template_version ~ '-docker-template.tar.gz') }}"
    template_dumpdir: "{{ debian_template.dumpdir | default('/var/lib/vz/template/cache') }}"

  pre_tasks:
    - name: Skip template conversion and packaging in check mode
      ansible.builtin.meta: end_play
      when: ansible_check_mode

    - name: Gather facts for conversion and packaging
      ansible.builtin.setup:

  tasks:
    - name: Stop the container
      ansible.builtin.command: pct stop {{ template_id }}
      failed_when: false
      changed_when: false

    - name: Convert container to template
      ansible.builtin.command: pct template {{ template_id }}
      changed_when: true
    - name: Display template creation success
      ansible.builtin.debug:
        msg: |
          LXC template created successfully!
          Template ID: {{ template_id }}

          To create new containers from this template:
          pct clone {{ template_id }} <new_container_id> --hostname <new_hostname>

    # =====================================
    # Package Template for Distribution
    # =====================================

    - name: Ensure dump directory exists
      ansible.builtin.file:
        path: "{{ template_dumpdir }}"
        state: directory
        mode: "0700"

    - name: Create linked clone for packaging
      ansible.builtin.command: "pct clone {{ template_id }} {{ clone_id }} --hostname {{ clone_hostname }} --full 0"
      args:
        creates: "/etc/pve/lxc/{{ clone_id }}.conf"

    - name: Remove network interface from clone
      ansible.builtin.command: "pct set {{ clone_id }} -delete net0"
      register: del_net
      changed_when: del_net.rc == 0
      failed_when: false

    - name: Fallback network removal for older pct versions
      ansible.builtin.command: "pct set {{ clone_id }} -net0 none"
      when: del_net.rc != 0
      failed_when: false
      changed_when: false

    - name: Create vzdump archive
      ansible.builtin.command: "vzdump {{ clone_id }} --mode stop --compress gzip --dumpdir {{ template_dumpdir }}"
      register: vzdump_run
      changed_when: true

    - name: Parse vzdump output for archive path
      ansible.builtin.set_fact:
        vzdump_output: "{{ (vzdump_run.stdout | default('')) ~ '\n' ~ (vzdump_run.stderr | default('')) }}"

    - name: Extract archive path from vzdump output
      ansible.builtin.set_fact:
        vzdump_archive_path: >-
          {{ vzdump_output.splitlines()
             | select('search', 'creating vzdump archive ')
             | list | first
             | regex_replace(".*creating vzdump archive '", '')
             | regex_replace("'.*", '') }}

    - name: Backup existing template file if present
      ansible.builtin.shell: |
        if [ -f "{{ template_dumpdir }}/{{ final_template_filename }}" ]; then
          ts=$(date +%Y%m%d-%H%M%S)
          mv "{{ template_dumpdir }}/{{ final_template_filename }}" "{{ template_dumpdir }}/{{ final_template_filename }}.bak.$ts"
        fi
      changed_when: false

    - name: Rename vzdump archive to final template name
      ansible.builtin.command: "mv {{ vzdump_archive_path }} {{ template_dumpdir }}/{{ final_template_filename }}"
      changed_when: true
    - name: Set correct permissions on template archive
      ansible.builtin.file:
        path: "{{ template_dumpdir }}/{{ final_template_filename }}"
        mode: "0640"

    - name: Clean up temporary clone
      ansible.builtin.command: "pct destroy {{ clone_id }} --purge 1"
      register: destroy_clone
      failed_when: destroy_clone.rc not in [0, 2]
      changed_when: destroy_clone.rc == 0

    - name: Clean up template container (optional)
      ansible.builtin.command: "pct destroy {{ template_id }} --purge 1"
      register: destroy_template
      failed_when: destroy_template.rc not in [0, 2]
      changed_when: destroy_template.rc == 0
      when: debian_template.remove_template_after_packaging | default(false)

    - name: Display packaging results
      ansible.builtin.debug:
        msg: |
          ===============================================
          TEMPLATE PACKAGING COMPLETED
          ===============================================
          Template archive: {{ template_dumpdir }}/{{ final_template_filename }}
          Template ID: {{ template_id }} {{ '(destroyed)' if debian_template.remove_template_after_packaging | default(false) else '(preserved)' }}

          To use the packaged template:
          1. Copy to other Proxmox nodes: {{ template_dumpdir }}/{{ final_template_filename }}
          2. Extract and create containers:
             pct restore <new_id> {{ final_template_filename }} --storage <storage_pool>

          Or use the template directly:
             pct clone {{ template_id }} <new_id> --hostname <hostname>
          ===============================================
